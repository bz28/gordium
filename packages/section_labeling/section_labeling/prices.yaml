# US dollars per million tokens, for the cost estimate and run records.
# SOURCE: Anthropic's published Claude API rates as listed in the claude-api reference bundled with
# Claude Code (model table cached 2026-10-06), with prompt-caching rates of 1.25x input for a 5-minute
# cache write and 0.1x input for a cache read (0.05x on Opus 5.5, as that reference states).
# BEN: confirm these against https://platform.claude.com/docs/en/about-claude/pricing before a real run;
# prices change. Haiku 5.5's rate here is for prompts up to 100K tokens (every piece is far below that).
claude-haiku-5-5:
  input: 0.10
  cache_write: 0.125
  cache_read: 0.01
  output: 0.50
claude-sonnet-5-5:
  input: 2.00
  cache_write: 2.50
  cache_read: 0.20
  output: 10.00
claude-opus-5-5:
  input: 4.00
  cache_write: 5.00
  cache_read: 0.20
  output: 20.00
