# Which drafted rules answer the same question as each hand-written rule (the answer keys), reviewed by hand
# from the law (2026-10-21), rule by rule. Generated once from the old citation heuristic, then checked; frozen:
# tests/test_eval.py fails when a hand or drafted rule isn't here, so new drafts or keys force a new review.
#   judge: units of rules that together answer the question; each unit (its flags one by one) and the parts
#          are compared with the hand rule on designs with every input filled in (tests/test_eval.py)
#   parts: pieces of an exception (§325-16C), compared with the hand rule as their own group
#   judge: [] means nothing drafted answers it (counted undrafted), with the reason
#   not_same: a drafted rule on the same chart cell that answers a different question, with the reason
#   same_measures: a drafted measure that is the hand key's measure under another name (given one value)
#   unmatched / general_unmatched: drafted rules no key question asks, with the reason
#   known_false_passes: the real drafted false passes the grader finds, with their cause, until re-drafted
keys:
  R-1b.yaml:
    district: R-1b
    rules:
      R-1b.use:
        judge:
        - - R-1b.use
        reason: 'the chart''s permitted-use marks (p.2) for this district: the same question'
      R-1b.lot_area_one_family_detached:
        judge:
        - - R-1b.min_lot_size_detached
        reason: 'the chart''s lot area row for this use, in each form its cells take (a footnoted form drafted as a flag needs
          review): the same question'
      R-1b.lot_area_other_use:
        judge:
        - - R-1b.min_lot_size_other_use
        reason: 'the chart''s lot area row for this use, in each form its cells take (a footnoted form drafted as a flag needs
          review): the same question'
      R-1b.lot_width_one_family_detached:
        judge:
        - - R-1b.min_lot_width_one_family_detached
        reason: 'the chart''s lot width row for this use: the same question'
      R-1b.lot_width_other_use:
        judge:
        - - R-1b.min_lot_width_other_use
        reason: 'the chart''s lot width row for this use: the same question'
      R-1b.stories:
        judge:
        - - R-1b.max_stories
        - - R-1b.325_16c_height_exception_stories_not_exceeded
        reason: the chart's stories row, and §325-16C(2)'s 'stories may not be exceeded' (the same limit)
      R-1b.height:
        judge:
        - - R-1b.max_height_ft
        - - R-1b.325_16c_height_exception_extra_height
        parts: []
        reason: the chart's height row, and §325-16C's extra height drafted as one rule relaxing it (2026-10-25), judged on
          its own so a condition it leaves out shows
      R-1b.lot_coverage:
        judge:
        - - R-1b.max_lot_coverage
        reason: 'the chart''s lot coverage row (R-2c: one rule per group of uses, judged together)'
      R-1b.front_yard:
        judge:
        - - R-1b.front_yard_min
        reason: 'the chart''s front yard row: the same question'
      R-1b.side_yards:
        judge:
        - - R-1b.side_yard_one_side_min
          - R-1b.side_yard_other_side_min
        reason: 'the chart''s two side-yard rows, each a half of the question: judged together'
      R-1b.rear_yard:
        judge:
        - - R-1b.rear_yard_min_fn16
        reason: 'the chart''s rear yard row: the same question'
      R-1b.yard_projections:
        judge:
        - - R-1b.325_18b_projection_front_yard
          - R-1b.325_18b_projection_side_yard_larger
          - R-1b.325_18b_projection_side_yard_smaller
          - R-1b.325_18b_projection_rear_yard_fn16
        reason: '§325-18B: eaves up to 2 ft into each required yard, drafted yard by yard on the eave measures (2026-10-25):
          the same question, judged together'
      R-1b.accessory_buildings:
        judge:
        - - R-1b.325_25a_accessory_not_in_required_front_yard
          - general.325_25c_frame_accessory_side_setback_r1
          - general.325_25c_frame_accessory_rear_setback
        reason: '§325-25A (not in the required front yard) and §325-25C (side and rear distances): judged together'
      R-1b.parking_one_family:
        judge:
        - - R-1b.parking_per_dwelling_unit
        reason: the chart's residential parking by bedrooms
      R-1b.parking_other_uses:
        judge:
        - - R-1b.parking_per_dwelling_unit
          - R-1b.parking_per_dwelling_unit_undecided_uses
        reason: 'the chart sends other uses to §325-20; the draft''s bedroom rule is limited to one-family houses, so for
          other uses it doesn''t apply: compared, so a ''doesn''t apply'' where the key asks for review counts'
    unmatched:
      R-1b.325_8b_one_family_detached_area_per_primary_building: '§325-8B(1): the lot area for each additional primary building;
        no key rule asks it'
      R-1b.325_19c_corner_lot_street_yards: '§325-19C: corner lots'' second street yard; the keys have no corner-lot rule'
