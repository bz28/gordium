    of its own, R315.1 and R319.1). The key also flags each loft, so a person checks that its room was labeled; the drafts
    don''t, so a house with a marked loft whose room isn''t labeled passes on its other rooms though R319.1''s opening for
    the loft''s room was never checked. The loft is evidence of that room: missing data, which must give needs review.'
  fixed: A flag added for each sleeping loft, so a person checks that the room it is open to was labeled and its opening
    checked (a rule added whole after the AI's draft).
  law: 'R319.1: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have
    not less than one operable emergency escape and rescue opening."'
  cases:
  - R319.1/key/general.r319_1_room_a_loft_opens_to#1/l1
- cause: r319_4_1_ladder_review_too_wide
  verdict: draft_wrong
  false_pass_risk: true
  rules:
  - general.r319_4_1_area_well_min_projection
  - general.r319_4_1_area_well_min_width
  why: 'The ladder may encroach at most 6 in into the area well''s required dimensions, so a 24 in projection fails even
    with a ladder (30 in is the least). The drafts need review for any well with a ladder under 36 in; the key fails under
    30 in and needs review from 30 to 36 in. Needs review where the law fails: weaker, never a pass.'
  fixed: 'A well with a ladder fails under 30 in and needs review from 30 in up (how far the ladder reaches into it isn''t
    measured). Found while fixing (round 5): the AI''s review also passed a well of 36 in or more with a ladder, which may
    reach more than 6 in into it, a false pass on missing data that the full-opening flag had hidden; so this cause is now
    marked a false-pass risk.'
  law: 'R319.4.1 exception: "The ladder or steps required by Section R319.4.2 shall be permitted to encroach not more than
    6 inches (152 mm) into the required dimensions of the area well."'
  cases:
