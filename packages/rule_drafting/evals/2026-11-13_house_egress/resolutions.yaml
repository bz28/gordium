  verdict: draft_wrong
  false_pass_risk: false
  rules:
  - general.r319_1_sleeping_room_escape_opening_operable
  why: The drafts make a sleeping room with no marked escape opening need review; Gordium's decision (Ben, 2026-11-12, for
    the architects to confirm) is that it fails, as the key does. Exception 3 (a sprinklered house's basement bedrooms)
    is the case review would catch; it is the architect's to claim.
  fixed: 'A sleeping room with no marked escape opening fails (when_none: fail).'
  law: 'R319.1: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have
    not less than one operable emergency escape and rescue opening."'
  cases:
  - R319.1/draft/general.r319_1_sleeping_room_escape_opening_operable#3/none in r1
  - R319.1/key/general.r319_1_sleeping_room_escape_opening#4/none in br2
- cause: r319_4_1_full_opening_flag
  verdict: draft_wrong
  false_pass_risk: false
  rules:
  - general.r319_4_1_area_well_allows_full_opening
  why: 'The drafts flag "the area well lets the opening fully open" on every below-grade opening, though the measure opening_fully_openable
    exists: every such opening needs review (stricter where the key passes), and one that can''t fully open is not failed
    (weaker where the key fails). Never a pass. (Where a drafts'' example leaves opening_fully_openable out, the comparison
    reads it as no, as it does every left-out yes/no: book_eval.completed.)'
  fixed: >-
    The flag is a rule on opening_fully_openable: an opening that can't fully open fails, one that can passes. The
    measure's meaning now says it is the opening as installed, nothing outside it (an area well wall, a deck, a porch)
    stopping it (review round 5: read as the window's own hardware, a sash blocked by the well wall would pass).
  law: 'R319.4.1: "The size of the area well shall allow the emergency escape and rescue opening to be fully opened."'
  cases:
