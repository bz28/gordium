causes:
  r318_2_readily_openable_flag:
    verdict: drafts_stricter
    why: >-
      The drafts flag every egress door for "readily openable from inside without a key", so every house needs
      review. That is hardware, which a design model doesn't show; the key leaves it out. Neither passes it.
    law: 'R318.2: "Egress doors shall be readily openable from inside the dwelling unit without the use of a key or special knowledge or effort."'
  bf103_2_every_exit_door:
    verdict: drafts_stricter
    why: >-
      The drafts flag every exit door for BF103.2's second sentence (a patio cover an exit opens into must have R318
      exits unless unenclosed). No measure says whether an exit door opens into a patio cover, so every house needs
      review; and where an example names no exit door at all, the flag's kind is unread, so the building needs review.
      The key drafts only the first sentence (escape openings), where opening_into_patio_cover exists. A measure for
      exit doors is a to-do.
    law: 'BF103.2: "Where such exterior openings serve as an exit from the dwelling unit, the patio structure, unless unenclosed, shall be provided with exits conforming to the provisions of Section R318."'
  bf103_2_open_patio_cover:
    verdict: drafts_stricter
    why: >-
      An escape opening into a patio cover whose wall openings hold nothing (patio_cover_openings_open) is into an
      unenclosed structure: the law asks no more (key: not applicable). The drafts' flag ignores that measure and
      needs review. The open question (does screening make it enclosed) only arises when something fills them.
    law: 'BF103.2: "Exterior openings required for light and ventilation into a patio structure conforming to Section BF101 shall be unenclosed where such openings serve as emergency egress or rescue openings from sleeping rooms."'
  r319_4_1_reach_not_in_the_example:
    verdict: drafts_stricter
    why: >-
      The key's example passes a 12 sq ft, 36 by 48 in well with no ladder and says nothing of what else reaches into
      it. The drafts' size rules now read how far anything other than the required ladder or steps reaches into the
      well's required dimensions (area_well_other_encroachment, and the ladder's or steps' own reach), stated in Revit
      by the window's Gordium: Well marks; not stated, the well needs review. Needs review only, never a fail: the
      key's example has no measure for the reaches.
    law: 'R319.4.1: "Exception: The ladder or steps required by Section R319.4.2 shall be permitted to encroach not more than 6 inches (152 mm) into the required dimensions of the area well."'
  loft_stair_may_follow_r318_7:
    verdict: drafts_stricter
    why: >-
      A sleeping loft's stair "shall be permitted to comply" with R315.5.2.1 to R315.5.2.3: a choice, so it may meet
      either those or R318.7's ordinary limits. The key leaves loft stairs out of R318.7.5's tread depth and riser
      height and, under R318.7.2, makes a loft stair below 6 ft 8 in need review. The drafts make every loft stair
      need review under R318.7.2 and R318.7.5 (and flag R315.5.2.2's formula on every loft stair): needs review
      only, never a fail. Kept as a known difference. (Where the drafts failed a loft stair the law allows, under
      R318.7.1's widths and R315.5.2.2's risers alone, they were fixed: draft_fixes.)
    law: 'R315.5.2: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."'
  missing_input_in_the_example:
    verdict: both_follow_the_law
    why: >-
      The example leaves out a measure one side's rule reads: the side whose rule needs it gives needs review, the
      other a definite answer that the law supports (a 35.5 in stair width fails R318.7.1 whatever the width at the
      handrail; a door under 32 in wide or 78 in high, or not side-hinged, fails R318.2 whatever the number of
      dwelling units, which the key's door rule reads and the drafts' single-feature door examples don't give).
    law: 'R318.7.1: "Stairways shall be not less than 36 inches (914 mm) in clear width at all points above the permitted handrail height"; R318.2: "The egress door shall be side-hinged, and shall provide a clear width of not less than 32 inches (813 mm) ..."'
  r318_7_2_floor_opening_flag:
    verdict: drafts_stricter
    why: >-
      Exception 1 lets a floor opening the nosings extend under project up to 4 3/4 in into the headroom. The drafts
      flag it on a measure they propose (stair_nosings_under_floor_opening) that no model gives yet, so every stair
      needs review; the key has no rule for it and fails any headroom under 6 ft 8 in (a stair the exception may
      allow: stricter than the law there). Neither passes a stair the law fails. A measure for the exception is a
      to-do.
    law: 'R318.7.2 exception 1: "Where the nosings of treads at the side of a flight extend under the edge of a floor opening through which the stair passes, the floor opening shall not project horizontally into the required headroom more than 4 3/4 inches (121 mm)."'
  opening_examples_without_a_room:
    verdict: both_follow_the_law
    why: >-
      The drafts check "opens to a yard or public way" on every marked escape opening wherever it sits; the key
      checks it on the openings within each room R319.1 names. The drafts' examples give an opening in no room,
      which the key's rows read as unplaced (needs review). A marked escape opening always sits in a room, where the
      two give the same answer.
    law: 'R319.1: "Emergency escape and rescue openings shall open directly into a public way, or to a yard or court that opens to a public way."'
  pass_or_not_applicable:
    verdict: both_follow_the_law
    why: >-
      A 44 in deep area well needs no ladder: the key says pass (its check holds), the drafts not applicable (their
      applies_when is "deeper than 44 in"). The same answer in law.
    law: 'R319.4.2: "Area wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with ... ladder or steps."'
  handrail_examples_without_a_stair:
    verdict: both_follow_the_law
    why: >-
      The key's handrail rules group handrails by the stair they sit in (parts.yaml: a handrail sits within a stair);
      the drafts check every handrail. The drafts' examples give handrails with no stair, which the key's rows read as
      unplaced (needs review), and the key's examples give a stair with no handrail, a "none" row the drafts don't
      have. On a model where each handrail sits in its stair, both give the same answers.
    law: 'R320.2: "Handrail height ... shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm)"; R320.4: "Handrails adjacent to a wall shall have a space of not less than 1 1/2 inches (38 mm) between the wall and the handrails."'
  yes_no_left_out:
    verdict: both_follow_the_law
    why: >-
      An example written for one side's rules leaves out a yes/no the other side's rules read, which the
      comparison takes as no (book_eval.completed): an inside landing not given (R318.3.2), treads not said to
      be identical (R318.7.11.1), a handrail not said to be continuous (R320.5). The other side then fails or
      needs review for that, not for the law; with the yes/no given, both give the same answer.
    law: 'R318.3.2: "Exterior doors other than the required egress door shall be provided with landings or floors not more than 8 1/4 inches (209 mm) below the top of the threshold."; R318.7.11.1: "Treads shall be identical"; R320.5: "Handrails shall be continuous for the full length of the flight"'
  handrail_examples_without_a_stair_or_ramp:
    verdict: both_follow_the_law
    why: >-
      The key's R320.5 continuity rules group handrails by the stair or the ramp they sit in (a ramp's handrail
      is required only on a steep ramp, so it is a flag); an example that gives no ramps (or no stairs) is read
      by the key as those parts not read, a needs-review row for the building, and a stair or ramp with no
      handrail as a "none" row the drafts don't have. On a model where each handrail sits in its stair or ramp,
      both give the same answers but one: a ramp's handrail broken at a newel post at a ramp landing, which the
      drafts pass (R320.5's exception 1, "at a landing", read as reaching a ramp's landings) and the key's ramp flag
      sends to a person. Neither passes what the law clearly fails; the reading is open for the architects.
    law: 'R320.5: "Handrails shall be continuous for the full length of the flight ... Handrails where required for ramps shall be continuous for the full length of the ramp."'
  r318_7_5_1_riser_slope_flag:
    verdict: drafts_stricter
    why: >-
      The drafts flag every stair for R318.7.5.1's riser slope (vertical, or sloped not more than 30 degrees),
      which no measure gives; the key doesn't check it. Shown now that a spiral stair's riser height is
      R318.7.11.1's: the key passes the riser rules where the drafts' flag needs review. Never a pass by either.
    law: 'R318.7.5.1: "Risers shall be vertical or sloped from the underside of the nosing of the tread above at an angle not more than 30 degrees (0.51 rad) from the vertical."'
  r318_7_11_2_exemption_only:
    verdict: both_follow_the_law
    why: >-
      R318.7.11.2 only exempts some bulkhead stairs from R318.3 and R318.7. The AI drafted no rule for it
      (nothing to check); the key flags a bulkhead stair whose cover isn't hinged doors ("or other approved
      means": a judgment), and leaves an exempt one out of its new stair rules. In the drafts such a stair stays
      under R318.7's rules, which it passes or fails on their numbers: stricter where it is exempt, never a pass
      the law fails. (The older stair rules on both sides don't read the exemption yet: the decision record's
      "Not yet".)
    law: 'R318.7.11.2: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."'
