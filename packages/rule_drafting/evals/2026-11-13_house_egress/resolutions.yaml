# Every disagreement between the AI drafts and the hand answer key (comparison.md), resolved by reading the law.
# causes: one entry per cause. verdict:
#   draft_wrong          the drafts' answer is not the law's; false_pass_risk says whether it could pass what the law fails
#   drafts_stricter      the drafts fail or need review where the law gives a definite pass or "not applicable"; never a false pass
#   key_stricter         the key fails or needs review where the law may allow it; never a false pass
#   both_follow_the_law  the difference comes from the example (a measure or part it leaves out) or from how a case
#                        nothing applies to is reported (pass or not applicable), not from the law
# ids: each disagreement's id (comparison.md): its cause.
# Fixes to the key made after the comparison (each recorded in the key's notes): key_fixes.
# Fixes to the drafts made after the comparison (review round 5): draft_fixes, one per cause fixed (a cause fixed only
# in part keeps its rest in causes), each with the rules it
# changed (each change recorded in the rule's `revised`; the AI's own rules are in drafted/records/as_drafted/) and
# the disagreements it settled (cases). A test runs those cases on the drafts and on the AI's own rules: the fixed
# drafts agree with the key on every one, the AI's own rules don't (tests/test_house_egress_key.py).
# Every draft_wrong cause is fixed, and every drafts_stricter cause left gives needs review only, never a fail the
# law doesn't (a known difference from the law, kept; the same test holds this).
key_fixes:
  - rule: general.r315_5_2_2_loft_stair_risers
    what: >-
      A loft stair outside R315.5.2.2's risers but within R318.7.5's passed, so a 20 in wide stair (R315.5.2.1's
      width) with 6 1/2 in risers (R318.7.5's) passed on a mix of the two sets, which neither reading of the law
      clearly allows. It now needs review. Found by review round 3. Open question for the architects: may a loft
      stair take some limits from R315.5.2 and others from R318.7?
    law: 'R315.5.2: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."; R315.5: "The means of egress shall comply with Section R318 as modified by Sections R315.5.1 through R315.5.3."'
  - rule: general.r315_5_2_2_loft_stair_formula
    what: >-
      The formula flag was not applicable to a loft stair meeting R318.7.5's riser and tread, even where its width met
      only R315.5.2.1's (17 in): a mix of the two sets passed. It now applies unless the stair meets R318.7 whole,
      width included. Found by review round 4.
    law: 'R315.5.2: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."'
  - rule: general.r318_2_egress_door
    what: >-
      "One egress door for each dwelling unit" was a flag with applies_when "dwelling_units - 1 > 0", which the
      tightened number check (a number in arithmetic keeps its direction) reads as a limit on units the law never
      sets. It is now the door rule's review_when "dwelling_units > 1" (checked by value only): two units need review.
    law: 'R318.2: "Not less than one egress door shall be provided for each dwelling unit."'
  - rule: general.r318_7_5_1_riser_height
    what: >-
      Spiral stairs were not applicable to the riser height, tread depth, width and headroom rules (R318.7.11.1 sets
      their own), but R318.7.11.1 isn't drafted, so nothing checked them. They now need review in each of those
      rules (r318_7_1_stair_width, r318_7_2_stair_headroom, r318_7_5_1_riser_height, r318_7_5_2_tread_depth) until
      it is. Found by the first review round.
    law: 'R318.7.11: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."'
  - rule: general.r319_1_loft_room_escape_opening
    what: >-
      The key had only a flag on each sleeping loft for "the room to which a sleeping loft is open", because no part
      was that room. parts.yaml now has loft_room (an escape opening may sit within it), and the key checks its
      escape opening like a bedroom's (none marked: fail); the loft flag stays, so a person checks the room was
      labeled.
    law: 'R319.1: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have not less than one operable emergency escape and rescue opening."'
  - rule: general.r315_5_2_2_loft_stair_risers
    what: >-
      The key tested the tallest riser (stair_riser_height, parts.yaml) against R315.5.2.2's 7 in minimum, so a loft
      stair with one short riser could pass. It now tests the shortest (tallest minus stair_riser_variation); the
      drafts had this right. A new worked example pins it (tallest 9 in, shortest 6 1/2 in: fail).
    law: 'R315.5.2.2: "Risers for stairs providing egress from a sleeping loft shall be not less than 7 inches (178 mm) and not more than 12 inches (305 mm) in height."'
  - rule: parts.yaml opening_opens_to_yard
    what: >-
      The key's R319.1 note says exception 4 (a yard reaching the public way by a path at least 36 in wide) is part of
      what the architect answers in opening_opens_to_yard, but the measure's meaning didn't say so. The meaning now
      does, so the key's fail for an opening to nowhere is the law's.
    law: 'R319.1 exception 4: "A yard shall not be required to open directly into a public way where the yard opens to an unobstructed path from the yard to the public way. Such path shall have a width of not less than 36 inches (914 mm)."'
  - rule: general.r321_1_2_guard_height
    what: >-
      A guard top that serves as the stair's handrail was checked only where the drop is more than 30 in (a required
      guard), so a 42 in guard-top handrail on a 24 in drop passed, no handrail part being modeled for it. It is the
      stair's handrail: R320.2's 34 to 38 in now holds for it at any drop. Found by review round 6 (in the drafts'
      round-5 fix, the same gap). A top whose least height is within 34 to 38 in but that rises above 38 in somewhere
      (a fitting, R320.2 exception 2) needs review, not a fail: on a drop of 30 in or less (review round 7), and on a
      required guard too, as which of R320.2 exception 2 and R321.1.2 exception 2 governs at a fitting is open
      (review round 8).
    law: 'R320.2: "Handrail height ... shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm)."'
  - rule: general.r318_7_1_stair_width
    what: >-
      A spiral stairway needed review here until R318.7.11.1 was drafted (2026-11-13). It is now drafted
      (general.r318_7_11_1_*, 2026-11-14), so a spiral stair is left out of this rule (not applicable): R318.7.1
      exception (width) sends it to R318.7.11.1, whose rules check it.
    law: 'R318.7.11: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."'
  - rule: general.r318_7_2_stair_headroom
    what: >-
      A spiral stairway needed review here until R318.7.11.1 was drafted (2026-11-13). It is now drafted
      (general.r318_7_11_1_*, 2026-11-14), so a spiral stair is left out of this rule (not applicable): R318.7.2
      exception 2 (headroom) sends it to R318.7.11.1, whose rules check it.
    law: 'R318.7.11: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."'
  - rule: general.r318_7_5_1_riser_height
    what: >-
      A spiral stairway needed review here until R318.7.11.1 was drafted (2026-11-13). It is now drafted
      (general.r318_7_11_1_*, 2026-11-14), so a spiral stair is left out of this rule (not applicable):
      R318.7.5.1 exception 2 (riser height) sends it to R318.7.11.1, whose rules check it.
    law: 'R318.7.11: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."'
  - rule: general.r318_7_5_2_tread_depth
    what: >-
      A spiral stairway needed review here until R318.7.11.1 was drafted (2026-11-13). It is now drafted
      (general.r318_7_11_1_*, 2026-11-14), so a spiral stair is left out of this rule (not applicable):
      R318.7.11 (tread) sends it to R318.7.11.1, whose rules check it.
    law: 'R318.7.11: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."'
  - rule: general.r320_2_ramp_handrail_height
    what: >-
      Added (review round 1, 2026-11-15): handrails may now sit within a ramp, and the key's R320.2 rule reads only
      handrails within a stair, so a ramp's handrail was checked by nothing in the key (a 30 in rail: not applicable).
    law: 'R320.2: "Handrail height, measured vertically from the sloped plane adjoining the tread nosing, or finish surface of ramp slope, shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm)."'
  - rule: general.r320_4_ramp_handrail_wall_clearance
    what: >-
      Added (review round 1), as for R320.2: the key's R320.4 rule reads only handrails within a stair.
    law: 'R320.4: "Handrails adjacent to a wall shall have a space of not less than 1 1/2 inches (38 mm) between the wall and the handrails."'
  - rule: general.r318_7_6_landing_width
    what: >-
      A top landing on the other side of a door at the top (exception 1) was skipped; it is still the top landing, so
      its width is checked (review round 1).
    law: 'R318.7.6 exception 1: "The top landing of an interior stairway, including those in an enclosed garage, shall be permitted to be on the other side of a door located at the top of the stairway, provided that the door does not swing over the stairs."'
  - rule: general.r318_7_6_garage_top_landing
    what: >-
      A top landing below the threshold of a top door elsewhere than at a garage was not applicable, a pass on a
      question the law leaves open; it now needs review, a landing level with the threshold passes (review round 1).
    law: 'R318.7.6 exception 2: "At an enclosed garage, the top landing at the stair shall be permitted to be not more than 8 1/4 inches (209 mm) below the top of the threshold."'
  - rule: general.r318_3_1_egress_door_given_as_exterior_door
    what: >-
      Added (review round 2): an egress door the model does not also give as a marked exterior door had its landings
      and drops unchecked; it now needs review.
    law: 'R318.3.1: "Landings or finished floors at the required egress door shall be not more than 1 1/2 inches (38 mm) lower than the top of the threshold."'
  - rule: general.r320_5_handrail_returns
    what: >-
      A rail on an open side returned toward a wall was not held to the 1/4 in gap; handrail_returns_to_wall now reads
      it (review round 2).
    law: 'R320.5: "Handrail returns shall not form a gap more than 1/4 inch (6.4 mm) from the adjacent wall."'
draft_fixes:
- cause: r318_2_doors_counted
  verdict: draft_wrong
  false_pass_risk: true
  rules:
  - general.r318_2_egress_door_per_dwelling_unit
  why: The drafts check "one egress door for each dwelling unit" by counting the lot's egress doors against its dwelling
    units (a proposed building measure, egress_doors). A two-family house whose two marked doors both serve one unit would
    pass. The key checks every marked door, fails a house with none marked, and makes a house with more than one unit need
    review (which door serves which unit isn't in the model). Most of these rows are the drafts' count rule needing review
    because the examples don't give egress_doors.
  fixed: Each marked egress door is checked as the door R318.2 describes (side-hinged, 32 in wide, 78 in high); a house
    with none marked fails; more than one dwelling unit needs review (which door serves which unit isn't in the model).
    The count against dwelling units is gone, and with it the proposed measure egress_doors.
  law: 'R318.2: "Not less than one egress door shall be provided for each dwelling unit."'
  cases:
