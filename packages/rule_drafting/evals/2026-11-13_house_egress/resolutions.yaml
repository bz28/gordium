  - R319.4.1/draft/general.r319_4_1_area_well_min_projection#1/o1
  - R319.4.1/draft/general.r319_4_1_area_well_min_projection#3/o1
  - R319.4.1/draft/general.r319_4_1_area_well_min_width#1/o1
  - R319.4.1/draft/general.r319_4_1_area_well_min_width#3/o1
  - R319.4.1/key/general.r319_4_1_area_well_size#1/w1
