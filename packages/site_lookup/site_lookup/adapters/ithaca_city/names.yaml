# How the City's live layers write a district or a street, matched to how Gordium writes it. Exact tables only,
# kept by hand: a name is matched character for character, never by likeness. Each entry is a name only (no
# geometry, no other attribute of the City's layers, which may not be stored); each says where it was seen.

districts:
  # The residential districts as the zoning chart's columns, and Gordium's rulebook files, write them
  # (5_zoning_rules/<district>.yaml; chart p.3). A City zoning-map code that is one of these, or an alias below, is
  # used as that district; any other code (another district, or a code Gordium doesn't know) is shown as the map
  # gives it and needs review.
  residential: [R-1a, R-1b, R-2a, R-2b, R-2c, R-3a, R-3aa, R-3b, RU]
  # The commercial districts that have a rulebook, as the commercial chart's columns (p.5) and the rulebook files
  # write them; the City's map writes them the same way (looked up 2026-11-22). Not here: B-2b (on the map and in
  # §325-4, but in no chart column) and the special-purpose, waterfront, West End, Southwest and Collegetown districts
  # (no rulebook yet): shown as the map gives them, needs review (docs/decisions/2026-11-22_commercial_districts.md).
  commercial: [B-1a, B-1b, B-2a, B-2d, B-4, B-5]
  # The central business districts, as the chart's one CBD column names them ("CBD-50, -60, -85, -100, -120, -140",
  # p.4 and p.5) and the City's map writes them (its distinct CBD codes, looked up 2026-11-23)
  # (docs/decisions/2026-11-23_central_business_districts.md).
  central_business: [CBD-50, CBD-60, CBD-85, CBD-100, CBD-120, CBD-140]
  # A code the City's map gives that no chart column, no §325-4 entry and no rulebook has: never read as a nearby
  # district (CBD-52 isn't CBD-50, nor a 52 ft CBD), always needs review with why (an open question for the City).
  unresolved:
    CBD-52:
      why: >-
        The City's online zoning map codes six blocks of West State Street (the 300 and 400 blocks, N Meadow St to
        N Albany St) CBD-52, looked up 2026-11-23. CBD-52 is in neither Chapter 325's list of districts (§325-4, p.22)
        nor the zoning charts (April 2026, p.4-5: "CBD-50, -60, -85, -100, -120, -140"), and the printed zoning map
        (May 2026, p.5) has no CBD-52 in its legend. A 2019 proposal would have zoned these blocks CBD-52 (a 2019 news
        report); whether it was adopted, and what its rules are, is an open question for the City zoning office
        (docs/questions_for_architects.md §5.30). Gordium has no rules for it: choose the district with the City.
  aliases:
    R-U:
      district: RU
      why: >-
        §325-4 lists the district as "R-U Residential" (Chapter 325, p.22 line 20), and the City's zoning map writes
        R-U (614 University Ave, looked up 2026-10-27); the zoning chart's column, and Gordium's rulebook, write RU.
  # Overlays the City's zoning map draws on top of the base districts. One found on the lot (2%+ of it) goes to the
  # overlays row, which needs review (overlays aren't checked in this release); it is never taken for the district.
  overlays:
    SHOD: >-
      South Hill Overlay District: §325-4 (Chapter 325, p.23 line 12); its restrictions, §325-8E(1) (p.29 lines
      30-36), bar a second primary structure on R-1 and R-2 parcels in it
    SLAUOZ: >-
      Mandatory Street Level Active Use Overlay Zone (Chapter 325, p.29 lines 8-13)
    Adult Us: >-
      Adult Use Overlay Zone: §325-29.1D(1) (Chapter 325, p.76 line 8)

roads:
  # The City's road layer (NAME) → the street as an address on it is written, before Gordium's usual
  # abbreviation (sources.normalize_street). Seen in the layer's names on 2026-10-27. A name not listed is used as
  # the layer writes it: an address on a street the lot "doesn't touch" then needs review, as before.
  # State Street is also Martin Luther King Jr Street; its addresses are written on State St (an address written
  # on Martin Luther King Jr St still needs review).
  "E STATE ST / M.L.K. JR ST": E STATE ST
  "W STATE ST/ M. L. K. JR ST": W STATE ST
  "W STATE ST/ M. L. K. JR ST BRIDGE": W STATE ST
  "W BUFFALO ST BRIDGE": W BUFFALO ST
  # One direction of a divided street: the same street
  "CAMPUS RD NB LANE": CAMPUS RD
  "CAMPUS RD SB LANE": CAMPUS RD
  "DRYDEN RD EB LANE": DRYDEN RD
  "KLINE RD NB LANE": KLINE RD
  "KLINE RD SB LANE": KLINE RD
  "N MEADOW ST NB": N MEADOW ST
  "N MEADOW ST SB": N MEADOW ST
  "OAK AVE EB LANE": OAK AVE
  "OAK AVE WB LANE": OAK AVE
  "S AURORA ST EB LANE": S AURORA ST
  "S AURORA ST WB LANE": S AURORA ST
  "UNIVERSITY AVE EB LANE": UNIVERSITY AVE
  "W CLINTON ST EB LANE": W CLINTON ST
  "W CLINTON ST WB LANE": W CLINTON ST
  "WEST AVE WB LANE": WEST AVE
