# Every name a rule formula may use. Same names in every city; what each one
# means in a given city is in that city's 4_term_definitions/.
# Units are fixed so formulas carry plain numbers: ft, sf, count, text, yes_no (a yes/no fact
# measured from the model, e.g. "the accessory dwelling unit has a separate entrance").

use:               {unit: text,  meaning: "Proposed use of the lot, as one of the city's use names (4_term_definitions/uses.yaml)"}
district:          {unit: text,  meaning: "Zoning district of the lot, as the city writes it (R-1b, R-3aa, ...)"}
lot_area:          {unit: sf,    meaning: Area of the lot}
lot_width:         {unit: ft,    meaning: Width of the lot}
lot_depth:         {unit: ft,    meaning: Depth of the lot}
building_area:     {unit: sf,    meaning: "Ground area covered by buildings, as the city counts it for lot coverage"}
building_height:   {unit: ft,    meaning: "Height of the building, measured as the city defines it"}
stories:           {unit: count, meaning: "Number of stories, as the city defines a story"}
front_yard:        {unit: ft,    meaning: Depth of the front yard}
side_yard_smaller: {unit: ft,    meaning: Width of the narrower side yard}
side_yard_larger:  {unit: ft,    meaning: Width of the wider side yard}
rear_yard:         {unit: ft,    meaning: Depth of the rear yard}
sleeping_rooms:    {unit: count, meaning: Bed or sleeping rooms in the dwelling unit}
parking_spaces:    {unit: count, meaning: Off-street parking spaces provided}
# Stated by the architect (the model doesn't show them): a lot size that grows with the units (R-3a chart note 7).
dwelling_units:       {unit: count,  meaning: "Dwelling units on this lot (a building split along its party walls onto several lots, such as a semi-detached house on two lots: this lot's units only)"}
rooms_let_for_profit: {unit: count,  meaning: "Rooms let for profit (to roomers) in the building"}
conversion:           {unit: yes_no, meaning: "The building is a conversion of an existing building (§325-3B CONVERSION), not new construction"}
# Stated by the architect: a lot size that grows with the occupants (R-2c chart notes 4, 5 and 6).
occupants:            {unit: count,  meaning: "Occupants of all the dwelling units on this lot together, as §325-3B OCCUPANT counts them (in R-2c, every person with the right to occupy, living there yet or not; a unit no one has that right to counts none). The split between units isn't stated: a lot size that depends on it complies only if it is enough with every occupant in one unit"}
occupants_most_in_one_unit: {unit: count, meaning: "Optional: the most occupants (as counted for occupants) in any one dwelling unit on this lot, 1 or more. Tells how the occupants are split where a lot size depends on it"}
attached_units_in_building: {unit: count, meaning: "Dwelling units in the whole attached building, every lot it stands on together (§325-3B: three to six), 1 or more; not this lot's units (dwelling_units)"}
# Stated by the architect: whether §325-19E's stricter limits can apply (R-3a.abutting_r1). What "directly abuts"
# reaches is open (R-3a.abutting_r1, open question 1); asked the cautious way, so "no" is right under every reading.
abuts_r1_district:    {unit: yes_no, meaning: "Some R-1a or R-1b land is touching this lot (even at a corner), or across a street, alley, creek or other waterway, railroad or other right-of-way from it (§325-19E's 'directly abuts', read the cautious way: Gordium's reading of the open question, to confirm)"}
# Stated by the architect: who lives in each dwelling unit, for the occupancy limits in §325-3B's definitions of a
# one-family and a two-family dwelling (research: docs/research/2026-10-27_occupancy_and_home_occupation.md).
unrelated_persons:    {unit: count,  meaning: "The most people in any one dwelling unit on this lot who are not related by blood, marriage or adoption (§325-3B FAMILY) to its household's family (or, in a household with no family, to one person in it), leaving out minor dependent children in the care of a parent or relative (chart p.2 note 1)"}
unrelated_persons_with_children: {unit: count, meaning: "The same count with every minor dependent child counted too: the most people in any one dwelling unit on this lot not related by blood, marriage or adoption to its household's family (or to one person in it)"}
owner_occupied:       {unit: yes_no, meaning: "The owner (§325-3B OWNER: an owner of record who keeps the property as their principal residence more than six months of each year) lives in the one-family dwelling itself; an owner living only in an accessory dwelling unit on the lot is a no (Gordium's reading, to confirm)"}
accessory_dwelling_unit: {unit: yes_no, meaning: "An accessory dwelling unit (§325-3B ACCESSORY DWELLING UNIT, §325-28) is on the lot, attached or detached"}
functional_family_unit: {unit: yes_no, meaning: "The household is to be shown to the City to be a functional family unit (§325-3B FUNCTIONAL FAMILY UNIT); the City decides"}
# Stated by the architect: a home occupation (§325-3B HOME OCCUPATION, chart p.2: special permit in every residential
# district unless it meets §325-9B(1)(i)'s criteria).
home_occupation:      {unit: yes_no, meaning: "A home occupation (§325-3B: a business, studio or office run by a resident in their dwelling unit or a building accessory to it) is planned"}
home_occupation_area: {unit: sf,     meaning: "Indoor floor area the home occupation uses, its accessory structures included"}
home_occupation_unit_area: {unit: sf, meaning: "Floor area of the dwelling unit the home occupation is in"}
# How many primary buildings stand on the lot (§325-3B PRIMARY STRUCTURE; §325-8B(1): each further primary use in a
# separate building needs its own lot area; §325-7B; §325-8E). Stated by the architect, or read from the drawing
# (model_measurement: the main building, plus each solid standing apart that could hold a home and isn't listed as
# an accessory building; readings when it can't tell).
primary_buildings:    {unit: count,  meaning: "Primary buildings on the lot, the main one included: each separate building holding a permitted primary use (§325-3B PRIMARY STRUCTURE: a single structure containing a use permitted in the district), 1 or more; not an accessory building (a garage, a shed, an accessory dwelling unit)"}
# Stated by the architect: a stream or inlet near the lot (§325-26: no new structure nearer than 20 ft to an inlet
# wall or the bank of an inlet channel or stream, at average water level). The model doesn't show the water.
stream_near_lot:      {unit: yes_no, meaning: "Some inlet wall, or the bank of an inlet channel or stream (at its average water level), is within 20 ft of the lot (§325-26)"}
stream_distance:      {unit: ft,     meaning: "Least horizontal distance from any new structure on the lot (a house, an addition, a garage, a deck, a fence; not a patio or terrace, §325-3B STRUCTURE) to the nearest inlet wall or stream bank at its average water level (§325-26 and its illustration)"}
south_hill_overlay:   {unit: yes_no, meaning: "The lot is in the South Hill Overlay District (§325-8E; chart p.2 note 2), as the City's zoning map shows it; stated by the architect (Gordium doesn't look up the overlay map yet)"}
primary_buildings_same_use: {unit: yes_no, meaning: "Every primary building on the lot holds the use entered for the lot (use), so each needs that use's lot area (§325-8B(1))"}
# Yards to the building seen from above, eaves and cornices included: §325-18B lets those project up to 2 ft
# into a required yard (the yards above are measured to the building, its eaves left out).
front_yard_eaves:        {unit: ft, meaning: "Depth of the front yard measured to the outermost part of the building, eaves included"}
side_yard_smaller_eaves: {unit: ft, meaning: "Width of the narrower side yard measured to the outermost part of the building, eaves included"}
side_yard_larger_eaves:  {unit: ft, meaning: "Width of the wider side yard measured to the outermost part of the building, eaves included"}
rear_yard_eaves:         {unit: ft, meaning: "Depth of the rear yard measured to the outermost part of the building, eaves included"}
# Accessory buildings (garages, sheds) standing apart from the main building.
accessory_buildings:       {unit: count,  meaning: "Number of accessory buildings on the lot"}
accessory_front_yard:      {unit: ft,     meaning: "Least distance from a street lot line to an accessory building"}
accessory_side_yard:       {unit: ft,     meaning: "Least distance from a side lot line to an accessory building"}
accessory_rear_yard:       {unit: ft,     meaning: "Least distance from the rear lot line to an accessory building"}
accessory_distances_apply: {unit: yes_no, meaning: "The city's side and rear distances for accessory buildings apply to the accessory buildings on the lot"}
