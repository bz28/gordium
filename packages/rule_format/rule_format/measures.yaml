# Every name a rule formula may use. Same names in every city; what each one
# means in a given city is in that city's 4_term_definitions/.
# Units are fixed so formulas carry plain numbers: ft, sf, count, text, yes_no (a yes/no fact
# measured from the model, e.g. "the accessory dwelling unit has a separate entrance").

use:               {unit: text,  meaning: "Proposed use of the lot, as one of the city's use names (4_term_definitions/uses.yaml)"}
district:          {unit: text,  meaning: "Zoning district of the lot, as the city writes it (R-1b, R-3aa, ...)"}
lot_area:          {unit: sf,    meaning: Area of the lot}
lot_width:         {unit: ft,    meaning: Width of the lot}
lot_depth:         {unit: ft,    meaning: Depth of the lot}
building_area:     {unit: sf,    meaning: "Ground area covered by buildings, as the city counts it for lot coverage"}
building_height:   {unit: ft,    meaning: "Height of the building, measured as the city defines it"}
stories:           {unit: count, meaning: "Number of stories, as the city defines a story"}
front_yard:        {unit: ft,    meaning: Depth of the front yard}
side_yard_smaller: {unit: ft,    meaning: Width of the narrower side yard}
side_yard_larger:  {unit: ft,    meaning: Width of the wider side yard}
rear_yard:         {unit: ft,    meaning: Depth of the rear yard}
sleeping_rooms:    {unit: count, meaning: Bed or sleeping rooms in the dwelling unit}
parking_spaces:    {unit: count, meaning: Off-street parking spaces provided}
# Stated by the architect (the model doesn't show them): a lot size that grows with the units (R-3a chart note 7).
dwelling_units:       {unit: count,  meaning: "Dwelling units in the building"}
rooms_let_for_profit: {unit: count,  meaning: "Rooms let for profit (to roomers) in the building"}
conversion:           {unit: yes_no, meaning: "The building is a conversion of an existing building (§325-3B CONVERSION), not new construction"}
# Stated by the architect: whether §325-19E's stricter limits can apply (R-3a.abutting_r1). Whether land across a
# street "directly abuts" is open (R-3a.abutting_r1, open question 1); asked the cautious way, so yes covers both.
abuts_r1_district:    {unit: yes_no, meaning: "The lot directly abuts land in the R-1a or R-1b district (§325-19E): it shares a lot line with that land, or faces it across a street (Gordium's reading of the open question, to confirm)"}
# Yards to the building seen from above, eaves and cornices included: §325-18B lets those project up to 2 ft
# into a required yard (the yards above are measured to the building, its eaves left out).
front_yard_eaves:        {unit: ft, meaning: "Depth of the front yard measured to the outermost part of the building, eaves included"}
side_yard_smaller_eaves: {unit: ft, meaning: "Width of the narrower side yard measured to the outermost part of the building, eaves included"}
side_yard_larger_eaves:  {unit: ft, meaning: "Width of the wider side yard measured to the outermost part of the building, eaves included"}
rear_yard_eaves:         {unit: ft, meaning: "Depth of the rear yard measured to the outermost part of the building, eaves included"}
# Accessory buildings (garages, sheds) standing apart from the main building.
accessory_buildings:       {unit: count,  meaning: "Number of accessory buildings on the lot"}
accessory_front_yard:      {unit: ft,     meaning: "Least distance from a street lot line to an accessory building"}
accessory_side_yard:       {unit: ft,     meaning: "Least distance from a side lot line to an accessory building"}
accessory_rear_yard:       {unit: ft,     meaning: "Least distance from the rear lot line to an accessory building"}
accessory_distances_apply: {unit: yes_no, meaning: "The city's side and rear distances for accessory buildings apply to the accessory buildings on the lot"}
