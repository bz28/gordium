# Labels used across every city. Draft (architect confirmation is deferred for now).

# What the system does with a clause of a source document.
label_kinds:
  rule:             Checked automatically by code.
  flag:             Shown to the architect to judge; code can't decide it.
  reference:        Sets no requirement itself, but rules depend on it. Defines a word, says how to
                    measure or read something, or points to another section or document.
  not_for_checking: Not about a building's design (procedures, fees, penalties...).

# How architects read the code. Starting list; the final list should follow
# the code's own table of contents.
topics:
  districts_and_map:       Which district a lot is in; district boundaries.
  uses:                    What a lot may be used for.
  dimensions:              Lot size, width, height, stories, coverage, yards.
  density_and_occupancy:   Units, occupants, bedrooms.
  parking_and_loading:     Off-street parking and loading.
  overlays:                Extra rules from overlay districts.
  form_and_design_standards: Facade, materials, building form.
  site_features:           Fences, accessory structures, signs, landscaping.
  nonconforming:           Existing lots, buildings and uses that don't conform.
  procedures:              Permits, reviews, approvals.
  means_of_egress:         Ways out of a building (exits, stairs, ramps, landings, handrails, guards,
                           emergency escape and rescue openings), from a building code such as New York's
                           Residential Code R318-R321.
  definitions:             What words mean.
  administration:          Enforcement, appeals, penalties.
