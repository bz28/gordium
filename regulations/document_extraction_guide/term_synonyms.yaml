# The words that mean the same thing, so a search of the law misses nothing because of wording.
# Used to build the term index (4_term_definitions/term_index.yaml, generated: `python -m section_labeling coverage`):
# for every entry, every piece of the law that uses any of its words.
#
# Keys are the ids in 4_term_definitions/definitions.yaml; every definition has an entry here (a test checks).
# Keys that aren't definitions yet are concepts the rules depend on, and need a `title`.
# Forms are matched as whole words, any case, across line breaks; a plain plural (+s / +es) and a consonant + y
# plural (balcony -> balconies, story -> stories) are matched too, so list only other irregular plurals. Checked against Chapter 325's own wording (2026-10):
# e.g. "setback" appears 95 times and "eaves" is in §325-18B, the rule on what may project into a yard.
# Compared with the synonym search of the 2026-10-20 research (docs/research/2026-10-20_architect_questions.md,
# Appendix A) and completed from it; a word kept with no hits ("storey", "survey") records that it was looked for.

grade_plane:
  forms: [grade plane, grade, finished grade, ground level, finished ground level]
height_of_building:
  forms: [height of building, building height, height, tall]
story:
  forms: [story, stories, storey, storeys, half story, mezzanine, attic, main entrance, functioning entry]
basement:
  forms: [basement]
cellar:
  forms: [cellar, curb level]
building_area:
  forms: [building area, lot coverage, coverage, footprint]
lot:
  forms: [lot, lot area, parcel, through lot, survey]
lot_width:
  forms: [lot width, width of lot, width at street line, frontage, street line]
lot_depth:
  forms: [lot depth, depth of lot]
yard:
  forms: [yard, setback, set back, open space]
front_yard:
  forms: [front yard, front setback]
side_yard:
  forms: [side yard, side setback]
rear_yard:
  forms: [rear yard, rear setback]
yard_projections:
  forms: [projection, projecting, eave, eaves, overhang, soffit, cornice, windowsill, belt course, encroach,
          encroachment, cantilever, cantilevered, porch, deck, balcony, bay window, terrace, patio, pergola, stair,
          ramp, landing, stoop]

# Concepts the rules depend on that the law doesn't define in §325-3.
accessory_building:
  title: Accessory buildings and structures (garages, sheds)
  forms: [accessory building, accessory structure, accessory use, garage, shed, toolhouse, garden house, playhouse,
          carport]
corner_lot:
  title: Corner lots
  forms: [corner lot, two front yards]
lot_line:
  title: Lot lines (property lines)
  forms: [lot line, property line, front lot line, side lot line, rear lot line]
roof:
  title: Roofs (flat, pitched, gable, hip, gambrel, mansard)
  forms: [roof, flat roof, pitched roof, gable, gabled, hip roof, gambrel, mansard, ridge, parapet]
height_exceptions:
  title: Features allowed above the height limit
  forms: [chimney, spire, belfry, cupola, skylight, bulkhead, penthouse, mechanical penthouse, stairtower]
accessory_dwelling_unit:
  title: Accessory dwelling units (ADUs)
  forms: [accessory dwelling unit, ADU, accessory apartment]
parking:
  title: Parking (spaces, areas, off-street)
  forms: [parking space, parking area, off-street parking, driveway]
