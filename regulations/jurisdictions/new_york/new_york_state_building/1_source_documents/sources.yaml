# Source documents for New York State's building code for buildings other than houses (README.md): the law a New York
# place would inherit for such a building (its jurisdiction.yaml `inherits:`; none does yet, so no design check runs
# it today). The house code, the 2025 Residential Code of New York State, is the sibling folder new_york_state/.
# The code book is copyrighted (International Code Council), so it is NOT in this folder: kept_outside_repo: true
# means the book and its extracted text are in the code cache on the machines that have it,
# <cache>/<sha256>/<file> (rule_format/rulebook.py: code_cache), with the text of every page
# (document_extraction/book_text.py), the same for every branch; brought_in.pages says which of its pages this branch
# reads. The repo keeps only short exact quotes, each with its section, page and a link (decided 2026-11-12:
# docs/decisions/2026-11-12_building_code_text.md; for this book: docs/decisions/2026-11-21_ny_building_code.md).
# sha256 is the book's fingerprint: if a single byte changes, it changes.
# Pages are the PDF's own page numbers (1 = the first page of the file), never the book's printed page numbers
# (the PDF's p.341 prints "320").
# Everything here is verified against this copy only; check against a copy bought from ICC.

documents:

  - file: gov.ny.building.2025.pdf
    title: 2025 Building Code of New York State (BCNYS)
    publisher: International Code Council, for the New York State Department of State (publication date July 2025)
    edition: 2025   # ISBN 978-1-967590-70-7 (PDF download), as its page 3 prints
    url: https://archive.org/details/gov.ny.building.2025
    downloaded_on: 2026-11-21   # https://archive.org/download/gov.ny.building.2025/gov.ny.building.2025.pdf
    sha256: 729d2db7ca361764cc8ce131f89a42a5fef5b22ce819fa96f428865aaacc4ca9
    pages: 813
    kept_outside_repo: true
    copy: >
      Posted to the Internet Archive by Public.Resource.Org on 2026-02-02 (item gov.ny.building.2025), as the house
      code's copy was (sibling folder new_york_state/). It is not a scan: it is ICC's own digital PDF edition, with real
      text in its fonts (no OCR), an ICC logo, and a per-copy number, 102102166, stamped at the top of every page (the
      same number the house code's copy carries: likely the download's licence number), so it is one specific licensed
      copy, posted by Public.Resource.Org. The stamp is page furniture, never in a quote. Gordium reads the PDF's own
      text; archive.org's OCR files of it are not used. Its numbers are still read a second time, independently
      (text_verification.yaml). A working copy, chosen by Ben (2026-11-21: Public.Resource.Org copies for now): to be
      checked against a copy bought from ICC (ICC's digital codes site may not be read by any script or automated
      browser: its terms forbid automated extraction and commercial use).
    terms: >
      Copyright 2025 International Code Council. The code is law in New York (19 NYCRR Part 1221 incorporates it by
      reference). Gordium keeps only short exact quotes, with section, page and a link, in the repo; the book and its
      full text stay outside it.
    in_force: >
      The building code of the Uniform Code for every building the 2025 Residential Code of New York State does not
      cover (that code covers one- and two-family dwellings and townhouses not more than three stories above grade
      plane: sibling folder new_york_state/). Incorporated by 19 NYCRR Part 1221 (the 2025 rule amends Parts 1219 to
      1229) and in force since 2025-12-31: "The effective date of the 2025 NYS Uniform Code is December 31, 2025." During
      the transition, from the Notice of Adoption (State Register of 2025-10-01) to that date, "a person shall have the
      option of complying with either the provisions of the 2025 Uniform Code or the 2020 Uniform Code" (DOS:
      https://dos.ny.gov/notice-adoption, read 2026-11-21; README).
