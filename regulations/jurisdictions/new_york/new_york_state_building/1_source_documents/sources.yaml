          doors: 'The book prints "horizontal exit doors" in one italic run (p.350, line 49); HORIZONTAL EXIT is
            defined (brought in) and "doors" is the plain noun after it. Read by 1026.4''s flag (section group 9g).'
        '1027.6':
          exterior: 'The book prints "exterior exit ramp" in italics broken across two lines (p.351, lines 36-37:
            "exte-" / "rior exit ramp", both in the italic font by position), which the reader doesn''t join; EXTERIOR
            EXIT RAMP is defined in Section 202 and brought in (202:exterior_exit_ramp). Read by 1027.6''s flag (section
            group 9g).'
        '1028.2':
          enclosure: 'The book prints "interior exit stairway or ramp enclosure" in italics (p.352, line 30, exception
            2.1, by position in the italic font: line 18''s "enclosure" is roman); INTERIOR EXIT STAIRWAY and RAMP, before
            it, are defined and brought in, and Section 202 has no ENCLOSURE entry. Read by 1028.2''s flag (section group
            9g; review round 1 put the line right).'
        '1029.3':
          fire-resistance-rated: 'As 1020.6.1 ("fire-resistance-rated construction", p.352, line 58): the defined term
            is FIRE-RESISTANCE RATING, brought in. Read by 1029.3''s flag (section group 9g).'
        '1030.1.1.1':
          fire-resistance-rated: 'The book prints "fire-resistance-rated" in italics broken across two lines (p.353, lines
            17-18: "fire-resis-" / "tance-rated construction", both in the italic font by position); the defined term is
            FIRE-RESISTANCE RATING, brought in (202:fire_resistance_rating), which the adjective names but not whole. Read
            by 1030.1.1.1''s flag (section group 9h).'
        '1030.6.2':
          smoke-protected: 'The book prints "smoke-protected" in italics before "environment" (p.354, line 7: "the same
            smoke-protected environment"); the defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the
            word doesn''t name whole. Read by 1030.6.2''s flag (section group 9h).'
        '1030.8.1':
          smoke-protected: 'As 1030.8 (p.355, line 23, the exception: "smoke-protected or open-air assembly seating"):
            the defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word doesn''t name whole. Read by
            1030.8.1''s flag (section group 9h).'
        '1030.9.5':
          smoke-protected: 'As 1030.8 (p.356, lines 6-7, exceptions 4 and 5: "smoke-protected or open-air assembly
            seating"): the defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word doesn''t name
            whole. Read by 1030.9.5''s flag (section group 9h).'
        202:factored_load:
          nominal load: 'The book prints "nominal load" in italics (p.44, line 34); Section 202 defines NOMINAL LOADS (p.55,
            line 3), plural, which the italic singular doesn''t name; a structural term no rule reads, reached through
            STRENGTH, a word 1030.16.4 prints in roman. Used by no rule (section group 9i).'
        202:resistance_factor:
          nominal: 'The book prints "nominal strength" in italics (p.59, line 8); Section 202 has no NOMINAL STRENGTH entry of
            its own, STRENGTH (brought in, 202:strength) defining it within its entry; a structural term no rule reads.
            Used by no rule (section group 9i).'
        '1030.13.1':
          fixed seats: 'As 1004.6 (p.357, line 8, the exception: "served by fixed seats"): the defined term is FIXED SEATING,
            brought in, which "fixed seats" doesn''t name whole. Read by 1030.13.1''s flag (section group 9i).'
        '1030.13.2.1':
          smoke-protected: 'As 1030.8 (p.357, line 31, the exception: "smoke-protected or open-air assembly seating"): the
            defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word doesn''t name whole. Read by
            1030.13.2.1''s flag (section group 9i).'
        '1030.13.2.2':
          smoke-protected: 'As 1030.8 (p.357, line 54, the exception: "smoke-protected or open-air assembly seating"): the
            defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word doesn''t name whole. Read by
            1030.13.2.2''s flag (section group 9i).'
        '1023.13':
          standpipes: 'The book prints "Standpipes" in italics (p.348, line 9); Section 202 has no STANDPIPE entry, only
            STANDPIPE, TYPES OF and STANDPIPE SYSTEM, CLASSES OF (p.62, lines 15 and 30), which name kinds of standpipe
            and not the word alone, so neither is brought in. Standpipes are 905.3''s and 905.4''s (not brought in): read
            by 1023.13''s flag (section group 9e).'
        '1031.2':
          egress: 'The book prints "public way, or to an egress balcony that leads to a public way" in one italic run
            (p.360, line 9); PUBLIC WAY is defined (brought in); Section 202 defines no egress balcony (it uses
            "exterior egress balcony" in roman in exception 2, and BALCONY, EXTERIOR EXIT isn''t an entry of this
            book), and the joining words aren''t terms. Read by 1031.2''s rule and flags (section group 8a).'
          balcony: As "egress" under 1031.2.
          leads: As "egress" under 1031.2.
          that: As "egress" under 1031.2.
          to: As "egress" under 1031.2.
          sleeping rooms: 'The book prints "sleeping rooms" in italics (p.360, line 19, exception 5); Section 202
            defines SLEEPING UNIT (brought in) but no sleeping room. Gordium reads a sleeping room as the description
            marks it (a room stated sleeping, never guessed). Read by 1031.2''s rule (section group 8a).'
        202:fire_alarm_signal:
          fire alarm-initiating device: 'The book prints "fire alarm-initiating device" in italics (p.44, line 56);
            Section 202 has no entry for the whole phrase; it defines its head, INITIATING DEVICE (p.50, lines
            54-55), brought in by name (brought_in.definitions), and MANUAL FIRE ALARM BOX and FIRE DETECTOR,
            AUTOMATIC, the examples that follow. FIRE ALARM SIGNAL is brought in by 1010.2.6''s exception 3.2; used by
            no rule (section group 6d; Chapter 4 part b too).'
        202:fire_alarm_system:
          fire alarm: 'The book prints "fire alarm" in italics within "fire alarm or supervisory signal-initiating
            devices" (p.44, line 59); Section 202 defines no FIRE ALARM alone (SUPERVISORY SIGNAL-INITIATING DEVICE is
            defined and brought in). Used by no rule (section group 6d; Chapter 4 part c too).'
        202:supervisory_signal_initiating_device:
          life safety system: 'The book prints "life safety system" in italics (p.64, line 15), the singular of
            LIFE SAFETY SYSTEMS (p.51, lines 53-54), which the italics reader pairs only with a plural; brought in
            by name (brought_in.definitions). SUPERVISORY SIGNAL-INITIATING DEVICE is brought in by FIRE ALARM
            SYSTEM''s words; used by no rule (section group 6d; Chapter 4 part c too).'
        202:permit:
          code enforcement program: 'The [NY] sub-definition "Operating permit" (p.56, lines 53-54) prints "Code
            Enforcement Program" in italics; the defined term is PART 1203-COMPLIANT CODE ENFORCEMENT PROGRAM (brought
            in), which the phrase doesn''t name whole. PERMIT is brought in by 1010.1.6''s roman "permits" (exception 2);
            used by no rule (section group 6c; section group 7c brings PERMIT in too, through CONSTRUCTION DOCUMENTS; Chapter 4 part c too).'
        '1013.2':
          guest rooms: 'The book prints "guest rooms" in italics (p.336, line 47); Section 202 defines GUESTROOM (p.48,
            line 57), one word, which the two words don''t name; brought in by name (brought_in.definitions). Read by
            1013.2''s flag (section group 9b).'
        '1009.3.3':
          smoke-protected: 'The book prints "smoke-protected" in italics before "or open-air assembly seating areas"
            (p.320, line 35, exception 4); the defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word
            doesn''t name whole. The exception only loosens; read by 1009.3.3''s flag (section group 9c).'
        '1009.4.2':
          smoke-protected: 'As 1009.3.3 (p.320, line 49, exception 4). Read by 1009.4.2''s flag (section group 9c).'
        '1009.7.2':
          fire-resistance-rated: 'As 1020.6.1 ("The fire-resistance-rated construction shall extend vertically", p.321, line 28, and line 30): the
            defined term is FIRE-RESISTANCE RATING, brought in. Read by 1009.7.2''s flag (section group 9c).'
        '1019.3':
          smoke-protected: 'As 1009.3.3 (p.343, line 28, exception 7: "smoke-protected or open-air assembly seating"):
            the defined term is SMOKE-PROTECTED ASSEMBLY SEATING (brought in), which the word doesn''t name whole. The
            exception only loosens; read by 1019.3''s flag (section group 9d).'
    contents: >
      Commercial egress step 1 (2026-11-21), the limits Gordium's route measures feed, as the Maine rulebook drafted
      them for a day-care centre (regulations/jurisdictions/maine/maine_state/): 1017 and Table 1017.2 (exit access
      travel distance), 1006.2.1 and Table 1006.2.1 (common path of egress travel; spaces with one exit), 1020.5 (dead
      ends), 1007.1 (exit and exit access doorway separation), 1016.2 (egress through intervening spaces), 508.2
      (accessory occupancies: 508.2.3's 10 percent of the story), 308.5 (Group I-4, day care), 903.3.1.1 and
      903.3.1.2 (the sprinkler systems the limits name); 201 (how definitions apply) and every Section 202
      definition they use, by the book's italics (201.1).
