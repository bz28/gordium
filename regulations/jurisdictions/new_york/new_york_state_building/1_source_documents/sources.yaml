        202:area_for_masonry:
          specified: The book prints "specified dimensions" in italics across two lines (p.33, lines 48-49) with the
            first word on line 47's "out-to-out specified"; DIMENSIONS (Specified) is defined under DIMENSIONS, which
            applies only to Chapter 21 (masonry). A masonry term, used by no brought-in rule.
        202:basement:
          flood: '"flood loads": the book points to Section 1612 (flood loads), not brought in; no term FLOOD.'
        202:brick:
          clay or shale: The name of one kind of brick under BRICK (its sub-entry "Clay or shale"), printed in italics;
            no term.
          prism: '"a rectangular prism": PRISM is not defined in Section 202 (Chapter 21 defines it, not brought in);
            ordinary meaning (201.4).'
        202:dimensions:
          specified dimension: DIMENSIONS' own sub-entry "Specified" (line 24), printed in italics where Nominal uses
            it; no separate term.
        202:liquid:
          flammable: '"flam-" / "mable": FLAMMABLE LIQUID is broken at a line''s end (p.52, lines 18-19), so the
            word "flammable" alone is left over; FLAMMABLE LIQUID is a Fire Code term, used by no brought-in rule.'
        202:nominal_loads:
          flood: '"flood" among the loads of Chapter 16 (dead, live, soil, wind, tornado, snow, rain, flood and
            earthquake); FLOOD LOADS is not a Section 202 term here. Used by no brought-in rule.'
        202:roof_assembly_for_application_to_chapter_15_only:
          vapor retarder: Defined in the Energy Conservation Construction Code of New York State, not this code
            (201.3); a roofing term, used by no brought-in rule.
        '1006.2.1':
          common path of egress: The book prints "common path of egress" in italics and "travel distance" in roman
            (p.315, line 4, checked on the page image); the term is COMMON PATH OF EGRESS TRAVEL, brought in by this
            piece's heading and by the roman-type match.
        '1017.3':
          smoke protected seating: The book prints "smoke protected seating" in italics; the defined term is
            SMOKE-PROTECTED ASSEMBLY SEATING, which the phrase does not name whole, so it is not brought in. Exception
            2 is for assembly seating (Section 1030.7, brought in alone since review round 2), not Group I-4.
        202:load_factor:
          load: 'LOAD FACTOR is a structural term (Chapter 16, load and resistance factor design), brought in because
            Table 1004.5 prints "OCCUPANT LOAD FACTOR"; its italic "load" names the structural loads, which Section
            202 defines only as LOADS (not brought in). Used by no rule.'
          load effect: As "load" (LOAD EFFECTS, a Chapter 16 term). Used by no rule.
          nominal load: As "load" (NOMINAL LOADS, a Chapter 16 term). Used by no rule.
        '1004.6':
          fixed seats: 'The book prints "fixed seats" in italics (p.313, line 20); the defined term is FIXED SEATING,
            brought in by the same words in roman, which "fixed seats" does not name whole. A room whose function is
            assembly with fixed seats takes its occupant load from its seats, a person''s statement.'
        '1030.8':
          smoke-protected: 'The book prints "smoke-protected" in italics before "or open-air assembly seating"
            (p.355, line 18), and the defined term is SMOKE-PROTECTED ASSEMBLY SEATING, which the word does not
            name whole (OPEN-AIR ASSEMBLY SEATING, named whole, is brought in). Exception 2 loosens the limit (50
            ft), and the rule''s review covers it.'
        '1020.6.1':
          fire-resistance-rated: 'The book prints "fire-resistance-rated" in italics (p.345, line 9: "fire-resistance-rated
            construction"); Section 202 defines FIRE-RESISTANCE RATING (brought in, 202:fire_resistance_rating), which
            the adjective names but not whole. 1020.6.1 is a permission, part of 1020.6''s flag.'
        '1020.7':
          fire-resistance-rated: 'As 1020.6.1 ("Fire-resistance-rated corridors", p.345, line 17): the defined term is
            FIRE-RESISTANCE RATING, brought in. 1020.7 is a flag on a rated corridor.'
        '1005.3.1':
          emergency voice/alarm communication system: 'The book prints "emergency voice/alarm communication system" in
            italics (p.314, exception 1); Section 202 defines EMERGENCY VOICE/ALARM COMMUNICATIONS (p.42), which the
            phrase doesn''t name whole, so it isn''t brought in by it. Whether the building has such a system per
            907.5.2.2 (not brought in) is the architect''s statement (the fact emergency_voice_alarm_system).'
        202:power_assisted_door:
          low-energy poweroperated door: 'The book prints "Low-energy power-operated door" in italics broken across
            two lines (p.57, lines 45-46: "power-" / "operated"), which the text joins as "poweroperated"; the term
            LOW-ENERGY POWER-OPERATED DOOR is defined in Section 202 and brought in (section group 6b). Used by no rule.'
        202:private_garage:
          property maintenance code of new york state: 'The [NY] definition PROPERTY MAINTENANCE CODE OF NEW YORK
            STATE printed right after PRIVATE GARAGE (p.58, lines 10-11), its heading in the italics the piece holds;
            the splitter keeps it in PRIVATE GARAGE''s piece. A title of a publication, used by no rule (section group
            6b: 1010.1.2 exception 1 names private garages).'
        '1010.1.2':
          power-operated: 'The book prints "Power-operated doors" in italics (p.323, line 20, exception 7); the defined
            term is POWER-OPERATED DOOR (brought in, 202:power_operated_door), which the adjective doesn''t name whole.
            Exception 7 is a review on the door type rule (section group 6b).'
    contents: >
      Commercial egress step 1 (2026-11-21), the limits Gordium's route measures feed, as the Maine rulebook drafted
      them for a day-care centre (regulations/jurisdictions/maine/maine_state/): 1017 and Table 1017.2 (exit access
      travel distance), 1006.2.1 and Table 1006.2.1 (common path of egress travel; spaces with one exit), 1020.5 (dead
      ends), 1007.1 (exit and exit access doorway separation), 1016.2 (egress through intervening spaces), 508.2
      (accessory occupancies: 508.2.3's 10 percent of the story), 308.5 (Group I-4, day care), 903.3.1.1 and
      903.3.1.2 (the sprinkler systems the limits name); 201 (how definitions apply) and every Section 202
      definition they use, by the book's italics (201.1).
