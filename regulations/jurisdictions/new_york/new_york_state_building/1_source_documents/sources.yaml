      subscript_terms:   # two terms the text reads alike: the book prints a subscript the text puts on the next line
        p.48 line 49:
          printed: GROUND SNOW LOAD, p
          term: GROUND SNOW LOAD, p (allowable stress design)
          why: The book prints GROUND SNOW LOAD, p with the subscript g (line 47, the subscript on line 48) and then
            with the subscript g(asd) (line 49, the subscript on line 50), checked on the page image; the text holds
            neither subscript, so both read "GROUND SNOW LOAD, p". A snow-load term, used by no brought-in piece.
      not_fractions:     # lines that look like a fraction left apart, each checked on the page image: none is one
        p.35 line 55: The subscript 2 of CO2 in CARBON DIOXIDE EXTINGUISHING SYSTEMS, printed under line 54.
        p.49 line 42: The subscript 50 of LD50 (median lethal dose) in HIGHLY TOXIC, printed under line 41.
        p.49 line 45: As line 42 (LD50, under line 44).
        p.49 line 49: The subscript 50 of LC50 (median lethal concentration), printed under line 48.
        p.65 line 9: The subscript 50 of LD50 in TOXIC, printed under line 8.
        p.65 line 12: As line 9 (LD50, under line 11).
        p.65 line 16: The subscript 50 of LC50, printed under line 15.
        p.342 line 16: 1017.2.3 item 4 prints a ventilation rate in cubic metres per minute per square metre, "(0.556
          m3/min/m2)", the 3 and the 2 raised as powers of the unit; the slashes divide units, not a fraction.
      italic_not_defined:    # by piece: italic words Section 202 doesn't define, each with why (any other is a problem)
        202:area_for_masonry:
          specified: The book prints "specified dimensions" in italics across two lines (p.33, lines 48-49) with the
            first word on line 47's "out-to-out specified"; DIMENSIONS (Specified) is defined under DIMENSIONS, which
            applies only to Chapter 21 (masonry). A masonry term, used by no brought-in rule.
        202:basement:
          flood: '"flood loads": the book points to Section 1612 (flood loads), not brought in; no term FLOOD.'
        202:brick:
          clay or shale: The name of one kind of brick under BRICK (its sub-entry "Clay or shale"), printed in italics;
            no term.
          prism: '"a rectangular prism": PRISM is not defined in Section 202 (Chapter 21 defines it, not brought in);
            ordinary meaning (201.4).'
        202:dimensions:
          specified dimension: DIMENSIONS' own sub-entry "Specified" (line 24), printed in italics where Nominal uses
            it; no separate term.
        202:liquid:
          flammable: '"flam-" / "mable": FLAMMABLE LIQUID is broken at a line''s end (p.52, lines 18-19), so the
            word "flammable" alone is left over; FLAMMABLE LIQUID is a Fire Code term, used by no brought-in rule.'
        202:nominal_loads:
          flood: '"flood" among the loads of Chapter 16 (dead, live, soil, wind, tornado, snow, rain, flood and
            earthquake); FLOOD LOADS is not a Section 202 term here. Used by no brought-in rule.'
        202:roof_assembly_for_application_to_chapter_15_only:
          vapor retarder: Defined in the Energy Conservation Construction Code of New York State, not this code
            (201.3); a roofing term, used by no brought-in rule.
        '1006.2.1':
