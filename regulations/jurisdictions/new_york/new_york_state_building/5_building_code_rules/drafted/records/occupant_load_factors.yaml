increase_cap:
  sq_ft_per_occupant: 7
  source:
    file: gov.ny.building.2025.pdf
    page: 313
    lines:
    - 15
    - 17
    quote: 1004.5.1 Increased occupant load. The occupant load permitted in any building, or portion thereof, is permitted
      to be increased from that number established for the occupancies in Table 1004.5, provided that all other requirements
      of the code are met based on such modified number and the occupant load does not exceed one occupant per 7 square feet
      (0.65 m2) of occupiable floor
