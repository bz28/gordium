# Facts about the whole building that the 2025 Building Code of New York State's egress rules read (2026-11-21),
# stated by the architect: not in measures.yaml (Ithaca's zoning measures), so listed here for engineers, never used
# silently, and a rule using one can't be approved until an engineer adds it to measures.yaml (rulebook.py:
# PROPOSED_MEASURES). Each is a yes or no, worded as the book words the condition, so a rule reads the book's own
# test, but occupancy_group, a text taking only its listed values (2026-11-23: the one group, or mixed). Written by
# hand in Claude Code sessions; needed_by: the rules that read each one.

