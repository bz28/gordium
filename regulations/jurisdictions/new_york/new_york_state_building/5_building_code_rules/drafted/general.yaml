    - 26
    quote: '713.12 Enclosure at top. The top of shaft enclosures shall comply with one of the following: 1. Extend to the
      underside of the roof sheathing, deck or slab of the building, and the roof assembly shall comply with the requirements
      for the type of construction as specified in Table 601. 2. Terminate below the roof assembly and be enclosed at the
      top with construction of the same fire-resistance rating as the topmost floor penetrated by the shaft, but not less
      than the fire-resistance rating required for the shaft enclosure. 3. Extend past the roof assembly and comply with the
      requirements of Section 1511.'
  examples:
