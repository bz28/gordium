- id: general.bc_707_4_exterior_walls
  kind: flag
  topic: means_of_egress
  title: Exterior walls that are part of a rated enclosure (BCNYS 707.4)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 172
    lines:
    - 5
    - 13
    quote: '707.4 Exterior walls. Where exterior walls serve as a part of a required fire-resistance-rated shaft, or separation
      or enclosure for a stairway, ramp or exit passageway, such walls shall comply with the requirements of Section 705 for
      exterior walls and the fire-resis- tance-rated enclosure or separation requirements shall not apply. Exceptions: 1.
      Exterior walls required to be fire-resistance rated in accordance with Section 1021 for exterior egress balconies, Section
      1023.7 for interior exit stairways and ramps, Section 1024.8 for exit passageways and Section 1027.6 for exterior exit
      stair- ways and ramps. 2. Exterior walls required to be fire-resistance rated in accordance with Section 1207 of the
      Fire Code of New York State for enclosure of energy storage systems.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Where an exterior wall is part of a required rated shaft, or of a stairway, ramp or exit passageway''s separation
      or enclosure, it follows Section 705 for exterior walls instead of the enclosure''s rating, except where 1021 (exterior
      egress balconies), 1023.7 (interior exit stairways and ramps), 1024.8 (exit passageways), 1027.6 (exterior exit stairways
      and ramps) or 1207 of the Fire Code of New York State (energy storage systems) asks the exterior wall itself to be rated:
      which enclosure walls are exterior walls, and their ratings, a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. 705, 1021, 1023.7, 1024.8, 1027.6 and the Fire
    Code's 1207 aren't brought in. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_707_5_continuity
  kind: flag
  topic: means_of_egress
  title: Fire barriers run from floor to the deck above (BCNYS 707.5)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 172
    lines:
    - 14
    - 24
    quote: '707.5 Continuity. Fire barriers shall extend from the top of the foundation or floor/ceiling assembly below to
      the underside of the floor or roof sheathing, slab or deck above and shall be securely attached thereto. Such fire barriers
      shall be continuous through concealed space, such as the space above a suspended ceiling. Joints and voids at intersections
      shall comply with Sections 707.8 and 707.9 Exceptions: 1. Shaft enclosures shall be permitted to terminate at a top
      enclosure complying with Section 713.12. 2. Interior exit stairway and ramp enclosures required by Section 1023 and
      exit access stairway and ramp enclosures required by Section 1019 shall be permitted to terminate at a top enclosure
      complying with Section 713.12. 3. An exit passageway enclosure required by Section 1024.3 that does not extend to the
      underside of the floor sheathing, roof sheathing, slab or deck above shall be enclosed at the top with construction
      of the same fire-resistance rating as required for the exit passageway.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A fire barrier runs from the top of the foundation or the floor/ceiling assembly below to the underside of the
      floor or roof sheathing, slab or deck above, fastened to both, and continues through concealed spaces such as above
      a suspended ceiling, its joints and voids per 707.8 and 707.9; except that a shaft enclosure, an interior exit stairway
      or ramp enclosure (1023) or an exit access stairway or ramp enclosure (1019) may end at a top enclosure per 713.12,
      and an exit passageway enclosure (1024.3) that stops short is closed at the top with construction of the passageway''s
      rating: walls'' heights above the ceiling aren''t in the model, so a person''s check.'
