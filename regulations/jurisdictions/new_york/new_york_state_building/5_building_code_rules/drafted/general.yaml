    square feet; which of the model''s rooms they are isn''t stated. Hand-drafted in a Claude Code session (2026-11-27, Chapter
    9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_1_5_1_under_grandstands
  kind: flag
  topic: means_of_egress
  title: Enclosed spaces under grandstands or bleachers (BCNYS 903.2.1.5.1)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "E", "mixed"]
  sources:
  - file: gov.ny.building.2025.pdf
    page: 269
    lines:
    - 57
    - 58
    quote: '[F] 903.2.1.5.1 Spaces under grandstands or bleachers. Enclosed spaces under grandstands or bleachers shall be
      equipped with an automatic sprinkler system in accordance with Section 903.3.1.1 where either of the following exist:'
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 3
    - 4
    quote: 1. The enclosed area is 1,000 square feet (93 m[fn2]) or less and is not constructed in accordance with Section
      1030.1.1.1. 2. The enclosed area exceeds 1,000 square feet (93 m[fn2]).
  examples:
  - given: {}
    expect: needs_review
    note: 'Enclosed spaces under grandstands or bleachers are sprinklered per 903.3.1.1 where they exceed 1,000 square feet,
      or are 1,000 square feet or less and not built per 1030.1.1.1: a person''s check.'
  - given:
      occupancy_group: R-2
    expect: not_applicable
    note: 'Not this building''s group or fact, as stated: not applicable.'
  notes: '903.2.1.5.1: grandstands and bleachers aren''t in the model. Shown for Group E too: an assembly space associated
    with Group E is part of it (303.1.3), so a school gym''s bleachers are Group E''s (review round 1). Hand-drafted in a Claude Code session (2026-11-27,
    Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_1_6_assembly_on_roofs
  kind: flag
  topic: means_of_egress
  title: An assembly occupancy on an occupiable roof (BCNYS 903.2.1.6)
  applies_when: occupied_outdoor_areas
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 5
    - 8
    quote: '[F] 903.2.1.6 Assembly occupancies on roofs. Where an occupiable roof has an assembly occupancy with an occupant
      load exceeding 100 for Group A-2 and 300 for other Group A occupancies, all floors between the occupiable roof and the
      level of exit discharge shall be equipped with an automatic sprinkler system in accordance with Section 903.3.1.1 or
      903.3.1.2. Exception: Open parking garages of Type I or Type II construction.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Where an occupiable roof has an assembly occupancy of more than 100 (Group A-2) or 300 (other Group A), every floor
      between the roof and the level of exit discharge has a system per 903.3.1.1 or 903.3.1.2, open parking garages of Type
      I or II construction aside: a person''s check.'
  - given:
      occupied_outdoor_areas: false
    expect: not_applicable
    note: 'Not this building''s group or fact, as stated: not applicable.'
  notes: '903.2.1.6: in a building of any group with an occupiable roof; narrowed to a building stating outdoor areas its
    occupants use (1004.7''s fact: occupiable roofs among them), or not stating it. Hand-drafted in a Claude Code session
    (2026-11-27, Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_1_7_multiple_a_fire_areas
  kind: flag
  topic: means_of_egress
  title: Group A fire areas sharing exits (BCNYS 903.2.1.7)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "mixed"]
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 9
    - 11
    quote: '[F] 903.2.1.7 Multiple fire areas. An automatic sprinkler system shall be provided where multiple fire areas of
      Group A-1, A-2, A-3 or A-4 occupancies share exit or exit access components and the combined occupant load of theses
      fire areas is 300 or more.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Where Group A-1, A-2, A-3 or A-4 fire areas share exit or exit access components and their occupant loads together
      are 300 or more, a sprinkler system is provided: the fire areas aren''t in the model, a person''s check.'
  - given:
      occupancy_group: A-5
    expect: not_applicable
    note: 'Not this building''s group or fact, as stated: not applicable.'
  notes: '903.2.1.7: fire areas, and which share exits, aren''t in the model. Hand-drafted in a Claude Code session (2026-11-27,
