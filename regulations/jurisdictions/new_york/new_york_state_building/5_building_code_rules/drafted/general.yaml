- id: general.bc_903_2_4_group_f1_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group F-1, by the room (BCNYS 903.2.4)'
  applies_when: occupancy_group in ["F-1"]
  check: sprinklered_903_3_1_1
  review_when:
  - when: not sprinklered_903_3_1_1 and not space_floor_area > 12000
    reason: 'No NFPA 13 system stated, and this room settles none of 903.2.4''s conditions (its own floor area is 12,000 square
      feet or less); its fire area, which the model doesn''t show, may be larger than the room, or may be more than three
      stories above grade plane, the F-1 fire areas of every floor together may exceed 24,000 square feet, or it may make
      lithium-ion or lithium metal batteries, or vehicles, energy storage systems or equipment holding them: a person checks.'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 32
    - 40
    quote: '[F] 903.2.4 Group F-1. An automatic sprinkler system shall be provided throughout all buildings containing a Group
      F-1 occu- pancy where one of the following conditions exists: 1. A Group F-1 fire area exceeds 12,000 square feet (1115
      m[fn2]). 2. A Group F-1 fire area is located more than three stories above grade plane. 3. The combined area of all
      Group F-1 fire areas on all floors, including any mezzanines, exceeds 24,000 square feet (2230 m[fn2]). 4. A Group F-1
      occupancy is used to manufacture lithium-ion or lithium metal batteries. 5. A Group F-1 occupancy is used to manufacture
      vehicles, energy storage systems or equipment containing lithium-ion or lithium metal batteries where the batteries
      are installed as part of the manufacturing process.'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 42
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.'
  examples:
  - given:
      occupancy_group: F-1
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 13000
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group F-1 with an NFPA 13 system throughout (903.3.1.1): the system 903.2.4 requires.'
  - given:
      occupancy_group: F-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
