- id: general.bc_table_1017_2_a_e_f1_m_r_s1
  kind: rule
  topic: means_of_egress
  title: Exit access travel distance, A, E, F-1, M, R, S-1 (BCNYS Table 1017.2)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "E", "F-1", "M", "R-1", "R-2", "R-3", "R-4", "S-1"]
  check: egress_travel_distance <= (250 if (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2 and occupancy_group in ["R-1",
    "R-2", "R-3", "R-4"])) else (125 if occupancy_group == "R-3" and sprinklered_903_3_1_3 else 75 if occupancy_group == "R-4"
    and sprinklered_903_3_1_3 else 200))
  review_when:
  - when: egress_balcony_increase_taken and egress_travel_distance > (250 if (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2
      and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else (125 if occupancy_group == "R-3" and sprinklered_903_3_1_3
      else 75 if occupancy_group == "R-4" and sprinklered_903_3_1_3 else 200)) and egress_travel_distance <= (250 if (sprinklered_903_3_1_1
      or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else (125 if occupancy_group == "R-3"
      and sprinklered_903_3_1_3 else 75 if occupancy_group == "R-4" and sprinklered_903_3_1_3 else 200)) + 100
    reason: 'Over the table''s distance, but within 1017.2.1''s exterior egress balcony increase (up to 100 ft more), which
      the design takes or whose taking isn''t stated: the balcony (Section 1021) and its length are a person''s check (the
      rule “Exterior egress balcony increase, up to 100 ft (BCNYS 1017.2.1)”).'
  - when: sprinklered_903_3_1_2 and not sprinklered_903_3_1_1 and occupancy_group not in ["R-1", "R-2", "R-3", "R-4"] and
      egress_travel_distance <= 250 and egress_travel_distance > 200
    reason: 'Within the sprinklered column only, with an NFPA 13R system (903.3.1.2) outside Group R: 903.3.1.2 permits an
      NFPA 13R system only in Group R occupancies (''Automatic sprinkler systems in Group R occupancies shall be permitted
      to be installed throughout in accordance with NFPA 13R''), and the table''s note sends the reader to Section 903 for
      where it is permitted: outside Group R a 13R system alone gets the column without a sprinkler system, and where only
      the sprinklered column would pass, a person checks the system.'
  - when: occupancy_group in ["F-1", "S-1"] and sprinklered_903_3_1_1 and egress_travel_distance > 250 and egress_travel_distance
      <= 400
    reason: 'Over 250 ft in Group F-1 or S-1 with NFPA 13, within 1017.2.2''s 400 ft, whose other conditions (one story; 24
      ft to the ceiling) aren''t measured: a person''s check (the rule “Groups F-1 and S-1 increase to 400 ft (BCNYS 1017.2.2)”).'
  - when: special_egress_spaces
    reason: 'The building may hold a space Table 1017.2 note a gives its own distance (a mall, 402.8; a Group I-2 care suite,
      407.4; a special amusement area, 411.2; aircraft manufacturing, 412.6; a refrigeration machinery or refrigerated room,
      1006.2.2.2 and 1006.2.2.3: 150 ft unsprinklered; a temporary structure, 3103.4: 100 ft; a pedestrian walkway, 3104.9:
      200 ft), stated or not ruled out (as the architect states it): its limit isn''t this row''s, a person checks.'
  - when: building_has_atrium and egress_travel_distance > 200 and egress_travel_distance <= (250 if (sprinklered_903_3_1_1
      or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else 200)
    reason: 'Over 200 ft, within the row, in a building with an atrium (stated or not ruled out): 1017.3.2.3 holds the part
      of the travel within the atrium (off the level of exit discharge) to 200 ft, not measured; a person checks.'
  - when: assembly_fixed_seating
    reason: 'The building may have a room or space used for assembly purposes with fixed seating, in any group (303.1.1, 303.1.2:
      small assembly spaces are part of their main occupancy; 303.1.3: an E school''s auditorium), stated or not ruled out:
      1030.7 measures its travel along the aisles and aisle accessways, never over or on the seats, which the routes don''t
      see, and its exceptions allow more for smoke-protected and open-air seating; a person checks. Over the row, too: 1030.7''s
      exceptions allow more for smoke-protected and open-air seating.'
