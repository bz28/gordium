- id: general.bc_1006_2_1_1_three_or_more_exits
  kind: rule
  topic: means_of_egress
  title: Three exits from 501-1,000 occupants, four above (BCNYS 1006.2.1.1)
  check: (space_occupant_load <= 500 or space_exit_count >= 3) and (space_occupant_load <= 1000 or space_exit_count >= 4)
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 45
    - 47
    quote: 1006.2.1.1 Three or more exits or exit access doorways. Three exits or exit access doorways shall be provided from
      any space with an occupant load of 501 to 1,000. Four exits or exit access doorways shall be provided from any space
      with an occu- pant load greater than 1,000.
  - file: gov.ny.building.2025.pdf
    page: 316
    lines:
    - 55
    - 57
    quote: 1-500 2 501-1,000 3 More than 1,000 4
  examples:
  - given: {}
    parts:
      space:
      - id: p1
        name: Hall, 600 occupants, three doors
        measures:
          space_occupant_load: 600
          space_exit_count: 3
    rows:
    - part: p1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      space:
      - id: p2
        name: Hall, 600 occupants, two doors
        measures:
          space_occupant_load: 600
          space_exit_count: 2
    rows:
    - part: p2
      outcome: fail
    expect: fail
  - given: {}
    parts:
      space:
      - id: p3
        name: Hall, 1,200 occupants, three doors
        measures:
          space_occupant_load: 1200
          space_exit_count: 3
    rows:
    - part: p3
      outcome: fail
    expect: fail
    note: 'Over 1,000: four needed.'
  - given: {}
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No space: with none, the rule needs review.'
  notes: For every occupancy. The 500 is Table 1006.3.3's printed two-exit band ('1-500', a story's), used for a space by
    analogy; a fractional load over 500 needs three (the finding on loads over 500). Hand-drafted in a Claude Code session
    (2026-11-21).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
  findings:
  - id: space_over_500_needs_three
    question: 'A space''s occupant load just over 500 (a computed 500.5): does it need three exits or exit access doorways?
      1006.2.1.1 prints three for ''501 to 1,000'' and says nothing of a space of 500 or fewer, or of a fraction.'
    kind: reading
    answer: 'Yes: a space needs three from any occupant load over 500. The rules write the two-exit band as Table 1006.3.3
      prints it for a story (''1-500''), used for a space by analogy, so a fractional load over 500 needs three: an occupant
      load is a number of persons (202 OCCUPANT LOAD), and for an area without fixed seating it is ''not less than'' the area
      divided by its factor (1004.5), so a computed 500.5 is at least 501 persons, which 1006.2.1.1''s ''501 to 1,000'' covers.
      Gordium''s reading, for the architects to confirm.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 315
      lines:
      - 45
      - 47
      quote: 1006.2.1.1 Three or more exits or exit access doorways. Three exits or exit access doorways shall be provided
        from any space with an occupant load of 501 to 1,000. Four exits or exit access doorways shall be provided from any
        space with an occu- pant load greater than 1,000.
    - file: gov.ny.building.2025.pdf
      page: 316
      lines:
      - 55
      - 57
      quote: 1-500 2 501-1,000 3 More than 1,000 4
    - file: gov.ny.building.2025.pdf
      page: 55
      lines:
      - 22
      - 22
      quote: '[BE] OCCUPANT LOAD. The number of persons for which the means of egress of a building or portion thereof is
        designed.'
    - rank: 3
      cite: '2025 Building Code of New York State 1004.5 (p.311, not brought in): ''For areas without fixed seating, the occupant
        load shall be not less than that number determined by dividing the floor area under consideration by the occupant
        load factor''; 1004.1: ''the number of occupants for whom means of egress facilities are provided''. No rounding rule
        is printed; read 2026-11-22'
    strength: strong
    confirm_with: the architects
- id: general.bc_1006_3_3_story_exits
  kind: rule
  topic: means_of_egress
  title: Exits per story by occupant load, one where 1006.3.4 allows (BCNYS 1006.3.3)
  check: story_exit_count >= (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4) or (story_exit_count
    > 0 and occupancy_group_i4 and not other_occupancy_present and story_first_above_or_below_grade and story_occupant_load
    <= 10 and egress_travel_distance <= 75)
  review_when:
  - when: story_exit_count < (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4) and (other_occupancy_present
      or not occupancy_group_i4 or story_rooms_exit_directly_outside or (story_first_above_or_below_grade and story_occupant_load
      <= 10 and egress_travel_distance <= 75)) and not (occupancy_group_i4 and not other_occupancy_present and story_first_above_or_below_grade
      and story_occupant_load <= 10 and egress_travel_distance <= 75)
