  title: 'Sprinkler system required: Group I (BCNYS 903.2.6)'
  applies_when: group_i1_i2_i3_present or occupancy_group_i4
  check: sprinklered_903_3_1_1
  review_when:
  - when: occupancy_group in ["I-1"] and sprinklered_903_3_1_2 and not sprinklered_903_3_1_1
    reason: 'Group I-1 with an NFPA 13R system: exception 1 permits one in a Condition 1 facility, and the condition isn''t
      stated: a person checks.'
  - when: occupancy_group in ["I-4"] and not sprinklered_903_3_1_1
    reason: 'Group I-4 day care: no system is required where the care is at the level of exit discharge and every room where
      care is provided has an exterior exit door (exception 2), and NFPA 13 on the floors where it is above or below that
      level (exception 3); neither is in the model: a person checks.'
  - when: occupancy_group in ["mixed"] and not sprinklered_903_3_1_1 and (sprinklered_903_3_1_2 or sprinklered_903_3_1_3 or
      not group_i1_i2_i3_present)
    reason: 'A building of two or more groups whose Group I is I-4 alone (exceptions 2 and 3), or whose one stated NFPA 13R
      or 13D system can''t say which portion it covers: a person checks.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 271
    lines:
    - 12
    - 21
    quote: '[F] 903.2.6 Group I. An automatic sprinkler system shall be provided throughout buildings with a Group I fire
      area. Exceptions: 1. An automatic sprinkler system installed in accordance with Section 903.3.1.2 shall be permitted
      in Group I-1, Condi- tion 1 facilities. 2. An automatic sprinkler system is not required where Group I-4 day care facilities
      are at the level of exit discharge and where every room where care is provided has not fewer than one exterior exit
      door. 3. In buildings where Group I-4 day care is provided on levels other than the level of exit discharge, an automatic
      sprinkler system in accordance with Section 903.3.1.1 shall be installed on the entire floor where care is provided,
      all floors between the level of care and the level of exit discharge, and all floors below the level of exit discharge
      other than areas classified as an open parking garage.'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 45
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.
      [F] 903.3.1.1 NFPA 13 sprinkler systems. Where the provisions of this code require that a building or portion thereof
      be equipped throughout with an automatic sprinkler system in accordance with this section, sprinklers shall be installed
      through- out in accordance with NFPA 13 except as provided in Sections 903.3.1.1.1 through 903.3.1.1.3.'
  - file: gov.ny.building.2025.pdf
    page: 274
    lines:
    - 15
    - 16
    quote: '[F] 903.3.1.2 NFPA 13R sprinkler systems. Automatic sprinkler systems in Group R occupancies shall be permitted
      to be installed throughout in accordance with NFPA 13R where the Group R occupancy meets all of the following conditions:'
  - file: gov.ny.building.2025.pdf
    page: 275
    lines:
    - 11
    - 12
    quote: '[F] 903.3.1.3 NFPA 13D sprinkler systems. Automatic sprinkler systems installed in one- and two-family dwellings;
      Group R-3; Group R-4, Condition 1; and townhouses shall be permitted to be installed throughout in accordance with NFPA
      13D.'
  examples:
