      > 0 and occupancy_group == "S-2"
    reason: 'Group S-2 with fewer exits than Table 1006.3.3 gives: a mechanically parked garage may have one exit (1006.3.4
      item 3), and an open parking garage 100 ft (note d), neither marked: a person checks.'
  - when: assembly_fixed_seating and story_exit_count < (2 if story_occupant_load <= 500 else 3 if story_occupant_load <=
      1000 else 4) and (story_exit_count >= (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4)
      or story_exit_count > 0 and ((story_first_above_or_below_grade and egress_travel_distance <= (100 if sprinklered_903_3_1_1
      else 75) or story_second_above_grade_plane and egress_travel_distance <= 75) and story_occupant_load <= 29))
    reason: 'Fewer exits than Table 1006.3.3 gives, allowed only by 1006.3.4''s single-exit travel limit, in a building that
      may have a room used for assembly purposes with fixed seating (stated or not ruled out): 1030.7 measures travel along
      the aisles, never over the seats the routes measure across, so the figure can''t be trusted: a person checks. (Only
      where the story would otherwise pass: a measured fail still fails.)'
  - when: special_egress_spaces and story_exit_count < (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000
      else 4) and (story_exit_count >= (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4) or story_exit_count
      > 0 and ((story_first_above_or_below_grade and egress_travel_distance <= (100 if sprinklered_903_3_1_1 else 75) or story_second_above_grade_plane
      and egress_travel_distance <= 75) and story_occupant_load <= 29))
    reason: 'Fewer exits than Table 1006.3.3 gives, allowed only by 1006.3.4''s single-exit travel limit, in a building that
      may hold, stated or not ruled out, a space the code gives its own exits or exit access travel limit: a covered or open
      mall (402.8), a Group I-2 care suite (407.4.4), a special amusement area (411), an aircraft manufacturing facility (412.6),
