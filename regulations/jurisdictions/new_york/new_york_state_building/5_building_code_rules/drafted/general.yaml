- id: general.bc_1020_5_dead_end_other_groups
  kind: rule
  topic: means_of_egress
  title: Dead ends, every group but I-4 (BCNYS 1020.5)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "B", "E", "F-1", "F-2", "H-1", "H-2", "H-3", "H-4",
    "H-5", "I-1", "I-2", "I-3", "M", "R-1", "R-2", "R-3", "R-4", "S-1", "S-2", "U"]
  check: corridor_dead_end_length <= (50 if occupancy_group in ["B", "E", "F-1", "F-2", "I-1", "M", "R-1", "R-2", "S-1", "S-2",
    "U"] and sprinklered_903_3_1_1 else 20) or corridor_dead_end_length < 2.5 * corridor_dead_end_least_width
  review_when:
  - when: occupancy_group == "I-3" and corridor_dead_end_length > 20 and corridor_dead_end_length <= 50 and corridor_dead_end_length
      >= 2.5 * corridor_dead_end_least_width
    reason: 'Group I-3: within exception 1''s 50 ft, which applies in Conditions 2, 3 and 4 (the condition isn''t stated):
      a person checks.'
  - when: occupancy_group == "I-2" and corridor_dead_end_length > 20 and corridor_dead_end_length <= 30 and corridor_dead_end_length
      >= 2.5 * corridor_dead_end_least_width
    reason: 'Group I-2: within exception 4''s 30 ft for Condition 2 corridors that don''t serve patient rooms or treatment
      spaces (not stated): a person checks.'
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 37
    - 38
    quote: 1020.5 Dead ends. Where more than one exit or exit access doorway is required, the exit access shall be arranged
      such that dead-end corridors do not exceed 20 feet (6096 mm) in length.
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 40
    - 43
    quote: 1. In Group I-3, Condition 2, 3 or 4, occupancies, the dead end in a corridor shall not exceed 50 feet (15 240
      mm). 2. In occupancies in Groups B, E, F, I-1, M, R-1, R-2, S and U, where the building is equipped throughout with
      an automatic sprinkler system in accordance with Section 903.3.1.1, the length of the dead-end corridors shall not exceed
      50 feet (15 240 mm).
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 44
    - 45
    quote: 3. A dead-end corridor shall not be limited in length where the length of the dead-end corridor is less than 2.5
      times the least width of the dead-end corridor.
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 46
    - 47
    quote: 4. In Group I-2, Condition 2 occupancies, the length of dead-end corridors that do not serve patient rooms or patient
      treat- ment spaces shall not exceed 30 feet (9144 mm).
  examples:
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Office corridor, NFPA 13, at 50 ft
        measures:
          corridor_dead_end_length: 50
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Exception 2: Group B, NFPA 13 (903.3.1.1): 50 ft at most.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Just past 50 ft
        measures:
          corridor_dead_end_length: 50.5
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Over 50 ft, and not under 2.5 x 6 = 15 ft.
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Apartment corridor, no sprinkler system
        measures:
          corridor_dead_end_length: 20
          corridor_dead_end_least_width: 5
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'No sprinkler system: 20 ft at most.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Just past 20 ft
        measures:
          corridor_dead_end_length: 20.5
          corridor_dead_end_least_width: 5
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'No sprinkler system: over 20 ft and not under 12.5 ft.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Short and wide
        measures:
          corridor_dead_end_length: 24
          corridor_dead_end_least_width: 10
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Exception 3: under 2.5 x 10 = 25 ft.'
  - given:
      occupancy_group: A-3
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Hall corridor, NFPA 13
        measures:
          corridor_dead_end_length: 30
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group A is not in exception 2: 20 ft even with NFPA 13.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
    parts:
      corridor:
      - id: p1
        name: NFPA 13R only
        measures:
          corridor_dead_end_length: 30
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Exception 2 asks for 903.3.1.1 (NFPA 13): a 13R system keeps 20 ft.'
  - given:
      occupancy_group: I-3
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Detention corridor
        measures:
          corridor_dead_end_length: 40
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Group I-3: exception 1''s 50 ft applies in Conditions 2, 3 and 4 (the condition is a person''s check).'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Hospital service corridor
        measures:
          corridor_dead_end_length: 28
          corridor_dead_end_least_width: 6
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Group I-2: exception 4''s 30 ft for Condition 2 corridors not serving patient rooms is a person''s check.'
  - given:
      occupancy_group: I-4
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor:
      - id: p1
        name: Day care corridor
        measures:
          corridor_dead_end_length: 30
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Group I-4 is not in this row (a mixed building is general''s flag): not applicable.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: '1020.5 and its exceptions for every group but I-4 (the rule “Dead end at most 20 ft, or under 2.5 x its width, I-4
    (BCNYS 1020.5)”): 20 ft; 50 ft in Groups B, E, F, I-1, M, R-1, R-2, S and U with an NFPA 13 system (903.3.1.1: exception
    2; a 13R system does not meet it); any length under 2.5 times the least width (exception 3). Exceptions 1 (Group I-3,
    Conditions 2 to 4: 50 ft) and 4 (Group I-2, Condition 2, corridors not serving patient rooms or treatment spaces: 30 ft)
    turn on a condition the architect doesn''t state yet, so within them it needs review, never a pass. As the I-4 rule: it
    applies where more than one exit or exit access doorway is required, and with one there is no limit, so it may only be
    stricter there. Hand-drafted in a Claude Code session (2026-11-23).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1020_2_h1_h2_h3
  kind: rule
  topic: means_of_egress
  title: Corridor rating, H-1, H-2, H-3 (BCNYS Table 1020.2)
  applies_when: occupancy_group in ["H-1", "H-2", "H-3"]
  check: (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and corridor_fire_rating_hours >= 1
  review_when:
  - when: sprinklered_903_3_1_2 and not sprinklered_903_3_1_1
    reason: 'Stated with an NFPA 13R or 13D system and no NFPA 13: note c counts 903.3.1.2 only where allowed, which the sprinkler
      sections decide for each group and Gordium doesn''t check, and the table''s other cells name no system, so whether this
      system is the one the column means is a person''s check (never a pass on it).'
  for_each: corridor
  when_none: not_applicable
  sources:
  - &id001
    file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 40
    - 41
    quote: 1020.2 Construction. Corridors shall be fire-resistance rated in accordance with Table 1020.2. The corridor walls
      required to be fire- resistance rated shall comply with Section 708 for fire partitions.
  - &id002
    file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 4
    - 6
    quote: REQUIRED FIRE-RESISTANCE RATING (hours) OCCUPANCY OCCUPANT LOAD SERVED BY CORRIDOR Without automatic sprinkler
      system With automatic sprinkler system
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 7
    - 7
    quote: H-1, H-2, H-3 All Not Permitted 1[fnc]
  - &id003
    file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 16
    - 16
    quote: c. Buildings equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1 or 903.3.1.2
      where allowed.
  examples:
  - given:
      occupancy_group: H-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Corridor at 1 hour
        measures:
          corridor_occupant_load: 5
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'NFPA 13: 1 hour, any occupant load.'
  - given:
      occupancy_group: H-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Corridor at half an hour
        measures:
          corridor_occupant_load: 5
          corridor_fire_rating_hours: 0.5
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under 1 hour.
  - given:
      occupancy_group: H-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: No sprinkler system
        measures:
          corridor_occupant_load: 5
          corridor_fire_rating_hours: 2
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Not Permitted without a sprinkler system, whatever the rating.
  - given:
      occupancy_group: H-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13R only
        measures:
          corridor_occupant_load: 5
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Note c: 903.3.1.2 only where allowed.'
  - given:
      occupancy_group: H-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: 'Table 1020.2''s row for Groups H-1, H-2 and H-3: every corridor, whatever its occupant load; Not Permitted without
    a sprinkler system (fails whatever its rating), 1 hour with one (note c). Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
