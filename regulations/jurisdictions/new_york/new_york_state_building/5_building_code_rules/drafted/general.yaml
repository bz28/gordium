    - 22
    - 24
    quote: 1007.1.2 Three or more exits or exit access doorways. Where access to three or more exits is required, not less
      than two exit or exit access doorways shall be arranged in accordance with the provisions of Section 1007.1.1. Additional
      required exit or exit access doorways shall be arranged a reasonable distance apart so that if one becomes blocked,
      the others will be available.
