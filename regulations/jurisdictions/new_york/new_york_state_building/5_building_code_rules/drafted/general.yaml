    note: 'The fire barrier between the building and an interior exit stairway or ramp has the rating Section 1023 asks (the
      book''s words name 1023.1; its 1023.2 gives at least 2 hours where the stairway or ramp connects four stories or more
      and at least 1 hour where fewer, counting basements but not mezzanines, and at least the rating of the floor assembly
      it passes through, though it need not be more than 2 hours; except as 1023.2 allows for Group I-3 per 408.3.8, exit
      stairways within an atrium enclosed per 404.6, and exit stairways per 510.2): an enclosure''s rating isn''t in the model,
