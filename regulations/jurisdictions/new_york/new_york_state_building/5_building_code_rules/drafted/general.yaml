    - 16
    quote: 1005.3.2 Other egress components. The capacity, in inches, of means of egress components other than stairways shall
      be calcu- lated by multiplying the occupant load served by such component by a means of egress capacity factor of 0.2
      inch (5.1 mm) per occupant.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 18
    - 22
    quote: 1. For other than Group H and I-2 occupancies, the capacity, in inches, of means of egress components other than
      stair- ways shall be calculated by multiplying the occupant load served by such component by a means of egress capacity
      factor of 0.15 inch (3.8 mm) per occupant in buildings equipped throughout with an automatic sprinkler system installed
      in accordance with Section 903.3.1.1 or 903.3.1.2 and an emergency voice/alarm communication system in accordance with
      Section 907.5.2.2.
  examples:
