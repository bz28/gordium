    expect: not_applicable
    note: 'Not an assembly occupancy: not applicable.'
  notes: '1004.9: every room or space that is an assembly occupancy posts its occupant load near its main exit or exit access
    doorway; a sign isn''t in the model. Hand-drafted in a Claude Code session (2026-11-23, section group 3).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_407_4_2_sleeping_room_travel
  kind: rule
  topic: means_of_egress
