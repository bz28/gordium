- id: general.bc_1010_1_doors_general
  kind: flag
  topic: means_of_egress
  title: Doors recognizable as doors, no mirrors, not concealed (BCNYS 1010.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
    - 28
    - 36
    quote: 1010.1 General. Doors in the means of egress shall comply with the requirements of Sections 1010.1.1 through 1010.3.4.
      Exterior exit doors shall also comply with the requirements of Section 1022.2. Gates in the means of egress shall comply
      with the requirements of Sections 1010.4 and 1010.4.1. Turnstiles in the means of egress shall comply with the requirements
      of Sections 1010.5 through 1010.5.4. Doors, gates and turnstiles provided for egress purposes in numbers greater than
      required by this code shall comply with the requirements of this section. Doors in the means of egress shall be readily
      distinguishable from the adjacent construction and finishes such that the doors are easily recognizable as doors. Mirrors
      or similar reflecting materials shall not be used on means of egress doors. Means of egress doors shall not be concealed
      by curtains, drapes, decorations or similar materials.
  examples:
  - given: {}
    expect: needs_review
    note: 'Doors in the means of egress are easily recognizable as doors, carry no mirrors or similar reflecting materials
      and aren''t concealed by curtains, drapes or decorations; exterior exit doors also meet 1022.2, gates 1010.4 and 1010.4.1,
      and turnstiles 1010.5 to 1010.5.4 (none brought in): what a door looks like isn''t in the model, so a person''s check.
      1010.1.1''s, 1010.1.2''s and 1010.1.2.1''s are rules of their own; 1010.1.3 to 1010.3.4 follow in section group 6c.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 6a. 1010.1 applies the rest of Section 1010 to
    every door in the means of egress, extra doors included ("in numbers greater than required"): the door rules read every
    door the model gives, required or not.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_1_door_width
  kind: rule
  topic: means_of_egress
  title: Door clear width at least 32 in, from one leaf of a pair (BCNYS 1010.1.1)
  check: moe_door_clear_width >= 32
  review_when:
  - when: moe_door_clear_width >= 32 and moe_door_leaves != 1
    reason: 'Two leaves with no mullion between them, a mullioned pair not stated at its narrower leaf''s own opening, or how
      many isn''t stated: 1010.1.1 asks one leaf (each opening of a mullioned pair) for the 32 in, and the maker''s clear
      opening may be the whole pair''s: a person checks each leaf.'
  - when: moe_door_clear_width >= 32 and moe_door_clear_width < 41.5 and occupancy_group in ["I-2", "mixed"]
    reason: 'Group I-2 (stated, or not ruled out in a building of two or more groups): a door used for the movement of beds
      needs 41 1/2 in, and which doors are isn''t shown: a person checks.'
  - when: moe_door_clear_width < 32 and occupancy_group in ["I-1", "R-2", "R-3", "R-4", "mixed"] and not (moe_door_exit and
      not moe_door_exterior) and not (moe_door_to_corridor and not corridors_within_dwelling_units)
    reason: 'Under 32 in, but exceptions 1 and 6 don''t ask the width of a door in a dwelling or sleeping unit not required
      to be an Accessible, Type A or Type B unit (Groups R-2 and R-3: a door not part of the required means of egress; Groups
      I-1, R-2, R-3 and R-4: an interior egress door), and whether this door is one isn''t shown: a person checks.'
  - when: moe_door_clear_width >= 28 and moe_door_clear_width < 32 and occupancy_group in ["I-3", "mixed"]
    reason: 'Under 32 in, but exception 2 allows 28 in for a door to a Group I-3 resident sleeping unit not required to be
      an Accessible unit, and whether this door is one isn''t shown: a person checks.'
  - when: moe_door_clear_width < 32 and moe_door_to_room_under_10_sf
    reason: 'Under 32 in, but one side is a room under 10 sq ft, and exception 3 doesn''t limit the width of a door to a storage
      closet that small: a person checks whether it is one.'
  - when: moe_door_clear_width >= 31.75 and moe_door_clear_width < 32 and not moe_door_exit and not (moe_door_to_corridor
      and not corridors_within_dwelling_units)
    reason: 'Under 32 in, but exception 7 allows 31.75 in for a door for user passage within a Type B unit, and whether this
      door is one isn''t shown: a person checks.'
  - when: moe_door_clear_width >= 20 and moe_door_clear_width < 32 and not (moe_door_exit and not moe_door_exterior)
    reason: 'Under 32 in, but exceptions 8 and 9 allow less for a door serving a sauna, toilet, shower, dressing, fitting
      or changing compartment (20 in; a shower compartment''s per the Plumbing Code of New York State''s 421.4.2), and whether
      this door is one isn''t shown: a person checks.'
  for_each: means_of_egress_door
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
    - 37
    - 43
    quote: 1010.1.1 Size of doors. The required capacity of each door opening shall be sufficient for the occupant load thereof
      and shall provide a minimum clear opening width of 32 inches (813 mm). The clear opening width of doorways with swinging
      doors shall be measured between the face of the door and the frame stop, with the door open 90 degrees (1.57 rad). Where
      this section requires a minimum clear opening width of 32 inches (813 mm) and a door opening includes two door leaves
      without a mullion, one leaf shall provide a minimum clear opening width of 32 inches (813 mm). In Group I-2, doors serving
      as means of egress doors where used for the movement of beds shall provide a minimum clear opening width of 41 1/2 inches
      (1054 mm). The minimum clear open- ing height of doors shall be not less than 80 inches (2032 mm).
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
