- id: general.bc_1017_2_travel_distance
  kind: rule
  topic: means_of_egress
  title: Exit access travel 150 ft, 200 ft sprinklered (NFPA 13), I-4 (BCNYS 1017.2)
  applies_when: occupancy_group_i4
  check: egress_travel_distance <= (200 if sprinklered_903_3_1_1 else 150)
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 23
    - 23
    quote: 1017.2 Limitations. Exit access travel distance shall not exceed the values given in Table 1017.2.
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 38
    - 38
    quote: I-4 150 200[fnc]
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 56
    - 56
    quote: c. Buildings equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1.
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 40
    - 53
    quote: 'a. See the following sections for modifications to exit access travel distance requirements: Section 402.8: For
      the distance limitation in malls. Section 407.4: For the distance limitation in Group I-2. Sections 408.6.1 and 408.8.1:
      For the distance limitations in Group I-3. Section 411.2: For the distance limitation in special amusement areas. Section
      412.6: For the distance limitations in aircraft manufacturing facilities. Section 1006.2.2.2: For the distance limitation
      in refrigeration machinery rooms. Section 1006.2.2.3: For the distance limitation in refrigerated rooms and spaces.
      Section 1006.3.4: For buildings with one exit. Section 1017.2.2: For increased distance limitation in Groups F-1 and
      S-1. Section 1017.2.3: For increased distance limitation in Group H-5. Section 1030.7: For increased limitation in assembly
      seating. Section 3103.4: For temporary structures. Section 3104.9: For pedestrian walkways.'
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 60
    - 61
    quote: 1017.2.1 Exterior egress balcony increase. Exit access travel distances specified in Table 1017.2 shall be increased
      up to an additional 100 feet (30 480 mm) provided that the last portion of the exit access leading to the exit occurs
      on an exterior egress
  - file: gov.ny.building.2025.pdf
    page: 354
    lines:
    - 50
    - 51
    quote: 1030.7 Travel distance. The exit access travel distance shall comply with Section 1017. Where aisles are provided
      for seating, the distance shall be measured along the aisles and aisle accessways without travel over or on the seats.
  examples:
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p1
        name: First floor (the sheet)
        measures:
          egress_travel_distance: 130.667
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'The answer key (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 130''-8" within 200 ft (I-4, sprinklered
      per 903.3.1.1): passes.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p2
        name: Long travel
        measures:
          egress_travel_distance: 210
    rows:
    - part: p2
      outcome: fail
    expect: fail
    note: 210 ft is over 200 ft.
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p1
        name: Unsprinklered
        measures:
          egress_travel_distance: 130.667
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Not sprinklered: 150 ft (the 2009 IBC did not permit I-4 without one; this book does).'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      assembly_fixed_seating: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p3
        name: NFPA 13R only
        measures:
          egress_travel_distance: 180
    rows:
    - part: p3
      outcome: fail
    expect: fail
    note: 'An NFPA 13R system (903.3.1.2) only: note c gives the 200 ft to 903.3.1.1 systems alone, so 150 ft applies.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: with none, the rule needs review.'
  notes: 'Table 1017.2''s I-4 row: 150 ft without an automatic sprinkler system, 200 ft with one per 903.3.1.1 (note c). An
    I-4 building sprinklered only per 903.3.1.2 (NFPA 13R) does not meet note c, so 150 ft applies (the stricter reading).
    Measured as 1017.3 says (from the most remote point of each room, area or space, along the natural and unobstructed path,
    to the entrance to the nearest exit; stairways along their nosings, 1017.3.1): the exit access travel distance. Allowances
    that loosen it (1017.2.1''s exterior balcony; note a''s other sections) are their own flags and reviews. Hand-drafted
    in a Claude Code session (2026-11-21). Review round 2 (2026-11-23): fixed seating stated or not ruled out, in any group,
    needs review (1030.7); a space note a sends elsewhere, stated or not ruled out, needs review (as its sibling rows); over
    its distance within 1017.2.1''s balcony increase, taken or not stated, needs review.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
  review_when:
  - when: assembly_fixed_seating
    reason: 'The building may have a room or space used for assembly purposes with fixed seating, in any group (303.1.1, 303.1.2:
      small assembly spaces are part of their main occupancy; 303.1.3: an E school''s auditorium), stated or not ruled out:
      1030.7 measures its travel along the aisles and aisle accessways, never over or on the seats, which the routes don''t
      see, and its exceptions allow more for smoke-protected and open-air seating; a person checks. Over the row, too: 1030.7''s
      exceptions allow more for smoke-protected and open-air seating.'
  - when: special_egress_spaces
    reason: 'The building may hold a space Table 1017.2 note a gives its own distance (a mall, 402.8; a Group I-2 care suite,
      407.4; a special amusement area, 411.2; aircraft manufacturing, 412.6; a refrigeration machinery or refrigerated room,
      1006.2.2.2 and 1006.2.2.3: 150 ft unsprinklered; a temporary structure, 3103.4: 100 ft; a pedestrian walkway, 3104.9:
      200 ft), stated or not ruled out (as the architect states it): its limit isn''t this row''s, a person checks.'
  - when: egress_balcony_increase_taken and egress_travel_distance > (200 if sprinklered_903_3_1_1 else 150) and egress_travel_distance
      <= (200 if sprinklered_903_3_1_1 else 150) + 100
    reason: 'Over the table''s distance, but within 1017.2.1''s exterior egress balcony increase (up to 100 ft more), which
      the design takes or whose taking isn''t stated: a person checks (the rule “Exterior egress balcony increase, up to 100
      ft (BCNYS 1017.2.1)”).'
