  notes: 'Items 4, 5 and 6 are measurable from the path; item 1 (enclosed elevator lobbies, Section 3006, not brought in)
    and items 2 and 3 (adjoining rooms accessory to one another with a discernible path; Group H''s hazard) are a person''s.
    Item 6''s exceptions (a kitchen within the same dwelling or sleeping unit; a Group M stockroom) are not Group I-4''s;
    item 4''s exception covers only an elevator lobby''s electrically locked exit access door complying with 1010.2.14 (not
    brought in): such lobbies are counted apart (counted apart) and need review; every other lockable room, an enclosed elevator
    lobby included, is a locked room and fails. Hand-drafted in a Claude Code session (2026-11-21).'
