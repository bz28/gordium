- id: general.bc_708_4_3_fireblocks_draftstops
  kind: flag
  topic: means_of_egress
  title: Fireblocks or draftstops above fire partitions (BCNYS 708.4.3)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 174
    lines:
    - 6
    - 25
    quote: '708.4.3 Fireblocks and draftstops in combustible construction. In combustible construction where fire partitions
      do not extend to the underside of the floor or roof sheathing, deck or slab above, the space above and along the line
      of the fire partition shall be provided with one of the following: 1. Fireblocking up to the underside of the floor
      or roof sheathing, deck or slab above using materials complying with Section 718.2.1. 2. Draftstops up to the underside
      of the floor or roof sheathing, deck or slab above using materials complying with Section 718.3.1 for floors or Section
      718.4.1 for attics. Exceptions: 1. Buildings equipped with an automatic sprinkler system installed throughout in accordance
      with Section 903.3.1.1, or in accordance with Section 903.3.1.2 provided that protection is provided in the space between
      the top of the fire partition and underside of the floor or roof sheathing, deck or slab above as required for systems
      complying with Section 903.3.1.1. 2. Where corridor walls provide a sleeping unit or dwelling unit separation, draftstops
      shall only be required above one of the corridor walls. 3. In Group R-2 occupancies with fewer than four dwelling units,
      fireblocking and draftstops shall not be required. 4. In Group R-2 occupancies up to and including four stories in height
      in buildings not exceeding 60 feet (18 288 mm) in height above grade plane, the attic space shall be subdivided by draftstops
      into areas not exceeding 3,000 square feet (279 m[fn2]) or above every two dwelling units, whichever is smaller. 5.
      In Group R-3 occupancies with fewer than three dwelling units, fireblocking and draftstops shall not be required in
      floor assemblies.'
  examples:
  - given: {}
    expect: needs_review
    note: 'In combustible construction, where a fire partition stops short of the deck above, the space above it and along
      its line is fireblocked to the deck (718.2.1 materials) or draftstopped (718.3.1 for floors, 718.4.1 for attics); except
      a building sprinklered throughout per 903.3.1.1, or per 903.3.1.2 with sprinklers above the partition as 903.3.1.1 asks;
      where corridor walls separate units, a draftstop above one of them only; Group R-2 with fewer than four dwelling units,
      none; Group R-2 up to four stories and 60 feet above grade plane, the attic draftstopped into areas of at most 3,000
      square feet or above every two units, whichever is smaller; Group R-3 with fewer than three units, none in floor assemblies:
      the construction isn''t in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part c. 718.2.1, 718.3.1 and 718.4.1 aren't brought
    in. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
