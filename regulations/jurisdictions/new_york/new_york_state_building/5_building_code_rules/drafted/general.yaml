      equal to one-half the maximum horizontal dimension of the room. Exit access travel distance shall be determined as specified
      in Section 1017.1, but all portions of a refrigeration machinery room shall be within 150 feet (45 720 mm) of an exit
      or exit access doorway where such rooms are not protected by an approved automatic sprinkler system. Egress is allowed
      through adjoining refrigeration machinery rooms or adjoining refriger- ated rooms or spaces. Exit and exit access doorways
      shall swing in the direction of egress travel and shall be equipped with panic hardware, regardless of the occupant
      load served. Exit and exit access doorways shall be tight fitting and self-closing. 1006.2.2.3 Refrigerated rooms or
      spaces. Rooms or spaces having a floor area larger than 1,000 square feet (93 m[fn2]), contain- ing a refrigerant evaporator
      and maintained at a temperature below 68°F (20°C), shall have access to not less than two exits or exit access doorways.
      Exit access travel distance shall be determined as specified in Section 1017.1, but all portions of a refrigerated room
      or space shall be within 150 feet (45 720 mm) of an exit or exit access doorway where such rooms are not protected by
      an approved auto- matic sprinkler system. Egress is allowed through adjoining refrigerated rooms or spaces. Exception:
      Where using refrigerants in quantities limited to the amounts based on the volume set forth in the Mechanical Code of
      New York State. 1006.2.2.4 Electrical rooms. The location and number of exit or exit access doorways shall be provided
      for electrical rooms in accordance with Section 110.26 of NFPA 70 for electrical equipment rated 1,000 volts or less,
      and Section 110.33 of NFPA 70 for electrical equipment rated over 1,000 volts. Panic hardware shall be provided where
      required in accordance with Section 1010.2.8.2. 1006.2.2.5 Vehicular ramps. Vehicular ramps shall not be considered
      as an exit access ramp unless pedestrian facilities are provided.'
