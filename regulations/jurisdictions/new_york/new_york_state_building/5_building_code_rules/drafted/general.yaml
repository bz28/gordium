- id: general.bc_508_2_3_accessory_area
  kind: rule
  topic: dimensions
  title: Accessory occupancies at most 10% of the story (BCNYS 508.2.3)
  check: story_accessory_area <= 0.10 * story_net_floor_area and story_accessory_area <= 0.10 * story_gross_floor_area
  review_when:
  - when: story_accessory_area > 0.10 * story_net_floor_area and story_accessory_area <= 0.10 * story_gross_floor_area
    reason: 'Within 10 percent of the story''s gross floor area but over 10 percent of its net floor area: which 508.2.3 means
      is open (the open question); a person checks.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 147
    lines:
    - 18
    - 20
    quote: for the main occupancy of the building. Aggregate accessory occupancies shall not occupy more than 10 percent of
      the floor area of the story in which they are located and shall not exceed the tabular values for nonsprinklered buildings
      in Table 506.2 for each such accessory occupancy.
  - file: gov.ny.building.2025.pdf
    page: 47
    lines:
    - 21
    - 25
    quote: '[BE] FLOOR AREA, GROSS. The floor area within the inside perimeter of the exterior walls of the building under
      consideration, exclu- sive of vent shafts and courts, without deduction for corridors, stairways, ramps, closets, the
      thickness of interior walls, columns or other features. The floor area of a building, or portion thereof, not provided
      with surrounding exterior walls shall be the usable area under the horizontal projection of the roof or floor above.
      The gross floor area shall not include shafts with no openings or interior courts.'
  - file: gov.ny.building.2025.pdf
    page: 47
    lines:
    - 26
    - 27
    quote: '[BE] FLOOR AREA, NET. The actual occupied area not including unoccupied accessory areas such as corridors, stairways,
      ramps, toilet rooms, mechanical rooms and closets.'
  examples:
  - given: {}
    parts:
      story:
      - id: p1
        name: First floor (the sheet)
        measures:
          story_accessory_area: 1428
          story_gross_floor_area: 16509
          story_net_floor_area: 15000
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'The answer key''s storage (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 1,428 sf, with the sheet''s
      16,509 sf taken as the gross floor area and a net floor area of 15,000 sf (supposed: the sheet gives none): within 10%
      of both (1,500 and 1,650.9 sf): passes.'
  - given: {}
    parts:
      story:
      - id: p3
        name: First floor, net not given
        measures:
          story_accessory_area: 1428
          story_gross_floor_area: 16509
    rows:
    - part: p3
      outcome: needs_review
    expect: needs_review
    note: 'The sheet as it is: no net floor area, so whether 1,428 sf is within 10% of it is unknown: needs review, never
      pass.'
  - given: {}
    parts:
      story:
      - id: p4
        name: Between the readings
        measures:
          story_accessory_area: 1600
          story_gross_floor_area: 16509
          story_net_floor_area: 15000
    rows:
    - part: p4
      outcome: needs_review
    expect: needs_review
    note: '1,600 sf is within 10% of the gross floor area (1,650.9 sf) but over 10% of the net (1,500 sf): the answer turns
      on the reading (the open question).'
  - given: {}
    parts:
      story:
      - id: p2
        name: Storage over 10%
        measures:
          story_accessory_area: 1700
          story_gross_floor_area: 16509
          story_net_floor_area: 15000
    rows:
    - part: p2
      outcome: fail
    expect: fail
    note: '1,700 sf is more than 10% of the story''s gross floor area (1,650.9 sf): fails under both readings.'
  - given: {}
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: with none, the rule needs review.'
  open_questions:
  - '508.2.3''s ''floor area of the story'': the story''s gross floor area (202 FLOOR AREA, GROSS) or its net floor area (202
    FLOOR AREA, NET)?'
  research:
  - question: '508.2.3''s ''floor area of the story'': the story''s gross floor area (202 FLOOR AREA, GROSS) or its net floor
      area (202 FLOOR AREA, NET)?'
    searched:
    - 508.2.3
    - '508.2'
    - 202:floor_area_gross
    - 202:floor_area_net
    - 202:area_building
    sources:
    - rank: 3
      cite: 'ICC, IBC Interpretation 27-12 (2009 edition, issued 2012-07-24), quoting the 2009 IBC''s 508.2.1: ''Aggregate
        accessory occupancies shall not occupy more than 10 percent of the building area of the story in which they are located'':
        the earlier edition measured the story''s building area (202 AREA, BUILDING: within surrounding exterior walls, close
        to the gross floor area), not its net floor area'
      url: https://www3.iccsafe.org/cs/committeeArea/pdf_file/BU_09_27_12.pdf
    readings:
    - id: gross_floor_area
      reading: The story's gross floor area (202 FLOOR AREA, GROSS), as the earlier editions' 'building area of the story'
        measured it.
    - id: net_floor_area
      reading: 'The story''s net floor area (202 FLOOR AREA, NET): the book''s other defined measure of floor area.'
    why_open: 'The 2025 text prints ''floor area'' in roman (201.4: not a defined term, so its ordinary meaning or a referenced
      meaning), and the book defines floor area two ways; the earlier editions point to gross, but ICC''s commentary on the
      change of words (which may not be read by a script) and any New York interpretation were not found (searched 2026-11-22:
      ICC interpretations; Clark County NV code interpretations, unreachable; practitioners'' discussion, which is no authority
      and is not relied on). Gordium''s reading is gross; until the architects or the Department of State confirm it, a story
      between the two readings needs review.'
  notes: Passes only within 10 percent of the smaller reading (the net floor area), fails only over 10 percent of the larger
    (the gross), and needs review between them, or where either is not given. The second test (Table 506.2's tabular values,
    Section 506, not brought in) is the rule “Accessory occupancies within Table 506.2's values (BCNYS 508.2.3)”, which always
    needs review. Hand-drafted in a Claude Code session (2026-11-21).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
