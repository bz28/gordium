    - 32
    - 37
    quote: '714.5.4 Penetrations in smoke barriers. Penetrations in smoke barriers shall be protected by an approved through-penetration
      firestop system installed and tested in accordance with the requirements of UL 1479 for air leakage. The L rating of
      the system measured at 0.30 inch of water (74.7 Pa) in both the ambient temperature and elevated temperature tests shall
      not exceed either of the following: 1. 5.0 cfm per square foot (0.025 m[fn3]/ s × m [fn2]) of penetration opening for
      each through-penetration firestop system. 2. A total cumulative leakage of 50 cfm (0.024 m [fn3]/s) for any 100 square
      feet (9.3 m[fn2]) of wall area, or floor area.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Penetrations in smoke barriers are protected by an approved through-penetration firestop system installed and tested
      per UL 1479 for air leakage, its L rating at 0.30 inch of water in both the ambient and elevated temperature tests at
      most 5.0 cfm per square foot of penetration opening for each system, and at most 50 cfm in all for any 100 square feet
      of wall or floor area: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part d. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_1_1_alternative_protection
  kind: flag
  topic: means_of_egress
  title: An alternative fire-extinguishing system instead of sprinklers (BCNYS 903.1.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 269
    lines:
    - 17
    - 19
    quote: '[F] 903.1.1 Alternative protection. Alternative automatic fire-extinguishing systems complying with Section 904
      shall be permit- ted instead of automatic sprinkler system protection where recognized by the applicable standard and
      approved by the fire code official.'
  examples:
  - given: {}
    expect: needs_review
    note: 'An alternative automatic fire-extinguishing system complying with Section 904 takes the place of sprinkler protection
      only where the applicable standard recognizes it and the fire code official approves it (903.1.1): whether any is used
      instead of a sprinkler system 903.2 requires is a person''s check.'
  notes: '903.1.1: an alternative system per 904 is permitted instead of sprinklers where the standard recognizes it and the
    fire code official approves; the stated sprinkler system says nothing of one. Gordium''s reading (2026-11-27): such systems
    protect particular hazards or rooms; a stated "none" in a building 903.2 requires sprinklered fails the group''s rule,
    and this flag shows wherever an approved alternative might stand in. Hand-drafted in a Claude Code session (2026-11-27,
    Chapter 9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_mixed_occupancies
  kind: flag
  topic: means_of_egress
  title: Sprinkler systems in a building of two or more groups (BCNYS 903.2)
  applies_when: occupancy_group in ["mixed"]
  sources:
  - file: gov.ny.building.2025.pdf
    page: 269
    lines:
    - 20
    - 27
    quote: '[F] 903.2 Where required. Approved automatic sprinkler systems in new buildings and structures shall be provided
      in the locations described in Sections 903.2.1 through 903.2.12. Exception: Spaces or areas in telecommunications buildings
      used exclusively for telecommunications equipment, associated electrical power distribution equipment, batteries not
      required to have an automatic sprinkler system by Section 1207 of the Fire Code of New York State for energy storage
      systems and standby engines, provided that those spaces or areas are equipped throughout with an automatic smoke detection
      system in accordance with Section 907.2 and are separated from the remainder of the building by not less than 1-hour
      fire barriers constructed in accordance with Section 707 or not less than 2-hour horizontal assemblies constructed in
      accordance with Section 711, or both.'
  examples:
  - given: {}
    expect: needs_review
    note: 'In a building of two or more groups, each group''s own section (903.2.1 to 903.2.12) says where its fire areas
      need a sprinkler system, by their area, occupant load and story; Group R, H and I-1 to I-3 are their own rules. Spaces
      used only for telecommunications equipment, its power distribution, batteries Section 1207 of the Fire Code of New York
      State doesn''t require sprinklered and standby engines, in a telecommunications building, may be left out where they
      have smoke detection per 907.2 and are separated by 1-hour fire barriers per 707 or 2-hour horizontal assemblies per
      711: a person''s check.'
  - given:
      occupancy_group: B
    expect: not_applicable
    note: 'Not this building''s group or fact, as stated: not applicable.'
  notes: '903.2: sprinkler systems in new buildings where 903.2.1 to 903.2.12 say. The groups'' own rules read a building
    stated as one group; for two or more, each portion''s fire areas are a person''s check (Groups R, H and I-1 to I-3 have
    rules for a building of two or more groups too). The exception (telecommunications spaces) loosens it. Hand-drafted in
    a Claude Code session (2026-11-27, Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_1_1_group_a1_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group A-1, by the room (BCNYS 903.2.1.1)'
  applies_when: occupancy_group in ["A-1"]
  check: sprinklered_903_3_1_1
  review_when:
  - when: not sprinklered_903_3_1_1 and not space_floor_area > 12000 and not space_occupant_load >= 300
    reason: 'No NFPA 13 system stated, and this room settles none of 903.2.1.1''s conditions (its own floor area is 12,000
      square feet or less, its occupant load under 300 or not worked out); its fire area, which the model doesn''t show, may
      be larger than the room and hold more people, or may be on a floor other than a level of exit discharge serving it,
      or hold a multitheater complex: a person checks.'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 269
    lines:
    - 30
    - 36
    quote: '[F] 903.2.1.1 Group A-1. An automatic sprinkler system shall be provided throughout stories containing Group A-1
      occupancies and throughout all stories from the Group A-1 occupancy to and including the levels of exit discharge serving
      that occupancy where one of the following conditions exists: 1. The fire area exceeds 12,000 square feet (1115 m[fn2]).
      2. The fire area has an occupant load of 300 or more. 3. The fire area is located on a floor other than a level of exit
      discharge serving such occupancies. 4. The fire area contains a multitheater complex.'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 42
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.'
  examples:
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 13000
          space_occupant_load: 350
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group A-1 with an NFPA 13 system throughout (903.3.1.1): the system 903.2.1.1 requires.'
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Large room
        measures:
          space_floor_area: 12001
          space_occupant_load: 10
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'A room of over 12,000 square feet lies within one fire area, so its fire area is over 12,000 square feet: 903.2.1.1
      requires a system, and none is stated.'
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Crowded room
        measures:
          space_floor_area: 1000
          space_occupant_load: 300
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'A room with an occupant load of 300 lies within one fire area, so its fire area holds 300 or more: 903.2.1.1 requires
      a system, and none is stated.'
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Crowded room
        measures:
          space_floor_area: 1000
          space_occupant_load: 301
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'An NFPA 13R system in Group A-1: 903.3.1 permits 13R only in Group R (903.3.1.2), so it isn''t the system 903.2.1.1
      asks.'
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Small room
        measures:
          space_floor_area: 400
          space_occupant_load: 299
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A room under both limits: its fire area may be larger, a person checks.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Office
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Not Group A-1: not applicable.'
  - given:
      occupancy_group: A-1
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 400
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The sprinkler system isn''t stated: a person checks.'
  - given:
      occupancy_group: A-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No room in the model: with none, the rule needs review.'
  notes: '903.2.1.1: a sprinkler system where a Group A-1 fire area is over 12,000 square feet, or with an occupant load of
    300 or more, or its other conditions hold; 903.3.1 has it follow 903.3.1.1 (NFPA 13), since 903.3.1.2 and 903.3.1.3 permit
    13R and 13D only in Group R and dwellings. Fire areas aren''t in the model, but a room lies wholly within one (202 FIRE
    AREA: bounded by fire walls, fire barriers, exterior walls or horizontal assemblies, none of which runs through a room),
    so a room over 12,000 square feet, or with an occupant load of 300 or more settles it: with less than NFPA 13 stated,
    that room''s row fails. NFPA 13 passes. Any other room needs review while less than NFPA 13 is stated. Read for a building
    stated Group A-1 alone; a building of two or more groups is 903.2''s flag. Hand-drafted in a Claude Code session (2026-11-27,
    Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
