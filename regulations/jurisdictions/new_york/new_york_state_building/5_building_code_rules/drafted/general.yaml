  notes: '1007.1.1 applies where two exits are required. A story''s required number is 1006.3.3''s (Table 1006.3.3), and one
    will do where 1006.3.4 allows it: for Group I-4, Table 1006.3.4(2)''s I row (the first story above or below grade plane,
    at most 10 occupants and 75 ft of exit access travel), or item 2 (rooms that exit directly outside). So a close pair fails
    only on a Group I-4 story with no other occupancy that needs two (an upper story, more than 10 occupants or more than
    75 ft) and whose architect states item 2 is not relied on (stated no); where that fact is blank it needs review; where
    one may do, or the building is in another occupancy (or its occupancy isn''t stated), it needs review. Exception 1 (exit
    stairways or ramps joined by a 1-hour corridor complying with Section 1020: measured along the corridor) only loosens
    the test: a person''s check. the exits'' separation is of the two farthest-apart exits or exit access doorways, measured
    to any point of a doorway''s width (1007.1.1.1), so it is the best pair. Each space''s own are the rule “A space''s doorways
    1/2 the diagonal apart, 1/3 sprinklered (BCNYS 1007.1.1)”. Hand-drafted in a Claude Code session (2026-11-21). Every group
    (2026-11-23): where the building is of one group other than I-4, a close pair fails unless that group''s row of Table
    1006.3.4(1) or (2) (a story) or Table 1006.2.1 (a space) could allow one exit, read loosely (the larger value of its columns),
    so it never fails where one could do. Group 2 review round 1 (2026-11-24): a close pair in a one-group S-2 building needs
    review (1006.3.4 item 3: a mechanically parked garage may have one exit at any load). Group 2 review round 2 (2026-11-24):
    the loose test reads each Table 1006.3.4(2) row at its own larger column (the first story A, E, M, U 75 ft; S-1 29 occupants;
    the second story 75 ft), so a close pair fails wherever the row itself fails one exit. The I-4 row''s own test (the first
    story, 10 occupants, 75 ft) reads Group I-4 only.'
