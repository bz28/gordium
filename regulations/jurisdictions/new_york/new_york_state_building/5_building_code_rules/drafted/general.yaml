- id: general.bc_903_2_8_group_r_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group R (BCNYS 903.2.8)'
  applies_when: group_r_present
  check: sprinklered_903_3_1_1 or (occupancy_group in ["R-3"] and sprinklered_903_3_1_3)
  review_when:
  - when: occupancy_group in ["R-1", "R-2", "R-3", "R-4"] and sprinklered_903_3_1_2 and not sprinklered_903_3_1_1 and not
      stories_above_grade_plane > 4
    reason: 'An NFPA 13R system is permitted where the Group R occupancy is four stories or fewer above grade plane, its roof
      (Group R-2) or highest floor (other Group R) within 903.3.1.2''s height above the lowest level of fire department vehicle
      access and its lowest floor within 30 feet below it; the stories are the architect''s, the heights aren''t in the model:
      a person checks.'
  - when: occupancy_group in ["R-4"] and sprinklered_903_3_1_3 and not sprinklered_903_3_1_1
    reason: 'Group R-4 with an NFPA 13D system: 903.2.8.2 permits one in Condition 1 only, and the condition isn''t stated:
      a person checks.'
  - when: sprinklered_903_3_1_3 and not sprinklered_903_3_1_1 and (occupancy_group in ["R-1"] or (occupancy_group in ["R-2"]
      and (townhouse_units or r2_sleeping_units)))
    reason: 'An NFPA 13D system is permitted in one- and two-family dwellings and townhouses (903.3.1.3), which a Group R-1
      building, or a Group R-2 one of townhouse units or with sleeping units, may be, as the building states it or doesn''t
      rule out: a person checks.'
  - when: occupancy_group in ["mixed"] and not sprinklered_903_3_1_1 and (sprinklered_903_3_1_2 or sprinklered_903_3_1_3)
    reason: 'A building of two or more groups with an NFPA 13R or 13D system stated: 903.3.1.2 and 903.3.1.3 permit them only
      in some groups, and the one stated system can''t say which portion has which: a person checks.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 271
    lines:
    - 35
    - 42
    quote: '[F] 903.2.8 Group R. An automatic sprinkler system installed in accordance with Section 903.3 shall be provided
      throughout all buildings with a Group R fire area. [F] 903.2.8.1 Group R-3. An automatic sprinkler system installed
      in accordance with Section 903.3.1.3 shall be permitted in Group R-3 occupancies. [F] 903.2.8.2 Group R-4, Condition
      1. An automatic sprinkler system installed in accordance with Section 903.3.1.3 shall be permitted in Group R-4, Condition
      1 occupancies. [F] 903.2.8.3 Care facilities. An automatic sprinkler system installed in accordance with Section 903.3.1.3
      shall be permitted in care facilities with five or fewer individuals in a single-family dwelling.'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 45
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.
      [F] 903.3.1.1 NFPA 13 sprinkler systems. Where the provisions of this code require that a building or portion thereof
      be equipped throughout with an automatic sprinkler system in accordance with this section, sprinklers shall be installed
      through- out in accordance with NFPA 13 except as provided in Sections 903.3.1.1.1 through 903.3.1.1.3.'
  - file: gov.ny.building.2025.pdf
    page: 274
    lines:
    - 15
    - 26
    quote: '[F] 903.3.1.2 NFPA 13R sprinkler systems. Automatic sprinkler systems in Group R occupancies shall be permitted
      to be installed throughout in accordance with NFPA 13R where the Group R occupancy meets all of the following conditions:
      1. Four stories or fewer above grade plane. 2. For other than Group R-2 occupancies, the floor level of the highest
      story is 30 feet (9144 mm) or less above the lowest level of fire department vehicle access. For Group R-2 occupancies,
      the roof assembly is less than 45 feet (13 716 mm) above the lowest level of fire depart- ment vehicle access. The height
      of the roof assembly shall be determined by measuring the distance from the lowest required fire vehicle access road
      surface adjacent to the building to the eave of the highest pitched roof, the intersec- tion of the highest roof to
      the exterior wall, or the top of the highest parapet, whichever yields the greatest distance. 3. The floor level of
      the lowest story is 30 feet (9144 mm) or less below the lowest level of fire department vehicle access. The number of
      stories of Group R occupancies constructed in accordance with Sections 510.2 and 510.4 shall be measured from grade
      plane.'
  - file: gov.ny.building.2025.pdf
    page: 275
    lines:
    - 11
    - 12
    quote: '[F] 903.3.1.3 NFPA 13D sprinkler systems. Automatic sprinkler systems installed in one- and two-family dwellings;
      Group R-3; Group R-4, Condition 1; and townhouses shall be permitted to be installed throughout in accordance with NFPA
      13D.'
  examples:
  - given:
      group_r_present: true
      occupancy_group: R-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group R-2 with an NFPA 13 system throughout: a system per 903.3.'
  - given:
      group_r_present: true
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group R-2 with no sprinkler system: 903.2.8 requires one throughout every building with a Group R fire area.'
  - given:
      group_r_present: true
      occupancy_group: R-3
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group R-3 with an NFPA 13D system: 903.2.8.1 permits it.'
  - given:
      group_r_present: true
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
      stories_above_grade_plane: 4
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'NFPA 13R in a four-story Group R-2 building: 903.3.1.2''s heights above fire department vehicle access aren''t
      in the model.'
  - given:
      group_r_present: true
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
      stories_above_grade_plane: 5
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'NFPA 13R in a Group R-2 building of five stories above grade plane: 903.3.1.2 permits it only at four stories or
      fewer.'
  - given:
      group_r_present: true
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
      townhouse_units: false
      r2_sleeping_units: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'NFPA 13D in a Group R-2 building of dwelling units, not townhouses: more than two dwelling units (310.3), neither
      a one- or two-family dwelling nor a townhouse (903.3.1.3).'
  - given:
      group_r_present: true
      occupancy_group: R-4
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'NFPA 13D in Group R-4: Condition 1 only (903.2.8.2), not stated.'
  - given:
      group_r_present: true
      occupancy_group: mixed
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Two or more groups, one of them R, with no sprinkler system: the whole building needs one.'
  - given:
      group_r_present: false
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'No Group R occupancy: not applicable.'
  - given: {}
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The groups aren''t stated: a person checks.'
  - given: {group_r_present: true, occupancy_group: R-2, sprinklered_903_3_1_1: false, sprinklered_903_3_1_2: false,
      sprinklered_903_3_1_3: false}
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story in the model: with none, the rule needs review, never a pass or a fail on a building not drawn.'
  notes: '903.2.8: a sprinkler system per 903.3 "throughout all buildings with a Group R fire area", whatever their size:
    a building with a Group R occupancy among its stated groups, alone or with others. 903.3.1: NFPA 13 (903.3.1.1) unless
    903.3.1.2 (13R) or 903.3.1.3 (13D) permits otherwise. NFPA 13 passes; NFPA 13D passes in Group R-3 (903.2.8.1), needs
    review in R-4 (903.2.8.2: Condition 1 only) and in R-1 or R-2 where it may be a dwelling or of townhouse units (903.3.1.3),
    and fails in an R-2 of dwelling units, not townhouses (310.3: more than two dwelling units); NFPA 13R needs review (903.3.1.2''s
    heights aren''t in the model) and fails where the building states more than four stories above grade plane; a building
    of two or more groups with 13R or 13D needs review; no system fails. 903.2.8.3''s care facilities for five or fewer in
    a single-family dwelling are Group R-3 (308.2.4, 310.4.1). Read on each story the model holds (the system is "throughout"; the Building Code
    check reads its rules part by part), each story''s row the building''s answer. Hand-drafted in a Claude Code session (2026-11-27, Chapter
    9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_9_group_s1_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group S-1, by the room (BCNYS 903.2.9)'
  applies_when: occupancy_group in ["S-1"]
  check: sprinklered_903_3_1_1
  review_when:
  - when: not sprinklered_903_3_1_1 and not space_floor_area > 12000
    reason: 'No NFPA 13 system stated, and this room settles none of 903.2.9''s conditions (its own floor area is 12,000 square
      feet or less); its fire area, which the model doesn''t show, may be larger than the room, or may be more than three
      stories above grade plane, the S-1 fire areas of every floor together may exceed 24,000 square feet, or it may store
      commercial motor vehicles (over 5,000 square feet) or lithium-ion or lithium metal powered vehicles (over 500 square
      feet): a person checks.'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 271
    lines:
    - 43
    - 51
    quote: '[F] 903.2.9 Group S-1. An automatic sprinkler system shall be provided throughout all buildings containing a Group
      S-1 occu- pancy where one of the following conditions exists: 1. A Group S-1 fire area exceeds 12,000 square feet (1115
      m[fn2]). 2. A Group S-1 fire area is located more than three stories above grade plane. 3. The combined area of all
      Group S-1 fire areas on all floors, including any mezzanines, exceeds 24,000 square feet (2230 m[fn2]). 4. A Group S-1
      fire area used for the storage of commercial motor vehicles where the fire area exceeds 5,000 square feet (464 m[fn2]).
      5. A Group S-1 fire area used for the storage of lithium-ion or lithium metal powered vehicles where the fire area exceeds
      500 square feet (46.4 m[fn2]).'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 42
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.'
  examples:
  - given:
      occupancy_group: S-1
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 13000
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group S-1 with an NFPA 13 system throughout (903.3.1.1): the system 903.2.9 requires.'
  - given:
      occupancy_group: S-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Large room
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'A room of over 12,000 square feet lies within one fire area, so its fire area is over 12,000 square feet: 903.2.9
      requires a system, and none is stated.'
  - given:
      occupancy_group: S-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Large room
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'An NFPA 13R system in Group S-1: 903.3.1 permits 13R only in Group R (903.3.1.2), so it isn''t the system 903.2.9
      asks.'
  - given:
      occupancy_group: S-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Small room
        measures:
          space_floor_area: 12000
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A room of 12,000 square feet, not over: its fire area may be larger, a person checks.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Office
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Not Group S-1: not applicable.'
  - given:
      occupancy_group: S-1
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 400
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The sprinkler system isn''t stated: a person checks.'
  - given:
      occupancy_group: S-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No room in the model: with none, the rule needs review.'
  notes: '903.2.9: a sprinkler system where a Group S-1 fire area is over 12,000 square feet, or its other conditions hold;
    903.3.1 has it follow 903.3.1.1 (NFPA 13), since 903.3.1.2 and 903.3.1.3 permit 13R and 13D only in Group R and dwellings.
    Fire areas aren''t in the model, but a room lies wholly within one (202 FIRE AREA: bounded by fire walls, fire barriers,
    exterior walls or horizontal assemblies, none of which runs through a room), so a room over 12,000 square feet settles
    it: with less than NFPA 13 stated, that room''s row fails. NFPA 13 passes. Any other room needs review while less than
    NFPA 13 is stated. Read for a building stated Group S-1 alone; a building of two or more groups is 903.2''s flag. Hand-drafted
    in a Claude Code session (2026-11-27, Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
