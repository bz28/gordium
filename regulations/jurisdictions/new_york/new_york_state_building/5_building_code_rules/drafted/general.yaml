- id: general.bc_table_1006_3_4_2__s
  kind: rule
  topic: means_of_egress
  title: A story's one exit, S (BCNYS Table 1006.3.4(2))
  applies_when: occupancy_group in ["S-1", "S-2"]
  check: story_exit_count >= (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4) or story_exit_count
    > 0 and ((story_first_above_or_below_grade and egress_travel_distance <= (100 if sprinklered_903_3_1_1 else 75) or story_second_above_grade_plane
    and egress_travel_distance <= 75) and story_occupant_load <= 29)
