    lines:
    - 27
    - 33
    quote: Any facility not listed in this table 44 Access to and utilization of mechanical, plumbing or electrical systems
      or equipment 24 With an occupant load of less than 50 36 Within a dwelling unit 36 In Group E with a corridor having
      an occupant load of 100 or more 72 In corridors and areas serving stretcher traffic in ambulatory care facilities 72
      Group I-2 in areas where required for bed movement 96
  examples:
  - given:
      occupancy_group: mixed
    expect: needs_review
    note: 'A building of two or more groups: 1004.4 applies the means of egress requirements to each portion by its own
      occupancy, and a corridor two occupancies share meets the more stringent (Group E''s 72 in, Group I-2''s 96 in); which
      room is which occupancy isn''t marked yet, so a person checks.'
  - given:
      occupancy_group: R-2
    expect: not_applicable
    note: 'One group: the rule for every group checks it.'
  - given: {}
    expect: needs_review
    note: 'The occupancy isn''t stated: needs review.'
