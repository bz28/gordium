    note: 'No story in the model: with none, the rule needs review, never a pass or a fail on a building not drawn.'
  notes: '903.2.6: a sprinkler system throughout every building with a Group I fire area (I-1 to I-4), per 903.3.1.1 unless
    903.3.1.2 or 903.3.1.3 permits otherwise (903.3.1): exception 1 permits NFPA 13R in Group I-1 Condition 1 (needs review:
    the condition isn''t stated); exceptions 2 and 3 are Group I-4 day care''s (none at the level of exit discharge with an
    exterior exit door in every care room; NFPA 13 on the floors above or below it), not in the model, so I-4 with less than
    NFPA 13 needs review. NFPA 13D is never permitted in Group I. A building of two or more groups with an I-1, I-2 or I-3
