- id: general.bc_903_3_1_2_nfpa_13r_limits
  kind: flag
  topic: means_of_egress
  title: Where an NFPA 13R system is permitted (BCNYS 903.3.1.2)
  applies_when: nfpa_13r_stated
  sources:
  - file: gov.ny.building.2025.pdf
    page: 274
    lines:
    - 15
    - 26
    quote: '[F] 903.3.1.2 NFPA 13R sprinkler systems. Automatic sprinkler systems in Group R occupancies shall be permitted
      to be installed throughout in accordance with NFPA 13R where the Group R occupancy meets all of the following conditions:
      1. Four stories or fewer above grade plane. 2. For other than Group R-2 occupancies, the floor level of the highest
      story is 30 feet (9144 mm) or less above the lowest level of fire department vehicle access. For Group R-2 occupancies,
      the roof assembly is less than 45 feet (13 716 mm) above the lowest level of fire depart- ment vehicle access. The height
      of the roof assembly shall be determined by measuring the distance from the lowest required fire vehicle access road
      surface adjacent to the building to the eave of the highest pitched roof, the intersec- tion of the highest roof to
      the exterior wall, or the top of the highest parapet, whichever yields the greatest distance. 3. The floor level of
      the lowest story is 30 feet (9144 mm) or less below the lowest level of fire department vehicle access. The number of
      stories of Group R occupancies constructed in accordance with Sections 510.2 and 510.4 shall be measured from grade
      plane.'
  examples:
  - given:
      nfpa_13r_stated: true
    expect: needs_review
    note: 'An NFPA 13R system is permitted only in Group R occupancies four stories or fewer above grade plane (stories
      counted from grade plane where built per 510.2 or 510.4), the roof assembly less than 45 feet (Group R-2) or the highest
      floor 30 feet or less (other Group R) above the lowest level of fire department vehicle access, and the lowest floor 30
      feet or less below it. Chapter 10''s sprinklered allowances count a stated 13R system only in a building stated Group
      R, and not in a building stated Group R alone with more than four stories above grade plane (there it is no 903.3.1.2
      system, and 903.2.8''s rule fails it), taking its heights on the architect''s statement: whether these limits are met is
      a person''s check.'
  - given: {}
    expect: needs_review
    note: 'The sprinkler system isn''t stated: a person checks.'
  - given:
      nfpa_13r_stated: false
    expect: not_applicable
    note: 'No NFPA 13R system: not applicable.'
  notes: '903.3.1.2: an NFPA 13R system only in Group R, four stories or fewer above grade plane, within its heights of the
    lowest level of fire department vehicle access (not in the model). Chapter 10''s rules count a stated 13R system only in
    a building stated Group R (Chapter 10 plan, group 5a''s round 1; Chapter 9 part a''s review round 1 brought 1007.1.1,
    1007.1.2 and Group I-4''s two exits in line), and not in a building stated Group R alone with more than four stories
    above grade plane (review round 3: the stated stories make the sprinkler fact no), its heights taken on the architect''s
    statement, as the Chapter 10 plan decided (group 4b); 903.2.8''s rule fails a 13R system above four stated stories. Hand-drafted in a Claude Code
    session (2026-11-27, Chapter 9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_3_1_2_2_corridors_balconies_13r
  kind: flag
  topic: means_of_egress
  title: NFPA 13R's corridors and balconies in the means of egress (BCNYS 903.3.1.2.2)
  applies_when: nfpa_13r_stated
  sources:
  - file: gov.ny.building.2025.pdf
    page: 274
    lines:
    - 35
    - 41
    quote: '[F] 903.3.1.2.2 Corridors and balconies in the means of egress. Sprinkler protection shall be provided in corridors
      and for balconies in the means of egress where any of the following conditions apply: 1. Corridors with combustible
      floor or walls. 2. Corridors with an interior change of direction exceeding 45 degrees (0.79 rad). 3. Corridors that
      are less than 50 percent open to the outside atmosphere at the ends. 4. Open-ended corridors and associated exterior
      stairways and ramps as specified in Section 1027.6, Exception 3. 5. Egress balconies not complying with Sections 1021.2
      and 1021.3.'
  examples:
  - given:
      nfpa_13r_stated: true
    expect: needs_review
    note: 'With an NFPA 13R system, corridors and balconies in the means of egress are sprinklered where a corridor has a
      combustible floor or walls, turns more than 45 degrees inside, is less than 50 percent open to the outside at its ends,
      or is open-ended with exterior stairways and ramps per 1027.6 exception 3, and egress balconies not complying with 1021.2
      and 1021.3: a person''s check.'
  - given:
      nfpa_13r_stated: false
    expect: not_applicable
    note: 'No NFPA 13R system: not applicable.'
  notes: '903.3.1.2.2: NFPA 13R may leave some corridors and balconies unsprinklered; this section asks them sprinklered on
    any of five conditions, none in the model (the corridors'' materials, turns and openness, the balconies). Hand-drafted
    in a Claude Code session (2026-11-27, Chapter 9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
