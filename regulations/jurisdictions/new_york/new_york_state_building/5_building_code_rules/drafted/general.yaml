- id: general.bc_903_2_5_1_group_h_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group H (BCNYS 903.2.5.1)'
  applies_when: group_h_present
  check: sprinklered_903_3_1_1
  review_when:
  - when: occupancy_group in ["mixed"] and not sprinklered_903_3_1_1 and (sprinklered_903_3_1_2 or sprinklered_903_3_1_3)
    reason: 'A building of two or more groups with an NFPA 13R or 13D system stated: its Group H portion needs a system per
      903.3.1.1 (903.3.1 permits 13R only in Group R, 903.3.1.2, and 13D only in dwellings, Group R-3, Group R-4 Condition
      1 and townhouses, 903.3.1.3), and the one stated system can''t say which portion has which: a person checks.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 48
    - 50
    quote: '[F] 903.2.5 Group H. Automatic sprinkler systems shall be provided in high-hazard occupancies as required in Sections
      903.2.5.1 through 903.2.5.3. [F] 903.2.5.1 General. An automatic sprinkler system shall be installed in Group H occupancies.'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 45
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.
      [F] 903.3.1.1 NFPA 13 sprinkler systems. Where the provisions of this code require that a building or portion thereof
      be equipped throughout with an automatic sprinkler system in accordance with this section, sprinklers shall be installed
      through- out in accordance with NFPA 13 except as provided in Sections 903.3.1.1.1 through 903.3.1.1.3.'
  - file: gov.ny.building.2025.pdf
    page: 274
    lines:
    - 15
    - 16
    quote: '[F] 903.3.1.2 NFPA 13R sprinkler systems. Automatic sprinkler systems in Group R occupancies shall be permitted
      to be installed throughout in accordance with NFPA 13R where the Group R occupancy meets all of the following conditions:'
  - file: gov.ny.building.2025.pdf
    page: 275
    lines:
    - 11
    - 12
    quote: '[F] 903.3.1.3 NFPA 13D sprinkler systems. Automatic sprinkler systems installed in one- and two-family dwellings;
      Group R-3; Group R-4, Condition 1; and townhouses shall be permitted to be installed throughout in accordance with NFPA
      13D.'
  examples:
  - given:
      group_h_present: true
      occupancy_group: H-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group H with an NFPA 13 system throughout (903.3.1.1): the system 903.2.5.1 requires.'
  - given:
      group_h_present: true
      occupancy_group: H-3
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group H with no sprinkler system: 903.2.5.1 requires one.'
  - given:
      group_h_present: true
      occupancy_group: H-4
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'An NFPA 13R system in Group H: 903.3.1 has every system follow 903.3.1.1 unless 903.3.1.2 (Group R only) or 903.3.1.3
      permits otherwise, so it isn''t the system 903.2.5.1 asks.'
  - given:
      group_h_present: true
      occupancy_group: mixed
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Two or more groups, one of them H, with no sprinkler system: the Group H portion needs one.'
  - given:
      group_h_present: true
      occupancy_group: mixed
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Two or more groups with an NFPA 13R system: which portion has which system isn''t stated.'
  - given:
      group_h_present: false
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'No Group H occupancy: not applicable.'
  - given:
      group_h_present: true
      occupancy_group: H-2
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The sprinkler system isn''t stated: a person checks.'
  - given: {group_h_present: true, occupancy_group: H-2, sprinklered_903_3_1_1: false, sprinklered_903_3_1_2: false,
      sprinklered_903_3_1_3: false}
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story in the model: with none, the rule needs review, never a pass or a fail on a building not drawn.'
  notes: '903.2.5.1: "An automatic sprinkler system shall be installed in Group H occupancies", whatever their size; 903.3.1
    has it follow 903.3.1.1 (NFPA 13) unless 903.3.1.2 (NFPA 13R, Group R) or 903.3.1.3 (NFPA 13D, dwellings, R-3, R-4 Condition
    1, townhouses) permits otherwise, so only an NFPA 13 system passes, in a building of one group or two or more (any stated
    group H-1 to H-5); no sprinkler system fails, and 13R or 13D fails in a Group H building. 903.1.1''s alternative systems
    are their own flag. 903.2''s exception (spaces used only for telecommunications equipment, in a telecommunications building)
    leaves those spaces out, never a Group H occupancy''s own (Gordium''s reading, 2026-11-27: Fire Code 1207 governs the
    batteries it names). H-5''s design and 903.2.5.3''s pyroxylin plastics are flags. Read on each story the model holds (the system is "throughout"; the Building Code
    check reads its rules part by part), each story''s row the building''s answer. Hand-drafted in a Claude Code session
    (2026-11-27, Chapter 9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_903_2_5_2_h5_sprinkler_design
  kind: flag
  topic: means_of_egress
  title: Group H-5's sprinkler system throughout and its design (BCNYS 903.2.5.2)
  applies_when: group_h_present and occupancy_group in ["H-5", "mixed"]
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 51
    - 55
    quote: '[F] 903.2.5.2 Group H-5 occupancies. An automatic sprinkler system shall be installed throughout buildings containing
      Group H-5 occupancies. The design of the automatic sprinkler system shall be not less than that required by this code
      for the occu- pancy hazard classifications in accordance with Table 903.2.5.2. Where the design area of the automatic
      sprinkler system consists of a corridor protected by one row of sprinklers, the maxi- mum number of sprinklers required
      to be calculated is 13.'
  - file: gov.ny.building.2025.pdf
    page: 271
    lines:
    - 3
    - 9
    quote: '[F] TABLE 903.2.5.2—GROUP H-5 AUTOMATIC SPRINKLER SYSTEM DESIGN CRITERIA LOCATION OCCUPANCY HAZARD CLASSIFICATION
      Fabrication areas Ordinary Hazard Group 2 Service corridors Ordinary Hazard Group 2 Storage rooms without dispensing
      Ordinary Hazard Group 2 Storage rooms with dispensing Extra Hazard Group 2 Corridors Ordinary Hazard Group 2'
  examples:
  - given:
      group_h_present: true
      occupancy_group: H-5
    expect: needs_review
    note: 'A building containing Group H-5 is sprinklered throughout, designed for at least Table 903.2.5.2''s hazard classes
      (Ordinary Hazard Group 2 in fabrication areas, service corridors, corridors and storage rooms without dispensing; Extra
      Hazard Group 2 in storage rooms with dispensing), a corridor with one row of sprinklers calculated for at most 13: a
      person''s check.'
  - given:
      group_h_present: true
      occupancy_group: H-2
    expect: not_applicable
    note: 'Group H-2, not H-5: not applicable.'
  - given:
      group_h_present: false
      occupancy_group: mixed
    expect: not_applicable
    note: 'Two or more groups, none of them H: not applicable.'
  notes: '903.2.5.2 and Table 903.2.5.2: a building containing Group H-5 is sprinklered throughout, the design at least the
    table''s hazard class for each location; the design isn''t in the model. Narrowed to a stated H-5, or two or more groups
    with an H among them. Hand-drafted in a Claude Code session (2026-11-27, Chapter 9 part a).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
