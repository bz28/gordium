- id: general.bc_716_2_2_1_corridor_smoke_barrier_doors
  kind: flag
  topic: means_of_egress
  title: 20-minute doors in corridors and smoke barriers (BCNYS 716.2.2.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 187
    lines:
    - 49
    - 60
    quote: '716.2.2.1 Door assemblies in corridors and smoke barriers. Fire door assemblies required to have a minimum fire
      protection rating of 20 minutes where located in corridor walls or smoke barrier walls having a fire-resistance rating
      in accordance with Table 716.1(2) shall be tested in accordance with NFPA 252 or UL 10C without the hose stream test.
      Exceptions: 1. Viewports that require a hole not larger than 1 inch (25 mm) in diameter through the door, have not less
      than a 0.25-inch-thick (6.4 mm) glass disc and the holder is of metal that will not melt out where subject to temperatures
      of 1,700°F (927°C). 2. Corridor door assemblies in occupancies of Group I-2 shall be in accordance with Section 407.3.1.
      3. Unprotected openings shall be permitted for corridors in multitheater complexes where each motion picture audi- torium
      has not fewer than one-half of its required exit or exit access doorways opening directly to the exterior or into an
      exit passageway. 4. Horizontal sliding doors in smoke barriers that comply with Sections 408.6 and 408.8.4 in occupancies
      in Group I-3.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A fire door required by Table 716.1(2) to be rated 20 minutes in a rated corridor wall or a smoke barrier is tested
      per NFPA 252 or UL 10C without the hose stream test; except viewports (a hole at most 1 inch across, a glass disc at
      least 0.25 inch thick, a metal holder that won''t melt at 1,700 degrees F), Group I-2 corridor doors per 407.3.1, unprotected
      openings in multitheater complexes whose auditoriums each have at least half their required exits or exit access doorways
      opening directly outside or into an exit passageway, and Group I-3 horizontal sliding doors in smoke barriers per 408.6
      and 408.8.4: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part b. 407.3.1, 408.6 and 408.8.4 aren't brought in.
    Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_716_2_2_1_1_smoke_draft_control
  kind: flag
  topic: means_of_egress
  title: Smoke and draft control doors, at most 3.0 cfm a square foot (BCNYS 716.2.2.1.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 188
    lines:
    - 3
    - 8
    quote: '716.2.2.1.1 Smoke and draft control. The air leakage rate of the door assembly shall not exceed 3.0 cubic feet
      per minute per square foot (0.01524 m[fn3]/s × m[fn2]) of door opening at 0.10 inch of water (25 Pa) for both the ambient
      temperature and elevated temperature tests. Louvers shall be prohibited. Terminated stops shall be prohibited on doors
      required by Section 405.4.3 to comply with Section 716.2.2.1 and prohibited on doors required by Item 3 of Section 3006.3,
      or Section 3007.6.3 or 3008.6.3 to comply with this section. Exception: Elevator hoistway door openings protected in
      accordance with Section 3006.3.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A smoke and draft control door assembly (a 20-minute door in a rated corridor or smoke barrier, 716.2.2.1) leaks
      at most 3.0 cubic feet per minute per square foot of opening at 0.10 inch of water, in both the ambient and the elevated
      temperature tests; it has no louvers, and no terminated stops where 405.4.3, item 3 of 3006.3, 3007.6.3 or 3008.6.3
      sends a door to this section; elevator hoistway doors protected per 3006.3 aside: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part b. 405.4.3, 3006.3, 3007.6.3 and 3008.6.3 aren't
    brought in. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
