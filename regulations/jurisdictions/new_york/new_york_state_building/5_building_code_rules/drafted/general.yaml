      - id: p1
        name: Store corridor, 31 occupants, unrated
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Greater than 30 without a sprinkler system: 1 hour.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, 31 occupants, 1 hour
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 1 hour.
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, NFPA 13, unrated
