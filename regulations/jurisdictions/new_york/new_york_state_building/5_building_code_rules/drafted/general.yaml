  status: draft
- id: general.bc_1005_7_1_door_encroachment
  kind: flag
  topic: means_of_egress
  title: Doors take at most 7 in, or half, of the width (BCNYS 1005.7.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 37
    - 38
    quote: 1005.7 Encroachment. Encroachments into the required means of egress width shall be in accordance with the provisions
      of this section.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 39
    - 40
    quote: 1005.7.1 Doors. Doors, when fully opened, shall not reduce the required width by more than 7 inches (178 mm). Doors
      in any position shall not reduce the required width by more than one-half.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 42
    - 49
    quote: '1. Surface-mounted latch release hardware shall be exempt from inclusion in the 7-inch maximum (178 mm) encroach-
      ment where both of the following conditions exist: 1.1. The hardware is mounted to the side of the door facing away
      from the adjacent wall where the door is in the open position. 1.2. The hardware is mounted not less than 34 inches
      (865 mm) nor more than 48 inches (1219 mm) above the finished floor. 2. The restrictions on door swing shall not apply
      to doors within individual dwelling units and sleeping units of Group R-2 occupancies and dwelling units of Group R-3
      occupancies.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A door fully open takes at most 7 inches of the required width, in any position at most half (latch hardware 34
      to 48 inches up aside; not inside an R-2 dwelling or sleeping unit or an R-3 dwelling unit): the doors'' swing into
      a corridor isn''t drawn, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 5c. The corridor width rules read the least clear
    width between the walls and what is drawn; a door swinging into the corridor isn't in the interior description (route
    measuring decision 6), so its encroachment, and exception 1's latch hardware, are a person's check. Exception 2 (doors
    within R-2 dwelling or sleeping units and R-3 dwelling units) only loosens it.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_7_2_projections
  kind: flag
  topic: means_of_egress
