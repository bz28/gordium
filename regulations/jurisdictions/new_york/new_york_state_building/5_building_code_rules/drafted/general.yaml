- id: general.bc_table_1017_2_b
  kind: rule
  topic: means_of_egress
  title: Exit access travel distance, B (BCNYS Table 1017.2)
  applies_when: occupancy_group in ["B"]
  check: egress_travel_distance <= (300 if sprinklered_903_3_1_1 else 200)
  review_when:
  - when: egress_balcony_increase_taken and egress_travel_distance > (300 if sprinklered_903_3_1_1 else 200) and egress_travel_distance
      <= (300 if sprinklered_903_3_1_1 else 200) + 100
    reason: 'Over the table''s distance, but within 1017.2.1''s exterior egress balcony increase (up to 100 ft more), which
      the design takes or whose taking isn''t stated: the balcony (Section 1021) and its length are a person''s check (the
      rule “Exterior egress balcony increase, up to 100 ft (BCNYS 1017.2.1)”).'
  - when: special_egress_spaces
    reason: 'The building may hold a space Table 1017.2 note a gives its own distance (a mall, 402.8; a Group I-2 care suite,
      407.4; a special amusement area, 411.2; aircraft manufacturing, 412.6; a refrigeration machinery or refrigerated room,
      1006.2.2.2 and 1006.2.2.3: 150 ft unsprinklered; a temporary structure, 3103.4: 100 ft; a pedestrian walkway, 3104.9:
      200 ft), stated or not ruled out (as the architect states it): its limit isn''t this row''s, a person checks.'
  - when: building_has_atrium and egress_travel_distance > 200 and egress_travel_distance <= (300 if sprinklered_903_3_1_1
      else 200)
    reason: 'Over 200 ft, within the row, in a building with an atrium (stated or not ruled out): 1017.3.2.3 holds the part
      of the travel within the atrium (off the level of exit discharge) to 200 ft, not measured; a person checks.'
  - when: assembly_fixed_seating
    reason: 'The building may have a room or space used for assembly purposes with fixed seating, in any group (303.1.1, 303.1.2:
      small assembly spaces are part of their main occupancy; 303.1.3: an E school''s auditorium), stated or not ruled out:
      1030.7 measures its travel along the aisles and aisle accessways, never over or on the seats, which the routes don''t
      see, and its exceptions allow more for smoke-protected and open-air seating; a person checks. Over the row, too: 1030.7''s
      exceptions allow more for smoke-protected and open-air seating.'
  for_each: story
  when_none: needs_review
