# Commercial egress rules under the 2025 Building Code of New York State (README.md), for a Group I-4 day-care centre
# first: the limits Gordium's route measures feed, as the Maine rulebook drafted them from the 2009 IBC
# (regulations/jurisdictions/maine/maine_state/). Hand-drafted in a Claude Code session (claude-opus-5-5, 2026-11-21),
# checked by code (python -m rule_format). Every number a rule uses is the second reading's
# (text_verification.yaml: every piece read again from the page images by a reader who never saw the extracted
# text; the two tables also by each cell's position). Graded against the Maine architect's hand check of a day care
# (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml) as if the same building were in New York
# (rule_format/tests/test_ny_building_egress.py). Ithaca's checks run them for buildings the Building Code governs
# (2026-11-22: design_checker/code_scope.py). Drafts: approval is deferred.
district: general
rules:
