- id: general.bc_1020_6_air_movement
  kind: flag
  topic: means_of_egress
  title: Corridors not used as air ducts (BCNYS 1020.6)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 48
    - 48
    quote: 1020.6 Air movement in corridors. Corridors shall not serve as supply, return, exhaust, relief or ventilation air
      ducts.
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 50
    - 53
    quote: 1. Use of a corridor as a source of makeup air for exhaust systems in rooms that open directly onto such corridors,
      including toilet rooms, bathrooms, dressing rooms, smoking lounges and janitor closets, shall be permitted, provided
      that each such corridor is directly supplied with outdoor air at a rate greater than the rate of makeup air taken from
      the corridor. 2. Where located within a dwelling unit, the use of corridors for conveying return air shall not be prohibited.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 3
    - 6
    quote: 3. Where located within tenant spaces of 1,000 square feet (93 m[fn2]) or less in area, utilization of corridors
      for conveying return air is permitted. 4. Transfer air movement required to maintain the pressurization difference
      within health care facilities in accordance with ASHRAE 170.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 7
    - 8
    quote: '1020.6.1 Corridor ceiling. Use of the space between the corridor ceiling and the floor or roof structure above
      as a return air plenum is permitted for one or more of the following conditions:'
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 9
    - 16
    quote: 1. The corridor is not required to be of fire-resistance-rated construction. 2. The corridor is separated from
      the plenum by fire-resistance-rated construction. 3. The air-handling system serving the corridor is shut down upon
      activation of the air-handling unit smoke detectors required by the Mechanical Code of New York State. 4. The air-handling
      system serving the corridor is shut down upon detection of sprinkler water flow where the building is equipped throughout
      with an automatic sprinkler system. 5. The space between the corridor ceiling and the floor or roof structure above
      the corridor is used as a component of an approved engineered smoke control system.
  examples:
  - given: {}
    expect: needs_review
    note: 'The air system isn''t in the model: whether a corridor serves as a supply, return, exhaust, relief or ventilation
      duct, or a ceiling plenum above it is used as 1020.6.1 permits, is a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4c. Its exceptions (makeup air with outdoor air
    supplied, return air within a dwelling unit or a tenant space of 1,000 square feet or less, health care pressurization)
    and 1020.6.1''s five conditions for a return air plenum above the ceiling are the mechanical design''s, which Gordium
    doesn''t read.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1020_7_continuity
  kind: flag
  topic: means_of_egress
  title: A rated corridor is continuous to the exit (BCNYS 1020.7)
  applies_when: corridor_fire_rating_hours > 0
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 17
    - 20
    quote: 1020.7 Corridor continuity. Fire-resistance-rated corridors shall be continuous from the point of entry to an exit,
      and shall not be interrupted by intervening rooms. Where the path of egress travel within a fire-resistance-rated corridor
      to the exit includes travel along unenclosed exit access stairways or ramps, the fire-resistance rating shall be continuous
      for the length of the stairway or ramp and for the length of the connecting corridor on the adjacent floor leading to
      the exit.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 22
    - 23
    quote: 1. Foyers, lobbies or reception rooms constructed as required for corridors shall not be construed as intervening
      rooms. 2. Enclosed elevator lobbies as permitted by Item 1 of Section 1016.2 shall not be construed as intervening rooms.
  examples:
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Rated corridor
        measures:
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A rated corridor: whether its rating runs unbroken to the exit, with no intervening room (foyers, lobbies and reception
      rooms built as corridors, and enclosed elevator lobbies per 1016.2 item 1, aside), is a person''s check.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Unrated corridor
        measures:
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Stated unrated: 1020.7 asks continuity of rated corridors only.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Rating not stated
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The rating isn''t stated: a person checks.'
  - given: {}
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the flag doesn''t apply.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4c. The routes measure each corridor on its own
    story and don''t follow a rating through rooms, foyers or open stairs, so continuity is a person''s check wherever a
    corridor is rated or its rating isn''t stated.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_3_1_stairway_capacity
  kind: flag
  topic: means_of_egress
  title: Stairway capacity, 0.3 or 0.2 in per occupant (BCNYS 1005.3.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 313
    lines:
    - 51
    - 54
    quote: 1005.3.1 Stairways. The capacity, in inches, of means of egress stairways shall be calculated by multiplying the
      occupant load served by such stairways by a means of egress capacity factor of 0.3 inch (7.6 mm) per occupant. Where
      stairways serve more than one story, only the occupant load of each story considered individually shall be used in calculating
      the required capacity of the stairways serving that story.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 3
    - 13
    quote: 1. For other than Group H and I-2 occupancies, the capacity, in inches, of means of egress stairways shall be calculated
      by multiplying the occupant load served by such stairways by a means of egress capacity factor of 0.2 inch (5.1 mm)
      per occupant in buildings equipped throughout with an automatic sprinkler system installed in accordance with Section
      903.3.1.1 or 903.3.1.2 and an emergency voice/alarm communication system in accordance with Section 907.5.2.2. 2. Facilities
      with smoke-protected assembly seating shall be permitted to use the capacity factors in Table 1030.6.2 indi- cated for
      stepped aisles for exit access or exit stairways where the entire path for means of egress from the seating to the exit
      discharge is provided with a smoke control system complying with Section 909. 3. Facilities with open-air assembly seating
      shall be permitted to the capacity factors in Section 1030.6.3 indicated for stepped aisles for exit access or exit
      stairways where the entire path for means of egress from the seating to the exit discharge is open to the outdoors.
  examples:
  - given: {}
    expect: needs_review
    note: 'The stairways'' clear widths aren''t measured: 0.3 in for each occupant of the story they serve (0.2 with a sprinkler
      system and a voice/alarm system, other than Groups H and I-2; assembly seating''s own factors) is a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5a: the route measuring doesn''t give a stairway''s
    width; each story''s load is its own (1005.3.1''s second sentence), converging stairs are 1005.6''s (section group 5b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_3_2_other_components
  kind: flag
  topic: means_of_egress
  title: Other components' capacity, doors and ramps included (BCNYS 1005.3.2)
  sources:
