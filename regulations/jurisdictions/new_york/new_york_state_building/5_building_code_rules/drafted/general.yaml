    basement or the first, second or third story above grade plane may have one exit with at most 4 dwelling units and
    125 ft of exit access travel, only in a building sprinklered per 903.3.1.1 or 903.3.1.2 with emergency escape and
    rescue openings per 1031 (note a, the row''s R-2[a]); the fourth story and higher NP. Otherwise Table 1006.3.3''s
    two, three or four. Item 2 as in the other rows. Note c''s occupiable roofs are not measured. Hand-drafted in a
    Claude Code session (2026-11-23). Review round 4 (2026-11-23): a story allowed one exit only by its travel needs
    review while fixed seating (1030.7) or a space the code gives its own exits or travel limit is stated or not ruled
    out. The story''s place against the grade plane is worked out from the model (2026-11-25): the floor elevations of
    each level''s rooms and the ground the architect states (202 GRADE PLANE, STORY ABOVE GRADE PLANE, BASEMENT),
    measured only where every grade plane that ground allows gives the same place, else needs review. A basement is never
    proven (review round 6). With spot grades, Gordium''s reading, shown to confirm: the ground between spots lies between their
    values, so the grade plane is at most the highest finished spot grade outside the building itself; the slope-away rule can only lower
    it, so a basement is never proven from spot grades. No ground stated, or existing ground: needs review.'
