- id: general.bc_707_6_openings
  kind: flag
  topic: means_of_egress
  title: Openings in fire barriers, protected and limited in size (BCNYS 707.6)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 172
    lines:
    - 34
    - 58
    quote: '707.6 Openings. Openings in a fire barrier shall be protected in accordance with Section 716. Openings shall be
      limited to a maxi- mum aggregate width of 25 percent of the length of the wall, and the maximum area of any single opening
      shall not exceed 156 square feet (15 m[fn2]). Openings in enclosures for shafts, interior exit stairways and ramps and
      exit passageways shall also comply with Sections 713.7, 1023.4 and 1024.5, respectively. Exceptions: 1. Openings shall
      not be limited to 156 square feet (15 m[fn2]) where adjoining floor areas are equipped throughout with an automatic
      sprinkler system in accordance with Section 903.3.1.1. 2. Openings shall not be limited to 156 square feet (15 m[fn2])
      or an aggregate width of 25 percent of the length of the wall where the opening protective is a fire door serving enclosures
      for exit access stairways and ramps, and interior exit stair- ways and ramps. 3. Openings shall not be limited to 156
      square feet (15 m[fn2]) or an aggregate width of 25 percent of the length of the wall where the opening protective has
      been tested in accordance with ASTM E119 or UL 263 and has a minimum fire-resistance rating not less than the fire-resistance
      rating of the wall. 4. Fire window assemblies permitted in atrium separation walls shall not be limited to a maximum
      aggregate width of 25 percent of the length of the wall. 5. Openings shall not be limited to 156 square feet (15 m[fn2])
      or an aggregate width of 25 percent of the length of the wall where the opening protective is a fire door assembly in
      a fire barrier separating an enclosure for exit access stairways and ramps, and interior exit stairways and ramps from
      an exit passageway in accordance with Section 1023.3.1. 6. Openings providing entrance to an elevator car shall not
      be limited to 156 square feet (15 m[fn2]) or an aggregate width of 25 percent of the length of the wall where the opening
      protective is a fire door assembly in a fire barrier that is an elevator hoistway enclosure. 7. Openings shall not be
      limited to an aggregate width of 25 percent of the length of the wall where opening serves a shaft enclosure in accordance
      with Section 713. 8. Openings shall not be limited to an aggregate width of 25 percent of the length of the wall where
      opening serves a chute access room in accordance with Section 713.13.3 or a chute discharge room in accordance with
      Section 713.13.4.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Openings in a fire barrier are protected per Section 716, at most 25 percent of the wall''s length in all and at
      most 156 square feet each; openings in shaft, interior exit stairway and ramp, and exit passageway enclosures also meet
      713.7, 1023.4 and 1024.5. The limits are lifted where the adjoining floor areas are sprinklered throughout (903.3.1.1: the 156 square feet), fire doors
      serving exit access or interior exit stairway and ramp enclosures, protectives tested to ASTM E119 or UL 263 at the
      wall''s own rating, atrium fire windows (the 25 percent), the fire door between an exit stairway and its exit passageway
      (1023.3.1), elevator car entrances in a hoistway enclosure, and shaft and chute rooms (713, 713.13.3, 713.13.4; the
      25 percent): which walls are fire barriers and their openings'' sizes aren''t in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. 1023.3.1, 1023.4, 1024.5, 713.13.3 and 713.13.4
    aren't brought in; 713.7 is (its own flag), and 716's opening protectives are Chapter 7 part b's flags. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
