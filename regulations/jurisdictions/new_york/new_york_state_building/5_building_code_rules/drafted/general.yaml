- id: general.bc_1007_1_1_space_remoteness
  kind: rule
  topic: means_of_egress
  title: A space's doorways 1/2 the diagonal apart, 1/3 sprinklered (BCNYS 1007.1.1)
  check: space_is_exit or space_exit_count < 2 or space_exit_remoteness_ratio >= (1 / 3 if sprinklered_903_3_1_1 or sprinklered_903_3_1_2
    else 1 / 2)
  review_when:
  - when: not space_is_exit and space_exit_count >= 2 and not (space_exit_remoteness_ratio >= (1 / 3 if sprinklered_903_3_1_1
      or sprinklered_903_3_1_2 else 1 / 2)) and (not (occupancy_group_i4 or other_occupancy_present) or other_occupancy_present
      and occupancy_group == "mixed" or (space_occupant_load <= 10 and (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and
      space_common_path <= 75))
    reason: 'The space''s doorways are close together, but it may not need two: Table 1006.2.1''s I-4 row (10 or fewer occupants,
      sprinklered, a common path of 75 ft or less) lets it have one, or the space is in another occupancy (or its occupancy
      isn''t stated), whose row is a flag (the rule “Table 1006.2.1 in a building of two or more groups (BCNYS)”). Whether
      1007.1.1 applies to it is a person''s check.'
  - when: not space_is_exit and space_exit_count >= 2 and not space_exit_remoteness_ratio >= (1 / 3 if sprinklered_903_3_1_1
