# Commercial egress rules under the 2025 Building Code of New York State (README.md), for a Group I-4 day-care centre
# first: the limits Gordium's route measures feed, as the Maine rulebook drafted them from the 2009 IBC
# (regulations/jurisdictions/maine/maine_state/). Hand-drafted in a Claude Code session (claude-opus-5-5, 2026-11-21),
# checked by code (python -m rule_format). Every number a rule uses is the second reading's
# (text_verification.yaml: every piece read again from the page images by a reader who never saw the extracted
# text; the two tables also by each cell's position). Graded against the Maine architect's hand check of a day care
# (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml) as if the same building were in New York
# (rule_format/tests/test_ny_building_egress.py). No New York place inherits this folder yet, so no check runs these
# rules today. Drafts: approval is deferred.
district: general
rules:
- id: general.bc_308_5_classification
  kind: flag
  topic: uses
  title: Group I-4, day care facilities (BCNYS 308.5)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 79
    lines:
    - 29
    - 31
    quote: 308.5 Institutional Group I-4, day care facilities. Institutional Group I-4 occupancy shall include buildings and
      structures occupied by more than five persons of any age who receive custodial care for fewer than 24 hours per day
      by persons other than parents or guardians; relatives by blood, marriage or adoption; and in a place other than the
      home of the person cared for. This group shall
  examples:
  - given: {}
    expect: needs_review
    note: Which group the building is in decides every limit below; the architect states it (occupancy_group_i4), a person
      confirms.
  notes: The rules of this rulebook are drafted for Group I-4 only (their applies_when); a building in another group needs
    its own rules, so this flag always shows. Hand-drafted in a Claude Code session (2026-11-21).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
