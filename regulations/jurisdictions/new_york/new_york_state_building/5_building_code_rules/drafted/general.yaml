  check: story_exit_count >= (2 if story_occupant_load <= 500 else 3 if story_occupant_load <= 1000 else 4) or story_exit_count
    > 0 and not story_fourth_or_higher_above_grade_plane and story_dwelling_units <= 4 and egress_travel_distance <= 125 and
    (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and emergency_escape_openings_1031
