      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Detention corridor, no sprinkler system
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Not Permitted without a sprinkler system.
  - given:
      occupancy_group: I-3
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Detention corridor, half an hour
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 0.5
    rows:
    - part: p1
