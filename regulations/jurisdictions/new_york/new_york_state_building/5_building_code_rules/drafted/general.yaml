- id: general.bc_table_1020_2_a_b_e_f_m_s_u
  kind: rule
  topic: means_of_egress
  title: Corridor rating, A, B, E, F, M, S, U (BCNYS Table 1020.2)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "B", "E", "F-1", "F-2", "M", "S-1", "S-2", "U"]
  check: corridor_occupant_load <= 30 or sprinklered_903_3_1_1 or corridor_fire_rating_hours >= 1
  review_when:
  - when: occupancy_group in ["B", "E", "S-2"] and corridor_occupant_load > 30 and not sprinklered_903_3_1_1 and corridor_fire_rating_hours
      < 1
    reason: 'Under the table''s 1 hour, but within an exception the model can''t show: Group E where each classroom has a
      door straight outside at ground level and assembly rooms half their exit doors (exception 1); an open parking garage,
      Group S-2 (exception 3); a Group B space needing only one means of egress (exception 4): a person checks.'
  - when: corridor_occupant_load > 30 and not sprinklered_903_3_1_1 and (sprinklered_903_3_1_2 or sprinklered_903_3_1_3) and
      corridor_fire_rating_hours < 1
    reason: 'Stated with an NFPA 13R or 13D system and no NFPA 13: note c counts 903.3.1.2 only where allowed, which the sprinkler
      sections decide for each group and Gordium doesn''t check, and the table''s other cells name no system, so whether this
      system is the one the column means is a person''s check (never a pass on it).'
  for_each: corridor
  when_none: not_applicable
  sources:
  - *id001
  - *id002
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 9
    - 9
    quote: A, B, E, F, M, S, U Greater than 30 1 0
  - file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 43
    - 46
    quote: 1. A fire-resistance rating is not required for corridors in an occupancy in Group E where each room that is used
      for instruc- tion has not less than one door opening directly to the exterior and rooms for assembly purposes have not
      less than one- half of the required means of egress doors opening directly to the exterior. Exterior doors specified
      in this exception are required to be at ground level.
  - file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 49
    - 49
    quote: 3. A fire-resistance rating is not required for corridors in open parking garages.
  - file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 50
    - 51
    quote: 4. A fire-resistance rating is not required for corridors in an occupancy in Group B that is a space requiring
      only a single means of egress complying with Section 1006.2.
  examples:
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, 30 occupants, unrated
        measures:
          corridor_occupant_load: 30
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: '30 or fewer: no rating.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, 31 occupants, unrated
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Greater than 30 without a sprinkler system: 1 hour.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, 31 occupants, 1 hour
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 1 hour.
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Store corridor, NFPA 13, unrated
        measures:
          corridor_occupant_load: 300
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'With NFPA 13: 0 hours, whatever the rating (not stated here).'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: Office corridor, 31 occupants, unrated
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: Exception 4 (a Group B space with one means of egress) is a person's check.
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13R only, unrated
        measures:
          corridor_occupant_load: 31
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The column''s system: a person''s check.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: 'Table 1020.2''s row for Groups A, B, E, F, M, S and U: more than 30 occupants, 1 hour without a sprinkler system
    and 0 with one; 30 or fewer, none. The row''s cell names no system: NFPA 13 (903.3.1.1) counts, an NFPA 13R or 13D system
    (not allowed for these groups by their own scope) needs review, never a pass. Exceptions 1, 3 and 4 need review where
    the rating falls short. Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1020_2_r
  kind: rule
  topic: means_of_egress
  title: Corridor rating, R (BCNYS Table 1020.2)
  applies_when: occupancy_group in ["R-1", "R-2", "R-3", "R-4"]
  check: corridor_occupant_load <= 10 or ((sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and corridor_fire_rating_hours
    >= 0.5) or (occupancy_group in ["R-3", "R-4"] and sprinklered_903_3_1_3 and corridor_fire_rating_hours >= 1)
  review_when:
  - when: corridor_occupant_load > 10 and not ((sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and corridor_fire_rating_hours
      >= 0.5) and not (occupancy_group in ["R-3", "R-4"] and sprinklered_903_3_1_3 and corridor_fire_rating_hours >= 1) and
      corridors_within_dwelling_units
    reason: 'Unless the corridor is within a dwelling unit or sleeping unit (exception 2: no rating required there), which
      the building states or doesn''t rule out, the table''s rating isn''t met: a person checks.'
  - when: occupancy_group == "R-4" and sprinklered_903_3_1_3 and not (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and
      corridor_occupant_load > 10 and corridor_fire_rating_hours >= 1
    reason: 'Group R-4 with an NFPA 13D system and a 1-hour corridor: note d sends to 903.2.8, which permits 903.3.1.3 in
      Group R-4 only in Condition 1 (903.2.8.2); in Condition 1 the 1 hour is met, in Condition 2 the system isn''t one 903.3.1.3
      allows and the table''s Not Permitted applies. The condition isn''t stated: a person checks.'
  for_each: corridor
  when_none: not_applicable
  sources:
  - *id001
  - *id002
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 10
    - 10
    quote: R Greater than 10 Not Permitted 0.5[fnc]/1[fnd]
  - *id003
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 17
    - 18
    quote: d.Group R-3 and R-4 buildings equipped throughout with an automatic sprinkler system in accordance with Section
      903.3.1.3. See Section 903.2.8 for occupancies where auto- matic sprinkler systems are permitted in accordance with
      Section 903.3.1.3.
  - file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 47
    - 48
    quote: 2. A fire-resistance rating is not required for corridors contained within a dwelling unit or sleeping unit in
      an occupancy in Groups I-1 and R.
  examples:
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: 10 occupants, unrated
        measures:
          corridor_occupant_load: 10
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: '10 or fewer: no rating.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
