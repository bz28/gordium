    parts:
      means_of_egress_door:
      - id: p1
        name: Door between two rooms, 24 in clear
        measures:
          moe_door_clear_width: 24
          moe_door_leaves: 1
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: false
          moe_door_to_room_under_10_sf: false
    rows:
