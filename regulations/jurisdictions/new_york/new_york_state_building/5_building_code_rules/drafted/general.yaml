    parts:
      corridor:
      - id: p1
        name: 11 occupants, no sprinkler system
        measures:
          corridor_occupant_load: 11
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Greater than 10: Not Permitted without a sprinkler system.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13R, half an hour
        measures:
