    expect: pass
    note: 'Note c: 0.5 hour with 903.3.1.1 or 903.3.1.2.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13, unrated
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under half an hour.
  - given:
      occupancy_group: R-3
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: R-3, NFPA 13D, 1 hour
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Note d: 1 hour for Group R-3 or R-4 with 903.3.1.3.'
  - given:
      occupancy_group: R-4
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: R-4, NFPA 13D, 1 hour
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Note d''s 903.2.8 permits 13D in Group R-4 only in Condition 1 (903.2.8.2), not stated: a person checks.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: true
      corridors_within_dwelling_units: false
    parts:
      corridor:
      - id: p1
        name: R-2, NFPA 13D
        measures:
          corridor_occupant_load: 40
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Note d is Groups R-3 and R-4 only: an R-2 with 13D has the column without a sprinkler system, Not Permitted.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
      corridors_within_dwelling_units: true
    parts:
      corridor:
      - id: p1
        name: Maybe within a unit
        measures:
          corridor_occupant_load: 11
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Exception 2: a corridor within a dwelling unit needs no rating; a person checks which it is.'
  - given:
      occupancy_group: R-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: 'Table 1020.2''s row for Group R: more than 10 occupants, Not Permitted without a sprinkler system, 0.5 hour with
    903.3.1.1 or 903.3.1.2 (note c) and 1 hour for Groups R-3 and R-4 with 903.3.1.3 (note d); 10 or fewer, none. Exception
    2 (a corridor within a dwelling or sleeping unit needs no rating) needs review where it falls short while the building
    states it has such corridors or doesn''t rule them out. Note d''s 13D in Group R-4 (903.2.8.2: Condition 1 only) needs
    review. Note c''s 903.3.1.2 ''where allowed'' (903.3.1.2''s own limits: stories, height) is taken on the architect''s
    statement of the system, as the other tables'' rules take it. Hand-drafted in a Claude Code session (2026-11-25).'
