- id: general.bc_713_4_shaft_rating
  kind: flag
  topic: means_of_egress
  title: Fire-resistance rating of shaft enclosures, 1 or 2 hours (BCNYS 713.4)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 178
    lines:
    - 30
    - 34
    quote: '713.4 Fire-resistance rating. Shaft enclosures shall have a fire-resistance rating of not less than 2 hours where
      connecting four stories or more, and not less than 1 hour where connecting less than four stories. The number of stories
      connected by the shaft enclo- sure shall include any basements but not any mezzanines. Shaft enclosures shall have a
      fire-resistance rating not less than the floor assembly penetrated, but need not exceed 2 hours. Shaft enclosures shall
      meet the requirements of Section 703.2.1.1. Exception: Shafts having a reduced fire-resistance rating in high-rise buildings
      in accordance with Section 403.2.1.2.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A shaft enclosure is rated at least 2 hours where it connects four stories or more and at least 1 hour where it
      connects fewer, counting basements but not mezzanines, and at least the rating of the floor it passes through, though
      it need not be more than 2 hours; its walls meet 703.2.1.1 (nonsymmetrical walls); a high-rise building''s shafts may
      be reduced per 403.2.1.2: neither the shafts'' ratings nor the stories each connects are in the model, so a person''s
      check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. 403.2.1.2 isn't brought in; 703.2.1.1 is (its
    own flag). An exit access stairway or ramp enclosure (707.3.3, 1019) is rated by this section; an interior exit stairway's
    by 1023.2. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
