    - 33
    quote: '707.5.1 Supporting construction. The supporting construction for a fire barrier shall be protected to afford the
      required fire- resistance rating of the fire barrier supported. Hollow vertical spaces within a fire barrier shall be
      fireblocked in accordance with Section 718.2 at every floor level. Exceptions: 1. The maximum required fire-resistance
      rating for assemblies supporting fire barriers separating tank storage as provided for in Section 415.9.1.2 shall be
      2 hours, but not less than required by Table 601 for the building construction type. 2. Supporting construction for
      1-hour fire barriers required by Table 509.1 in buildings of Types IIB, IIIB and VB construc- tion is not required to
      be fire-resistance rated unless required by other sections of this code.'
