- id: general.bc_714_5_1_2_floor_firestop_systems
  kind: flag
  topic: means_of_egress
  title: Floor firestop systems, F and T ratings of at least 1 hour (BCNYS 714.5.1.2)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 181
    lines:
    - 44
    - 58
    quote: '714.5.1.2 Through-penetration firestop system. Through penetrations shall be protected by an approved through-penetra-
      tion firestop system installed and tested in accordance with ASTM E814 or UL 1479, with a minimum positive pressure
      differential of 0.01 inch of water (2.49 Pa). The system shall have an F rating/T rating of not less than 1 hour but
      not less than the required rating of the floor penetrated. Exceptions: 1. Floor penetrations contained and located within
      the cavity of a wall above the floor or below the floor do not require a T rating. 2. Floor penetrations by floor drains,
      tub drains or shower drains contained and located within the concealed space of a horizontal assembly do not require
      a T rating. 3. Floor penetrations of maximum 4-inch (102 mm) nominal diameter metal conduit or tubing penetrating directly
      into metal-enclosed electrical power switchgear do not require a T rating. 4. Penetrations in a single concrete floor
      by steel, ferrous or copper conduits, pipes, tubes or vents with a maximum 6-inch (152 mm) nominal diameter do not require
      a T rating. These penetrating items shall not be limited to the penetration of a single concrete floor, provided that
      the area of the opening through each floor does not exceed 144 square inches (92,900 mm[fn2]).'
  examples:
  - given: {}
    expect: needs_review
    note: 'Through penetrations of a rated floor, where not protected as tested in the assembly per 714.5.1.1, are protected
      by an approved through-penetration firestop system installed and tested per ASTM E814 or UL 1479 at a positive pressure
      differential of at least 0.01 inch of water, with an F rating and a T rating of at least 1 hour and at least the floor''s
      required rating; no T rating is needed for floor penetrations within a wall cavity above or below, floor, tub or shower
      drains within a horizontal assembly''s concealed space, metal conduit or tubing at most 4 inches nominal diameter penetrating
      directly into metal-enclosed electrical power switchgear, or steel, ferrous or copper conduits, pipes, tubes or vents
      at most 6 inches through a single concrete floor (more than one floor where each opening is at most 144 square inches):
      a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part d. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_714_5_2_floor_membrane_penetrations
  kind: flag
  topic: means_of_egress
  title: Membrane penetrations of rated floors and ceilings (BCNYS 714.5.2)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 181
    lines:
    - 59
    - 61
    quote: 714.5.2 Membrane penetrations. Penetrations of membranes that are part of a horizontal assembly shall comply with
      Section 714.5.1.1 or 714.5.1.2. Where floor/ceiling assemblies are required to have a fire-resistance rating, recessed
      fixtures shall be installed such that the required fire resistance will not be reduced.
  - file: gov.ny.building.2025.pdf
    page: 182
    lines:
    - 3
    - 29
    quote: 'Exceptions: 1. Membrane penetrations by steel, ferrous or copper conduits, pipes, tubes or vents, or concrete
      or masonry items where the annular space is protected either in accordance with Section 714.5.1 or to prevent the free
      passage of flame and the products of combustion. The aggregate area of the openings through the membrane shall not exceed
      100 square inches (64 500 mm[fn2]) in any 100 square feet (9.3 m[fn2]) of ceiling area in assemblies tested without
      penetrations. 2. Ceiling membrane penetrations of maximum 2-hour horizontal assemblies by steel electrical boxes that
      do not exceed 16 square inches (10 323 mm [fn2]) in area, provided that the aggregate area of such penetrations does
      not exceed 100 square inches (44 500 mm[fn2]) in any 100 square feet (9.29 m[fn2]) of ceiling area, and the annular
      space between the ceiling membrane and the box does not exceed 1/8 inch (3.2 mm). 3. Membrane penetrations by electrical
      boxes of any size or type, that have been listed as part of an opening protective material system for use in horizontal
      assemblies and are installed in accordance with the instructions included in the listing. 4. Membrane penetrations by
      listed electrical boxes of any material, provided that such boxes have been tested for use in fire-resistance-rated
      assemblies and are installed in accordance with the instructions included in the listing. The annular space between
      the ceiling membrane and the box shall not exceed 1/8 inch (3.2 mm) unless listed otherwise. 5. The annular space created
      by the penetration of a fire sprinkler, provided that it is covered by a metal escutcheon plate. 6. Noncombustible items
      that are cast into concrete building elements and that do not penetrate both top and bottom surfaces of the element.
      7. The ceiling membrane of a maximum 2-hour fire-resistance-rated horizontal assembly is permitted to be interrupted
      with the double wood top plate of a wall assembly that is sheathed with Type X gypsum wallboard, provided that all penetrating
      items through the double top plates are protected in accordance with Section 714.5.1.1 or 714.5.1.2 and the ceiling
      membrane is tight to the top plates. 8. Ceiling membrane penetrations by listed luminaires (light fixtures) or by luminaires
      protected with listed materials, which have been tested for use in fire-resistance-rated assemblies and are installed
      in accordance with the instruc- tions included in the listing.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A membrane penetration of a horizontal assembly meets 714.5.1.1 or 714.5.1.2, and recessed fixtures don''t reduce
      a rated floor/ceiling''s rating; except steel, ferrous or copper conduits, pipes, tubes or vents or concrete or masonry
      items with the annular space protected per 714.5.1 or against flame and the products of combustion, at most 100 square
      inches of openings in any 100 square feet of ceiling (in assemblies tested without penetrations); steel electrical boxes
      in ceilings of assemblies rated at most 2 hours, each at most 16 square inches, at most 100 square inches in any 100
      square feet, an annular space at most 1/8 inch; electrical boxes listed as part of an opening protective material system
      for use in horizontal assemblies, installed per their listing; listed electrical boxes of any material tested for use
      in fire-resistance-rated assemblies, installed per their listing (1/8 inch unless listed otherwise); the space around
      a sprinkler covered by a metal escutcheon plate; noncombustible items cast into concrete that don''t pass both faces;
      the double wood top plate of a wall sheathed with Type X gypsum board interrupting the ceiling of an assembly rated
      at most 2 hours, its penetrations protected per 714.5.1.1 or 714.5.1.2 and the ceiling tight to the plates; and ceiling
      membrane penetrations by listed luminaires, or luminaires protected with listed materials, tested for rated assemblies
      and installed per their listing: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part d. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
