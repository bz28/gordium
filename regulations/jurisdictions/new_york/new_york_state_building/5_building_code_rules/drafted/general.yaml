    expect: needs_review
    note: 'Protruding objects meet 1003.3 (not brought in): a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 5c. 1003.3's protruding-object limits (not brought
    in) aren't measured.
  drafted_by: claude_code/claude-opus-5-5
