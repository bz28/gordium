    expect: needs_review
    note: 'Doors, ramps and exit passageways aren''t measured for capacity: 0.2 in for each occupant they serve (0.15 with
      a sprinkler system and a voice/alarm system, other than Groups H and I-2) is a person''s check. Corridors are the rule
      of their own.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5a: 1005.3.2 for the components the Building Code
    check doesn''t read yet (section group 6 brings in the doors).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_4_continuity
