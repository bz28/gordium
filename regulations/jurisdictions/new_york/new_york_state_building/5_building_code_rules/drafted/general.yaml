    page: 342
    lines:
    - 51
    - 56
    quote: '1018.4 Aisle accessways in Group M. An aisle accessway shall be provided on not less than one side of each element
      within the merchandise pad. The minimum clear width for an aisle accessway not required to be accessible shall be 30
      inches (762 mm). The required clear width of the aisle accessway shall be measured perpendicular to the elements and
      merchandise within the merchan- dise pad. The 30-inch (762 mm) minimum clear width shall be maintained to provide a
      path to an adjacent aisle or aisle accessway. The common path of egress travel shall not exceed 30 feet (9144 mm) from
      any point in the merchandise pad. Exception: For areas serving not more than 50 occupants, the common path of egress
      travel shall not exceed 75 feet (22 860 mm).'
