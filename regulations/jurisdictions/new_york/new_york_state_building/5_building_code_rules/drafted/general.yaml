      > 0 and story_rooms_exit_directly_outside
    reason: 'Fewer exits than Table 1006.3.3 gives, and the story''s rooms exit directly outside at the level of exit discharge
      (1006.3.4 item 2, stated or not ruled out): one exit may do, a person checks.'
