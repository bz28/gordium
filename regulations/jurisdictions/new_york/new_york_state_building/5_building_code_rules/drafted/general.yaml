- id: general.bc_1006_2_1_two_exits
  kind: rule
  topic: means_of_egress
  title: Two exits over 10 occupants or a 75-ft common path, I-4 (BCNYS 1006.2.1)
  applies_when: occupancy_group_i4
  check: space_exit_count >= 2 or (space_occupant_load <= 10 and (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and space_common_path
    <= 75)
  review_when:
  - when: space_exit_count >= 2 and (space_common_path > 75 or not (sprinklered_903_3_1_1 or sprinklered_903_3_1_2))
    reason: 'Two exits or more, and a common path over 75 ft (or a building not sprinklered throughout, where the table gives
      Group I-4 no common path): whether Table 1006.2.1 caps the common path or only decides when a second exit is needed
      is open (open_questions); a person checks.'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 3
    - 5
    quote: 1006.2.1 Egress based on occupant load and common path of egress travel distance. Two exits or exit access doorways
      from any space shall be provided where the design occupant load or the common path of egress travel distance exceeds
      the values listed in Table 1006.2.1. The cumulative occupant load from adjacent rooms, areas or spaces shall be determined
      in accordance
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 26
    - 26
    quote: I-1, I-2[fnd], I-4 10 NP NP 75[fna]
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 36
    - 36
    quote: a.Buildings equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1 or 903.3.1.2.
      See Section 903 for occupancies where automatic sprin-
  examples:
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p1
        name: Classroom, 30 occupants, two doors
        measures:
          space_exit_count: 2
          space_occupant_load: 30
          space_common_path: 48.5
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'The answer key''s common path (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 48''-6" within 75
      ft (I-4, sprinklered), taken as a two-door space''s: passes, as the sheet found under the 2009 IBC''s 1014.3.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p6
        name: Two doors, long common path
        measures:
          space_exit_count: 2
          space_occupant_load: 30
          space_common_path: 80
    rows:
    - part: p6
      outcome: needs_review
    expect: needs_review
    note: 'Two doors, but a common path over 75 ft: fails if the table caps the common path, passes if it only decides when
      a second door is needed (the open question).'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p2
        name: Classroom, 30 occupants, one door
        measures:
          space_exit_count: 1
          space_occupant_load: 30
          space_common_path: 40
    rows:
    - part: p2
      outcome: fail
    expect: fail
    note: 'Over 10 occupants: two needed.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p3
        name: Office, 4 occupants, one door
        measures:
          space_exit_count: 1
          space_occupant_load: 4
          space_common_path: 30
    rows:
    - part: p3
      outcome: pass
    expect: pass
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p4
        name: Office, long common path
        measures:
          space_exit_count: 1
          space_occupant_load: 4
          space_common_path: 80
    rows:
    - part: p4
      outcome: fail
    expect: fail
    note: 'Its common path is over 75 ft: two needed.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p5
        name: Unsprinklered office
        measures:
          space_exit_count: 1
          space_occupant_load: 4
          space_common_path: 30
    rows:
    - part: p5
      outcome: fail
    expect: fail
    note: 'Not sprinklered: Table 1006.2.1 does not permit an I-4 space with one exit (NP).'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No space: the rule''s when_none (needs_review).'
  open_questions:
  - Does Table 1006.2.1's common path cap a story's common path of egress travel wherever it is measured, or only decide when
    a space needs a second exit or exit access doorway?
  research:
  - question: Does Table 1006.2.1's common path cap a story's common path of egress travel wherever it is measured, or only
      decide when a space needs a second exit or exit access doorway?
    searched:
    - 1006.2.1
    - Table 1006.2.1
    - '1017.3'
    - 202:common_path_of_egress_travel
    sources:
    - rank: 4
      cite: '2009 IBC 1014.3, as Maine adopted it (regulations/jurisdictions/maine/maine_state/; the architect''s sheet for
        19 Libby Street, Portland): ''the common path of egress travel shall not exceed 75 feet'' in occupancies other than
        H-1, H-2 and H-3, a cap; the 2025 BCNYS prints no such sentence: 1006.2.1 asks for two exits ''where the design occupant
        load or the common path of egress travel distance exceeds the values listed in Table 1006.2.1'', a table titled ''SPACES
        WITH ONE EXIT OR EXIT ACCESS DOORWAY'' (p.315)'
    why_open: The 2025 text reads as a trigger for a second exit, its predecessor as a cap; ICC's commentary (which would
      say which was meant) may not be read by any script, and no New York interpretation was found (2026-11-21). For the architects
      or the Department of State.
  notes: 'Table 1006.2.1''s I-4 row (I-1, I-2, I-4): 10 occupants, NP and NP without a sprinkler system, 75 ft with one (note
    a: 903.3.1.1 or 903.3.1.2). The 2009 IBC''s 1014.3 (the Maine sheet''s code) capped every common path at 75 ft; the 2025
    book prints the limit only in this table, titled ''spaces with one exit or exit access doorway'', and 1006.2.1 asks for
    two exits where the common path exceeds it, so a space with two exits and a common path over 75 ft (or any, unsprinklered)
    needs review (the open question), never a pass. Exception 1 (foyers and lobbies counted without the loads discharging
    through them) and exception 3 (unoccupied mechanical rooms and penthouses need not meet the common path) only loosen the
    test: a person''s check where they apply. The cumulative occupant load (1004.2, not brought in) is in the architect''s
    space_occupant_load. Most restrictive where the 2009 IBC applied (Maine): 1015.1 and Table 1015.1 set the same 10 for
    day care. Hand-drafted in a Claude Code session (2026-11-21).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
