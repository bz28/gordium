      of the floor or roof sheathing, deck or slab above or to the underside of the ceiling above where the ceiling membrane
      is constructed to limit the transfer of smoke. Exception: In Group I-2, a lay-in ceiling system shall be considered
      capable of limiting the transfer of smoke where the ceiling tiles weigh not less than 1 pound per square foot (4.882
      kg/m2) and where the HVAC system is fully ducted in accordance with Section 603 of the Mechanical Code of New York State.'
