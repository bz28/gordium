- id: general.bc_1007_1_1_remoteness
  kind: rule
  topic: means_of_egress
  title: Two exits at least 1/2 the diagonal apart, 1/3 sprinklered (BCNYS 1007.1.1)
  check: (exit_remoteness_ratio >= 1 / 2 or exit_remoteness_ratio >= 1 / 3 and (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2
    and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])))
  review_when:
  - when: story_exit_count < 2
    reason: 'Fewer than two exits on the story: whether two are required is the rule “Exits per story by occupant load, one
      where 1006.3.4 allows (BCNYS 1006.3.3)”''s question; a person checks.'
  - when: story_exit_count >= 2 and not ((exit_remoteness_ratio >= 1 / 2 or exit_remoteness_ratio >= 1 / 3 and (sprinklered_903_3_1_1
      or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])))) and (not (occupancy_group_i4 or other_occupancy_present)
      or other_occupancy_present and occupancy_group == "mixed" or story_rooms_exit_directly_outside or (occupancy_group_i4
      and story_first_above_or_below_grade and story_occupant_load <= 10 and egress_travel_distance <= 75))
    reason: 'The story''s exits are close together, but it may not need two: one exit may do here (1006.3.4: Table 1006.3.4(2)''s
      row, or rooms that exit directly outside), or the building is in another occupancy (or its occupancy isn''t stated).
      Whether 1007.1.1 applies to it is a person''s check.'
  - when: story_exit_count >= 2 and not (exit_remoteness_ratio >= 1 / 2 or exit_remoteness_ratio >= 1 / 3 and (sprinklered_903_3_1_1
      or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"]))) and other_occupancy_present and (occupancy_group
      in ["R-3", "R-4", "S-2"] or occupancy_group == "R-2" and not story_fourth_or_higher_above_grade_plane and story_dwelling_units
      <= 4 and egress_travel_distance <= 125)
    reason: 'A close pair in a building of one group other than I-4 whose own row could allow one exit (read loosely, sprinklered
      or not: Table 1006.3.4(1) or (2) for a story, Table 1006.2.1 for a space): two may not be required, a person checks
      (2026-11-23). Elsewhere two are required and a close pair fails.'
  - when: story_exit_count >= 2 and not (exit_remoteness_ratio >= 1 / 2 or exit_remoteness_ratio >= 1 / 3 and (sprinklered_903_3_1_1
      or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"]))) and other_occupancy_present and (story_first_above_or_below_grade
      and (occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "E", "M", "U"] and story_occupant_load <= 49 and egress_travel_distance
      <= 75 or occupancy_group in ["B", "F-1", "F-2"] and story_occupant_load <= 49 and egress_travel_distance <= 100 or occupancy_group
      == "S-1" and story_occupant_load <= 29 and egress_travel_distance <= 100 or occupancy_group in ["H-2", "H-3"] and story_occupant_load
      <= 3 and egress_travel_distance <= 25 or occupancy_group in ["H-4", "H-5", "I-1", "I-2", "I-3", "R-1", "R-2"] and story_occupant_load
      <= 10 and egress_travel_distance <= 75) or story_second_above_grade_plane and occupancy_group in ["B", "F-1", "F-2",
      "M", "S-1"] and story_occupant_load <= 29 and egress_travel_distance <= 75)
    reason: 'A close pair in a building of one group other than I-4 whose own row could allow one exit (read loosely, sprinklered
      or not: Table 1006.3.4(1) or (2) for a story, Table 1006.2.1 for a space): two may not be required, a person checks
      (2026-11-23). Elsewhere two are required and a close pair fails.'
  - when: story_exit_count >= 2 and sprinklered_903_3_1_2 and not sprinklered_903_3_1_1 and not occupancy_group in ["R-1",
      "R-2", "R-3", "R-4"] and exit_remoteness_ratio >= 1 / 3 and not exit_remoteness_ratio >= 1 / 2
    reason: 'An NFPA 13R system in a building not stated Group R: 903.3.1.2 permits one only in Group R occupancies (and in
      Group I-1 Condition 1, 903.2.6 exception 1), so 1007.1.1''s one-third for a sprinklered building may not apply; at one-third
      of the diagonal or more but under one-half, a person checks.'
