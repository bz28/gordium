- id: general.bc_table_1017_2_note_a
  kind: flag
  topic: means_of_egress
  title: 'Table 1017.2 note a: sections that change the distance (BCNYS)'
  sources:
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 40
    - 53
    quote: 'a. See the following sections for modifications to exit access travel distance requirements: Section 402.8: For
      the distance limitation in malls. Section 407.4: For the distance limitation in Group I-2. Sections 408.6.1 and 408.8.1:
      For the distance limitations in Group I-3. Section 411.2: For the distance limitation in special amusement areas. Section
      412.6: For the distance limitations in aircraft manufacturing facilities. Section 1006.2.2.2: For the distance limitation
      in refrigeration machinery rooms. Section 1006.2.2.3: For the distance limitation in refrigerated rooms and spaces.
      Section 1006.3.4: For buildings with one exit. Section 1017.2.2: For increased distance limitation in Groups F-1 and
      S-1. Section 1017.2.3: For increased distance limitation in Group H-5. Section 1030.7: For increased limitation in assembly
      seating. Section 3103.4: For temporary structures. Section 3104.9: For pedestrian walkways.'
  examples:
  - given:
      special_egress_spaces: true
    expect: needs_review
    note: 'A person checks whether the building has a mall, a Group I-2 or I-3 occupancy, a special amusement area, an aircraft
      manufacturing facility, a refrigeration machinery room or a refrigerated room, assembly seating, a temporary structure
      or a pedestrian walkway: each has its own distance (note a), not brought in.'
  - given: {}
    expect: needs_review
    note: 'Not stated: a person checks (note a).'
  - given:
      special_egress_spaces: false
    expect: not_applicable
    note: 'The architect states the building has none of note a''s or 1006.2.2''s spaces: not applicable.'
  notes: 'Note a''s sections change Table 1017.2''s distances for particular spaces the model doesn''t mark (some shorter:
    refrigeration machinery rooms and refrigerated rooms within 150 ft where not sprinklered, 1006.2.2.2 and 1006.2.2.3),
    so the rows'' rules may pass a building that holds one: this flag always shows. 1006.3.4 (one exit), 1017.2.2 (F-1, S-1)
    and 1017.2.3 (H-5) are this rulebook''s own rules and flags. Hand-drafted in a Claude Code session (2026-11-23). Review
    round 1 (2026-11-23): shown only where such a space is stated or not ruled out; every row of Table 1017.2 needs review
    then, never falling back on its own distance.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
  applies_when: special_egress_spaces
