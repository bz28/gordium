          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Rated walls comply with Section 708 for fire partitions (its rating, continuity, openings and penetrations are
      Chapter 7 part c''s flags): a person checks.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Unrated corridor
        measures:
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Stated unrated: no fire partition to check.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Rating not stated
        measures: {}
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The rating isn''t stated: a person checks.'
  - given: {}
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the flag doesn''t apply.'
  notes: '1020.2''s second sentence: corridor walls required to be rated comply with Section 708 (fire partitions: continuity,
    openings, doors; Chapter 7 part c''s flags); exception 5 permits unprotected openings on unrated exterior walls (Tables 705.5 and
    705.9, not brought in). Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
