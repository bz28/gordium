          space_egress_through_kitchen_storage: 0
          space_egress_sleeping_through_sleeping_or_toilet: 0
          space_egress_through_other_room: 1
          space_egress_through_electrically_locked_lobby: 0
    rows:
    - part: p4
      outcome: needs_review
    expect: needs_review
    note: 'Through an adjoining classroom: allowed only where they are accessory to one another with a discernible path (item
      2), a person''s judgment.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space:
      - id: p5
        name: Room past the elevator lobby
        measures:
          space_egress_through_locked_room: 0
          space_egress_through_kitchen_storage: 0
          space_egress_sleeping_through_sleeping_or_toilet: 0
          space_egress_through_other_room: 0
          space_egress_through_electrically_locked_lobby: 1
    rows:
    - part: p5
      outcome: needs_review
    expect: needs_review
    note: 'Through an elevator lobby whose exit access door is electrically locked: item 4''s exception, if the door complies
      with 1010.2.14 (not brought in): a person checks.'
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No space: the rule''s when_none (needs_review).'
  notes: 'Items 4, 5 and 6 are measurable from the path; item 1 (enclosed elevator lobbies, Section 3006, not brought in)
    and items 2 and 3 (adjoining rooms accessory to one another with a discernible path; Group H''s hazard) are a person''s.
    Item 6''s exceptions (a kitchen within the same dwelling or sleeping unit; a Group M stockroom) are not Group I-4''s;
    item 4''s exception covers only an elevator lobby''s electrically locked exit access door complying with 1010.2.14 (not
    brought in): such lobbies are counted apart (space_egress_through_electrically_locked_lobby) and need review; every other
    lockable room, an enclosed elevator lobby included, is a locked room and fails. Hand-drafted in a Claude Code session
    (2026-11-21).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1016_2_other_occupancies
  kind: flag
  topic: means_of_egress
  title: Intervening spaces in other occupancies (BCNYS 1016.2)
  applies_when: other_occupancy_present
  sources:
  - file: gov.ny.building.2025.pdf
    page: 340
    lines:
    - 51
    - 53
    quote: 3. In Group H occupancies, egress from a room or space is allowed to pass through adjoining or intervening rooms
      or areas provided that such adjoining rooms or areas are the same or lesser hazard occupancy group and provide a discernible
      path of egress travel to an exit.
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 4
    - 6
    quote: '1. Means of egress are not prohibited through a kitchen area serving adjoining rooms constituting part of the
      same dwelling unit or sleeping unit. 2. Means of egress are not prohibited through stockrooms in Group M occupancies
      where all of the following are met:'
  examples:
  - given:
      other_occupancy_present: true
    expect: needs_review
    note: 'The building holds another occupancy (other_occupancy_present): this rulebook''s rules are drafted for Group I-4
      only, so the rows and allowances for other groups need a person. Item 3 (Group H) and item 6''s exceptions (dwelling-unit
      kitchens, Group M stockrooms) are for them.'
  - given:
      other_occupancy_present: false
    expect: not_applicable
    note: 'The architect states it doesn''t apply: not applicable.'
  notes: Hand-drafted in a Claude Code session (2026-11-21).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
