    a one-exit space where a 1006.2.2 room is stated or not ruled out needs review. Review round 2 (2026-11-23): a room with
    fixed seating, in any group, stated or not ruled out, needs review over 1030.8''s 30 ft (75 ft). Review round 3 (2026-11-23):
    with fixed seating stated or not ruled out, the row needs review at any common path, as its travel does (202, 1030.7),
