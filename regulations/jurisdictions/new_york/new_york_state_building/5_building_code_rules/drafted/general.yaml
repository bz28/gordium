  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 318
    lines:
    - 22
    - 24
    quote: 1007.1.2 Three or more exits or exit access doorways. Where access to three or more exits is required, not less
      than two exit or exit access doorways shall be arranged in accordance with the provisions of Section 1007.1.1. Additional
      required exit or exit access doorways shall be arranged a reasonable distance apart so that if one becomes blocked,
      the others will be available.
  - file: gov.ny.building.2025.pdf
    page: 318
    lines:
    - 6
    - 8
    quote: 1007.1.1 Two exits or exit access doorways. Where two exits, exit access doorways, exit access stairways or ramps,
      or any combi- nation thereof, are required from any portion of the exit access, they shall be placed a distance apart
      equal to not less than one- half of the length of the maximum overall diagonal dimension of the building or area to
      be served measured in a straight line
  - file: gov.ny.building.2025.pdf
    page: 318
    lines:
    - 14
    - 16
    quote: 2. Where a building is equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1
      or 903.3.1.2, the separation distance shall be not less than one-third of the length of the maximum overall diagonal
      dimension of the area served.
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 45
    - 47
    quote: 1006.2.1.1 Three or more exits or exit access doorways. Three exits or exit access doorways shall be provided from
      any space with an occupant load of 501 to 1,000. Four exits or exit access doorways shall be provided from any space
      with an occu- pant load greater than 1,000.
  examples:
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
    parts:
