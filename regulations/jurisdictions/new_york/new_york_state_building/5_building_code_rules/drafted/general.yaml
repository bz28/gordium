- id: general.bc_903_2_7_group_m_sprinklers
  kind: rule
  topic: means_of_egress
  title: 'Sprinkler system required: Group M, by the room (BCNYS 903.2.7)'
  applies_when: occupancy_group in ["M"]
  check: sprinklered_903_3_1_1
  review_when:
  - when: not sprinklered_903_3_1_1 and not space_floor_area > 12000
    reason: 'No NFPA 13 system stated, and this room settles none of 903.2.7''s conditions (its own floor area is 12,000 square
      feet or less); its fire area, which the model doesn''t show, may be larger than the room, or may be more than three
      stories above grade plane, or the M fire areas of every floor together may exceed 24,000 square feet: a person checks.'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 271
    lines:
    - 22
    - 26
    quote: '[F] 903.2.7 Group M. An automatic sprinkler system shall be provided throughout buildings containing a Group M
      occupancy where one of the following conditions exists: 1. A Group M fire area exceeds 12,000 square feet (1115 m[fn2]).
      2. A Group M fire area is located more than three stories above grade plane. 3. The combined area of all Group M fire
      areas on all floors, including any mezzanines, exceeds 24,000 square feet (2230 m[fn2]).'
  - file: gov.ny.building.2025.pdf
    page: 273
    lines:
    - 41
    - 42
    quote: '[F] 903.3.1 Standards. Automatic sprinkler systems shall be designed and installed in accordance with Section
      903.3.1.1 unless otherwise permitted by Sections 903.3.1.2 and 903.3.1.3 and other chapters of this code, as applicable.'
  examples:
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 13000
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group M with an NFPA 13 system throughout (903.3.1.1): the system 903.2.7 requires.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Large room
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'A room of over 12,000 square feet lies within one fire area, so its fire area is over 12,000 square feet: 903.2.7
      requires a system, and none is stated.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Large room
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'An NFPA 13R system in Group M: 903.3.1 permits 13R only in Group R (903.3.1.2), so it isn''t the system 903.2.7
      asks.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Small room
        measures:
          space_floor_area: 12000
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A room of 12,000 square feet, not over: its fire area may be larger, a person checks.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space:
      - id: p1
        name: Office
        measures:
          space_floor_area: 12001
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Not Group M: not applicable.'
  - given:
      occupancy_group: M
    parts:
      space:
      - id: p1
        name: Main room
        measures:
          space_floor_area: 400
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The sprinkler system isn''t stated: a person checks.'
  - given:
      occupancy_group: M
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      space: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No room in the model: with none, the rule needs review.'
  notes: '903.2.7: a sprinkler system where a Group M fire area is over 12,000 square feet, or its other conditions hold;
    903.3.1 has it follow 903.3.1.1 (NFPA 13), since 903.3.1.2 and 903.3.1.3 permit 13R and 13D only in Group R and dwellings.
    Fire areas aren''t in the model, but a room lies wholly within one (202 FIRE AREA: bounded by fire walls, fire barriers,
    exterior walls or horizontal assemblies, none of which runs through a room), so a room over 12,000 square feet settles
    it: with less than NFPA 13 stated, that room''s row fails. NFPA 13 passes. Any other room needs review while less than
    NFPA 13 is stated. Read for a building stated Group M alone; a building of two or more groups is 903.2''s flag. Hand-drafted
    in a Claude Code session (2026-11-27, Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
