- id: general.bc_709_5_smoke_barrier_openings
  kind: flag
  topic: means_of_egress
  title: Openings in smoke barriers protected per Section 716 (BCNYS 709.5)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 175
    lines:
    - 3
    - 12
    quote: '709.5 Openings. Openings in a smoke barrier shall be protected in accordance with Section 716. Exceptions: 1.
      In Group I-1, Condition 2, Group I-2 and ambulatory care facilities, where a pair of opposite-swinging doors are installed
      across a corridor in accordance with Section 709.5.1, the doors shall not be required to be protected in accordance
      with Section 716. The doors shall be close fitting within operational tolerances, and shall not have a center mullion
      or under- cuts in excess of 3/4 inch (19.1 mm), louvers or grilles. The doors shall have head and jamb stops, and astragals
      or rabbets at meeting edges. Positive latching devices are not required. Factory-applied or field-applied protective
      plates are not required to be labeled. 2. In Group I-1, Condition 2, Group I-2 and ambulatory care facilities, special
      purpose horizontal sliding, accordion or fold- ing doors installed in accordance with Section 1010.3.3 and protected
      in accordance with Section 716.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Openings in a smoke barrier are protected per Section 716 (Table 716.1(2): a door at least 20 minutes; Table 716.1(3):
      a fire window 3/4 hour, OH-45 or W-60); except, in Group I-1 Condition 2, Group I-2 and ambulatory care facilities,
      a pair of opposite-swinging doors across a corridor per 709.5.1, close fitting, with no center mullion, undercuts over
      3/4 inch, louvers or grilles, with head and jamb stops and astragals or rabbets at the meeting edges (positive latching
      not required; protective plates need no label), and special-purpose horizontal sliding, accordion or folding doors per
      1010.3.3 protected per 716: the doors'' and windows'' ratings aren''t in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part c. 1010.3.3 isn't brought in; 709.5.1 and 716's
    door ratings are (their own flags). Shown for every building.
