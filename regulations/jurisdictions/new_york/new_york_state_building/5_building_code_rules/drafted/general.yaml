- id: general.bc_708_4_fire_partition_continuity
  kind: flag
  topic: means_of_egress
  title: Fire partitions run to the deck above, or a rated ceiling (BCNYS 708.4)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 173
    lines:
    - 29
    - 50
    quote: '708.4 Continuity. Fire partitions shall extend from the top of the foundation or floor/ceiling assembly below
      and be securely attached to one of the following: 1. The underside of the floor or roof sheathing, deck or slab above.
      2. The underside of a floor/ceiling or roof/ceiling assembly having a fire-resistance rating that is not less than the
      fire-resis- tance rating of the fire partition. Exceptions: 1. Fire partitions shall not be required to extend into
      a crawl space below where the floor above the crawl space has a mini- mum 1-hour fire-resistance rating. 2. Fire partitions
      serving as a corridor wall shall not be required to extend above the lower membrane of a corridor ceiling provided that
      the corridor ceiling membrane is equivalent to corridor wall membrane, and either of the following condi- tions is met:
      2.1. The room-side membrane of the corridor wall extends to the underside of the floor or roof sheathing, deck or slab
      of a fire-resistance-rated floor or roof above. 2.2. The building is equipped with an automatic sprinkler system installed
      throughout in accordance with Section 903.3.1.1 or 903.3.1.2, including automatic sprinklers installed in the space
      between the top of the fire partition and underside of the floor or roof sheathing, deck or slab above. 3. Fire partitions
      serving as a corridor wall shall be permitted to terminate at the upper membrane of the corridor ceiling assembly where
      the corridor ceiling is constructed as required for the corridor wall. 4. Fire partitions separating tenant spaces in
      a covered or open mall building complying with Section 402.4.2.1 shall not be required to extend above the underside
      of a ceiling. Such ceiling shall not be required to be part of a fire-resistance-rated assembly, and the attic or space
      above the ceiling at tenant separation walls shall not be required to be subdivided by fire partitions.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A fire partition runs from the foundation or floor below to the underside of the floor or roof sheathing, deck
      or slab above, or to a floor/ceiling or roof/ceiling assembly rated at least as the partition, fastened to it; except
      above a crawl space whose floor is rated at least 1 hour; a corridor wall whose ceiling membrane equals the wall''s,
      where the room side of the wall reaches a rated floor or roof above, or the building is sprinklered throughout per 903.3.1.1
      or 903.3.1.2 with sprinklers above the partition; a corridor wall ending at the upper membrane of a ceiling built as
      the wall; and mall tenant separations per 402.4.2.1, which may stop at the ceiling (the ceiling need not be rated, nor the attic above
      divided by fire partitions): heights above the ceiling aren''t
      in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part c. 402.4.2.1 isn't brought in. Shown for every
    building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
