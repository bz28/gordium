  open_questions:
  - Does Table 1006.2.1's common path cap a story's common path of egress travel wherever it is measured, or only decide when
    a space needs a second exit or exit access doorway?
  research:
  - question: Does Table 1006.2.1's common path cap a story's common path of egress travel wherever it is measured, or only
      decide when a space needs a second exit or exit access doorway?
    searched:
    - 1006.2.1
    - Table 1006.2.1
    - '1017.3'
    - 202:common_path_of_egress_travel
    sources:
    - rank: 4
      cite: '2009 IBC 1014.3, as Maine adopted it (regulations/jurisdictions/maine/maine_state/; the architect''s sheet for
        19 Libby Street, Portland): ''the common path of egress travel shall not exceed 75 feet'' in occupancies other than
        H-1, H-2 and H-3, a cap; the 2025 BCNYS prints no such sentence: 1006.2.1 asks for two exits ''where the design occupant
        load or the common path of egress travel distance exceeds the values listed in Table 1006.2.1'', a table titled ''SPACES
        WITH ONE EXIT OR EXIT ACCESS DOORWAY'' (p.315)'
    why_open: The 2025 text reads as a trigger for a second exit, its predecessor as a cap; ICC's commentary (which would
      say which was meant) may not be read by any script, and no New York interpretation was found (2026-11-21). For the architects
      or the Department of State.
  notes: 'Table 1006.2.1''s A, E, M row: 49 occupants; 75 ft (up to 30 occupants) and 75 ft (more) without an automatic sprinkler
    system, 75 ft with one (note a: 903.3.1.1 or 903.3.1.2; 903.3.1.2 permits an NFPA 13R system only in Group R occupancies
    (''Automatic sprinkler systems in Group R occupancies shall be permitted to be installed throughout in accordance with
    NFPA 13R''), and the table''s note sends the reader to Section 903 for where it is permitted: outside Group R a 13R system
    alone gets the column without a sprinkler system, and where only the sprinklered column would pass, a person checks the
    system). As the I-4 rule (the rule “Two exits over 10 occupants or a 75-ft common path, I-4 (BCNYS 1006.2.1)”): a space
    with two exits and a common path over the value needs review (open question 1); a space that is itself an exit (an exit
    stair enclosure) is not one 1006.2 counts. Exceptions 1 and 3 only loosen the test (a person''s check where they apply);
    the cumulative occupant load (1004.2) is in the space''s occupant load. Note c: a room or space used for assembly purposes
    with fixed seating follows 1030.8 (brought in: the rule “Fixed seating''s common path (BCNYS 1030.8)” and every row''s
    fixed-seating review), so any space needs review while fixed seating is stated or not ruled out. Hand-drafted in a Claude
    Code session (2026-11-23). Review round 1 (2026-11-23): a one-exit space where a 1006.2.2 room is stated or not ruled
    out needs review; Group A with fixed seating, and Group M with merchandise pads, stated or not ruled out, need review
    over 1030.8''s and 1018.4''s 30 ft (75 ft for fewer occupants), with any number of exits. Review round 2 (2026-11-23):
    a room with fixed seating, in any group, stated or not ruled out, needs review over 1030.8''s 30 ft (75 ft). Review round
    3 (2026-11-23): with fixed seating stated or not ruled out, the row needs review at any common path, as its travel does
    (202, 1030.7), where it would otherwise pass.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1006_2_1_b
  kind: rule
  topic: means_of_egress
  title: A space's one exit, B (BCNYS Table 1006.2.1)
  applies_when: occupancy_group in ["B"]
  check: space_is_exit or space_exit_count >= 2 or (space_occupant_load <= 49 and space_common_path <= (100 if (sprinklered_903_3_1_1
    or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else (100 if space_occupant_load <= 30
    else 75)))
  review_when:
  - when: not space_is_exit and space_exit_count >= 2 and space_common_path > (100 if (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2
      and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else (100 if space_occupant_load <= 30 else 75))
    reason: 'Two exits or more, and a common path over the row''s value (or no sprinkler system where the row gives none):
      whether Table 1006.2.1 caps the common path or only decides when a second exit is needed is open (the open question);
      a person checks.'
  - when: not space_is_exit and space_exit_count < 2 and sprinklered_903_3_1_2 and not sprinklered_903_3_1_1 and space_occupant_load
      <= 49 and space_common_path <= 100
    reason: 'One exit, within the row only with a sprinkler system, and the system is NFPA 13R (903.3.1.2) outside Group R:
      903.3.1.2 permits an NFPA 13R system only in Group R occupancies (''Automatic sprinkler systems in Group R occupancies
      shall be permitted to be installed throughout in accordance with NFPA 13R''), and the table''s note sends the reader
      to Section 903 for where it is permitted: outside Group R a 13R system alone gets the column without a sprinkler system,
      and where only the sprinklered column would pass, a person checks the system.'
  - when: not space_is_exit and special_egress_spaces and space_exit_count < 2 and (space_occupant_load <= 49 and space_common_path
      <= (100 if (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) else
      (100 if space_occupant_load <= 30 else 75)))
    reason: 'One exit within the row, in a building that may hold a room 1006.2.2 gives two exits by its use (a boiler, incinerator
      or furnace room over 500 sq ft with fuel-fired equipment over 400,000 Btu; a refrigeration machinery room or a refrigerated
      room over 1,000 sq ft; an electrical room per NFPA 70), stated or not ruled out (as the architect states it): a person
      checks.'
  - when: not space_is_exit and assembly_fixed_seating and (space_is_exit or space_exit_count >= 2 or (space_occupant_load
      <= 49 and space_common_path <= (100 if (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2 and occupancy_group in ["R-1",
      "R-2", "R-3", "R-4"])) else (100 if space_occupant_load <= 30 else 75))))
    reason: 'The building may have a room used for assembly purposes with fixed seating, in any group (303.1.1 to 303.1.3),
      stated or not ruled out: its common path is a portion of its exit access travel (202 COMMON PATH OF EGRESS TRAVEL),
      which 1030.7 measures along the aisles and aisle accessways, never over the seats, and 1030.8 caps at 30 ft from any
      seat (75 ft under 50 occupants; 50 ft smoke-protected or open-air); the routes measure it straight across the seats,
      so the figure can''t be trusted at any length: a person checks. (Only where the row would otherwise pass: a measured
      fail still fails, since the real path can only be longer.)'
