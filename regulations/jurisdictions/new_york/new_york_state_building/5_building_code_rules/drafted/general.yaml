    note: Which group the building is in decides every limit below; the architect states it, a person confirms.
  notes: Which group the building is in is the architect's statement (Project Information's occupancy groups); every limit
    reads it, so this flag shows for a person to confirm a Group I-4 classification. Hand-drafted in a Claude Code session
    (2026-11-21; reworded 2026-11-23).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
