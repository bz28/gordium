    second-story row, and the third story and higher are NP), and gives needs review, never fail, where item 2 is
    stated, on any story (rooms that exit directly outside at the level of exit discharge, which on a sloping site may
    be an upper story), or left blank or the building is in another occupancy (its rows are the rule “Tables 1006.3.4(1)
    and (2) in a building of two or more groups (BCNYS)”). Items 3 to 5 (mechanical parking, Groups R-3 and R-4,
    dwelling units) are for other groups. Hand-drafted in a Claude Code session (2026-11-21). Since 2026-11-23 it
    applies to Group I-4 and a building of two or more groups (or one whose groups aren''t stated: needs review); every
    other group is the rules for its rows or, Group R-2 of dwelling units, the rule “A story''s one exit, R-2 dwelling
    units (BCNYS Table 1006.3.4(1))”. Review round 4 (2026-11-23): a story allowed one exit only by its travel needs
    review while fixed seating (1030.7) or a space the code gives its own exits or travel limit is stated or not ruled
    out. The story''s place against the grade plane is worked out from the model (2026-11-25): the floor elevations of
    each level''s rooms and the ground the architect states (202 GRADE PLANE, STORY ABOVE GRADE PLANE, BASEMENT),
