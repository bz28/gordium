    quote: 1020.2 Construction. Corridors shall be fire-resistance rated in accordance with Table 1020.2. The corridor walls
      required to be fire- resistance rated shall comply with Section 708 for fire partitions.
  - file: gov.ny.building.2025.pdf
    page: 343
    lines:
    - 52
    - 53
    quote: 5. Corridors adjacent to the exterior walls of buildings shall be permitted to have unprotected openings on unrated
      exterior walls where unrated walls are permitted by Table 705.5 and unprotected openings are permitted by Table 705.9.
  examples:
  - given: {}
    parts:
      corridor:
