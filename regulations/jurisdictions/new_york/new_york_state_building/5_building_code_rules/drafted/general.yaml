  topic: means_of_egress
  title: Corridor capacity, 0.2 or 0.15 in per occupant (BCNYS 1020.3, 1005.3.2)
  check: corridor_width >= (corridor_occupant_load * 0.15 if occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "B", "E",
    "F-1", "F-2", "I-1", "I-3", "I-4", "M", "R-1", "R-2", "R-3", "R-4", "S-1", "S-2", "U"] and (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2
    and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) and emergency_voice_alarm_system else corridor_occupant_load * 0.2)
  review_when:
  - when: assembly_fixed_seating and corridor_width < (corridor_occupant_load * 0.15 if occupancy_group in ["A-1", "A-2",
      "A-3", "A-4", "A-5", "B", "E", "F-1", "F-2", "I-1", "I-3", "I-4", "M", "R-1", "R-2", "R-3", "R-4", "S-1", "S-2", "U"]
      and (sprinklered_903_3_1_1 or (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])) and emergency_voice_alarm_system
      else corridor_occupant_load * 0.2)
    reason: 'Narrower than the factor, but the building may have smoke-protected or open-air assembly seating (fixed seating
      stated or not ruled out), whose factors (Table 1030.6.2, 1030.6.3) may ask less: a person checks.'
  - when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "B", "E", "F-1", "F-2", "I-1", "I-3", "I-4", "M", "S-1",
      "S-2", "U"] and sprinklered_903_3_1_2 and not sprinklered_903_3_1_1 and corridor_width >= corridor_occupant_load * 0.15
      and corridor_width < corridor_occupant_load * 0.2 and emergency_voice_alarm_system
    reason: 'Between 0.15 and 0.2 in per occupant, with an NFPA 13R system and a voice/alarm system outside Group R: exception
      1 counts a 903.3.1.2 system, but 903.3.1.2 allows it in Group R occupancies, so whether the building''s system is one
      that counts is a person''s check (as Table 1006.2.1''s rows take it).'
  - when: occupancy_group == "mixed" and (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and corridor_width >= corridor_occupant_load
      * 0.15 and corridor_width < corridor_occupant_load * 0.2 and emergency_voice_alarm_system
    reason: 'Between 0.15 and 0.2 in per occupant in a building of two or more groups with a sprinkler system and a voice/alarm
      system: each portion follows its own occupancy and a shared corridor the more stringent (1004.4), so 0.15 holds unless
      a Group H or I-2 portion uses the corridor, which isn''t shown: a person checks.'
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 21
    - 22
    quote: 1020.3 Width and capacity. The required capacity of corridors shall be determined as specified in Section 1005.1,
      but the minimum width shall be not less than that specified in Table 1020.3.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 14
    - 16
    quote: 1005.3.2 Other egress components. The capacity, in inches, of means of egress components other than stairways shall
      be calcu- lated by multiplying the occupant load served by such component by a means of egress capacity factor of 0.2
      inch (5.1 mm) per occupant.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 18
    - 22
    quote: 1. For other than Group H and I-2 occupancies, the capacity, in inches, of means of egress components other than
      stair- ways shall be calculated by multiplying the occupant load served by such component by a means of egress capacity
      factor of 0.15 inch (3.8 mm) per occupant in buildings equipped throughout with an automatic sprinkler system installed
      in accordance with Section 903.3.1.1 or 903.3.1.2 and an emergency voice/alarm communication system in accordance with
      Section 907.5.2.2.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 23
    - 28
    quote: 2. Facilities with smoke-protected assembly seating shall be permitted to use the capacity factors in Table 1030.6.2
      indi- cated for level or ramped aisles for means of egress components other than stairways where the entire path for
      means of egress from the seating to the exit discharge is provided with a smoke control system complying with Section
      909. 3. Facilities with open-air assembly seating shall be permitted to the capacity factors in Section 1030.6.3 indicated
      for level or ramped aisles for means of egress components other than stairways where the entire path for means of egress
      from the seating to the exit discharge is open to the outdoors.
  examples:
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: false
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Office corridor at 44 in, 220 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 220
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: '0.2 in each: 44 in.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: false
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Office corridor at 44 in, 221 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 221
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: '0.2 in each: 44.2 in.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: true
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13 and voice alarm, 290 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 290
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Exception 1: 0.15 in each, 43.5 in.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: true
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: NFPA 13 and voice alarm, 294 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 294
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Exception 1: 0.15 in each, 44.1 in.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      emergency_voice_alarm_system: true
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Office, NFPA 13R and voice alarm
        measures:
          corridor_width: 45
          corridor_occupant_load: 300
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: '903.3.1.2 allows a 13R system in Group R: whether this office''s system counts for exception 1 is a person''s check.'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: true
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Hospital, NFPA 13 and voice alarm
        measures:
          corridor_width: 44
          corridor_occupant_load: 290
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group I-2 is outside exception 1: 0.2 in each, 58 in.'
  - given:
      occupancy_group: mixed
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: true
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Two groups, NFPA 13 and voice alarm
        measures:
          corridor_width: 45
          corridor_occupant_load: 300
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Two or more groups: 0.15 in each holds unless a Group H or I-2 portion uses the corridor (1004.4), not shown: a
      person checks.'
  - given:
      occupancy_group: A-3
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: true
      assembly_fixed_seating: true
    parts:
      corridor:
      - id: p1
        name: Hall corridor, fixed seating
        measures:
          corridor_width: 44
          corridor_occupant_load: 400
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Fixed seating may be smoke-protected or open-air: its own factors are a person''s check.'
  - given:
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: false
      assembly_fixed_seating: false
    parts:
      corridor:
      - id: p1
        name: Group not stated, 0.2 in each met
        measures:
          corridor_width: 80
          corridor_occupant_load: 400
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: '0.2 in each, the most 1005.3.2 asks in any group: passes whatever the group.'
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      emergency_voice_alarm_system: false
      assembly_fixed_seating: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: '1020.3''s capacity, determined by 1005.1: for a corridor, a component other than a stairway, 0.2 in for each occupant
    it serves (1005.3.2); 0.15 in exception 1''s buildings (a sprinkler system per 903.3.1.1, or 903.3.1.2 in Group R where
    that system is allowed, and an emergency voice/alarm system per 907.5.2.2, both stated, in one group other than H and
    I-2; a 13R system outside Group R, or a building of two or more groups, needs review between 0.15 and 0.2); assembly seating''s
    factors (exceptions 2 and 3, Table 1030.6.2 and 1030.6.3, not brought in) need review while fixed seating is stated or
    not ruled out. The occupant load is the corridor''s, two readings (none and the whole story''s) only where the building
    says no other level''s occupants reach its corridors (1004.2.2, 1004.2.3): it passes only at the whole story''s load.
    How the load splits between exits (1005.5) is section group 5b''s. Section group 5a (2026-11-25) made this a rule; it
    was 4a''s flag. Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1020_3_corridor_width
  kind: rule
  topic: means_of_egress
  title: Corridor width at least Table 1020.3's, every group (BCNYS 1020.3)
  applies_when: occupancy_group in ["A-1", "A-2", "A-3", "A-4", "A-5", "B", "E", "F-1", "F-2", "H-1", "H-2", "H-3", "H-4",
    "H-5", "I-1", "I-2", "I-3", "I-4", "M", "R-1", "R-2", "R-3", "R-4", "S-1", "S-2", "U"]
  check: corridor_width >= (96 if occupancy_group == "I-2" else 72 if occupancy_group == "E" and corridor_occupant_load
    >= 100 else 36 if corridor_occupant_load < 50 else 44)
  review_when:
  - when: corridor_width >= 24 and corridor_width < 36
    reason: 'Under 36 in, but within Table 1020.3''s 24 in for a corridor that gives access to and use of mechanical, plumbing
      or electrical systems or equipment, which the model doesn''t show: a person checks what the corridor serves.'
  - when: corridor_width >= 36 and corridor_width < 44 and corridor_occupant_load >= 50 and corridors_within_dwelling_units
    reason: 'Under 44 in, but within Table 1020.3''s 36 in for a corridor within a dwelling unit, which the building states
      it has or doesn''t rule out and the model doesn''t show: a person checks whether the corridor is within one.'
  - when: occupancy_group == "I-2" and corridor_width >= (36 if corridor_occupant_load < 50 else 44) and corridor_width
      < 96
    reason: 'Group I-2: under the 96 in Table 1020.3 asks where beds are moved, but 1020.3''s exception doesn''t ask it in
      areas without stretcher or bed movement for access to care or the defend-in-place strategy, which the model doesn''t
      show: a person checks.'
  - when: occupancy_group == "B" and ambulatory_care_facility and corridor_width >= (36 if corridor_occupant_load < 50
      else 44) and corridor_width < 72
    reason: 'Group B in an ambulatory care facility (stated, or not ruled out): Table 1020.3 asks 72 in for corridors serving
      stretcher traffic in one, and which corridors do isn''t shown: a person checks.'
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 21
    - 22
    quote: 1020.3 Width and capacity. The required capacity of corridors shall be determined as specified in Section 1005.1,
      but the minimum width shall be not less than that specified in Table 1020.3.
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 23
    - 24
    quote: 'Exception: In Group I-2 occupancies, corridors are not required to have a clear width of 96 inches (2438 mm) in
      areas where there will not be stretcher or bed movement for access to care or as part of the defend-in-place strategy.'
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 27
    - 33
    quote: Any facility not listed in this table 44 Access to and utilization of mechanical, plumbing or electrical systems
      or equipment 24 With an occupant load of less than 50 36 Within a dwelling unit 36 In Group E with a corridor having
      an occupant load of 100 or more 72 In corridors and areas serving stretcher traffic in ambulatory care facilities 72
      Group I-2 in areas where required for bed movement 96
  examples:
  - given:
      occupancy_group: R-2
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Apartment corridor at 44 in, 60 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 60
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Any facility not listed: 44 in.'
  - given:
      occupancy_group: R-2
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Just under 44 in, 60 occupants
        measures:
          corridor_width: 43.5
          corridor_occupant_load: 60
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Under 44 in with 50 or more occupants, but within the 36 in a corridor within a dwelling unit takes (not shown):
      a person checks.'
  - given:
      occupancy_group: B
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Office corridor at 36 in, 49 occupants
        measures:
          corridor_width: 36
          corridor_occupant_load: 49
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Fewer than 50 occupants: 36 in.'
  - given:
      occupancy_group: B
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Just under 36 in
        measures:
          corridor_width: 35.5
          corridor_occupant_load: 49
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Under 36 in, within the 24 in a corridor to mechanical, plumbing or electrical equipment takes (not shown).'
  - given:
      occupancy_group: B
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Under 24 in
        measures:
          corridor_width: 23.5
          corridor_occupant_load: 10
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under every width Table 1020.3 gives.
  - given:
      occupancy_group: E
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: School corridor at 72 in, 100 occupants
        measures:
          corridor_width: 72
          corridor_occupant_load: 100
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group E with 100 or more occupants: 72 in.'
  - given:
      occupancy_group: E
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: School corridor at 71.5 in, 100 occupants
        measures:
          corridor_width: 71.5
          corridor_occupant_load: 100
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group E with 100 or more occupants: under 72 in fails.'
  - given:
      occupancy_group: E
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: School corridor at 44 in, 99 occupants
        measures:
          corridor_width: 44
          corridor_occupant_load: 99
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group E under 100 occupants: 44 in.'
  - given:
      occupancy_group: I-2
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Hospital corridor at 96 in
        measures:
          corridor_width: 96
          corridor_occupant_load: 200
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group I-2 where beds are moved: 96 in.'
  - given:
      occupancy_group: I-2
      ambulatory_care_facility: false
    parts:
      corridor:
      - id: p1
        name: Hospital corridor at 95.5 in
        measures:
          corridor_width: 95.5
          corridor_occupant_load: 200
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Under 96 in: 1020.3''s exception (no bed movement) is a person''s check.'
  - given:
      occupancy_group: B
      ambulatory_care_facility: true
    parts:
      corridor:
      - id: p1
        name: Clinic corridor at 71.5 in
        measures:
          corridor_width: 71.5
          corridor_occupant_load: 60
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'An ambulatory care facility: under 72 in, whether it serves stretcher traffic is a person''s check.'
  - given:
      occupancy_group: B
      ambulatory_care_facility: true
    parts:
      corridor:
      - id: p1
        name: Clinic corridor at 72 in
        measures:
          corridor_width: 72
          corridor_occupant_load: 60
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'An ambulatory care facility: 72 in serves stretcher traffic too.'
  - given:
      occupancy_group: mixed
    parts:
      corridor:
      - id: p1
        name: Corridor in a building of two groups
        measures:
          corridor_width: 60
          corridor_occupant_load: 20
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'A building of two or more groups is the flag''s (1004.4): not applicable.'
  - given:
      occupancy_group: R-2
      ambulatory_care_facility: false
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the rule doesn''t apply.'
  notes: 'Table 1020.3 for every group (section group 4 of the plan, docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md):
    44 in for any facility the table doesn''t list, 36 in with fewer than 50 occupants, 72 in in Group E with 100 or more,
    96 in in Group I-2 where beds are moved. Where the table loosens it for a corridor the model can''t tell apart (24 in
    to mechanical, plumbing or electrical equipment; 36 in within a dwelling unit; Group I-2 areas without bed movement,
    1020.3''s exception) it needs review, never a pass on the looser width; where it tightens it for one (72 in for stretcher
    traffic in an ambulatory care facility, Group B, 304.1) it needs review short of 72 in while the facility is stated
    or not ruled out. The occupant load is the one the corridor serves: Gordium gives two readings, none and its whole story''s,
    only where the building says no other level''s occupants reach its corridors (1004.2.2, 1004.2.3: another story''s
    load is added only at a convergence, 1005.6), so it passes only at its whole story''s load and fails only at none.
    1020.3''s capacity (1005.1) is the rule “Corridor capacity, 0.2 or 0.15 in per occupant (BCNYS 1020.3,
    1005.3.2)”. The table''s "occupant load" is read as the corridor''s own, as its Group E row
    says ("a corridor having an occupant load") and 1020.3 sizes "the required capacity of corridors". Hand-drafted
    in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1020_3_other_occupancies
  kind: flag
  topic: means_of_egress
  title: Corridor width in a building of two or more groups (BCNYS Table 1020.3)
  applies_when: occupancy_group == "mixed"
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 27
    - 33
    quote: Any facility not listed in this table 44 Access to and utilization of mechanical, plumbing or electrical systems
      or equipment 24 With an occupant load of less than 50 36 Within a dwelling unit 36 In Group E with a corridor having
      an occupant load of 100 or more 72 In corridors and areas serving stretcher traffic in ambulatory care facilities 72
      Group I-2 in areas where required for bed movement 96
  examples:
  - given:
      occupancy_group: mixed
    expect: needs_review
    note: 'A building of two or more groups: 1004.4 applies the means of egress requirements to each portion by its own
      occupancy, and a corridor two occupancies share meets the more stringent (Group E''s 72 in, Group I-2''s 96 in); which
      room is which occupancy isn''t marked yet, so a person checks.'
  - given:
      occupancy_group: R-2
    expect: not_applicable
    note: 'One group: the rule for every group checks it.'
  - given: {}
    expect: needs_review
    note: 'The occupancy isn''t stated: needs review.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4: the one-group corridors are a rule.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1020_4_obstruction
  kind: flag
  topic: means_of_egress
  title: Corridor width kept clear (BCNYS 1020.4)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 35
    - 36
    quote: '1020.4 Obstruction. The minimum width or required capacity of corridors shall be unobstructed. Exception: Encroachments
      complying with Section 1005.7.'
  examples:
  - given: {}
    expect: needs_review
    note: 'The corridor''s width is measured between its walls and what the model draws in it; a door swinging into it,
      furniture or equipment the model doesn''t show, and 1005.7''s encroachments (its own flags since section group 5c) are a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4c. The corridor width rules read the least
    clear width the routes measure between the walls and the obstructions drawn (decision 6 of the route measuring); what
    isn''t drawn, and whether an encroachment meets 1005.7 (doors: 7 inches fully open, half the width in any position;
    trim 1 1/2 inches; handrails per 1014.9), is a person''s check: 1005.7.1 to 1005.7.3''s flags (section group 5c).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1020_6_air_movement
  kind: flag
  topic: means_of_egress
  title: Corridors not used as air ducts (BCNYS 1020.6)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 48
    - 48
    quote: 1020.6 Air movement in corridors. Corridors shall not serve as supply, return, exhaust, relief or ventilation air
      ducts.
  - file: gov.ny.building.2025.pdf
    page: 344
    lines:
    - 50
    - 53
    quote: 1. Use of a corridor as a source of makeup air for exhaust systems in rooms that open directly onto such corridors,
      including toilet rooms, bathrooms, dressing rooms, smoking lounges and janitor closets, shall be permitted, provided
      that each such corridor is directly supplied with outdoor air at a rate greater than the rate of makeup air taken from
      the corridor. 2. Where located within a dwelling unit, the use of corridors for conveying return air shall not be prohibited.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 3
    - 6
    quote: 3. Where located within tenant spaces of 1,000 square feet (93 m[fn2]) or less in area, utilization of corridors
      for conveying return air is permitted. 4. Transfer air movement required to maintain the pressurization difference
      within health care facilities in accordance with ASHRAE 170.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 7
    - 8
    quote: '1020.6.1 Corridor ceiling. Use of the space between the corridor ceiling and the floor or roof structure above
      as a return air plenum is permitted for one or more of the following conditions:'
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 9
    - 16
    quote: 1. The corridor is not required to be of fire-resistance-rated construction. 2. The corridor is separated from
      the plenum by fire-resistance-rated construction. 3. The air-handling system serving the corridor is shut down upon
      activation of the air-handling unit smoke detectors required by the Mechanical Code of New York State. 4. The air-handling
      system serving the corridor is shut down upon detection of sprinkler water flow where the building is equipped throughout
      with an automatic sprinkler system. 5. The space between the corridor ceiling and the floor or roof structure above
      the corridor is used as a component of an approved engineered smoke control system.
  examples:
  - given: {}
    expect: needs_review
    note: 'The air system isn''t in the model: whether a corridor serves as a supply, return, exhaust, relief or ventilation
      duct, or a ceiling plenum above it is used as 1020.6.1 permits, is a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4c. Its exceptions (makeup air with outdoor air
    supplied, return air within a dwelling unit or a tenant space of 1,000 square feet or less, health care pressurization)
    and 1020.6.1''s five conditions for a return air plenum above the ceiling are the mechanical design''s, which Gordium
    doesn''t read.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1020_7_continuity
  kind: flag
  topic: means_of_egress
  title: A rated corridor is continuous to the exit (BCNYS 1020.7)
  applies_when: corridor_fire_rating_hours > 0
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 17
    - 20
    quote: 1020.7 Corridor continuity. Fire-resistance-rated corridors shall be continuous from the point of entry to an exit,
      and shall not be interrupted by intervening rooms. Where the path of egress travel within a fire-resistance-rated corridor
      to the exit includes travel along unenclosed exit access stairways or ramps, the fire-resistance rating shall be continuous
      for the length of the stairway or ramp and for the length of the connecting corridor on the adjacent floor leading to
      the exit.
  - file: gov.ny.building.2025.pdf
    page: 345
    lines:
    - 22
    - 23
    quote: 1. Foyers, lobbies or reception rooms constructed as required for corridors shall not be construed as intervening
      rooms. 2. Enclosed elevator lobbies as permitted by Item 1 of Section 1016.2 shall not be construed as intervening rooms.
  examples:
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Rated corridor
        measures:
          corridor_fire_rating_hours: 1
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A rated corridor: whether its rating runs unbroken to the exit, with no intervening room (foyers, lobbies and reception
      rooms built as corridors, and enclosed elevator lobbies per 1016.2 item 1, aside), is a person''s check.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Unrated corridor
        measures:
          corridor_fire_rating_hours: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Stated unrated: 1020.7 asks continuity of rated corridors only.'
  - given: {}
    parts:
      corridor:
      - id: p1
        name: Rating not stated
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The rating isn''t stated: a person checks.'
  - given: {}
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: with none, the flag doesn''t apply.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 4c. The routes measure each corridor on its own
    story and don''t follow a rating through rooms, foyers or open stairs, so continuity is a person''s check wherever a
    corridor is rated or its rating isn''t stated.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_3_1_stairway_capacity
  kind: flag
  topic: means_of_egress
  title: Stairway capacity, 0.3 or 0.2 in per occupant (BCNYS 1005.3.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 313
    lines:
    - 51
    - 54
    quote: 1005.3.1 Stairways. The capacity, in inches, of means of egress stairways shall be calculated by multiplying the
      occupant load served by such stairways by a means of egress capacity factor of 0.3 inch (7.6 mm) per occupant. Where
      stairways serve more than one story, only the occupant load of each story considered individually shall be used in calculating
      the required capacity of the stairways serving that story.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 3
    - 13
    quote: 1. For other than Group H and I-2 occupancies, the capacity, in inches, of means of egress stairways shall be calculated
      by multiplying the occupant load served by such stairways by a means of egress capacity factor of 0.2 inch (5.1 mm)
      per occupant in buildings equipped throughout with an automatic sprinkler system installed in accordance with Section
      903.3.1.1 or 903.3.1.2 and an emergency voice/alarm communication system in accordance with Section 907.5.2.2. 2. Facilities
      with smoke-protected assembly seating shall be permitted to use the capacity factors in Table 1030.6.2 indi- cated for
      stepped aisles for exit access or exit stairways where the entire path for means of egress from the seating to the exit
      discharge is provided with a smoke control system complying with Section 909. 3. Facilities with open-air assembly seating
      shall be permitted to the capacity factors in Section 1030.6.3 indicated for stepped aisles for exit access or exit
      stairways where the entire path for means of egress from the seating to the exit discharge is open to the outdoors.
  examples:
  - given: {}
    expect: needs_review
    note: 'The stairways'' clear widths aren''t measured: 0.3 in for each occupant of the story they serve (0.2 with a sprinkler
      system and a voice/alarm system, other than Groups H and I-2; assembly seating''s own factors) is a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5a: the route measuring doesn''t give a stairway''s
    width; each story''s load is its own (1005.3.1''s second sentence), converging stairs are 1005.6''s (section group 5b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_3_2_other_components
  kind: flag
  topic: means_of_egress
  title: Other components' capacity, doors and ramps included (BCNYS 1005.3.2)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 14
    - 16
    quote: 1005.3.2 Other egress components. The capacity, in inches, of means of egress components other than stairways shall
      be calcu- lated by multiplying the occupant load served by such component by a means of egress capacity factor of 0.2
      inch (5.1 mm) per occupant.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 18
    - 22
    quote: 1. For other than Group H and I-2 occupancies, the capacity, in inches, of means of egress components other than
      stair- ways shall be calculated by multiplying the occupant load served by such component by a means of egress capacity
      factor of 0.15 inch (3.8 mm) per occupant in buildings equipped throughout with an automatic sprinkler system installed
      in accordance with Section 903.3.1.1 or 903.3.1.2 and an emergency voice/alarm communication system in accordance with
      Section 907.5.2.2.
  examples:
  - given: {}
    expect: needs_review
    note: 'Doors, ramps and exit passageways aren''t measured for capacity: 0.2 in for each occupant they serve (0.15 with
      a sprinkler system and a voice/alarm system, other than Groups H and I-2) is a person''s check. Corridors are the rule
      of their own.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5a: 1005.3.2 for the components the Building Code
    check doesn''t read yet (section group 6 brings in the doors).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_4_continuity
  kind: flag
  topic: means_of_egress
  title: Egress width never reduced toward the public way (BCNYS 1005.4)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 29
    - 30
    quote: 1005.4 Continuity. The minimum width or required capacity of the means of egress required from any story of a building
      shall not be reduced along the path of egress travel until arrival at the public way.
  examples:
  - given: {}
    expect: needs_review
    note: 'The width or capacity required from a story never narrows along the path of egress travel to the public way: the
      routes measure each story''s spaces and corridors, not the exits and discharge beyond them, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 5b. The corridors' own widths and capacities are
    their rules (Table 1020.3, 1020.3's capacity); that nothing narrows after them (exits, exit passageways, discharge) isn't
    measured.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_5_distribution
  kind: flag
  topic: means_of_egress
  title: Losing one exit leaves half the capacity (BCNYS 1005.5)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 31
    - 33
    quote: 1005.5 Distribution of minimum width and required capacity. Where more than one exit, or access to more than one
      exit, is required, the means of egress shall be configured such that the loss of any one exit, or access to one exit,
      shall not reduce the avail- able capacity or width to less than 50 percent of the required capacity or width.
  examples:
  - given: {}
    expect: needs_review
    note: 'Where more than one exit is required, losing any one exit (or access to it) leaves at least half the required capacity
      or width: the exits'' widths aren''t measured, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 5b. The routes count each story's exits but don't
    measure their widths; the corridors' capacity rule doesn't split a story's occupants between exits either.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_6_convergence
  kind: flag
  topic: means_of_egress
  title: Converging stairways' capacity added (BCNYS 1005.6)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 34
    - 36
    quote: 1005.6 Egress convergence. Where the means of egress from stories above and below converge at an intermediate level,
      the capac- ity of the means of egress from the point of convergence shall be not less than the largest minimum width
      or the sum of the required capacities for the stairways or ramps serving the two adjacent stories, whichever is larger.
  examples:
  - given: {}
    expect: needs_review
    note: 'Where egress from the stories above and below meets at an intermediate level, the capacity from there on is the
      larger of the widest minimum or the two stories'' stairways'' or ramps'' required capacities added: the stairways aren''t
      measured, so a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5b. The routes measure each story on its own (1004.2.3
    adds no other story''s load but at a convergence: this section''s).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_7_1_door_encroachment
  kind: flag
  topic: means_of_egress
  title: Doors take at most 7 in, or half, of the width (BCNYS 1005.7.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 37
    - 38
    quote: 1005.7 Encroachment. Encroachments into the required means of egress width shall be in accordance with the provisions
      of this section.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 39
    - 40
    quote: 1005.7.1 Doors. Doors, when fully opened, shall not reduce the required width by more than 7 inches (178 mm). Doors
      in any position shall not reduce the required width by more than one-half.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 42
    - 49
    quote: '1. Surface-mounted latch release hardware shall be exempt from inclusion in the 7-inch maximum (178 mm) encroach-
      ment where both of the following conditions exist: 1.1. The hardware is mounted to the side of the door facing away
      from the adjacent wall where the door is in the open position. 1.2. The hardware is mounted not less than 34 inches
      (865 mm) nor more than 48 inches (1219 mm) above the finished floor. 2. The restrictions on door swing shall not apply
      to doors within individual dwelling units and sleeping units of Group R-2 occupancies and dwelling units of Group R-3
      occupancies.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A door fully open takes at most 7 inches of the required width, in any position at most half (latch hardware 34
      to 48 inches up aside; not inside an R-2 dwelling or sleeping unit or an R-3 dwelling unit): the doors'' swing into
      a corridor isn''t drawn, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 5c. The corridor width rules read the least clear
    width between the walls and what is drawn; a door swinging into the corridor isn't in the interior description (route
    measuring decision 6), so its encroachment, and exception 1's latch hardware, are a person's check. Exception 2 (doors
    within R-2 dwelling or sleeping units and R-3 dwelling units) only loosens it.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_7_2_projections
  kind: flag
  topic: means_of_egress
  title: Trim at most 1 1/2 in each side into the width (BCNYS 1005.7.2)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 37
    - 38
    quote: 1005.7 Encroachment. Encroachments into the required means of egress width shall be in accordance with the provisions
      of this section.
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 50
    - 53
    quote: '1005.7.2 Other projections. Handrail projections shall be in accordance with the provisions of Section 1014.9.
      Other nonstruc- tural projections such as trim and similar decorative features shall be permitted to project into the
      required width not more than 1 1/2 inches (38 mm) on each side. Exception: Projections are permitted in corridors within
      Group I-2, Condition 1 in accordance with Section 407.4.3.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Handrails project as 1014.9 allows, trim and similar at most 1 1/2 inches each side (Group I-2 Condition 1 corridors
      per 407.4.3): projections aren''t drawn, so a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 5c. Projections aren''t drawn: the corridor''s
    measured width is between its finished walls and what is drawn in it, so trim within 1 1/2 inches each side and handrails
    as 1014.9 allows (not brought in) are a person''s check; Group I-2 Condition 1 corridors'' projections per 407.4.3 (not
    brought in) too.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1005_7_3_protruding_objects
  kind: flag
  topic: means_of_egress
  title: Protruding objects per 1003.3 (BCNYS 1005.7.3)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 314
    lines:
    - 37
    - 38
    quote: 1005.7 Encroachment. Encroachments into the required means of egress width shall be in accordance with the provisions
      of this section.
  - file: gov.ny.building.2025.pdf
    page: 314
