- id: general.bc_407_4_2_sleeping_room_travel
  kind: rule
  topic: means_of_egress
  title: 'Group I-2 sleeping rooms: 50 ft to the room''s door (BCNYS 407.4.2)'
  applies_when: occupancy_group == "I-2"
  check: egress_travel_in_sleeping_room <= 50
  review_when:
  - when: egress_travel_in_sleeping_room > 50 and special_egress_spaces
    reason: 'Over 50 ft within a sleeping room, in a building that may have care suites (stated, or not ruled out): 407.4.2
      is for a sleeping room not in a care suite, a person checks.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 99
    lines:
    - 48
    - 49
    quote: '[BE] 407.4.2 Distance of travel. The distance of travel between any point in a Group I-2 occupancy sleeping room,
      not located in a care suite, and an exit access door in that room shall be not greater than 50 feet (15 240 mm).'
  examples:
  - given:
      occupancy_group: I-2
      special_egress_spaces: false
    parts:
      story:
      - id: p1
        name: Ward
        measures:
          egress_travel_in_sleeping_room: 50
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 50 ft at most.
  - given:
      occupancy_group: I-2
      special_egress_spaces: false
    parts:
      story:
      - id: p1
        name: Ward
        measures:
          egress_travel_in_sleeping_room: 50.5
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Over 50 ft, no care suite (stated).
  - given:
      occupancy_group: I-2
    parts:
      story:
      - id: p1
        name: Ward
        measures:
          egress_travel_in_sleeping_room: 60
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Care suites not ruled out: a person checks.'
  - given:
      occupancy_group: B
    parts:
      story:
      - id: p1
        name: Office
        measures:
          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: Not Group I-2.
  - given:
      occupancy_group: I-2
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: with none, the rule needs review.'
  notes: 'Table 1017.2 note a''s 407.4 for Group I-2: 407.4.2 holds a sleeping room not in a care suite to 50 ft from any
    point to its exit access door, measured as the travel within a sleeping room; a care suite (407.4.4, not brought in) is
    such a space'' (review). Hand-drafted in a Claude Code session (2026-11-23, review round 1).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1006_2_1_two_exits
  kind: rule
  topic: means_of_egress
  title: Two exits over 10 occupants or a 75-ft common path, I-4 (BCNYS 1006.2.1)
  applies_when: occupancy_group_i4
  check: space_exit_count >= 2 or (space_occupant_load <= 10 and (sprinklered_903_3_1_1 or sprinklered_903_3_1_2) and space_common_path
    <= 75)
  review_when:
  - when: space_exit_count >= 2 and (space_common_path > 75 or not (sprinklered_903_3_1_1 or sprinklered_903_3_1_2))
    reason: 'Two exits or more, and a common path over 75 ft (or a building not sprinklered throughout, where the table gives
      Group I-4 no common path): whether Table 1006.2.1 caps the common path or only decides when a second exit is needed
      is open (the open question); a person checks.'
  - when: not space_is_exit and special_egress_spaces and space_exit_count < 2 and ((space_occupant_load <= 10 and (sprinklered_903_3_1_1
      or sprinklered_903_3_1_2) and space_common_path <= 75))
    reason: 'One exit within the row, in a building that may hold a room 1006.2.2 gives two exits by its use, stated or not
      ruled out (as the architect states it): a person checks.'
  - when: not space_is_exit and assembly_fixed_seating and (space_exit_count >= 2 or (space_occupant_load <= 10 and (sprinklered_903_3_1_1
      or sprinklered_903_3_1_2) and space_common_path <= 75))
    reason: 'The building may have a room used for assembly purposes with fixed seating, in any group (303.1.1 to 303.1.3),
      stated or not ruled out: its common path is a portion of its exit access travel (202 COMMON PATH OF EGRESS TRAVEL),
      which 1030.7 measures along the aisles and aisle accessways, never over the seats, and 1030.8 caps at 30 ft from any
      seat (75 ft under 50 occupants; 50 ft smoke-protected or open-air); the routes measure it straight across the seats,
      so the figure can''t be trusted at any length: a person checks. (Only where the row would otherwise pass: a measured
      fail still fails, since the real path can only be longer.)'
  for_each: space
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 3
    - 5
    quote: 1006.2.1 Egress based on occupant load and common path of egress travel distance. Two exits or exit access doorways
      from any space shall be provided where the design occupant load or the common path of egress travel distance exceeds
      the values listed in Table 1006.2.1. The cumulative occupant load from adjacent rooms, areas or spaces shall be determined
      in accordance
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 6
    - 13
    quote: 'with Section 1004.2. Exceptions: 1. The number of exits from foyers, lobbies, vestibules or similar spaces need
      not be based on cumulative occupant loads for areas discharging through such spaces, but the capacity of the exits from
      such spaces shall be based on applicable cumulative occupant loads. 2. Care suites in Group I-2 occupancies complying
      with Section 407.4. 3. Unoccupied mechanical rooms and penthouses are not required to comply with the common path of
      egress travel distance measurement.'
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 26
    - 26
    quote: I-1, I-2[fnd], I-4 10 NP NP 75[fna]
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 36
    - 36
    quote: a.Buildings equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1 or 903.3.1.2.
      See Section 903 for occupancies where automatic sprin-
  - file: gov.ny.building.2025.pdf
    page: 315
    lines:
    - 48
    - 56
    quote: 1006.2.2 Egress based on use. The numbers, configuration and types of components of exits or access to exits shall
      be provided in the uses described in Sections 1006.2.2.1 through 1006.2.2.6. 1006.2.2.1 Boiler, incinerator and furnace
      rooms. Two exit access doorways are required in boiler, incinerator and furnace rooms where the area is over 500 square
      feet (46 m[fn2]) and any fuel-fired equipment exceeds 400,000 British thermal units (Btu) (422 000 KJ) input capacity.
      Where two exit access doorways are required, one is permitted to be a fixed ladder or an alternating tread device. Exit
      access doorways shall be separated by a horizontal distance equal to one-half the length of the maximum overall diagonal
      dimension of the room. 1006.2.2.2 Refrigeration machinery rooms. Machinery rooms larger than 1,000 square feet (93 m[fn2])
      shall have not less than two exits or exit access doorways. Where two exit access doorways are required, one such doorway
      is permitted to be served by
  - file: gov.ny.building.2025.pdf
    page: 316
    lines:
    - 3
    - 24
    quote: 'a fixed ladder or an alternating tread device. Exit access doorways shall be separated by a horizontal distance
      equal to one-half the maximum horizontal dimension of the room. Exit access travel distance shall be determined as specified
      in Section 1017.1, but all portions of a refrigeration machinery room shall be within 150 feet (45 720 mm) of an exit
      or exit access doorway where such rooms are not protected by an approved automatic sprinkler system. Egress is allowed
      through adjoining refrigeration machinery rooms or adjoining refriger- ated rooms or spaces. Exit and exit access doorways
      shall swing in the direction of egress travel and shall be equipped with panic hardware, regardless of the occupant
      load served. Exit and exit access doorways shall be tight fitting and self-closing. 1006.2.2.3 Refrigerated rooms or
      spaces. Rooms or spaces having a floor area larger than 1,000 square feet (93 m[fn2]), contain- ing a refrigerant evaporator
      and maintained at a temperature below 68°F (20°C), shall have access to not less than two exits or exit access doorways.
      Exit access travel distance shall be determined as specified in Section 1017.1, but all portions of a refrigerated room
      or space shall be within 150 feet (45 720 mm) of an exit or exit access doorway where such rooms are not protected by
      an approved auto- matic sprinkler system. Egress is allowed through adjoining refrigerated rooms or spaces. Exception:
      Where using refrigerants in quantities limited to the amounts based on the volume set forth in the Mechanical Code of
      New York State. 1006.2.2.4 Electrical rooms. The location and number of exit or exit access doorways shall be provided
      for electrical rooms in accordance with Section 110.26 of NFPA 70 for electrical equipment rated 1,000 volts or less,
      and Section 110.33 of NFPA 70 for electrical equipment rated over 1,000 volts. Panic hardware shall be provided where
      required in accordance with Section 1010.2.8.2. 1006.2.2.5 Vehicular ramps. Vehicular ramps shall not be considered
      as an exit access ramp unless pedestrian facilities are provided.'
  - file: gov.ny.building.2025.pdf
    page: 355
    lines:
    - 13
    - 18
    quote: '1030.8 Common path of egress travel. The common path of egress travel for a room or space used for assembly purposes
      having fixed seating shall not exceed 30 feet (9144 mm) from any seat to a point where an occupant has a choice of two
      paths of egress travel to two exits. Exceptions: 1. For areas serving less than 50 occupants, the common path of egress
      travel shall not exceed 75 feet (22 860 mm). 2. For smoke-protected or open-air assembly seating, the common path of
      egress travel shall not exceed 50 feet (15 240 mm).'
  examples:
  - given:
      occupancy_group_i4: true
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      assembly_fixed_seating: false
      special_egress_spaces: false
    parts:
      space:
      - id: p1
        name: Classroom, 30 occupants, two doors
        measures:
          space_exit_count: 2
          space_occupant_load: 30
          space_common_path: 48.5
          space_is_exit: false
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'The answer key''s common path (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 48''-6" within 75
      ft (I-4, sprinklered), taken as a two-door space''s: passes, as the sheet found under the 2009 IBC''s 1014.3.'
  - given:
