    reason: 'A close pair in a building of one group other than I-4 whose own row could allow one exit (read loosely, sprinklered
      or not: Table 1006.3.4(1) or (2) for a story, Table 1006.2.1 for a space): two may not be required, a person checks
      (2026-11-23). Elsewhere two are required and a close pair fails.'
