    note: 'A shaft enclosure reaches the underside of the roof (the roof built for its type of construction, Table 601), or
      ends below it with a top of the topmost floor''s rating (at least the shaft''s), or rises through the roof per 1511:
      a person''s check. An interior exit stairway''s or exit access stairway''s enclosure may end at such a top (707.5).'
  notes: 'Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. Table 601 and 1511 aren''t brought in; 707.5
