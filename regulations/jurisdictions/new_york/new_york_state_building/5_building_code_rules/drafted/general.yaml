- id: general.bc_710_5_3_i2_pass_through_openings
  kind: flag
  topic: means_of_egress
  title: Pass-through openings in Group I-2 Condition 2 smoke partitions (BCNYS 710.5.3)
  applies_when: occupancy_group in ["I-2", "mixed"]
  sources:
  - file: gov.ny.building.2025.pdf
    page: 175
    lines:
    - 49
    - 55
    quote: '710.5.3 Pass-through openings in Group I-2, Condition 2. Where pass-through openings are provided in smoke partitions
      in Group I-2, Condition 2 occupancies, such openings shall comply with the following: 1. The smoke compartment in which
      the pass-through openings occur does not contain a patient care suite or sleeping room. 2. Pass-through openings are
      installed in a wall, door or vision panel that is not required to have a fire-resistance rating. 3. The top of the pass-through
      opening is located a maximum of 48 inches (1219 mm) above the floor. 4. The aggregate area of all such pass-through
      openings within a single room shall not exceed 80 square inches (0.05 m[fn2]).'
  examples:
  - given:
      occupancy_group: I-2
    expect: needs_review
    note: 'In Group I-2 Condition 2, a pass-through opening in a smoke partition is allowed only where its smoke compartment
      holds no patient care suite or sleeping room, it is in a wall, door or vision panel not required to be rated, its top
      is at most 48 inches above the floor, and all such openings in one room total at most 80 square inches: whether a building
      is Condition 2, and its pass-through openings, aren''t in the model, so a person''s check.'
  - given:
      occupancy_group: R-2
    expect: not_applicable
    note: 'Group R-2: not this section''s.'
  - given: {}
    expect: needs_review
    note: 'No group stated: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part c. Narrowed to Group I-2 and a building of two
    or more groups (Condition 2 isn't a stated fact).
  drafted_by: claude_code/claude-opus-5-5
  status: draft
