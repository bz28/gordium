    lines:
    - 43
    - 51
    quote: '712.1.9 Two-story openings. In other than Groups I-2 and I-3, a vertical opening that is not used as one of the
      applications spec- ified in this section shall be permitted if the opening complies with all of the following items:
      1. Does not connect more than two stories. 2. Does not penetrate a horizontal assembly that separates fire areas or
      smoke barriers that separate smoke compartments. 3. Is not concealed within the construction of a wall or a floor/ceiling
      assembly. 4. Is not open to a corridor in Group I and R occupancies. 5. Is not open to a corridor on nonsprinklered
      floors. 6. Is separated from floor openings and air transfer openings serving other floors by construction conforming
      to required shaft enclosures.'
  examples:
