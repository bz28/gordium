  status: draft
- id: general.bc_1004_7_outdoor_areas
  kind: flag
  topic: means_of_egress
  title: 'Outdoor areas: means of egress and occupant load (BCNYS 1004.7)'
  applies_when: occupied_outdoor_areas
  sources:
  - file: gov.ny.building.2025.pdf
    page: 313
    lines:
    - 29
    - 36
    quote: '1004.7 Outdoor areas. Yards, patios, occupiable roofs, courts and similar outdoor areas accessible to and usable
      by the building occupants shall be provided with means of egress as required by this chapter. The occupant load of such
      outdoor areas shall be assigned by the building official in accordance with the anticipated use. Where outdoor areas
      are to be used by persons in addition to the occupants of the building, and the path of egress travel from the outdoor
      areas passes through the building, means of egress requirements for the building shall be based on the sum of the occupant
      loads of the building plus the outdoor areas. Exceptions: 1. Outdoor areas used exclusively for service of the building
      need only have one means of egress. 2. Both outdoor areas associated with Group R-3 and individual dwelling units of
      Group R-2.'
  examples:
  - given:
      occupied_outdoor_areas: true
    expect: needs_review
    note: 'Yards, patios, occupiable roofs or courts the occupants use: their means of egress and the occupant load the building
      official assigns are a person''s check.'
  - given: {}
    expect: needs_review
    note: 'Not stated: a person checks.'
  - given:
      occupied_outdoor_areas: false
    expect: not_applicable
    note: 'None, as the architect states it: not applicable.'
  notes: '1004.7: outdoor areas usable by the occupants need means of egress per Chapter 10, their occupant load assigned
    by the building official, added to the building''s where their egress passes through it; exception 1 (service-only areas:
    one means of egress) and 2 (Group R-3''s and Group R-2 dwelling units'' own outdoor areas) loosen it. Outdoor areas aren''t
    drawn in the interior description. Hand-drafted in a Claude Code session (2026-11-23, section group 3).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
