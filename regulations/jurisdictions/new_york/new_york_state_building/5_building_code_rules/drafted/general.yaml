  status: draft
- id: general.bc_903_2_2_1_ambulatory_care
  kind: flag
  topic: means_of_egress
  title: An ambulatory care facility's floors sprinklered (BCNYS 903.2.2.1)
  applies_when: ambulatory_care_facility
  sources:
  - file: gov.ny.building.2025.pdf
    page: 270
    lines:
    - 14
    - 23
    quote: '[F] 903.2.2.1 Ambulatory care facilities. An automatic sprinkler system shall be installed throughout the entire
      floor contain- ing an ambulatory care facility where either of the following conditions exist at any time: 1. Four or
      more care recipients are incapable of self-preservation. 2. One or more care recipients that are incapable of self-preservation
      are located at other than the level of exit discharge serving such a facility. In buildings where ambulatory care is
      provided on levels other than the level of exit discharge, an automatic sprinkler system shall be installed throughout
      the entire floor as well as all floors below where such care is provided, and all floors between the level of ambulatory
      care and the nearest level of exit discharge, the level of exit discharge, and all floors below the level of exit discharge.
      Exception: Floors classified as an open parking garage are not required to be sprinklered.'
  examples:
  - given: {}
    expect: needs_review
    note: 'The whole floor holding an ambulatory care facility is sprinklered where four or more care recipients are incapable
      of self-preservation, or one or more are at other than the level of exit discharge; where care is on another level,
      that floor, every floor between it and the nearest level of exit discharge, that level and every floor below it too
      (open parking garage floors aside): a person''s check.'
  - given:
      ambulatory_care_facility: false
    expect: not_applicable
    note: 'Not this building''s group or fact, as stated: not applicable.'
  notes: '903.2.2.1: the care recipients and where they are aren''t in the model; narrowed by the building''s stated ambulatory
    care facility (Table 1020.3''s fact). Hand-drafted in a Claude Code session (2026-11-27, Chapter 9 part b).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
