- id: general.bc_713_11_shaft_bottom
  kind: flag
  topic: means_of_egress
  title: A shaft not reaching the building's bottom closed at its foot (BCNYS 713.11)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 178
    lines:
    - 56
    - 57
    quote: '713.11 Enclosure at the bottom. Shafts that do not extend to the bottom of the building or structure shall comply
      with one of the following:'
  - file: gov.ny.building.2025.pdf
    page: 179
    lines:
    - 3
    - 20
    quote: '1. Be enclosed at the lowest level with construction of the same fire-resistance rating as the lowest floor through
      which the shaft passes, but not less than the rating required for the shaft enclosure. 2. Terminate in a room having
      a use related to the purpose of the shaft. The room shall be separated from the remainder of the building by fire barriers
      constructed in accordance with Section 707 or horizontal assemblies constructed in accordance with Section 711, or both.
      The fire-resistance rating and opening protectives shall be not less than the protection required for the shaft enclosure.
      3. Be protected by approved fire dampers installed in accordance with their listing at the lowest floor level within
      the shaft enclosure. Exceptions: 1. The fire-resistance-rated room separation is not required, provided that the only
      openings in or penetrations of the shaft enclosure to the interior of the building occur at the bottom. The bottom of
      the shaft shall be closed off around the pene- trating items with materials permitted by Section 718.3.1 for draftstops,
      or the room shall be provided with an approved automatic sprinkler system. 2. A shaft enclosure containing a waste or
      linen chute shall not be used for any other purpose and shall discharge in a room protected in accordance with Section
      713.13.4. 3. The fire-resistance-rated room separation and the protection at the bottom of the shaft are not required
      provided that there are no combustibles in the shaft and there are no openings or other penetrations through the shaft
      enclosure to the interior of the building.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A shaft that doesn''t reach the bottom of the building is closed at its lowest level with construction of the lowest
      floor''s rating (at least the shaft''s), or ends in a room for its own purpose separated by fire barriers per 707 or
      horizontal assemblies per 711 with the shaft''s rating and opening protectives, or has fire dampers at its lowest floor.
      The room needs no rated separation where the shaft''s only openings or penetrations into the building are at its bottom,
      closed off around what passes through with draftstop materials per 718.3.1 or the room sprinklered; a shaft holding
      a waste or linen chute is used for nothing else and discharges into a room per 713.13.4; and a shaft with nothing combustible
      in it and no openings or penetrations into the building needs neither the room''s separation nor the protection at its
      bottom: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. 711, 718.3.1 and 713.13.4 aren't brought in.
    Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_713_12_shaft_top
  kind: flag
