    note: 'A story''s count of exits is the rule “Exits per story by occupant load, one where 1006.3.4 allows (BCNYS 1006.3.3)”''s
      (Table 1006.3.3) and the distance between its farthest pair the rule “Two exits at least 1/2 the diagonal apart, 1/3
      sprinklered (BCNYS 1007.1.1)”''s; whether the others are a reasonable distance apart is a person''s judgment. Each space''s
      own are the rule “A space needing three exits: two arranged per 1007.1.1 (BCNYS 1007.1.2)”.'
  notes: Hand-drafted in a Claude Code session (2026-11-21).
