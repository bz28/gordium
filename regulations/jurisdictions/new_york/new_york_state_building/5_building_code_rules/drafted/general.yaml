      group_i1_i2_i3_present: true
      occupancy_group_i4: false
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Group I-2 with an NFPA 13 system throughout: the system 903.2.6 requires.'
  - given:
      group_i1_i2_i3_present: true
      occupancy_group_i4: false
      occupancy_group: I-1
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      sprinklered_903_3_1_3: false
    parts:
      story:
      - id: p1
        name: Level 1
        measures: {}
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group I-1 with no sprinkler system: 903.2.6 requires one throughout.'
  - given:
