    expect: needs_review
    note: 'In other than Groups I-2 and I-3, a vertical opening that is none of 712.1''s other cases (an exit access stairway
      may use it, 1019.3) is permitted only where it connects at most two stories, penetrates no horizontal assembly separating
      fire areas and no smoke barrier separating smoke compartments, isn''t concealed in a wall or floor/ceiling, isn''t open
      to a corridor in Group I or R, isn''t open to a corridor on an unsprinklered floor, and is separated from floor and
      air transfer openings serving other floors by construction as for the required shaft enclosures: a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part d. 1019.3 isn''t brought in. Shown for every
    building: whether an opening relies on it isn''t in the model.'
