  title: Which walls are fire partitions (BCNYS 708.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 173
    lines:
    - 13
    - 21
    quote: '708.1 General. The following wall assemblies shall comply with this section: 1. Separation walls as required by
      Section 420.2 for Group I-1 and Group R occupancies. 2. Walls separating tenant spaces in covered and open mall buildings
      as required by Section 402.4.2.1. 3. Corridor walls as required by Section 1020.3. 4. Enclosed elevator lobby separation
      as required by Section 3006.3. 5. Egress balconies as required by Section 1021.2 6. Walls separating ambulatory care
      facilities from adjacent spaces, corridors or tenants as required by Section 422.2. 7. Walls separating dwelling and
      sleeping units in Groups R-1 and R-2 in accordance with Sections 907.2.8.1 and 907.2.9.1. 8. Vestibules in accordance
      with Section 1028.2.'
  examples:
  - given: {}
    expect: needs_review
    note: 'These walls are fire partitions and meet Section 708: dwelling and sleeping unit separations in Groups I-1 and
      R (420.2), tenant separations in covered and open mall buildings (402.4.2.1), corridor walls (the book''s words name
      1020.3; 1020.2 sends rated corridor walls here), enclosed elevator lobbies (3006.3), egress balconies (1021.2), walls
      around ambulatory care facilities (422.2), walls between dwelling and sleeping units in Groups R-1 and R-2 (907.2.8.1,
