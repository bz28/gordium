  notes: 'Table 1017.2''s A, E, F-1, M, R, S-1 row: 200 ft without an automatic sprinkler system, 250 ft with one (note b:
    903.3.1.1 or 903.3.1.2; 903.3.1.2 permits an NFPA 13R system only in Group R occupancies (''Automatic sprinkler systems
    in Group R occupancies shall be permitted to be installed throughout in accordance with NFPA 13R''), and the table''s
    note sends the reader to Section 903 for where it is permitted: outside Group R a 13R system alone gets the column without
    a sprinkler system, and where only the sprinklered column would pass, a person checks the system). Measured as 1017.3
    says . 1017.2.1''s balcony increase is a person''s check where taken or not stated and the distance is within it; the
    other sections note a lists are the rule “Table 1017.2 note a: sections that change the distance (BCNYS)”. Over its distance
    in Group F-1 or S-1 with NFPA 13, 1017.2.2''s 400 ft is a person''s check (its one-story and ceiling conditions aren''t
    measured); in Group A, 1030.7 is, unless the architect states the space has no fixed seating (as the architect states
    it). Note e (R-3 and R-4 with an NFPA 13D system, 903.3.1.3) keeps such a building in the 200 ft column: 13D is no 903.3.1.1
    or 903.3.1.2 system. Hand-drafted in a Claude Code session (2026-11-23). Review round 1 (2026-11-23): a space note a sends
    elsewhere (as the architect states it), stated or not ruled out, needs review; Groups R-3 and R-4 with an NFPA 13D system
    (903.3.1.3: note e''s 903.2.8) are held to 1006.2.2.6''s 125 ft and 75 ft; in Group A, any travel needs review while fixed
    seating isn''t ruled out (1030.7); over 200 ft with an atrium stated or not ruled out needs review (1017.3.2.3). Review
    round 2 (2026-11-23): fixed seating stated or not ruled out, in any group, needs review (1030.7).'
