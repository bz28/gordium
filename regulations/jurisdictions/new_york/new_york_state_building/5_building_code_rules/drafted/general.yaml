- id: general.bc_703_2_1_1_nonsymmetrical_walls
  kind: flag
  topic: means_of_egress
  title: Nonsymmetrical rated walls tested from both faces (BCNYS 703.2.1.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 160
    lines:
    - 25
    - 29
    quote: 703.2.1.1 Nonsymmetrical wall construction. Interior walls and partitions of nonsymmetrical construction shall
      be tested with both faces exposed to the furnace, and the assigned fire-resistance rating shall be the shortest duration
      obtained from the two tests conducted in compliance with ASTM E119 or UL 263. Where evidence is furnished to show that
      the wall was tested with the least fire-resistant side exposed to the furnace, subject to acceptance of the building
      official, the wall need not be subjected to tests from the opposite side (see Section 705.5 for exterior walls).
  examples:
  - given: {}
    expect: needs_review
    note: 'An interior wall or partition built differently on its two faces (a shaft or exit enclosure wall with its layers
      on one side only; 713.4 sends shaft enclosures here) takes the shorter of its two fire tests, one from each face (ASTM E119 or UL 263),
      unless the building official accepts that it was tested with its weaker face to the fire; exterior walls go by 705.5
      instead: which walls are built so, and how they were tested, isn''t in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. Brought in alone because 713.4 says shaft enclosures
    meet it; 705.5 is not brought in.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_703_5_marking
  kind: flag
  topic: means_of_egress
  title: Rated walls identified in concealed spaces (BCNYS 703.5)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 161
    lines:
    - 22
    - 28
    quote: '703.5 Marking and identification. Where there is an accessible concealed floor, floor-ceiling or attic space,
      fire walls, fire barriers, fire partitions, smoke barriers and smoke partitions or any other wall required to have protected
      openings or penetrations shall be effectively and permanently identified with signs or stenciling in the concealed space.
      Such identification shall: 1. Be located within 15 feet (4572 mm) of the end of each wall and at intervals not exceeding
      30 feet (9144 mm) measured hori- zontally along the wall or partition. 2. Include lettering not less than 3 inches (76
      mm) in height with a minimum 3/8-inch (9.5 mm) stroke in a contrasting color incorporating the suggested wording, “FIRE
      AND/OR SMOKE BARRIER—PROTECT ALL OPENINGS,” or other wording.'
  examples:
  - given: {}
    expect: needs_review
    note: 'Where a floor, floor-ceiling or attic space is concealed but can be reached, each fire wall, fire barrier, fire
      partition, smoke barrier, smoke partition or other wall with protected openings or penetrations is effectively and permanently
      marked there with signs or stenciling: within 15 feet of each end of the wall and at most every 30 feet along it, lettered
      at least 3 inches high with a stroke of at least 3/8 inch in a contrasting colour, with wording such as "FIRE AND/OR
      SMOKE BARRIER - PROTECT ALL OPENINGS": signs aren''t in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. A requirement for every rated wall, the exit
    enclosures' and rated corridors' among them; shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
