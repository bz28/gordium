      outcome: needs_review
    expect: needs_review
    note: 'Between two rooms: a compartment''s door takes 20 in (exception 8).'
  - given:
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door between two rooms, 19.5 in clear
        measures:
          moe_door_clear_width: 19.5
          moe_door_leaves: 1
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: false
          moe_door_to_room_under_10_sf: false
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under every width an exception allows in Group B.
  - given:
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door with no stated clear opening
        measures:
          moe_door_leaves: 1
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: true
          moe_door_to_room_under_10_sf: false
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'No maker''s clear opening: the width isn''t measured (never the door''s size), so a person checks.'
  - given:
      occupancy_group: B
    parts:
      means_of_egress_door: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No door read: a building''s means of egress has doors, so a person checks.'
  notes: 'Section group 6a (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): every door the model gives,
    each with its maker''s stated clear opening only (never its size or its leaf: a door with none isn''t measured and needs
    review). 32 in, from one leaf where two leaves meet with no mullion (the number of leaves is stated; not stated, a pair
    isn''t ruled out). Gordium''s reading of the section''s own words, shown to confirm: a pair with a mullion between its
    leaves is two door openings, each of which "shall provide a minimum clear opening width of 32 inches" ("each door
    opening", its first sentence); the one-leaf words cover only "two door leaves without a mullion". So a mullioned pair is
    stated 1 leaf only where its stated clear width is the narrower leaf''s own opening, else 2 (needs review at 32 in or more). Group I-2''s 41 1/2 in for bed movement needs review between 32 and 41 1/2 in (which doors move beds
    isn''t shown), in a building of two or more groups too (1004.4). The exceptions only loosen it, each where the model can''t
    rule it out and only down to its own width: a door that may be in a dwelling or sleeping unit (1 and 6: Groups R-2, R-3,
    I-1 and R-4), to a Group I-3 resident sleeping unit (2: 28 in), to a storage closet under 10 sq ft (3), within a Type
    B unit (7: 31.75 in), serving a compartment (8 and 9: 20 in, a shower compartment''s per the Plumbing Code of New York
    State 421.4.2). A door is ruled out of a unit only on a corridor the building states is in no dwelling unit, or marked
    an exit into an enclosure, passageway or horizontal exit (Gordium''s reading: a unit''s entrance door and a door into
    an exit are part of the required means of egress and no interior door within the unit, so exceptions 1 and 6 don''t reach
    them); of a compartment, only marked an exit into an enclosure, passageway or horizontal exit (exception 8 says nothing
    of what the door opens onto: a fitting room or sauna may open onto a corridor, or straight outside by a door marked an
    exit; review rounds 1 and 2; Gordium''s reading: a door into an exit serves the exit, no compartment). The capacity for
    the occupant load is its own flag. Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_1_door_height
  kind: rule
  topic: means_of_egress
  title: Door clear height at least 80 in (BCNYS 1010.1.1)
  check: moe_door_clear_height >= 80
  review_when:
  - when: moe_door_clear_height >= 78 and moe_door_clear_height < 80 and not moe_door_exterior and not moe_door_exit and not
      (moe_door_to_corridor and not corridors_within_dwelling_units)
    reason: 'Under 80 in, but exception 4 allows 78 in for a door within a dwelling or sleeping unit, and whether this door
      is one isn''t shown: a person checks.'
  - when: moe_door_clear_height >= 76 and moe_door_clear_height < 80 and moe_door_exterior
    reason: 'Under 80 in, but exception 5 allows 76 in for an exterior door of a dwelling or sleeping unit not required to
      be an Accessible, Type A or Type B unit, other than its required exit door, and whether this door is one isn''t shown:
      a person checks.'
  for_each: means_of_egress_door
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
    - 37
    - 43
    quote: 1010.1.1 Size of doors. The required capacity of each door opening shall be sufficient for the occupant load thereof
      and shall provide a minimum clear opening width of 32 inches (813 mm). The clear opening width of doorways with swinging
      doors shall be measured between the face of the door and the frame stop, with the door open 90 degrees (1.57 rad). Where
      this section requires a minimum clear opening width of 32 inches (813 mm) and a door opening includes two door leaves
      without a mullion, one leaf shall provide a minimum clear opening width of 32 inches (813 mm). In Group I-2, doors serving
      as means of egress doors where used for the movement of beds shall provide a minimum clear opening width of 41 1/2 inches
      (1054 mm). The minimum clear open- ing height of doors shall be not less than 80 inches (2032 mm).
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
    - 51
    - 54
    quote: 4. Door openings within a dwelling unit or sleeping unit shall have a minimum clear opening height of 78 inches
      (1981 mm). 5. In dwelling and sleeping units that are not required to be Accessible, Type A or Type B units, exterior
      door openings other than the required exit door shall have a minimum clear opening height of 76 inches (1930 mm).
  examples:
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Door, 80 in clear high
        measures:
          moe_door_clear_height: 80
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: true
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 80 in.
  - given:
      corridors_within_dwelling_units: false
    parts:
      means_of_egress_door:
      - id: p1
        name: Corridor door, 79 in clear high
        measures:
          moe_door_clear_height: 79
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: true
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'On a corridor the building states is in no dwelling unit: 80 in.'
  - given:
      corridors_within_dwelling_units: false
    parts:
      means_of_egress_door:
      - id: p1
        name: Door between two rooms, 78 in clear high
        measures:
          moe_door_clear_height: 78
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: false
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Between two rooms, maybe within a dwelling or sleeping unit: 78 in there (exception 4).'
  - given:
      corridors_within_dwelling_units: false
    parts:
      means_of_egress_door:
      - id: p1
        name: Door between two rooms, 77.5 in clear high
        measures:
          moe_door_clear_height: 77.5
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: false
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under the 78 in exception 4 allows inside a unit.
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Exterior door, 76 in clear high
        measures:
          moe_door_clear_height: 76
          moe_door_exit: false
          moe_door_exterior: true
          moe_door_to_corridor: false
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'An exterior door, maybe a dwelling unit''s other than its required exit door: 76 in there (exception 5).'
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Exterior door, 75.5 in clear high
        measures:
          moe_door_clear_height: 75.5
          moe_door_exit: false
          moe_door_exterior: true
          moe_door_to_corridor: false
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Under every height an exception allows.
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Door with no stated clear opening
        measures:
          moe_door_exit: false
          moe_door_exterior: false
          moe_door_to_corridor: true
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'No maker''s clear opening: the height isn''t measured, so a person checks.'
  - given: {}
    parts:
      means_of_egress_door: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No door read: a person checks.'
  notes: 'Section group 6a: 80 in for every door the model gives, from its maker''s stated clear height only (none stated:
    not measured, needs review). The exceptions only loosen it, each only where the model can''t rule it out and only down
    to its own height: 78 in for a door within a dwelling or sleeping unit (4: ruled out on outside, an exit door, or a corridor
    the building states is in no unit), 76 in for a unit''s exterior door other than its required exit door (5: any exterior
    door may be one). Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_1_door_capacity
  kind: flag
  topic: means_of_egress
  title: Each door's capacity for its occupant load (BCNYS 1010.1.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 322
    lines:
    - 37
    - 38
    quote: 1010.1.1 Size of doors. The required capacity of each door opening shall be sufficient for the occupant load thereof
      and shall provide a minimum clear opening width of 32 inches (813 mm). The clear opening width of doorways with swinging
      doors shall be
  examples:
  - given: {}
    expect: needs_review
    note: 'Each door opening''s capacity is enough for the occupants it serves (1005.3.2: 0.2 in each, 0.15 in with a sprinkler
      system and an emergency voice/alarm system, other than Groups H and I-2): which occupants each door serves isn''t worked
      out, so a person''s check.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-25), section group 6a. The routes don''t divide a story''s occupants
    between its doors, and a door at a stair''s discharge serves every story above: its 32 in and 80 in are the rules for
    each door.'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_1_1_projections
  kind: flag
  topic: means_of_egress
  title: Nothing projects into a door's clear opening (BCNYS 1010.1.1.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 323
    lines:
    - 6
    - 10
    quote: '1010.1.1.1 Projections into clear opening. There shall not be projections into the required clear opening width
      lower than 34 inches (864 mm) above the floor or ground. Projections into the clear opening width between 34 inches
      (864 mm) and 80 inches (2032 mm) above the floor or ground shall not exceed 4 inches (102 mm). Exception: Door closers,
      overhead doorstops, frame stops, power door operators, and electromagnetic door locks shall proj- ect into the door
      opening height not lower than 78 inches (1980 mm) above the floor.'
  examples:
  - given: {}
    expect: needs_review
    note: 'No projection into a door''s required clear width below 34 in, at most 4 in between 34 and 80 in, and door closers,
      overhead doorstops, frame stops, power operators and electromagnetic locks no lower than 78 in: door hardware isn''t
      in the model, so a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-25), section group 6a.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_2_door_types
  kind: flag
  topic: means_of_egress
  title: An egress door that isn't swinging (BCNYS 1010.1.2)
  applies_when: not moe_door_swinging
  for_each: means_of_egress_door
  when_none: not_applicable
  sources:
  - file: gov.ny.building.2025.pdf
    page: 323
    lines:
    - 11
    - 23
    quote: '1010.1.2 Egress door types. Egress doors shall be of the side-hinged swinging door, pivoted door, or balanced
      door types. Exceptions: 1. Private garages, office areas, factory and storage areas with an occupant load of 10 or less.
      2. Group I-3 occupancies used as a place of detention. 3. Critical or intensive care patient rooms within suites of
      health care facilities. 4. Doors within or serving a single dwelling unit in Groups R-2 and R-3. 5. In other than Group
      H occupancies, revolving doors complying with Section 1010.3.1. 6. In other than Group H occupancies, special purpose
      horizontal sliding, accordion or folding door assemblies comply- ing with Section 1010.3.3. 7. Power-operated doors
      in accordance with Section 1010.3.2. 8. Doors serving a bathroom within an individual dwelling unit or sleeping unit
      in Group R-1. 9. In other than Group H occupancies, manually operated horizontal sliding doors are permitted in a means
      of egress from spaces with an occupant load of 10 or less.'
  examples:
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Sliding door
        measures:
          moe_door_swinging: false
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Not a side-hinged, pivoted or balanced door, but 1010.1.2''s exceptions allow other kinds the model doesn''t tell
      apart: a power-operated door per 1010.3.2 in any group; a revolving door per 1010.3.1 or a special-purpose horizontal
      sliding, accordion or folding door per 1010.3.3 other than in Group H; doors within or serving a single dwelling unit
      in Groups R-2 and R-3; a bathroom door in a Group R-1 unit; private garages, office, factory and storage areas, and
      other than in Group H spaces left by a manual sliding door, with 10 occupants or fewer; Group I-3 detention; critical
      or intensive care rooms in health care suites: a person checks.'
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Side-hinged door
        measures:
          moe_door_swinging: true
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'A side-hinged swinging door is one of 1010.1.2''s own kinds: nothing to check.'
  - given: {}
    parts:
      means_of_egress_door:
      - id: p1
        name: Door whose operation isn't stated
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'How the door operates isn''t stated (or is given as other: a pivoted or balanced door, or another kind): a person
      checks.'
  - given: {}
    parts:
      means_of_egress_door: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No door: nothing to check here (the door size rules need review where no door is read).'
  notes: 'Section group 6b (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): every door the model gives,
    its kind from the description''s door operation (side-hinged: swinging; sliding, folding, pocket: not; other: not known,
    a pivoted or balanced door among them). A door that isn''t swinging, or whose kind isn''t known, is a person''s check,
    never a fail: exception 7''s power-operated doors (1010.3.2) are allowed in every group and the model doesn''t say whether
    a door is power-operated. Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_1010_1_2_1_direction_of_swing
  kind: rule
  topic: means_of_egress
  title: Door swings with egress travel at 50 or more, or Group H (BCNYS 1010.1.2.1)
  check: not moe_door_swinging or moe_door_swings_with_egress or (moe_door_occupant_load < 50 and occupancy_group not in
    ["H-1", "H-2", "H-3", "H-4", "H-5", "mixed"])
  review_when:
  - when: moe_door_swinging and moe_door_exterior and not moe_door_exit and occupied_outdoor_areas
    reason: 'A door to outside that isn''t an exit, in a building whose occupants use outdoor areas (stated, or not ruled
      out): a patio''s or roof''s occupants may come in through it (1004.7), so which way egress travel goes through it isn''t
      known: a person checks.'
  - when: moe_door_swinging and not moe_door_swings_with_egress and occupancy_group not in ["H-1", "H-2", "H-3", "H-4", "H-5"]
      and not moe_door_occupant_load >= 50 and not moe_door_occupant_load < 50
    reason: 'Swinging against egress travel (or which way isn''t known), but 1010.1.2.1 asks it to swing with egress travel
      only where it serves 50 or more or a Group H occupancy, and how many each door serves isn''t worked out (a door may
      serve other stories, or outdoor areas, the model doesn''t hold): a person checks.'
  - when: occupancy_group == "mixed" and moe_door_occupant_load < 50 and moe_door_swinging and not moe_door_swings_with_egress
    reason: 'Swinging against egress travel and serving under 50, in a building of two or more groups: it must swing with
      egress travel only if a Group H occupancy is among them or it serves one, which isn''t shown: a person checks.'
  for_each: means_of_egress_door
  when_none: needs_review
  sources:
  - file: gov.ny.building.2025.pdf
    page: 323
    lines:
    - 24
    - 25
    quote: 1010.1.2.1 Direction of swing. Side-hinged swinging doors, pivoted doors and balanced doors shall swing in the
      direction of egress travel where serving a room or area containing an occupant load of 50 or more persons or a Group
      H occupancy.
  examples:
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door swinging out of a room into the corridor
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: true
          moe_door_occupant_load: 120
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: It swings in the direction of egress travel.
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door swinging into a room of 49
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: false
          moe_door_occupant_load: 49
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Under 50 occupants, not Group H: either way.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door swinging against egress, serving 50
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: false
          moe_door_occupant_load: 50
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: '50 or more occupants: it must swing with egress travel.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: H-2
    parts:
      means_of_egress_door:
      - id: p1
        name: Group H door swinging against egress, serving 5
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: false
          moe_door_occupant_load: 5
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Group H: with egress travel whatever the load.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: mixed
    parts:
      means_of_egress_door:
      - id: p1
        name: Door swinging against egress, serving 5, in a building of two groups
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: false
          moe_door_occupant_load: 5
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Two or more groups: whether a Group H occupancy is among them isn''t shown.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Door whose swing isn't stated, serving 120
        measures:
          moe_door_swinging: true
          moe_door_occupant_load: 120
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Which way it swings isn''t stated: a person checks.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Sliding door
        measures:
          moe_door_swinging: false
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'Not a swinging door: 1010.1.2.1 asks only side-hinged, pivoted and balanced doors (its kind is 1010.1.2''s flag).'
  - given:
      occupied_outdoor_areas: true
      occupancy_group: B
    parts:
      means_of_egress_door:
      - id: p1
        name: Patio door swinging out, not an exit, serving 120
        measures:
          moe_door_swinging: true
          moe_door_swings_with_egress: true
          moe_door_exterior: true
          moe_door_exit: false
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'A door to an occupied outdoor area that isn''t an exit: the area''s occupants may come in through it (1004.7), so
      which way egress travel goes through it isn''t known.'
  - given:
      occupied_outdoor_areas: false
      occupancy_group: B
    parts:
      means_of_egress_door: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No door read: a person checks.'
  notes: 'Section group 6b: every door the model gives; one that isn''t swinging complies (1010.1.2.1 asks it nothing), one
    whose operation is other or not stated may be swinging. Whether it swings with egress travel: the side it swings into,
    as the description states it (no Revit mark yet), against the side egress travel goes into through it, as the routes
    find it, known only where travel crosses the door one way alone (into an exit stair or passageway where its room has
    its own door marked an exterior exit door at discharge on the story, or the story has none to outside; outside through
    a door marked an exterior exit door at discharge only: any unmarked door to outside, a stair''s own included, may be
    a patio''s, a walkway''s or a balcony''s way in; a horizontal exit is used both ways; else away from the one room it
    is an exit access door of, where that room is stated end-only; review rounds 1 to 7). How many people each door serves
    isn''t worked out (the routes don''t split occupants between doors, a door may serve other stories, outdoor areas
    1004.7 adds, or stories the model doesn''t hold: review rounds 1 and 7), so it complies swinging with egress travel,
    or under 50 only where that is stated by hand; it fails swinging against egress travel in a building stated Group H,
    or serving 50 or more as stated; else it needs review. Hand-drafted in a Claude Code session (2026-11-25).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
