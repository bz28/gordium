    quote: 5. Means of egress from dwelling units or sleeping areas shall not lead through other sleeping areas, toilet rooms
      or bathrooms. 6. Egress shall not pass through kitchens, storage rooms, closets or spaces used for similar purposes.
  - file: gov.ny.building.2025.pdf
