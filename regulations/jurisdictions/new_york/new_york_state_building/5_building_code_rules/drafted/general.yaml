- id: general.bc_716_2_2_3_exit_enclosure_door_temperature_rise
  kind: flag
  topic: means_of_egress
  title: Exit stairway and passageway doors' temperature rise (BCNYS 716.2.2.3)
  applies_when: not sprinklered_903_3_1_1 and not (sprinklered_903_3_1_2 and occupancy_group in ["R-1", "R-2", "R-3", "R-4"])
  sources:
  - file: gov.ny.building.2025.pdf
    page: 188
    lines:
    - 12
    - 16
    quote: '716.2.2.3 Doors in interior exit stairways and ramps and exit passageways. Fire door assemblies in interior exit
      stairways and ramps and exit passageways shall have a maximum transmitted temperature rise of not more than 450°F (250°C)
      above ambient at the end of 30 minutes of standard fire test exposure. Exception: The maximum transmitted temperature
      rise is not required in buildings equipped throughout with an automatic sprinkler system installed in accordance with
      Section 903.3.1.1 or 903.3.1.2.'
  examples:
  - given:
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      occupancy_group: R-2
    expect: needs_review
    note: 'A fire door in an interior exit stairway or ramp or an exit passageway transmits a temperature rise of at most
      450 degrees F above ambient at the end of 30 minutes of the standard fire test, unless the building is equipped throughout
      with an automatic sprinkler system per 903.3.1.1 or 903.3.1.2: with neither stated (a 13R system counts only in
      Group R, within 903.3.1.2''s four stories), a person''s check (the doors'' test results aren''t in the model).'
  - given:
      sprinklered_903_3_1_1: true
      occupancy_group: B
    expect: not_applicable
    note: 'A building stated sprinklered throughout per 903.3.1.1: the exception takes the temperature rise away.'
  - given:
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      occupancy_group: R-2
    expect: not_applicable
    note: 'A Group R building stated sprinklered per 903.3.1.2 (NFPA 13R, which 903.3.1.2 allows in Group R): the exception
      applies.'
  - given:
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      occupancy_group: B
    expect: needs_review
    note: 'An NFPA 13R system in a Group B building isn''t one 903.3.1.2 allows: the exception isn''t taken, a person''s check.'
  - given:
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: true
      occupancy_group: mixed
    expect: needs_review
    note: 'Two or more groups with an NFPA 13R system: whether 903.3.1.2 allows it throughout isn''t shown, a person''s check.'
  - given: {}
    expect: needs_review
    note: 'No sprinkler system stated: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part b. The exception is read on the architect's statement
    of the sprinkler system, NFPA 13R counted only in a Group R building (903.3.1.2 allows it there), as Chapter 10's tables
    read it; 903.3.1.1 and 903.3.1.2 are brought in alone.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
