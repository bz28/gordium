          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: Not Permitted without an automatic sprinkler system, whatever the distance.
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      egress_balcony_increase_taken: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      building_has_atrium: false
    parts:
      story:
      - id: p1
        name: At the sprinklered limit
        measures:
          egress_travel_distance: 200
          egress_travel_in_sleeping_room: 40
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 'NFPA 13 (903.3.1.1): 200 ft complies (at most).'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      egress_balcony_increase_taken: false
      assembly_fixed_seating: false
      special_egress_spaces: false
      building_has_atrium: false
    parts:
      story:
      - id: p1
        name: Just past the sprinklered limit
        measures:
          egress_travel_distance: 200.5
          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'NFPA 13: over 200 ft (no balcony increase taken, stated).'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
      assembly_fixed_seating: false
      building_has_atrium: false
    parts:
      story:
      - id: p1
        name: Ward, a long bedroom
        measures:
          egress_travel_distance: 120
          egress_travel_in_sleeping_room: 55
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Group I-2: 55 ft within a sleeping room, over 407.4.2''s 50 ft (a care suite''s 100 ft may apply).'
  - given:
      occupancy_group: I-3
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      special_egress_spaces: false
      egress_balcony_increase_taken: false
      assembly_fixed_seating: false
      building_has_atrium: false
    parts:
      story:
      - id: p1
        name: Housing unit
        measures:
          egress_travel_distance: 120
          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'Group I-3: 408.6.1''s smoke-barrier distances aren''t measured.'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: false
      sprinklered_903_3_1_2: false
      building_has_atrium: false
      assembly_fixed_seating: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p1
        name: No sprinkler system
        measures:
          egress_travel_distance: 20
          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: Whether the building holds a space note a sends elsewhere isn't stated.
  - given:
      occupancy_group: B
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      special_egress_spaces: false
      building_has_atrium: false
      assembly_fixed_seating: false
      egress_balcony_increase_taken: false
    parts:
      story:
      - id: p1
        name: Another group's
        measures:
          egress_travel_distance: 10
          egress_travel_in_sleeping_room: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Group B is not in this row (a mixed building is general''s flag): not applicable.'
  - given:
      occupancy_group: I-2
      sprinklered_903_3_1_1: true
      sprinklered_903_3_1_2: false
      special_egress_spaces: false
      building_has_atrium: false
      assembly_fixed_seating: false
      egress_balcony_increase_taken: false
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: with none, the rule needs review.'
  notes: 'Table 1017.2''s I-2, I-3 row: Not Permitted without an automatic sprinkler system, 200 ft with one (note c: 903.3.1.1
    only, so an NFPA 13R system gets the column without one). Measured as 1017.3 says . 1017.2.1''s balcony increase is a
    person''s check where taken or not stated and the distance is within it; the other sections note a lists are the rule
    “Table 1017.2 note a: sections that change the distance (BCNYS)”. Note a''s 407.4 (I-2) and 408.6.1, 408.8.1 (I-3) change
    travel further and aren''t brought in: the rule “Table 1017.2 note a: sections that change the distance (BCNYS)” shows
    for a person to check them. Hand-drafted in a Claude Code session (2026-11-23). Review round 1 (2026-11-23): a space note
    a sends elsewhere (as the architect states it), stated or not ruled out, needs review; Group I-2 holds a sleeping room
    to 407.4.2''s 50 ft (over it, a care suite''s 100 ft may apply: review), and Group I-3 never passes (408.6.1''s smoke-barrier
    distances aren''t measured). Review round 2 (2026-11-23): fixed seating stated or not ruled out, in any group, needs review
    (1030.7).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.bc_table_1017_2_note_a
  kind: flag
  topic: means_of_egress
  title: 'Table 1017.2 note a: sections that change the distance (BCNYS)'
  sources:
  - file: gov.ny.building.2025.pdf
    page: 341
    lines:
    - 40
    - 53
    quote: 'a. See the following sections for modifications to exit access travel distance requirements: Section 402.8: For
      the distance limitation in malls. Section 407.4: For the distance limitation in Group I-2. Sections 408.6.1 and 408.8.1:
      For the distance limitations in Group I-3. Section 411.2: For the distance limitation in special amusement areas. Section
      412.6: For the distance limitations in aircraft manufacturing facilities. Section 1006.2.2.2: For the distance limitation
      in refrigeration machinery rooms. Section 1006.2.2.3: For the distance limitation in refrigerated rooms and spaces.
      Section 1006.3.4: For buildings with one exit. Section 1017.2.2: For increased distance limitation in Groups F-1 and
      S-1. Section 1017.2.3: For increased distance limitation in Group H-5. Section 1030.7: For increased limitation in assembly
      seating. Section 3103.4: For temporary structures. Section 3104.9: For pedestrian walkways.'
  examples:
  - given:
      special_egress_spaces: true
    expect: needs_review
    note: 'A person checks whether the building has a mall, a Group I-2 or I-3 occupancy, a special amusement area, an aircraft
      manufacturing facility, a refrigeration machinery room or a refrigerated room, assembly seating, a temporary structure
      or a pedestrian walkway: each has its own distance (note a), not brought in.'
  - given: {}
    expect: needs_review
    note: 'Not stated: a person checks (note a).'
  - given:
      special_egress_spaces: false
    expect: not_applicable
    note: 'The architect states the building has none of note a''s or 1006.2.2''s spaces: not applicable.'
  notes: 'Note a''s sections change Table 1017.2''s distances for particular spaces the model doesn''t mark (some shorter:
    refrigeration machinery rooms and refrigerated rooms within 150 ft where not sprinklered, 1006.2.2.2 and 1006.2.2.3),
    so the rows'' rules may pass a building that holds one: this flag always shows. 1006.3.4 (one exit), 1017.2.2 (F-1, S-1)
    and 1017.2.3 (H-5) are this rulebook''s own rules and flags. Hand-drafted in a Claude Code session (2026-11-23). Review
    round 1 (2026-11-23): shown only where such a space is stated or not ruled out; every row of Table 1017.2 needs review
    then, never falling back on its own distance.'
