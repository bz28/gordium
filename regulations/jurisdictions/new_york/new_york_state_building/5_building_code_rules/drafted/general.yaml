- id: general.bc_714_4_1_through_penetrations
  kind: flag
  topic: means_of_egress
  title: Through penetrations of rated walls (BCNYS 714.4.1)
  sources:
  - file: gov.ny.building.2025.pdf
    page: 180
    lines:
    - 20
    - 30
    quote: '714.4.1 Through penetrations. Through penetrations of fire-resistance-rated walls shall comply with Section 714.4.1.1
      or 714.4.1.2. Exception: Where the penetrating items are steel, ferrous or copper pipes, tubes or conduits, the annular
      space between the penetrating item and the fire-resistance-rated wall is permitted to be protected by either of the
      following measures: 1. In concrete or masonry walls where the penetrating item is a maximum 6-inch (152 mm) nominal
      diameter and the area of the opening through the wall does not exceed 144 square inches (0.0929 m[fn2]), concrete, grout
      or mortar is permitted where installed the full thickness of the wall or the thickness required to maintain the fire-resistance
      rating. 2. The material used to fill the annular space shall prevent the passage of flame and hot gases sufficient to
      ignite cotton waste when subjected to ASTM E119 or UL 263 time-temperature fire conditions under a minimum positive
      pressure differential of 0.01 inch of water (2.49 Pa) at the location of the penetration for the time period equivalent
      to the fire- resistance rating of the construction penetrated.'
  examples:
  - given: {}
    expect: needs_review
    note: 'A through penetration of a rated wall meets 714.4.1.1 or 714.4.1.2; except a steel, ferrous or copper pipe, tube
      or conduit, whose annular space may be filled with concrete, grout or mortar the full thickness of a concrete or masonry
      wall or the thickness that keeps its rating (an item at most 6 inches nominal diameter through an opening at most 144
      square inches), or with a material that stops flame and hot gases for the wall''s rating under ASTM E119 or UL 263 fire
      conditions at a positive pressure differential of at least 0.01 inch of water: a person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part d. Shown for every building.
  drafted_by: claude_code/claude-opus-5-5
  status: draft
