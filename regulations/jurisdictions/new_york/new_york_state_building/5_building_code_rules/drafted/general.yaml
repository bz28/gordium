    note: 'The construction supporting a fire barrier is protected to the fire barrier''s required rating, and hollow vertical
      spaces within a fire barrier are fireblocked per 718.2 at every floor level; except tank storage barriers (415.9.1.2:
      at most 2 hours, but not less than Table 601 asks) and, in Types IIB, IIIB and VB, the support of 1-hour fire barriers
      that Table 509.1 asks, unless another section of the code requires it rated: the structure isn''t in the model, so a
      person''s check.'
  notes: Hand-drafted in a Claude Code session (2026-11-26), Chapter 7 part a. 718.2, 415.9.1.2, Table 601 and Table 509.1
    aren't brought in. Shown for every building.
