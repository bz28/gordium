    (the rule “Exits per story by occupant load, one where 1006.3.4 allows (BCNYS 1006.3.3)”) and Group R-2 of dwelling
    units (Table 1006.3.4(1): the rule “A story''s one exit, R-2 dwelling units (BCNYS Table 1006.3.4(1))”), with
    1006.3.4''s single exits: item 1''s Table 1006.3.4(2) rows (the first story above or below grade plane: A, B, E, F,
    M and U 49 occupants and 75 ft, 100 ft in B and F with NFPA 13, note b; H-2 and H-3 3 and 25 ft; H-4, H-5, I, R-1
    and R-2 of sleeping units 10 and 75 ft, R-2 only per note a, a sprinkler system and escape openings per 1031; S 29
    and 75 ft, 100 ft with NFPA 13; the second story: B, F, M and S 29 and 75 ft (note b''s 100 ft is printed on the
    first story''s rows only, p.317); the third story and higher NP), and item 4 (Groups R-3 and R-4). Item 2 (rooms
    exiting directly outside, stated or not ruled out) and Group S-2''s items 3 and note d need review where they could
    allow one exit. Item 5 (a dwelling unit''s own single exit) is a unit''s, not a story''s. Occupiable roofs are not
    measured. Hand-drafted in a Claude Code session (2026-11-23). Review round 4 (2026-11-23): a story allowed one exit
    only by its travel needs review while fixed seating (1030.7) or a space the code gives its own exits or travel limit
    is stated or not ruled out. Group 2 review round 1 (2026-11-24): the second story''s travel is 75 ft in B and F too,
    sprinklered or not (note b is printed on the first story''s rows only). The story''s place against the grade plane
    is worked out from the model (2026-11-25): the floor elevations of each level''s rooms and the ground the architect
    states (202 GRADE PLANE, STORY ABOVE GRADE PLANE, BASEMENT), measured only where every grade plane that ground
    allows gives the same place, else needs review. A basement is never proven (review round 6). With spot grades, Gordium''s reading,
