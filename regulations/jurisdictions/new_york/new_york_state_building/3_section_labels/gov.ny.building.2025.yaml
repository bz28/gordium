  903.2.11.1:
    label: flag
    topic: means_of_egress
    reason: 'A story (basements included) over 1,500 square feet is sprinklered throughout unless, in each 50 feet of exterior
      wall on at least one side, it has openings below grade reached by an exterior stairway per 1011 or a ramp ...: a person''s
      check (general.bc_903_2_11_1_stories_without_openings).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 272
      lines:
      - 34
      - 44
      quote: '[F] 903.2.11.1 Stories without openings. An automatic sprinkler system shall be installed throughout all stories,
        including basements, of all buildings where the floor area exceeds 1,500 square feet (139.4 m[fn2]) and where the
        story does not comply with the following criteria for exterior wall openings: 1. Openings below grade that lead directly
        to ground level by an exterior stairway complying with Section 1011 or an outside ramp complying with Section 1012.
        Openings shall be located in each 50 linear feet (15 240 mm), or fraction thereof, of exterior wall in the story on
        not fewer than one side. The required openings shall be distributed such that the lineal distance between adjacent
        openings does not exceed 50 feet (15 240 mm). 2. Openings entirely above the adjoining ground level totaling not less
        than 20 square feet (1.86 m[fn2]) in each 50 linear feet (15 240 mm), or fraction thereof, of exterior wall in the
        story on not fewer than one side. The required openings shall be distributed such that the lineal distance between
        adjacent openings does not exceed 50 feet (15 240 mm). The height of the bottom of the clear opening shall not exceed
        44 inches (1118 mm) measured from the floor.'
    piece_sha256: 1e8e3e4de79185e4bcf5365b58df8c7ba7500782d339bc804f8856cc3e29ee47
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part c.
