  905.4.1:
    label: flag
    topic: means_of_egress
    reason: 'Class I standpipe risers and laterals not in an interior exit stairway have the fire resistance the building''s
      vertical enclosures need (laterals left unenclosed in a building sprinklered throughout): a person''s check (general.bc_905_4_1_standpipe_protection).'
    sources:
