      quote: '716.2.2.1.1 Smoke and draft control. The air leakage rate of the door assembly shall not exceed 3.0 cubic feet
        per minute per square foot (0.01524 m[fn3]/s × m[fn2]) of door opening at 0.10 inch of water (25 Pa) for both the
        ambient temperature and elevated temperature tests. Louvers shall be prohibited. Terminated stops shall be prohibited
        on doors required by Section 405.4.3 to comply with Section 716.2.2.1 and prohibited on doors required by Item 3 of
        Section 3006.3, or Section 3007.6.3 or 3008.6.3 to comply with this section. Exception: Elevator hoistway door openings
        protected in accordance with Section 3006.3.'
    piece_sha256: ba1678cc47fa7c47f164b5609ce1db12ee42f92e8cf3089aef75f4212a1a2603
