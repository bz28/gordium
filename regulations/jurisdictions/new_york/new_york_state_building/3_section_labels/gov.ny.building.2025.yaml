  909.20.6.1:
    label: flag
    topic: means_of_egress
    reason: 'The enclosure''s ventilation is independent of other systems, its equipment, wiring and ductwork outside the
      building, within the enclosure, or within the building behind 2-hour fire barriers per 707 or horizontal assemblies
      per 711 (wiring outside them protected by 2-hour UL 2196 cables, 2 inches of concrete, or 2-hour electrical circuit
      protective systems installed per their listing): a person''s check (general.bc_909_20_6_1_ventilation_systems).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 302
      lines:
      - 45
      - 60
      quote: '909.20.6.1 Ventilation systems. Smokeproof enclosure ventilation systems shall be independent of other building
        ventilation systems. The equipment, control wiring, power wiring and ductwork shall comply with one of the following:
        1. Equipment, control wiring, power wiring and ductwork shall be located exterior to the building and directly connected
        to the smokeproof enclosure or connected to the smokeproof enclosure by ductwork enclosed by not less than 2-hour
        fire barriers constructed in accordance with Section 707 or horizontal assemblies constructed in accor- dance with
        Section 711, or both. 2. Equipment, control wiring, power wiring and ductwork shall be located within the smokeproof
        enclosure with intake or exhaust directly from and to the outside or through ductwork enclosed by not less than 2-hour
        fire barriers constructed in accordance with Section 707 or horizontal assemblies constructed in accordance with Section
        711, or both. 3. Equipment, control wiring, power wiring and ductwork shall be located within the building if separated
        from the remainder of the building, including other mechanical equipment, by not less than 2-hour fire barriers constructed
        in accordance with Section 707 or horizontal assemblies constructed in accordance with Section 711, or both. Exception:
        1. Control wiring and power wiring located outside of a 2-hour fire barrier construction shall be protected using
        any one of the following methods:'
    - file: gov.ny.building.2025.pdf
      page: 303
      lines:
      - 3
      - 7
      quote: 1.1. Cables used for survivability of required critical circuits shall be listed in accordance with UL 2196 and
        shall have a fire-resistance rating of not less than 2 hours. 1.2. Where encased with not less than 2 inches (51 mm)
        of concrete. 1.3. Electrical circuit protective systems shall have a fire-resistance rating of not less than 2 hours.
        Electrical circuit protective systems shall be installed in accordance with their listing requirements.
    piece_sha256: 798f0cef0b27a516cef9a6150e04de2105dd32c25f00c9096de4b26141ee54a0
