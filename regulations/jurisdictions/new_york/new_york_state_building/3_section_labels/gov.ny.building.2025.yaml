  907.2.11.7:
    label: flag
    topic: means_of_egress
    reason: 'Smoke detectors listed per UL 268 in the building fire alarm system may stand in for smoke alarms where the system
      meets Section 907, a detector in a unit sounds notification in the unit per 907.5.2, and not outside it where a supervisory
      signal is monitored per 907.6.6: a person''s check (general.bc_907_2_11_7_smoke_detection_instead).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 49
      - 57
      quote: '[F] 907.2.11.7 Smoke detection system. Smoke detectors listed in accordance with UL 268 and provided as part
        of the build- ing fire alarm system shall be an acceptable alternative to single- and multiple-station smoke alarms
        and shall comply with the following: 1. The fire alarm system shall comply with all applicable requirements in Section
        907. 2. Activation of a smoke detector in a dwelling unit or sleeping unit shall initiate alarm notification in the
        dwelling unit or sleeping unit in accordance with Section 907.5.2. 3. Activation of a smoke detector in a dwelling
        unit or sleeping unit shall not activate alarm notification appliances outside of the dwelling unit or sleeping unit,
        provided that a supervisory signal is generated and monitored in accor- dance with Section 907.6.6.'
    piece_sha256: 9fd460bbde0f022446788b7dc3130cd0043169eb363ef3fe18e02b1668c01096
