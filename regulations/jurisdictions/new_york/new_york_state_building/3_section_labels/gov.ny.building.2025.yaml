  1009.3.2:
    label: flag
    topic: means_of_egress
    reason: 'A stairway in an accessible means of egress has at least 48 inches clear between handrails; not required in a
      building sprinklered throughout per 903.3.1.1 or 903.3.1.2, or for stairways reached from a refuge area with a horizontal
      exit: which stairways serve as an accessible means of egress, and their width between handrails, aren''t measured, so
      a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 21
      - 26
      quote: '1009.3.2 Stairway width. Stairways shall have a clear width of 48 inches (1219 mm) minimum between handrails.
        Exceptions: 1. The clear width of 48 inches (1219 mm) between handrails is not required in buildings equipped throughout
        with an automatic sprinkler system installed in accordance with Section 903.3.1.1 or 903.3.1.2. 2. The clear width
        of 48 inches (1219 mm) between handrails is not required for stairways accessed from a refuge area in conjunction
        with a horizontal exit.'
    piece_sha256: 04858c781fc6ca4a06ee23947688b14e3ce5d2bba6982aecd7c77319ec91ae7e
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1009.3.3:
    label: flag
    topic: means_of_egress
    reason: 'A stairway in an accessible means of egress has an area of refuge within an enlarged floor-level landing or is
      reached from one complying with 1009.6; not required at exit access stairways with two-way communication at the elevator
      landing (1009.8), in a building sprinklered throughout per 903.3.1.1 or 903.3.1.2, at open parking garages'' stairways,
      for smoke-protected or open-air assembly seating (1030.6.2 and 1030.6.3), in Group R-2, or for stairways reached from
      a refuge area with a horizontal exit: areas of refuge aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 27
      - 38
      quote: '1009.3.3 Area of refuge. Stairways shall either incorporate an area of refuge within an enlarged floor-level
        landing or shall be accessed from an area of refuge complying with Section 1009.6. Exceptions: 1. Areas of refuge
        are not required at exit access stairways where two-way communication is provided at the elevator landing in accordance
        with Section 1009.8. 2. Areas of refuge are not required at stairways in buildings equipped throughout with an automatic
        sprinkler system installed in accordance with Section 903.3.1.1 or 903.3.1.2. 3. Areas of refuge are not required
        at stairways serving open parking garages. 4. Areas of refuge are not required for smoke-protected or open-air assembly
        seating areas complying with Sections 1030.6.2 and 1030.6.3. 5. Areas of refuge are not required at stairways in Group
        R-2 occupancies. 6. Areas of refuge are not required for stairways accessed from a refuge area in conjunction with
        a horizontal exit.'
    piece_sha256: ff74570b59b2616db640da7d5f97c14beb62627ba92a069bcd684f5055c5a814
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1009.4':
    label: reference
