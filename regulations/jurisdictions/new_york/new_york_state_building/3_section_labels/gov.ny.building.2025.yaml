        covered or open mall build- ings not exceeding three floor levels at any point nor more than three stories above grade
        plane. Except as specifically required by this section, covered and open mall buildings shall meet applicable provisions
        of this code. Exceptions: 1. Foyers and lobbies of Group B, R-1 and R-2 occupancies are not required to comply with
        this section. 2. Buildings need not comply with the provisions of this section where they totally comply with other
