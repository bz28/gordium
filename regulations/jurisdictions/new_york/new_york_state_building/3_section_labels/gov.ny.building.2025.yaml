  '1009.1':
    label: flag
    topic: means_of_egress
    reason: 'Every accessible space has at least one accessible means of egress, and where 1006.2 or 1006.3 requires more
      than one means of egress from it, each accessible portion of it is served by at least two; one will do from an accessible
      mezzanine (1009.3, 1009.4 or 1009.5) and in assembly areas with ramped or stepped aisles where the common path is accessible
      and meets 1030.8: which spaces must be accessible (Chapter 11) and their accessible means of egress aren''t in the model,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 33
      - 41
      quote: '1009.1 Accessible means of egress required. Accessible means of egress shall comply with this section. Accessible
        spaces shall be provided with not less than one accessible means of egress. Where more than one means of egress is
        required by Section 1006.2 or 1006.3 from any accessible space, each accessible portion of the space shall be served
        by not less than two accessible means of egress. Exceptions: 1. One accessible means of egress is required from an
        accessible mezzanine level in accordance with Section 1009.3, 1009.4 or 1009.5. 2. In assembly areas with ramped aisles
        or stepped aisles, one accessible means of egress is permitted where the common path of egress travel is accessible
        and meets the requirements in Section 1030.8.'
    piece_sha256: e8810f0ade7671dcfafafc7f4b4ded038902367e0c413ea7f25d97e4d219b3c4
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1009.2':
    label: flag
    topic: means_of_egress
    reason: 'Each required accessible means of egress is continuous to a public way and made of accessible routes (1104),
      interior exit stairways (1009.3 and 1023), exit access stairways (1009.3 and 1019.3 or 1019.4), exterior exit stairways
      (1009.3 and 1027) serving levels other than the level of exit discharge, elevators (1009.4), platform lifts (1009.5),
      horizontal exits (1026), ramps (1012), areas of refuge (1009.6) or exterior areas for assisted rescue (1009.7) serving
      exits at the level of exit discharge: accessible means of egress aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 42
      - 53
      quote: '1009.2 Continuity and components. Each required accessible means of egress shall be continuous to a public way
        and shall consist of one or more of the following components: 1. Accessible routes complying with Section 1104. 2.
        Interior exit stairways complying with Sections 1009.3 and 1023. 3. Exit access stairways complying with Sections
        1009.3 and 1019.3 or 1019.4. 4. Exterior exit stairways complying with Sections 1009.3 and 1027 and serving levels
        other than the level of exit discharge. 5. Elevators complying with Section 1009.4. 6. Platform lifts complying with
        Section 1009.5. 7. Horizontal exits complying with Section 1026. 8. Ramps complying with Section 1012. 9. Areas of
        refuge complying with Section 1009.6. 10. Exterior areas for assisted rescue complying with Section 1009.7 serving
        exits at the level of exit discharge.'
    piece_sha256: 0e9e6c892f67c40b1b2908aed75bf4601bb7a731ea215ca393ed7ef30175d213
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1009.2.1:
    label: flag
    topic: means_of_egress
    reason: 'Where a required accessible floor is four or more stories above or below a level of exit discharge, or an accessible
      occupiable roof is above a story three or more stories above it, at least one required accessible means of egress includes
      an elevator complying with 1009.4; in a building sprinklered throughout per 903.3.1.1 or 903.3.1.2 the elevator isn''t
      required on floors with a horizontal exit at or above the levels of exit discharge, or on floors or occupiable roofs
      with a ramp complying with 1012: which floors must be accessible isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 54
      - 57
      quote: '1009.2.1 Elevators required. In buildings where a required accessible floor is four or more stories above or
        below a level of exit discharge or where an accessible occupiable roof is above a story that is three or more stories
        above the level of exit discharge, not less than one required accessible means of egress shall include an elevator
        complying with Section 1009.4. Exceptions:'
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 3
      - 8
      quote: 1. In buildings equipped throughout with an automatic sprinkler system installed in accordance with Section 903.3.1.1
        or 903.3.1.2, the elevator shall not be required as part of the accessible means of egress on floors provided with
        a horizon- tal exit and located at or above the levels of exit discharge. 2. In buildings equipped throughout with
        an automatic sprinkler system installed in accordance with Section 903.3.1.1 or 903.3.1.2, the elevator shall not
        be required as part of the accessible means of egress on floors or occupiable roofs provided with a ramp conforming
        to the provisions of Section 1012.
    piece_sha256: ef97b732d3eee1c5745c199cbd828c6af9bfa4f3334f9492a04447022412a6c3
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1009.2.2:
    label: flag
    topic: means_of_egress
    reason: 'Doors on an accessible route to an exit, area of refuge or exterior area for assisted rescue have ICC A117.1''s
      maneuvering clearances in the direction of egress, on both sides where a door leads to an area of refuge or exterior
      area for assisted rescue and reentry to the floor is possible; not required at doors to exit stairways above and below
      the level of exit discharge whose enclosure has no area of refuge: maneuvering clearances aren''t measured, so a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 9
      - 14
      quote: '1009.2.2 Doors. Where doors are part of an accessible route to provide access to an exit, area of refuge or
        exterior area of assisted rescue, maneuvering clearances shall be provided at such doors as required by ICC A117.1
        in the direction of egress. Where doors lead to an area of refuge or exterior area for assisted rescue and reentry
        to the floor is possible, door maneuvering clearances shall be provided on both sides of the door. Exception: Maneuvering
        clearances are not required at doors to exit stairways for levels above and below the level of exit discharge where
        the exit enclosure does not include an area of refuge.'
    piece_sha256: 0a343a66a5052a3a6f91074c850e7814147fee15370121bfb965550ff71656ab
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1009.3':
    label: reference
    topic: means_of_egress
    reason: 'A pointer: a stairway counts toward an accessible means of egress only as 1009.3.1 to 1009.3.3 allow, each labeled
      on its own; quoted by 1009.3.1''s flag.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 15
      - 16
      quote: 1009.3 Stairways. In order to be considered part of an accessible means of egress, a stairway between stories
        shall comply with Sections 1009.3.1 through 1009.3.3.
    piece_sha256: 4cd1075109fc152210ebd854bb28a5512902329f87d72389b44ea45eadc64913
