  '1008.3':
    label: flag
    topic: means_of_egress
    reason: 'An emergency electrical system lights, on a power failure: in rooms or spaces requiring two or more exits or
      access to exits, the aisles, corridors and exit access stairways and ramps; in buildings requiring two or more exits
      or access to exits, the interior exit access stairways and ramps, interior and exterior exit stairways and ramps, exit
      passageways, vestibules and discharge areas on the level of discharge (1028.2), and the exterior landings 1010.1.5 requires
      at exit doorways leading directly to the exit discharge; and electrical equipment rooms, fire command centers, fire
      pump rooms, generator rooms and public restrooms over 300 sq ft: the electrical design isn''t in the model, so a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 5
      - 22
      quote: '1008.3 Illumination required by an emergency electrical system. An emergency electrical system shall be provided
        to automati- cally illuminate the following areas in the event of a power supply failure: 1. In rooms or spaces that
        require two or more exits or access to exits: 1.1. Aisles. 1.2. Corridors. 1.3. Exit access stairways and ramps. 2.
        In buildings that require two or more exits or access to exits: 2.1. Interior exit access stairways and ramps. 2.2.
        Interior and exterior exit stairways and ramps. 2.3. Exit passageways. 2.4. Vestibules and areas on the level of discharge
        used for exit discharge in accordance with Section 1028.2. 2.5. Exterior landings as required by Section 1010.1.5
        for exit doorways that lead directly to the exit discharge. 3. In other rooms and spaces: 3.1. Electrical equipment
        rooms. 3.2. Fire command centers. 3.3. Fire pump rooms. 3.4. Generator rooms. 3.5. Public restrooms with an area greater
        than 300 square feet (27.87 m[fn2]).'
    piece_sha256: 40b637546ef447ad312f82fb1a993cfb6c0877f249910dd5e8c179faaf1402ca
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
