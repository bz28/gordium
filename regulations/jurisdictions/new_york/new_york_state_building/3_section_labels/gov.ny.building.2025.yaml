    topic: means_of_egress
    reason: 'A stairway identification sign is at least 18 by 12 inches, its stairway identification letters at least 1 1/2
      inches high, its floor number at least 5 inches high in the center, other lettering at least 1 inch, with nonglare,
      contrasting characters, and of 1025.4''s materials in a building 1025 covers: signs aren''t in the model, so a person''s
      check.'
    sources:
