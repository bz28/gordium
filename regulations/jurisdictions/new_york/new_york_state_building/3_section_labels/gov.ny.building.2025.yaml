  '1017.3':
    label: reference
    topic: means_of_egress
    reason: 'Says how exit access travel distance is measured (from the most remote point of each room, area or space, along
      the natural and unobstructed path, to the entrance to the nearest exit): the measure''s definition, no limit.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 342
      lines:
      - 18
      - 20
      quote: 1017.3 Measurement. Exit access travel distance shall be measured from the most remote point of each room, area
        or space along the natural and unobstructed path of horizontal and vertical egress travel to the entrance to an exit.
        Where more than one exit is required, exit access travel distance shall be measured to the nearest exit.
    piece_sha256: 3669787150434ef3b976b175994e5b12a9e9d67477c937610c63c05425332c4a
