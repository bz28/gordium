  907.2.11.8:
    label: flag
    topic: means_of_egress
    reason: 'New York asks hotels, motels and lodging houses for portable audible and visual smoke alarms, 3 percent of the
      sleeping units (at least one per building) per NFPA 72, with a sign at least 3 inches high at the main desk saying they
      are available (not where audible/visual alarms are hard wired, or part of a fire alarm system that activates visual
      notification): a person''s check (general.bc_907_2_11_8_portable_smoke_alarms).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 58
      - 60
      quote: '[NY] 907.2.11.8 Portable smoke alarms in hotels, motels, and lodging houses. In addition to any other requirement
        of this code, portable smoke alarms of both audible and visual design shall be provided in all hotels, motels, and
        lodging houses. The number of smoke alarms available shall be 3 percent of the number of sleeping units with a minimum
        of one operational smoke'
    - file: gov.ny.building.2025.pdf
      page: 290
      lines:
      - 3
      - 8
      quote: 'alarm per building. Proprietors shall post conspicuously a sign, with letters at least 3 inches (76 mm) in height,
        at the main desk or other similar station advising of the availability of such smoke alarms. Such smoke alarms shall
        comply with NFPA 72. Exception: Portable smoke alarms shall not be required where any of the following applies: 1.
        Where audible/visual smoke alarms are hard wired. 2. Where audible/visual smoke alarms are incorporated into a fire
        alarm system such that visual notification is activated by the system.'
    piece_sha256: c64a132faaf38e584b7c0cc2642563ac0c3a97b86492a57371a4877b046cf401
