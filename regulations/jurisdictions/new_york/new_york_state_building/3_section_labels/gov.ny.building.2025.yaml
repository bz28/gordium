  1008.2.1:
    label: flag
    topic: means_of_egress
    reason: 'The means of egress is lit to at least 1 footcandle at the walking surface, and exit access stairways, exit stairways
      and their required landings to at least 10 footcandles while the stairway is in use; auditoriums, theaters, concert
      or opera halls and similar assembly spaces may lower it during performances, restored automatically by the fire alarm
      system, to 0.2 footcandle on externally lit walking surfaces, or by marking steps, landings and ramp sides with self-luminous
      materials (1025.2.1, 1025.2.2 and 1025.2.4, systems listed to UL 1994): lighting isn''t in the model, so a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 318
      lines:
      - 41
      - 49
      quote: '1008.2.1 Illumination level under normal power. The means of egress illumination level shall be not less than
        1 footcandle (11 lux) at the walking surface. Along exit access stairways, exit stairways and at their required landings,
        the illumination level shall not be less than 10 footcandles (108 lux) at the walking surface when the stairway is
        in use. Exception: For auditoriums, theaters, concert or opera halls and similar assembly occupancies, the illumination
        at the walking surface is permitted to be reduced during performances by one of the following methods provided that
        the required illumina- tion is automatically restored upon activation of a premises’ fire alarm system: 1. Externally
        illuminated walking surfaces shall be permitted to be illuminated to not less than 0.2 footcandle (2.15 lux). 2. Steps,
        landings and the sides of ramps shall be permitted to be marked with self-luminous materials in accordance with Sections
        1025.2.1, 1025.2.2 and 1025.2.4 by systems listed in accordance with UL 1994.'
    piece_sha256: fe8f8f00b375d527492db00a33cc8e19db456e4ea6d506facd26e56905b9ac99
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1008.2.2:
