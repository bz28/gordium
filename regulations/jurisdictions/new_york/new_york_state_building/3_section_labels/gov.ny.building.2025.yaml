      lines:
      - 46
      - 52
      quote: '1025.2.5 Obstacles. Obstacles at or below 6 feet 6 inches (1981 mm) in height and projecting more than 4 inches
        (102 mm) into the egress path shall be outlined with markings not less than 1 inch (25 mm) in width comprised of a
        pattern of alternating equal bands, of luminous material and black, with the alternating bands not more than 2 inches
        (51 mm) thick and angled at 45 degrees (0.79 rad). Obstacles shall include, but are not limited to, standpipes, hose
        cabinets, wall projections and restricted height areas. However, such markings shall not conceal any required information
        or indicators including but not limited to instructions to occu- pants for the use of standpipes. Exception: The minimum
        width of 1 inch (25 mm) shall not apply to markings listed in accordance with UL 1994.'
    piece_sha256: 54fb44dcbd86c80c2f3978d4493868cc117be949c8b097a79370f954b1c7c6da
