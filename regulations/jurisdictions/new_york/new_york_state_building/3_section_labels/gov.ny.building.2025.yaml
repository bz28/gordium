  1010.2.4:
    label: flag
    topic: means_of_egress
    reason: 'Where locks and latches may keep a door from opening (ten items, each with its conditions): how each door locks
      isn''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 49
      - 58
      quote: '1010.2.4 Locks and latches. Locks and latches shall be permitted to prevent operation of doors where any of
        the following exist: 1. Places of detention or restraint. 2. In Group I-1, Condition 2 and Group I-2 occupancies where
        the clinical needs of persons receiving care require contain- ment or where persons receiving care pose a security
        threat, provided that all clinical staff can readily unlock doors at all times, and all such locks are keyed to keys
        carried by all clinical staff at all times or all clinical staff have the codes or other means necessary to operate
        the locks at all times. 3. In buildings in occupancy Group A having an occupant load of 300 or less, Groups B, F,
        M and S, and in places of religious worship, the main door or doors are permitted to be equipped with key-operated
        locking devices from the egress side provided that: 3.1. The doors are the main exterior doors to the building, or
        the doors are the main doors to the tenant space.'
    - file: gov.ny.building.2025.pdf
      page: 325
      lines:
      - 3
      - 35
      quote: '3.2. The locking device is readily distinguishable as locked. 3.3. A readily visible durable sign is posted
        on the egress side on or adjacent to the door stating: THIS DOOR TO REMAIN UNLOCKED WHEN THIS SPACE IS OCCUPIED. The
        sign shall be in letters 1 inch (25 mm) high on a contrasting background. 3.4. The use of the key-operated locking
        device is revocable by the building official for due cause. 4. Manual bolts, automatic flush bolts and constant latching
        bolts on the inactive leaf of a pair of doors in accordance with Table 1010.2.4, provided that the inactive leaf does
        not have a doorknob, panic hardware, or similar operating hardware. 5. Single exit doors complying with Section 1006.2.1
        or 1006.3.4 from individual dwelling or sleeping units of Group R occu- pancies and equipped with a night latch, dead
        bolt, manual bolt, or security chain that requires a second releasing motion, provided that such devices are openable
        from the inside without the use of a key or tool. 6. Fire doors after the minimum elevated temperature has disabled
        the unlatching mechanism in accordance with listed fire door test procedures. 7. Doors serving roofs not intended
        to be occupied shall be permitted to be locked preventing entry to the building from the roof. 8. Other than egress
        courts, where occupants must egress from an exterior space through the building for means of egress, exit access doors
        shall be permitted to be equipped with an approved locking device where installed and operated in accordance with
        all of the following: 8.1. The maximum occupant load shall be posted where required by Section 1004.9. Such signage
        shall be perma- nently affixed inside the building and shall be posted in a conspicuous space near all the exit access
        doorways. 8.2. A weatherproof telephone or two-way communication system installed in accordance with Sections 1009.8.1
        and 1009.8.2 shall be located adjacent to not less than one required exit access door on the exterior side. 8.3. The
        egress door locking device is readily distinguishable as locked and shall be a key-operated locking device. 8.4. A
        clear window or glazed door opening, not less than 5 square feet (0.46 m[fn2]) in area, shall be provided at each
        exit access door to determine if there are occupants using the outdoor area. 8.5. A readily visible, durable sign
        shall be posted on the interior side on or adjacent to each locked required exit access door serving the exterior
        area stating, “THIS DOOR TO REMAIN UNLOCKED WHEN THE OUTDOOR AREA IS OCCUPIED.” The letters on the sign shall be not
        less than 1 inch (25.4 mm) high on a contrasting background. 8.6. The occupant load of the occupied exterior area
        shall not exceed 300 occupants in accordance with Section 1004. 9. Locking devices are permitted on doors to balconies,
        decks or other exterior spaces serving individual dwelling or sleep- ing units. 10. Locking devices are permitted
        on doors to balconies, decks or other exterior spaces of 250 square feet (23.23 m[fn2]) or less serving a private
        office space.'
