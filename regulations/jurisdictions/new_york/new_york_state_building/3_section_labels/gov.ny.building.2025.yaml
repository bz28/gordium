  1025.2.4:
    label: flag
    topic: means_of_egress
    reason: 'Stair landings and other floor areas in interior exit stairways, ramps and exit passageways, but the sides of
      steps, have solid, continuous demarcation lines on the floor, the walls or both, 1 to 2 inches wide with breaks of at
