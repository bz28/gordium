    status: draft
  1009.7.3:
    label: flag
    topic: means_of_egress
    reason: 'An exterior area for assisted rescue is open to the outside air, its sides other than the separation walls at
      least 50 percent open, the openings spread to keep smoke and toxic gases from gathering: such areas aren''t in the model,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 321
      lines:
      - 33
      - 35
      quote: 1009.7.3 Openness. The exterior area for assisted rescue shall be open to the outside air. The sides other than
        the separation walls shall be not less than 50 percent open, and the open area shall be distributed so as to minimize
        the accumulation of smoke or toxic gases.
    piece_sha256: 5c0ad8d46157bcae876874dd7c7a9fceb3e6c3526d2de157ae506ceb334f85cf
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1009.7.4:
    label: flag
    topic: means_of_egress
    reason: 'Stairways in the means of egress from an exterior area for assisted rescue have at least 48 inches clear between
      handrails; not required in a building sprinklered throughout per 903.3.1.1 or 903.3.1.2: such areas aren''t in the model,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 321
      lines:
