        The perimeter line shall encircle all buildings and structures that comprise the open mall building and shall encompass
        any open-air interior walkways, open-air courtyards or similar open-air spaces. The perimeter line shall define the
        extent of the open mall building. Anchor buildings and parking structures shall be outside of the perimeter line and
