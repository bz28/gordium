      - 47
      quote: '[F] 903.2.11.1.1 Opening dimensions and access. Openings shall have a minimum dimension of not less than 30
        inches (762 mm). Access to such openings shall be provided for the fire department from the exterior and shall not
        be obstructed in a manner such that firefighting or rescue cannot be accomplished from the exterior.'
