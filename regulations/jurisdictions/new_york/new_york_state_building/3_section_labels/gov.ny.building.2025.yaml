      - 28
      quote: '[F] 907.2.9.3 Group R-2 college and university buildings. An automatic smoke detection system that activates
        the occupant notification system in accordance with Section 907.5 shall be installed in Group R-2 occupancies operated
        by a college or university for student or staff housing in all of the following locations: 1. Common spaces outside
        of dwelling units and sleeping units. 2. Laundry rooms, mechanical equipment rooms and storage rooms. 3. All interior
        corridors serving sleeping units or dwelling units. Exception: An automatic smoke detection system is not required
        in buildings that do not have interior corridors serving sleep- ing units or dwelling units and where each sleeping
        unit or dwelling unit either has a means of egress door opening directly to an exterior exit access that leads directly
        to an exit or a means of egress door opening directly to an exit. Required smoke alarms in dwelling units and sleeping
        units in Group R-2 occupancies operated by a college or university for student or staff housing shall be interconnected
        with the fire alarm system in accordance with NFPA 72.'
