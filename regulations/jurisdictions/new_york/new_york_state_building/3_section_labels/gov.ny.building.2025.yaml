      quote: 1010.2.12 Delayed egress. Delayed egress electrical locking systems shall be permitted on doors in the means
        of egress serving the following occupancies in buildings that are equipped throughout with an automatic sprinkler
        system in accordance with Section 903.3.1.1 or an approved automatic smoke or heat detection system installed in accordance
        with Section 907. 1. Group B, F, I, M, R, S and U occupancies. 2. Group E classrooms with an occupant load of less
        than 50. 3. In courtrooms in Group A-3 and B occupancies, delayed egress electrical locking systems shall be permitted
        to be installed on exit or exit access doors, other than the main exit or exit access door, in buildings that are
        equipped through- out with an automatic sprinkler system in accordance with Section 903.3.1.1.
