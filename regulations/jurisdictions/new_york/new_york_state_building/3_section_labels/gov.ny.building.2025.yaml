        Class I automatic dry and semiautomatic dry standpipes or manual wet standpipes are allowed in buildings that are
        not high-rise buildings.'
    piece_sha256: fd252ed59672e0de6baf5dd41a35cbb55e2dfa3ac424278ca5a80f569e67279b
