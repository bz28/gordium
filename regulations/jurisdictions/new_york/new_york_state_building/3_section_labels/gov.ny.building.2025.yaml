    status: draft
  '1009.8':
    label: flag
    topic: means_of_egress
    reason: 'A two-way communication system complying with 1009.8.1 and 1009.8.2 is at the landing serving each elevator or
      bank of elevators on each accessible floor one or more stories above or below the level of exit discharge; not required
      where the system is in areas of refuge (1009.6.5), on floors with ramps complying with 1012, at landings serving only
      service elevators outside the accessible means of egress and the required accessible route, only freight elevators,
      or a private residence elevator, or in Group I-2 or I-3 facilities: elevators aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 321
      lines:
      - 40
      - 52
      quote: '1009.8 Two-way communication. A two-way communication system complying with Sections 1009.8.1 and 1009.8.2 shall
        be provided at the landing serving each elevator or bank of elevators on each accessible floor that is one or more
        stories above or below the level of exit discharge. Exceptions: 1. Two-way communication systems are not required
        at the landing serving each elevator or bank of elevators where the two-way communication system is provided within
        areas of refuge in accordance with Section 1009.6.5. 2. Two-way communication systems are not required on floors provided
        with ramps conforming to the provisions of Section 1012. 3. Two-way communication systems are not required at the
        landings serving only service elevators that are not designated as part of the accessible means of egress or serve
        as part of the required accessible route into a facility. 4. Two-way communication systems are not required at the
        landings serving only freight elevators. 5. Two-way communication systems are not required at the landing serving
        a private residence elevator. 6. Two-way communication systems are not required in Group I-2 or I-3 facilities.'
    piece_sha256: 6377ed86b50e141e9cf923331ab50dadf00f94e80476b61d5be2cbdc15ff8ddf
