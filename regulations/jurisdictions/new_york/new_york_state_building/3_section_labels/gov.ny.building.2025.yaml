  907.2.6.3.3:
    label: flag
    topic: means_of_egress
    reason: 'Group I-3 has automatic smoke detection throughout resident housing areas, sleeping units, day rooms, group activity
      and common spaces open to residents (other approved arrangements against damage or tampering; not in Use Conditions
      2 and 3 sleeping units per Section 308; not in sleeping units of four or fewer in smoke compartments with a 903.3.1.1
      system): a person''s check (general.bc_907_2_6_3_3_group_i3_smoke_detection).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 287
      lines:
      - 3
      - 12
      quote: '[F] 907.2.6.3.3 Automatic smoke detection system. An automatic smoke detection system shall be installed throughout
        resident housing areas, including sleeping units and contiguous day rooms, group activity spaces and other common
        spaces normally open to residents. Exceptions: 1. Other approved smoke detection arrangements providing equivalent
        protection, including, but not limited to, placing detectors in exhaust ducts from cells or behind protective guards
        listed for the purpose, are allowed where necessary to prevent damage or tampering. 2. Sleeping units in Use Conditions
        2 and 3 as described in Section 308. 3. Smoke detectors are not required in sleeping units with four or fewer occupants
        in smoke compartments that are equipped throughout with an automatic sprinkler system installed in accordance with
        Section 903.3.1.1.'
