      quote: '1010.2.8 Panic and fire exit hardware. Swinging doors serving a Group H occupancy and swinging doors serving
        rooms or spaces with an occupant load of 50 or more in a Group A or E occupancy shall not be provided with a latch
        or lock other than panic hardware or fire exit hardware. Exceptions: 1. A main exit of a Group A occupancy shall be
        permitted to have locking devices in accordance with Section 1010.2.4, Item 3. 2. Doors provided with panic hardware
        or fire exit hardware and serving a Group A or E occupancy shall be permitted to be electrically locked in accordance
        with Section 1010.2.10. 3. Exit access doors serving occupied exterior areas shall be permitted to be locked in accordance
        with Section 1010.2.4, Item 8. 4. Courtrooms shall be permitted to be locked in accordance with Section 1010.2.12,
        Item 3.'
