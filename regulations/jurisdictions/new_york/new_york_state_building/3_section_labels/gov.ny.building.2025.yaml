  716.2.2.1:
    label: flag
    topic: means_of_egress
    reason: '20-minute doors in rated corridors and smoke barriers are tested without the hose stream, with four exceptions:
      a person''s check (general.bc_716_2_2_1_corridor_smoke_barrier_doors).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 187
      lines:
      - 49
      - 60
      quote: '716.2.2.1 Door assemblies in corridors and smoke barriers. Fire door assemblies required to have a minimum fire
        protection rating of 20 minutes where located in corridor walls or smoke barrier walls having a fire-resistance rating
        in accordance with Table 716.1(2) shall be tested in accordance with NFPA 252 or UL 10C without the hose stream test.
        Exceptions: 1. Viewports that require a hole not larger than 1 inch (25 mm) in diameter through the door, have not
        less than a 0.25-inch-thick (6.4 mm) glass disc and the holder is of metal that will not melt out where subject to
        temperatures of 1,700°F (927°C). 2. Corridor door assemblies in occupancies of Group I-2 shall be in accordance with
        Section 407.3.1. 3. Unprotected openings shall be permitted for corridors in multitheater complexes where each motion
        picture audi- torium has not fewer than one-half of its required exit or exit access doorways opening directly to
        the exterior or into an exit passageway. 4. Horizontal sliding doors in smoke barriers that comply with Sections 408.6
        and 408.8.4 in occupancies in Group I-3.'
    piece_sha256: 12d8227d2cef0dc63311f30d0ed0be709448487dfcb0e4f436f2bab2cc2a54ee
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Chapter 7 part b.
