  '909.1':
    label: flag
    topic: means_of_egress
    reason: 'Where another section requires a mechanical or passive smoke control system (an atrium, smoke-protected assembly
      seating per 1030.6.2.1, an underground building, a high-rise''s smokeproof enclosures among them), it is designed, installed
      and acceptance-tested per Section 909 for a tenable environment while occupants evacuate or relocate (not 910''s smoke
      and heat removal; not an exhaust system under Chapter 5 of the Mechanical Code of New York State): a person''s check
      (general.bc_909_1_smoke_control_scope).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 296
      lines:
      - 8
      - 14
      quote: '[F] 909.1 Scope and purpose. This section applies to mechanical or passive smoke control systems where they
        are required by other provisions of this code. The purpose of this section is to establish minimum requirements for
        the design, installation and acceptance testing of smoke control systems that are intended to provide a tenable environment
        for the evacuation or relocation of occupants. These provisions are not intended for the preservation of contents,
        the timely restoration of operations or for assistance in fire suppression or overhaul activities. Smoke control systems
        regulated by this section serve a different purpose than the smoke- and heat-removal provisions found in Section 910.
        Mechanical smoke control systems shall not be considered exhaust systems under Chapter 5 of the Mechanical Code of
        New York State.'
    piece_sha256: 5d3fd484f25773fd2a65b67d9482756cf3d6f5abaab99a264c9098ca9d760b83
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '909.20':
    label: flag
    topic: means_of_egress
    reason: 'Where 1023.12 requires a smokeproof enclosure, it is an interior exit stairway or ramp enclosed per Section 1023
      with an open exterior balcony, or a pressurized stair and entrance vestibule, per 909.20, and roof access the Fire Code
      of New York State requires is from it: a person''s check (general.bc_909_20_smokeproof_enclosures).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 301
      lines:
      - 50
      - 54
      quote: 909.20 Smokeproof enclosures. Where required by Section 1023.12, a smokeproof enclosure shall be constructed
        in accordance with this section. A smokeproof enclosure shall consist of an interior exit stairway or ramp that is
        enclosed in accordance with the applicable provisions of Section 1023 and an open exterior balcony or pressurized
        stair and pressurized entrance vestibule meeting the requirements of this section. Where access to the roof is required
        by the Fire Code of New York State, such access shall be from the smokeproof enclosure where a smokeproof enclosure
        is required.
    piece_sha256: 035d2061074592e60908de7698f9ee7b0ab785ecbb391a7c74c7a8c44e1fcc5e
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  909.20.1:
    label: flag
    topic: means_of_egress
    reason: 'The stairway or ramp is reached through a vestibule or open exterior balcony; the vestibule at least the corridor''s
      required clear width, not under 44 inches wide nor 72 inches long in the direction of travel, measured straight between
      the doorways'' centerlines: a person''s check (general.bc_909_20_1_smokeproof_access).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 301
      lines:
      - 55
      - 58
      quote: 909.20.1 Access. Access to the stairway or ramp shall be by way of a vestibule or an open exterior balcony. The
        minimum dimen- sion of the vestibule shall be not less than the required clear width of the corridor leading to the
        vestibule but shall not have a width of less than 44 inches (1118 mm) and shall not have a length of less than 72
        inches (1829 mm) in the direction of egress travel into the stairway, measured in a straight line between the centerline
        of the doorways into the vestibule and stairway.
    piece_sha256: 1c34feaa1e56742414bdcb35013fab9141bb7e297b32e7e262a463d34a620dd5
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  909.20.2:
    label: flag
    topic: means_of_egress
    reason: 'The enclosure is separated from the rest of the building, and the vestibule from the stairway or ramp, by 2-hour
      fire barriers per 707 or horizontal assemblies per 711, no openings but the required egress doors, an open exterior
      balcony built to the floor assemblies'' rating: a person''s check (general.bc_909_20_2_smokeproof_construction).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 301
      lines:
      - 59
      - 60
      quote: 909.20.2 Construction. The smokeproof enclosure shall be separated from the remainder of the building by not
        less than 2-hour fire barriers constructed in accordance with Section 707 or horizontal assemblies constructed in
        accordance with Section 711, or
    - file: gov.ny.building.2025.pdf
      page: 302
      lines:
      - 3
      - 6
      quote: both. Openings are not permitted other than the required means of egress doors. The vestibule shall be separated
        from the stair- way or ramp by not less than 2-hour fire barriers constructed in accordance with Section 707 or horizontal
        assemblies constructed in accordance with Section 711, or both. The open exterior balcony shall be constructed in
        accordance with the fire-resistance rating requirements for floor assemblies.
    piece_sha256: 3ea7d0242e2f7df03113b3f56e52c72e72ddc2d39690eefa4a4de51ab122f434
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  909.20.2.1:
