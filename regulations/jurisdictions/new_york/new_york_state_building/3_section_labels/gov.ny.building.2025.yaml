      page: 347
      lines:
      - 31
      - 41
      quote: '1023.9.1 Signage requirements. Stairway identification signs shall comply with all of the following requirements:
        1. The signs shall be a minimum size of 18 inches (457 mm) by 12 inches (305 mm). 2. The letters designating the identification
        of the interior exit stairway and ramp shall be not less than 1 1/2 inches (38 mm) in height. 3. The number designating
