      quote: '714.5.1 Through penetrations. Through penetrations of horizontal assemblies shall comply with Section 714.5.1.1
        or 714.5.1.2. Exceptions: 1. Penetrations by steel, ferrous or copper conduits, pipes, tubes or vents or concrete
        or masonry items through a single fire-resistance-rated floor assembly where the annular space is protected with materials
        that prevent the passage of flame and hot gases sufficient to ignite cotton waste when subjected to ASTM E119 or UL
        263 time-temperature fire conditions under a minimum positive pressure differential of 0.01 inch of water (2.49 Pa)
        at the location of the pene- tration for the time period equivalent to the fire-resistance rating of the construction
        penetrated. Penetrating items with a maximum 6-inch (152 mm) nominal diameter shall not be limited to the penetration
        of a single fire-resistance- rated floor assembly, provided that the aggregate area of the openings through the assembly
        does not exceed 144 square inches (92 900 mm [fn2]) in any 100 square feet (9.3 m[fn2]) of floor area. 2. Penetrations
        in a single concrete floor by steel, ferrous or copper conduits, pipes, tubes or vents with a maximum 6- inch (152
        mm) nominal diameter, provided that the concrete, grout or mortar is installed the full thickness of the floor or
        the thickness required to maintain the fire-resistance rating. The penetrating items shall not be limited to the pene-
        tration of a single concrete floor, provided that the area of the opening through each floor does not exceed 144 square
        inches (92 900 mm[fn2]). 3. Penetrations by listed electrical boxes of any material, provided that such boxes have
        been tested for use in fire-resis- tance-rated assemblies and installed in accordance with the instructions included
        in the listing. 4. Penetrations of concrete floors or ramps within parking garages or structures constructed in accordance
        with Sections 406.5 and 406.6 where the areas above and below the penetrations are parking areas.'
