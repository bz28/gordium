      lines:
      - 29
      - 40
      quote: '1024.6 Penetrations. Penetrations into or through an exit passageway are prohibited except for the following:
        1. Equipment and ductwork necessary for independent ventilation or pressurization. 2. Fire protection systems. 3.
        Security systems. 4. Two-way communication systems. 5. Electrical raceway for fire department communication. 6. Electrical
        raceway serving the exit passageway and terminating at a steel box not exceeding 16 square inches (0.010 m[fn2]).
        7. Structural elements, such as beams or joists, supporting a floor or roof at the top of the exit passageway. Such
        penetrations shall be protected in accordance with Section 714. There shall not be penetrations or communicating open-
        ings, whether protected or not, between adjacent exit passageways. Exception: Membrane penetrations shall be permitted
        on the outside of the exit passageway. Such penetrations shall be protected in accordance with Section 714.4.2.'
    piece_sha256: cc9288b5bd3882da0e508d8780fb2f5baee20b73bae8cfcdbda3905fcd7d6029
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9f.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1024.7':
    label: flag
    topic: means_of_egress
    reason: 'Equipment and ductwork ventilating an exit passageway is outside the building with ducts enclosed as shafts,
      or within the passageway taking air from and discharging it directly outdoors (or through ducts enclosed as shafts),
      or within the building separated as shafts; openings into the rated construction are only those needed for maintenance
      and operation, protected per 716 for shaft enclosures; and the system is independent of the building''s other ventilation:
      ventilation isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 348
      lines:
      - 41
      - 52
      quote: '1024.7 Ventilation. Equipment and ductwork for exit passageway ventilation as permitted by Section 1024.6 shall
        comply with one of the following: 1. The equipment and ductwork shall be located exterior to the building and shall
        be directly connected to the exit passage- way by ductwork enclosed in construction as required for shafts. 2. Where
        the equipment and ductwork is located within the exit passageway, the intake air shall be taken directly from the
        outdoors and the exhaust air shall be discharged directly to the outdoors, or the air shall be conveyed through ducts
        enclosed in construction as required for shafts. 3. Where located within the building, the equipment and ductwork
        shall be separated from the remainder of the building, including other mechanical equipment, with construction as
        required for shafts. In each case, openings into the fire-resistance-rated construction shall be limited to those
        needed for maintenance and operation and shall be protected by opening protectives in accordance with Section 716
        for shaft enclosures. Exit passageway ventilation systems shall be independent of other building ventilation systems.'
    piece_sha256: 46ec50c0a87fefd902956968809be8f1f913954a23b18d9a24064547b2f59519
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9f.
