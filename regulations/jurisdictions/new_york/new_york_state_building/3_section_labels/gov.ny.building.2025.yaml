  907.2.9.1:
    label: flag
    topic: means_of_egress
    reason: 'Group R-2 has a manual fire alarm system activating occupant notification per 907.5 where any unit is three or
      more stories above the lowest level of exit discharge, more than one story below the highest level of exit discharge
      of the exits serving it, or the building has more than 16 dwelling or sleeping units (exception 1: not in a building
      of two stories or less whose units are separated by 1-hour fire partitions and each have an exit directly to a public
      way, egress court or yard; exception 2: boxes left out with a 903.3.1.1 or 903.3.1.2 system and notification on water
      flow; exception 3: none with a 903.3.1.1 or 903.3.1.2 system where there are no interior corridors serving units and
      each unit''s egress door opens to an exterior exit access, or open-ended corridors per 1027.6 exception 3 serve them):
      a person''s check (general.bc_907_2_9_1_group_r2_fire_alarm).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 287
      lines:
      - 55
      - 59
      quote: '[F] 907.2.9.1 Manual fire alarm system. A manual fire alarm system that activates the occupant notification
        system in accor- dance with Section 907.5 shall be installed in Group R-2 occupancies where any of the following conditions
        apply: 1. Any dwelling unit or sleeping unit is located three or more stories above the lowest level of exit discharge.
        2. Any dwelling unit or sleeping unit is located more than one story below the highest level of exit discharge of
        exits serv- ing the dwelling unit or sleeping unit.'
    - file: gov.ny.building.2025.pdf
      page: 288
      lines:
      - 3
      - 16
      quote: '3. The building contains more than 16 dwelling units or sleeping units. Exceptions: 1. A fire alarm system is
        not required in buildings not more than two stories in height where all dwelling units or sleeping units and contiguous
        attic and crawl spaces are separated from each other and public or common areas by not less than 1-hour fire partitions
        and each dwelling unit or sleeping unit has an exit directly to a public way, egress court or yard. 2. Manual fire
        alarm boxes are not required where the building is equipped throughout with an automatic sprinkler system installed
        in accordance with Section 903.3.1.1 or 903.3.1.2 and the occupant notification appliances will automatically activate
        throughout the notification zones upon a sprinkler water flow. 3. A fire alarm system is not required in buildings
        that do not have interior corridors serving dwelling units and are protected by an approved automatic sprinkler system
        installed in accordance with Section 903.3.1.1 or 903.3.1.2, provided that dwelling units either have a means of egress
        door opening directly to an exterior exit access that leads directly to the exits or are served by open-ended corridors
        designed in accordance with Section 1027.6, Exception 3.'
