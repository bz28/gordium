    topic: means_of_egress
    reason: 'Its doors are self-closing or close automatically on a smoke detector per 716.2.6.6 at the floor-side entrance,
      any one detector closing every door of the enclosure at all levels, detectors per 907.3: a person''s check (general.bc_909_20_2_1_smokeproof_door_closers).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 302
      lines:
