        that the room or space is occupied. Exceptions: 1. Occupancies in Group U. 2. Self-service storage units 400 square
        feet (37.2 m[fn2]) or less in area and accessed directly from the exterior of the building. 3. Aisle accessways in
        Group A. 4. Dwelling units and sleeping units in Groups R-1, R-2 and R-3. 5. Sleeping units of Group I occupancies.'
    piece_sha256: 10f44a1c97d9c12f1fce5c4c45f5c96208d0b3ca2121aa7d3f24ee1b687221e0
