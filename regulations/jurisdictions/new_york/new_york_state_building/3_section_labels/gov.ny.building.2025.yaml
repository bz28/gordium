  '905.4':
    label: flag
    topic: means_of_egress
    reason: 'Class I hose connections in every required interior or exterior exit stairway, one for each story above and below
      grade plane at the main floor landing (one in the open corridor or breezeway between open stairs 75 feet or less apart),
      on each side of a horizontal exit''s wall, in every exit passageway at its entrance from other areas (not where a 30-foot
      hose stream on 100 feet of hose from a stairway''s connection reaches those areas), at a mall''s public entrances and
      its exit passageway and corridor entrances, at the roof or the highest landing with roof access per 1011.12 where the
      roof''s slope is under 4 in 12, and more where the fire code official asks (a floor''s most remote point over 150 feet
      from one, 200 feet sprinklered): a person''s check (general.bc_905_4_class_i_hose_connections).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 280
      lines:
      - 11
      - 34
      quote: '[F] 905.4 Location of Class I standpipe hose connections. Class I standpipe hose connections shall be provided
        in all of the follow- ing locations: 1. In every required interior exit stairway or exterior exit stairway, a hose
        connection shall be provided for each story above and below grade plane. Hose connections shall be located at the
        main floor landing unless otherwise approved by the fire code official. Exception: A single hose connection shall
        be permitted to be installed in the open corridor or open breezeway between open stairs that are not greater than
        75 feet (22 860 mm) apart. 2. On each side of the wall adjacent to the exit opening of a horizontal exit. Exception:
        Where floor areas adjacent to a horizontal exit are reachable from an interior exit stairway or exterior exit stairway
        hose connection by a 30-foot (9144 mm) hose stream from a nozzle attached to 100 feet (30 480 mm) of hose, a hose
        connection shall not be required at the horizontal exit. 3. In every exit passageway, at the entrance from the exit
        passageway to other areas of a building. Exception: Where floor areas adjacent to an exit passageway are reachable
        from an interior exit stairway or exterior exit stairway hose connection by a 30-foot (9144 mm) hose stream from a
        nozzle attached to 100 feet (30 480 mm) of hose, a hose connection shall not be required at the entrance from the
        exit passageway to other areas of the building. 4. In covered mall buildings, adjacent to each exterior public entrance
        to the mall and adjacent to each entrance from an exit passageway or exit corridor to the mall. In open mall buildings,
        adjacent to each public entrance to the mall at the perimeter line and adjacent to each entrance from an exit passageway
        or exit corridor to the mall. 5. Where the roof has a slope less than 4 units vertical in 12 units horizontal (33.3-percent
        slope), a hose connection shall be located to serve the roof or at the highest landing of an interior exit stairway
        with access to the roof provided in accordance with Section 1011.12. 6. Where the most remote portion of a nonsprinklered
        floor or story is more than 150 feet (45 720 mm) from a hose connection or the most remote portion of a sprinklered
        floor or story is more than 200 feet (60 960 mm) from a hose connection, the fire code official is authorized to require
        that additional hose connections be provided in approved locations.'
