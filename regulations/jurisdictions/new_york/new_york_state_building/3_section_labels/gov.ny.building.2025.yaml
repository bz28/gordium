  '707.6':
    label: flag
    topic: means_of_egress
    reason: 'Openings in fire barriers are protected per Section 716 and limited to 25 percent of the wall''s length and 156
      square feet each, with exceptions: not in the model, a person''s check (general.bc_707_6_openings).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 172
      lines:
      - 34
      - 58
      quote: '707.6 Openings. Openings in a fire barrier shall be protected in accordance with Section 716. Openings shall
        be limited to a maxi- mum aggregate width of 25 percent of the length of the wall, and the maximum area of any single
        opening shall not exceed 156 square feet (15 m[fn2]). Openings in enclosures for shafts, interior exit stairways and
        ramps and exit passageways shall also comply with Sections 713.7, 1023.4 and 1024.5, respectively. Exceptions: 1.
        Openings shall not be limited to 156 square feet (15 m[fn2]) where adjoining floor areas are equipped throughout with
        an automatic sprinkler system in accordance with Section 903.3.1.1. 2. Openings shall not be limited to 156 square
        feet (15 m[fn2]) or an aggregate width of 25 percent of the length of the wall where the opening protective is a fire
        door serving enclosures for exit access stairways and ramps, and interior exit stair- ways and ramps. 3. Openings
        shall not be limited to 156 square feet (15 m[fn2]) or an aggregate width of 25 percent of the length of the wall
        where the opening protective has been tested in accordance with ASTM E119 or UL 263 and has a minimum fire-resistance
        rating not less than the fire-resistance rating of the wall. 4. Fire window assemblies permitted in atrium separation
        walls shall not be limited to a maximum aggregate width of 25 percent of the length of the wall. 5. Openings shall
        not be limited to 156 square feet (15 m[fn2]) or an aggregate width of 25 percent of the length of the wall where
        the opening protective is a fire door assembly in a fire barrier separating an enclosure for exit access stairways
        and ramps, and interior exit stairways and ramps from an exit passageway in accordance with Section 1023.3.1. 6. Openings
        providing entrance to an elevator car shall not be limited to 156 square feet (15 m[fn2]) or an aggregate width of
        25 percent of the length of the wall where the opening protective is a fire door assembly in a fire barrier that is
        an elevator hoistway enclosure. 7. Openings shall not be limited to an aggregate width of 25 percent of the length
        of the wall where opening serves a shaft enclosure in accordance with Section 713. 8. Openings shall not be limited
        to an aggregate width of 25 percent of the length of the wall where opening serves a chute access room in accordance
        with Section 713.13.3 or a chute discharge room in accordance with Section 713.13.4.'
    piece_sha256: 8587be3731290ac13da8a92e93079e56fb5e5c2bcd64f6afbb279874b83333b8
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Chapter 7 part a.
