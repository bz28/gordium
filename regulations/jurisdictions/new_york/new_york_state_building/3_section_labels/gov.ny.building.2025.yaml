  '1009.7':
    label: flag
    topic: means_of_egress
    reason: 'An exterior area for assisted rescue is reached by an accessible route from the area it serves, and one is provided
      on the exterior landing (1009.7.1 to 1009.7.4) where the exit discharge has no accessible route from an exit on the
      level of exit discharge to a public way: the site''s accessible routes aren''t in the model, so a person''s check.'
