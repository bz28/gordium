  1025.2.4.1:
    label: flag
    topic: means_of_egress
    reason: 'Floor-mounted demarcation lines are within 4 inches of the wall, reach within 2 inches of the landings'' edge
      markings and continue across the floor in front of every door, but not in front of exit discharge doors leading out
      of the exit: markings aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 349
      lines:
      - 30
      - 34
      quote: '1025.2.4.1 Floor-mounted demarcation lines. Perimeter demarcation lines shall be placed within 4 inches (102
        mm) of the wall and shall extend to within 2 inches (51 mm) of the markings on the leading edge of landings. The demarcation
        lines shall continue across the floor in front of all doors. Exception: Demarcation lines shall not extend in front
        of exit discharge doors that lead out of an exit and through which occupants must travel to complete the exit path.'
