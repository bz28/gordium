  '1013.1':
    label: flag
    topic: means_of_egress
    reason: 'Exits and exit access doors are marked by an approved exit sign readily visible from any direction of egress
      travel; signs show the direction of travel where an exit or the path isn''t immediately visible; intervening doors within
      exits are marked; and no point in an exit access corridor or exit passageway is farther than 100 feet, or the sign''s
      listed viewing distance if less, from the nearest visible sign; not required in rooms or areas needing only one exit
      or exit access, at main exterior exit doors or gates obviously identifiable as exits where the building official approves,
      in Group U, within Group R-1, R-2 or R-3 sleeping or dwelling units, in Group I-3''s dayrooms, sleeping rooms and dormitories,
      or on the seating side of Group A-4 and A-5 vomitories where signs in the concourse are readily apparent from the vomitories and egress lighting identifies each vomitory or opening in an emergency: exit signs aren''t in the model,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 336
      lines:
      - 31
      - 45
      quote: '1013.1 Where required. Exits and exit access doors shall be marked by an approved exit sign readily visible
        from any direction of egress travel. The path of egress travel to exits and within exits shall be marked by readily
        visible exit signs to clearly indicate the direction of egress travel in cases where the exit or the path of egress
        travel is not immediately visible to the occupants. Intervening means of egress doors within exits shall be marked
        by exit signs. Exit sign placement shall be such that any point in an exit access corridor or exit passageway is within
        100 feet (30 480 mm) or the listed viewing distance of the sign, whichever is less, from the near- est visible exit
        sign. Exceptions: 1. Exit signs are not required in rooms or areas that require only one exit or exit access. 2. Main
        exterior exit doors or gates that are obviously and clearly identifiable as exits need not have exit signs where approved
        by the building official. 3. Exit signs are not required in occupancies in Group U and individual sleeping units or
        dwelling units in Group R-1, R-2 or R-3. 4. Exit signs are not required in dayrooms, sleeping rooms or dormitories
        in occupancies in Group I-3. 5. In occupancies in Groups A-4 and A-5, exit signs are not required on the seating side
        of vomitories or openings into seat- ing areas where exit signs are provided in the concourse that are readily apparent
        from the vomitories. Egress lighting is provided to identify each vomitory or opening within the seating area in an
        emergency.'
    piece_sha256: c17cfd14d72d348e0c2198e267517e6cd96708e7e1caa61a6c2a0f0c6aaf5de0
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
