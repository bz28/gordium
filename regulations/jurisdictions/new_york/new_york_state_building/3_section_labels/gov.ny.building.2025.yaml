      lines:
      - 40
      - 54
      quote: '[F] HIGHLY TOXIC. A material which produces a lethal dose or lethal concentration that falls within any of the
        following categories: 1. A chemical that has a median lethal dose (LD ) of 50 milligrams or less per kilogram of body
        weight when administered 50 orally to albino rats weighing between 200 and 300 grams each. 2. A chemical that has
        a median lethal dose (LD ) of 200 milligrams or less per kilogram of body weight when administered by 50 continuous
        contact for 24 hours (or less if death occurs within 24 hours) with the bare skin of albino rabbits weighing between
        2 and 3 kilograms each. 3. A chemical that has a median lethal concentration (LC ) in air of 200 parts per million
        by volume or less of gas or vapor, or 2 50 milligrams per liter or less of mist, fume or dust, when administered by
        continuous inhalation for 1 hour (or less if death occurs within 1 hour) to albino rats weighing between 200 and 300
        grams each. Mixtures of these materials with ordinary materials, such as water, might not warrant classification as
        highly toxic. While this system is basically simple in application, any hazard evaluation that is required for the
        precise categorization of this type of material shall be performed by experienced, technically competent persons.'
