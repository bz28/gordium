      - 19
      quote: '1009.10 Directional signage. Directional signage indicating the location of all other means of egress and which
        of those are accessi- ble means of egress shall be provided at the following: 1. At exits serving a required accessible
        space but not providing an approved accessible means of egress. 2. At elevator landings. 3. Within areas of refuge.'
    piece_sha256: d6b7dd42cf4a0ca31f45b71688c54d0937197bcf19b6854cd3a9ea061d3beb58
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1009.11':
    label: flag
    topic: means_of_egress
    reason: 'Areas of refuge, exterior areas for assisted rescue and the places 1009.8 requires two-way communication have
      posted instructions for emergencies in ICC A117.1''s visual characters: that those able to use the exit stairway do
      so at once unless assisting others, the planned help with stairs or supervised elevators and how to summon it, and how
      to use the two-way communication system where provided: signs aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 322
      lines:
      - 20
      - 26
      quote: '1009.11 Instructions. In areas of refuge, exterior areas for assisted rescue and locations required to provide
        two-way communica- tions systems complying with Section 1009.8, instructions on the use of the area under emergency
        conditions shall be posted. Signage shall comply with the ICC A117.1 requirements for visual characters. The instructions
        shall include all of the following: 1. Persons able to use the exit stairway do so as soon as possible, unless they
        are assisting others. 2. Information on planned availability of assistance in the use of stairs or supervised operation
        of elevators and how to summon such assistance. 3. Directions for use of the two-way communication system where provided.'
    piece_sha256: 25330446eb6241cc6b886ea4df89bb81b4f20b1d57fcf2bc2e640ac49415f868
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1010.1':
    label: flag
    topic: means_of_egress
    reason: 'Doors in the means of egress are readily distinguishable as doors, carry no mirrors and aren''t concealed by curtains
      or decorations; exterior exit doors also meet 1022.2 (its own flag), gates 1010.4 and turnstiles 1010.5 (neither brought in): none of it
      is in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 322
      lines:
      - 28
      - 36
      quote: 1010.1 General. Doors in the means of egress shall comply with the requirements of Sections 1010.1.1 through 1010.3.4.
        Exterior exit doors shall also comply with the requirements of Section 1022.2. Gates in the means of egress shall comply
        with the requirements of Sections 1010.4 and 1010.4.1. Turnstiles in the means of egress shall comply with the requirements
        of Sections 1010.5 through 1010.5.4. Doors, gates and turnstiles provided for egress purposes in numbers greater than
        required by this code shall comply with the requirements of this section. Doors in the means of egress shall be readily
        distinguishable from the adjacent construction and finishes such that the doors are easily recognizable as doors. Mirrors
        or similar reflecting materials shall not be used on means of egress doors. Means of egress doors shall not be concealed
        by curtains, drapes, decorations or similar materials.
    piece_sha256: c1e2ce1fde03033ec7eec8d0217bc8b6732499263e79d2a42b83fc0720085261
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.1:
    label: rule
    topic: means_of_egress
    reason: 'Each door opening''s clear width (32 inches, 41 1/2 inches for Group I-2 bed movement) and clear height (80 inches),
      with exceptions that loosen them within dwelling and sleeping units, for small storage closets and for compartments: measurable
      per door from its maker''s stated clear opening. Its capacity for the occupant load is a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 322
      lines:
      - 37
      - 58
      quote: '1010.1.1 Size of doors. The required capacity of each door opening shall be sufficient for the occupant load thereof
        and shall provide a minimum clear opening width of 32 inches (813 mm). The clear opening width of doorways with swinging
        doors shall be measured between the face of the door and the frame stop, with the door open 90 degrees (1.57 rad). Where
        this section requires a minimum clear opening width of 32 inches (813 mm) and a door opening includes two door leaves
        without a mullion, one leaf shall provide a minimum clear opening width of 32 inches (813 mm). In Group I-2, doors serving
        as means of egress doors where used for the movement of beds shall provide a minimum clear opening width of 41 1/2 inches
        (1054 mm). The minimum clear open- ing height of doors shall be not less than 80 inches (2032 mm). Exceptions: 1. In
        Group R-2 and R-3 dwelling and sleeping units that are not required to be an Accessible unit, Type A unit or Type B
        unit, the minimum width shall not apply to door openings that are not part of the required means of egress. 2. In Group
        I-3, door openings to resident sleeping units that are not required to be an Accessible unit shall have a mini- mum
        clear opening width of 28 inches (711 mm). 3. Door openings to storage closets less than 10 square feet (0.93 m[fn2])
        in area shall not be limited by the minimum clear opening width. 4. Door openings within a dwelling unit or sleeping
        unit shall have a minimum clear opening height of 78 inches (1981 mm). 5. In dwelling and sleeping units that are not
        required to be Accessible, Type A or Type B units, exterior door openings other than the required exit door shall have
        a minimum clear opening height of 76 inches (1930 mm). 6. In Groups I-1, R-2, R-3 and R-4, in dwelling and sleeping
        units that are not required to be Accessible, Type A or Type B units, the minimum clear opening widths shall not apply
        to interior egress doors. 7. Door openings required to be accessible within Type B units intended for user passage shall
        have a minimum clear opening width of 31.75 inches (806 mm).'
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 3
      - 5
      quote: 8. Doors serving sauna compartments, toilet compartments or dressing, fitting or changing compartments that are
        not required to be accessible shall have a minimum clear opening width of 20 inches (508 mm). 9. Doors serving shower
        compartments shall comply with Section 421.4.2 of the Plumbing Code of New York State.
    piece_sha256: 112c58f8b7ca46cda115ba232f295d1f56b73dcb902b0c8d8520a936c010a49d
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.1.1:
    label: flag
    topic: means_of_egress
    reason: 'Nothing projects into a door''s required clear width below 34 inches, and at most 4 inches between 34 and 80 inches
      (closers, stops and the like down to 78 inches): door hardware isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 6
      - 10
      quote: '1010.1.1.1 Projections into clear opening. There shall not be projections into the required clear opening width
        lower than 34 inches (864 mm) above the floor or ground. Projections into the clear opening width between 34 inches
        (864 mm) and 80 inches (2032 mm) above the floor or ground shall not exceed 4 inches (102 mm). Exception: Door closers,
        overhead doorstops, frame stops, power door operators, and electromagnetic door locks shall proj- ect into the door
        opening height not lower than 78 inches (1980 mm) above the floor.'
    piece_sha256: 510625f8fefc1d31569155bbb4d0b0fa8b26eedd717388b481591941632e1231
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.2:
    label: flag
    topic: means_of_egress
    reason: 'Egress doors are side-hinged swinging, pivoted or balanced, with exceptions the model doesn''t tell apart (a power-operated
      door in any group among them): a door of another kind, or whose kind isn''t stated, is a person''s check per door.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 11
      - 23
      quote: '1010.1.2 Egress door types. Egress doors shall be of the side-hinged swinging door, pivoted door, or balanced
        door types. Exceptions: 1. Private garages, office areas, factory and storage areas with an occupant load of 10 or less.
        2. Group I-3 occupancies used as a place of detention. 3. Critical or intensive care patient rooms within suites of
        health care facilities. 4. Doors within or serving a single dwelling unit in Groups R-2 and R-3. 5. In other than Group
        H occupancies, revolving doors complying with Section 1010.3.1. 6. In other than Group H occupancies, special purpose
        horizontal sliding, accordion or folding door assemblies comply- ing with Section 1010.3.3. 7. Power-operated doors
        in accordance with Section 1010.3.2. 8. Doors serving a bathroom within an individual dwelling unit or sleeping unit
        in Group R-1. 9. In other than Group H occupancies, manually operated horizontal sliding doors are permitted in a means
        of egress from spaces with an occupant load of 10 or less.'
    piece_sha256: 9a0a566b14081a715d62a10d4761e167d0e53e9acf067b5017a4cf197ad635b3
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.2.1:
    label: rule
    topic: means_of_egress
    reason: 'A swinging door swings in the direction of egress travel where it serves a room or area of 50 or more occupants
      or a Group H occupancy: checkable per door from the side it swings into, the direction the routes find and the occupant
      loads.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 24
      - 25
      quote: 1010.1.2.1 Direction of swing. Side-hinged swinging doors, pivoted doors and balanced doors shall swing in the
        direction of egress travel where serving a room or area containing an occupant load of 50 or more persons or a Group
        H occupancy.
    piece_sha256: a65bc3fae01ea8bd6d08c7d6f9bf8d8d33730adcf8232db5848f6f97772fc809
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.3:
    label: flag
    topic: means_of_egress
    reason: 'The forces to unlatch a door (15 pounds push or pull, 28 inch-pounds rotation) and to open it (5 pounds for an
      interior manual swinging door not required to be fire rated; else 30 pounds to set in motion, 15 to open fully): door
      hardware and forces aren''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 26
      - 36
      quote: '1010.1.3 Forces to unlatch and open doors. The forces to unlatch doors shall comply with the following: 1. Where
        door hardware operates by push or pull, the operational force to unlatch the door shall not exceed 15 pounds (67 N).
        2. Where door hardware operates by rotation, the operational force to unlatch the door shall not exceed 28 inch-pounds
        (315 N-cm). The force to open doors shall comply with the following: 1. For interior swinging egress doors that are
        manually operated, other than doors required to be fire rated, the force for pushing or pulling open the door shall
        not exceed 5 pounds (22 N). 2. For other swinging doors, sliding doors or folding doors, and doors required to be
        fire rated, the door shall require not more than a 30-pound (133 N) force to be set in motion and shall move to a
        full-open position when subjected to not more than a 15-pound (67 N) force.'
    piece_sha256: 749351239167cedf58d20312c042a1e5dca103a788049863a5e5d37b543828a3
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.3.1:
    label: reference
    topic: means_of_egress
    reason: 'Says where 1010.1.3''s forces are applied (the latch side of the door): how to measure them, read with 1010.1.3''s
      flag.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 37
      - 37
      quote: 1010.1.3.1 Location of applied forces. Forces shall be applied to the latch side of the door.
    piece_sha256: f69e859b52d5a2423e5f3ffb83cd9721a2a76c42fc17ea6c64d540d6c1f90a36
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.3.2:
    label: flag
    topic: means_of_egress
    reason: 'A manual horizontal sliding door required to latch doesn''t rebound into a partly open position when closed:
      latches aren''t in the model, a person''s check for each door that isn''t stated side-hinged.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 38
      - 39
      quote: 1010.1.3.2 Manual horizontal sliding doors. Where a manual horizontal sliding door is required to latch, the
        latch or other mechanism shall prevent the door from rebounding into a partially open position when the door is closed.
    piece_sha256: 5e3cfa67b15a7a0b1fd6cd6b427305420aa228e2f398850cdb9925cea1fceae4
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.4:
    label: flag
    topic: means_of_egress
    reason: 'A floor or landing at the same elevation on each side of a door, level (an exterior landing at most 2 percent),
      with six exceptions: floor levels at doors and landings aren''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 40
      - 56
      quote: '1010.1.4 Floor elevation. There shall be a floor or landing on each side of a door. Such floor or landing shall
        be at the same eleva- tion on each side of the door. Landings shall be level except for exterior landings, which are
        permitted to have a slope not to exceed 0.25 unit vertical in 12 units horizontal (2-percent slope). Exceptions: 1.
        At doors serving individual dwelling units or sleeping units in Groups R-2 and R-3, a door is permitted to open at
        the top step of an interior flight of stairs, provided that the door does not swing over the top step. 2. At exterior
        doors serving Groups F, H, R-2 and S and where such doors are not part of an accessible route, the landing at an exterior
        door shall not be more than 7 inches (178 mm) below the landing on the egress side of the door, provided that the
        door, other than an exterior storm or screen door, does not swing over the landing. 3. At exterior doors serving Group
        U and individual dwelling units and sleeping units in Groups R-2 and R-3, and where such units are not required to
        be Accessible units, Type A units or Type B units, the landing at an exterior doorway shall be not more than 7 3/4
        inches (197 mm) below the landing on the egress side of the door. Such doors, including storm or screen doors, shall
        be permitted to swing over either landing. 4. Variations in elevation due to differences in finish materials, but
        not more than 1/2 inch (12.7 mm). 5. Exterior decks, patios or balconies that are part of Type B dwelling units or
        sleeping units, that have impervious surfaces and that are not more than 4 inches (102 mm) below the finished floor
        level of the adjacent interior space of the dwelling unit or sleeping unit.'
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 3
      - 5
      quote: 6. Doors serving equipment spaces not required to be accessible in accordance with Section 1103.2.9 and serving
        an occupant load of five or less shall be permitted to have a landing on one side to be not more than 7 inches (178
        mm) above or below the landing on the egress side of the door.
    piece_sha256: a8afde0342c7e7e225fb319d2ad3aa235b4dc00d63b8ec66030afb17da89d552
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.5:
    label: flag
    topic: means_of_egress
    reason: 'A landing at a door as wide as the stairway or door, whichever is greater, at least 44 inches long (36 in Groups
      R-3 and U and within Group R-2 units), a required dimension not reduced by a fully open door by more than 7 inches and,
      serving 50 or more, the landing not reduced by a door in any position to less than half its required width: landings aren''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 6
      - 11
      quote: '1010.1.5 Landings at doors. Landings shall have a width not less than the width of the stairway or the door,
        whichever is greater. Doors in the fully open position shall not reduce a required dimension by more than 7 inches
        (178 mm). Where a landing serves an occupant load of 50 or more, doors in any position shall not reduce the landing
        to less than one-half its required width. Landings shall have a length measured in the direction of travel of not
        less than 44 inches (1118 mm). Exception: Landing length in the direction of travel in Groups R-3 and U and within
        individual units of Group R-2 need not exceed 36 inches (914 mm).'
    piece_sha256: da498140fce8bb2e15da037aa5a1d0884e4a7cc87ce6489a61b73b8ecc8ebf3e
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.6:
    label: flag
    topic: means_of_egress
    reason: 'Threshold heights (3/4 inch for a dwelling unit''s sliding door, 1/2 inch for others, beveled above 1/4 inch),
      with exceptions for Group R-2 and R-3 exterior doors and Type B units: thresholds aren''t in the model, a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 12
      - 25
      quote: '1010.1.6 Thresholds. Thresholds at doorways shall not exceed 3/4 inch (19.1 mm) in height above the finished
        floor or landing for sliding doors serving dwelling units or 1/2 inch (12.7 mm) above the finished floor or landing
        for other doors. Raised thresholds and floor level changes greater than 1/4 inch (6.4 mm) at doorways shall be beveled
        with a slope not greater than one unit vertical in two units horizontal (50-percent slope). Exceptions: 1. In occupancy
        Group R-2 or R-3, threshold heights for sliding and side-hinged exterior doors shall be permitted to be up to 7 3/4
        inches (197 mm) in height if all of the following apply: 1.1. The door is not part of the required means of egress.
        1.2. The door is not part of an accessible route as required by Chapter 11. 1.3. The door is not part of an Accessible
        unit, Type A unit or Type B unit. 2. In Type B units, where Exception 5 to Section 1010.1.4 permits a 4-inch (102
        mm) elevation change at the door, the threshold height on the exterior side of the door shall not exceed 4 3/4 inches
        (120 mm) in height above the exterior deck, patio or balcony for sliding doors or 4 1/2 inches (114 mm) above the
        exterior deck, patio or balcony for other doors.'
    piece_sha256: 7dc0944dd150d5a5648247f2c514ec26049dbf0a7e74983f1c83c29c4c2d8cac
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.1.7:
    label: flag
    topic: means_of_egress
    reason: 'Two doors in a series at least 48 inches apart plus a door swinging into the space, swinging the same way or
      away from it, with exceptions for horizontal sliding power-operated doors, Group R-2 and R-3 storm and screen doors,
      and doors within those units other than Type A units: doors in a series aren''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 26
      - 32
      quote: '1010.1.7 Door arrangement. Space between two doors in a series shall be 48 inches (1219 mm) minimum plus the
        width of a door swinging into the space. Doors in a series shall swing either in the same direction or away from the
        space between the doors. Exceptions: 1. The minimum distance between horizontal sliding power-operated doors in a
        series shall be 48 inches (1219 mm). 2. Storm and screen doors serving individual dwelling units in Groups R-2 and
        R-3 need not be spaced 48 inches (1219 mm) from the other door. 3. Doors within individual dwelling units in Groups
        R-2 and R-3 other than within Type A dwelling units.'
    piece_sha256: 2a103ee8e4be3f2396bb7490c4c00752b3a0e91c4281a41837230c7d1262b342
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1010.2':
    label: flag
    topic: means_of_egress
    reason: 'Egress doors readily openable from the egress side without a key or special knowledge or effort, except as 1010.2
      permits: how each door locks isn''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 324
      lines:
      - 33
      - 34
      quote: 1010.2 Door operations. Except as specifically permitted by this section, egress doors shall be readily openable
        from the egress side without the use of a key or special knowledge or effort.
    piece_sha256: d4c0c56ed034027e669a63af431a49f6ac8e196755f23f3965c57cb69e2e767b
