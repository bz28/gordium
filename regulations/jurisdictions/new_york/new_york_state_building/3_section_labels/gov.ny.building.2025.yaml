  1023.12.1:
    label: flag
    topic: means_of_egress
    reason: 'A smokeproof enclosure ends at an exit discharge or a public way, or is extended per 1023.3 by an exit passageway
      with no openings but 1023.3.1''s fire door assembly and those for leaving it, separated by 2-hour fire barriers per
      707 or horizontal assemblies per 711; but openings into the passageway are allowed where it is protected and pressurized
      as the enclosure is and the openings are protected as for access from other floors, the barrier between the enclosure
      and the passageway isn''t needed where the passageway is protected and pressurized as the enclosure is, and the enclosure
      may egress through areas on the level of exit discharge or vestibules as 1028 allows: smokeproof enclosures aren''t
      in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 347
      lines:
      - 50
      - 60
      quote: '1023.12.1 Termination and extension. A smokeproof enclosure shall terminate at an exit discharge or a public
        way. The smoke- proof enclosure shall be permitted to be extended by an exit passageway in accordance with Section
        1023.3. The exit passageway shall be without openings other than the fire door assembly required by Section 1023.3.1
        and those necessary for egress from the exit passageway. The exit passageway shall be separated from the remainder
        of the building by 2-hour fire barriers constructed in accordance with Section 707 or horizontal assemblies constructed
        in accordance with Section 711, or both. Exceptions: 1. Openings in the exit passageway serving a smokeproof enclosure
        are permitted where the exit passageway is protected and pressurized in the same manner as the smokeproof enclosure,
        and openings are protected as required for access from other floors. 2. The fire barrier separating the smokeproof
        enclosure from the exit passageway is not required, provided that the exit passageway is protected and pressurized
        in the same manner as the smokeproof enclosure.'
    - file: gov.ny.building.2025.pdf
      page: 348
      lines:
      - 3
      - 4
      quote: 3. A smokeproof enclosure shall be permitted to egress through areas on the level of exit discharge or vestibules
        as permitted by Section 1028.
