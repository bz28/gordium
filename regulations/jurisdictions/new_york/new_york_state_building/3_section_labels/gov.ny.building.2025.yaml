  905.3.1:
    label: flag
    topic: means_of_egress
    reason: 'Class III standpipes throughout a building with four or more stories above or below grade plane, or its highest
      story''s floor more than 30 feet above the lowest level of fire department vehicle access, or its lowest story''s more
      than 30 feet below the highest (Class I allowed with a 903.3.1.1 or 903.3.1.2 system, in Groups B and E, parking garages,
      sprinklered basements, or where occupant-use hose lines won''t be used by trained personnel or the fire department;
      recessed loading docks for four vehicles or less and impractical topography left out in finding the lowest level of
      access): a person''s check (general.bc_905_3_1_class_iii_by_height).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 279
      lines:
      - 18
      - 36
      quote: '[F] 905.3.1 Height. Class III standpipe systems shall be installed throughout buildings where any of the following
        conditions exist: 1. Four or more stories are above or below grade plane. 2. The floor level of the highest story
        is located more than 30 feet (9144 mm) above the lowest level of fire department vehi- cle access. 3. The floor level
        of the lowest story is located more than 30 feet (9144 mm) below the highest level of fire department vehi- cle access.
        Exceptions: 1. Class I standpipes are allowed in buildings equipped throughout with an automatic sprinkler system
        in accordance with Section 903.3.1.1 or 903.3.1.2. 2. Class I standpipes are allowed in Group B and E occupancies.
        3. Class I standpipes are allowed in parking garages. 4. Class I standpipes are allowed in basements equipped throughout
        with an automatic sprinkler system. 5. Class I standpipes are allowed in buildings where occupant-use hose lines will
        not be utilized by trained personnel or the fire department. 6. In determining the lowest level of fire department
        vehicle access, it shall not be required to consider either of the following: 6.1. Recessed loading docks for four
        vehicles or less. 6.2. Conditions where topography makes access from the fire department vehicle to the building impractical
        or impossible.'
    piece_sha256: 9d7ade90deb1224d671785e85dbe47a0bc64d434c64cc71ebf9fbfb873a0f1e0
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
