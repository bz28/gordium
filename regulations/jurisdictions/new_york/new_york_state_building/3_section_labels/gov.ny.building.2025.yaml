  '907.2':
    label: flag
    topic: means_of_egress
    reason: 'Where Sections 907.2.1 to 907.2.23 require a fire alarm system, it is approved, installed per this code and NFPA
      72, and gives occupant notification per 907.5; one with automatic detectors or waterflow detection has at l...: a person''s
      check (general.bc_907_2_where_required).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 284
      lines:
      - 25
      - 37
      quote: '[F] 907.2 Where required—new buildings and structures. An approved fire alarm system installed in accordance
        with the provi- sions of this code and NFPA 72 shall be provided in new buildings and structures in accordance with
        Sections 907.2.1 through 907.2.23 and provide occupant notification in accordance with Section 907.5, unless other
        requirements are provided by another section of this code. Not fewer than one manual fire alarm box shall be provided
        in an approved location to initiate a fire alarm signal for fire alarm systems employing automatic fire detectors
        or waterflow detection devices. Where other sections of this code allow elimination of fire alarm boxes due to sprinklers,
        a single fire alarm box shall be installed. Exceptions: 1. The manual fire alarm box is not required for fire alarm
        systems dedicated to elevator recall control and supervisory service. 2. The manual fire alarm box is not required
        for Group R-2 occupancies unless required by the fire code official to provide a means for fire watch personnel to
        initiate an alarm during a sprinkler system impairment event. Where provided, the manual fire alarm box shall not
        be located in an area that is open to the public.'
    piece_sha256: 87c4aa2557db2e910068fea222e5ef8a7ddbf2fc3d30f5e5cd04b30a52b7cb44
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  907.2.1:
    label: flag
    topic: means_of_egress
    reason: 'A manual fire alarm system activating occupant notification per 907.5 is installed where the assembly occupant
      load is 300 or more, or the Group A occupant load is more than 100 above or below the lowest level of exit di...: a
      person''s check (general.bc_907_2_1_group_a_fire_alarm).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 284
      lines:
      - 38
      - 57
      quote: '[F] 907.2.1 Group A. A manual fire alarm system that activates the occupant notification system in accordance
        with Section 907.5 shall be installed in Group A occupancies where the occupant load due to the assembly occupancy
        is 300 or more, or where the Group A occupant load is more than 100 persons above or below the lowest level of exit
        discharge. Group A occupancies not sepa- rated from one another in accordance with Section 707.3.10 shall be considered
        as a single occupancy for the purposes of applying this section. Portions of Group E occupancies occupied for assembly
        purposes shall be provided with a fire alarm system as required for the Group E occupancy. Exceptions: 1. Manual fire
        alarm boxes are not required where the building is equipped throughout with an automatic sprinkler system installed
        in accordance with Section 903.3.1.1 and the occupant notification appliances will activate through- out the notification
        zones upon sprinkler water flow. 2. Manual fire alarm boxes and the associated occupant notification system or emergency
        voice/alarm communication system are not required for Group A-5 outdoor bleacher-type seating having an occupant load
        of greater than or equal to 300 and less than 15,000 occupants, provided that all of the following are met: 2.1. A
        public address system with standby power is provided. 2.2. Enclosed spaces attached to or within 5 feet (1524 mm)
        of the outdoor bleacher-type seating compose, in the aggregate, a maximum of 10 percent of the overall area of the
        outdoor bleacher-type seating or 1,000 square feet (92.9 m[fn2]), whichever is less. 2.3. Enclosed accessory spaces
        under or attached to the outdoor bleacher-type seating shall be separated from the bleacher-type seating in accordance
        with Section 1030.1.1.1. 2.4. All means of egress from the bleacher-type seating are open to the outside.'
    - file: gov.ny.building.2025.pdf
      page: 285
      lines:
      - 3
      - 8
      quote: '3. Manual fire alarm boxes and the associated occupant notification system or emergency voice/alarm communication
        system are not required for temporary Group A-5 outdoor bleacher-type seating, provided that all of the following
        are met: 3.1. There are no enclosed spaces under or attached to the outdoor bleacher-type seating. 3.2. The bleacher-type
        seating is erected for a period of less than 180 days. 3.3. Evacuation of the bleacher-type seating is included in
        an approved fire safety plan.'
    piece_sha256: 1cf962d1775db01c66f38f936dbf3bafdd3f151b2bc4c9a0accbe9faedcf9049
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part c.
