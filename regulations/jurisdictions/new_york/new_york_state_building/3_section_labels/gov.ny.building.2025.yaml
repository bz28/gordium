  '1009.9':
    label: flag
    topic: means_of_egress
    reason: 'Each door to an area of refuge from an adjacent floor area is signed "AREA OF REFUGE", and each door to an exterior
      area for assisted rescue "EXTERIOR AREA FOR ASSISTED RESCUE", in ICC A117.1''s visual characters with the International
      Symbol of Accessibility, lit where 1013.3 requires exit sign illumination, with visual, raised character and braille
      signs per ICC A117.1 at each such door (1013.4): signs aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 322
      lines:
      - 6
      - 14
      quote: '1009.9 Signage. Signage indicating special accessibility provisions shall be provided as shown: 1. Each door
        providing access to an area of refuge from an adjacent floor area shall be identified by a sign stating, "AREA OF
        REFUGE." 2. Each door providing access to an exterior area for assisted rescue shall be identified by a sign stating,
        "EXTERIOR AREA FOR ASSISTED RESCUE." Signage shall comply with the ICC A117.1 requirements for visual characters and
        include the International Symbol of Accessibility. Where exit sign illumination is required by Section 1013.3, the
        signs shall be illuminated. Additionally, visual characters, raised char- acter and braille signage complying with
        ICC A117.1 shall be located at each door to an area of refuge and exterior area for assisted rescue in accordance
        with Section 1013.4.'
    piece_sha256: 1a62f451054e14fe1b39de6a2a9ebddcdae8fb477927902039d83a9167c16080
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1009.10':
    label: flag
    topic: means_of_egress
    reason: 'Directional signs showing every other means of egress, and which are accessible, are at exits serving a required
      accessible space that don''t give an approved accessible means of egress, at elevator landings and within areas of refuge:
