  '1023.9':
    label: flag
    topic: means_of_egress
    reason: 'At each floor landing of an interior exit stairway or ramp connecting more than three stories, a sign states
      the floor level, the top and bottom terminus, the stairway''s identification, the story of and direction to the exit
      discharge, and whether the roof can be reached for the fire department, its bottom at least 5 feet above the landing
      and readily visible with the doors open or closed: signs aren''t in the model, so a person''s check.'
