      - 23
      - 41
      quote: '[BS] CONCRETE. Carbonate aggregate. Concrete made with aggregates consisting mainly of calcium or magnesium
        carbonate, such as limestone or dolomite, and containing 40 percent or less quartz, chert or flint. Cellular. A lightweight
        insulating concrete made by mixing a preformed foam with Portland cement slurry and having a dry unit weight of approximately
        30 pcf (480 kg/m[fn3]). Lightweight aggregate. Concrete made with aggregates of expanded clay, shale, slag or slate
        or sintered fly ash or any natural lightweight aggregate meeting ASTM C330 and possessing equivalent fire-resistance
        properties and weighing 85 to 115 pcf (1360 to 1840 kg/m[fn3]). Perlite. A lightweight insulating concrete having
        a dry unit weight of approximately 30 pcf (480 kg/m[fn3]) made with perlite concrete aggregate. Perlite aggregate
        is produced from a volcanic rock which, when heated, expands to form a glass-like material of cellular structure.
        Sand-lightweight. Concrete made with a combination of expanded clay, shale, slag, slate, sintered fly ash, or any
        natural light- weight aggregate meeting ASTM C330 and possessing equivalent fire-resistance properties and natural
        sand. Its unit weight is generally between 105 and 120 pcf (1680 and 1920 kg/m[fn3]). Siliceous aggregate. Concrete
        made with normal-weight aggregates consisting mainly of silica or compounds other than calcium or magnesium carbonate,
        which contains more than 40-percent quartz, chert or flint. Vermiculite. A light weight insulating concrete made with
        vermiculite concrete aggregate which is laminated micaceous material produced by expanding the ore at high temperatures.
        When added to a Portland cement slurry the resulting concrete has a dry unit weight of approximately 30 pcf (480 kg/m[fn3]).'
