      - 55
      quote: '710.5.3 Pass-through openings in Group I-2, Condition 2. Where pass-through openings are provided in smoke partitions
        in Group I-2, Condition 2 occupancies, such openings shall comply with the following: 1. The smoke compartment in
        which the pass-through openings occur does not contain a patient care suite or sleeping room. 2. Pass-through openings
        are installed in a wall, door or vision panel that is not required to have a fire-resistance rating. 3. The top of
