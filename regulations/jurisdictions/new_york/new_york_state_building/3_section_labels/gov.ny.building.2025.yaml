      lines:
      - 53
      - 56
      quote: 1024.8 Exit passageway exterior walls. Exterior walls of the exit passageway shall comply with Section 705. Where
        nonrated walls or unprotected openings enclose the exterior of the exit passageway and the walls or openings are exposed
        by other parts of the building at an angle of less than 180 degrees (3.14 rad), the building exterior walls within
        10 feet (3048 mm) horizontally of a nonrated wall or unprotected opening shall have a fire-resistance rating of not
        less than 1 hour. Openings within such exterior walls shall be
    - file: gov.ny.building.2025.pdf
