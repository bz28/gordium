    reason: 'Defines UNSTABLE (REACTIVE) MATERIAL, a word the brought-in sections use: a definition, no requirement.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 65
      lines:
      - 49
      - 59
      quote: '[F] UNSTABLE (REACTIVE) MATERIAL. A material, other than an explosive, which in the pure state or as commercially
        produced, will vigorously polymerize, decompose, condense or become self-reactive and undergo other violent chemical
        changes, including explo- sion, when exposed to heat, friction or shock, or in the absence of an inhibitor, or in
        the presence of contaminants, or in contact with incompatible materials. Unstable (reactive) materials are subdivided
        as follows: Class 1. Materials that in themselves are normally stable but which can become unstable at elevated temperatures
        and pressure. Class 2. Materials that in themselves are normally unstable and readily undergo violent chemical change
        but do not detonate. This class includes materials that can undergo chemical change with rapid release of energy at
        normal temperatures and pressures, and that can undergo violent chemical change at elevated temperatures and pressures.
        Class 3. Materials that in themselves are capable of detonation or of explosive decomposition or explosive reaction
        but which require a strong initiating source or which must be heated under confinement before initiation. This class
        includes materials that are sensitive to thermal or mechanical shock at elevated temperatures and pressures.'
