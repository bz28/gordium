  907.2.11.6:
    label: flag
    topic: means_of_egress
    reason: 'In new construction, smoke alarms take their primary power from building wiring with battery backup, those with
      strobes and no battery on an emergency electrical system per 2702 (no battery where on one), signal low batteries, and
      are wired permanently without a disconnecting switch other than for overcurrent protection: a person''s check (general.bc_907_2_11_6_smoke_alarm_power).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 42
      - 48
      quote: '[F] 907.2.11.6 Power source. In new construction, required smoke alarms shall receive their primary power from
        the building wiring where such wiring is served from a commercial source and shall be equipped with a battery backup.
        Smoke alarms with integral strobes that are not equipped with battery backup shall be connected to an emergency electrical
        system in accor- dance with Section 2702. Smoke alarms shall emit a signal when the batteries are low. Wiring shall
        be permanent and without a disconnecting switch other than as required for overcurrent protection. Exception: Smoke
        alarms are not required to be equipped with battery backup where they are connected to an emergency electrical system
        that complies with Section 2702.'
    piece_sha256: 4492246b1758cc67af66d40073dcdc4c3b13642a815e5af0ad124b6502b17746
