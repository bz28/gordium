        exit stairways and ramps and exit passageways shall have a maximum transmitted temperature rise of not more than 450°F
        (250°C) above ambient at the end of 30 minutes of standard fire test exposure. Exception: The maximum transmitted
        temperature rise is not required in buildings equipped throughout with an automatic sprinkler system installed in
