  1010.2.7:
    label: flag
    topic: means_of_egress
    reason: 'Intruder locks on classroom, office and other occupied rooms'' doors in Groups E, B (educational) and I-4: locks
      aren''t in the model, a person''s check where the building may be one of those groups.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 326
      lines:
      - 23
      - 30
      quote: '1010.2.7 Locking arrangements in educational occupancies. In Group E occupancies, Group B educational occupancies
        and Group I-4 occupancies, egress doors from classrooms, offices and other occupied rooms with locking arrangements
        designed to keep intruders from entering the room shall comply with all of the following conditions: 1. The door shall
        be capable of being unlocked from outside the room with a key or other approved means. 2. The door shall be openable
        from within the room in accordance with Section 1010.2. 3. Modifications shall not be made to listed panic hardware,
        fire door hardware or door closers. 4. Modifications to fire door assemblies shall be in accordance with NFPA 80.
        Remote locking or unlocking of doors from an approved location shall be permitted in addition to the unlocking operation
        in Item 1.'
