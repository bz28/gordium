      - 17
      quote: '1025.2.1 Steps. A solid and continuous stripe shall be applied to the horizontal leading edge of each step and
        shall extend for the full length of the step. Outlining stripes shall have a minimum horizontal width of 1 inch (25
        mm) and a maximum width of 2 inches (51 mm). The leading edge of the stripe shall be placed not more than 1/2 inch
        (12.7 mm) from the leading edge of the step and the stripe shall not overlap the leading edge of the step by not more
        than 1/2 inch (12.7 mm) down the vertical face of the step. Exception: The minimum width of 1 inch (25 mm) shall not
        apply to outlining stripes listed in accordance with UL 1994.'
    piece_sha256: 8dadd9f6cbaf86e649b413129656a205210540b26e995e14a1c517131f3b42b1
