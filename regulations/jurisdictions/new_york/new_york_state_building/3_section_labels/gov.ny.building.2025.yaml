  1025.2.1:
    label: flag
    topic: means_of_egress
    reason: 'A solid, continuous stripe 1 to 2 inches wide runs the full length of each step''s leading edge, placed within
      1/2 inch of the edge and lapping down its face by at most 1/2 inch (the 1 inch minimum not applying to stripes listed
      per UL 1994): markings aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 349
      lines:
