  907.2.11.1:
    label: flag
    topic: means_of_egress
    reason: 'New York places Group R-1''s smoke alarms in sleeping areas, in every room on the path of egress from them to
      the unit''s door, on each story within a unit (a split level''s upper alarm serving a lower level less than a full story
      below with no door between), at least 3 feet from a bath or shower room''s door, in a hallway and the room open to it
      where that room''s ceiling is 24 inches or more above the hallway''s, by a sleeping loft, in each common space shared
      by three or more units, and, on a level over 1000 square feet, within 30 feet of travel of every ceiling point or one
      per 500 square feet (upper-floor alarms may serve great rooms and vaulted ceilings): a person''s check (general.bc_907_2_11_1_group_r1_smoke_alarm_locations).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 288
      lines:
      - 43
      - 59
      quote: '[NY] 907.2.11.1 Group R-1. Single- or multiple-station smoke alarms shall be installed in all of the following
        locations in Group R- 1: 1. In sleeping areas. 2. In every room in the path of the means of egress from the sleeping
        area to the door leading from the dwelling unit or sleeping unit. 3. In each story within the dwelling unit or sleeping
        unit, including basements. For dwelling units or sleeping units with split levels and without an intervening door
        between the adjacent levels, a smoke alarm installed on the upper level shall suffice for the adjacent lower level
        provided that the lower level is less than one full story below the upper level. 4. Not less than 3 feet (914 mm)
        horizontally from the door or opening of a bathroom that contains a bathtub or shower unless this would prevent placement
        of a smoke alarm required by this section. 5. In the hallway and in the room open to the hallway in dwelling units
        where the ceiling height of a room open to a hall- way serving bedrooms exceeds that of the hallway by 24 inches (610
        mm) or more. 6. Within the room to which a sleeping loft is open, in the immediate vicinity of the sleeping loft.
        7. In each common space shared by three or more dwelling units such that an alarm notification is clearly audible
        in each common space. 8. Where the interior floor area for a given level of a dwelling unit, excluding garage areas,
        is greater than 1000 ft2 (93 m2), smoke alarms shall be installed per both of the following:'
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 3
      - 7
      quote: 8.1 All points on the ceiling shall have a smoke alarm within a distance of 30 ft (9.1 m) travel distance or
        shall have an equivalent of one smoke alarm per 500 ft2 (46 m2) of floor area. 8.2 Where dwelling units include great
        rooms or vaulted/cathedral ceilings extending over multiple floors, smoke alarms located on the upper floor that are
        intended to protect the aforementioned area shall be permitted to be considered as part of the lower floor’s protection
        scheme.
    piece_sha256: 02254045cb28c0c3fcc66b62aeffdcac0d0ea47b3b89bed2287cf27a51392cca
