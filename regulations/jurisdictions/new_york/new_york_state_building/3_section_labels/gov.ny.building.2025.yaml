    status: draft
  1010.2.12.1:
    label: flag
    topic: means_of_egress
    reason: 'How a delayed egress lock works, how many a path may pass, and its sign: delayed egress locks aren''t in the
      model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 327
      lines:
      - 42
      - 59
      quote: '1010.2.12.1 Delayed egress locking system. The delayed egress electrical locking system shall be installed and
        operated in accordance with all of the following: 1. The delay of the delayed egress electrical locking system shall
        deactivate upon actuation of the automatic sprinkler system or automatic fire detection system, allowing immediate
        free egress. 2. The delay of the delayed egress electrical locking system shall deactivate upon loss of power to the
        electrical locking system or electrical lock, allowing immediate free egress. 3. The delay of the delayed egress locking
        electrical system shall have the capability of being deactivated at the fire command center and other approved locations.
        4. An attempt to egress shall initiate an irreversible process that shall allow such egress in not more than 15 seconds
        when a physical effort to exit is applied to the egress side door hardware for not more than 3 seconds. Initiation
        of the irreversible process shall activate an audible signal in the vicinity of the door. Once the delay has been
        deactivated, rearming the delay electronics shall be by manual means only. Exception: Where approved, a delay of not
        more than 30 seconds is permitted on a delayed egress door. 5. The egress path from any point shall not pass through
        more than one delayed egress locking system. Exceptions: 1. In Group I-1, Condition 2, Group I-2 or I-3 occupancies,
        the egress path from any point in the building shall pass through not more than two delayed egress locking systems
        provided that the combined delay does not exceed 30 seconds.'
    - file: gov.ny.building.2025.pdf
      page: 328
      lines:
      - 3
      - 17
      quote: '2. In Group I-1, Condition 1 or Group I-4 occupancies, the egress path from any point in the building shall
        pass through not more than two delayed egress locking systems provided the combined delay does not exceed 30 seconds
        and the building is equipped throughout with an automatic sprinkler system in accor- dance with Section 903.3.1.1.
        6. A sign shall be provided on the door and shall be located above and within 12 inches (305 mm) of the door exit
        hardware. Exception: Where approved, in Group I occupancies, the installation of a sign is not required where care
        recipients who because of clinical needs require restraint or containment as part of the function of the treatment
        area. 6.1. For doors that swing in the direction of egress, the sign shall read, "PUSH UNTIL ALARM SOUNDS. DOOR CAN
        BE OPENED IN 15 [30] SECONDS." 6.2. For doors that swing in the opposite direction of egress, the sign shall read,
        "PULL UNTIL ALARM SOUNDS. DOOR CAN BE OPENED IN 15 [30] SECONDS." 6.3. The sign shall comply with the visual character
        requirements in ICC A117.1. 7. Emergency lighting shall be provided on the egress side of the door. 8. The electromechanical
        or electromagnetic locking device shall be listed in accordance with either UL 294 or UL 1034.'
    piece_sha256: ef7b3a15fef56f0143a1e14bfabc25f648cbd0f6c6bde9049b0236223889d978
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 6e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1010.2.13:
    label: flag
    topic: means_of_egress
    reason: 'Controlled egress locks in Groups I-1 and I-2, with their conditions: locks aren''t in the model, a person''s
      check where the building may be one of those groups.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 328
      lines:
      - 18
      - 43
      quote: '1010.2.13 Controlled egress doors in Groups I-1 and I-2. Controlled egress electrical locking systems where
        egress is controlled by authorized personnel shall be permitted on doors in the means of egress in Group I-1 or I-2
        occupancies where the clinical needs of persons receiving care require their containment. Controlled egress doors
        shall be permitted in such occupancies where the building is equipped throughout with an automatic sprinkler system
        in accordance with Section 903.3.1.1 or an approved auto- matic smoke detection system installed in accordance with
        Section 907, provided that the doors are installed and operate in accordance with all of the following: 1. The door’s
        electric locks shall unlock on actuation of the automatic sprinkler system or automatic smoke detection system allowing
        immediate free egress. 2. The door’s electric locks shall unlock on loss of power to the electrical locking system
        or to the electric lock mechanism allowing immediate free egress. 3. The electrical locking system shall be installed
        to have the capability of unlocking the electric locks by a switch located at the fire command center, a nursing station
        or other approved location. The switch shall directly break power to the electric lock. 4. A building occupant shall
        not be required to pass through more than one door equipped with a controlled egress locking system before entering
        an exit. 5. The procedures for unlocking the doors shall be described and approved as part of the emergency planning
        and preparedness required by Chapter 4 of the Fire Code of New York State. 6. All clinical staff shall have the keys,
        codes or other means necessary to operate the controlled egress electrical locking systems. 7. Emergency lighting
        shall be provided at the door. 8. The electromechanical or electromagnetic locking device shall be listed in accordance
        with either UL 294 or UL 1034. Exceptions: 1. Items 1 through 4 shall not apply to doors to areas occupied by persons
        who, because of clinical needs, require restraint or containment as part of the function of a psychiatric or cognitive
        treatment area. 2. Items 1 through 4 shall not apply to doors to areas where a listed egress control system is utilized
        to reduce the risk of child abduction from nursery and obstetric areas of a Group I-2 hospital.'
    piece_sha256: 26e68db0bbf4cff5930576425bd5487985870adf1832b011aa27e5cec5917c57
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 6e.
