    topic: means_of_egress
    reason: 'An exit is used for nothing that interferes with its use as a means of egress, its level of protection once reached
      isn''t reduced before the exit discharge, and it is continuous from where it is entered to the exit discharge: what
      an exit is used for and its protection aren''t in the model, so a person''s check.'
