  '713.11':
    label: flag
    topic: means_of_egress
    reason: 'A shaft that doesn''t reach the bottom of the building is closed at its foot in one of three ways, with exceptions:
      a person''s check (general.bc_713_11_shaft_bottom).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 178
      lines:
      - 56
      - 57
      quote: '713.11 Enclosure at the bottom. Shafts that do not extend to the bottom of the building or structure shall comply
        with one of the following:'
    - file: gov.ny.building.2025.pdf
      page: 179
      lines:
      - 3
      - 20
      quote: '1. Be enclosed at the lowest level with construction of the same fire-resistance rating as the lowest floor
        through which the shaft passes, but not less than the rating required for the shaft enclosure. 2. Terminate in a room
        having a use related to the purpose of the shaft. The room shall be separated from the remainder of the building by
        fire barriers constructed in accordance with Section 707 or horizontal assemblies constructed in accordance with Section
        711, or both. The fire-resistance rating and opening protectives shall be not less than the protection required for
        the shaft enclosure. 3. Be protected by approved fire dampers installed in accordance with their listing at the lowest
        floor level within the shaft enclosure. Exceptions: 1. The fire-resistance-rated room separation is not required,
        provided that the only openings in or penetrations of the shaft enclosure to the interior of the building occur at
        the bottom. The bottom of the shaft shall be closed off around the pene- trating items with materials permitted by
        Section 718.3.1 for draftstops, or the room shall be provided with an approved automatic sprinkler system. 2. A shaft
        enclosure containing a waste or linen chute shall not be used for any other purpose and shall discharge in a room
        protected in accordance with Section 713.13.4. 3. The fire-resistance-rated room separation and the protection at
        the bottom of the shaft are not required provided that there are no combustibles in the shaft and there are no openings
        or other penetrations through the shaft enclosure to the interior of the building.'
    piece_sha256: e6973622a3865d7c9edb172f05a04e436b737c37d29a98e8f234bb5e284b2802
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Chapter 7 part a.
