        terminate at a top enclosure complying with Section 713.12. 2. Interior exit stairway and ramp enclosures required
        by Section 1023 and exit access stairway and ramp enclosures required by Section 1019 shall be permitted to terminate
        at a top enclosure complying with Section 713.12. 3. An exit passageway enclosure required by Section 1024.3 that
        does not extend to the underside of the floor sheathing, roof sheathing, slab or deck above shall be enclosed at the
        top with construction of the same fire-resistance rating as required for the exit passageway.'
