      are rated at least 1 hour with openings protected at least 3/4 hour, from the ground to 10 feet above the passageway''s
      floor or to the roof line, whichever is lower: ratings and angles aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
