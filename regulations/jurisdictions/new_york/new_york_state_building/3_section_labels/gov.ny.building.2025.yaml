  1025.2.4.2:
    label: flag
    topic: means_of_egress
    reason: 'Wall-mounted demarcation lines have their bottom edge at most 4 inches above the finished floor, drop to the
      floor within 2 inches of the step or landing edge at the top and bottom of stairs, move to the floor where a floor line
      is the only practical way to outline the path, and continue across a door''s face or the floor in front of it, but not
      in front of exit discharge doors leading out of the exit: markings aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 349
      lines:
      - 35
      - 42
      quote: '1025.2.4.2 Wall-mounted demarcation lines. Perimeter demarcation lines shall be placed on the wall with the
        bottom edge of the stripe not more than 4 inches (102 mm) above the finished floor. At the top or bottom of the stairs,
        demarcation lines shall drop vertically to the floor within 2 inches (51 mm) of the step or landing edge. Demarcation
        lines on walls shall transition vertically to the floor and then extend across the floor where a line on the floor
        is the only practical method of outlining the path. Where the wall line is broken by a door, demarcation lines on
        walls shall continue across the face of the door or transition to the floor and extend across the floor in front of
        such door. Exception: Demarcation lines shall not extend in front of exit discharge doors that lead out of an exit
        and through which occupants must travel to complete the exit path.'
    piece_sha256: c1da0efc7009d00a12078be8bc1915f47bc02af2f7c61e2f0edbfdcad7c347f5
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9f.
