  907.2.11.5:
    label: flag
    topic: means_of_egress
    reason: 'Where a unit in Group R or I-1 needs more than one smoke alarm, they are interconnected so one sets off all (listed
      wireless alarms may do it), clearly audible in all bedrooms over background noise with the doors closed: a person''s
      check (general.bc_907_2_11_5_smoke_alarm_interconnection).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 37
      - 41
      quote: '[F] 907.2.11.5 Interconnection. Where more than one smoke alarm is required to be installed within an individual
        dwelling unit or sleeping unit in Group R or I-1 occupancies, the smoke alarms shall be interconnected in such a manner
        that the activa- tion of one alarm will activate all of the alarms in the individual unit. Physical interconnection
        of smoke alarms shall not be required where listed wireless alarms are installed and all alarms sound upon activation
        of one alarm. The alarm shall be clearly audible in all bedrooms over background noise levels with all intervening
        doors closed.'
