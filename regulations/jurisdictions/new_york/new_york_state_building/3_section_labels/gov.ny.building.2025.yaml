  '1023.1':
    label: flag
    topic: means_of_egress
    reason: 'An interior exit stairway or ramp is enclosed and leads directly to the exterior, or is extended to it by an
      exit passageway meeting 1024, except as 1028.2 permits (through areas on the level of exit discharge or a vestibule),
      and is used only as a means of egress and a circulation path: which stairways are exit stairways, their enclosures and
      their use aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 345
      lines:
      - 50
      - 54
      quote: 1023.1 General. Interior exit stairways and ramps serving as an exit component in a means of egress system shall
        comply with the requirements of this section. Interior exit stairways and ramps shall be enclosed and lead directly
        to the exterior of the building or shall be extended to the exterior of the building with an exit passageway conforming
        to the requirements of Section 1024, except as permitted in Section 1028.2. An interior exit stairway or ramp shall
        not be used for any purpose other than as a means of egress and a circulation path.
    piece_sha256: 03e8c2d0dad2169f165a2255181f489afd973a875777680b8f3881ca86aa0ade
