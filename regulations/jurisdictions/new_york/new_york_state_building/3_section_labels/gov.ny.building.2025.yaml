      - 10
      quote: 909.20.2.1 Door closers. Doors in a smokeproof enclosure shall be self- or automatic closing by actuation of
        a smoke detector in accordance with Section 716.2.6.6 and shall be installed at the floor-side entrance to the smokeproof
        enclosure. The actua- tion of the smoke detector on any door shall activate the closing devices on all doors in the
        smokeproof enclosure at all levels. Smoke detectors shall be installed in accordance with Section 907.3.
    piece_sha256: 8fea9d3d8a5cd0344006d04b1cb555210889e74ba12220374d8f3729b96d0fc8
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
