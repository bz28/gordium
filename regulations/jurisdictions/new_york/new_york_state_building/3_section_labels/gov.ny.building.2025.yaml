    topic: means_of_egress
    reason: 'Group M has a manual fire alarm system activating occupant notification per 907.5 where the Group M occupant
      load of all floors together is 500 or more, or more than 100 are above or below the lowest level of exit discharge (not
      in covered or open mall buildings complying with Section 402; boxes left out with a 903.3.1.1 system that activates
      notification on water flow): a person''s check (general.bc_907_2_7_1_group_m_fire_alarm).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 287
      lines:
      - 15
      - 23
      quote: '[F] 907.2.7.1 Occupant load. A manual fire alarm system that activates the occupant notification system in accordance
        with Section 907.5 shall be installed in Group M occupancies where one of the following conditions exists: 1. The
        combined Group M occupant load of all floors is 500 or more persons. 2. The Group M occupant load is more than 100
        persons above or below the lowest level of exit discharge. Exceptions: 1. A manual fire alarm system is not required
        in covered or open mall buildings complying with Section 402. 2. Manual fire alarm boxes are not required where the
        building is equipped throughout with an automatic sprinkler system installed in accordance with Section 903.3.1.1
        and the occupant notification appliances will automatically activate throughout the notification zones upon sprinkler
        water flow.'
