        by Section 1010.1.5, means of egress illumination levels for the exit discharge shall be provided such that failure
        of a single lamp in a lumi- naire shall not reduce the illumination level on that landing to less than 1 footcandle
        (11 lux).
    piece_sha256: 8b1121436c7df3997f4dbfe9110e7aa6fe46e42fda1b8a3045a2fff92e184c0c
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
