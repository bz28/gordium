  '709.4':
    label: flag
    topic: means_of_egress
    reason: 'A smoke barrier is an effective membrane from the foundation or floor below to the underside of the floor or
      roof sheathing, deck or slab above, through concealed and interstitial spaces, its supporting construction rated as
      the wall or floor it supports (except in buildings of Types IIB, IIIB and VB); walls dividing smoke compartments meet 709.4.1, walls
      enclosing areas of refuge (1009.6.4) or elevator lobbies (405.4.3, 3007.6.2, 3008.6.2) meet 709.4.2; except none is
      needed in an interstitial space whose ceilings or exterior walls resist fire and smoke as well: a person''s check (general.bc_709_4_smoke_barrier_continuity).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 174
      lines:
      - 40
      - 49
      quote: '709.4 Continuity. Smoke barriers shall form an effective membrane continuous from the top of the foundation
        or floor/ceiling assembly below to the underside of the floor or roof sheathing, deck or slab above, including continuity
        through concealed spaces, such as those found above suspended ceilings, and interstitial structural and mechanical
        spaces. The supporting construction shall be protected to afford the required fire-resistance rating of the wall or
        floor supported in buildings of other than Type IIB, IIIB or VB construction. Smoke-barrier walls used to separate
        smoke compartments shall comply with Section 709.4.1. Smoke-barrier walls used to enclose areas of refuge in accordance
        with Section 1009.6.4 or to enclose elevator lobbies in accordance with Section 405.4.3, 3007.6.2, or 3008.6.2 shall
        comply with Section 709.4.2. Exception: Smoke-barrier walls are not required in interstitial spaces where such spaces
        are designed and constructed with ceil- ings or exterior walls that provide resistance to the passage of fire and
        smoke equivalent to that provided by the smoke-barrier walls.'
    piece_sha256: 994f01c2341b45498e829dd5ed7714d94a8df3111c480f59562d86df15461bf0
