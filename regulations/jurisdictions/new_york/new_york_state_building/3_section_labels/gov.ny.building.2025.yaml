  '1016.2':
    label: rule
    topic: means_of_egress
    reason: 'Where egress may pass through intervening rooms: never through a room that can be locked (item 4), never through
      kitchens, storage rooms or closets (item 6, with its exceptions), never from dwelling units or sleeping areas through
      other sleeping areas or toilet rooms (item 5): measurable from the path; through other adjoining rooms only where accessory
      with a discernible path (items 2 and 3): a person''s judgment.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 340
      lines:
      - 54
      - 54
      quote: 4. An exit access shall not pass through a room that can be locked to prevent egress.
    - file: gov.ny.building.2025.pdf
      page: 340
      lines:
      - 59
      - 59
      quote: 6. Egress shall not pass through kitchens, storage rooms, closets or spaces used for similar purposes.
    piece_sha256: 75ce5120ce02dba41247b79ce0300db00da2a96dfe6066836bd5c20e9e0df752
    notes: Drafted by hand in a Claude Code session (2026-11-21); no recorded labeling run. Item 1 (enclosed elevator lobbies,
