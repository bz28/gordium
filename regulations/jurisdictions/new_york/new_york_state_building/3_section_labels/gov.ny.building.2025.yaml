  202:ceiling_radiation_damper:
    label: reference
    topic: definitions
    reason: 'Defines CEILING RADIATION DAMPER, a word the brought-in sections use: a definition, no requirement.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 36
      lines:
      - 24
      - 28
      quote: '[BF] CEILING RADIATION DAMPER. A listed device installed in a ceiling membrane of a fire-resistance-rated floor/ceiling
        or roof/ceil- ing assembly to limit automatically the radiative heat transfer through an air inlet/outlet opening.
        Ceiling radiation dampers include air terminal units, ceiling dampers and ceiling air diffusers. Ceiling radiation
        dampers are classified for use in either static systems that will automatically shut down in the event of a fire,
        or in dynamic systems that continue to operate during a fire. A dynamic ceiling radi- ation damper is tested and rated
        for closure under elevated temperature airflow.'
    piece_sha256: a416d1098efb8bf2491e66320a0a82322b8493efa6352b063e12eaf19a6b7edd
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Chapter 7 part a.
