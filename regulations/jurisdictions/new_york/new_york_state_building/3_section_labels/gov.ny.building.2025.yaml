  1009.7.2:
    label: flag
    topic: means_of_egress
    reason: 'The exterior walls between an exterior area for assisted rescue and the building''s interior are rated at least
      1 hour from the inside, extending at least 10 feet beyond the landing on either side (or equivalent rated construction
      at least 4 feet out from the wall beside the landing) and from the ground to at least 10 feet above the area''s floor
      or the roof line, whichever is lower, openings protected per 716; neither the rating nor the opening protectives is
      required in a building sprinklered throughout per 903.3.1.1 or 903.3.1.2: such areas and wall ratings aren''t in the
      model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 321
      lines:
      - 24
      - 32
      quote: '1009.7.2 Separation. Exterior walls separating the exterior area of assisted rescue from the interior of the
        building shall have a minimum fire-resistance rating of 1 hour, rated for exposure to fire from the inside. The fire-resistance-rated
        exterior wall construction shall extend horizontally not less than 10 feet (3048 mm) beyond the landing on either
        side of the landing or equiva- lent fire-resistance-rated construction is permitted to extend out perpendicular to
        the exterior wall not less than 4 feet (1219 mm) on the side of the landing. The fire-resistance-rated construction
        shall extend vertically from the ground to a point not less than 10 feet (3048 mm) above the floor level of the area
        for assisted rescue or to the roof line, whichever is lower. Openings within such fire-resistance-rated exterior walls
        shall be protected in accordance with Section 716. Exception: The fire-resistance rating and opening protectives are
        not required in the exterior wall where the building is equipped throughout with an automatic sprinkler system installed
        in accordance with Section 903.3.1.1 or 903.3.1.2.'
    piece_sha256: 91960746ce4b4a42dc4d15fd058e02bf0eaba5e8bb723447772469db4d5784b9
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9c.
