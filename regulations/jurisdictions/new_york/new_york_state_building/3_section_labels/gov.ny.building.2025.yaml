    reason: 'The means of egress serving a room or space is lit at all times the room or space is occupied (1008.3''s emergency
      lighting on a power failure); not required in Group U, in self-service storage units of 400 sq ft or less entered directly
      from outside, in Group A''s aisle accessways, within dwelling and sleeping units in Groups R-1, R-2 and R-3, or in Group
