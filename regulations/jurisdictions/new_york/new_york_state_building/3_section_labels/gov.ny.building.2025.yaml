    topic: means_of_egress
    reason: 'A latched swinging door serving a Group H occupancy, or a Group A or E room or space of 50 or more, has panic
      or fire exit hardware as its only latch or lock: checkable per door from the hardware the description states, its operation
      and the building''s group (the exceptions a review where the model can''t rule them out).'
    sources:
