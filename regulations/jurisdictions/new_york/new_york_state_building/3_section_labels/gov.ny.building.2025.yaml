        1003 through 1015. An exit shall not be used for any purpose that interferes with its function as a means of egress.
        Once a given level of exit protection is achieved, such level of protection shall not be reduced until arrival at
        the exit discharge. Exits shall be continuous from the point of entry into the exit to the exit discharge.
