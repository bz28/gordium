      - 58
      quote: 1009.8.1 System requirements. Two-way communication systems shall provide communication between each required
        loca- tion and the fire command center or a central control point location approved by the fire department. Where
        the central control point is not a constantly attended location, the two-way communication system shall have timed,
        automatic telephone dial-out capability that provides two-way communication with an approved supervising station or
        emergency services. The two-way communication system shall include both audible and visible signals. Systems shall
        be listed in accordance with UL 2525 and installed in accordance with NFPA 72.
    piece_sha256: eefec7e98111410e0dd135dcb603c9ddb2910777a524cf12ef6caae385112924
