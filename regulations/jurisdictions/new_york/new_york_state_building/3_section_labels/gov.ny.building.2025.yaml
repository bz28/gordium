  1009.7.1:
    label: flag
    topic: means_of_egress
    reason: 'Each exterior area for assisted rescue holds wheelchair spaces as 1009.6.3 sizes them: such areas aren''t in
      the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 321
      lines:
      - 22
      - 23
      quote: 1009.7.1 Size. Each exterior area for assisted rescue shall be sized to accommodate wheelchair spaces in accordance
