      lines:
      - 11
      - 14
      quote: '1023.3 Termination. Interior exit stairways and ramps shall terminate at an exit discharge or a public way.
        Exception: A combination of interior exit stairways, interior exit ramps and exit passageways, constructed in accordance
        with Sections 1023.2, 1023.3.1 and 1024, respectively, and forming a continuous protected enclosure, shall be permitted
        to extend an interior exit stairway or ramp to the exit discharge or a public way.'
