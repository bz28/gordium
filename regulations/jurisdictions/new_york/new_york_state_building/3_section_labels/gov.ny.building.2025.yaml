      lines:
      - 14
      - 23
      quote: '[F] 903.2.2.1 Ambulatory care facilities. An automatic sprinkler system shall be installed throughout the entire
        floor contain- ing an ambulatory care facility where either of the following conditions exist at any time: 1. Four
        or more care recipients are incapable of self-preservation. 2. One or more care recipients that are incapable of self-preservation
        are located at other than the level of exit discharge serving such a facility. In buildings where ambulatory care
        is provided on levels other than the level of exit discharge, an automatic sprinkler system shall be installed throughout
        the entire floor as well as all floors below where such care is provided, and all floors between the level of ambulatory
        care and the nearest level of exit discharge, the level of exit discharge, and all floors below the level of exit
        discharge. Exception: Floors classified as an open parking garage are not required to be sprinklered.'
