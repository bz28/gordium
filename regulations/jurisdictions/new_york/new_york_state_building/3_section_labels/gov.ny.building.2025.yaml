      quote: 1016.2.1 Multiple tenants. Where more than one tenant occupies any one floor of a building or structure, each
        tenant space, dwelling unit and sleeping unit shall be provided with access to the required exits without passing
        through adjacent tenant spaces, dwelling units and sleeping units.
