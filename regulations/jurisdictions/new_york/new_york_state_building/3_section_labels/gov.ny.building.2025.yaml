  1010.2.6:
    label: flag
    topic: means_of_egress
    reason: 'Interior stairway doors openable from both sides, with five exceptions: how each door locks isn''t in the model,
      a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 326
      lines:
      - 4
      - 22
      quote: '1010.2.6 Stairway doors. Interior stairway means of egress doors shall be openable from both sides without the
        use of a key or special knowledge or effort. Exceptions: 1. Stairway discharge doors shall be openable from the egress
        side and shall only be locked from the opposite side. 2. This section shall not apply to doors arranged in accordance
        with Section 403.5.3. 3. Stairway exit doors shall not be locked from the side opposite the egress side, unless they
        are openable from the egress side and capable of being unlocked simultaneously without unlatching by all of the following
        methods: 3.1. Shall be capable of being unlocked individually or simultaneously upon a signal from the fire command
        center, where present, or a signal by emergency personnel from a single location inside the main entrance to the building.
        3.2. Shall unlock simultaneously upon activation of a fire alarm signal when a fire alarm system is present in an
        area served by the stairway. 3.3. Shall unlock upon failure of the power supply to the electric lock or the locking
        system. 4. Stairway exit doors shall be openable from the egress side and shall only be locked from the opposite side
        in Group B, F, M and S occupancies where the only interior access to the tenant space is from a single exit stairway
        where permit- ted in Section 1006.3.4. 5. Stairway exit doors shall be openable from the egress side and shall only
        be locked from the opposite side in Group R- 2 occupancies where the only interior access to the dwelling unit is
        from a single exit stairway where permitted in Section 1006.3.4.'
    piece_sha256: d6485737f24dd534420567ae6c778e850af7b95f013cb559becc362d0c905cc1
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 6d.
