    topic: means_of_egress
    reason: 'Rubbish and linen chutes have sprinklers at the top, in their terminal rooms, at alternate floors and the lowest
      intake, and a chute''s extension more than one floor below the lowest intake recessed, freeze-protected spri...: a person''s
      check (general.bc_903_2_11_2_chutes).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 272
      lines:
      - 54
      - 59
      quote: '[F] 903.2.11.2 Rubbish and linen chutes. An automatic sprinkler system shall be installed at the top of rubbish
        and linen chutes and in their terminal rooms. Chutes shall have additional sprinkler heads installed at alternate
