      - 62
      quote: '716.1.1 Alternative methods for determining fire protection ratings. The application of any of the alternative
        methods speci- fied in this section shall be based on the fire exposure and acceptance criteria specified in NFPA
        252, NFPA 257, UL 9, UL 10B or UL 10C. The required fire protection rating of an opening protective shall be permitted
        to be established by any of the following meth- ods or procedures: 1. Designs documented in approved sources. 2. Engineering
        analysis based on a comparison of opening protective designs having fire protection ratings as determined by the test
        procedures set forth in NFPA 252, NFPA 257, UL 9, UL 10B or UL 10C. 3. Alternative protection methods as allowed by
        Section 104.2.3.'
