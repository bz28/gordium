  905.3.3:
    label: flag
    topic: means_of_egress
    reason: 'A covered or open mall building has a standpipe system throughout where 905.3.1 requires one, else Class I hose
      connections on the sprinkler system delivering 250 gallons per minute at the hydraulically most remote one while also
      supplying the sprinkler system''s demand, with at most a 50 psi residual pressure loss at that flow from the fire department
      connection, at each exit passageway or corridor entrance, each landing of interior exit stairways opening on the mall,
      the public entrances, and so that no part of a tenant space is more than 200 feet from one: a person''s check (general.bc_905_3_3_mall_standpipes).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 279
      lines:
      - 43
      - 55
      quote: '[F] 905.3.3 Covered and open mall buildings. Covered mall and open mall buildings shall be equipped throughout
        with a stand- pipe system where required by Section 905.3.1. Mall buildings not required to be equipped with a standpipe
        system by Section 905.3.1 shall be equipped with Class I hose connections connected to the automatic sprinkler system
        sized to deliver water at 250 gallons per minute (946.4 L/min) at the hydraulically most remote hose connection while
        concurrently supplying the automatic sprinkler system demand. The standpipe system shall be designed to not exceed
        a 50 pounds per square inch (psi) (345 kPa) resid- ual pressure loss with a flow of 250 gallons per minute (946.4
        L/min) from the fire department connection to the hydraulically most remote hose connection. Hose connections shall
        be provided at each of the following locations: 1. Within the mall at the entrance to each exit passageway or corridor.
        2. At each floor-level landing within interior exit stairways opening directly on the mall. 3. At exterior public
        entrances to the mall of a covered mall building. 4. At public entrances at the perimeter line of an open mall building.
        5. At other locations as necessary so that the distance to reach all portions of a tenant space does not exceed 200
        feet (60 960 mm) from a hose connection.'
    piece_sha256: db205a2464797e517aac36e1cdf45e4cf6f34157ddf172db3048fa3e40cddeb8
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part e.
