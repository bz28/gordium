    sources:
    - file: gov.ny.building.2025.pdf
      page: 343
      lines:
      - 38
      - 39
      quote: 1020.1 General. Corridors serving as an exit access component in a means of egress system shall comply with the
        requirements of Sections 1020.2 through 1020.7.
    piece_sha256: e089431fd652d4b812d499e864d0d17a933f666ecabb468e2b49b995348ab6d2
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.2':
    label: rule
    topic: means_of_egress
    reason: 'Corridors are fire-resistance rated as Table 1020.2 asks, and walls required to be rated are fire partitions
      (Section 708, Chapter 7 part c''s flags); exceptions 1 to 4 lift the rating (Group E rooms with doors straight outside, corridors
      within a dwelling or sleeping unit in Groups I-1 and R, open parking garages, a Group B space needing one means of
      egress), exception 5 allows unprotected openings on unrated exterior walls: the rating is checked per corridor against
      the table, the fire-partition construction a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 343
      lines:
      - 40
      - 41
      quote: 1020.2 Construction. Corridors shall be fire-resistance rated in accordance with Table 1020.2. The corridor walls
        required to be fire- resistance rated shall comply with Section 708 for fire partitions.
    piece_sha256: fb7fa8b5724e18ce5774c6e0394124cf085c9af0ede5f6f381600b0f481e0c9a
    notes: 'Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4b: the rating is
      Table 1020.2''s rules (one per printed row, every group); a rated corridor''s walls as fire partitions (708) is the
      flag "A rated corridor''s walls are fire partitions"; exceptions 1 to 4 need review where the table''s rating fails.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  Table 1020.2:
    label: rule
    topic: means_of_egress
    reason: 'The ratings 1020.2 uses, row by row, by occupancy and the occupant load the corridor serves, without and with
      an automatic sprinkler system (note c: 903.3.1.1 or 903.3.1.2 where allowed; note d: Group R-3 and R-4 with 903.3.1.3);
      Not Permitted without a sprinkler system for Groups H, R, I-1, I-2 and I-3.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 7
      - 13
      quote: H-1, H-2, H-3 All Not Permitted 1[fnc] H-4, H-5 Greater than 30 Not Permitted 1[fnc] A, B, E, F, M, S, U Greater
        than 30 1 0 R Greater than 10 Not Permitted 0.5[fnc]/1[fnd] I-2[fna] All Not Permitted 0 I-1, I-3 All Not Permitted
        1[fnb,] [fnc] I-4 All 1 0
    piece_sha256: 8caec5a85e56fb6bac660726e4bf74e5f91038a4fd14463d4aa98496823ba665
    notes: 'Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Read by position (each character''s
      size: the note letters are 5.04-point beside 8.4-point digits) and on the page image; sources.yaml brought_in.misread
      puts each raised letter right by line. Every row is a rule of its own (section group 4b), a building of two or more
      groups a flag.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1020.2.1:
    label: flag
    topic: means_of_egress
    reason: 'Elevator hoistway doors in rated hoistway enclosures are protected per Section 716 (Chapter 7 part b''s flags) and 3006.2
      (not brought in): the elevators and their doors aren''t drawn, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 19
      - 20
      quote: 1020.2.1 Hoistway protection. Elevator hoistway doors in elevators hoistway enclosures required to be fire-resistance
        rated shall be protected in accordance with Section 716. Elevator hoistway doors shall also be protected in accordance
        with Section 3006.2.
    piece_sha256: 8a508542ed4c9e0ec67245fd38808dbd0c3fff23291df46fad83def384312fe1
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.3':
    label: rule
    topic: means_of_egress
    reason: 'A corridor''s width is at least Table 1020.3''s, and its capacity that of 1005.1; in Group I-2, 96 inches only
      where beds or stretchers move (the exception): measurable per corridor from its width and the occupants it serves.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 21
      - 22
      quote: 1020.3 Width and capacity. The required capacity of corridors shall be determined as specified in Section 1005.1,
        but the minimum width shall be not less than that specified in Table 1020.3.
    piece_sha256: b2c136b1270aba75a19b6bed51288c8945bcef9137f11fb204e6a7eda34fed89
    notes: 'Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4: the width is
      Table 1020.3''s rule (every group; a building of two or more groups is a flag); the capacity, 1005.1''s, is the
      rule "Corridor capacity, 0.2 or 0.15 in per occupant" (a flag in section group 4a, a rule since 5a).'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  Table 1020.3:
    label: rule
    topic: means_of_egress
    reason: 'The widths 1020.3 uses, row by row: 44 inches for any facility not listed, 24 to mechanical, plumbing or electrical
      equipment, 36 with fewer than 50 occupants or within a dwelling unit, 72 in Group E with 100 or more and for stretcher
      traffic in ambulatory care facilities, 96 in Group I-2 where beds are moved.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 27
      - 33
      quote: Any facility not listed in this table 44 Access to and utilization of mechanical, plumbing or electrical systems
        or equipment 24 With an occupant load of less than 50 36 Within a dwelling unit 36 In Group E with a corridor having
        an occupant load of 100 or more 72 In corridors and areas serving stretcher traffic in ambulatory care facilities 72
        Group I-2 in areas where required for bed movement 96
    piece_sha256: 4a8a2129be81b04c677060c0e7e069878b587bef4b4754839c39c6d3be72d4af
    notes: 'Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Read on the page image: one width
      a row, no note letters. The rows that loosen it for a corridor the model can''t tell apart (24 and 36 inches) need review
      short of 44 inches; the rows that tighten it (Group E, Group I-2, ambulatory care) are in the check or need review.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.4':
    label: flag
    topic: means_of_egress
    reason: 'A corridor''s minimum width or required capacity stays unobstructed, but for encroachments per 1005.7 (its own flags since
      section group 5c): the width is measured between the walls and what the model draws, so doors, furniture and equipment it doesn''t
      draw are a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 35
      - 36
      quote: '1020.4 Obstruction. The minimum width or required capacity of corridors shall be unobstructed. Exception: Encroachments
        complying with Section 1005.7.'
    piece_sha256: 03d09568a1997d6f4328ec97063c07e1911171614a193f032fc130f032ad3027
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.5':
    label: rule
    topic: means_of_egress
    reason: 'Caps dead-end corridors at 20 feet where more than one exit or exit access doorway is required, or any length
      under 2.5 times their least width (exception 3); 50 feet for Groups B, E, F, I-1, M, R-1, R-2, S and U sprinklered per
      903.3.1.1: measurable per corridor.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 37
      - 38
      quote: 1020.5 Dead ends. Where more than one exit or exit access doorway is required, the exit access shall be arranged
        such that dead-end corridors do not exceed 20 feet (6096 mm) in length.
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 44
      - 45
      quote: 3. A dead-end corridor shall not be limited in length where the length of the dead-end corridor is less than
        2.5 times the least width of the dead-end corridor.
    piece_sha256: 3a8020bc52c9e2bd47f823c3c37f59c86f78c5c113ec84325a82e8dacdf2d3cc
    notes: Drafted by hand in a Claude Code session (2026-11-21); no recorded labeling run. Every group but I-4 is general.bc_1020_5_dead_end_other_groups
      (2026-11-23); within exceptions 1 (I-3, Conditions 2 to 4) and 4 (I-2, Condition 2), whose conditions aren't stated,
      it needs review.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.6':
    label: flag
    topic: means_of_egress
    reason: 'Corridors don''t serve as supply, return, exhaust, relief or ventilation air ducts, but for four exceptions
      (makeup air, return air within a dwelling unit or a small tenant space, health care pressurization): the air system
      isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 344
      lines:
      - 48
      - 48
      quote: 1020.6 Air movement in corridors. Corridors shall not serve as supply, return, exhaust, relief or ventilation
        air ducts.
    piece_sha256: 71a26e3ae139a2491a5d852a9cced0d51053be16462c8de09c6000028a2e47a3
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1020.6.1:
    label: reference
    topic: means_of_egress
    reason: 'A permission: the space above a corridor''s ceiling may be a return air plenum under any of five conditions;
      part of 1020.6''s check, a person''s.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 345
      lines:
      - 7
      - 8
      quote: '1020.6.1 Corridor ceiling. Use of the space between the corridor ceiling and the floor or roof structure above
        as a return air plenum is permitted for one or more of the following conditions:'
    piece_sha256: f15fb692dc8545d1e29ff9ff7be9735452486ac2ae89041066d093de0548cb41
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1020.7':
    label: flag
    topic: means_of_egress
    reason: 'A fire-resistance-rated corridor runs unbroken from its entry to an exit, with no intervening room (foyers,
      lobbies and reception rooms built as corridors, and enclosed elevator lobbies, aside), its rating continued along
      an open stair or ramp: the routes don''t follow a rating, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 345
      lines:
      - 17
      - 18
      quote: 1020.7 Corridor continuity. Fire-resistance-rated corridors shall be continuous from the point of entry to an
        exit, and shall not be interrupted by intervening rooms.
    piece_sha256: 2abf7d30247757062a31d45f1ca4f943c412ce6f997e12d0516ebb3db9113581
    notes: Drafted by hand in a Claude Code session (2026-11-25); no recorded labeling run. Section group 4c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1030.7':
    label: reference
    topic: means_of_egress
    reason: 'How exit access travel is measured where aisles serve seating: along the aisles and aisle accessways, never over
      or on the seats; exceptions for smoke-protected and open-air seating allow more. Every travel row needs review while
      fixed seating is stated or not ruled out (assembly_fixed_seating), since the routes don''t see the seats.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 354
      lines:
      - 50
      - 52
      quote: '1030.7 Travel distance. The exit access travel distance shall comply with Section 1017. Where aisles are provided
        for seating, the distance shall be measured along the aisles and aisle accessways without travel over or on the seats.
        Exceptions:'
    piece_sha256: 0dedbb8deaa95cfacfefff8ad82fb14eb63468c3e6c595eb4bc7e45d398a2fc6
    notes: 'Drafted by hand in a Claude Code session (2026-11-23); no recorded labeling run. Brought in by review round 2
      of section group 1 (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): fixed seating''s travel in any
      group.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1030.8':
    label: flag
    topic: means_of_egress
    reason: 'An assembly space with fixed seating: a common path of at most 30 feet from any seat (75 feet for fewer than
      50 occupants, 50 feet for smoke-protected or open-air seating): the seats aren''t drawn, so a person''s check (general.bc_1030_8_fixed_seating_common_path),
      and Table 1006.2.1''s A, E, M row needs review over it where fixed seating is stated or not ruled out.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 355
      lines:
      - 13
      - 15
      quote: 1030.8 Common path of egress travel. The common path of egress travel for a room or space used for assembly purposes
        having fixed seating shall not exceed 30 feet (9144 mm) from any seat to a point where an occupant has a choice of
        two paths of egress travel to two exits.
    piece_sha256: bec0c4f98d601924da08413740e93ced18dce4119f71313694aec4c5213d0fb5
    notes: 'Drafted by hand in a Claude Code session (2026-11-23); no recorded labeling run. Brought in by review round 1
      of section group 1 (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): a section that tightens a drafted
      table''s limit for some condition.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
