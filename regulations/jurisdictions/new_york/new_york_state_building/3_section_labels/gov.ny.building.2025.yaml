    topic: means_of_egress
    reason: 'Penetrations in smoke barriers are protected by an approved through-penetration firestop system installed and
      tested per UL 1479 for air leakage, its L rating at 0.30 inch of water in both the ambient and elevated temperature
      tests at most 5.0 cfm per square foot of penetration opening for each system, and at most 50 cfm in all for any 100
      square feet of wall or floor area: a person''s check (general.bc_714_5_4_smoke_barrier_penetrations).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 182
      lines:
      - 32
      - 37
      quote: '714.5.4 Penetrations in smoke barriers. Penetrations in smoke barriers shall be protected by an approved through-penetration
        firestop system installed and tested in accordance with the requirements of UL 1479 for air leakage. The L rating
        of the system measured at 0.30 inch of water (74.7 Pa) in both the ambient temperature and elevated temperature tests
        shall not exceed either of the following: 1. 5.0 cfm per square foot (0.025 m[fn3]/ s × m [fn2]) of penetration opening
        for each through-penetration firestop system. 2. A total cumulative leakage of 50 cfm (0.024 m [fn3]/s) for any 100
        square feet (9.3 m[fn2]) of wall area, or floor area.'
