      page: 181
      lines:
      - 44
      - 58
      quote: '714.5.1.2 Through-penetration firestop system. Through penetrations shall be protected by an approved through-penetra-
        tion firestop system installed and tested in accordance with ASTM E814 or UL 1479, with a minimum positive pressure
        differential of 0.01 inch of water (2.49 Pa). The system shall have an F rating/T rating of not less than 1 hour but
        not less than the required rating of the floor penetrated. Exceptions: 1. Floor penetrations contained and located
        within the cavity of a wall above the floor or below the floor do not require a T rating. 2. Floor penetrations by
        floor drains, tub drains or shower drains contained and located within the concealed space of a horizontal assembly
        do not require a T rating. 3. Floor penetrations of maximum 4-inch (102 mm) nominal diameter metal conduit or tubing
        penetrating directly into metal-enclosed electrical power switchgear do not require a T rating. 4. Penetrations in
        a single concrete floor by steel, ferrous or copper conduits, pipes, tubes or vents with a maximum 6-inch (152 mm)
        nominal diameter do not require a T rating. These penetrating items shall not be limited to the penetration of a single
        concrete floor, provided that the area of the opening through each floor does not exceed 144 square inches (92,900
        mm[fn2]).'
