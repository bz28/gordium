  1023.3.1:
    label: flag
    topic: means_of_egress
    reason: 'Where an exit passageway extends an interior exit stairway or ramp, a fire barrier per 707 or horizontal assembly
      per 711 rated at least as the stairway separates them, with a fire door assembly per 716 the only opening and no penetrations;
      but penetrations per 1023.5 are allowed, and no separation is needed where the extension has no openings or where the
      stairway and extension are pressurized per 909.20.4: the enclosures aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 346
      lines:
      - 15
      - 26
      quote: '1023.3.1 Extension. Where interior exit stairways and ramps are extended to an exit discharge or a public way
        by an exit passage- way, the interior exit stairway and ramp shall be separated from the exit passageway by a fire
        barrier constructed in accordance with Section 707 or a horizontal assembly constructed in accordance with Section
        711, or both. The fire-resistance rating shall be not less than that required for the interior exit stairway and ramp.
        A fire door assembly complying with Section 716 shall be installed in the fire barrier to provide a means of egress
        from the interior exit stairway and ramp to the exit passageway. Openings in the fire barrier other than the fire
        door assembly are prohibited. Penetrations of the fire barrier are prohibited. Exceptions: 1. Penetrations of the
        fire barrier in accordance with Section 1023.5 shall be permitted. 2. Separation between an interior exit stairway
        or ramp and the exit passageway extension shall not be required where there are no openings into the exit passageway
        extension. 3. Separation between an interior exit stairway or ramp and the exit passageway extension shall not be
        required where the interior exit stairway and the exit passageway extension are pressurized in accordance with Section
        909.20.4.'
    piece_sha256: 92c85ecb6adcbeab8e537e019bb09713494af25a9eafd5b6472a27d99ccc215d
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
