    sources:
    - file: gov.ny.building.2025.pdf
      page: 175
      lines:
      - 3
      - 12
      quote: '709.5 Openings. Openings in a smoke barrier shall be protected in accordance with Section 716. Exceptions: 1.
        In Group I-1, Condition 2, Group I-2 and ambulatory care facilities, where a pair of opposite-swinging doors are installed
        across a corridor in accordance with Section 709.5.1, the doors shall not be required to be protected in accordance
        with Section 716. The doors shall be close fitting within operational tolerances, and shall not have a center mullion
        or under- cuts in excess of 3/4 inch (19.1 mm), louvers or grilles. The doors shall have head and jamb stops, and
        astragals or rabbets at meeting edges. Positive latching devices are not required. Factory-applied or field-applied
        protective plates are not required to be labeled. 2. In Group I-1, Condition 2, Group I-2 and ambulatory care facilities,
        special purpose horizontal sliding, accordion or fold- ing doors installed in accordance with Section 1010.3.3 and
        protected in accordance with Section 716.'
