        weight when administered by continuous contact for 24 hours (or less if death occurs within 24 hours) with the bare
        skin of albino rabbits weighing between 2 and 3 kilograms each. 3. A chemical that has a median lethal concentration
        (LC ) in air of more than 200 parts per million, but not more than 2,000 50 parts per million by volume of gas or
        vapor, or more than 2 milligrams per liter but not more than 20 milligrams per liter of mist, fume or dust, when administered
        by continuous inhalation for 1 hour (or less if death occurs within 1 hour) to albino rats weighing between 200 and
        300 grams each.'
