      - 31
      - 44
      quote: '1023.5 Penetrations. Penetrations into or through interior exit stairways and ramps are prohibited except for
        the following: 1. Equipment and ductwork necessary for independent ventilation or pressurization. 2. Fire protection
        systems. 3. Security systems. 4. Two-way communication systems. 5. Electrical raceway for fire department communication
        systems. 6. Electrical raceway serving the interior exit stairway and ramp and terminating at a steel box not exceeding
        16 square inches (0.010 m[fn2]). 7. Structural elements, such as beams or joists, supporting the interior exit stairway
        or ramp or enclosure. 8. Structural elements, such as beams or joists, supporting a roof at the top of the interior
        exit stairway or ramp. Such penetrations shall be protected in accordance with Section 714. There shall not be penetrations
        or communication open- ings, whether protected or not, between adjacent interior exit stairways and ramps. Exception:
        Membrane penetrations shall be permitted on the outside of the interior exit stairway and ramp. Such penetrations
        shall be protected in accordance with Section 714.4.2.'
    piece_sha256: d73bf41cd134abea1512f0a98c210f9b03dbe99c67719eb81d49042cc2cee5c6
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1023.6':
    label: flag
    topic: means_of_egress
    reason: 'Equipment and ductwork ventilating an interior exit stairway or ramp is outside the building with ducts enclosed
      as shafts, or within the enclosure taking air from and discharging it directly outdoors (or through ducts enclosed as
      shafts), or within the building separated as shafts; openings into the rated construction are only those needed for
      maintenance and operation, protected per 716 for shaft enclosures; and the system is independent of the building''s
      other ventilation: ventilation isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 346
      lines:
      - 45
      - 56
      quote: '1023.6 Ventilation. Equipment and ductwork for interior exit stairway and ramp ventilation as permitted by Section
        1023.5 shall comply with one of the following items: 1. Such equipment and ductwork shall be located exterior to the
        building and shall be directly connected to the interior exit stairway and ramp by ductwork enclosed in construction
        as required for shafts. 2. Where such equipment and ductwork is located within the interior exit stairway and ramp,
        the intake air shall be taken directly from the outdoors and the exhaust air shall be discharged directly to the outdoors,
        or such air shall be conveyed through ducts enclosed in construction as required for shafts. 3. Where located within
        the building, such equipment and ductwork shall be separated from the remainder of the building, including other mechanical
        equipment, with construction as required for shafts. In each case, openings into the fire-resistance-rated construction
        shall be limited to those needed for maintenance and operation and shall be protected by opening protectives in accordance
        with Section 716 for shaft enclosures. The interior exit stairway and ramp ventilation systems shall be independent
        of other building ventilation systems.'
    piece_sha256: e86e9cb721c5fc99c69fe6621f316acb5abd2a09ba128c8a3f9c99be306b466b
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9e.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
