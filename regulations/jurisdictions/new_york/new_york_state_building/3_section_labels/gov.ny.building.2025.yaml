  907.2.11.2:
    label: flag
    topic: means_of_egress
    reason: 'New York places smoke alarms in Groups R-2, R-3, R-4 and I-1 outside each separate sleeping area near the bedrooms,
      in each room used for sleeping, on each story within a unit including basements (a split level''s upper alarm serving
      a lower level less than a full story below with no door between), at least 3 feet from a bath or shower room''s door,
      in a hallway and the room open to it where that room''s ceiling is 24 inches or more above the hallway''s, by a sleeping
      loft, in each common space shared by three or more units, and, on a level over 1000 square feet, within 30 feet of travel
      of every ceiling point or one per 500 square feet: a person''s check (general.bc_907_2_11_2_group_r_smoke_alarm_locations).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 289
      lines:
      - 8
      - 29
      quote: '[NY] 907.2.11.2 Groups R-2, R-3, R-4 and I-1. Single- or multiple-station smoke alarms shall be installed and
        maintained in Groups R-2, R-3, R-4 and I-1 regardless of occupant load at all of the following locations: 1. On the
        ceiling or wall outside of each separate sleeping area in the immediate vicinity of bedrooms. 2. In each room used
        for sleeping purposes. 3. In each story within a dwelling unit, including basements but not including crawl spaces
        and uninhabitable attics. In dwellings or dwelling units with split levels and without an intervening door between
        the adjacent levels, a smoke alarm installed on the upper level shall suffice for the adjacent lower level provided
        that the lower level is less than one full story below the upper level. 4. Not less than 3 feet (914 mm) horizontally
        from the door or opening of a bathroom that contains a bathtub or shower unless this would prevent placement of a
        smoke alarm required by this section. 5. In the hallway and in the room open to the hallway in dwelling units where
        the ceiling height of a room open to a hall- way serving bedrooms exceeds that of the hallway by 24 inches (610 mm)
        or more. 6. Within the room to which a sleeping loft is open, in the immediate vicinity of the sleeping loft. 7. In
        each common space shared by three or more dwelling units such that an alarm notification is clearly audible in each
        common space. 8. Where the interior floor area for a given level of a dwelling unit, excluding garage areas, is greater
        than 1000 ft2 (93 m2), smoke alarms shall be installed per both of the following: 8.1 All points on the ceiling shall
        have a smoke alarm within a distance of 30 ft (9.1 m) travel distance or shall have an equivalent of one smoke alarm
        per 500 ft2 (46 m2) of floor area. 8.2 Where dwelling units include great rooms or vaulted/cathedral ceilings extending
        over multiple floors, smoke alarms located on the upper floor that are intended to protect the aforementioned area
        shall be permitted to be considered as part of the lower floor’s protection scheme.'
    piece_sha256: 70d4b851ba85c5e2074b3a4409f2fde2425273742bfa71c31b5f5ce4c2041a30
