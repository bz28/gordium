    sources:
    - file: gov.ny.building.2025.pdf
      page: 172
      lines:
      - 14
      - 24
      quote: '707.5 Continuity. Fire barriers shall extend from the top of the foundation or floor/ceiling assembly below
        to the underside of the floor or roof sheathing, slab or deck above and shall be securely attached thereto. Such fire
        barriers shall be continuous through concealed space, such as the space above a suspended ceiling. Joints and voids
