  1009.3.1:
    label: flag
    topic: means_of_egress
    reason: 'A stairway between stories counts toward an accessible means of egress only as 1009.3.1 to 1009.3.3 allow (1009.3);
      exit access stairways connecting levels in the same story don''t count (stairways from mezzanines do): which stairways
      the accessible means of egress relies on isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 320
      lines:
      - 17
      - 20
      quote: '1009.3.1 Exit access stairways. Exit access stairways that connect levels in the same story are not permitted
        as part of an acces- sible means of egress. Exception: Exit access stairways providing means of egress from mezzanines
        are permitted as part of an accessible means of egress.'
    piece_sha256: 6000b6ce87a44ed48ee52ca64018f8942538e8418242814c1fdd3e345acedc5d
