  '903.2':
    label: flag
    topic: means_of_egress
    reason: Says sprinkler systems are required in new buildings where 903.2.1 to 903.2.12 say, each group's rule reading
      it; in a building of two or more groups each portion's fire areas, and the exception for spaces used only for telecommunications
      equipment, are a person's check (general.bc_903_2_mixed_occupancies).
    sources:
    - file: gov.ny.building.2025.pdf
      page: 269
      lines:
      - 20
      - 27
      quote: '[F] 903.2 Where required. Approved automatic sprinkler systems in new buildings and structures shall be provided
        in the locations described in Sections 903.2.1 through 903.2.12. Exception: Spaces or areas in telecommunications
        buildings used exclusively for telecommunications equipment, associated electrical power distribution equipment, batteries
        not required to have an automatic sprinkler system by Section 1207 of the Fire Code of New York State for energy storage
        systems and standby engines, provided that those spaces or areas are equipped throughout with an automatic smoke detection
