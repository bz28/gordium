  '1003.2':
    label: flag
    topic: means_of_egress
    reason: 'The means of egress has a ceiling at least 7 feet 6 inches above the finished floor, except sloped ceilings and
      the ceilings of dwelling and sleeping units in residential occupancies (each per 1208.2), projections 1003.3 allows,
      stair headroom (1011.3), door height (1010.1.1), ramp headroom (1012.5.2), the clear height of parking garages'' traffic
      areas (406.2.2) and areas above and below mezzanines (505.2): ceiling heights along the means of egress aren''t measured,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 310
      lines:
      - 35
      - 46
      quote: '1003.2 Ceiling height. The means of egress shall have a ceiling height of not less than 7 feet 6 inches (2286
        mm) above the finished floor. Exceptions: 1. Sloped ceilings in accordance with Section 1208.2. 2. Ceilings of dwelling
        units and sleeping units within residential occupancies in accordance with Section 1208.2. 3. Allowable projections
        in accordance with Section 1003.3. 4. Stair headroom in accordance with Section 1011.3. 5. Door height in accordance
        with Section 1010.1.1. 6. Ramp headroom in accordance with Section 1012.5.2. 7. The clear height of floor levels in
        vehicular and pedestrian traffic areas of public and private parking garages in accor- dance with Section 406.2.2.
        8. Areas above and below mezzanine floors in accordance with Section 505.2.'
    piece_sha256: 02cc377ffd2bca731b8131c782792061fcc5f196bdbc9ec38809e7ddc2bd1280
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1003.3':
    label: reference
    topic: means_of_egress
    reason: 'A pointer: protruding objects comply with 1003.3.1 to 1003.3.4, each labeled on its own; quoted by 1003.3.1''s
      flag.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 310
      lines:
      - 47
      - 48
      quote: 1003.3 Protruding objects. Protruding objects on circulation paths shall comply with the requirements of Sections
        1003.3.1 through 1003.3.4.
    piece_sha256: 9002e1883a0d5b6f0cb4f578f2d05d3a8ebdfacd4ee9f8b9a9c0efc05968262f
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1003.3.1:
    label: flag
    topic: means_of_egress
    reason: 'Protruding objects on circulation paths may hang below 1003.2''s ceiling height only where at least 80 inches
      of headroom is kept over every circulation path (walks, corridors, aisles and passageways), and they lower not more
      than half the ceiling area of a means of egress; door closers, overhead doorstops, frame stops, power door operators
      and electromagnetic locks may reach down to 78 inches in a door opening; where the clearance over a circulation path
      is less than 80 inches, a barrier is provided with its leading edge at most 27 inches above the floor: protruding objects
      aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 310
      lines:
      - 49
      - 53
      quote: '1003.3.1 Headroom. Protruding objects are permitted to extend below the minimum ceiling height required by Section
        1003.2 where a minimum headroom of 80 inches (2032 mm) is provided over any circulation paths, including walks, corridors,
        aisles and passageways. Not more than 50 percent of the ceiling area of a means of egress shall be reduced in height
        by protruding objects. Exception: Door closers, overhead doorstops, frame stops, power door operators and electromagnetic
        door locks shall be permitted to project into the door opening height not lower than 78 inches (1980 mm) above the
        floor.'
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 3
      - 4
      quote: A barrier shall be provided where the vertical clearance above a circulation path is less than 80 inches (2032
        mm) high above the finished floor. The leading edge of such a barrier shall be located 27 inches (686 mm) maximum
        above the finished floor.
    piece_sha256: e24af865fd068f90905897e6c0de10b646462b5222659bb434472664f5e66e6a
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1003.3.2:
    label: flag
    topic: means_of_egress
    reason: 'An object on a post or pylon overhangs it at most 4 inches where its leading edge''s lowest point is more than
      27 and less than 80 inches above the floor; a sign or other obstruction between posts or pylons more than 12 inches
      apart has its lowest edge at most 27 or at least 80 inches above the floor or ground (the sloping handrails of stairs
      and ramps aside): such objects aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 5
      - 11
      quote: '1003.3.2 Post-mounted objects. A free-standing object mounted on a post or pylon shall not overhang that post
        or pylon more than 4 inches (102 mm) where the lowest point of the leading edge is more than 27 inches (686 mm) and
        less than 80 inches (2032 mm) above the finished floor. Where a sign or other obstruction is mounted between posts
        or pylons and the clear distance between the posts or pylons is greater than 12 inches (305 mm), the lowest edge of
        such sign or obstruction shall be 27 inches (686 mm) maximum or 80 inches (2032 mm) minimum above the finished floor
        or ground. Exception: These requirements shall not apply to sloping portions of handrails between the top and bottom
        riser of stairs and above the ramp run.'
    piece_sha256: c905e077199205770e45ddd9959402ea69d8f93dd55a50138a22279055575b38
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1003.3.3:
    label: flag
    topic: means_of_egress
    reason: 'Objects with leading edges more than 27 and not more than 80 inches above the floor project at most 4 inches
      into the circulation path (handrails up to 4 1/2 inches from the wall or guard): wall-mounted objects aren''t in the
      model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 12
      - 14
      quote: '1003.3.3 Horizontal projections. Objects with leading edges more than 27 inches (685 mm) and not more than 80
        inches (2030 mm) above the finished floor shall not project horizontally more than 4 inches (102 mm) into the circulation
        path. Exception: Handrails are permitted to protrude 4 1/2 inches (114 mm) from the wall or guard.'
    piece_sha256: d46298418cfc5c5f8923011e36b0650b032822e56f03d9e506cd996f8864b121
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1003.3.4:
    label: flag
    topic: means_of_egress
    reason: 'Protruding objects don''t reduce the minimum clear width of an accessible route: protruding objects and accessible
      routes aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 15
      - 15
      quote: 1003.3.4 Clear width. Protruding objects shall not reduce the minimum clear width of accessible routes.
    piece_sha256: 1d8288ac13348e728c46a903b104fc7a52046e39dca5e4af028ff27a3c7c988d
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1003.4':
    label: flag
    topic: means_of_egress
    reason: 'The circulation paths of the means of egress have a slip-resistant surface, securely attached: floor finishes
      aren''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 16
      - 16
      quote: 1003.4 Slip-resistant surface. Circulation paths of the means of egress shall have a slip-resistant surface and
        be securely attached.
    piece_sha256: 5245be190b64be0b71584c08a8bb0197f4942ace3849170a091f20132c5883b6
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1003.5':
    label: flag
    topic: means_of_egress
    reason: 'A change in elevation of less than 12 inches in the means of egress is made by a sloped surface, a ramp complying
      with 1012 where steeper than 1 in 20 (5 percent), with handrails or a contrasting floor finish where 6 inches or less;
      the exceptions are steps at exterior doors per 1010.1.4, a stair of one riser or of two risers and a tread where Chapter
      11 doesn''t require access (risers and treads per 1011.5, treads at least 13 inches deep, a handrail per 1014 within
      30 inches of the centerline of the path), and a step under 12 inches in aisles serving seating where Chapter 11 doesn''t
      require access (risers and treads per 1030.14, a handrail per 1030.16); throughout a story in Group I-2, any change
      in elevation in the means of egress serving nonambulatory persons is a ramp or sloped walkway: the routes read each
      story as one level, so changes in floor level within it aren''t in the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 311
      lines:
      - 17
      - 31
      quote: '1003.5 Elevation change. Where changes in elevation of less than 12 inches (305 mm) exist in the means of egress,
        sloped surfaces shall be used. Where the slope is greater than one unit vertical in 20 units horizontal (5-percent
        slope), ramps complying with Section 1012 shall be used. Where the difference in elevation is 6 inches (152 mm) or
        less, the ramp shall be equipped with either handrails or floor finish materials that contrast with adjacent floor
        finish materials. Exceptions: 1. Steps at exterior doors complying with Section 1010.1.4. 2. A stair with a single
        riser or with two risers and a tread is permitted at locations not required to be accessible by Chapter 11 where the
        risers and treads comply with Section 1011.5, the minimum depth of the tread is 13 inches (330 mm) and not less than
        one handrail complying with Section 1014 is provided within 30 inches (762 mm) of the centerline of the normal path
        of egress travel on the stair. 3. A step is permitted in aisles serving seating that has a difference in elevation
        less than 12 inches (305 mm) at locations not required to be accessible by Chapter 11, provided that the risers and
        treads comply with Section 1030.14 and the aisle is provided with a handrail complying with Section 1030.16. Throughout
        a story in a Group I-2 occupancy, any change in elevation in portions of the means of egress that serve nonambulatory
        persons shall be by means of a ramp or sloped walkway.'
