    topic: means_of_egress
    reason: 'A two-way communication system connects each required location with the fire command center or a central control
      point the fire department approves, with timed automatic telephone dial-out to an approved supervising station or emergency
      services where that point isn''t constantly attended, audible and visible signals, listed to UL 2525 and installed per
      NFPA 72: such systems aren''t in the model, so a person''s check.'
    sources:
