        system in accor- dance with Section 907.5 shall be installed in Group R- 1 occupancies. Exceptions: 1. A manual fire
        alarm system is not required in buildings not more than two stories in height where all individual dwelling units,
        sleeping units, and contiguous attic and crawl spaces to those units are separated from each other and public or common
