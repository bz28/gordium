      - 10
      quote: 1023.7.1 Building exterior walls. Building exterior walls within 10 feet (3048 mm) horizontally of a nonrated
        wall or unprotected opening in an interior exit stairway or ramp shall have a fire-resistance rating of not less than
        1 hour. Openings within such exterior walls shall be protected by opening protectives having a fire protection rating
        of not less than 3/4 hour. This construction shall extend vertically from the ground to a point 10 feet (3048 mm)
