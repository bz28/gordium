      person''s check (general.bc_907_2_6_group_i_fire_alarm).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 286
      lines:
      - 17
      - 27
      quote: '[F] 907.2.6 Group I. A manual fire alarm system that activates the occupant notification system in accordance
        with Section 907.5 shall be installed in Group I occupancies. An automatic smoke detection system that activates the
        occupant notification system in accordance with Section 907.5 shall be provided in accordance with Sections 907.2.6.1,
        907.2.6.2 and 907.2.6.3.3. Exceptions: 1. Manual fire alarm boxes in sleeping units of Group I-1 and I-2 occupancies
        shall not be required at exits if located at all care providers’ control stations or other constantly attended staff
        locations, provided that such manual fire alarm boxes are visible and provided with ready access, and the distances
        of travel required in Section 907.4.2.1 are not exceeded. 2. Occupant notification systems are not required to be
        activated where private mode signaling installed in accordance with NFPA 72 is approved by the fire code official
        and staff evacuation responsibilities are included in the fire safety and evacuation plan required by Section 404
        of the Fire Code of New York State.'
