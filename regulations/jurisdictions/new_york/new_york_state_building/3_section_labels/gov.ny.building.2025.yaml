  1023.7.2:
    label: flag
    topic: means_of_egress
    reason: 'Where an interior exit stairway or ramp rises above an adjacent roof of the same building, that roof is rated
      at least 1 hour and its openings protected at least 3/4 hour, for at least 10 feet from the stairway''s exterior wall
      or to the roof''s perimeter, whichever is less; but the roof need not be rated nor its openings protected beside the
      stairway''s penthouse, unless the code otherwise requires it, nor where the stairway''s exterior wall is rated 1 hour
      with openings protected at least 3/4 hour, extending at least 10 feet above the roof: roof ratings aren''t in the model,
      so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 347
      lines:
      - 11
      - 22
      quote: '1023.7.2 Roof assemblies. Where the interior exit stairway or ramp extends above an adjacent roof of the same
        building, the adjacent roof assembly shall have a fire-resistance rating of not less than 1 hour and openings shall
        be protected by opening protectives having a fire protection rating of not less than 3/4 hour. The fire-resistance
        rating and opening protection shall extend horizontally not less than 10 feet (3048 mm) from the exterior wall of
        the stairway or ramp, or to the perimeter of the adjacent roof, whichever is less. Exceptions: 1. The roof assembly
        need not be rated and openings in the roof need not be protected where they are adjacent to the penthouse of the stairway
        or ramp, unless otherwise required by this code. 2. The adjacent roof assembly need not be rated and adjacent openings
        in the roof need not be protected where the exterior wall of the stairway or ramp has a fire-resistance rating of
        1 hour and openings are protected by opening protectives having a fire protection rating of not less than 3/4 hour,
        extending not less than 10 feet (3048 mm) above the roof.'
