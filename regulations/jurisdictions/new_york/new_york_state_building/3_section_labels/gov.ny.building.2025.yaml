        containing exit access stairways or ramps shall be enclosed with a shaft enclosure constructed in accordance with
        Section 713. Exceptions: 1. Exit access stairways and ramps within a two-story opening complying with Section 712.1.9.
        2. In Group R-1, R-2 or R-3 occupancies, exit access stairways and ramps connecting four stories or less serving and
        contained within an individual dwelling unit or sleeping unit or live/work unit. 3. Exit access stairways serving
        and contained within a Group R-3 congregate residence or a Group R-4 facility are not required to be enclosed. 4.
        Exit access stairways and ramps in buildings equipped throughout with an automatic sprinkler system in accordance
        with Section 903.3.1.1, where the area of the vertical opening between stories does not exceed twice the horizontal
        projected area of the stairway or ramp and the opening is protected by a draft curtain and closely spaced sprinklers
        in accordance with NFPA 13. In other than Group B and M occupancies, this provision is limited to openings that do
        not connect more than four stories. 5. Exit access stairways and ramps within an atrium complying with the provisions
        of Section 404. 6. Exit access stairways and ramps in open parking garages that serve only the parking garage. 7.
        Exit access stairways and ramps serving smoke-protected or open-air assembly seating complying with the exit access
        travel distance requirements of Section 1030.7. 8. Exit access stairways and ramps between the balcony, gallery or
        press box and the main assembly floor in occupancies such as theaters, places of religious worship, auditoriums and
        sports facilities. 9. Exterior exit access stairways or ramps between occupiable roofs.'
