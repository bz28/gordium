  1010.1.1:
    label: rule
    topic: means_of_egress
    reason: 'Each door opening''s clear width (32 inches, 41 1/2 inches for Group I-2 bed movement) and clear height (80 inches),
      with exceptions that loosen them within dwelling and sleeping units, for small storage closets and for compartments: measurable
      per door from its maker''s stated clear opening. Its capacity for the occupant load is a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 322
      lines:
      - 37
      - 58
      quote: '1010.1.1 Size of doors. The required capacity of each door opening shall be sufficient for the occupant load thereof
        and shall provide a minimum clear opening width of 32 inches (813 mm). The clear opening width of doorways with swinging
        doors shall be measured between the face of the door and the frame stop, with the door open 90 degrees (1.57 rad). Where
        this section requires a minimum clear opening width of 32 inches (813 mm) and a door opening includes two door leaves
        without a mullion, one leaf shall provide a minimum clear opening width of 32 inches (813 mm). In Group I-2, doors serving
        as means of egress doors where used for the movement of beds shall provide a minimum clear opening width of 41 1/2 inches
        (1054 mm). The minimum clear open- ing height of doors shall be not less than 80 inches (2032 mm). Exceptions: 1. In
        Group R-2 and R-3 dwelling and sleeping units that are not required to be an Accessible unit, Type A unit or Type B
        unit, the minimum width shall not apply to door openings that are not part of the required means of egress. 2. In Group
        I-3, door openings to resident sleeping units that are not required to be an Accessible unit shall have a mini- mum
        clear opening width of 28 inches (711 mm). 3. Door openings to storage closets less than 10 square feet (0.93 m[fn2])
        in area shall not be limited by the minimum clear opening width. 4. Door openings within a dwelling unit or sleeping
        unit shall have a minimum clear opening height of 78 inches (1981 mm). 5. In dwelling and sleeping units that are not
        required to be Accessible, Type A or Type B units, exterior door openings other than the required exit door shall have
        a minimum clear opening height of 76 inches (1930 mm). 6. In Groups I-1, R-2, R-3 and R-4, in dwelling and sleeping
        units that are not required to be Accessible, Type A or Type B units, the minimum clear opening widths shall not apply
        to interior egress doors. 7. Door openings required to be accessible within Type B units intended for user passage shall
        have a minimum clear opening width of 31.75 inches (806 mm).'
    - file: gov.ny.building.2025.pdf
      page: 323
      lines:
      - 3
      - 5
      quote: 8. Doors serving sauna compartments, toilet compartments or dressing, fitting or changing compartments that are
        not required to be accessible shall have a minimum clear opening width of 20 inches (508 mm). 9. Doors serving shower
        compartments shall comply with Section 421.4.2 of the Plumbing Code of New York State.
    piece_sha256: 112c58f8b7ca46cda115ba232f295d1f56b73dcb902b0c8d8520a936c010a49d
