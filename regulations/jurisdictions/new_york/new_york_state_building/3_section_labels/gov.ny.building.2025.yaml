    reason: 'The stair is at least 0.05 inch of water above the vestibule, and the vestibule at least 0.05 inch above the
      fire floor, doors closed, at most 30 pounds of force to begin opening a door: a person''s check (general.bc_909_20_5_2_pressure_difference).'
