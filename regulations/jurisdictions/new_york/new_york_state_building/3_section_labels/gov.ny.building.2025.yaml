      - 52
      quote: '1013.2 Low-level exit signs in Group R-1. Where exit signs are required in Group R-1 occupancies by Section
        1013.1, additional low- level exit signs shall be provided in all areas serving guest rooms in Group R-1 occupancies
        and shall comply with Section 1013.5. The bottom of the sign shall be not less than 10 inches (254 mm) nor more than
        18 inches (455 mm) above the floor level. The sign shall be flush mounted to the door or wall. Where mounted on the
        wall, the edge of the sign shall be within 4 inches (102 mm) of the door frame on the latch side. Exception: Low-level
        exit signs are not required in Group R-1 occupancies when the building is equipped throughout with an automatic sprinkler
        system installed in accordance with Section 903.3.1.1 or 903.3.1.2.'
