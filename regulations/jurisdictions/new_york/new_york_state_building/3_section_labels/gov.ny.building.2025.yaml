    status: draft
  1008.3.1:
    label: flag
    topic: means_of_egress
    reason: 'The emergency power system powers the lighting for at least 90 minutes, from storage batteries, unit equipment
      or an on-site generator, installed per 2702: the electrical design isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 23
      - 25
      quote: 1008.3.1 Duration. The emergency power system shall provide power for a duration of not less than 90 minutes
        and shall consist of storage batteries, unit equipment or an on-site generator. The installation of the emergency
        power system shall be in accor- dance with Section 2702.
    piece_sha256: 10e6765fd73d38dfd72bdff3ac55d841e0649b13dfc532e8aa9b861f1348a3ae
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1008.3.2:
    label: flag
    topic: means_of_egress
    reason: 'Emergency lighting gives at first an average of at least 1 footcandle and at least 0.1 footcandle at any point
      along the path of egress at floor level, declining to no less than 0.6 average and 0.06 at any point by the end of its
      duration, with a maximum-to-minimum ratio no more than 40 to 1; in Group I-2 one lamp failing in a luminaire leaves
      at least 0.2 footcandle: lighting isn''t in the model, so a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 319
      lines:
      - 26
      - 31
      quote: 1008.3.2 Illumination level under emergency power. Emergency lighting facilities shall be arranged to provide
        initial illumina- tion that is not less than an average of 1 footcandle (11 lux) and a minimum at any point of 0.1
        footcandle (1 lux) measured along the path of egress at floor level. Illumination levels shall be permitted to decline
        to 0.6 footcandle (6 lux) average and a minimum at any point of 0.06 footcandle (0.6 lux) at the end of the emergency
        lighting time duration. A maximum-to-minimum illumination uniformity ratio of 40 to 1 shall not be exceeded. In Group
        I-2 occupancies, failure of a single lamp in a luminaire shall not reduce the illumination level to less than 0.2
        footcandle (2.2 lux).
    piece_sha256: 159183070fe454cf40633dde74eb807b4d69a17f3127db2185efaada2bb20f6b
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9b.
