      - 24
      quote: '1025.2.3 Handrails. Handrails and handrail extensions shall be marked with a solid and continuous stripe having
        a minimum width of 1 inch (25 mm). The stripe shall be placed on the top surface of the handrail for the entire length
        of the handrail, including extensions and newel post caps. Where handrails or handrail extensions bend or turn corners,
