  907.2.3:
    label: rule
    topic: means_of_egress
    reason: 'Group E has a manual fire alarm system initiating notification through an emergency voice/alarm communication
      system per 907.5.2.2: the voice/alarm system, a stated fact, is a rule per story by the occupancy''s occupant load for
      a building stated Group E alone (general.bc_907_2_3_group_e_voice_alarm); the manual fire alarm system and its exceptions,
      and the voice/alarm system in a building of two or more groups, are a person''s check (general.bc_907_2_3_group_e_manual_fire_alarm).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 285
      lines:
      - 36
      - 57
      quote: '[F] 907.2.3 Group E. A manual fire alarm system that initiates the occupant notification signal utilizing an
        emergency voice/alarm communication system meeting the requirements of Section 907.5.2.2 and installed in accordance
        with Section 907.6 shall be installed in Group E occupancies. Where automatic sprinkler systems or smoke detectors
        are installed, such systems or detectors shall be connected to the building fire alarm system. Exceptions: 1. A manual
        fire alarm system shall not be required in Group E occupancies with an occupant load of 50 or less. 2. Emergency voice/alarm
        communication systems meeting the requirements of Section 907.5.2.2 and installed in accordance with Section 907.6
        shall not be required in Group E occupancies with occupant loads of 100 or less, provided that activation of the manual
        fire alarm system initiates an approved occupant notification signal in accor- dance with Section 907.5. 3. Manual
        fire alarm boxes shall not be required in Group E occupancies where all of the following apply: 3.1. Interior corridors
        are protected by smoke detectors. 3.2. Auditoriums, cafeterias, gymnasiums and similar areas are protected by heat
        detectors or other approved detection devices. 3.3. Shops and laboratories involving dusts or vapors are protected
        by heat detectors or other approved detec- tion devices. 3.4. Manual activation is provided from a normally occupied
        location. 4. Manual fire alarm boxes shall not be required in Group E occupancies where all of the following apply:
        4.1. The building is equipped throughout with an approved automatic sprinkler system installed in accordance with
        Section 903.3.1.1. 4.2. The emergency voice/alarm communication system will activate on sprinkler waterflow. 4.3.
        Manual activation is provided from a normally occupied location.'
    piece_sha256: 94bfa6424f294d45984178c7377b8a5dbb3db928e57df6bb8dd1555e281251b1
