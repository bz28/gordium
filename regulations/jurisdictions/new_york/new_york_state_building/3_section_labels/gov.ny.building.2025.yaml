  202:explosive:
    label: reference
    topic: definitions
    reason: 'Defines EXPLOSIVE, a word the brought-in sections use: a definition, no requirement.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 43
      lines:
      - 22
      - 57
      quote: '[F] EXPLOSIVE. A chemical compound, mixture or device, the primary or common purpose of which is to function
        by explosion. The term includes, but is not limited to: dynamite, black powder, pellet powder, initiating explosives,
        detonators, safety fuses, squibs, detonating cord, igniter cord, and igniters. The term “explosive” includes any material
        determined to be within the scope of USC Title 18: Chapter 40 and also includes any material classified as an explosive
        other than consumer fireworks, 1.4G by the hazardous materi- als regulations of DOTn 49 CFR Parts 100-185. High explosive.
        Explosive material, such as dynamite, which can be caused to detonate by means of a No. 8 test blasting cap when unconfined.
        Low explosive. Explosive material that will burn or deflagrate when ignited. It is characterized by a rate of reaction
        that is less than the speed of sound. Examples of low explosives include, but are not limited to: black powder; safety
        fuse; igniters; igniter cord; fuse lighters; fireworks; and propellants, 1.3C. Mass-detonating explosives. Division
        1.1, 1.2 and 1.5 explosives alone or in combination, or loaded into various types of ammu- nition or containers, most
        of which can be expected to explode virtually instantaneously when a small portion is subjected to fire, severe concussion,
        impact, the impulse of an initiating agent or the effect of a considerable discharge of energy from without. Mate-
        rials that react in this manner represent a mass explosion hazard. Such an explosive will normally cause severe structural
        damage to adjacent objects. Explosive propagation could occur immediately to other items of ammunition and explosives
        stored suffi- ciently close to and not adequately protected from the initially exploding pile with a time interval
        short enough so that two or more quantities must be considered as one for quantity-distance purposes. UN/DOTn Class
        1 explosives. The former classification system used by DOTn included the terms “high” and “low” explosives as defined
        herein. The following terms further define explosives under the current system applied by DOTn for all explosive materials
        defined as hazard Class 1 materials. Compatibility group letters are used in concert with the division to specify
        further limitations on each division noted (i.e., the letter G identifies the material as a pyrotechnic substance
        or article containing a pyrotechnic substance and similar materials). Division 1.1. Explosives that have a mass explosion
        hazard. A mass explosion is one which affects almost the entire load instantaneously. Division 1.2. Explosives that
        have a projection hazard but not a mass explosion hazard. Division 1.3. Explosives that have a fire hazard and either
        a minor blast hazard or a minor projection hazard or both, but not a mass explosion hazard. Division 1.4. Explosives
        that pose a minor explosion hazard. The explosive effects are largely confined to the package and no projection of
        fragments of appreciable size or range is to be expected. An external fire must not cause virtually instantaneous
        explosion of almost the entire contents of the package. Division 1.5. Very insensitive explosives. This division is
        comprised of substances that have a mass explosion hazard, but that are so insensitive there is very little probability
        of initiation or of transition from burning to detonation under normal condi- tions of transport. Division 1.6. Extremely
        insensitive articles which do not have a mass explosion hazard. This division is comprised of articles that contain
        only extremely insensitive detonating substances and which demonstrate a negligible probability of accidental initiation
        or propagation.'
    piece_sha256: 670a717174493f91754a711d5e042bceff24c7d8544ab84d148d41182df873ab
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
