        complying with Section 709 or a horizontal exit complying with Section 1026. Each area of refuge shall be designed
        to minimize the intrusion of smoke. Exceptions: 1. Areas of refuge located within an enclosure for interior exit stairways
        complying with Section 1023. 2. Areas of refuge in outdoor facilities where exit access is essentially open to the
        outside.'
