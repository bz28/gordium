      quote: 1023.9 Stairway identification signs. A sign shall be provided at each floor landing in an interior exit stairway
        and ramp connecting more than three stories designating the floor level, the terminus of the top and bottom of the
        interior exit stairway and ramp and the identification of the stairway or ramp. The signage shall state the story
        of and direction to the exit discharge, and the availability of roof access from the interior exit stairway and ramp
        for the fire department. The bottom of the sign shall be located not less than 5 feet (1524 mm) above the floor landing
