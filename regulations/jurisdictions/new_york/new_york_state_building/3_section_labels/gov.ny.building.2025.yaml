      - 29
      quote: '1025.2.4 Perimeter demarcation lines. Stair landings and other floor areas within interior exit stairways, interior
        exit ramps and exit passageways, with the exception of the sides of steps, shall be provided with solid and continuous
        demarcation lines on the floor or on the walls or a combination of both. The stripes shall be 1 to 2 inches (25 mm
