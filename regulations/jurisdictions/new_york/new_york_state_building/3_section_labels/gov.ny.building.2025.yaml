  1017.3.1:
    label: reference
    topic: means_of_egress
    reason: 'Says travel on exit access stairways and ramps counts, measured along the stair''s nosings at its center: how
      to measure.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 342
      lines:
      - 26
      - 28
      quote: 1017.3.1 Exit access stairways and ramps. Travel distance on exit access stairways or ramps shall be included
        in the exit access travel distance measurement. The measurement along stairways shall be made on a plane parallel
        and tangent to the stair tread nosings in the center of the stair and landings. The measurement along ramps shall
        be made on the walking surface in the center
