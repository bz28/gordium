    topic: means_of_egress
    reason: 'Building exterior walls within 10 feet horizontally of a nonrated wall or unprotected opening of an interior
      exit stairway or ramp are rated at least 1 hour, their openings protected at least 3/4 hour, from the ground to a point 10 feet above the topmost landing or to the roof line, whichever is lower: walls'' ratings aren''t in the model, so a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 347
      lines:
