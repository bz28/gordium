      - 38
      quote: '[F] 905.4.1 Protection. Risers and laterals of Class I standpipe systems not located within an interior exit
        stairway shall be protected by a degree of fire resistance equal to that required for vertical enclosures in the building
        in which they are located. Exception: In buildings equipped throughout with an approved automatic sprinkler system,
        laterals that are not located within an interior exit stairway are not required to be enclosed within fire-resistance-rated
        construction.'
