    topic: means_of_egress
    reason: 'Electric locks released by the door''s hardware, with their conditions: electric locks aren''t in the model,
      a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 327
      lines:
      - 5
      - 15
      quote: '1010.2.10 Door hardware release of electrically locked egress doors. Door hardware release of electrical locking
        systems shall be permitted on doors in the means of egress in any occupancy except Group H where installed and operated
        in accordance with all of the following: 1. The door hardware that is affixed to the door leaf has an obvious method
        of operation that is readily operated under all lighting conditions. 2. The door hardware is capable of being operated
        with one hand and shall comply with Section 1010.2.1. 3. Operation of the door hardware directly interrupts the power
        to the electric lock and unlocks the door immediately. 4. Loss of power to the electrical locking system automatically
        unlocks the electric lock. 5. Where panic or fire exit hardware is required by Section 1010.2.8, operation of the
        panic or fire exit hardware also releases the electric lock. 6. The electromechanical or electromagnetic locking device
        shall be listed in accordance with either UL 294 or UL1034.'
