  714.4.2:
    label: flag
    topic: means_of_egress
    reason: 'A membrane penetration of a rated wall meets 714.4.1, and recessed fixtures don''t reduce the wall''s rating;
      except steel electrical boxes in walls rated at most 2 hours, each at most 16 square inches, at most 100 square inches
      of openings in any 100 square feet of wall, an annular space at most 1/8 inch, boxes on opposite sides at least 24 inches
      apart where the stud cavities don''t communicate (or the wall cavity''s depth where filled with cellulose loose-fill,
      rockwool or slag wool, or solid fireblocking per 718.2.1, or both boxes with listed putty pads, or other listed materials
      and methods); listed electrical boxes of any material tested for use in fire-resistance-rated assemblies, installed
      per their listing (1/8 inch unless listed otherwise; their listed separation, solid fireblocking per 718.2.1, both boxes
      with listed putty pads, or other listed materials and methods); electrical boxes listed as part of a wall opening protective
      material system for use in fire-resistance-rated assemblies, installed per their listing; other boxes and their annular
      space protected by an approved membrane penetration firestop system installed as tested per ASTM E814 or UL 1479 at
      a positive pressure differential of at least 0.01 inch of water, with F and T ratings at least the wall''s, installed
      per their listing; the space around a sprinkler covered by a metal escutcheon plate; and larger or more steel boxes
      in walls rated at most 2 hours with listed putty pads or other listed materials and methods, installed per the listing:
      a person''s check (general.bc_714_4_2_membrane_penetrations).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 180
      lines:
      - 36
      - 59
      quote: '714.4.2 Membrane penetrations. Membrane penetrations shall comply with Section 714.4.1. Where walls or partitions
        are required to have a fire-resistance rating, recessed fixtures shall be installed such that the required fire resistance
        will not be reduced. Exceptions: 1. Membrane penetrations of maximum 2-hour fire-resistance-rated walls and partitions
        by steel electrical boxes that do not exceed 16 square inches (0.0 103 m[fn2]) in area, provided that the aggregate
        area of the openings through the membrane does not exceed 100 square inches (0.0645 m[fn2]) in any 100 square feet
        (9.29 m[fn2]) of wall area. The annular space between the wall membrane and the box shall not exceed 1/8 inch (3.2
        mm). Such boxes on opposite sides of the wall or partition shall be separated by one of the following: 1.1. By a horizontal
        distance of not less than 24 inches (610 mm) where the wall or partition is constructed with individual noncommunicating
        stud cavities. 1.2. By a horizontal distance of not less than the depth of the wall cavity where the wall cavity is
        filled with cellu- lose loose-fill, rockwool or slag mineral wool insulation. 1.3. By solid fireblocking in accordance
        with Section 718.2.1. 1.4. By protecting both outlet boxes with listed putty pads. 1.5. By other listed materials
        and methods. 2. Membrane penetrations by listed electrical boxes of any material, provided that such boxes have been
        tested for use in fire-resistance-rated assemblies and are installed in accordance with the instructions included
        in the listing. The annular space between the wall membrane and the box shall not exceed 1/8 inch (3.2 mm) unless
        listed otherwise. Such boxes on opposite sides of the wall or partition shall be separated by one of the following:
        2.1. By the horizontal distance specified in the listing of the electrical boxes. 2.2. By solid fireblocking in accordance
        with Section 718.2.1. 2.3. By protecting both boxes with listed putty pads. 2.4. By other listed materials and methods.'
    - file: gov.ny.building.2025.pdf
      page: 181
      lines:
      - 3
      - 17
      quote: 3. Membrane penetrations by electrical boxes of any size or type, that have been listed as part of a wall opening
        protec- tive material system for use in fire-resistance-rated assemblies and are installed in accordance with the
        instructions included in the listing. 4. Membrane penetrations by boxes other than electrical boxes, provided that
        such penetrating items and the annular space between the wall membrane and the box, are protected by an approved membrane
        penetration firestop system installed as tested in accordance with ASTM E814 or UL 1479, with a minimum positive pressure
        differential of 0.01 inch of water (2.49 Pa), and shall have an F and T rating of not less than the required fire-resistance
        rating of the wall penetrated and be installed in accordance with their listing. 5. The annular space created by the
        penetration of an automatic sprinkler, provided that it is covered by a metal escutcheon plate. 6. Membrane penetrations
        of maximum 2-hour fire-resistance-rated walls and partitions by steel electrical boxes that exceed 16 square inches
        (0.0 103 m[fn2]) in area, or steel electrical boxes of any size having an aggregate area through the membrane exceeding
        100 square inches (0.0645 m[fn2]) in any 100 square feet (9.29 m[fn2]) of wall area, provided that such penetrating
        items are protected by listed putty pads or other listed materials and methods, and installed in accor- dance with
        the listing.
    piece_sha256: 956467298e11d536027a051f5129d905fcebf9a852a3967204de02f6caeffb66
