      - 10
      quote: 'shall have a fire-resistance rating of not less than 2 hours where connecting four stories or more and not less
        than 1 hour where connecting less than four stories. The number of stories connected by the interior exit stairways
        or ramps shall include any base- ments, but not any mezzanines. Enclosures for interior exit stairways and ramps shall
        have a fire-resistance rating not less than the floor assembly penetrated, but need not exceed 2 hours. Exceptions:
        1. Interior exit stairways and ramps in Group I-3 occupancies in accordance with the provisions of Section 408.3.8.
