  907.5.2.2:
    label: flag
    topic: means_of_egress
    reason: 'An emergency voice/alarm communication system is designed and installed per NFPA 72: a detector, waterflow device
      or manual box sounds an alert tone and voice instructions for general or staged evacuation per the plans Section 404
      of the Fire Code of New York State requires; in high-rise buildings on at least the alarming floor and those above and
      below; speakers throughout by paging zones, at least for elevator groups, interior exit stairways, each floor and areas
      of refuge as Chapter 2 defines them (in Groups I-1 and I-2 the alarm in a constantly attended area and a general notification
      over the overhead page): a person''s check (general.bc_907_5_2_2_voice_alarm_design).'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 293
      lines:
      - 34
      - 46
      quote: '[F] 907.5.2.2 Emergency voice/alarm communication systems. Emergency voice/alarm communication systems required
        by this code shall be designed and installed in accordance with NFPA 72. The operation of any automatic fire detector,
        sprinkler waterflow device or manual fire alarm box shall automatically sound an alert tone followed by voice instructions
        giving approved information and directions for a general or staged evacuation in accordance with the building’s fire
        safety and evacu- ation plans required by Section 404 of the Fire Code of New York State. In high-rise buildings,
        the system shall operate on at least the alarming floor, the floor above and the floor below. Speakers shall be provided
        throughout the building by paging zones. At a minimum, paging zones shall be provided as follows: 1. Elevator groups.
        2. Interior exit stairways. 3. Each floor. 4. Areas of refuge as defined in Chapter 2. Exception: In Group I-1 and
        I-2 occupancies, the alarm shall sound in a constantly attended area and a general occupant notification shall be
        broadcast over the overhead page.'
    piece_sha256: 0a73eb9445ed729b48dd5bf282d4200d7a3311bf5238bc6bc9ac7bdc1c90e0b9
    notes: Drafted by hand in a Claude Code session (2026-11-27); no recorded labeling run. Chapter 9 part d.
