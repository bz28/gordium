      - 28
      quote: '703.5 Marking and identification. Where there is an accessible concealed floor, floor-ceiling or attic space,
        fire walls, fire barriers, fire partitions, smoke barriers and smoke partitions or any other wall required to have
        protected openings or penetrations shall be effectively and permanently identified with signs or stenciling in the
