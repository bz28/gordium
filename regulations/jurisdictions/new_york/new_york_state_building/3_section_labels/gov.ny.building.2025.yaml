    piece_sha256: 75aced510c2e424f3f67977f1499be380b8b57234223bdc95eeef4e2d1b407bd
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 9f.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1030.7':
    label: reference
    topic: means_of_egress
    reason: 'How exit access travel is measured where aisles serve seating: along the aisles and aisle accessways, never over
      or on the seats; exceptions for smoke-protected and open-air seating allow more. Every travel row needs review while
      fixed seating is stated or not ruled out (assembly_fixed_seating), since the routes don''t see the seats.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 354
      lines:
      - 50
      - 52
      quote: '1030.7 Travel distance. The exit access travel distance shall comply with Section 1017. Where aisles are provided
        for seating, the distance shall be measured along the aisles and aisle accessways without travel over or on the seats.
        Exceptions:'
    piece_sha256: 0dedbb8deaa95cfacfefff8ad82fb14eb63468c3e6c595eb4bc7e45d398a2fc6
    notes: 'Drafted by hand in a Claude Code session (2026-11-23); no recorded labeling run. Brought in by review round 2
      of section group 1 (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): fixed seating''s travel in any
      group.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1030.8':
    label: flag
    topic: means_of_egress
    reason: 'An assembly space with fixed seating: a common path of at most 30 feet from any seat (75 feet for fewer than
      50 occupants, 50 feet for smoke-protected or open-air seating): the seats aren''t drawn, so a person''s check (general.bc_1030_8_fixed_seating_common_path),
      and Table 1006.2.1''s A, E, M row needs review over it where fixed seating is stated or not ruled out.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 355
      lines:
      - 13
      - 15
      quote: 1030.8 Common path of egress travel. The common path of egress travel for a room or space used for assembly purposes
        having fixed seating shall not exceed 30 feet (9144 mm) from any seat to a point where an occupant has a choice of
        two paths of egress travel to two exits.
    piece_sha256: bec0c4f98d601924da08413740e93ced18dce4119f71313694aec4c5213d0fb5
    notes: 'Drafted by hand in a Claude Code session (2026-11-23); no recorded labeling run. Brought in by review round 1
      of section group 1 (docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md): a section that tightens a drafted
      table''s limit for some condition.'
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.1':
    label: reference
    topic: means_of_egress
    reason: 'Says emergency escape and rescue openings comply with Section 1031: no requirement of its own, the sections after
      it are checked.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 359
      lines:
      - 56
      - 56
      quote: 1031.1 General. Emergency escape and rescue openings shall comply with the requirements of this section.
    piece_sha256: b7ab9d597bd16f9fe680d4369c73a505933438fa68644d87c0440a74c741b151
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.2':
    label: rule
    topic: means_of_egress
    reason: 'Where emergency escape and rescue openings are required (Group R-2 in stories with one exit, Groups R-3 and R-4:
      basements and sleeping rooms below the fourth story) and where they open: checkable per sleeping room from its marked
      openings, its story and its doors; basements and what lies outside each opening are person''s checks.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 359
      lines:
      - 57
      - 58
      quote: '1031.2 Where required. In addition to the means of egress required by this chapter, emergency escape and rescue
        openings shall be provided in the following occupancies:'
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 3
      - 23
      quote: '1. Group R-2 occupancies located in stories with only one exit or access to only one exit as permitted by Tables
        1006.3.4(1) and 1006.3.4(2). 2. Group R-3 and R-4 occupancies. Basements and sleeping rooms below the fourth story
        above grade plane shall have not fewer than one emergency escape and rescue opening in accordance with this section.
        Where basements contain one or more sleeping rooms, an emergency escape and rescue opening shall be required in each
        sleeping room, but shall not be required in adjoining areas of the basement. Such openings shall open directly into
        a public way or to a yard or court that opens to a public way, or to an egress balcony that leads to a public way.
        Exceptions: 1. Basements with a ceiling height of less than 80 inches (2032 mm) shall not be required to have emergency
        escape and rescue openings. 2. Emergency escape and rescue openings are not required from basements or sleeping rooms
        that have an exit door or exit access door that opens directly into a public way or to a yard, court or exterior egress
        balcony that leads to a public way. 3. Basements without habitable spaces and having not more than 200 square feet
        (18.6 m[fn2]) in floor area shall not be required to have emergency escape and rescue openings. 4. Storm shelters
        are not required to comply with this section where the shelter is constructed in accordance with ICC 500. 5. Within
        individual dwelling and sleeping units in Groups R-2 and R-3, where the building is equipped throughout with an automatic
        sprinkler system installed in accordance with Section 903.3.1.1, 903.3.1.2 or 903.3.1.3, sleeping rooms in base- ments
        shall not be required to have emergency escape and rescue openings provided that the basement has one of the following:
        5.1. One means of egress and one emergency escape and rescue opening. 5.2. Two means of egress.'
    piece_sha256: 7574a7ac92ac8eb1c6ef2505b330d00f1b3db10e35bd345db643e05e9958d370
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.2.1:
    label: flag
    topic: means_of_egress
    reason: 'Escape openings operate from inside without keys or tools: how each opening works isn''t in the model, a person''s
      check where the building may be Group R-2, R-3 or R-4.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 24
      - 26
      quote: 1031.2.1 Operational constraints and opening control devices. Emergency escape and rescue openings shall be operational
        from inside the room without the use of keys or tools. Window-opening control devices complying with ASTM F2090 shall
        be permitted for use on windows serving as a required emergency escape and rescue opening.
    piece_sha256: 3f297335b1b526856741d17864bf872258b3b7bedebd495328118712b7a59f57
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8a.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.3':
    label: reference
    topic: means_of_egress
    reason: 'Says escape openings comply with 1031.3.1 to 1031.3.3: no requirement of its own, the three after it are checked.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 27
      - 28
      quote: 1031.3 Emergency escape and rescue openings. Emergency escape and rescue openings shall comply with Sections
        1031.3.1 through 1031.3.3.
    piece_sha256: 19cccd6ae869c96b9f243b14d673b629fda1304ec1b5e4589b0d50a7a10d0c73
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.3.1:
    label: rule
    topic: means_of_egress
    reason: 'Net clear opening at least 5.7 sq ft, 5 sq ft for a grade-floor opening: checkable per marked escape opening
      from its measured clear opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 29
      - 30
      quote: '1031.3.1 Minimum size. Emergency escape and rescue openings shall have a minimum net clear opening of 5.7 square
        feet (0.53 m[fn2]). Exception: The minimum net clear opening for grade-floor emergency escape and rescue openings
        shall be 5 square feet (0.46 m[fn2]).'
    piece_sha256: 8c7eac647e184bb5f78aeda046c51edee783701abd97ab6de7318f280224285b
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.3.2:
    label: rule
    topic: means_of_egress
    reason: 'Net clear opening at least 24 inches high and 20 inches wide, in normal operation: checkable per marked escape
      opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 31
      - 33
      quote: 1031.3.2 Minimum dimensions. The minimum net clear opening height dimension shall be 24 inches (610 mm). The
        minimum net clear opening width dimension shall be 20 inches (508 mm). The net clear opening dimensions shall be the
        result of normal operation of the opening.
    piece_sha256: f1c03b52b2642242239751dc00c464e7cd4486947761b821e1b446cfc758c04c
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.3.3:
    label: rule
    topic: means_of_egress
    reason: 'Bottom of the clear opening at most 44 inches above the floor: checkable per marked escape opening, where 1031.2
      requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 34
      - 35
      quote: 1031.3.3 Maximum height from floor. Emergency escape and rescue openings shall have the bottom of the clear opening
        not greater than 44 inches (1118 mm) measured from the floor.
    piece_sha256: a85334706b102ce51f29186ecf644df9a8137a950f6f879948631c729ee7419d
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.4':
    label: rule
    topic: means_of_egress
    reason: 'A door provided as the escape opening is a swinging or sliding door: checkable per marked escape door, where
      1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 36
      - 37
      quote: 1031.4 Emergency escape and rescue doors. Where a door is provided as the required emergency escape and rescue
        opening, it shall be a swinging door or a sliding door.
    piece_sha256: 74255b8b7b2ef9bbef62dbba81d5557c6f29d79d2192576dc61f4ef67219d7b8
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8b.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.5':
    label: rule
    topic: means_of_egress
    reason: 'An escape opening whose bottom is below the adjacent grade has an area well: checkable per marked escape opening,
      where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 38
      - 39
      quote: 1031.5 Area wells. An emergency escape and rescue opening with the bottom of the clear opening below the adjacent
        grade shall be provided with an area well in accordance with Sections 1031.5.1 through 1031.5.3.
    piece_sha256: 68748088058c90b3accbb330e431cda36054cb6054b7be9b1d9856cc9a965550
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.5.1:
    label: rule
    topic: means_of_egress
    reason: 'The area well at least 9 sq ft, 36 inches out and 36 inches wide (a ladder or steps may encroach 6 inches), letting
      the opening open fully: checkable per marked escape opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 40
      - 44
      quote: '1031.5.1 Minimum size. The minimum horizontal area of the area well shall be 9 square feet (0.84 m[fn2]), with
        a horizontal projec- tion and width of not less than 36 inches (914 mm). The area well shall allow the emergency escape
        and rescue opening to be fully opened. Exception: The ladder or steps required by Section 1031.5.2 shall be permitted
        to encroach not more than 6 inches (152 mm) into the required dimensions of the area well.'
    piece_sha256: a8c7a82674546498f0f065317f84bdd8e6d6d5d596b46dfab5da5062969a4e62
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.5.2:
    label: rule
    topic: means_of_egress
    reason: 'An area well deeper than 44 inches has a fixed ladder or steps the open window doesn''t block: checkable per
      marked escape opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 45
      - 48
      quote: 1031.5.2 Ladders or steps. Area wells with a vertical depth of more than 44 inches (1118 mm) shall be equipped
        with an approved permanently affixed ladder or steps. The ladder or steps shall not be obstructed by the emergency
        escape and rescue opening when the window or door is in the open position. Ladders or steps required by this section
        shall not be required to comply with Section 1011.
    piece_sha256: 2783068ab9f5b71babf39b33b2554f3b8ab54fd19f28e0742bd1881913985477
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.5.2.1:
    label: rule
    topic: means_of_egress
    reason: 'The area well''s ladder: 12 inches wide inside, 3 inches out from the wall, rungs 18 inches apart, full height:
      checkable per marked escape opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 49
      - 51
      quote: 1031.5.2.1 Ladders. Ladders or rungs shall have an inside width of at least 12 inches (305 mm), shall project
        at least 3 inches (76 mm) from the wall and shall be spaced not more than 18 inches (457 mm) on center (o.c.) vertically
        for the full height of the area well.
    piece_sha256: 5c2283bc20ecf846a0b7bb167535f4587016186cdb02a73b328c1fec0ee40deb
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.5.2.2:
    label: rule
    topic: means_of_egress
    reason: 'The area well''s steps: 12 inches wide inside, treads over 5 inches, risers 18 inches at most, full height: checkable
      per marked escape opening, where 1031.2 requires it.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 52
      - 53
      quote: 1031.5.2.2 Steps. Steps shall have an inside width of not less than 12 inches (305 mm), shall have treads greater
        than 5 inches (127 mm) in depth and a riser height not greater than 18 inches (457 mm) for the full height of the
        area well.
    piece_sha256: 1ba3c3d33fb8a46fa60f28ae4680d30de721224ff507ca80a4dbe4bca98e6268
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  1031.5.3:
    label: flag
    topic: means_of_egress
    reason: 'Area wells drain to the foundation drainage system, except on well-drained soils: drainage isn''t in the model,
      a person''s check where the building may be Group R-2, R-3 or R-4.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 54
      - 57
      quote: '1031.5.3 Drainage. Area wells shall be designed for proper drainage by connecting to the building’s foundation
        drainage system required by Section 1805. Exception: A drainage system for area wells is not required where the foundation
        is on well-drained soil or sand-gravel mixture soils in accordance with the United Soil Classification System, Group
        I Soils, in accordance with Section 1803.5.1.'
    piece_sha256: b79b4103c28cbf74af44915f220eceab4bb9893d13982ebc7d48cf6ba621b139
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '1031.6':
    label: flag
    topic: means_of_egress
    reason: 'Bars, grilles, covers and screens over escape openings keep their size and release from inside: such devices
      aren''t in the model, a person''s check where the building may be Group R-2, R-3 or R-4.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 360
      lines:
      - 58
      - 59
      quote: 1031.6 Bars, grilles, covers and screens. Where bars, grilles, covers, screens or similar devices are placed
        over emergency escape and rescue openings or area wells that serve such openings, the minimum net clear opening size
        shall comply with Sections 1031.3
    - file: gov.ny.building.2025.pdf
      page: 361
      lines:
      - 3
      - 4
      quote: and 1031.5. Such devices shall be releasable or removable from the inside without the use of a key, tool or force
        greater than that which is required for normal operation of the emergency escape and rescue opening.
    piece_sha256: d884e0779fcbde1eab23289444130900a02cce7316a1f75819573f99cfc30b1e
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 8c.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
