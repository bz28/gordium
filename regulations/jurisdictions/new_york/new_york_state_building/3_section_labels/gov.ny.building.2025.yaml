  '1023.3':
    label: flag
    topic: means_of_egress
    reason: 'An interior exit stairway or ramp ends at an exit discharge or a public way, or continues there through a protected
      enclosure of exit stairways, exit ramps and exit passageways built per 1023.2, 1023.3.1 and 1024: where a stairway ends
      isn''t in the model, so a person''s check.'
