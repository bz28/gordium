    status: draft
  1010.2.14:
    label: flag
    topic: means_of_egress
    reason: 'Electrically locked exit access doors from elevator lobbies, with their conditions: electric locks aren''t in
      the model, a person''s check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 328
      lines:
      - 44
      - 60
      quote: '1010.2.14 Elevator lobby exit access doors. Electrically locked exit access doors providing egress from elevator
        lobbies shall meet the following conditions: 1. For all occupants of the floor, the path of exit access travel to
        not less than two exits is not required to pass through the elevator lobby. 2. The building is equipped throughout
        with an automatic sprinkler system in accordance with Section 903.3.1.1, and a fire alarm system in accordance with
        Section 907. Elevator lobbies shall be provided with an automatic smoke detection system in accordance with Section
        907. 3. Upon activation of the building fire alarm system by means other than a manual fire alarm box shall automatically
        unlock the electric locks providing exit access from the elevator lobbies, and the electric locks shall remain unlocked
        until the fire alarm system is reset. 4. The electric locks shall unlock on loss of power to the electric locks or
        electrical locking system. 5. The electric locks shall have the capability of being unlocked by a switch located at
        the fire command center, security station or other approved location. 6. A two-way communication system complying
        with Sections 1009.8.1 and 1009.8.2, shall be located in the elevator lobby adjacent to the electrically locked exit
        access door and connected to an approved constantly attended station. This constantly attended station shall have
        the capability of unlocking the electric locks of the elevator lobby exit access doors.'
    - file: gov.ny.building.2025.pdf
      page: 329
      lines:
      - 3
      - 4
      quote: 7. Emergency lighting shall be provided in the elevator lobby on both sides of the electrically locked door.
        8. The electromechanical or electromagnetic locking device shall be listed in accordance with either UL 294 or UL
        1034.
