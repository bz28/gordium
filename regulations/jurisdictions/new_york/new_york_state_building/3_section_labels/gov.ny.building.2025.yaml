        for batteries or energy storage systems, or modular data centers shall be equipped with panic hardware or fire exit
        hardware. Rooms containing electrical equipment rated 800 amperes or more that contain overcurrent devices, switching
        devices or control devices and where the exit or exit access door is less than 25 feet (7620 mm) from the equipment
        working space as required by NFPA 70, such doors shall not be provided with a latch or lock other than panic hardware
        or fire exit hardware. The doors shall swing in the direction of egress travel.
