  1010.2.11:
    label: flag
    topic: means_of_egress
    reason: 'Electric locks released by a sensor, with their conditions: electric locks aren''t in the model, a person''s
      check.'
    sources:
    - file: gov.ny.building.2025.pdf
      page: 327
      lines:
      - 16
      - 33
      quote: '1010.2.11 Sensor release of electrically locked egress doors. Sensor release of electrical locking systems shall
        be permitted on doors located in the means of egress in any occupancy except Group H where installed and operated
        in accordance with all of the following criteria: 1. The sensor shall be installed on the egress side, arranged to
        detect an occupant approaching the doors, and shall cause the electrical locking system to unlock the electric lock.
        2. Upon a signal from a sensor or loss of power to the sensor, the electrical locking system shall unlock the electric
        lock. 3. Loss of power to the electric lock or the electrical locking system shall automatically unlock the electric
        locks. 4. The doors shall be arranged to unlock the electric lock from a manual unlocking device located 40 inches
        to 48 inches (1016 mm to 1219 mm) vertically above the floor and within 5 feet (1524 mm) of the secured doors. Ready
        access shall be provided to the manual unlocking device and the device shall be clearly identified by a sign that
        reads “PUSH TO EXIT.” When operated, the manual unlocking device shall result in direct interruption of power to the
        electric lock—indepen- dent of other electronics—and the electric lock shall remain unlocked for not less than 30
        seconds. 5. Activation of the building fire alarm system, where provided, shall automatically unlock the electric
        lock, and the electric lock shall remain unlocked until the fire alarm system has been reset. 6. Activation of the
        building automatic sprinkler system or fire detection system, where provided, shall automatically unlock the electric
        lock. The electric lock shall remain unlocked until the fire alarm system has been reset. 7. Emergency lighting shall
        be provided on the egress side of the door. 8. The electromechanical or electromagnetic locking device shall be listed
        in accordance with either UL 294 or UL 1034.'
    piece_sha256: 79f1a78a61387424519d300a951fd0a36594b7026ec813d7d2de7c24d613a9bb
    notes: Drafted by hand in a Claude Code session (2026-11-26); no recorded labeling run. Section group 6e.
