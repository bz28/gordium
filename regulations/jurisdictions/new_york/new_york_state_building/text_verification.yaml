  'on': 2026-11-21
  how: 'Each brought-in page was rendered from the PDF at 170 dpi with a red box around every brought-in piece,
    labeled by its id (48 pages, 159 boxes, p.317''s Table 1006.3.4(1) on 2026-11-23 as step_4, 14 pages, 24 boxes
    as step_5, 3 pages, 3 boxes as step_7, 14 pages, 29 boxes as step_6 (section group 3), 8 pages, 9 boxes as
    step_8 (section group 4a), 4 pages, 6 boxes as step_9 (section group 4b), 3 pages, 6 boxes as step_10 (section group 4c), 2 pages, 5 boxes as step_11 (section group 5a), 1 page, 3 boxes as step_12 (section group 5b), 3 pages, 6 boxes as step_13 (section group 5c), 7 pages, 10 boxes as step_14 (section group 6a), 6 pages, 11 boxes as step_15 (section group 6b), 5 pages, 13 boxes as step_16 (section group 6c), and 12 pages, 23 boxes as step_17 (section group 6d, Table 1010.2.4 also cell by cell, and its three raised note letters by position on p.325), and 2 pages, 2 boxes as step_18, and 10 pages, 22 boxes as step_19 (section group 6e), and 4 pages, 6 boxes as step_20 (section group 8a), and 2 pages, 6 boxes as step_21 (section group 8b), and 2 pages, 8 boxes as step_22 (section group 8c), and 7 pages, 39 boxes as step_g9a (section group 9a), and 11 pages, 31 boxes as step_g9b (section group 9b), and 8 pages, 35 boxes as step_g9c (section group 9c), and 4 pages, 11 boxes as step_g9d (section group 9d), and 1 page, 1 box as step_g9d2 (1018''s heading), and 10 pages, 42 boxes as step_g9e (section group 9e), and 4 pages, 30 boxes as step_g9f (section group 9f), and 9 pages, 32 boxes as step_g9g (section group 9g), and 7 pages, 33 boxes as step_g9h (section group 9h, Table 1030.6.2 also cell by cell, its last row''s label wrapped around its values read by position on p.354), and 9 pages, 48 boxes as step_g9i (section group 9i, Table 1030.13.2.1 also cell by cell, its two-line heading placed by position on p.357), and 12 pages, 30 boxes as step_ch04a (Chapter 4 part a), 16 pages, 39 boxes as step_ch04b (Chapter 4 part b), 13 pages, 44 boxes as step_ch04c and 2 pages, 2 boxes as step_ch04c2 (Chapter 4 part c), 6 pages, 29 boxes as step_ch04d (Chapter 4 part d), 5 pages, 25 boxes as step_ch04e (Chapter 4 part e), 24 pages, 47 boxes as step_ch04f (Chapter 4 part f), 18 pages, 53 boxes as step_ch07a (Chapter 7 part a), 13 pages, 44 boxes as step_ch07b (Chapter 7 part b), 7 pages, 40 boxes as step_ch07c (Chapter 7 part c), 14 pages, 39 boxes as step_ch07d and 6 pages, 13 boxes as step_ch07d2 (Chapter 7 part d), 16 pages, 29 boxes as step_ch09a (Chapter 9 part a), 16 pages, 47 boxes as step_ch09b (Chapter 9 part b), 28 pages, 70 boxes as step_ch09c (Chapter 9 part c), 16 pages, 55 boxes as step_ch09d (Chapter 9 part d), 19 pages, 50 boxes as step_ch09e (Chapter 9 part e), and 12 pages, 20 boxes as step_g7c (section group 7c); p.47''s two and pp.42,
    55, 316-317''s seven on 2026-11-22); helpers that never saw the extracted text transcribed every line of every
    box from the images alone (tables row by row, raised characters written as sealed marks); the transcript went
    through document_extraction/numbers.py: 1183 pieces, 3770 numbers, every piece agrees but Table 716.1(2), whose extracted text loses its stacked fractions, and HIGHLY TOXIC, whose extracted text reads the subscript 50 of LD50 and LC50 as a number (each flag says the second reading is right). The tables were also read
    a third way, by position: each cell''s characters with their sizes and x positions (pdfplumber, pp.315-317 and
    p.341), which shows each raised note letter (5.04-point beside 8.4-point digits) the plain text runs into its
    cell; sources.yaml brought_in.misread puts each right by line, and both readings agree with the cells so read.
    A third helper that saw only each piece''s transcribed text and its numbers'' values (and, for a table, the
    sentence that uses it) marked each number''s comparison from the whole sentence (second_reading_comparisons);
    where it differs from the recorded words, a flag says which is right. The transcript, the page images and the
    comparison files are kept in the code cache (second_reading/step_1_*), outside the repo, since they hold the
    book''s words.'
