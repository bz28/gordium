# A second, independent reading of every number in the brought-in pieces of the 2025 Building Code of New York State,
# from the page images (rule_format/state_law.py says what is checked), as for the house code (sibling folder
# new_york_state/) and Maine's NFPA 101.
# Status of every piece: verified against the Public.Resource.Org copy only; check against a copy bought from ICC.
document: gov.ny.building.2025.pdf
copy_checked: 'The Public.Resource.Org copy on the Internet Archive (sha256 in 1_source_documents/sources.yaml):
  ICC''s own PDF edition, real text in its fonts (no OCR). Verified against this copy only; check against a copy
  bought from ICC.'
second_reading:
  by: claude_code/claude-opus-5-5 (two helper agents that never saw the extracted text, one for pp.32-53 and one
    for pp.54-344, a third and a fourth for the pieces brought in on 2026-11-22 (p.47's FLOOR AREA, GROSS and NET;
    1006.3.3, 1006.3.4 and their tables), a fifth for Table 1006.3.4(1) on 2026-11-23, a sixth for the 23 pieces
    brought in by review round 1 on 2026-11-23 (1006.2.2, 1018.4, 1030.8, 407.4.2 and the 13 definitions their italics
    name), a seventh for 1030.7 and SMOKE-PROTECTED ASSEMBLY SEATING (review round 2, 2026-11-23), an eighth for
    the 27 pieces of section group 3 (1004, Table 1004.5 and 12 definitions), a ninth for the 9 pieces of section
    group 4's corridor width (1005.3.2, 1020.1, 1020.3, Table 1020.3 and 5 definitions, 2026-11-25), a tenth for the 6
    pieces of its corridor rating (1020.2, 1020.2.1, Table 1020.2 and 3 definitions, 2026-11-25), an eleventh for the 5
    pieces of the rest of Section 1020 (1020.4, 1020.6, 1020.6.1, 1020.7 and 1 definition, 2026-11-25), a twelfth for
    the 4 pieces of section group 5a (1005.1, 1005.2, 1005.3, 1005.3.1, 2026-11-25), a thirteenth for the 3 of section
    group 5b (1005.4, 1005.5, 1005.6), a fourteenth for the 6 of section group 5c (1005.7 to 1005.7.3 and 2
    definitions), a fifteenth for the 9 of section group 6a (1010.1, 1010.1.1, 1010.1.1.1 and 6 definitions,
    2026-11-25), a sixteenth for the 11 of section group 6b (1010.1.2, 1010.1.2.1 and 9 definitions), and a helper for the comparison words)
  'on': 2026-11-21
  how: 'Each brought-in page was rendered from the PDF at 170 dpi with a red box around every brought-in piece,
    labeled by its id (48 pages, 159 boxes, p.317''s Table 1006.3.4(1) on 2026-11-23 as step_4, 14 pages, 24 boxes
    as step_5, 3 pages, 3 boxes as step_7, 14 pages, 29 boxes as step_6 (section group 3), 8 pages, 9 boxes as
    step_8 (section group 4a), 4 pages, 6 boxes as step_9 (section group 4b), 3 pages, 6 boxes as step_10 (section group 4c), 2 pages, 5 boxes as step_11 (section group 5a), 1 page, 3 boxes as step_12 (section group 5b), 3 pages, 6 boxes as step_13 (section group 5c), 7 pages, 10 boxes as step_14 (section group 6a), and 6 pages, 11 boxes as step_15 (section group 6b); p.47''s two and pp.42,
    55, 316-317''s seven on 2026-11-22); helpers that never saw the extracted text transcribed every line of every
    box from the images alone (tables row by row, raised characters written as sealed marks); the transcript went
    through document_extraction/numbers.py: 263 pieces, 668 numbers, every piece agrees. The tables were also read
    a third way, by position: each cell''s characters with their sizes and x positions (pdfplumber, pp.315-317 and
    p.341), which shows each raised note letter (5.04-point beside 8.4-point digits) the plain text runs into its
    cell; sources.yaml brought_in.misread puts each right by line, and both readings agree with the cells so read.
    A third helper that saw only each piece''s transcribed text and its numbers'' values (and, for a table, the
    sentence that uses it) marked each number''s comparison from the whole sentence (second_reading_comparisons);
    where it differs from the recorded words, a flag says which is right. The transcript, the page images and the
    comparison files are kept in the code cache (second_reading/step_1_*), outside the repo, since they hold the
    book''s words.'
