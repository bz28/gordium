# A second, independent reading of every number in the brought-in pieces of the 2025 Building Code of New York State,
# from the page images (rule_format/state_law.py says what is checked), as for the house code (sibling folder
# new_york_state/) and Maine's NFPA 101.
# Status of every piece: verified against the Public.Resource.Org copy only; check against a copy bought from ICC.
document: gov.ny.building.2025.pdf
copy_checked: 'The Public.Resource.Org copy on the Internet Archive (sha256 in 1_source_documents/sources.yaml):
  ICC''s own PDF edition, real text in its fonts (no OCR). Verified against this copy only; check against a copy
  bought from ICC.'
second_reading:
  by: claude_code/claude-opus-5-5 (two helper agents that never saw the extracted text, one for pp.32-53 and one
    for pp.54-344, a third and a fourth for the pieces brought in on 2026-11-22 (p.47's FLOOR AREA, GROSS and NET;
    1006.3.3, 1006.3.4 and their tables), and a helper for the comparison words)
  'on': 2026-11-21
  how: 'Each brought-in page was rendered from the PDF at 170 dpi with a red box around every brought-in piece,
    labeled by its id (48 pages, 159 boxes; p.47''s two and pp.42, 55, 316-317''s seven on 2026-11-22); helpers
    that never saw the extracted text transcribed every line of every box from the images alone (tables row by row,
    raised characters written as sealed marks); the transcript went through document_extraction/numbers.py: 157
    pieces, 332 numbers, every piece agrees. The tables were also read a third way, by position: each cell''s characters
    with their sizes and x positions (pdfplumber, pp.315-317 and p.341), which shows each raised note letter (5.04-point
    beside 8.4-point digits) the plain text runs into its cell; sources.yaml brought_in.misread puts each right
    by line, and both readings agree with the cells so read. A third helper that saw only each piece''s transcribed
    text and its numbers'' values (and, for a table, the sentence that uses it) marked each number''s comparison
    from the whole sentence (second_reading_comparisons); where it differs from the recorded words, a flag says
    which is right. The transcript, the page images and the comparison files are kept in the code cache (second_reading/step_1_*),
    outside the repo, since they hold the book''s words.'
