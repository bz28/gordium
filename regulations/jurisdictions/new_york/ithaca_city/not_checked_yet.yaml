# What Gordium does not check yet for this city, listed on every result (the Rhino panel's "Not checked" and
# "Not covered by this rulebook" groups, and the report), so a list of items that comply never reads as a full
# zoning review. Plain data: each entry names the code section and says why in plain words.
not_in_this_release:
  - id: overlays
    name: Overlays (historic, gorge, flood)
    why: Overlay districts change which rules apply; the start box's lookup shows the ones it finds (used live, not kept), but this release doesn't check their rules (check them by hand).
not_covered:
  - id: height_exceptions
    section: "§325-16A, §325-16B"
    name: Height exceptions (chimneys, spires, parapets)
  - id: small_projections
    section: "§325-18B"
    name: Windowsills, belt courses and cornices in yards (a massing model shows eaves only)
  - id: corner_visibility
    section: "§325-17B"
    name: Corner lots, the clear triangle at the street corner
  - id: accessory_below_grade
    section: "§325-25B, §325-25D"
    name: Accessory structures below grade or across a common lot line
  - id: adus
    section: "§325-28"
    name: Accessory dwelling units
  - id: garage_cars
    section: "§325-8A(3), chart p.2 notes 6 and 7"
    name: Private garage size (R-1 and R-2a, R-2b, 3 cars; R-2c, 6 cars per building)
  - id: front_yard_parking
    section: "§325-20E"
    name: Parking in front yards (25% of the front yard, driveway width, cars square to the street)
  - id: parking_areas
    section: "§325-20D(2), §325-20F"
    name: Driveways and parking areas for 3 or more cars (width, share of the side and rear yards)
