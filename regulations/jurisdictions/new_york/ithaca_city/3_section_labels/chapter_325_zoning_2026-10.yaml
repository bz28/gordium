    label: rule
    topic: definitions
    reason: "Revised from reference by review: requires a separate entrance; labeled rule until the architects decide whether it is a category or a limit (see the open question). (The AI's original reason is in the run record.)"
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 9
      lines:
      - 10
      - 12
      quote: DWELLING UNIT — One or more rooms designed or used for living quarters by one household, including
        provisions for living, cooking, sanitary and sleeping facilities, and having a separate entrance from the
        outside of the building or through a common hall.
    piece_sha256: 8cf80d140f90fa782857721b581766631209fbb720da9dfbbb0e04753eacd7ff
    drafted_by: section_labeling/claude-haiku-5-5
    revised:
    - from: reference
      by: Claude (review of all labels, 2026-10-19)
      date: 2026-10-19
      why: "the separate-entrance wording reads as a requirement; same label as rooming unit until the architects decide"
    findings:
    - id: dwelling_unit_is_a_category
      question: Category or limit? Is 'having a separate entrance from the outside of the building or through a common
        hall' only what makes rooms a dwelling unit (reference), or a requirement every dwelling unit must meet (rule)?
        Labeled rule until answered, the same as rooming unit.
      kind: reading
      answer: 'A category: the definition says what the word means, and the requirements live in the chart and Article
        V, so a design that misses it is a different use, which the use rules then judge. A design that claims a dwelling
        unit must have it, so the label rule gives the same result; it stays.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines:
        - 10
        - 12
        quote: DWELLING UNIT — One or more rooms designed or used for living quarters by one household, including provisions
          for living, cooking, sanitary and sleeping facilities, and having a separate entrance from the outside of
          the building or through a common hall.
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §6
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
