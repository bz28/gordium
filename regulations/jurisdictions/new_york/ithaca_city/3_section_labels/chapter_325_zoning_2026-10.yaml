document: chapter_325_zoning_2026-10.pdf
labels:
  front_matter:
    label: not_for_checking
    topic: administration
    reason: This piece is the table of contents and history for the chapter, with no requirement a design must meet.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 2
      lines:
      - 57
      - 58
      quote: '[HISTORY: Adopted by the Common Council of the City of Ithaca as Ch. 30 of the 1975 Municipal Code.
        Amendments noted where applicable.]'
    piece_sha256: 7fa156c478f023b8422d09837bb96ab0d7e4311e7dcd00a4216c96f7b20de9ff
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-1:
    label: not_for_checking
    topic: administration
    reason: The piece only gives the title by which the zoning chapter may be cited; it sets no requirement a design
      must meet.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 3
      lines:
      - 6
      - 6
      quote: This chapter shall be known and may be cited as the "City of Ithaca, New York, Zoning Ordinance."
    piece_sha256: e5346f247c182288968ee3291ce6b71c49182d89edded2bbaa4cde00893abd6e
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-2:
    label: not_for_checking
    topic: administration
    reason: This piece only states statutory authority and general purpose for the chapter; it sets no measurable
      or judgment-based requirement on a design, lot or use.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 3
      lines:
      - 8
      - 9
      quote: This chapter is enacted pursuant to the authority and provisions of the General City Law to promote
        public health, safety and welfare and the most desirable use of land
    piece_sha256: 7b96e20a32601a82021200d14b362580ba6b1cdabf0476a3a50406fe847f5415
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3:
    label: not_for_checking
    topic: administration
    reason: This piece is only the section heading with amendment history; it sets no requirement and only introduces
      the definitions section, which is handled by the individual definition pieces.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 3
      lines:
      - 15
      - 15
      quote: Definitions and word usage.
    piece_sha256: e2677304ecc9a9a992d13b01227f2431ed33dec660ffaea25bfd8f08ce809547
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3A:
    label: reference
    topic: definitions
    reason: This piece only explains how to read words used throughout the code (tense, singular/plural, meaning
      of 'lot', 'shall', 'used'); it sets no requirement a design must meet itself.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 3
      lines:
      - 36
      - 36
      quote: The words "shall" and "must" are always mandatory.
    piece_sha256: 437e671c4fd4b69ecac8e5cff749307f1438e617eb5626973bc1ea5cebe47497
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:
    label: reference
    topic: definitions
    reason: This piece introduces the chapter's definitions of specific terms and says they apply across related
      codes; it sets no design requirement itself, so it only tells the reader how to interpret defined words used
      by rules.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 3
      lines:
      - 39
      - 40
      quote: For the purpose of this chapter, certain terms or words herein, unless the context or subject matter
        otherwise requires, shall be interpreted or defined as follows.
    piece_sha256: 77dba82f48e3770ccb45f88d8b969f313e07e1b157e381cf8afb64c253ac6731
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:accessory_building_or_structure:
    label: reference
    topic: definitions
    reason: This piece defines the term 'accessory building or structure' for use by other rules; it sets no requirement
      itself.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 4
      lines:
      - 5
      - 6
      quote: ACCESSORY BUILDING OR STRUCTURE — A structure, the use of which is incidental to that of the main building
        and which is located on the same premises.
    piece_sha256: 71caca8a12c9a968184e0b0f5ab626ee4514a3b5ce7faf5dcc86fb8c49586f11
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:accessory_dwelling_unit:
    label: rule
    topic: definitions
    reason: 'This is a definition, but it also imposes requirements on an ADU: it must have a separate entrance
      and must provide living, cooking, sanitary, and sleeping facilities, and all ADUs must adhere to residential
      building code. Per the guide, a definition that imposes a requirement is labeled rule.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 4
      lines:
      - 8
      - 10
      quote: An ADU must have a separate entrance from the outside of the building or through a common hall and
        must provide living, cooking, sanitary, and sleeping facilities.
    piece_sha256: 78a4fdb8be4293b811fb8777796d25ed0c38882d28f3fd451fd45eac88f0d408
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:accessory_dwelling_unit_attached:
    label: reference
    topic: definitions
    reason: This piece defines the term 'accessory dwelling unit, attached' for use by other rules; it sets no requirement
      itself.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 4
      lines:
      - 12
      - 14
      quote: ACCESSORY DWELLING UNIT, ATTACHED — An accessory dwelling unit (ADU) that is connected to or contained
        within the primary structure, such as a basement, building addition, or attached garage.
    piece_sha256: 2f8affdf12011a1c9134ef452eefe00ab4173210368da8ad581a2d8871557a31
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:accessory_dwelling_unit_detached:
    label: reference
    topic: definitions
    reason: This piece defines the term 'accessory dwelling unit, detached' and sets no requirement itself, so it
      is a definition that rules depend on.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 4
      lines:
      - 15
      - 17
      quote: ACCESSORY DWELLING UNIT, DETACHED — An accessory dwelling unit (ADU) located within an existing or
        newly constructed accessory structure such as a detached garage, carriage house, or other freestanding building.
    piece_sha256: ae6a5884d17a6b5c1ac3af6fdbdf227746f41bb0bc982b97962c881359a9b184
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:basement:
    label: reference
    topic: definitions
    reason: This is a definition of the word BASEMENT that sets no requirement a design must meet; it only says
      what the term means for use in other rules.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines:
      - 10
      - 11
      quote: BASEMENT — That space of a building that is partly below grade which has more than half of its height,
        measured from floor to ceiling, above the finished ground level at any point.
    piece_sha256: 4af157a7bfd314753bd60f9b89d919a1803b44b4e383a39edf722500911de6e0
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:building_area:
    label: rule
    topic: dimensions
    reason: 'The definition also imposes requirements: building area is used to determine required yards and lot
      coverage, and pergolas, terraces and patios above grade may not be located in a required yard. The yard restriction
      is a measurable limit, so this is a rule as well as a definition.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines:
      - 28
      - 29
      quote: However, neither pergolas or terraces and patios above grade shall be located in a required yard.
    piece_sha256: 85eafd32adc69078a5af74ea12c33a6a5c129b8750e8c7d8288aa442412c607b
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:grade_plane:
    label: reference
    topic: definitions
    reason: This is a definition of GRADE PLANE that explains how to measure a reference plane used by height rules;
      it sets no requirement a design must meet by itself, although its 'shall be taken' wording is measurement
      instruction.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines:
      - 32
      - 33
      quote: GRADE PLANE — A reference plane representing the average of finished ground level on each side of the
        building at exterior walls.
    piece_sha256: aa41eb5a9903b7d22cf3f759462207ec34925602c8e8053d87d2d46b9e283710
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:height_of_building:
    label: rule
    topic: dimensions
    reason: This is a definition of height, so it is also a reference, but it contains a 'shall' instruction on
      how building height must be measured where roofs vary in height, which sets a checkable requirement on the
      design.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines:
      - 22
      - 24
      quote: Where a building contains sections of a roof of varying heights, the height of that building shall
        be measured using that section of the roof that has the highest elevation from grade plane.
    piece_sha256: 67119c80ea747b43dc46d5ac2e680dda5bd790aeadca406319b13da0fa31a2c6
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:home_occupation:
    label: rule
    topic: uses
    reason: The definition also imposes measurable requirements on a home occupation, such as the two-person limit,
      the 25% and 500 square foot caps, and the vehicle count limits, so it is a rule as well as a definition.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 13
      lines:
      - 18
      - 19
      quote: (f) The occupation occupies no more than 25% of the dwelling unit and no more than a total of 500 indoor
        square feet, including accessory structures.
    piece_sha256: c339a0eaea51722cede97d86ac92b6ac8856449c31524d975b978e19e799cf71
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:story:
    label: rule
    topic: dimensions
    reason: This is a definition of STORY, but it also says when a basement shall be deemed a story, based on measurable
      heights above grade, so it affects story limits. The 'shall be deemed' clause is a requirement, so it is labeled
      rule rather than reference.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines:
      - 15
      - 17
      quote: A basement shall be deemed to be a story when the finished surface of the floor next above is 1) more
        than six feet above grade plane or 2) more than 12 feet above the finished ground level at any point.
    piece_sha256: b17302fcfb1a0c98f4389f0e64f9450f7b45c951bc9c50784eb4b05b98d6bb4f
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-3B:yard:
    label: reference
    topic: definitions
    reason: This is a definition of the word YARD that sets no measurable requirement itself; it only describes
      what part of a lot counts as yard, which rules depend on.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines:
      - 28
      - 30
      quote: YARD — That part of a lot not occupied by the principal building or structure and which shall not be
        occupied by any other building or structure from the ground upward unless specifically authorized in this
        chapter or other provisions of the City of Ithaca Code.
    piece_sha256: 0ef7ad0e3534e3d9fa54dec428edd78690c509d042d7a5143e64d1c5d29ce081
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-8A:
    label: rule
    topic: dimensions
    reason: "Revised from reference by review: The column explanations impose requirements ('shall have frontage ... equal to or greater than', 'shall be not less than'); the figures are in the chart. (The AI's original reason is in the run record.)"
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines:
      - 35
      - 36
      quote: Buildings hereafter erected shall be limited to the number of stories herein specified, computed at
        the main entrance side.
    piece_sha256: 3c738a4d0e4328a89ff5eee93721a596c115c3aaa35724921fc58176fce2e9cb
    drafted_by: section_labeling/claude-haiku-5-5
    revised:
    - from: reference
      by: Claude (review of all labels, 2026-10-19)
      date: 2026-10-19
      why: "the column explanations impose requirements ('shall have frontage ... equal to or greater than', 'shall be not less than'); the figures are in the chart"
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-8B:
    label: rule
    topic: dimensions
    reason: Item (1) sets a measurable minimum lot area that applies separately to each additional primary use in
      a separate building, so a design can be checked against it. The other items are mostly cross-references, procedures
      or judgment-based standards, but the rule in item (1) is strongest.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 26
      lines:
      - 12
      - 14
      quote: each square-footage requirement applies separately to the initial permitted primary use and to each
        additional permitted primary use located in a separate building on the property in question
    piece_sha256: 7fdc5e9855654cccd698775ef937ca124eabe427bdbe798ac528916335793b53
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-9B:
    label: rule
    topic: uses
    reason: The piece lists uses that require a special permit in specific districts and sets conditions such as
      the home occupation criteria and antenna limits that a design or use must meet, which code can check from
      facts about the use and structure.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 30
      lines:
      - 37
      - 38
      quote: 'Home occupations in all residential districts, unless the home occupation meets all of the following
        criteria:'
    piece_sha256: 7665750b1482f4dcab3f2874155165e223679eaadae448dd926f42a8c100a4cd
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-9C:
    label: not_for_checking
    topic: procedures
    reason: The piece covers application submission, public notice, hearings, decision timing and communication
      of decisions, which are all process requirements rather than design measurements.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 32
      lines:
      - 7
      - 7
      quote: C. Special permit procedures.
    piece_sha256: c4da1016c56a80cc9d6c54f2c986253add0a28ea3803738b89de2d07f98ebf40
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-9D:
    label: flag
    topic: procedures
    reason: The piece sets permit review criteria whose core tests, such as being in harmony with neighborhood character
      and not significantly negative impact, require board judgment rather than measurement.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 33
      lines:
      - 11
      - 14
      quote: The location and size of the use, the size of the site in relation to it, and the location of the site
        with respect to the existing or future streets giving access to it shall be such that the use will be in
        harmony with the existing or intended character of the neighborhood
    piece_sha256: cdcf3aa1a45281e83214eb7122a2626cb38cf4ca47e7de8f4953a99e6afb68b2
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-9E:
    label: not_for_checking
    topic: procedures
    reason: This piece sets application fees for special permits, which is a procedural matter and not a requirement
      a building design, lot, or use must meet.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 33
      lines:
      - 38
      - 39
      quote: The application fee shall be based on the type of use for which the special permit is sought in accordance
        with the following schedule.
    piece_sha256: 6097e8b720c0fcb4da5a44a01a2dff0e15b14152c5349597e6c132b114d5b05f
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-16A:
    label: rule
    topic: dimensions
    reason: 'Sub-paragraph (2) sets measurable limits: rooftop features may cover no more than 20% of ground floor
      area or 30% of the roof plane, and separate structures must meet coverage, lot size and yard dimensions. Paragraph
      (1) exempts features from height limits, which code can check against measurements.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 46
      lines:
      - 33
      - 35
      quote: In no case shall the horizontal surface area covered or occupied by such feature exceed 20% of the
        total ground floor area of the building or 30% of the area of the roof plane on which it is located, whichever
        is less.
    piece_sha256: 8680e94a780b223a810053c3695ad2c8d314821a35343535b379a3fabed24a8b
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-16B:
    label: rule
    topic: dimensions
    reason: 'The piece sets a measurable limit: ornamental parapets or cornices may extend above the building height
      limit by no more than five feet. Code can check that number against the design.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 47
      lines:
      - 4
      - 5
      quote: a parapet wall or cornice for ornament extending above such height five feet or less.
    piece_sha256: b41ce9f324e87948d6ebbc398124c4d13f7be8d32986de54edaac12e013b52f3
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-16C:
    label: rule
    topic: dimensions
    reason: 'The piece sets measurable limits on building height and yards: an exception allowing extra height only
      if yards increase one foot per foot of added height, stories are not exceeded, and added feet stay within
      10% of the district maximum.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 47
      lines:
      - 6
      - 7
      quote: 'In any district, any main building may be erected to a height in excess of that specified for the
        district, provided that:'
    piece_sha256: 13048cb18799bbded20ea4da9261d58a0bd5c497bebe4a66b57e2d9b49067f69
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-18A:
    label: rule
    topic: dimensions
    reason: The piece states a requirement that porches, decks, balconies and ramps must be counted as part of the
      building for required yards and lot coverage, which code can check against measured yards and coverage.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines:
      - 9
      - 11
      quote: All porches, attached or freestanding decks, balconies projecting more than two feet from a building
        or structure, ramps, and/or landings shall be considered a part of the building in both the determination
        of required yards and lot coverage.
    piece_sha256: 98db86f7deabb8982dda1beec743abfa55a99c50b66d369baa4fedb193d32bcf
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-18B:
    label: rule
    topic: dimensions
    reason: 'The piece sets a measurable limit: architectural features may not project more than two feet into any
      required yard, and the yard must otherwise stay open and unobstructed.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines:
      - 15
      - 16
      quote: such features shall not project more than two feet into any required yard
    piece_sha256: fc864d43960738e995bffd3e3fc4cb3e5e786607d2e1e44a05b5437d62177c18
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-19C:
    label: rule
    topic: dimensions
    reason: The piece requires that yards facing public streets on corner lots in residential districts conform
      to the minimum front yard requirements, which code can check against yard measurements. The quote states that
      requirement directly.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 50
      lines:
      - 7
      - 8
      quote: buildings must be erected so that yards facing public streets shall conform to the minimum front yard
        requirements of said residential district
    piece_sha256: e6a3063eb0b981913477ff6068c7edf3a51d404878a4902afe07b63787a3a783
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-25A:
    label: rule
    topic: site_features
    reason: 'The piece sets a placement requirement for accessory structures: they are permitted in side or rear
      yards but not in a required front yard. This is measurable from the site plan, so code can check it.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 66
      lines:
      - 37
      - 39
      quote: Accessory structures which are wholly or partially above finished grade are permitted in any side or
        rear yard but not in a required front yard, except as permitted under the further provisions of this section.
    piece_sha256: eed0c562f00dda9532fa84ceffe63a3e724833fb78075218bfcff6200454fba1
    drafted_by: section_labeling/claude-haiku-5-5
    status: draft
    run: 3_section_labels/runs/2026-10-19_claude-haiku-5-5.jsonl
  325-25D:
    label: rule
    topic: site_features
    reason: The piece says a detached garage or carport may be erected across a common lot line by mutual agreement,
      which sets a condition a design must meet about placement across lots. Deciding compliance is a measurable
      lot-line condition, so it is a rule.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 67
      lines:
      - 10
      - 12
      quote: Erection of a detached garage or carport for the accommodation of private passenger vehicles across
