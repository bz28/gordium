# R-2a (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# Occupancy (§325-3B one-family and two-family dwellings) and home occupations: the rules at the end (2026-10-27).
# the same way R-1b.yaml, R-1a.yaml and R-3a.yaml were. An ANSWER KEY for grading the drafting script: written
# without looking at anything the script drafted or recorded, from the City's documents only (2_extracted_text/, the
# chart read cell by cell, the section labels, the definitions), with R-1a.yaml and R-3a.yaml as the model of the
# format.
#
# Why R-2a: the first two-family district (the chart's third column, right after R-1B). It keeps R-1's yards
# (25 ft front, 10 ft + 10 ft sides, rear 25% of the lot depth) but allows semi-detached and two-family houses, and
# its numbers sit between R-1b's and R-2b's, so a drafter that reads the column next door fails here.
#
# Every chart number was read two ways and agrees: the chart's text line (quoted), and the chart reader's R-2A cell
# (cited); R-2A is the third value in each row. Lot coverage and the front yard are confirmed a third way by
# §325-11B(3)(d) and (e) (cluster subdivisions: "R-2a 30" percent; "a front yard of at least 25 feet in the R-1a,
# R-1b, and R-2a Zones"). test_r1b_matches_chart.py checks the rules against the R-2A cells.
#
# Where R-2a differs from R-1b (chart p.3, column R-2A): uses (p.2: semi-detached and two-family dwellings are
# permitted; nursery schools, adult day care homes and neighborhood commercial facilities need a special permit);
# lot size 5,000 sf for a one-family detached, semi-detached or two-family dwelling and 6,000 sf for other uses;
# lot width 45 ft for those three and 50 ft for other uses; lot coverage 30%; accessory buildings 3 ft from side
# and rear lot lines (R-2a is not an R-1 District). The same as R-1b: 3 stories, 35 ft (bonus to 38.5 ft), the
# yards (25 ft front, 10 ft + 10 ft sides, rear 25% of the lot depth up to 50 ft but not less than 20 ft), parking
# (p.14).
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2: the private garage
# "for not more than three cars", note 6), accessory dwelling units (§325-28), the South Hill Overlay (p.2 note 2, §325-8E), height exceptions for chimneys and similar (§325-16A, applied
# when measuring height), cluster subdivisions (§325-11), loading
# for nonresidential uses ("Allowed by variance", p.14).

district: R-2a
rules:

  - id: R-2a.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: >-
      use in ["one_family_detached", "one_family_semi_detached", "two_family", "church", "public_park_or_playground",
      "library_or_fire_station"]
    review_when:
      - when: >-
          use in ["cemetery", "public_utility_structure", "school", "nursery_school_or_child_day_care",
          "adult_day_care_home", "neighborhood_commercial_facility"]
        reason: >-
          Marked SP for R-2A on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities,
          schools, nursery schools and child day-care centers in R-2, neighborhood commercial facilities in R-2, and
          group or adult day-care facilities in R-2 as requiring a special permit from the Planning and Development
          Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked • for R-2A
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-2A}
      # marked SP for R-2A
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: R-2A}
      # marked - for R-2A (not permitted): the rows of the uses an R-2 drafter is most likely to let in
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [10, 10]
        quote: "One-family dwelling, detached, zero lot line [fn4] - - - - SP SP SP SP -"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [12, 12]
        quote: "One-family dwelling, attached [fn4] - - - - SP • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [14, 14]
        quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [28, 28]
        quote: "(e) Nursery schools or child day-care centers in R-2, CR-2 and R-U Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [29, 30]
        quote: "(f) Neighborhood retail or service commercial facilities in R-2, R-3, CR-2, CR-3, and CR-4 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers", 3: "district names (R-3, CR-3), not numbers", 4: "a district name (CR-4), not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: "(n) Group or adult day-care facilities in R-2 and CR-2 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: one_family_semi_detached}
        expect: pass
        note: marked • for R-2A (- in R-1)
      - given: {use: two_family}
        expect: pass
        note: marked • for R-2A (- in R-1)
      - given: {use: one_family_attached}
        expect: fail
        note: marked - for R-2A (SP in R-2C, • in R-3)
      - given: {use: one_family_detached_zero_lot_line}
        expect: fail
        note: marked - for R-2A (SP in R-2C)
      - given: {use: multiple_family}
        expect: fail
      - given: {use: dormitory}
        expect: fail
      - given: {use: nursing_home}
        expect: fail
      - given: {use: nursery_school_or_child_day_care}
        expect: needs_review
        note: SP in R-2 (- in R-1, • in R-3)
      - given: {use: adult_day_care_home}
        expect: needs_review
      - given: {use: neighborhood_commercial_facility}
        expect: needs_review
      - given: {use: school}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: adult_day_care_same_use
      question: The chart's use is "Adult day care home"; §325-9B(1)(n) says "Group or adult day-care facilities in R-2".
        Are these the same use?
      kind: reading
      answer: 'The same use: §325-9B(1)(n) is the only special-permit item for adult day care, it names R-2, and the
        chart marks the use SP in exactly R-2A, R-2B and R-2C. Either way it needs a special permit, so the result is
        NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: Group or adult day-care facilities in R-2 and CR-2 Districts
      strength: strong
      confirm_with: the architects
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      R-2A is the third mark in each row of page 2 (R-1A, R-1B, R-2A, ...). Its marks, row by row against the chart
      reader's R-2A cells: • detached, semi-detached and two-family dwellings, church, park, library or fire station;
      SP cemetery, public utility, school, nursery school, adult day care home, neighborhood commercial facility;
      - for the rest (zero-lot-line and attached one-family dwellings, multiple dwellings, fraternity houses,
      dormitories, nursing homes, hospitals, bed-and-breakfast inns). R-2A's marks are the same as R-2B's in every
      primary-use row. What the marks mean is Gordium's reading (the chart_marks finding).
    drafted_by: claude
    status: draft

  - id: R-2a.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 6674}
        expect: pass
      - given: {use: one_family_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_detached, lot_area: 4999}
        expect: fail
      - given: {use: two_family, lot_area: 4000}
        expect: not_applicable
    notes: >-
      The third value of the row is R-2A's (5,000 sf, after R-1A's 10,000 and R-1B's 6,000). Chart note 3 points to
      §325-8B(1): the minimum applies to each main building on the lot.
    drafted_by: claude
    status: draft

  - id: R-2a.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: one_family_semi_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_semi_detached, lot_area: 4999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 4000}
        expect: not_applicable
    notes: >-
      A semi-detached dwelling is one building holding two one-family dwellings that share a party wall (§325-3B).
      R-2A's first value in the row (R-1A and R-1B are "-"). In R-2a the building stands whole on one lot: the side
      yards (10 ft each) leave no 0 ft side for a party wall on a lot line (only R-2C's note 15 allows that).
    drafted_by: claude
    status: draft

  - id: R-2a.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Minimum lot size, two-family dwelling (chart p.3)"
    applies_when: use == "two_family"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 6674}
        expect: pass
      - given: {use: two_family, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 4999}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-2a.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: use not in ["one_family_detached", "one_family_semi_detached", "two_family"]
    check: lot_area >= 6000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
    examples:
      - given: {use: church, lot_area: 7500}
        expect: pass
      - given: {use: church, lot_area: 6000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 5999}
        expect: fail
      - given: {use: school, lot_area: 5000}
        expect: fail
        note: enough for a house in R-2a, not for another use
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Other uses in R-2a: church, park, library or fire station, cemetery, public utility, school, nursery school,
      adult day care home, neighborhood commercial facility. The uses marked "-" on p.2 fail R-2a.use whatever their
      lot; their lot is checked here too, as R-1b does.
    drafted_by: claude
    status: draft

  - id: R-2a.lot_area_each_primary_building
    kind: rule
    topic: dimensions
    title: "Each further primary building needs its own lot area (§325-8B(1))"
    applies_when: primary_buildings >= 2
    check: lot_area >= primary_buildings * (5000 if use in ["one_family_detached", "one_family_semi_detached", "two_family"] else 6000)
    review_when:
      - when: not primary_buildings_same_use
        reason: >-
          Not every primary building on the lot is stated to hold the lot's use: each building needs its own
          use's lot area, added together (§325-8B(1)); check by hand.
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [11, 16]
        quote: "(1) For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts, each square-footage requirement applies separately to the initial permitted primary use and to each additional permitted primary use located in a separate building on the property in question (e.g., in R-2b Districts, an area of 3,000 square feet is required for a one family house or a two-family house, and an additional area of 3,000 square feet is required for each additional one-family house or two-family house on the property)."
        not_limits: {1: "(1): the paragraph's number", 3000: "R-2b's figure, the code's own example"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [9, 9]
        quote: "One-family dwelling, detached [fn4] • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [11, 11]
        quote: "One-family dwelling, semi-detached [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [13, 13]
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
    examples:
      - given: {use: one_family_detached, primary_buildings: 1, lot_area: 5000}
        expect: not_applicable
        note: "one primary building: the use's own lot-area rule covers it"
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 10000}
        expect: pass
        note: "two primary buildings need 2 x 5,000 sf"
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 9999}
        expect: fail
        note: "enough for one building, not two"
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 15000}
        expect: pass
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 14999}
        expect: fail
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: false, lot_area: 500000}
        expect: needs_review
        note: "another building holds another use: its own figure, added by hand"
      - given: {use: one_family_detached, primary_buildings: 2, lot_area: 500000}
        expect: needs_review
        note: "whether every building holds this use not said"
      - given: {use: one_family_detached, lot_area: 500000}
        expect: needs_review
        note: "the primary buildings not counted"
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 10000}
        expect: pass
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 9999}
        expect: fail
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 10000}
        expect: pass
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 9999}
        expect: fail
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 12000}
        expect: pass
        note: "Other use"
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 11999}
        expect: fail
    notes: >-
      §325-8B(1): every residential district's lot-size figure applies again to each further primary use in a separate
      building on the lot (the code's own example: in R-2b, 3,000 sf for a house and 3,000 sf more for each further
      house). With one primary building this rule doesn't apply: the use's own lot-area rule (R-2a.lot_area_*) checks
      it. With two or more, the lot needs the figure once per building, when every building holds the lot's use
      (primary_buildings_same_use); otherwise each building's own figure, added by hand. Gordium counts the primary
      buildings from the drawing where it can (one building, or none standing apart that could hold a home); a
      building standing apart that could (a large garage, a second house) is read both ways until the architect states
      the count. An accessory building (a garage, a shed, an accessory dwelling unit, §325-3B) isn't a primary
      building.
    drafted_by: claude
    status: draft

  - id: R-2a.lot_width_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot width, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_width >= 45
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Minimum Lot Width, row: "One-family dwelling, detached", column: R-2A}
      - file: zoning_charts_2026-04.pdf
