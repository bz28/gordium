  - id: R-2a.occupancy_one_family
    kind: rule
    topic: density_and_occupancy
    title: "One-family occupancy (§325-3B: family + 2 unrelated)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
    check: unrelated_persons <= 2
    review_when:
      - when: unrelated_persons > 2 and functional_family_unit
        reason: "A functional family unit may occupy a one-family dwelling whatever its size (§325-3B DWELLING, ONE-FAMILY); whether this household is one is the City's finding, on the criteria §325-3B FUNCTIONAL FAMILY UNIT lists, so a person checks it."
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [36, 37]
        quote: "DWELLING, ONE-FAMILY — A dwelling unit occupied exclusively for residential purposes by an individual or family and not more than one unrelated individual or a functional family unit."
        not_limits: {1: "the first sentence's limit, which this district raises (its own sentence below)"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [39, 40]
        quote: "In the R-2 and R-3 Zones, occupancy by an individual or a family and not more than two unrelated individuals is permitted."
        not_limits: {3: "the district name R-3, not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "FAMILY — One or more persons occupying a dwelling unit, all of whom are related by blood, marriage or adoption."
        not_limits: {1: "one or more persons make a family: who counts, not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [11, 13]
        quote: "FUNCTIONAL FAMILY UNIT — A group of individuals living together in a single dwelling unit and functioning as a family with respect to those characteristics that are consistent with the purposes of zoning restrictions in residential neighborhoods."
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "(6) [fn3]In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be"
        not_limits: {1: "the district name R-1, not a number", 2: "the district name R-2, not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [3, 3]
        quote: "excluded in determining the number of unrelated occupants in a dwelling unit."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [41, 41]
        quote: "NOTES: (1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be excluded in determining the number of unrelated occupants."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [45, 45]
        quote: "(4) See §325-3 for occupancy restrictions."
    examples:
      - given: {use: one_family_detached, unrelated_persons: 2}
        expect: pass
      - given: {use: one_family_detached, unrelated_persons: 3, functional_family_unit: false}
        expect: fail
      - given: {use: one_family_detached, unrelated_persons: 3, functional_family_unit: true}
        expect: needs_review
        note: "a functional family unit: the City's finding"
      - given: {use: one_family_detached, unrelated_persons: 3}
        expect: needs_review
        note: "whether it is a functional family unit isn't said"
      - given: {use: one_family_detached}
        expect: needs_review
        note: "who lives there isn't said"
      - given: {use: church}
        expect: not_applicable
    findings:
    - id: who_is_unrelated
      question: "Who is an \"unrelated individual\" in a one-family or two-family dwelling?"
      kind: law
      answer: "Anyone in the dwelling unit not related by blood, marriage or adoption to the household's family (§325-3B FAMILY); in a household with no family, everyone but the individual the definition starts from (\"an individual or family and not more than ... unrelated\"). Gordium asks the most such people in any dwelling unit."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "all of whom are related by blood, marriage or adoption"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §1
    - id: children_left_out_in_r1_r2
      question: "Are minor dependent children counted among the unrelated people?"
      kind: law
      answer: "Not in R-1 and R-2: §325-8B(6) and the chart's own note (p.2) leave out minor dependent children in the care of a parent or relative when counting unrelated occupants."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "In R-1 and R-2 Districts, minor dependent children"
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [3, 3]
        quote: "excluded in determining the number of unrelated occupants in a dwelling unit"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §2.1
    - id: functional_family_unit_is_the_citys_finding
      question: "Can Gordium decide whether a household is a functional family unit?"
      kind: law
      answer: "No: §325-3B lists criteria that must be present (sharing the whole unit, stability shown by children, shared expenses, the same address for voting and taxes...) and presumptions against, weighed case by case. Over the limit with a household said to be such a unit, the rule needs review; said not to be, it does not comply."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [15, 15]
        quote: "the following criteria must be present"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §5
    notes: "Counts unrelated_persons: the most such people in any one dwelling unit (each semi-detached or attached dwelling is a one-family dwelling of its own). The limits are the definition's own (§325-3B); a person's say that the household is a functional family unit sends it to review. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

