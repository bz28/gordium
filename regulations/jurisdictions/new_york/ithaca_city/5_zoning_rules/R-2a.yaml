        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-2A}
    examples:
      - given: {front_yard_eaves: 30, side_yard_smaller_eaves: 10, side_yard_larger_eaves: 12, rear_yard_eaves: 48, lot_depth: 120, building_height: 30}
        expect: pass
        note: eaves clear of every required yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: pass
        note: eaves exactly 2 ft into the front (25 − 2), both sides (10 − 2) and the rear (25% of 120 = 30, − 2) yards
      - given: {front_yard_eaves: 22.99, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
        note: an eave just over 2 ft into the 25 ft front yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 7.99, side_yard_larger_eaves: 12, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
        note: an eave just over 2 ft into the narrower 10 ft side yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 7.99, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 27.99, lot_depth: 120, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 26, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 31, lot_depth: 120, building_height: 38}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {front_yard_eaves: 25.99, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 31, lot_depth: 120, building_height: 38}
        expect: fail
        note: the 28 ft front yard the bonus requires, less 2 ft, is 26
    notes: >-
      The yards themselves (R-2a.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out (the yards_to_nearest_part finding, §325-3 YARD, §325-18A); this rule measures the same
      yards to the outermost part, eaves included, and lets that be up to 2 ft less. A massing model shows eaves,
      not windowsills, belt courses or cornices: those are for the architect to check. On a corner lot every yard
      facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: R-2a.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 25
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 6: "six feet applies in R-1 districts only; in R-2a it is three feet (accessory_side_yard >= 3)"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [6, 6]
        quote: "R-1 R-2 R-3 [fn1]"
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines (6 ft would be needed in R-1)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 24.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 25, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (25 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-2a is not an R-1 District (the chart groups R-2A, R-2B and R-2C under "R-2", p.2, p.3, p.14), so §325-25C's
      first sentence applies: frame accessory buildings 3 ft from any side or rear lot line (the "six feet" is R-1's
      only). Whether the distances apply to an accessory building that isn't frame is §325-25C's open question
      (325-25C#1, in the section labels): accessory_distances_apply is measured under every reading, and outside R-1
      its readings differ for a building not stated as frame, so that gives NEEDS REVIEW until the architect says the
      building is frame (accessory_frame). Below-grade accessory structures (§325-25B) and garages on a common lot line
      by agreement (§325-25D) aren't checked; §325-25 sets no height limit.
    drafted_by: claude
    status: draft

  - id: R-2a.parking_one_family
    kind: rule
    topic: parking_and_loading
    title: "Minimum off-street parking, one-family detached (chart p.14)"
    applies_when: use == "one_family_detached"
    check: parking_spaces >= (1 if sleeping_rooms <= 3 else 2 + 1 * max(sleeping_rooms - 5, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-2A}
    findings:
    - id: adu_needs_no_parking
      question: 'The requirement is per dwelling unit. R-2a allows an accessory dwelling unit (chart p.2): does a house
        with an ADU need parking for both units? (Not checked yet; ADUs aren''t measured.)'
      kind: law
      answer: 'No: an ADU needs no off-street parking (§325-28C(2)). The house''s own parking is unchanged.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [9, 9]
        quote: There shall be no off-street parking requirement for an ADU
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.4
    examples:
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 1}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 0}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 4, parking_spaces: 1}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 2}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 6, parking_spaces: 3}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 6, parking_spaces: 2}
        expect: fail
      - given: {use: two_family, sleeping_rooms: 3, parking_spaces: 0}
        expect: not_applicable
        note: two dwelling units, see R-2a.parking_dwelling_units
    notes: The residential parking rows span every residential district's column (one merged cell from R-1A to RU),
      so R-2a's numbers are R-1b's. The sleeping_rooms measure counts one dwelling unit's rooms, so this rule is for the
      one use with exactly one dwelling unit.
    drafted_by: claude
    status: draft

