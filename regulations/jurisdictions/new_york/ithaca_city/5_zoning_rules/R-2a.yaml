  - id: R-2a.rear_yard
    kind: rule
    topic: dimensions
    title: "Rear yard minimum (chart p.3, note 16; lot depth §325-8A(14))"
    check: rear_yard >= max(min(0.25 * lot_depth, 50), 20)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-2A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
        not_limits: {2: "the two side lot lines: how lot depth is measured (measures.yaml lot_depth), not a limit"}
    examples:
      - given: {rear_yard: 30, lot_depth: 120}
        expect: pass
        note: exactly 25% of 120
      - given: {rear_yard: 29.99, lot_depth: 120}
        expect: fail
      - given: {rear_yard: 50, lot_depth: 240}
        expect: pass
        note: 25% would be 60 ft; the chart caps it at 50 ft
      - given: {rear_yard: 49.99, lot_depth: 240}
        expect: fail
      - given: {rear_yard: 20, lot_depth: 60}
        expect: pass
        note: 25% would be 15 ft; note 16 sets the floor at 20 ft
      - given: {rear_yard: 19.99, lot_depth: 60}
        expect: fail
      - given: {rear_yard: 24, lot_depth: 120}
        expect: fail
        note: R-3a's 20% (24 ft) is not enough in R-2a
    notes: >-
      R-2A's cell is "25%/ 50 ft [fn16]", the third value. Lot depth is the average of the two side lot lines if they
      differ (§325-8A(14)(a)). The percentage governs for lot depths from 80 ft (25% = 20 ft) to 200 ft (25% = 50 ft).
    open_questions:
    - 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the Zoning
      Administrator''s perpendicular method, and one detail of it is still open.'
    research:
    - question: 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the
        Zoning Administrator''s perpendicular method, and one detail of it is still open.'
      searched:
      - 325-8A
      - 325-3B:yard
      - 325-3B:rear_yard
      sources:
      - rank: 2
        cite: 'Zoning Administrator''s affidavit (2019) and staff memo to the BZA, Appeal #3202, 815 S. Aurora St (a
          five-sided lot), 2019-2022'
        url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_02012022-2446
        quote: side lot lines should be drawn at a 90-degree angle perpendicular to the front lot line to determine
          the average lot depth
      why_open: It depends on the lot_depth question that is still open; see its research.
      report: docs/research/2026-10-20_architect_questions.md §1.2
    drafted_by: claude
    status: draft

