    notes: >-
      R-2A's two side minimums are both 10 ft (the third value on each line). On a corner lot one side yard is left;
      the City checks it against Column 13 and uses Column 12 for the second front yard (the
      corner_lot_side_yard_column_13 finding, Gordium's reading): both side measures are then that one yard. In R-2a
