        quote: "Side (other side minimum) 10 ft 10 ft 10 ft"
    examples:
      - given: {side_yard_smaller: 10, side_yard_larger: 10}
        expect: pass
        note: both exactly at the minimum
      - given: {side_yard_smaller: 9.99, side_yard_larger: 20}
        expect: fail
      - given: {side_yard_smaller: 5, side_yard_larger: 10}
