  - id: RU.green_space
    kind: flag
    topic: dimensions
    title: "Green space: half the developable lot area (chart p.3, note 13)"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Maximum lot coverage by buildings, row: Percent of lot area, column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [60, 60]
        quote: "(13) 50% of the developable lot area, after the required setbacks have been calculated, must be retained as green space."
      - file: chapter_325_zoning_2026-10.pdf
        page: 11
        lines: [43, 44]
        quote: "GREEN SPACE — A portion of a lot that is set aside for public or private use without any construction or parking areas."
      - file: chapter_325_zoning_2026-10.pdf
        page: 12
        lines: [4, 6]
        quote: "Where a minimum green space requirement applies, at least 75% of the required area shall be softscape including trees, shrubs, natural plantings, garden areas, lawns, and other live vegetative coverings."
    examples:
      - given: {use: one_family_detached}
        expect: needs_review
      - given: {use: multiple_family}
        expect: needs_review
        note: note 13 names no use; it rides on RU's coverage cell, which applies to every use
    open_questions:
    - 'RU''s note 13: "50% of the developable lot area, after the required setbacks have been calculated, must be
      retained as green space." Is the developable lot area the part of the lot inside the required front, side and
      rear yards, and must the green space lie inside that area, or may it be anywhere on the lot (the required yards
      included)?'
    research:
    - question: 'RU''s note 13: "50% of the developable lot area, after the required setbacks have been calculated, must
        be retained as green space." Is the developable lot area the part of the lot inside the required front, side
        and rear yards, and must the green space lie inside that area, or may it be anywhere on the lot (the required
        yards included)?'
      searched:
      - 325-3B:green_space
      - 325-3B:yard
      - 325-8A
      - 325-18
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [60, 60]
        quote: 50% of the developable lot area, after the required setbacks have been calculated
      - file: chapter_325_zoning_2026-10.pdf
        page: 11
        lines: [43, 44]
        quote: A portion of a lot that is set aside for public or private use without any construction or parking areas
      why_open: >-
        "Developable lot area" is not defined in Chapter 325 (the word appears only in this note), and "setbacks" is
        the chart's word for the required yards. The plain reading takes the lot less its required yards; but the note
        says only how much green space (half of that area), not where it must be, and §325-3B GREEN SPACE says only what
        green space is (no construction or parking; at least 75% softscape where a minimum applies). No City record
        found. Gordium doesn't measure planting or paving, so this is a flag either way; the question decides how a
        reviewer works it out by hand.
      readings:
      - id: green_inside_developable_area
        reading: the green space is half the developable area and must lie inside it
      - id: green_anywhere_on_lot
        reading: the green space is half the developable area and may lie anywhere on the lot
    notes: >-
      Not checked yet: Gordium doesn't measure green space (planting, lawns, paving, parking), so this always needs
      review; check it by hand under chart p.3 note 13 and §325-3B GREEN SPACE. Worked by hand for a 100 x 150 ft lot
      (15,000 sf): front 25 ft, sides 10 ft and 10 ft, rear 25% of 150 = 37.5 ft (between note 17's 30 ft and the 50 ft
      cap) leave a developable area of (100 - 20) x (150 - 25 - 37.5) = 80 x 87.5 = 7,000 sf; half of it, 3,500 sf, must
      be green space, at least 75% of that (2,625 sf) softscape. The 25% coverage limit allows 3,750 sf of buildings on
      the same lot (RU.lot_coverage).
    drafted_by: claude
    status: draft

