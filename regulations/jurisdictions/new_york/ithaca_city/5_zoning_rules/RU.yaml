    kind: rule
    topic: dimensions
    title: "Rear yard minimum (chart p.3, note 17; lot depth §325-8A(14))"
    check: rear_yard >= max(min(0.25 * lot_depth, 50), 30)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn16] 50 ft [fn17]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [67, 67]
        quote: "(17) But not less than 30 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
        not_limits: {2: "the two side lot lines: how lot depth is measured (measures.yaml lot_depth), not a limit"}
    examples:
      - given: {rear_yard: 35, lot_depth: 140}
        expect: pass
        note: exactly 25% of 140
      - given: {rear_yard: 34.99, lot_depth: 140}
        expect: fail
      - given: {rear_yard: 50, lot_depth: 240}
        expect: pass
        note: 25% would be 60 ft; the chart caps it at 50 ft
      - given: {rear_yard: 49.99, lot_depth: 240}
        expect: fail
      - given: {rear_yard: 30, lot_depth: 100}
        expect: pass
        note: 25% would be 25 ft; note 17 sets the floor at 30 ft
      - given: {rear_yard: 29.99, lot_depth: 100}
        expect: fail
        note: note 16's 20 ft floor (every other residential column) is not enough in RU
    notes: >-
      RU's cell is "25% / 50 ft [fn17]", the ninth value; its note is 17 ("not less than 30 ft"), where every other
      residential column has note 16 (20 ft). The percentage governs for lot depths from 120 ft (25% = 30 ft) to 200 ft
      (25% = 50 ft). Lot depth is the average of the two side lot lines if they differ (§325-8A(14)(a)).
