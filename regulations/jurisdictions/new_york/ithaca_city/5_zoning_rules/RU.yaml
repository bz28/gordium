    research:
    - question: 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey
        (lot), and whether roof eaves count (building_area). Garages count: see building_area''s findings.'
      searched:
      - 325-8A
      - 325-3B:building_area
      - 325-3B:lot
      sources: []
      why_open: It depends on the lot and building_area questions, which are still open; see their research.
      report: docs/research/2026-10-20_architect_questions.md §3.2
    findings:
    - id: below_ground_not_counted
      question: '"Above ground": are parts of a building below grade (e.g. a buried garage under a deck) left out of
        building_area?'
      kind: reading
      answer: Parts wholly below ground don't count (Column 10 counts what is covered "above ground"; §325-25B lets
        wholly below-grade accessory structures go anywhere). A deck on top of a buried garage does count.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [6, 7]
        quote: covered by principal and accessory buildings above ground
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [4, 4]
        quote: entirely below the finished grade
      still_open: []
      strength: strong
      confirm_with: the City zoning office
      report: docs/research/2026-10-20_architect_questions.md §3.2
    examples:
