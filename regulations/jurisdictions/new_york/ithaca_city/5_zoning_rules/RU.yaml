      - given: {building_area: 2501, lot_area: 10000}
        expect: fail
      - given: {building_area: 3500, lot_area: 10000}
        expect: fail
        note: 35% (R-3's) is too much in RU
    notes: >-
      The chart line reads "20% 25% 30% 35% 35% 35% 40% 25% [fn13]": eight values (R-2C's stacked cell is printed on
      the lines above and below), the last, "25% [fn13]", RU's; the chart reader's RU cell agrees. Note 13 adds a
      green-space requirement of its own (RU.green_space).
