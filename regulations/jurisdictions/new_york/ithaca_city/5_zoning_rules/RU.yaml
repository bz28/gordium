        lines: [67, 67]
        quote: "(17) But not less than 30 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: RU}
    examples:
      - given: {front_yard_eaves: 30, side_yard_smaller_eaves: 10, side_yard_larger_eaves: 12, rear_yard_eaves: 48, lot_depth: 140, building_height: 30}
        expect: pass
        note: eaves clear of every required yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 33, lot_depth: 140, building_height: 30}
        expect: pass
        note: eaves exactly 2 ft into the front (25 − 2), both sides (10 − 2) and the rear (25% of 140 = 35, − 2) yards
      - given: {front_yard_eaves: 22.99, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 33, lot_depth: 140, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 7.99, side_yard_larger_eaves: 8, rear_yard_eaves: 33, lot_depth: 140, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 7.99, rear_yard_eaves: 33, lot_depth: 140, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 32.99, lot_depth: 140, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 100, building_height: 30}
        expect: pass
        note: on a 100 ft lot the rear yard is note 17's 30 ft, and an eave may reach 2 ft into it
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 27.99, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 26, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 36, lot_depth: 140, building_height: 38}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {front_yard_eaves: 25.99, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 36, lot_depth: 140, building_height: 38}
        expect: fail
        note: the 28 ft front yard the bonus requires, less 2 ft, is 26
    notes: >-
      The yards themselves (RU.front_yard, side_yards, rear_yard) are measured to the nearest part of the building, its
      eaves left out; this rule measures the same yards to the outermost part, eaves included, and lets that be up to 2
      ft less. A massing model shows eaves, not windowsills, belt courses or cornices: those are for the architect to
      check. On a corner lot every yard facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: RU.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 25
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 6: "six feet applies in R-1 districts only; in RU it is three feet (accessory_side_yard >= 3)"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: RU}
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines (6 ft would be needed in R-1)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 24.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 25, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (25 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      RU is not an R-1 District (the chart heads it "Residential", apart from "Single Family Residential" R-1), so
      §325-25C's first sentence applies: frame accessory buildings 3 ft from any side or rear lot line. Whether the
      distances apply to an accessory building that isn't frame is §325-25C's open question (325-25C#1):
      accessory_distances_apply is measured under every reading, and outside R-1 its readings differ for a building
      not stated as frame, so that gives NEEDS REVIEW until the architect says the building is frame (accessory_frame).
    drafted_by: claude
    status: draft

  - id: RU.primary_structures
    kind: rule
    topic: dimensions
    title: "Number of primary structures by lot size (chart p.2, note 3)"
    check: primary_buildings <= 1
    review_when:
      - when: primary_buildings == 2 and lot_area >= 60000
        reason: >-
          Two primary uses on a lot over 60,000 sf need the approval of the Ithaca Landmarks Preservation Commission
          (ILPC) and the Planning Board (note 3); a lot of exactly 60,000 sf is the open question on this rule.
      - when: primary_buildings == 3 and lot_area >= 90000
        reason: >-
          Three primary uses on a lot of at least 90,000 sf need the approval of the ILPC and the Planning Board
          (note 3).
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [6, 6]
        quote: "RU [fn3] Regulations"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [43, 44]
        quote: "(3) Properties less than 60,000 SF may only have one primary structure. Properties greater than 60,000 SF may have two primary uses, if approved by ILPC and Planning Board. Properties with at least 90,000 SF can have as many as three primary uses if approved by ILPC and Planning Board."
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [11, 14]
        quote: "(1) For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts, each square-footage requirement applies separately to the initial permitted primary use and to each additional permitted primary use located in a separate building on the property in question"
    examples:
      - given: {lot_area: 20000, primary_buildings: 1}
        expect: pass
        note: one primary structure, on any lot
      - given: {lot_area: 20000, primary_buildings: 2}
        expect: fail
        note: under 60,000 sf, one primary structure only
      - given: {lot_area: 59999, primary_buildings: 2}
        expect: fail
      - given: {lot_area: 60000, primary_buildings: 2}
        expect: needs_review
        note: exactly 60,000 sf, the open question (and the approvals under either reading that allows two)
      - given: {lot_area: 70000, primary_buildings: 2}
        expect: needs_review
        note: over 60,000 sf, two with the ILPC's and the Planning Board's approval
      - given: {lot_area: 70000, primary_buildings: 3}
        expect: fail
        note: three need at least 90,000 sf
      - given: {lot_area: 90000, primary_buildings: 3}
        expect: needs_review
        note: at least 90,000 sf, three with the approvals
      - given: {lot_area: 200000, primary_buildings: 4}
        expect: fail
        note: '"as many as three"'
      - given: {lot_area: 95000}
        expect: needs_review
        note: the primary buildings not counted
    open_questions:
    - 'RU''s p.2 note 3: "Properties less than 60,000 SF may only have one primary structure. Properties greater than
      60,000 SF may have two primary uses, if approved by ILPC and Planning Board. Properties with at least 90,000 SF
      can have as many as three primary uses ..." How many primary structures may a lot of exactly 60,000 sf have, and
      does "primary uses" in the second and third sentences mean primary structures (buildings), as in the first?'
    research:
    - question: 'RU''s p.2 note 3: "Properties less than 60,000 SF may only have one primary structure. Properties
        greater than 60,000 SF may have two primary uses, if approved by ILPC and Planning Board. Properties with at
        least 90,000 SF can have as many as three primary uses ..." How many primary structures may a lot of exactly
        60,000 sf have, and does "primary uses" in the second and third sentences mean primary structures (buildings),
        as in the first?'
      searched:
      - 325-3B:primary_structure
      - 325-8A
      - 325-8B
      - 325-8E
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [43, 43]
        quote: Properties less than 60,000 SF may only have one primary structure
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: A single structure (located on a parcel) containing a use permitted in the zoning district in which it is
          located
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [13, 13]
        quote: each additional permitted primary use located in a separate building
      why_open: >-
        The note's first sentence is about structures, the next two about "primary uses"; §325-3B defines a primary
        structure as a single structure containing a permitted use, and §325-8B(1) speaks of "each additional permitted
        primary use located in a separate building", so the code treats the two together, but the note never says
        that two primary uses may be two buildings. "Less than 60,000 SF" and "greater than 60,000 SF" leave a lot of
        exactly 60,000 sf in neither. The note isn't in Chapter 325's text (searched §325-8, the South Hill overlay
        §325-8E, which has a primary-structure rule for R-1 and R-2 only). No City record found (searched again
        2026-10-27: no City interpretation or Board of Zoning Appeals decision found online). The 60,000 sf part
        changes no result yet: two primary buildings on exactly 60,000 sf need review under both readings (the
        approvals are needed anyway where two are allowed). For the other part Gordium counts primary buildings,
        each read as one primary use (its use is one per lot): Gordium's reading for now, to confirm. Under the
        other reading (primary uses, not buildings), two buildings of one use on a lot over 60,000 sf would need no
        approvals, where Gordium says needs review: the cautious side, never a pass the law wouldn't give.
      readings:
      - id: sixty_thousand_one_structure
        reading: a lot of exactly 60,000 sf may have one primary structure (two need more than 60,000 sf)
      - id: sixty_thousand_two_structures
        reading: a lot of exactly 60,000 sf may have two primary structures with the approvals
    notes: >-
      In words: under 60,000 sf, one primary structure; over 60,000 sf, two primary uses with the approval of the Ithaca
      Landmarks Preservation Commission (ILPC) and the Planning Board; 90,000 sf or more, up to three with the same
      approvals. One primary building complies on any lot; two or three where the lot is large enough need review for
      the approvals (Gordium can't know they were given); more, or a lot too small, does not comply. The primary
      buildings are counted as for §325-8B(1) (primary_buildings: from the drawing where it can tell, else stated by
      the architect), one primary use per building (Gordium's use is one per lot). Each further primary building also
      needs its own lot-size figure (RU.lot_area_each_primary_building): two one-family houses on one RU lot need
      2 x 10,000 sf by §325-8B(1), and more than 60,000 sf and the two approvals by note 3.
    drafted_by: claude
    status: draft

  - id: RU.spacing_500_ft
    kind: flag
    topic: uses
    title: "New multiple dwellings, fraternity houses, dormitories: one per 500 ft (note 5)"
    applies_when: >-
      use in ["multiple_family", "fraternity_sorority_group_house", "dormitory"] and not conversion
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Multiple family dwelling [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Fraternity, sorority, or group house", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Dormitory", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [46, 46]
        quote: "(5) Restricted to one every 500 feet for new construction, measured from the edge of the property line."
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      - given: {use: multiple_family, conversion: false}
        expect: needs_review
        note: new construction
      - given: {use: dormitory}
        expect: needs_review
        note: new construction or conversion not stated, so the note may apply
      - given: {use: fraternity_sorority_group_house, conversion: true}
        expect: not_applicable
        note: the note is "for new construction"; a conversion of an existing building is not
      - given: {use: two_family, conversion: false}
        expect: not_applicable
        note: note 5 marks only the multiple-dwelling, fraternity and dormitory rows
    open_questions:
    - 'RU''s p.2 note 5, on the multiple-dwelling, fraternity-house and dormitory rows: "Restricted to one every 500 feet
      for new construction, measured from the edge of the property line." One of what every 500 ft: one of the same use,
      or one of any of the three; and does an existing one count, or only new construction?'
    research:
    - question: 'RU''s p.2 note 5, on the multiple-dwelling, fraternity-house and dormitory rows: "Restricted to one every
        500 feet for new construction, measured from the edge of the property line." One of what every 500 ft: one of
        the same use, or one of any of the three; and does an existing one count, or only new construction?'
      searched:
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:dormitory
      - 325-3B:conversion
      - 325-8A
      - 325-8B
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [46, 46]
        quote: Restricted to one every 500 feet for new construction, measured from the edge of the property line
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [32, 32]
        quote: (5) Rooming house; boarding house; cooperative household; fraternity, sorority, or group house;
      why_open: >-
        The note is attached to three rows at once, and §325-3B makes a fraternity house and a dormitory multiple
        dwellings too, which points to one of any of the three; but it is written on each row, which can be read row by
        row. "For new construction" says which buildings the limit restricts, not which neighbours count toward it.
        The note isn't in Chapter 325's text, and no City record was found. Gordium doesn't map the neighbouring
        buildings' uses, so this is a flag either way.
      readings:
      - id: one_of_any_of_the_three
        reading: within 500 ft of the lot there may be no other multiple dwelling, fraternity house or dormitory
      - id: one_of_the_same_use
        reading: within 500 ft there may be no other of the same use
      - id: only_new_ones_count
        reading: only other buildings built new (after the rule) count toward the 500 ft
    notes: >-
      Not checked yet: Gordium doesn't map the uses of the buildings around the lot, so this always needs review for
      new construction; check it by hand under chart p.2 note 5, measuring 500 ft from the edge of the lot (its
      property line). Stated as a conversion of an existing building (conversion), the note doesn't apply.
    drafted_by: claude
    status: draft

  - id: RU.parking_one_family
    kind: rule
    topic: parking_and_loading
    title: "Minimum off-street parking, one-family detached (chart p.14)"
    applies_when: use in ["one_family_detached", "one_family_detached_zero_lot_line"]
    check: parking_spaces >= (1 if sleeping_rooms <= 3 else 2 + 1 * max(sleeping_rooms - 5, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: RU}
    examples:
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 1}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 0}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 2}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 1}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 8, parking_spaces: 5}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 8, parking_spaces: 4}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, sleeping_rooms: 4, parking_spaces: 2}
        expect: pass
        note: one dwelling unit too (§325-3B), so the same bedroom table
      - given: {use: one_family_detached_zero_lot_line, sleeping_rooms: 4, parking_spaces: 1}
        expect: fail
      - given: {use: two_family, sleeping_rooms: 3, parking_spaces: 0}
        expect: not_applicable
        note: two dwelling units, see RU.parking_dwelling_units
    notes: >-
      The residential parking rows span every residential district's column, so the numbers are R-1b's. The
      sleeping_rooms measure counts one dwelling unit's rooms, so this rule is for the uses with exactly one
      dwelling unit: a one-family detached house, and the zero-lot-line house, which §325-3B also calls a building of
      "not more than one dwelling unit". Bedrooms and parking spaces are inside the building, so the panel lists this row as "not checked
      yet: interior" until both are entered (parking is on hold). RU's accessory-dwelling-unit cell is blank on p.2,
      so the ADU parking finding of R-3a isn't carried here.
    drafted_by: claude
    status: draft

  - id: RU.parking_dwelling_units
    kind: flag
    topic: parking_and_loading
