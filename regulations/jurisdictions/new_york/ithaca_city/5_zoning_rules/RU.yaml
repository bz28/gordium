# RU (City of Ithaca; the code writes it "R-U", §325-4): rules drafted by Claude by hand, by reading the zoning
# Occupancy (§325-3B one-family and two-family dwellings) and home occupations: the rules at the end (2026-10-27).
# charts (April 2026) and Chapter 325, the same way R-1b.yaml, R-1a.yaml, R-2a.yaml to R-2c.yaml and R-3a.yaml
# were. An ANSWER KEY for grading the drafting script: written without looking at anything the script drafted or
# recorded, from the City's documents only (2_extracted_text/, the chart read cell by cell, the section labels, the
# definitions), with R-3a.yaml as the model of the format. The file is named as the chart writes the district (RU),
# the name the start box and the drafting script use.
#
# Why RU: the last residential column, and the odd one out. It allows apartments, fraternity houses and dormitories
# like R-3, but on R-1-sized and larger lots (10,000 sf for a house, 15,000 sf for a two-family or semi-detached
# house, 16,500 sf + 1,500 sf per unit past three for attached and multiple dwellings, note 9; 30,000 sf for
# fraternity houses and other uses), wide lots (75 to 125 ft), R-1's yards (25 ft front, 10 ft + 10 ft sides) with a
# 30 ft rear-yard floor (note 17), 25% coverage plus a green-space rule (note 13), at most one primary structure on
# a lot under 60,000 sf (p.2 note 3), and new apartments, fraternity houses and dormitories one every 500 ft (p.2
# note 5). A drafter that treats RU as an R-3 district, or reads note 16's 20 ft floor for it, fails here.
#
# Every chart number was read two ways and agrees: the chart's text line (quoted), and the chart reader's RU cell
# (cited); RU is the ninth and last value in each row (the fourth of the four in the fraternity rows).
# test_r1b_matches_chart.py checks the rules against the RU cells.
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2), accessory dwelling
# units (§325-28; RU's accessory-dwelling-unit cell on p.2 is blank, neither • nor -), height exceptions for chimneys and similar (§325-16A, applied when measuring height), the loading rule for
# nonresidential uses ("Allowed by variance", p.14). RU is not an R-3
# district, so §325-19E doesn't apply, and §325-11B(1) doesn't allow cluster subdivisions in it. Parking is written
# as in R-3a and stays "not checked yet: interior".
#
# Not checked yet, each a flag that always needs review, with the section to check by hand: green space (p.3 note
# 13, RU.green_space), the 500 ft spacing of
# new multiple dwellings, fraternity houses and dormitories (p.2 note 5, RU.spacing_500_ft), parking for several
# units, dormitories and other uses, loading.
#
# No corner-lot gap here: RU's two side minimums are both 10 ft, so on a corner lot the one side yard left is held
# to 10 ft whichever column the City reads it from.

district: RU
rules:

  - id: RU.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: >-
      use in ["one_family_detached", "one_family_semi_detached", "one_family_attached", "two_family",
      "multiple_family", "fraternity_sorority_group_house", "dormitory", "church", "public_park_or_playground",
      "library_or_fire_station", "adult_day_care_home"]
    review_when:
      - when: >-
          use in ["cemetery", "public_utility_structure", "school", "nursery_school_or_child_day_care",
          "bed_and_breakfast_inn"]
        reason: >-
          Marked SP for RU on the zoning chart (p.2). §325-9B(1) lists cemeteries and public utility facilities in all
          districts, schools in all residential districts, nursery schools or child day-care centers in R-U, and
          bed-and-breakfast inns in all districts as requiring a special permit from the Planning and Development
          Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [6, 6]
        quote: "RU [fn3] Regulations"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked • for RU (multiple dwellings, fraternity houses and dormitories with p.2 note 5: RU.spacing_500_ft)
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Multiple family dwelling [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Fraternity, sorority, or group house", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Dormitory", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: RU}
      # marked SP for RU
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Bed-and-breakfast inn", column: RU}
      # marked - for RU (not permitted): uses R-3 allows that RU doesn't
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursing, convalescent or rest home", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Hospital or sanitarium", column: RU}
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [28, 28]
        quote: "(e) Nursery schools or child day-care centers in R-2, CR-2 and R-U Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [36, 36]
        quote: "(p) Bed-and-breakfast inns in all districts."
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: multiple_family}
        expect: pass
        note: marked •[fn5] (one every 500 ft for new construction, RU.spacing_500_ft)
      - given: {use: dormitory}
        expect: pass
        note: marked •[fn5] for RU (- in R-3AA)
      - given: {use: adult_day_care_home}
        expect: pass
      - given: {use: nursing_home}
        expect: fail
        note: marked - for RU (• in R-3)
      - given: {use: hospital_or_sanitarium}
        expect: fail
        note: marked - for RU (SP in R-3)
      - given: {use: neighborhood_commercial_facility}
        expect: fail
        note: marked - for RU (SP in R-2 and R-3)
      - given: {use: one_family_detached_zero_lot_line}
        expect: fail
        note: marked - for RU (SP in R-2C and R-3)
      - given: {use: nursery_school_or_child_day_care}
        expect: needs_review
        note: SP in RU, as §325-9B(1)(e) says ("R-U Districts"); • in R-3
      - given: {use: school}
        expect: needs_review
      - given: {use: bed_and_breakfast_inn}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: ru_is_r_u
      question: The chart writes the district "RU"; the code writes "R-U" (§325-4, §325-9B(1)(e)). The same district?
      kind: law
      answer: 'Yes: §325-4 lists one such district, "R-U Residential", after R-3b, where the chart''s last residential
        column "RU" stands, and §325-9B(1)(e)''s special permit for nursery schools "in ... R-U Districts" matches the
        chart''s SP mark for RU.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 22
        lines: [20, 20]
        quote: R-U Residential
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [28, 28]
        quote: Nursery schools or child day-care centers in R-2, CR-2 and R-U Districts
      strength: strong
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. In RU, p.2 notes 3 and 5 are rules of their own (RU.primary_structures,
        RU.spacing_500_ft).
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      RU is the ninth and last mark in each row of page 2 (R-1A, R-1B, R-2A, R-2B, R-2C, R-3A, R-3AA, R-3B, RU). Its
      marks, row by row against the chart reader's RU cells: • one-family detached, semi-detached and attached
      dwellings, two-family dwellings, multiple dwellings, fraternity houses and dormitories (the last three "•[fn5]"),
      church, park, library or fire station, adult day care home; SP cemetery, public utility, school, nursery school,
      bed-and-breakfast inn; - the zero-lot-line house, neighborhood commercial facility, nursing home, hospital. What
      the marks mean is Gordium's reading (the chart_marks finding).
    drafted_by: claude
    status: draft

  - id: RU.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 10000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 12000}
        expect: pass
      - given: {use: one_family_detached, lot_area: 10000}
        expect: pass
        note: exactly at the minimum (R-1A's figure too)
      - given: {use: one_family_detached, lot_area: 9999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 5000}
        expect: fail
        note: R-3's 5,000 sf is not enough in RU
      - given: {use: two_family, lot_area: 20000}
        expect: not_applicable
    notes: >-
      The ninth value of the row is RU's (10,000 sf, after R-3B's 3,000 sf). Chart note 3 points to §325-8B(1): the
      minimum applies to each main building on the lot (and p.2 note 3 allows only one primary structure on a lot under
      60,000 sf: RU.primary_structures).
    drafted_by: claude
    status: draft

  - id: RU.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_area >= 15000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: one_family_semi_detached, lot_area: 15000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_semi_detached, lot_area: 14999}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 10000}
        expect: fail
        note: enough for a detached house in RU, not a semi-detached one
      - given: {use: one_family_detached, lot_area: 10000}
        expect: not_applicable
    notes: >-
      A semi-detached dwelling is one building holding two one-family dwellings that share a party wall (§325-3B).
      RU's side yards (10 ft each) leave no 0 ft side for a party wall on a lot line, so the building is checked whole
      on one lot.
    drafted_by: claude
    status: draft

  - id: RU.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Minimum lot size, two-family dwelling (chart p.3)"
    applies_when: use == "two_family"
    check: lot_area >= 15000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 20000}
        expect: pass
      - given: {use: two_family, lot_area: 15000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 14999}
        expect: fail
    drafted_by: claude
    status: draft

  - id: RU.lot_area_one_family_attached
    kind: rule
    topic: dimensions
    title: "Lot size by units, one-family attached (chart p.3, note 9)"
    applies_when: use == "one_family_attached"
    check: lot_area >= (16500 if conversion else 16500) + 1500 * max(dwelling_units - 3, 0)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, by conversion", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [14, 14]
        quote: "One-family dwelling, attached, new construction - - - - 1,500 sf [fn6] 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [13, 13]
        quote: "One-family dwelling, attached, by conversion - - - - 1,500 sf [fn6] 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [55, 55]
        quote: "(9) For the first 1-3 units; +1,500 sf for each additional unit."
        not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 1,500 sf only past 3"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      # worked by hand from note 9: 16,500 sf for the first 1-3 units, new construction and by conversion alike,
      # + 1,500 sf for each unit past 3 (note 9 has no addition for rooms let); each step on both sides
      - given: {use: one_family_attached, lot_area: 16500, dwelling_units: 3, conversion: false}
        expect: pass
        note: new, 3 units -> 16,500 sf; at the limit
      - given: {use: one_family_attached, lot_area: 16499, dwelling_units: 3, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 18000, dwelling_units: 4, conversion: false}
        expect: pass
        note: new, 4 units -> 16,500 + 1,500 = 18,000 sf
      - given: {use: one_family_attached, lot_area: 17999, dwelling_units: 4, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 21000, dwelling_units: 6, conversion: true}
        expect: pass
        note: by conversion, 6 units (the most an attached building holds, §325-3B) -> 16,500 + 3 x 1,500 = 21,000 sf
      - given: {use: one_family_attached, lot_area: 20999, dwelling_units: 6, conversion: true}
        expect: fail
      - given: {use: one_family_attached, lot_area: 16500, dwelling_units: 3}
        expect: pass
        note: new construction or conversion not given, but RU's two rows are both 16,500 sf, so it can't change the answer
      - given: {use: one_family_attached, lot_area: 16500, dwelling_units: 3, rooms_let_for_profit: 4, conversion: false}
        expect: pass
        note: note 9 adds nothing for rooms let (R-3's notes 7 and 8 do)
      - given: {use: one_family_attached, lot_area: 40000}
        expect: needs_review
        note: the units not given -> never a pass, however large the lot
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Note 9 in full, encoded: the chart's base for the first 1-3 units (16,500 sf, the same for new construction and
      by conversion: the formula writes both cells' figures), + 1,500 sf for each unit past 3. Unlike notes 7 and 8,
      note 9 adds nothing per room let for profit. The units are stated by the architect (dwelling_units); not given,
      the rule needs review, never a pass. An attached building has 3 to 6 dwellings (§325-3B): a row of 5 needs 16,500
      + 2 x 1,500 = 19,500 sf.
    drafted_by: claude
    status: draft

  - id: RU.attached_units_per_building
    kind: rule
    topic: dimensions
    title: "Attached building: three to six dwelling units (§325-3B)"
    applies_when: use == "one_family_attached"
    check: attached_units_in_building >= 3 and attached_units_in_building <= 6
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 14]
        quote: "(4) ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings, each of which shares one or more party walls or structural elements with the other one-family dwellings in the building and which has direct exterior access from the ground floor. A maximum of six one-family dwelling units may be attached to form a single building."
        not_limits: {1: "\"one or more party walls\": how the units are joined, not a count of units"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [32, 33]
        quote: "(5) Rooming house; boarding house; cooperative household; fraternity, sorority, or group house; row house, townhouse, or garden apartment housing as defined in this section."
    examples:
      - given: {use: one_family_attached, attached_units_in_building: 3}
        expect: pass
        note: the fewest
      - given: {use: one_family_attached, attached_units_in_building: 6}
        expect: pass
        note: the most
      - given: {use: one_family_attached, attached_units_in_building: 2}
        expect: fail
        note: two units joined are a semi-detached building, not an attached one
      - given: {use: one_family_attached, attached_units_in_building: 7}
        expect: fail
        note: past the definition's six
      - given: {use: one_family_attached, attached_units_in_building: 8, dwelling_units: 2}
        expect: fail
        note: two units on this lot of a row of eight; the cap is on the whole building, every lot it stands on
      - given: {use: one_family_attached}
        expect: needs_review
        note: the building's units not given
      - given: {use: two_family, attached_units_in_building: 2}
        expect: not_applicable
    notes: >-
      Counted over the whole building, every lot it stands on together (attached_units_in_building), not the units on
      this lot (dwelling_units): a row house on its own lot is one unit of a building of three to six. Gordium's
      massing model shows the building on this lot only, so the architect states the count. A building of seven or
      more joined one-family dwelling units is past the definition's maximum ("A maximum of six"), so it does not
      comply as this use. Whether such a row may instead be built as a multiple dwelling (§325-3B MULTIPLE DWELLING
      (5): row house, townhouse) is not settled by the code: the definitions point both ways, as in the architects'
      question §5.6; Gordium doesn't decide it, and doesn't check a row house's own limits (§325-3B ROW HOUSE) yet.
      Two joined units are a one-family semi-detached dwelling (§325-3B (3)).
    drafted_by: claude
    status: draft

  - id: RU.lot_area_multiple_family
    kind: rule
    topic: dimensions
    title: "Lot size by units, multiple dwelling (chart p.3, note 9)"
    applies_when: use == "multiple_family"
    check: lot_area >= (16500 if conversion else 16500) + 1500 * max(dwelling_units - 3, 0)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, new construction", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, by conversion", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [17, 17]
        quote: "Multiple family dwelling, new construction - - - - - 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [16, 16]
        quote: "Multiple family dwelling, by conversion - - - - - 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [55, 55]
        quote: "(9) For the first 1-3 units; +1,500 sf for each additional unit."
        not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 1,500 sf only past 3"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      - given: {use: multiple_family, lot_area: 16500, dwelling_units: 3, conversion: false}
        expect: pass
        note: new, 3 units -> 16,500 sf; at the limit
      - given: {use: multiple_family, lot_area: 16499, dwelling_units: 3, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 27000, dwelling_units: 10, conversion: false}
        expect: pass
        note: new, 10 units -> 16,500 + 7 x 1,500 = 27,000 sf
      - given: {use: multiple_family, lot_area: 26999, dwelling_units: 10, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 16500, dwelling_units: 3, conversion: true}
        expect: pass
        note: by conversion, 3 units -> 16,500 sf too
      - given: {use: multiple_family, lot_area: 16499, dwelling_units: 3, conversion: true}
        expect: fail
      - given: {use: multiple_family, lot_area: 19500, dwelling_units: 5}
        expect: pass
        note: 16,500 + 2 x 1,500 = 19,500 sf, new construction or conversion alike
      - given: {use: multiple_family, lot_area: 19499, dwelling_units: 5}
        expect: fail
      - given: {use: multiple_family, lot_area: 40000}
        expect: needs_review
        note: the units not given -> never a pass, however large the lot
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Note 9 in full, encoded: 16,500 sf for the first 1-3 units (new construction and by conversion alike), + 1,500 sf
      for each unit past 3; no addition for rooms let. The units are stated by the architect; not given, the rule
      needs review, never a pass.
    drafted_by: claude
    status: draft

