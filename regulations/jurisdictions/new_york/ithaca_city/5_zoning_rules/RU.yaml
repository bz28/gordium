  - id: RU.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: >-
      use not in ["one_family_detached", "one_family_semi_detached", "one_family_attached", "two_family",
      "multiple_family", "fraternity_sorority_group_house"]
    check: lot_area >= 30000
    review_when:
      - when: use == "dormitory" and lot_area >= 16500
        reason: >-
          A dormitory is a multiple dwelling by §325-3's definition, so the multiple-family row and its note 9 (16,500
          sf for 1-3 units, +1,500 sf per unit over 3) may apply instead of "Other use" (30,000 sf): the open question on
          this rule. From 16,500 sf (the least the multiple-family reading can ask) the two readings can disagree either
          way, so neither a pass nor a fail is sure; under 16,500 sf both fail.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: RU}
      - file: zoning_charts_2026-04.pdf             # the multiple-family reading's least: an input, for the review
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, new construction", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: Dormitory, column: RU}
    examples:
      - given: {use: church, lot_area: 30000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 29999}
        expect: fail
      - given: {use: church, lot_area: 10000}
        expect: fail
        note: enough for a house in RU, not for another use
      - given: {use: dormitory, lot_area: 16499}
        expect: fail
        note: 'under 16,500 sf both readings fail: "Other use" asks 30,000 sf, a multiple dwelling at least 16,500 sf'
      - given: {use: dormitory, lot_area: 16500}
        expect: needs_review
        note: the least the multiple-family reading asks (3 units); "Other use" fails it
      - given: {use: dormitory, lot_area: 20000}
        expect: needs_review
        note: under "Other use" it fails; as a new multiple dwelling of 5 units (19,500 sf) it would pass
      - given: {use: dormitory, lot_area: 40000}
        expect: needs_review
        note: under "Other use" it passes; as a multiple dwelling of 20 units (42,000 sf) it would not
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    open_questions:
    - 'A dormitory has its own row on chart p.2 but none on p.3, and §325-3 defines it as a multiple dwelling. Is its
      minimum lot size in RU the "Multiple family dwelling" row (16,500 sf plus note 9''s 1,500 sf per unit past three)
      or "Other use" (30,000 sf)?'
    research:
    - question: 'A dormitory has its own row on chart p.2 but none on p.3, and §325-3 defines it as a multiple dwelling.
        Is its minimum lot size in RU the "Multiple family dwelling" row (16,500 sf plus note 9''s 1,500 sf per unit
        past three) or "Other use" (30,000 sf)?'
      searched:
      - 325-3B:dormitory
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-8A
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [16, 16]
        quote: DORMITORY — A multiple dwelling
      why_open: The same question as R-3a's for a dormitory (§5.3 on the questions page), with RU's figures. The
        definition makes a dormitory a multiple dwelling, but the chart lists it as a use of its own and gives the
        fraternity house (also a multiple dwelling, §325-3B (5)) its own lot-size row, which suggests a use with no row
        of its own is an "Other use". Neither the code nor a City record (none found) says which. In RU the readings
        differ both ways (a small dormitory needs less under the multiple-family row, a large one more), so every
        dormitory lot of 16,500 sf or more needs review; a smaller one fails under both. (A nursing home, the other use the question covers in R-3, is not permitted in RU.)
      readings:
      - id: multiple_family_row
        reading: the multiple-family row applies (16,500 sf for 1-3 units, +1,500 sf each further unit)
      - id: other_use_row
        reading: '"Other use" applies (30,000 sf)'
    notes: >-
      Other uses in RU: church, park, library or fire station, cemetery, public utility, school, nursery school, adult
      day care home, bed-and-breakfast inn, dormitory; and the uses marked "-" (zero-lot-line house, neighborhood
      commercial facility, nursing home, hospital), which fail RU.use whatever their lot, as R-2a checks them. Worked
      by hand for a new dormitory of 12 units: 16,500 + 9 x 1,500 = 30,000 sf under the multiple-family reading, the
      same as "Other use"; fewer units need less, more units more.
    drafted_by: claude
    status: draft

  - id: RU.lot_area_each_primary_building
    kind: rule
    topic: dimensions
    title: "Lot area for each primary building on the lot (§325-8B(1))"
    applies_when: primary_buildings >= 2 or use not in ["one_family_attached", "multiple_family", "dormitory"]
    check: lot_area >= primary_buildings * (10000 if use == "one_family_detached" else 15000 if use == "one_family_semi_detached" else 15000 if use == "two_family" else 30000 if use == "fraternity_sorority_group_house" else 30000)
    review_when:
      - when: primary_buildings >= 2 and not primary_buildings_same_use
        reason: >-
          Not every primary building on the lot is stated to hold the lot's use: each building needs its own
          use's lot area, added together (§325-8B(1)); check by hand.
      - when: primary_buildings >= 2 and use in ["one_family_attached", "multiple_family", "dormitory"]
        reason: >-
          This use's lot area grows with the units, rooms or occupants in each building (or is itself open,
          or a flag), and how they are split between the buildings isn't known: check by hand, each
          building's own lot area added together (§325-8B(1)).
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [11, 16]
        quote: "(1) For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts, each square-footage requirement applies separately to the initial permitted primary use and to each additional permitted primary use located in a separate building on the property in question (e.g., in R-2b Districts, an area of 3,000 square feet is required for a one family house or a two-family house, and an additional area of 3,000 square feet is required for each additional one-family house or two-family house on the property)."
        not_limits: {1: "(1): the paragraph's number", 3000: "R-2b's figure, the code's own example"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [9, 9]
        quote: "One-family dwelling, detached [fn4] • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [11, 11]
        quote: "One-family dwelling, semi-detached [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [12, 12]
        quote: "One-family dwelling, attached [fn4] - - - - SP • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [13, 13]
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [14, 14]
        quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [15, 15]
        quote: "Fraternity, sorority, or group house - - - - - • • • •[fn5]"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [16, 16]
        quote: "Dormitory - - - - - • - • •[fn5]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Fraternity, sorority, or group house", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [18, 18]
        quote: "Fraternity, sorority, or group house 25,000 sf 25,000 sf 25,000 sf 30,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: RU}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: "Primary Uses", row: "Dormitory", column: RU}
    examples:
      - given: {use: one_family_detached, primary_buildings: 1, lot_area: 10000}
        expect: pass
        note: "one primary building: the use's own figure"
      - given: {use: one_family_detached, primary_buildings: 1, lot_area: 9999}
        expect: fail
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 20000}
        expect: pass
        note: "two primary buildings need 2 x 10,000 sf"
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 19999}
        expect: fail
        note: "enough for one building, not two"
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 30000}
        expect: pass
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 29999}
        expect: fail
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: false, lot_area: 1000000}
        expect: needs_review
        note: "another building holds another use: its own figure, added by hand"
      - given: {use: one_family_detached, primary_buildings: 2, lot_area: 1000000}
        expect: needs_review
        note: "whether every building holds this use not said"
      - given: {use: one_family_detached, lot_area: 1000000}
        expect: needs_review
        note: "the primary buildings not counted"
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 30000}
        expect: pass
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 29999}
        expect: fail
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 30000}
        expect: pass
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 29999}
        expect: fail
      - given: {use: fraternity_sorority_group_house, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 60000}
        expect: pass
      - given: {use: fraternity_sorority_group_house, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 59999}
        expect: fail
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 60000}
        expect: pass
        note: "Other use"
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 59999}
        expect: fail
      - given: {use: one_family_attached, primary_buildings: 1, lot_area: 1}
        expect: not_applicable
        note: "one primary building of a use whose figure grows with units, rooms or occupants: its own rule decides"
      - given: {use: one_family_attached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: multiple_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: dormitory, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
    notes: >-
      §325-8B(1): every residential district's lot-size figure applies again to each further primary use in a separate
      building on the lot (the code's own example: in R-2b, 3,000 sf for a house and 3,000 sf more for each further
      house). With one primary building this asks the use's own figure once, as the use's own lot-area rule does (a
      use whose figure grows with units, rooms or occupants is left to its own rule). With two or more, the lot needs
      the figure once per building, when every building holds the lot's use (primary_buildings_same_use); otherwise
      each building's own figure, added by hand. Gordium counts the primary buildings from the drawing where it can
      (one building, or none standing apart that could hold a home); a building standing apart that could (a large
      garage, a second house) is read both ways until the architect states the count. An accessory building (a garage,
      a shed, an accessory dwelling unit, §325-3B) isn't a primary building.
    drafted_by: claude
    status: draft

