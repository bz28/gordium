- id: CBD-100.lot_area_hotel_motel
  kind: rule
  topic: dimensions
  title: Motel lot size and frontage (chart p.5, §325-22A)
  applies_when: use == "hotel_motel"
  check: lot_area >= 20000 and lot_width >= 100
  review_when:
  - when: lot_width >= 10 and (lot_area < 20000 or lot_width < 100)
    reason: >-
      Enough for the CBD column's motel rows (no lot size, 10 ft wide), not for §325-22A's 20,000 sf and 100 ft. The chart's
      use row is "Hotel, motel" but §325-22 is for motels; a hotel that isn't a motel is held to the other-use row. Say which
      it is, and which governs a motel here (an open question).
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Motel, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Other use, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Width, row: Motel, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Width, row: Other use, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Primary Uses, row: 'Hotel, motel', column: Central Business}
  - file: chapter_325_zoning_2026-10.pdf
    page: 64
    lines: [12, 13]
    quote: >-
      A. Lot size and frontage. Motels shall maintain a minimum lot size of 20,000 square feet and a minimum frontage of 100
      feet on a public right-of-way.
  - file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [27, 30]
    quote: >-
      (6) Column 6: Minimum Lot Size, Area in Square Feet. Lots hereafter used for a permitted use in each use district shall
      be of a size equal to or greater than the total square feet indicated in this column, subject to the further regulations
      of Column 7 of the District Regulations Chart and of Article V.
  - file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [31, 34]
    quote: >-
      (7) Column 7: Minimum Lot Size, Width in Feet at Street Line. Lots hereafter used for a permitted use in each use district
      shall have frontage measured on a public right-of-way equal to or greater than the width specified in this column, subject
      to the further regulations of Column 6 of the District Regulations Chart and of Article V.
  examples:
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 100}
    expect: pass
    note: a motel's 20,000 sf and 100 ft (§325-22A)
  - given: {use: hotel_motel, lot_area: 5000, lot_width: 10}
    expect: needs_review
    note: the chart's motel rows (10 ft, no lot size) but not §325-22A's
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 99.99}
    expect: needs_review
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 9.99}
    expect: fail
    note: short even of the chart's 10 ft
  - given: {use: retail_store_or_service_commercial, lot_area: 1, lot_width: 1}
    expect: not_applicable
  notes: >-
    The CBD column's motel lot-size cell is blank and its width is 10 ft (chart p.5); §325-22A asks every motel for 20,000
    sf and 100 ft. Gordium passes a motel only with both, reviews one with the chart's 10 ft, and fails less.
  open_questions:
  - >-
    A motel in a CBD district: does §325-22A's 20,000 sf and 100 ft frontage govern, or the CBD column's motel rows (no lot
    size, 10 ft wide)?
  research:
  - question: >-
      A motel in a CBD district: does §325-22A's 20,000 sf and 100 ft frontage govern, or the CBD column's motel rows (no
      lot size, 10 ft wide)?
    searched: [325-22A, 325-8A, 325-8B, 325-8D]
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 64
      lines: [12, 13]
      quote: >-
        A. Lot size and frontage. Motels shall maintain a minimum lot size of 20,000 square feet and a minimum frontage of
        100 feet on a public right-of-way.
    why_open: >-
      The same question as B-4's and B-5's (§5.24): §325-8B(8) makes every chart column subject to Article V, which holds
      §325-22, so the stricter figure reads as governing; the chart's CBD motel rows (blank lot size, 10 ft) may mean small-lot
      motels were meant downtown. No City record found.
  drafted_by: claude
  status: draft
- id: CBD-100.lot_width
  kind: rule
  topic: dimensions
  title: Minimum lot width, 10 ft (chart p.5, §325-8A(7))
  applies_when: use != "hotel_motel"
  check: lot_width >= 10
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Width, row: Other use, column: Central Business}
  - file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [31, 34]
    quote: >-
      (7) Column 7: Minimum Lot Size, Width in Feet at Street Line. Lots hereafter used for a permitted use in each use district
      shall have frontage measured on a public right-of-way equal to or greater than the width specified in this column, subject
      to the further regulations of Column 6 of the District Regulations Chart and of Article V.
  examples:
  - given: {use: business_or_professional_office, lot_width: 10}
    expect: pass
    note: exactly the minimum
  - given: {use: multiple_family, lot_width: 9.99}
    expect: fail
  - given: {use: hotel_motel, lot_width: 1}
    expect: not_applicable
  notes: >-
    The CBD column's width rows are 10 ft for a motel and every other use. Its lot-size rows are "-" for every use (and blank
    for a motel): no minimum lot area, so this district has no lot-size rule but a motel's (§325-22A).
  drafted_by: claude
  status: draft
