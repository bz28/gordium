  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: Central Business}
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [8, 9]
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 100) to each yard, one to one'}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Height in feet, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [6, 6]
    quote: CBD-50, -60, -85, -100, -120, -140
    not_limits: {50: a district name (CBD-50), 60: a district name (CBD-60), 85: a district name (CBD-85), 120: a district
        name (CBD-120), 140: a district name (CBD-140)}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [39, 40]
    quote: >-
