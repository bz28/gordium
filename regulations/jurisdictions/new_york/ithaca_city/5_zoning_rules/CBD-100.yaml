    lines: [19, 19]
    quote: D. Additional restrictions in the CBD districts.
  - file: chapter_325_zoning_2026-10.pdf
    page: 29
    lines: [4, 11]
    quote: >-
      (3) All properties located in the CBD district that contain a storefront that fronts on the Primary Commons must contain
      an active use on the street level for that portion of the building that fronts onto the Primary Commons. Additionally,
      all properties located within the boundaries shown on the map, entitled "Proposed Boundary for Mandatory Street Level
      Active Use Overlay Zone (SLAUOZ)-July 2017" must also contain active use on the street level for the portions of the
