- id: CBD-100.accessory_dwelling_unit
  kind: flag
  topic: density_and_occupancy
  title: 'Accessory dwelling unit: the chart''s cell is blank'
  applies_when: accessory_dwelling_unit
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Accessory Uses, row: Accessory Dwelling Unit, column: Central Business}
  - file: chapter_325_zoning_2026-10.pdf
    page: 4
    lines: [7, 11]
    quote: >-
      ACCESSORY DWELLING UNIT (ADU) — A smaller, secondary dwelling unit located on the same lot as a primary residential,
      commercial, or mixed-use structure. An ADU must have a separate entrance from the outside of the building or through
      a common hall and must provide living, cooking, sanitary, and sleeping facilities. All ADUs must adhere to building
      code regulations for residential use.
  notes: >-
    Chart p.4's accessory dwelling unit row has no mark in the CBD column (neither • nor -), so whether one is permitted here
    is unsettled; check with the City.
  open_questions:
  - >-
    Chart p.4's accessory dwelling unit row is blank for the CBD districts: is an accessory dwelling unit permitted in CBD-100?
  research:
  - question: >-
      Chart p.4's accessory dwelling unit row is blank for the CBD districts: is an accessory dwelling unit permitted in CBD-100?
    searched: [325-28, 325-28A, 325-28B, 325-28C, '325-3B:accessory_dwelling_unit', 325-8B, 325-8D]
    sources: []
    why_open: >-
      §325-3B defines an ADU as on the lot of "a primary residential, commercial, or mixed-use structure", which reads as
      allowing one beside a commercial building; the chart marks it • in B-1a to B-2d and leaves B-4, B-5 and CBD blank (§5.27).
      §325-8D says nothing of ADUs. No City record found that says whether blank means not permitted.
  drafted_by: claude
  status: draft
- id: CBD-100.parking
  kind: flag
  topic: parking_and_loading
  title: Off-street parking (chart p.15, §325-20)
  sources:
  - &id005
    file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [19, 21]
    quote: >-
      (4) Column 4: Off-Street Parking Requirement. The off-street parking spaces listed in this column shall be provided
      for each building hereafter erected or altered. In addition, see Article IV and § 325-20.
  - file: zoning_charts_2026-04.pdf
    page: 15
    lines: [7, 7]
    quote: B-4 B-5 CBD
  - file: zoning_charts_2026-04.pdf
    page: 15
    lines: [9, 9]
    quote: Minimum Parking Requirement (# spaces) [fn2]
  - file: zoning_charts_2026-04.pdf
    page: 15
    lines: [39, 39]
    quote: Other Uses - - See §325-20 See §325-20 - - -
    not_limits: {325: a section number}
  - &id006
    file: zoning_charts_2026-04.pdf
    page: 15
    lines: [61, 61]
    quote: (2) For all other uses see §325-20.
  - &id007
    file: chapter_325_zoning_2026-10.pdf
    page: 55
    lines: [6, 6]
    quote: >-
      [fn2] See also the District Regulations Chart[fn14] for districts in which off-street parking is not required.
    not_limits: {2: the footnote's number, 14: the footnote's number}
  notes: >-
    The CBD column on chart p.15 is "-" on every row, the "Other Uses" row included (where B-2A and B-2D say "See §325-20"),
    and §325-20D(3)(b)'s footnote 2 points to the chart "for districts in which off-street parking is not required": the strongest
    reading is that none is required downtown. Gordium still doesn't read "-" as none required (the same open question as
    B-1a, B-1b, B-4 and B-5, §5.28), and doesn't count parking yet, so every lot gets this flag.
  open_questions:
  - >-
    Chart p.15 gives "-" for every use in the CBD column: does that mean no off-street parking is required in CBD-100, or
    that §325-20 sets it?
  research:
  - question: >-
      Chart p.15 gives "-" for every use in the CBD column: does that mean no off-street parking is required in CBD-100, or
      that §325-20 sets it?
    searched: [325-8A, 325-20, 325-20B, 325-20D, 325-8D]
    sources:
    - *id005
    - *id006
    - *id007
    why_open: >-
      §325-8A(4) requires the spaces the chart's column lists; a "-" lists none. §325-20D(3)(b) footnote 2 says the chart
      shows "districts in which off-street parking is not required", which supports none, but the chart never says which marks
      mean that, and note 2 sends "all other uses" to §325-20, whose table gives counts by use. No City interpretation found;
      Gordium never reads "-" as none required (a flag).
  drafted_by: claude
  status: draft
