  notes: >-
    Chart p.4 has one column for every CBD sub-district, headed "CBD-50, -60, -85, -100, -120, -140" (note 1: see §325-8(D));
    CBD-100 is one of them. Its marks: • permitted (25 uses), SP a special permit (6), - not permitted (3). The chart has
    no legend; • and SP are read as for the residential chart (R-1b.use's finding chart_marks). A use the commercial chart
    doesn't list at all (a fraternity, a zero-lot-line house, an adult day care home) fails: §325-8B(3) makes permitted uses
    cumulative "except where otherwise indicated by specific prohibition or omission", and the chart omits them (Gordium's
    reading, the same as the B districts'). A permitted use may still be barred from a storefront at street level (§325-8D(3):
    the active_street_level_use flag).
