  notes: >-
    Where the lot has a storefront fronting the Primary Commons, or lies in the Mandatory Street Level Active Use Overlay
    Zone (SLAUOZ, July 2017 map; the address lookup shows it where it finds it), the street-level part of the building that
    fronts the Commons or the street must hold an active use (a store, a restaurant, a theater, a hotel, a bank, light hand
