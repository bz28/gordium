    page: 26
    lines: [28, 28]
    quote: >-
      (6) [fn3]In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be
    not_limits: {1: 'the district name R-1, not a number', 2: 'the district name R-2, not a number'}
  examples:
