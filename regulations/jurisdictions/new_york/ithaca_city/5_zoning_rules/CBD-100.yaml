  - file: chapter_325_zoning_2026-10.pdf
    page: 29
    lines: [15, 17]
    quote: >-
      (a) "Active uses" are defined as uses that encourage high levels of pedestrian activity and enliven the streetscape,
      and create well-lit spaces with ample visibility into the storefront area.
  - file: chapter_325_zoning_2026-10.pdf
    page: 29
    lines: [25, 28]
    quote: >-
      (b) Additional uses may be permitted if the Planning and Development Board determines them to be an active use and grants
      special approval for the use. The Planning Board may also grant a special approval of a nonactive use if a property
      owner is able to show that the physical structure is not easily adaptable to be used as one of the above-listed active
