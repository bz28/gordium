    cell: {section: Yard Dimensions, row: Front (minimum), column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (one side minimum), column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (other side minimum), column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: Central Business}
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [6, 7]
    quote: >-
      In any district, any main building may be erected to a height in excess of that specified for the district, provided
      that:
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [8, 9]
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 100) to each yard, one to one'}
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [11, 12]
    quote: >-
      (3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that
      district.
  examples:
  - given: {building_height: 100, front_yard: 0, side_yard_smaller: 0, side_yard_larger: 0, rear_yard: 10}
    expect: pass
    note: 'exactly 100 ft (note 5: the suffix), built to the street and side lot lines'
  - given: {building_height: 100.01, front_yard: 0, side_yard_smaller: 0, side_yard_larger: 0, rear_yard: 10}
    expect: fail
    note: over the limit, so every yard must grow by the extra height
  - given: {building_height: 110.0, front_yard: 10.0, side_yard_smaller: 10.0, side_yard_larger: 10.0, rear_yard: 20.0}
    expect: pass
    note: the most the bonus allows (10% of 100 = 10 ft), each yard 10 ft larger
  - given: {building_height: 110.01, front_yard: 60, side_yard_smaller: 60, side_yard_larger: 60, rear_yard: 90}
    expect: fail
    note: past the bonus, however large the yards
  - given: {building_height: 102, front_yard: 1.99, side_yard_smaller: 2, side_yard_larger: 2, rear_yard: 12}
    expect: fail
    note: the front yard must be 0 + 2
  - given: {building_height: 102, front_yard: 2, side_yard_smaller: 1.99, side_yard_larger: 2, rear_yard: 12}
    expect: fail
    note: each side yard must be 0 + 2
  - given: {building_height: 102, front_yard: 2, side_yard_smaller: 2, side_yard_larger: 2, rear_yard: 11.99}
    expect: fail
    note: the rear yard must be 10 + 2
  notes: >-
    Note 5: each CBD sub-district's maximum height is its suffix, so CBD-100's is 100 ft. The bonus (§325-16C): 10% of 100
    ft = 10 ft, so at most 110 ft, with every required yard 1 ft larger per extra foot (the CBD column: front, sides "-",
    rear 10 ft). With no front or side yard required, Gordium still asks a building using the bonus for front and side yards
    of the extra height, the cautious reading of §325-16C(1); see the open question.
  open_questions:
  - >-
    §325-16C(1): CBD-100 requires no front or side yard. Does a building using the height bonus need front and side yards
    of the extra height, or none?
  research:
  - question: >-
      §325-16C(1): CBD-100 requires no front or side yard. Does a building using the height bonus need front and side yards
      of the extra height, or none?
    searched: [325-16C, 325-8A, 325-8D, '325-3B:front_yard']
    sources: []
    why_open: >-
      "Each required front, side and rear yard is increased": with no front or side yard required, there may be no required
      yard to increase, or a zero-foot one that grows. Neither the law nor a City decision found says which (the same question
      as B-2a's and B-4's front yard, §5.25). Gordium uses the stricter reading (yards of the extra height).
  drafted_by: claude
  status: draft
- id: CBD-100.min_stories
  kind: rule
  topic: dimensions
  title: At least two stories (chart p.5, §325-16G)
  check: stories >= 2
  review_when:
  - when: stories < 2 and building_area <= 500
    reason: >-
      Chart note 6 lifts the minimum height for development whose footprint is 500 sf or less, but §325-16G requires two stories
      of every new primary use building in this district with no such exception. The two disagree on a building this small
      (an open question); check it with the City.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Minimum Building Height [fn3,6]', row: Number of stories, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [6, 6]
    quote: CBD-50, -60, -85, -100, -120, -140
    not_limits: {50: a district name (CBD-50), 60: a district name (CBD-60), 85: a district name (CBD-85), 100: a district
        name (CBD-100), 120: a district name (CBD-120), 140: a district name (CBD-140)}
  - &id001
    file: chapter_325_zoning_2026-10.pdf
    page: 48
    lines: [13, 15]
    quote: >-
      G. Notwithstanding anything to the contrary contained herein, in the CBD-60, CBD-85, CBD-100, CBD-120, CBD-140, B-1a,
      B-1b, B-2c, and B-2d Zoning Districts, no primary use building shall be erected that is less than two stories in any
      of these zones.
    not_limits: {60: a district name (CBD-60), 85: a district name (CBD-85), 100: a district name (CBD-100), 120: a district
        name (CBD-120), 140: a district name (CBD-140), 1: 'district names (B-1a, B-1b)'}
  - &id003
    file: zoning_charts_2026-04.pdf
    page: 5
    lines: [41, 42]
    quote: >-
      (6) Minimum building height requirement shall not apply to development, including additions and/or expansions of existing
      development where the new development or addition or expansion of the existing development does not exceed a footprint
      of 500 square feet.
  examples:
  - given: {stories: 2, building_area: 1200}
    expect: pass
    note: two stories, at the minimum
  - given: {stories: 1, building_area: 1200}
    expect: fail
    note: a one-story primary building
  - given: {stories: 1, building_area: 500}
    expect: needs_review
    note: note 6's 500 sf footprint, which §325-16G doesn't have
  - given: {stories: 1, building_area: 500.01}
    expect: fail
  notes: >-
    §325-16G also holds an addition to an existing building to two stories where the additions pass 50% of the existing building
    area; Gordium checks the building as drawn, as new construction.
  open_questions:
  - >-
    Does chart note 6 (no minimum height for development of 500 sf of footprint or less) also lift §325-16G's two-story minimum,
    which states no such exception?
  research:
  - question: >-
      Does chart note 6 (no minimum height for development of 500 sf of footprint or less) also lift §325-16G's two-story
      minimum, which states no such exception?
    searched: [325-16G, 325-8A, 325-8B]
    sources:
    - &id002
      file: chapter_325_zoning_2026-10.pdf
      page: 26
      lines: [4, 8]
      quote: >-
        (15) Column 16: Minimum Height of Building, Height in Feet. Buildings hereafter erected shall have a minimum height
        as specified herein; provided, however, that the requirements of this column shall not apply to development, including
        additions and/or expansions of existing development where the new development or addition or expansion of the existing
        development does not exceed a footprint of 500 square feet.
    - *id001
    why_open: >-
      §325-8A(15)'s 500 sf exception is written for Column 16 (minimum height in feet); the chart puts note 6 on the heading
      over both the stories and the feet rows; §325-16G's stories minimum, "notwithstanding anything to the contrary", has
      none. No City decision found.
  drafted_by: claude
  status: draft
- id: CBD-100.min_height
  kind: rule
  topic: dimensions
  title: Minimum building height, 25 ft (chart p.5, §325-8A(15))
  check: building_height >= 25 or building_area <= 500
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Minimum Building Height [fn3,6]', row: Height in feet, column: Central Business}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [6, 6]
    quote: CBD-50, -60, -85, -100, -120, -140
    not_limits: {50: a district name (CBD-50), 60: a district name (CBD-60), 85: a district name (CBD-85), 100: a district
        name (CBD-100), 120: a district name (CBD-120), 140: a district name (CBD-140)}
  - *id002
  - *id003
  examples:
  - given: {building_height: 25, building_area: 1200}
    expect: pass
    note: exactly the minimum
  - given: {building_height: 24.99, building_area: 1200}
    expect: fail
  - given: {building_height: 12, building_area: 500}
    expect: pass
    note: a footprint of 500 sf or less is exempt
  - given: {building_height: 12, building_area: 500.01}
