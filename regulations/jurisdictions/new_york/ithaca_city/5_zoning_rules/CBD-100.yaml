- id: CBD-100.accessory_buildings
  kind: rule
  topic: dimensions
  title: 'Accessory buildings: 3 ft side and rear (§325-25)'
  applies_when: accessory_buildings > 0
  check: (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [34, 36]
    quote: >-
      Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures,
      shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be
      governed by the requirements below:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [37, 40]
    quote: >-
      A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished
      grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further
      provisions of this section. Corner lots shall be considered to have two front yards.
    not_limits:
      2: >-
        two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street
        line), not a limit
  - file: chapter_325_zoning_2026-10.pdf
    page: 67
    lines: [6, 9]
    quote: >-
      C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line
      or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six
      feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section.
    not_limits:
      1: the district name R-1, not a number of feet
      6: >-
        six feet applies in R-1 districts only; in a CBD district it is three feet (accessory_side_yard >= 3)
  examples:
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
    expect: pass
    note: exactly 3 ft from the side and rear lot lines
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99,
      accessory_rear_yard: 3}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
    expect: pass
    note: not frame, under the readings that give it no distance
  - given: {accessory_buildings: 0}
    expect: not_applicable
  notes: >-
    CBD-100 is not an R-1 District, so §325-25C's 3 ft applies. The CBD districts require no front yard, so §325-25A keeps
    an accessory building out of none.
  drafted_by: claude
  status: draft
- id: CBD-100.transition_yards
  kind: flag
  topic: dimensions
  title: 'Next to a residential lot: that district''s yards (§325-19A, B)'
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 49
    lines: [23, 25]
    quote: >-
      A. [fn12]Side yard and rear yard transition. Where a lot in a business or industrial district abuts a lot in a residential
      district, there shall be provided along such abutting lines a yard equal in width or depth to that required in the residential
      district. (See illustration below.)
  - file: chapter_325_zoning_2026-10.pdf
    page: 50
    lines: [3, 6]
    quote: >-
      B. Front yard transition. Where frontage is partly in a residential and partly in a business or industrial district,
      the front yard depth in the business or industrial district shall be equal to 1/2 the required front yard depth of the
      residential district for a distance of at least 50 feet into the business or industrial district. (See illustration
      below.)
  - *id004
  notes: >-
    CBD-100 is a business district (§325-4: "CBD Central Business"), so §325-19A and B apply. Gordium doesn't know yet whether
    a lot next to this one is in a residential district, so every CBD lot gets this flag: where it abuts a residential lot,
    the yard along that line must be the residential district's (chart note 8 keeps such a yard out of the 100% coverage);
    where the street frontage is partly residential, the front yard is half the residential one for at least 50 ft. Check
    by hand (the City's zoning map shows the neighbours).
  drafted_by: claude
  status: draft
