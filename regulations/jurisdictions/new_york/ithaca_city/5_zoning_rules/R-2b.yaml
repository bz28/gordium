  - id: R-2b.front_yard
    kind: rule
    topic: dimensions
    title: "Front yard minimum (chart p.3)"
    check: front_yard >= 10
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [37, 37]
        quote: "Front (minimum) 25 ft 25 ft 25 ft 10 ft"
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [7, 9]
        quote: "C. Corner lot transition. On corner lots in residential districts; buildings must be erected so that yards facing public streets shall conform to the minimum front yard requirements of said residential district. Such lots shall be deemed to have two adjoining front yards."
        not_limits: {2: "two adjoining front yards: which yards are front yards on a corner lot (measured to every street line), not a limit"}
    examples:
      - given: {front_yard: 15}
        expect: pass
      - given: {front_yard: 10}
        expect: pass
        note: exactly at the minimum (R-2A's is 25 ft)
      - given: {front_yard: 9.99}
        expect: fail
    notes: >-
      On a corner lot every yard facing a street is a front yard (§325-19C; the corner_lot_two_front_yards finding in
      definitions.yaml): front_yard is the least distance from any street lot line, so each street-facing yard must be
      10 ft. §325-11B(3)(e) gives the same front yard for R-2b ("10 feet in the R-2b, R-3a and R-3b Zones").
    drafted_by: claude
    status: draft

  - id: R-2b.side_yards
    kind: rule
    topic: dimensions
    title: "Side yards minimum: one side 10 ft, the other 5 ft (chart p.3)"
    check: side_yard_smaller >= 5 and side_yard_larger >= 10
    sources:
