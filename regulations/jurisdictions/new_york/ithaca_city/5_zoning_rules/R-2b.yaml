        expect: fail
        note: the narrower side yard must be 5 + 2 = 7
      - given: {building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 11.99, rear_yard: 27, lot_depth: 100}
        expect: fail
        note: the wider side yard must be 10 + 2 = 12
      - given: {building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 26.99, lot_depth: 100}
        expect: fail
        note: the rear yard must be 25 + 2 = 27
