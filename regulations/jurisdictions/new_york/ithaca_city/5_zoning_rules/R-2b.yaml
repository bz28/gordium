        expect: not_applicable
    notes: >-
      The requirement is worked out for each dwelling unit and added up: worked by hand, a two-family house with a
      3-bedroom and a 4-bedroom unit needs 1 + 2 = 3 spaces. Gordium measures the sleeping rooms of one dwelling unit
      only (sleeping_rooms), so it can't add them up yet: NEEDS REVIEW, added up by hand.
    drafted_by: claude
    status: draft

