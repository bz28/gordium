  - id: R-2b.loading
    kind: flag
    topic: parking_and_loading
    title: "Off-street loading for a neighborhood commercial facility (chart p.14, §325-21)"
    applies_when: use == "neighborhood_commercial_facility"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: Neighborhood commercial facility, column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: Nonresidential use, column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [25, 25]
        quote: "(2) See §325-21."
    examples:
