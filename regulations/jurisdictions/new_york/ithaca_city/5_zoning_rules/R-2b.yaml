      R-2B's 35% is the fourth value of the line ("20% 25% 30% 35% 35% 35% 40% 25%": eight values, because R-2C's
      stacked "35%/40% /50%" is printed on the lines above and below, so the fifth 35% is R-3A's, not R-2C's).
