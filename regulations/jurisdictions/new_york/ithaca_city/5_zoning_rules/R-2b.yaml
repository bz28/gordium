        expect: needs_review
      - given: {use: two_family}
        expect: not_applicable
    notes: >-
      The R-2A, R-2B and R-2C columns share one cell per row on p.14: a neighborhood commercial facility "See
      §325-21"; other nonresidential uses "Allowed by variance" (note 2: see §325-21); a multiple dwelling with 25+
      units and a nursing home or hospital "-" (those uses are not permitted in R-2). Gordium doesn't measure floor
      space or loading spaces, so this is NEEDS REVIEW, worked out by hand under §325-21. (The nonresidential
      "Allowed by variance" row is not covered yet, as in R-1b.)
