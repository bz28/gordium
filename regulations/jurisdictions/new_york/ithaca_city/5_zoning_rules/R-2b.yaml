    drafted_by: claude
    status: draft

  - id: R-2b.stories
    kind: rule
    topic: dimensions
    title: "Maximum number of stories (chart p.3)"
    check: stories <= 3
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Number of stories, column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [30, 30]
        quote: "Number of stories 3 3 3 3"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: "(2) In all districts, the number of stories permitted may not be exceeded."
    examples:
      - given: {stories: 2}
        expect: pass
      - given: {stories: 3}
        expect: pass
        note: exactly at the limit
      - given: {stories: 4}
        expect: fail
    notes: >-
      The 3-story limit has no bonus: it still applies when the height bonus (R-2b.height) is used. Stories are
      counted at the main entrance side (§325-8A(8)).
    drafted_by: claude
    status: draft

  - id: R-2b.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 35 or building_height <= 35 + 0.1 * 35
      and front_yard >= 10 + (building_height - 35)
      and side_yard_smaller >= 5 + (building_height - 35)
      and side_yard_larger >= 10 + (building_height - 35)
      and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft 35 ft 35 ft 35 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
