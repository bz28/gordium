  - id: R-2b.lot_width_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot width, other use (chart p.3)"
    applies_when: use not in ["one_family_detached", "one_family_semi_detached", "two_family"]
    check: lot_width >= 40
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Minimum Lot Width, row: Other use, column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [28, 28]
        quote: "Other use 75 ft 60 ft 50 ft 40 ft 40 ft 50 ft 50 ft 40 ft 125 ft"
    examples:
      - given: {use: church, lot_width: 40}
        expect: pass
      - given: {use: church, lot_width: 39.99}
        expect: fail
      - given: {use: church, lot_width: 35}
        expect: fail
