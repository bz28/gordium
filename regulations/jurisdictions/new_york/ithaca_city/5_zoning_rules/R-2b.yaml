# R-2b (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# the same way R-1b.yaml, R-1a.yaml and R-3a.yaml were. An ANSWER KEY for grading the drafting script: written
# without looking at anything the script drafted or recorded, from the City's documents only (2_extracted_text/, the
# chart read cell by cell, the section labels, the definitions), with R-1a.yaml and R-3a.yaml as the model of the
# format.
#
# Why R-2b: the middle two-family district (the chart's fourth column). It has R-2a's uses but much smaller lots
# (3,000 sf, 35 ft wide), a 10 ft front yard, and unequal side yards (10 ft and 5 ft, like R-3a), so a drafter that
# copies R-2a's or R-1's yards, or reads R-2C's stacked cells into R-2B, fails here.
#
# Every chart number was read two ways and agrees: the chart's text line (quoted), and the chart reader's R-2B cell
# (cited); R-2B is the fourth value in each row. Lot coverage and the front yard are confirmed a third way by
# §325-11B(3)(d) and (e) (cluster subdivisions: "R-2b 35" percent; "10 feet in the R-2b, R-3a and R-3b Zones"), and
# the lot size a fourth way by §325-8B(1)'s own example ("in R-2b Districts, an area of 3,000 square feet is required
# for a one family house or a two-family house"). test_r1b_matches_chart.py checks the rules against the R-2B cells.
#
# Where R-2b differs from R-1b (chart p.3, column R-2B): uses (p.2, the same marks as R-2A: semi-detached and
# two-family dwellings permitted; nursery schools, adult day care homes and neighborhood commercial facilities by
# special permit); lot size 3,000 sf for a one-family detached, semi-detached or two-family dwelling and 4,000 sf for
# other uses; lot width 35 ft for those three and 40 ft for other uses; lot coverage 35%; front yard 10 ft; side
# yards 10 ft on one side and 5 ft on the other; accessory buildings 3 ft from side and rear lot lines (R-2b is not
# an R-1 District). The same as R-1b: 3 stories, 35 ft (bonus to 38.5 ft), rear 25% of the lot depth up to 50 ft
# but not less than 20 ft, parking (p.14).
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2: the private garage
# "for not more than three cars", note 6), accessory dwelling units (§325-28), occupancy limits (p.2 notes 1, 4;
# §325-3B DWELLING, ONE-FAMILY and TWO-FAMILY: in R-2, a family and not more than two unrelated individuals per
# unit), the South Hill Overlay (p.2 note 2, §325-8E), height exceptions for chimneys and similar (§325-16A, applied
# when measuring height), more than one main building on a lot (§325-8B(1)), cluster subdivisions (§325-11), loading
# for nonresidential uses ("Allowed by variance", p.14).
#
# Known gap (as in R-3a, not fixable in this file): on a corner lot one side yard is left, and the City checks it
# against Column 13 (5 ft in R-2b; the corner_lot_side_yard_column_13 finding). The measurements give that one yard
# as both side measures, and the rule language has no corner-lot measure, so R-2b.side_yards asks 10 ft of it: a
# stricter answer than the City's practice (a false fail, never a false pass) until a corner_lot measure exists.

district: R-2b
rules:

  - id: R-2b.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: >-
      use in ["one_family_detached", "one_family_semi_detached", "two_family", "church", "public_park_or_playground",
      "library_or_fire_station"]
    review_when:
      - when: >-
          use in ["cemetery", "public_utility_structure", "school", "nursery_school_or_child_day_care",
          "adult_day_care_home", "neighborhood_commercial_facility"]
        reason: >-
          Marked SP for R-2B on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities,
          schools, nursery schools and child day-care centers in R-2, neighborhood commercial facilities in R-2, and
          group or adult day-care facilities in R-2 as requiring a special permit from the Planning and Development
          Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked • for R-2B
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-2B}
      # marked SP for R-2B
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: R-2B}
      # marked - for R-2B (not permitted): the rows of the uses an R-2 drafter is most likely to let in
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [10, 10]
        quote: "One-family dwelling, detached, zero lot line [fn4] - - - - SP SP SP SP -"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [12, 12]
        quote: "One-family dwelling, attached [fn4] - - - - SP • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [14, 14]
        quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [28, 28]
        quote: "(e) Nursery schools or child day-care centers in R-2, CR-2 and R-U Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [29, 30]
        quote: "(f) Neighborhood retail or service commercial facilities in R-2, R-3, CR-2, CR-3, and CR-4 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers", 3: "district names (R-3, CR-3), not numbers", 4: "a district name (CR-4), not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: "(n) Group or adult day-care facilities in R-2 and CR-2 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: one_family_semi_detached}
        expect: pass
        note: marked • for R-2B (- in R-1)
      - given: {use: two_family}
        expect: pass
        note: marked • for R-2B (- in R-1)
      - given: {use: one_family_attached}
        expect: fail
        note: marked - for R-2B (SP in R-2C, • in R-3)
      - given: {use: one_family_detached_zero_lot_line}
        expect: fail
        note: marked - for R-2B (SP in R-2C)
      - given: {use: multiple_family}
        expect: fail
      - given: {use: dormitory}
        expect: fail
      - given: {use: nursing_home}
        expect: fail
      - given: {use: nursery_school_or_child_day_care}
        expect: needs_review
        note: SP in R-2 (- in R-1, • in R-3)
      - given: {use: adult_day_care_home}
        expect: needs_review
      - given: {use: neighborhood_commercial_facility}
        expect: needs_review
      - given: {use: school}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: adult_day_care_same_use
      question: The chart's use is "Adult day care home"; §325-9B(1)(n) says "Group or adult day-care facilities in R-2".
        Are these the same use?
      kind: reading
      answer: 'The same use: §325-9B(1)(n) is the only special-permit item for adult day care, it names R-2, and the
        chart marks the use SP in exactly R-2A, R-2B and R-2C. Either way it needs a special permit, so the result is
        NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: Group or adult day-care facilities in R-2 and CR-2 Districts
      strength: strong
      confirm_with: the architects
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      R-2B is the fourth mark in each row of page 2 (R-1A, R-1B, R-2A, R-2B, ...). Its marks, row by row against the
      chart reader's R-2B cells: • detached, semi-detached and two-family dwellings, church, park, library or fire
      station; SP cemetery, public utility, school, nursery school, adult day care home, neighborhood commercial
      facility; - for the rest (zero-lot-line and attached one-family dwellings, multiple dwellings, fraternity houses,
      dormitories, nursing homes, hospitals, bed-and-breakfast inns). R-2B's marks are the same as R-2A's in every
      primary-use row; R-2C, next to it, marks the zero-lot-line and attached houses SP. What the marks mean is Gordium's reading (the chart_marks finding).
    drafted_by: claude
    status: draft

  - id: R-2b.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 3000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 4000}
        expect: pass
      - given: {use: one_family_detached, lot_area: 3000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_detached, lot_area: 2999}
        expect: fail
        note: R-2C's 2,500 sf (one occupant) is not enough in R-2b
      - given: {use: two_family, lot_area: 2000}
        expect: not_applicable
    notes: >-
      The fourth value of the row is R-2B's (3,000 sf, after R-2A's 5,000). Chart note 3 points to §325-8B(1): the
      minimum applies to each main building on the lot, and §325-8B(1)'s own example is R-2b's: 3,000 sf for a
      one-family or two-family house, and another 3,000 sf for each further house on the lot.
    drafted_by: claude
    status: draft

  - id: R-2b.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_area >= 3000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: one_family_semi_detached, lot_area: 3000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_semi_detached, lot_area: 2999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 2000}
        expect: not_applicable
    notes: >-
      A semi-detached dwelling is one building holding two one-family dwellings that share a party wall (§325-3B).
      R-2B's value is the second in the row (R-1A and R-1B are "-"). In R-2b the building stands whole on one lot:
      the side yards (10 ft and 5 ft) leave no 0 ft side for a party wall on a lot line (only R-2C's note 15 allows
      that).
    drafted_by: claude
    status: draft

  - id: R-2b.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Minimum lot size, two-family dwelling (chart p.3)"
    applies_when: use == "two_family"
    check: lot_area >= 3000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 4000}
        expect: pass
      - given: {use: two_family, lot_area: 3000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 2999}
        expect: fail
      - given: {use: two_family, lot_area: 2000}
        expect: fail
        note: R-2C's 2,000 sf (note 5) is not enough in R-2b
    drafted_by: claude
    status: draft

  - id: R-2b.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: use not in ["one_family_detached", "one_family_semi_detached", "two_family"]
    check: lot_area >= 4000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
    examples:
      - given: {use: church, lot_area: 5000}
        expect: pass
      - given: {use: church, lot_area: 4000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 3999}
        expect: fail
      - given: {use: school, lot_area: 3000}
        expect: fail
        note: enough for a house in R-2b, not for another use
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Other uses in R-2b: church, park, library or fire station, cemetery, public utility, school, nursery school,
      adult day care home, neighborhood commercial facility. The uses marked "-" on p.2 fail R-2b.use whatever their
      lot; their lot is checked here too, as R-1b does.
    drafted_by: claude
    status: draft

  - id: R-2b.lot_width_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot width, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_width >= 35
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Minimum Lot Width, row: "One-family dwelling, detached", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [21, 21]
        quote: "One-family dwelling, detached 75 ft 50 ft 45 ft 35 ft 40 ft 40 ft 50 ft 30 ft 75 ft"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [31, 33]
        quote: "(7) Column 7: Minimum Lot Size, Width in Feet at Street Line. Lots hereafter used for a permitted use in each use district shall have frontage measured on a public right-of-way equal to or greater than the width specified in this column"
    examples:
      - given: {use: one_family_detached, lot_width: 50}
        expect: pass
      - given: {use: one_family_detached, lot_width: 35}
        expect: pass
        note: exactly at the minimum (R-2A's 45 ft would fail it)
      - given: {use: one_family_detached, lot_width: 34.99}
        expect: fail
      - given: {use: two_family, lot_width: 20}
        expect: not_applicable
    drafted_by: claude
    status: draft

  - id: R-2b.lot_width_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot width, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_width >= 35
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Minimum Lot Width, row: "One-family dwelling, semi-detached", column: R-2B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [23, 23]
        quote: "One-family dwelling, semi-detached - - 45 ft 35 ft 50 ft 40 ft 50 ft 30 ft 100 ft"
    examples:
      - given: {use: one_family_semi_detached, lot_width: 35}
        expect: pass
      - given: {use: one_family_semi_detached, lot_width: 34.99}
