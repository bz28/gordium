- id: B-2a.stories
  kind: rule
  topic: dimensions
  title: Maximum number of stories (chart p.5)
  check: stories <= 4
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Number of stories, column: B-2A}
  - file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [35, 36]
    quote: >-
      (8) Column 8: Maximum Height of Building, Number of Stories. Buildings hereafter erected shall be limited to the number
      of stories herein specified, computed at the main entrance side.
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [10, 10]
    quote: (2) In all districts, the number of stories permitted may not be exceeded.
  examples:
  - given: {stories: 4}
    expect: pass
    note: exactly at the limit
  - given: {stories: 5}
    expect: fail
  notes: The number of stories is not raised by the height bonus (§325-16C(2)).
  drafted_by: claude
  status: draft
- id: B-2a.height
  kind: rule
  topic: dimensions
  title: Maximum building height, with the §325-16C bonus
  check: >-
    building_height <= 40 or building_height <= 40 + 0.1 * 40 and front_yard >= building_height - 40 and side_yard_smaller
    >= 5 + (building_height - 40) and side_yard_larger >= 10 + (building_height - 40) and rear_yard >= max(min(0.15 * lot_depth,
    20), 10) + (building_height - 40)
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Height in feet, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [37, 37]
    quote: (3) See §325-16.
