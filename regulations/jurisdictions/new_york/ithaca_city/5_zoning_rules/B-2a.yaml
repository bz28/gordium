# B-2a (City of Ithaca, General Business): rules drafted by Claude by reading the zoning charts (April 2026: p.4 uses, p.5
# dimensions, p.15 parking and loading) and Chapter 325, 2026-11-22. Draft (architect approval is deferred for now,
# decided 2026-10-19). Every chart value was read by hand and is checked against the chart reader's B-2A cells
# (packages/document_extraction/tests/test_b_districts_match_chart.py); every quote is verified against the PDF text by
# `python -m rule_format`. Written under regulations/document_extraction_guide/drafting_rules.md, the way the residential
# rulebooks were (R-3a is the closest: the same multi-family lot-size note), laid out with a small script of Claude's
# own so the six B columns are written alike. The plan, and what isn't covered yet: docs/decisions/2026-11-22_commercial_districts.md.
#
# Flags here (needs review on every lot they apply to): the transition yards next to residential lots (§325-19),
# parking and loading, accessory dwelling units, motels' and gasoline stations' extra standards.
# Not covered yet: height exceptions (§325-16A, B), signs (Chapter 272), design review (Chapter 160), site plan review,
# the performance standards (§325-23).

district: B-2a
rules:
- id: B-2a.use
  kind: rule
  topic: uses
  title: Permitted primary uses (chart p.4)
  check: >-
    use in ["one_family_detached", "one_family_semi_detached", "one_family_attached", "two_family", "multiple_family", "dormitory",
    "church", "public_park_or_playground", "library_or_fire_station", "nursery_school_or_child_day_care", "adult_day_care_facility",
    "nursing_home", "funeral_home", "business_or_professional_office", "bank", "office_of_government", "school", "retail_store_or_service_commercial",
    "restaurant_or_tavern", "club_or_lodge", "light_hand_fabrication", "place_of_public_assembly", "hotel_motel", "urban_beverage_producer"]
  review_when:
  - when: use == "cemetery"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(b)
      lists cemeteries in all districts.
  - when: use == "public_utility_structure"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(c)
      lists public utility facilities in all districts.
  - when: use == "neighborhood_commercial_facility"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(f)
      lists neighborhood retail or service commercial facilities only in R-2, R-3, CR-2, CR-3 and CR-4, so the chart's SP
      has no matching entry in the law's list; either way it isn't permitted by right here.
  - when: use == "hospital_or_sanitarium"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(g)
      lists hospitals or sanatoriums only in R-3, CR-3 and CR-4, so the chart's SP has no matching entry in the law's list;
      either way it isn't permitted by right here.
  - when: use == "bed_and_breakfast_inn"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(p)
      lists bed-and-breakfast inns in all districts.
  - when: use == "redemption_center"
    reason: >-
      Marked SP for B-2A on the zoning chart (p.4): a special permit from the Planning and Development Board. §325-9B(1)(o)
      lists redemption centers in B-2 Districts.
