- id: B-2a.yard_projections
  kind: rule
  topic: dimensions
  title: Eaves into required yards, at most 2 ft (§325-18B)
  check: >-
    front_yard_eaves >= max(building_height - 40, 0) - 2 and side_yard_smaller_eaves >= 5 + max(building_height - 40, 0)
    - 2 and side_yard_larger_eaves >= 10 + max(building_height - 40, 0) - 2 and rear_yard_eaves >= max(min(0.15 * lot_depth,
    20), 10) + max(building_height - 40, 0) - 2
  review_when:
  - when: >-
      (side_yard_smaller >= 10 + max(building_height - 40, 0) or side_yard_larger < 10 + max(building_height - 40, 0)) and
      side_yard_smaller_eaves >= 10 + max(building_height - 40, 0) - 2 and side_yard_larger_eaves >= 5 + max(building_height
      - 40, 0) - 2 and side_yard_larger_eaves < 10 + max(building_height - 40, 0) - 2 and front_yard_eaves >= max(building_height
      - 40, 0) - 2 and rear_yard_eaves >= max(min(0.15 * lot_depth, 20), 10) + max(building_height - 40, 0) - 2
    reason: >-
      Which side yard is the 10 ft one is open: the walls are at least that far from both side lot lines, or from neither,
      so either side may be. The eaves fit only if the side whose walls are farther from its line is the 5 ft one. Say which
      side is meant to be the 10 ft one.
  - when: >-
      (side_yard_smaller >= 10 + max(building_height - 40, 0) or side_yard_larger < 10 + max(building_height - 40, 0)) and
      side_yard_larger_eaves >= 10 + max(building_height - 40, 0) - 2 and side_yard_smaller_eaves >= 5 + max(building_height
      - 40, 0) - 2 and side_yard_smaller_eaves < 10 + max(building_height - 40, 0) - 2 and front_yard_eaves >= max(building_height
      - 40, 0) - 2 and rear_yard_eaves >= max(min(0.15 * lot_depth, 20), 10) + max(building_height - 40, 0) - 2
    reason: >-
      Which side yard is the 10 ft one is open: the walls are at least that far from both side lot lines, or from neither,
      so either side may be. The eaves fit only if the side whose walls are nearer to its line is the 5 ft one. Say which
      side is meant to be the 10 ft one.
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 49
    lines: [13, 16]
    quote: >-
      B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary
      projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that
      such features shall not project more than two feet into any required yard.
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Front (minimum), column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (one side minimum), column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (other side minimum), column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: B-2A}
  - *id003
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: *id004
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 40) to each yard, one to one'}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Height in feet, column: B-2A}
  examples:
  - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 0, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8,
      rear_yard_eaves: 13.0, lot_depth: 100, building_height: 38}
    expect: pass
    note: 'eaves exactly 2 ft into each required yard (rear: 15 − 2)'
  - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 0, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 8,
      rear_yard_eaves: 13.0, lot_depth: 100, building_height: 38}
    expect: fail
    note: an eave just over 2 ft into the 5 ft side yard
  - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 0, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8,
      rear_yard_eaves: 12.99, lot_depth: 100, building_height: 38}
    expect: fail
  - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 0, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99,
      rear_yard_eaves: 13.0, lot_depth: 100, building_height: 38}
    expect: fail
  - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 5, side_yard_smaller_eaves: 4, side_yard_larger_eaves: 15,
      rear_yard_eaves: 20.0, lot_depth: 100, building_height: 38}
    expect: needs_review
    note: >-
      walls 12 and 15 ft: either side may be the 10 ft one; the narrower side's eave fits only if it is the 5 ft one
  - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 5, side_yard_smaller_eaves: 10, side_yard_larger_eaves: 10,
      rear_yard_eaves: 20.0, lot_depth: 100, building_height: 38}
    expect: pass
    note: both eaves fit whichever side is the larger one
  - given: {side_yard_smaller: 9.5, side_yard_larger: 10, front_yard_eaves: 5, side_yard_smaller_eaves: 9, side_yard_larger_eaves: 5,
      rear_yard_eaves: 20.0, lot_depth: 100, building_height: 38}
    expect: fail
    note: only the wider side can be the 10 ft one, and its eave is 5 ft into it
  notes: >-
    The yards themselves are measured to the walls; this rule measures the same yards to the outermost part, eaves included,
    and lets that be up to 2 ft less. Which side carries the 10 ft minimum follows the walls: only a side whose walls are
    at least 10 ft from its line can; where both can, or neither, the eaves must fit both ways, else needs review (as R-3a.yard_projections).
  drafted_by: claude
  status: draft
- id: B-2a.accessory_buildings
  kind: rule
  topic: dimensions
  title: 'Accessory buildings: 3 ft side and rear (§325-25)'
  applies_when: accessory_buildings > 0
  check: (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [34, 36]
    quote: >-
      Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures,
      shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall
      be governed by the requirements below:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [37, 40]
    quote: >-
      A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above
      finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under
      the further provisions of this section. Corner lots shall be considered to have two front yards.
    not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured\
        \ to every street line), not a limit"}
  - file: chapter_325_zoning_2026-10.pdf
    page: 67
    lines: [6, 9]
    quote: >-
      C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line
      or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than
      six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of
      this section.
    not_limits: {1: 'the district name R-1, not a number of feet', 6: six feet applies in R-1 districts only; in a B district
        it is three feet (accessory_side_yard >= 3)}
  examples:
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3,
      accessory_rear_yard: 3}
    expect: pass
    note: exactly 3 ft from the side and rear lot lines
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99,
      accessory_rear_yard: 3}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3,
      accessory_rear_yard: 2.99}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1,
      accessory_rear_yard: 1}
    expect: pass
    note: not frame, under the readings that give it no distance
  - given: {accessory_buildings: 0}
    expect: not_applicable
  notes: >-
    B-2A is not an R-1 District, so §325-25C's 3 ft applies. B-2A requires no front yard, so §325-25A keeps an accessory
    building out of none.
  drafted_by: claude
  status: draft
- id: B-2a.transition_yards
  kind: flag
  topic: dimensions
  title: 'Next to a residential lot: that district''s yards (§325-19A, B)'
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 49
    lines: [23, 25]
    quote: >-
      A. [fn12]Side yard and rear yard transition. Where a lot in a business or industrial district abuts a lot in a residential
      district, there shall be provided along such abutting lines a yard equal in width or depth to that required in the
      residential district. (See illustration below.)
  - file: chapter_325_zoning_2026-10.pdf
    page: 50
    lines: [3, 6]
    quote: >-
      B. Front yard transition. Where frontage is partly in a residential and partly in a business or industrial district,
      the front yard depth in the business or industrial district shall be equal to 1/2 the required front yard depth of
      the residential district for a distance of at least 50 feet into the business or industrial district. (See illustration
      below.)
  notes: >-
    Gordium doesn't know yet whether a lot next to this one is in a residential district, so every B-2A lot gets this flag:
    where it abuts a residential lot, the yard along that line must be the residential district's; where the street frontage
    is partly residential, the front yard is half the residential one for at least 50 ft. Check by hand (the City's zoning
    map shows the neighbours).
  drafted_by: claude
  status: draft
