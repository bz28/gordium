  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (other side minimum), column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: B-2A}
  - &id003
    file: zoning_charts_2026-04.pdf
    page: 5
    lines: [45, 45]
    quote: (9) But not less than 10 ft.
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [6, 7]
    quote: >-
      In any district, any main building may be erected to a height in excess of that specified for the district, provided
      that:
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: &id004 [8, 9]
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 40) to each yard, one to one'}
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [11, 12]
    quote: >-
      (3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that
      district.
  examples:
  - given: {building_height: 40, front_yard: 0, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 15.0, lot_depth: 100}
    expect: pass
    note: 'exactly 40 ft with every yard at its minimum (rear: 15% of 100 ft, at least 10)'
  - given: {building_height: 40.01, front_yard: 0, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 15.0, lot_depth: 100}
    expect: fail
    note: over the limit, so every yard must grow by the extra height
  - given: {building_height: 44.0, front_yard: 4.0, side_yard_smaller: 9.0, side_yard_larger: 14.0, rear_yard: 19.0, lot_depth: 100}
    expect: pass
    note: the most the bonus allows (10% of 40 = 4 ft), each yard 4 ft larger
  - given: {building_height: 44.01, front_yard: 60, side_yard_smaller: 60, side_yard_larger: 60, rear_yard: 90, lot_depth: 100}
    expect: fail
    note: past the bonus, however large the yards
  - given: {building_height: 42, front_yard: 1.99, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 17.0, lot_depth: 100}
    expect: fail
    note: the front yard must be 0 + 2
  - given: {building_height: 42, front_yard: 2, side_yard_smaller: 6.99, side_yard_larger: 12, rear_yard: 17.0, lot_depth: 100}
    expect: fail
    note: the narrower side yard must be 5 + 2
  - given: {building_height: 42, front_yard: 2, side_yard_smaller: 7, side_yard_larger: 11.99, rear_yard: 17.0, lot_depth: 100}
    expect: fail
    note: the wider side yard must be 10 + 2
  - given: {building_height: 42, front_yard: 2, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 16.99, lot_depth: 100}
    expect: fail
    note: the rear yard must be 15 + 2
  notes: >-
    The bonus: 10% of 40 ft = 4 ft, so at most 44 ft, with every required yard 1 ft larger per extra foot (B-2A: front none,
    sides 10 and 5, rear 15% of the lot depth, at most 20 ft, at least 10). B-2A requires no front yard ("-"): Gordium still
    asks a building using the bonus for a front yard of the extra height (a front yard of 0 increased one foot per foot),
    the cautious reading of §325-16C(1); see the open question.
  open_questions:
  - >-
    §325-16C(1): B-2A requires no front yard. Does a building using the height bonus need a front yard of the extra height,
    or none?
  research:
  - question: >-
      §325-16C(1): B-2A requires no front yard. Does a building using the height bonus need a front yard of the extra height,
      or none?
    searched:
    - 325-16C
    - 325-8A
    - 325-3B:front_yard
    sources: []
    why_open: >-
      "Each required front, side and rear yard is increased": with no front yard required, there may be no required front
      yard to increase, or a zero-foot one that grows. Neither the law nor a City decision found says which. Gordium uses
      the stricter reading (a front yard of the extra height).
  drafted_by: claude
  status: draft
