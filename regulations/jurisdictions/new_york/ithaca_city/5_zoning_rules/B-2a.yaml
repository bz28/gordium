- id: B-2a.lot_area
  kind: rule
  topic: dimensions
  title: Minimum lot size, every use but a motel (chart p.5)
  applies_when: use != "hotel_motel"
  check: lot_area >= 3000
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, detached', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, semi-detached', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, attached, by conversion', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, attached, new construction', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Two-family dwelling, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'Multiple family dwelling, by conversion', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'Multiple family dwelling, new construction', column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Other use, column: B-2A}
  - &id001
    file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [27, 30]
    quote: >-
      (6) Column 6: Minimum Lot Size, Area in Square Feet. Lots hereafter used for a permitted use in each use district
      shall be of a size equal to or greater than the total square feet indicated in this column, subject to the further
      regulations of Column 7 of the District Regulations Chart and of Article V.
  examples:
  - given: {use: retail_store_or_service_commercial, lot_area: 3000}
    expect: pass
    note: exactly the minimum
  - given: {use: multiple_family, lot_area: 2999.99}
    expect: fail
  - given: {use: hotel_motel, lot_area: 1}
    expect: not_applicable
    note: held to the motel row (lot_area_hotel_motel)
  notes: >-
    Every row but the motel's is 3,000 sf in B-2A, conversion or new construction alike, with no note (chart p.5); a lot's
    area does not grow with its units here.
  drafted_by: claude
  status: draft
- id: B-2a.lot_area_hotel_motel
  kind: rule
  topic: dimensions
  title: Motel lot size and frontage (chart p.5, §325-22A)
  applies_when: use == "hotel_motel"
  check: lot_area >= 20000 and lot_width >= 100
  review_when:
  - when: lot_area >= 3000 and lot_width >= 40 and (lot_area < 20000 or lot_width < 100)
    reason: >-
      Enough for the other-use row (3,000 sf, 40 ft), not for a motel's 20,000 sf and 100 ft (§325-22A). The chart's use
      row is "Hotel, motel" but its size rows are for a motel; a hotel that isn't a motel is held to the other-use row.
      Say which it is.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Motel, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Other use, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Width, row: Motel, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Width, row: Other use, column: B-2A}
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Primary Uses, row: 'Hotel, motel', column: B-2A}
  - file: chapter_325_zoning_2026-10.pdf
    page: 64
    lines: [12, 13]
    quote: >-
      A. Lot size and frontage. Motels shall maintain a minimum lot size of 20,000 square feet and a minimum frontage of
      100 feet on a public right-of-way.
  - *id001
  - &id002
    file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [31, 34]
    quote: >-
      (7) Column 7: Minimum Lot Size, Width in Feet at Street Line. Lots hereafter used for a permitted use in each use
      district shall have frontage measured on a public right-of-way equal to or greater than the width specified in this
      column, subject to the further regulations of Column 6 of the District Regulations Chart and of Article V.
  examples:
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 100}
    expect: pass
    note: a motel's 20,000 sf and 100 ft (§325-22A)
  - given: {use: hotel_motel, lot_area: 2999.99, lot_width: 100}
    expect: fail
    note: short even of the other-use figure
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 39.99}
    expect: fail
  - given: {use: hotel_motel, lot_area: 3000, lot_width: 100}
    expect: needs_review
    note: enough for a hotel (other use), not for a motel
  - given: {use: hotel_motel, lot_area: 20000, lot_width: 40}
    expect: needs_review
    note: a hotel's frontage, not a motel's
  - given: {use: retail_store_or_service_commercial, lot_area: 1, lot_width: 1}
    expect: not_applicable
  notes: B-2A's chart cells for a motel (20,000 sf, 100 ft) match §325-22A.
  drafted_by: claude
  status: draft
- id: B-2a.lot_width
  kind: rule
  topic: dimensions
