  - id: R-3aa.rear_yard
    kind: rule
    topic: dimensions
    title: "Rear yard minimum (chart p.3, note 16; lot depth §325-8A(14))"
    check: rear_yard >= max(min(0.25 * lot_depth, 50), 20)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
        not_limits: {2: "the two side lot lines: how lot depth is measured (measures.yaml lot_depth), not a limit"}
    examples:
      - given: {rear_yard: 30, lot_depth: 120}
        expect: pass
        note: exactly 25% of 120
      - given: {rear_yard: 29.99, lot_depth: 120}
        expect: fail
      - given: {rear_yard: 24, lot_depth: 120}
        expect: fail
        note: R-3A's 20% (24 ft) is not enough in R-3aa
      - given: {rear_yard: 50, lot_depth: 240}
        expect: pass
        note: 25% would be 60 ft; the chart caps it at 50 ft
      - given: {rear_yard: 49.99, lot_depth: 240}
        expect: fail
      - given: {rear_yard: 20, lot_depth: 60}
        expect: pass
        note: 25% would be 15 ft; note 16 sets the floor at 20 ft
      - given: {rear_yard: 19.99, lot_depth: 60}
