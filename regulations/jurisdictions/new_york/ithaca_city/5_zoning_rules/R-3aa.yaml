  - id: R-3aa.stories
    kind: rule
    topic: dimensions
    title: "Number of stories: at most 3, at least 2 (chart p.3, note 11)"
    check: stories >= 2 and stories <= 3
    review_when:
      - when: stories < 2 and building_area <= 500
        reason: >-
          §325-8A(15) exempts development of a footprint of 500 sf or less from minimum height requirements, and
          §325-8B(10) points the chart's minimum height regulations to it. Whether that covers note 11's minimum
          stories is the open question on this rule; this lot's buildings cover 500 sf or less.
      - when: accessory_buildings > 0 and stories <= 3
        reason: >-
          The lot has accessory buildings, whose own stories Gordium doesn't count, and its building area counts them
          too. Whether the 2-story minimum reaches them ("Buildings hereafter erected", §325-8A(15)) is the open question
          on this rule: a one-story garage or shed of more than 500 sf would fail if it does. And with a one-story main
          building, the main building alone may cover 500 sf or less, so the exemption may still apply to it.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Number of stories, column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [30, 30]
        quote: "Number of stories 3 3 3 3 3 4 3/2 [fn11] 4 3"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [57, 57]
        quote: "(11) The first number refers to the maximum building stories allowed, the second number refers to the minimum building stories required."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: "(2) In all districts, the number of stories permitted may not be exceeded."
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [4, 8]
        quote: "(15) Column 16: Minimum Height of Building, Height in Feet. Buildings hereafter erected shall have a minimum height as specified herein; provided, however, that the requirements of this column shall not apply to development, including additions and/or expansions of existing development where the new development or addition or expansion of the existing development does not exceed a footprint of 500 square feet."
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [11, 11]
        quote: "(10) See § 325-8A(15) for applicability of minimum height regulations."
    examples:
      - given: {stories: 2, building_area: 1200, accessory_buildings: 0}
        expect: pass
        note: exactly at the minimum, no accessory building
      - given: {stories: 3, building_area: 1200, accessory_buildings: 0}
        expect: pass
        note: exactly at the maximum
      - given: {stories: 4, building_area: 1200, accessory_buildings: 0}
        expect: fail
        note: R-3A's and R-3B's 4 stories are too many in R-3aa
      - given: {stories: 4, building_area: 1200, accessory_buildings: 1}
        expect: fail
        note: too many stories whatever the accessory buildings are
      - given: {stories: 1, building_area: 1200, accessory_buildings: 0}
        expect: fail
        note: 'one story, a building of more than 500 sf: under the minimum of 2 (note 11)'
      - given: {stories: 1, building_area: 400, accessory_buildings: 0}
        expect: needs_review
        note: one story, but the lot's buildings cover 400 sf; §325-8A(15)'s exemption may apply (the open question)
      - given: {stories: 1, accessory_buildings: 0}
        expect: needs_review
        note: how much the buildings cover is not known, so the exemption may apply
      - given: {stories: 3, building_area: 400, accessory_buildings: 0}
        expect: pass
        note: a small building of 3 stories complies whichever way the exemption question is answered
      - given: {stories: 1, building_area: 680, accessory_buildings: 1}
        expect: needs_review
        note: a one-story 480 sf cottage and a 200 sf shed are each 500 sf or less; the exemption may cover both
      - given: {stories: 2, building_area: 1600, accessory_buildings: 1}
        expect: needs_review
        note: a 2-story house and a garage; if the minimum reaches accessory buildings, a one-story garage over 500 sf fails
      - given: {stories: 2, building_area: 1600}
        expect: needs_review
        note: whether there are accessory buildings is not known
    open_questions:
    - 'R-3AA''s "3/2" (chart p.3, note 11) requires at least 2 stories. §325-8A(15) says minimum-height
      requirements don''t apply to development (including additions) whose footprint is 500 sf or less, and §325-8B(10)
      points the chart''s minimum height regulations to §325-8A(15). Does that exemption cover R-3AA''s minimum stories,
      so a one-story building of 500 sf or less (or a one-story addition of 500 sf or less) complies? And does the
      minimum apply to every building on the lot (a one-story garage or shed too) or only to the main building?'
    research:
    - question: 'R-3AA''s "3/2" (chart p.3, note 11) requires at least 2 stories. §325-8A(15) says minimum-height
        requirements don''t apply to development (including additions) whose footprint is 500 sf or less, and §325-8B(10)
        points the chart''s minimum height regulations to §325-8A(15). Does that exemption cover R-3AA''s minimum stories,
        so a one-story building of 500 sf or less (or a one-story addition of 500 sf or less) complies? And does the
        minimum apply to every building on the lot (a one-story garage or shed too) or only to the main building?'
      searched:
      - 325-8A
      - 325-8B
      - 325-16
      - 325-16C
      - 325-16G
      - 325-25
      - 325-25A
      - 325-25C
      - 325-3B:story
      - 325-3B:height_of_building
      - 325-3B:primary_structure
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [4, 4]
        quote: 'Column 16: Minimum Height of Building, Height in Feet. Buildings hereafter erected shall have'
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [7, 8]
        quote: does not exceed a footprint of 500 square feet
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [11, 11]
        quote: for applicability of minimum height regulations
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [57, 57]
        quote: the second number refers to the minimum building stories required
      - file: zoning_charts_2026-04.pdf
        page: 5
        lines: [23, 24]
        quote: Minimum Building Height [fn3,6] Number of stories 2 2 - 2 - - 2
      - file: zoning_charts_2026-04.pdf
        page: 5
        lines: [41, 42]
        quote: (6) Minimum building height requirement shall not apply to development, including additions and/or
          expansions of existing development where the new development or addition or expansion of the existing
          development does not exceed a footprint of 500 square feet.
      - file: zoning_charts_2026-04.pdf
        page: 11
        lines: [34, 34]
        quote: (6) Accessory structures of less than 250 SF may be1story.
      - file: zoning_charts_2026-04.pdf
        page: 7
        lines: [42, 43]
        quote: (4) Only applies to new construction of non-industrial primary structures, or additions to an existing
          non-industrial primary use building in excess of 50% of the building area of the existing building.
      - file: zoning_charts_2026-04.pdf
        page: 13
        lines: [21, 23]
        quote: Minimum Building Height [fn2] Primary Use Number of stories 2 2 2 2 3 4
      - file: zoning_charts_2026-04.pdf
        page: 8
        lines: [58, 58]
        quote: Minimum Building Height [fn2]
      - file: chapter_325_zoning_2026-10.pdf
        page: 48
        lines: [14, 15]
        quote: no primary use building shall be erected that is less than two stories
      why_open: >-
        The residential chart (p.3) has no "Minimum Building Height" section: R-3AA's minimum number of stories (note
        11) is its only minimum-height figure, and no residential note repeats §325-8A(15)'s exemption. The other
        sheets of the same chart do have such sections (commercial p.5, special purpose p.7, West End p.8, waterfront
        p.11, Collegetown p.13), and the commercial sheet puts the exemption on its section in words (p.5 note 6, the
        same 500 sf words as §325-8A(15)): the City treats a minimum number of stories as a "minimum building height
        requirement" under the exemption. That points to the exemption covering R-3AA too, through §325-8B(10) (added
        2012); but it also shows the City writes the exemption onto a chart where it means it, and p.3 has none. On
        accessory buildings the City's texts point both ways. For the main building only: the special purpose sheet's
        minimum "Only applies to new construction of non-industrial primary structures" (p.7 note 4), Collegetown's
        minimum is set on a "Primary Use" row (p.13, where the maximum has a row for accessory use too), and §325-16G
        says, in the CBD-60 to CBD-140, B-1a, B-1b, B-2c and B-2d districts, "no primary use building shall be erected
        that is less than two stories" (p.48): where the City says whom
        a minimum reaches, it is the primary building. For every building: note 11 and §325-8A(15) ("Buildings
        hereafter erected") don't say primary (note 2's footprint cap does), §325-25 sets no accessory height of its
        own, and the waterfront sheet frees only "Accessory structures of less than 250 SF" (p.11 note 6), which
        implies its minimum otherwise reaches accessory structures; and R-3AA's p.3 has no primary-only note. No City
        record found (2026-10-25). Until it is answered: a one-story design whose buildings cover 500 sf or less needs
        review, and so does a one-story main building beside accessory buildings (all of them together may cover more
        than 500 sf while the main building covers less); a one-story design covering more than 500 sf, with no accessory
        building on the lot, does not comply; a 2- or 3-story main building with accessory buildings on the lot needs review
        (Gordium counts the main building's stories only). (A one-story addition of 500 sf or less to an existing
        one-story building, which the exemption names, shows as does not comply when the whole building covers more
        than 500 sf: a stricter answer, never a false pass; check §325-8A(15) by hand.)
      readings:
      - id: exemption_applies
        reading: the 500 sf exemption covers R-3AA's minimum stories (a one-story building or addition of 500 sf or
          less complies)
      - id: exemption_does_not_apply
        reading: every building in R-3AA needs at least 2 stories, whatever its footprint
      - id: main_building_only
        reading: the minimum is for the main (primary) building only; accessory buildings may have one story
      - id: every_building
        reading: the minimum reaches every building on the lot, accessory buildings too (with the exemption, if it
          applies)
    notes: >-
      R-3AA's cell is "3/2 [fn11]", the seventh value of the line; note 11: the first number is the most stories, the
      second the fewest. No bonus: the 3-story maximum still applies when the height bonus (R-3aa.height) is used.
      Stories are counted at the main entrance side (§325-8A(8)), for the main building (the stories measure). The
      minimum is for "buildings hereafter erected" (§325-8A(15)); building_area is everything the lot's buildings
      cover, so 500 sf or less there means the main building's footprint is 500 sf or less too.
    drafted_by: claude
    status: draft

  - id: R-3aa.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 35 or building_height <= 35 + 0.1 * 35
      and front_yard >= 10 + (building_height - 35)
      and side_yard_smaller >= 5 + (building_height - 35)
      and side_yard_larger >= 10 + (building_height - 35)
      and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft 35 ft 35 ft 35 ft 35 ft 40 ft 35 ft 40 ft 35 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 7]
        quote: "In any district, any main building may be erected to a height in excess of that specified for the district, provided that:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: "(3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that district."
    examples:
      - given: {building_height: 35, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 30, lot_depth: 120}
        expect: pass
        note: exactly at 35 ft with every yard at its minimum (rear 25% of 120 = 30)
      - given: {building_height: 35.01, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 30, lot_depth: 120}
        expect: fail
        note: over 35 ft, so every yard must grow by the extra height
      - given: {building_height: 38.5, front_yard: 13.5, side_yard_smaller: 8.5, side_yard_larger: 13.5, rear_yard: 33.5, lot_depth: 120}
        expect: pass
        note: the most the bonus allows (10% of 35 = 3.5 ft), each yard 3.5 ft larger
      - given: {building_height: 38.51, front_yard: 30, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 50, lot_depth: 120}
        expect: fail
        note: past 38.5 ft, however large the yards
      - given: {building_height: 40, front_yard: 30, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 50, lot_depth: 120}
        expect: fail
        note: R-3A's 40 ft is over R-3aa's limit even with the bonus
      - given: {building_height: 37, front_yard: 11.99, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 32, lot_depth: 120}
        expect: fail
        note: the front yard must be 10 + 2 = 12
      - given: {building_height: 37, front_yard: 12, side_yard_smaller: 6.99, side_yard_larger: 12, rear_yard: 32, lot_depth: 120}
        expect: fail
        note: the narrower side yard must be 5 + 2 = 7
      - given: {building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 11.99, rear_yard: 32, lot_depth: 120}
        expect: fail
        note: the wider side yard must be 10 + 2 = 12
      - given: {building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 31.99, lot_depth: 120}
        expect: fail
        note: the rear yard must be 30 + 2 = 32
    open_questions:
    - '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height, or allowed
      on top of the bonus height too?'
    research:
    - question: '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height,
        or allowed on top of the bonus height too?'
      searched:
      - 325-16
      - 325-16A
      - 325-16B
      - 325-16C
      - 325-3B:height_of_building
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [4, 4]
        quote: cornice for ornament
      why_open: §325-16B allows an ornamental parapet or cornice up to 5 ft above the height limit, but doesn't say
        whether that is the chart's limit or the bonus height §325-16C allows, or whether a parapet that guards a roof
        deck (not "for ornament") qualifies. No City record found. (The same question as R-1b.height's, since the words
        are the same in every district.)
      readings:
      - id: from_chart_limit
        reading: the 5 ft is measured from the chart's height limit (the stricter reading)
      - id: from_bonus_height
        reading: the 5 ft is measured from the bonus height §325-16C allows
      report: docs/research/2026-10-20_architect_questions.md §4.6
    findings:
    - id: height_bonus_every_yard
      question: '§325-16C(1): we read "each required ... yard is increased one foot ... for each one foot of such additional
        height" as: each yard must be at least its normal requirement plus the extra height (both side yards included).
        Confirm.'
      kind: law
      answer: 'Confirmed: every required front, side and rear yard grows one foot for each foot of extra height.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 8]
        quote: Each required front, side and rear yard is increased one foot on the ground for each one foot
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    - id: height_bonus_main_building_only
      question: Does the bonus apply to accessory buildings too, or only the main building ("any main building")?
      kind: law
      answer: Only the main building ("any main building"). The number of stories still can't be exceeded, and the extra
        feet are at most 10% of the maximum building height.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 6]
        quote: any main building may be erected to a height in excess of that
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: the number of stories permitted may not be exceeded
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: may not exceed 10% of the maximum building height
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    notes: >-
      R-3AA's 35 ft is the seventh value of the line (between R-3A's and R-3B's 40 ft). Arithmetic for the bonus: 10%
      of the 35 ft maximum = 3.5 ft, so at most 38.5 ft, with every required yard 1 ft larger per extra foot (R-3AA's
      yards: front 10, sides 10 and 5, rear 25% of the lot depth, at most 50 ft, at least 20 ft).
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_coverage
