  - id: R-3aa.footprint_block_front
    kind: flag
    topic: dimensions
    title: "New building footprint at most 120% of the block front's average (note 2)"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [8, 8]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA [fn2] R-3B"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [45, 47]
        quote: "(2) No new construction of a primary structure in the R-3aa zone shall contain a footprint that is larger than 120% of the average footprint of the existing buildings along the entire block front in which the building is located. If one or more such surrounding buildings have been demolished, then the calculation for maximum building footprint shall use the footprint of the primary structure that most recently stood on any lot where a demolition had occurred."
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
    examples:
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: needs_review
        note: every use's new primary structure; note 2 names no use
    notes: >-
      Not checked yet: Gordium doesn't measure the footprints of the other buildings along the block front, so this
      always needs review; check it by hand under chart p.3 note 2. Worked by hand: a block front whose existing
      buildings' footprints are 1,000, 1,200 and 1,400 sf averages 1,200 sf, so a new primary structure's footprint may
      be at most 1.2 × 1,200 = 1,440 sf; where a building on the block was demolished, the footprint of the primary
      structure that last stood there is used in the average. The cap is for "new construction of a primary
      structure" (§325-3B PRIMARY STRUCTURE): an alteration of an existing building is not new construction, which the
      reviewer judges. The chart puts the note on the R-3AA heading itself ("R-3AA [fn2]").
    drafted_by: claude
    status: draft

