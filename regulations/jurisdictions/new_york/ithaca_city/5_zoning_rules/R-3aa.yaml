    notes: >-
      The yards themselves (R-3aa.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out; this rule measures the same yards to the outermost part, eaves included, and lets that be up
      to 2 ft less. Each side's eaves are measured to that side's own lot line (#18's measuring, c613837, which
      reaches this branch with the stack): side_yard_smaller_eaves to the line of
      the narrower side yard to the walls, side_yard_larger_eaves to the other's, so each eave is held to the minimum its
      side carries. Which side carries the 10 ft minimum is the walls' to say: only the side whose walls are at least
      10 ft from its line can. Where both can, or neither, either side may be, and the eaves must fit both ways,
      else needs review (review_when: Gordium's cautious reading, to confirm with the architects; the
      chart says only that one side yard is at least 10 ft and the other at least 5 ft), the pattern of R-3a's eaves
      rule after #18's P0 (06fea9c, c0e6d3c; with the stack). A
      massing model shows eaves, not windowsills, belt courses or cornices: those are for the architect to check. On a
      corner lot every yard facing a street is a front yard (§325-19C).
