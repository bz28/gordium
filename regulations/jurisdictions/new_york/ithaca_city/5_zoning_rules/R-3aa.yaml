        note: whether an attached building of 3-6 houses is exempt is open question 3, so it is not exempted
      - given: {use: one_family_semi_detached, abuts_r1_district: true}
        expect: not_applicable
    findings:
    - id: one_family_configurations_exempt
      question: '§325-19E exempts "a one-family or two-family dwelling". Does that include the semi-detached and
        zero-lot-line configurations, which the chart lists as uses of their own?'
      kind: reading
      answer: 'Yes: §325-3B defines a one-family dwelling and lists detached, zero lot line and semidetached (a building
        of at most two one-family dwellings) among its configurations, so they are exempt with the two-family dwelling.
        The attached configuration (3 to 6 dwellings) is the third open question, still open.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [7, 7]
        quote: ONE-FAMILY SEMIDETACHED DWELLING — A building containing not more than two
      still_open:
      - R-3a.abutting_r1#2
      - R-3aa.abutting_r1#3
      - R-3b.abutting_r1#2
      strength: strong
      confirm_with: the City zoning office
    open_questions:
    - '§325-19E ("Development in R-3 Districts which abut R-1 Districts") names "the R-3a or R-3b Zoning District" and
      sets its limits as percentages of "the requirement shown on the District Regulations Chart for the R-3a or R-3b
      District", while chart note 1 ("property in R-3 that directly abuts R-1") sits on the chart''s R-3 heading, which
      covers R-3A, R-3AA and R-3B. Does §325-19E apply to an R-3aa lot that abuts R-1a or R-1b land?'
    - '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does only land
      sharing a lot line with the R-3aa lot count, or also land across a street, an alley, a creek or other waterway, a
      railroad or other right-of-way; and does land touching the lot only at a corner count?'
    - 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
    research:
    - question: '§325-19E ("Development in R-3 Districts which abut R-1 Districts") names "the R-3a or R-3b Zoning
        District" and sets its limits as percentages of "the requirement shown on the District Regulations Chart for
        the R-3a or R-3b District", while chart note 1 ("property in R-3 that directly abuts R-1") sits on the chart''s
        R-3 heading, which covers R-3A, R-3AA and R-3B. Does §325-19E apply to an R-3aa lot that abuts R-1a or R-1b
        land?'
      searched:
      - 325-19
      - 325-19E
      - 325-4
      - 325-8B
      - 325-9B
      - 325-11B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [12, 13]
        quote: The development of any permitted use in the R-3a or R-3b Zoning District
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [44, 44]
        quote: For special conditions on development of property in R-3 that directly abuts R-1
      - file: chapter_325_zoning_2026-10.pdf
        page: 22
        lines: [17, 19]
        quote: R-3a Residential R-3aa Residential R-3b Residential
      - file: chapter_325_zoning_2026-10.pdf
        page: 38
        lines: [26, 27]
        quote: Cluster subdivisions may only be permitted in the R-1a, R-1b, R-2a, R-2b, R-3a and R-3b Zoning Districts.
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [31, 31]
        quote: (g) Hospitals or sanatoriums in R-3, CR-3, and CR-4 Districts.
      - file: chapter_325_zoning_2026-10.pdf
        page: 22
        lines: [10, 10]
        quote: 8-2-2017 by Ord. No. 2017-10; 11-1-2017 by Ord. No. 2017-14]
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [15, 15]
        quote: '[Added 7-3-2019 by Ord. No. 2019-12]'
      why_open: >-
        The code points both ways. §325-19E's own words name only R-3a and R-3b, twice, and its limits are
        figured from "the District Regulations Chart for the R-3a or R-3b District"; §325-4 lists R-3aa as a district
        of its own, and §325-11B(1) shows the code naming R-3 districts one by one where it means some of them. R-3aa
        existed when §325-19E was adopted (§325-19E was added 7-3-2019; §325-4, which lists R-3aa, was last amended
        11-1-2017), so leaving it out may have
        been deliberate. But §325-19E's heading and chart note 1 speak of "R-3" and "property in R-3", the chart's R-3
        heading spans R-3AA, and elsewhere "R-3" means all three (§325-9B(1)(g)). No City record or BZA decision was
        found (searched the City's agenda center and the web, 2026-10-25). Until it is answered, Gordium doesn't leave
        §325-19E out of R-3aa (never a false pass): where the lot may abut R-1 land, the uses §325-19E covers need
        review.
      readings:
      - id: applies_to_r3aa
        reading: §325-19E applies in R-3aa as in R-3a and R-3b (the heading and chart note 1's "R-3")
      - id: r3a_and_r3b_only
        reading: §325-19E applies only in R-3a and R-3b, the districts it names
    - question: '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does
        only land sharing a lot line with the R-3aa lot count, or also land across a street, an alley, a creek or other
        waterway, a railroad or other right-of-way; and does land touching the lot only at a corner count?'
      searched:
      - 325-19
      - 325-19A
      - 325-19E
      - 325-6
      - 325-6A
      - 325-6D
      - 325-6E
      - 325-9B
      - 325-11B
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [26, 26]
        quote: on a lot abutting or across a street or waterway from
      - file: chapter_325_zoning_2026-10.pdf
        page: 39
        lines: [17, 17]
        quote: where it abuts land, other than a public right-of-way
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [26, 27]
        quote: Where district boundaries are indicated as approximately following the center lines of streets or highways,
          street lines or right-of-way lines, such lines shall be construed to be such boundaries
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [33, 34]
        quote: D. Where the boundary of a district follows a railroad line, such boundary shall be deemed to be located
          in the middle of the main tracts of said railroad.
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [35, 37]
        quote: E. Where the boundary of a district follows a stream, lake or other body of water under public
          jurisdiction, said boundary line shall be deemed to be at the limit of the jurisdiction, unless otherwise
          indicated.
      why_open: The same question as R-3a's (§5.5 on the questions page), if §325-19E reaches R-3aa (question 1). The
        code points both ways. §325-9B(1)(j) says "abutting or across a street", which treats the two as different;
        but §325-11B says "abuts land, other than a public right-of-way", which implies land in a street can be
        abutting land. Whether R-1 land begins at the street's center line or at its far edge depends on the zoning map
        (§325-6A allows either), and "directly" is not defined. No City record found. Until it is answered, the stated
        fact abuts_r1_district asks it the cautious way (Gordium's reading, to confirm), yes when any R-1a or R-1b land
        is touching the lot (even at a corner), or across a street, alley, creek or other waterway, railroad or other
        right-of-way from it, so "no" is right under every reading.
      readings:
      - id: shares_a_lot_line
        reading: only R-1a or R-1b land sharing a lot line with the lot counts
      - id: across_a_street_counts
        reading: R-1a or R-1b land across a street counts too
      - id: across_any_right_of_way_counts
        reading: R-1a or R-1b land across an alley, a creek or other waterway, a railroad or other right-of-way counts
          too
      - id: touching_at_a_corner_counts
        reading: R-1a or R-1b land touching the lot only at a corner (a single point) counts
    - question: 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
      searched:
      - 325-19E
      - 325-3B:dwelling_one_family
      - 325-3B:one_family_attached_dwelling
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:row_house
      - 325-3B:townhouse
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 12]
        quote: ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [24, 24]
        quote: (1) A building containing three or more dwelling units.
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [33, 33]
        quote: row house, townhouse, or garden apartment housing as defined in this section
      why_open: The same question as R-3a's (§5.6 on the questions page), if §325-19E reaches R-3aa. The one-family
        definition lists "attached" as one of its configurations, which points to exempt; but the same building of 3
        to 6 dwellings is a multiple dwelling under definitions (1) and (5). The code reads both ways and no City
        record was found, so Gordium doesn't exempt it (never a false pass).
      readings:
      - id: attached_is_exempt
        reading: an attached building of one-family dwellings is exempt, as a one-family configuration
      - id: attached_is_covered
        reading: it is a multiple dwelling, so §325-19E applies
    notes: >-
      A flag, not checked yet: Gordium can't apply §325-19E's limits by itself, and whether they reach R-3aa is open.
      Whether the lot abuts R-1a or R-1b land is stated by the architect (abuts_r1_district, asked the cautious way).
      Unknown or yes sends the lot to review for every use §325-19E would cover; no means it can't apply. Worked by
      hand for R-3aa, if §325-19E applies and the lot abuts R-1 land: lot size 150% of the chart's (multiple dwelling,
      new construction, 1-3 units: 1.5 × 6,000 = 9,000 sf; other use 9,000 sf; fraternity 37,500 sf); height R-1's 35
      ft, the same as R-3aa's own; coverage 75% × 35% = 26.25%; a side or rear yard that abuts R-1 land 150% of the
      chart's: side 15 ft and 7.5 ft, rear 150% of 25% of the lot depth (at most 50, at least 20 ft) — 45 ft on a 120 ft
      deep lot. The front yard is unchanged.
    drafted_by: claude
    status: draft

  - id: R-3aa.parking_one_family
    kind: rule
    topic: parking_and_loading
    title: "Minimum off-street parking, one-family detached (chart p.14)"
