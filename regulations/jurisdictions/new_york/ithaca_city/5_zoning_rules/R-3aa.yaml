  - id: R-3aa.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: >-
      use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
      "one_family_attached", "two_family", "multiple_family", "fraternity_sorority_group_house"]
    check: lot_area >= 6000
    review_when:
      - when: use in ["dormitory", "nursing_home"] and lot_area >= 6000
        reason: >-
          A dormitory and a nursing home are multiple dwellings by §325-3's definitions, so the multiple-family row and
          its note 7 (+750 sf per unit over 3, +500 sf per room let for profit) may apply instead of "Other use": the
          open question on this rule. (A dormitory is not permitted in R-3aa at all: R-3aa.use.)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf 6,000 sf 4,000 sf 30,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: Dormitory, column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursing, convalescent or rest home", column: R-3AA}
    examples:
      - given: {use: church, lot_area: 6000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 5999}
        expect: fail
      - given: {use: nursing_home, lot_area: 5999}
        expect: fail
        note: under 6,000 sf under either reading
      - given: {use: nursing_home, lot_area: 6000}
        expect: needs_review
      - given: {use: nursing_home, lot_area: 20000}
        expect: needs_review
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    open_questions:
    - 'A dormitory and a nursing home have their own rows on chart p.2 but none on p.3, and §325-3 defines both as
      multiple dwellings. Is their minimum lot size the "Multiple family dwelling" row (6,000 sf plus note 7''s per-unit
      additions) or "Other use" (6,000 sf)?'
    research:
    - question: 'A dormitory and a nursing home have their own rows on chart p.2 but none on p.3, and §325-3 defines
        both as multiple dwellings. Is their minimum lot size the "Multiple family dwelling" row (6,000 sf plus note 7''s
        per-unit additions) or "Other use" (6,000 sf)?'
      searched:
      - 325-3B:dormitory
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-8A
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [16, 16]
        quote: DORMITORY — A multiple dwelling
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [30, 30]
        quote: (4) A building used or occupied as a convalescent, old-age or nursing home
      why_open: The same question as R-3a's (§5.3 on the questions page), with the same figures (R-3AA's lot sizes are
        R-3A's). The definitions make both multiple dwellings, but the chart lists them as uses of their own and gives
        the fraternity house its own lot-size row, which suggests a use with no row of its own is an "Other use".
        Neither the code nor a City record (none found) says which. Both readings need 6,000 sf; they differ only in
        note 7's additions, so the rule fails a smaller lot and sends a larger one to review. In R-3aa it matters for a
        nursing home (a dormitory is not permitted).
      readings:
      - id: multiple_family_row
        reading: the multiple-family row applies (6,000 sf for 1-3 units, +750 sf each further unit, +500 sf per room let)
      - id: other_use_row
        reading: '"Other use" applies (6,000 sf)'
    notes: >-
      Other uses in R-3aa: church, park, library or fire station, cemetery, public utility, school, nursery school,
      adult day care home, neighborhood commercial facility, nursing home, hospital, bed-and-breakfast inn (and a
      dormitory, which fails R-3aa.use). The zero-lot-line house has its own row ("-" in R-3AA): see
      R-3aa.lot_size_zero_lot_line.
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_size_zero_lot_line
    kind: flag
    topic: dimensions
    title: "Lot size and width, zero-lot-line house: chart shows \"-\" (chart p.3)"
    applies_when: use == "one_family_detached_zero_lot_line"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached, zero lot line", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Minimum Lot Width, row: "One-family dwelling, detached, zero lot line", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [22, 25]
        quote: "(4) Where a variance or special permit is required or where special conditions apply to allow in one district a use which is permitted by right in another district, the regulations applying to such use shall be those of whichever district has the stricter regulations, unless otherwise determined by the Board of Zoning Appeals."
        not_limits: {1: "\"in one district\": not a number"}
    examples:
      - given: {use: one_family_detached_zero_lot_line}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: not_applicable
    open_questions:
    - 'R-3AA allows a zero-lot-line house by special permit (chart p.2), but its lot-size and lot-width cells are "-"
      (chart p.3). What minimum lot size and width apply: none, the "Other use" rows (6,000 sf, 50 ft), or whatever the
      Planning and Development Board sets with the special permit?'
    research:
    - question: 'R-3AA allows a zero-lot-line house by special permit (chart p.2), but its lot-size and lot-width cells
        are "-" (chart p.3). What minimum lot size and width apply: none, the "Other use" rows (6,000 sf, 50 ft), or
        whatever the Planning and Development Board sets with the special permit?'
      searched:
      - 325-8A
      - 325-8B
      - 325-9B
      - 325-3B:one_family_detached_dwelling_zero_lot_line
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [23, 23]
        quote: which is permitted by right in another district
      why_open: The same question as R-3a's (§5.4 on the questions page). Elsewhere on the chart "-" means "not
        allowed", which can't be meant here, since p.2 allows the use by special permit. §325-8B(4) would borrow the
        stricter regulations of a district where the use is permitted by right, but no residential district permits it
        by right (R-2C, R-3A, R-3AA and R-3B mark it SP; R-1, R-2A, R-2B and RU mark it -). §325-9B(1) doesn't list it
        either. No City record found.
      readings:
      - id: no_minimum
        reading: no minimum lot size or width
      - id: other_use_rows
        reading: the "Other use" rows apply (6,000 sf, 50 ft)
      - id: set_by_special_permit
        reading: the Planning and Development Board sets them with the special permit
    notes: The use needs a special permit anyway (R-3aa.use), so the result is NEEDS REVIEW whatever the answer.
    drafted_by: claude
    status: draft

