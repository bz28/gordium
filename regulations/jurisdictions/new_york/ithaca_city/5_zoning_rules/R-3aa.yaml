    check: parking_spaces >= (1 if sleeping_rooms <= 3 else 2 + 1 * max(sleeping_rooms - 5, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-3AA}
    examples:
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 1}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 0}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 4, parking_spaces: 2}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 4, parking_spaces: 1}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 6, parking_spaces: 3}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 6, parking_spaces: 2}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, sleeping_rooms: 4, parking_spaces: 2}
        expect: pass
        note: one dwelling unit too (§325-3B), so the same bedroom table
      - given: {use: one_family_detached_zero_lot_line, sleeping_rooms: 4, parking_spaces: 1}
        expect: fail
      - given: {use: two_family, sleeping_rooms: 3, parking_spaces: 0}
        expect: not_applicable
        note: two dwelling units, see R-3aa.parking_dwelling_units
    findings:
    - id: adu_needs_no_parking
      question: 'The requirement is per dwelling unit. R-3aa allows an accessory dwelling unit (chart p.2): does a house
        with an ADU need parking for both units? (Not checked yet; ADUs aren''t measured.)'
      kind: law
      answer: 'No: an ADU needs no off-street parking (§325-28C(2)). The house''s own parking is unchanged.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [9, 9]
        quote: There shall be no off-street parking requirement for an ADU
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.4
    notes: >-
      The residential parking rows span every residential district's column, so the numbers are R-1b's. The
      sleeping_rooms measure counts one dwelling unit's rooms, so this rule is for the uses with exactly one
      dwelling unit: a one-family detached house, and the zero-lot-line house, which §325-3B also calls a building of
      "not more than one dwelling unit". Bedrooms and parking spaces are inside the building, so the panel lists this row as "not checked
      yet: interior" until both are entered (parking is on hold).
    drafted_by: claude
    status: draft

  - id: R-3aa.parking_dwelling_units
    kind: flag
    topic: parking_and_loading
    title: "Parking per dwelling unit for buildings of several units (chart p.14)"
    applies_when: >-
      use in ["one_family_semi_detached", "one_family_attached", "two_family", "multiple_family"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-3AA}
    examples:
      - given: {use: two_family}
        expect: needs_review
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: not_applicable
    notes: >-
      The requirement is worked out for each dwelling unit and added up: worked by hand, a two-family house with a
      2-bedroom and a 4-bedroom unit needs 1 + 2 = 3 spaces; six 2-bedroom apartments need 6. Gordium measures the
      sleeping rooms of one dwelling unit only (sleeping_rooms), so it can't add them up yet: NEEDS REVIEW, added up by
      hand.
    drafted_by: claude
    status: draft

  - id: R-3aa.parking_other_uses
    kind: flag
    topic: parking_and_loading
    title: "Parking for other uses: §325-20, an architect's judgment call"
    applies_when: >-
      use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
      "one_family_attached", "two_family", "multiple_family"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [24, 24]
        quote: "NOTES: (1) For all other uses see §325-20."
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: Dormitory, column: R-3AA}
    examples:
      - given: {use: fraternity_sorority_group_house}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: not_applicable
    notes: >-
      R-3AA's dormitory parking cell is "-" (a dormitory is not permitted in R-3aa, R-3aa.use), so a dormitory falls
      here with the other uses: never a pass.
    drafted_by: claude
    status: draft

  - id: R-3aa.loading
    kind: flag
    topic: parking_and_loading
    title: "Off-street loading (chart p.14, §325-21)"
    applies_when: >-
      use in ["multiple_family", "dormitory", "fraternity_sorority_group_house", "nursing_home",
      "hospital_or_sanitarium", "neighborhood_commercial_facility"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: "Multiple dweling with 25 + units", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [26, 26]
        quote: "(3) Plus 1 space for each additional 15,000 sf of floor space or major fraction thereof."
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: "Nursing home, hospital, or sanitarium", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: Neighborhood commercial facility, column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 63
        lines: [41, 42]
        quote: "A. Size requirements. An off-street loading space shall have a minimum of 450 square feet plus necessary additional space for entrance, exit and aisle space."
      - file: chapter_325_zoning_2026-10.pdf
        page: 64
        lines: [3, 4]
        quote: "and industrial land uses and multiple dwelling structures having more than 25 units, except for properties located in any CBD district:"
    examples:
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: nursing_home}
        expect: needs_review
      - given: {use: two_family}
        expect: not_applicable
    notes: >-
      The R-3A, R-3AA and R-3B columns share one cell per row. Multiple dwelling with 25+ units: 1 space per 10,000 sf
      of floor space, plus 1 for each additional 15,000 sf or major fraction (note 3); nursing home, hospital or
      sanitarium: 1 space; neighborhood commercial facility: see §325-21. Each space at least 450 sf (§325-21A).
      Gordium counts neither units nor floor space, so these are NEEDS REVIEW, worked out by hand. (A dormitory is not
      permitted in R-3aa; it is kept here so a dormitory design is never passed on loading either.)
    drafted_by: claude
    status: draft
