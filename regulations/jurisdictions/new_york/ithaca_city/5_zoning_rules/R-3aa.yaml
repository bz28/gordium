        quote: "(c) Detached ADU, new construction: [1] 800 SF maximum building footprint. [2] Maximum height of two stories and 20'."
        not_limits: {1: "[1], a list marker"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [15, 17]
        quote: "ACCESSORY DWELLING UNIT, DETACHED — An accessory dwelling unit (ADU) located within an existing or newly constructed accessory structure such as a detached garage, carriage house, or other freestanding building."
    examples:
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_footprint: 800, adu_height: 20, adu_stories: 2}
        expect: pass
        note: at every limit
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 801, adu_height: 18, adu_stories: 2}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 600, adu_height: 20.5, adu_stories: 2}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 600, adu_height: 19, adu_stories: 3}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_footprint: 900, adu_height: 18, adu_stories: 1}
        expect: needs_review
        note: an existing carriage house over 800 sf may stay as it is, but not be enlarged
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_footprint: 900, adu_height: 18, adu_stories: 1}
        expect: needs_review
        note: over 800 sf, and whether the building already exists isn't said
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_footprint: 500, adu_stories: 1}
        expect: needs_review
        note: height not measured
      - given: {accessory_dwelling_unit: true, adu_detached: false}
        expect: not_applicable
    notes: >-
      Measured from the detached ADU's building, the solid the architect picks (adu_building), on its own: its
      footprint seen from above (eaves read both ways: "footprint" isn't defined), its height as building height is
      measured, from the grade plane at its own walls, and its stories (a plain solid under 21 ft tall, 7 ft a story, holds at
      most two, read as two; a taller one needs its floors drawn). The height bonus of §325-16C is for the main
      building, not for this. Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft

  - id: R-3aa.adu_detached_setbacks
    kind: rule
    topic: dimensions
    title: "Detached ADU: 5 ft from the side and rear lot lines (§325-28C(8))"
    applies_when: accessory_dwelling_unit and adu_detached
    check: adu_side_yard >= 5 and adu_rear_yard >= 5
    review_when:
      - when: adu_existing_building and not (adu_side_yard >= 5 and adu_rear_yard >= 5)
        reason: >-
          An existing accessory building nearer a lot line than new construction may be: §325-28C(8)(b) sets no
          setback for it, but it may be altered or expanded only if it doesn't further encroach upon a setback for
          new construction. Check by hand that it isn't being enlarged toward the lot line.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Accessory Dwelling Unit", column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [28, 30]
        quote: "[2] Detached ADU, new construction: [a] Side and rear setback: 5' or setback required for primary structure, whichever is less."
        not_limits: {2: "[2], a list marker"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [26, 27]
        quote: "[1] An existing accessory building may be altered or expanded, provided that it does not further encroach upon any setback requirement for new construction."
        not_limits: {1: "[1], a list marker"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Side (one side minimum)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Side (other side minimum)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
        not_limits: {20: "the primary structure's rear yard floor: more than 5 ft, so 5 ft is the lesser"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [15, 17]
        quote: "ACCESSORY DWELLING UNIT, DETACHED — An accessory dwelling unit (ADU) located within an existing or newly constructed accessory structure such as a detached garage, carriage house, or other freestanding building."
    examples:
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 5, adu_rear_yard: 5}
        expect: pass
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 4.9, adu_rear_yard: 10}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 8, adu_rear_yard: 4}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_side_yard: 2, adu_rear_yard: 10}
        expect: needs_review
        note: "an existing garage 2 ft from the side line may stay, but not be enlarged toward it"
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_side_yard: 2, adu_rear_yard: 10}
        expect: needs_review
        note: "under 5 ft, and whether the building already exists isn't said"
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_rear_yard: 10}
        expect: needs_review
        note: "side not measured"
      - given: {accessory_dwelling_unit: true, adu_detached: false}
        expect: not_applicable
    notes: >-
      "5' or setback required for primary structure, whichever is less": the house's required side yards in
      R-3aa are 5 ft or more (chart p.3) and its rear yard at least 20 ft (note 16), so the lesser is 5 ft. Measured
      from the detached ADU's building, the solid the architect picks (adu_building): its least distance, seen from
      above, to a side lot line and to the rear lot line, every reading of which lines are side and rear. The
      ADU's building is measured here, not as an ordinary accessory building (§325-25C's 3 ft are less than 5
      ft). Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft
