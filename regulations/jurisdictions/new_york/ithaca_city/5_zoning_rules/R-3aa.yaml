  - id: R-3aa.adu_front_yard
    kind: rule
    topic: dimensions
    title: "Detached ADU: not in the primary front yard nor a required one (§325-28C)"
    applies_when: accessory_dwelling_unit and adu_detached
    check: not adu_in_primary_front_yard and adu_front_yard >= 10
    review_when:
      - when: adu_existing_building and not adu_in_primary_front_yard and adu_front_yard < 10
        reason: >-
          An existing accessory building in a required front yard: §325-28C(8)(b) sets no setback for an ADU in an
          existing accessory building, which may be altered or expanded only if it doesn't further encroach upon a
          setback for new construction. Check by hand that the building isn't being enlarged toward the street.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Accessory Dwelling Unit", column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [11, 11]
        quote: "(4) ADUs may not be located in the primary front yard."
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [26, 27]
        quote: "[1] An existing accessory building may be altered or expanded, provided that it does not further encroach upon any setback requirement for new construction."
        not_limits: {1: "[1], a list marker"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [31, 31]
        quote: "[b] Front setback, secondary front yard: same as primary structure."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [31, 34]
        quote: "(1) FRONT YARD — An open space extending the full width of the lot between a main building and the front lot line, unoccupied and unobstructed by buildings or structures from the ground upward, the depth of which shall be the least distance between the front lot line and the front of such main building."
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (adu_front_yard is measured to the nearer street), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [15, 17]
        quote: "ACCESSORY DWELLING UNIT, DETACHED — An accessory dwelling unit (ADU) located within an existing or newly constructed accessory structure such as a detached garage, carriage house, or other freestanding building."
    findings:
    - id: adu_building_is_accessory_structure
      question: 'Is a detached ADU''s building an accessory structure, so that §325-25 (not in a required front yard)
        reaches it as well as §325-28?'
      kind: law
      answer: 'Yes: a detached ADU is "located within an existing or newly constructed accessory structure"
        (§325-3B), and §325-25A keeps accessory structures out of a required front yard. Its side and rear distances
        are §325-28C(8)''s (this district''s adu_detached_setbacks).'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [15, 16]
        quote: located within an existing or newly constructed accessory structure
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [38, 38]
        quote: but not in a required front yard
      strength: strong
      report: docs/research/2026-10-29_accessory_dwelling_units.md §2
    - id: secondary_front_setback_is_the_required_one
      question: '"Front setback, secondary front yard: same as primary structure": the front yard the district
        requires of the primary structure, or the distance the house actually stands back?'
      kind: reading
      answer: 'The district''s required front yard (10 ft): the same list''s side and rear setback is the
        "setback required for primary structure", and §325-25A keeps every accessory structure out of a required
        front yard, the same figure. A house standing farther back doesn''t push the ADU back, and one standing
        closer (an older house) doesn''t bring it forward.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [29, 29]
        quote: setback required for primary structure
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [38, 38]
        quote: not in a required front yard
      strength: moderate
      confirm_with: the architects
      report: docs/research/2026-10-29_accessory_dwelling_units.md §4
    examples:
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_in_primary_front_yard: false, adu_front_yard: 70}
        expect: pass
        note: behind the house
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_in_primary_front_yard: true, adu_front_yard: 30}
        expect: fail
        note: nearer the street than the front of the house, in the primary front yard
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_in_primary_front_yard: true, adu_front_yard: 30}
        expect: fail
        note: (4) applies to every ADU, an existing building's too
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_in_primary_front_yard: false, adu_front_yard: 9}
        expect: fail
        note: a corner lot's secondary front yard, 9 ft from the side street (at least 10 ft)
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_in_primary_front_yard: false, adu_front_yard: 10}
        expect: pass
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_in_primary_front_yard: false, adu_front_yard: 9}
        expect: needs_review
        note: an existing building may stay where it is, but not be enlarged further toward the street
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_front_yard: 70}
        expect: needs_review
        note: whether it is in the primary front yard isn't known (a corner lot, or the house not picked)
      - given: {accessory_dwelling_unit: true, adu_detached: false}
        expect: not_applicable
        note: an attached ADU is part of the house, which is never in its own front yard
    notes: >-
      Measured from the detached ADU's building, the solid the architect picks (adu_building).
      adu_in_primary_front_yard: some part of it, seen from above, nearer the street lot line than the front of the
      main building is (§325-3B FRONT YARD); adu_front_yard: its least distance to a street lot line (on a corner lot
      the nearer street, so the secondary front yard is checked too). On a corner lot, which front yard is the
      primary one is open (325-28C#1, in the section labels): both streets are read as primary, and the rule
      complies only if it does under both. An attached ADU is part of the house, whose own front yard rule applies
      ("same as primary structure", §325-28C(8)(a)). Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft

  - id: R-3aa.adu_attached_size
    kind: rule
    topic: dimensions
    title: "Attached ADU: at most 40% of the primary structure's floor area"
    applies_when: accessory_dwelling_unit and not adu_detached
    check: adu_floor_area <= 0.4 * (primary_floor_area - adu_floor_area)
    review_when:
      - when: >-
          adu_floor_area > 0.4 * (primary_floor_area - adu_floor_area)
          and adu_floor_area <= 0.4 * primary_floor_area
        reason: >-
          Within 40% of the whole primary structure (the ADU included) but over 40% of the rest of it: which is
          meant is this rule's open question. Check by hand or ask the zoning office.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Accessory Dwelling Unit", column: R-3AA}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [16, 16]
        quote: "(a) Attached ADU: The ADU shall not exceed 40% of the floor area of the primary structure."
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [12, 14]
        quote: "ACCESSORY DWELLING UNIT, ATTACHED — An accessory dwelling unit (ADU) that is connected to or contained within the primary structure, such as a basement, building addition, or attached garage."
    examples:
      - given: {accessory_dwelling_unit: true, adu_detached: false, adu_floor_area: 400, primary_floor_area: 1500}
        expect: pass
        note: 400 is within 40% of the rest (0.4 x 1,100 = 440 sf) and of the whole (600 sf)
      - given: {accessory_dwelling_unit: true, adu_detached: false, adu_floor_area: 500, primary_floor_area: 1500}
        expect: needs_review
        note: over 40% of the rest (0.4 x 1,000 = 400 sf), within 40% of the whole (600 sf)
      - given: {accessory_dwelling_unit: true, adu_detached: false, adu_floor_area: 700, primary_floor_area: 1500}
        expect: fail
        note: over 40% under both readings (600 sf at most)
      - given: {accessory_dwelling_unit: true, adu_detached: false, adu_floor_area: 400}
        expect: needs_review
      - given: {accessory_dwelling_unit: true, adu_detached: true}
        expect: not_applicable
      - given: {accessory_dwelling_unit: true}
        expect: needs_review
        note: attached or detached not said
    open_questions:
    - '§325-28C(7)(a): an attached ADU "shall not exceed 40% of the floor area of the primary structure". Is that 40% of the whole primary structure, the ADU included, or of the rest of it (the main dwelling without the ADU)?'
    research:
    - question: '§325-28C(7)(a): an attached ADU "shall not exceed 40% of the floor area of the primary structure". Is that 40% of the whole primary structure, the ADU included, or of the rest of it (the main dwelling without the ADU)?'
      searched:
      - 325-28
      - 325-28B
      - 325-28C
      - 325-3B:accessory_dwelling_unit
      - 325-3B:accessory_dwelling_unit_attached
      - 325-3B:accessory_dwelling_unit_detached
      - 325-3B:primary_structure
      - 325-3B:dwelling_unit
      - 325-3B:dwelling_two_family
      - 325-3B:habitable_space
      - 325-3B:story
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [7, 7]
        quote: one unit may be no larger than 50% of the floor area of the larger
      - rank: 4
        cite: 'Other cities word the same limit both ways, for example "of the primary dwelling" or "of the existing
          primary dwelling unit"; none read settles Ithaca''s words (web search, 2026-10-29)'
      why_open: >-
        Chapter 325 doesn't define floor area, and §325-28 doesn't say whether the attached ADU is counted in the
        primary structure. The ATTACHED definition puts the ADU "within the primary structure", which supports the
        whole structure (ADU included); the two-family dwelling's "no larger than 50% of the floor area of the
        larger" (§325-3B) compares the two units, which supports comparing the ADU with the rest. No City
        interpretation or Board of Zoning Appeals decision on ADUs was found (web search, 2026-10-29). Gordium passes
        what complies under both, fails what fails under both, and asks between.
      readings:
      - id: whole_structure
        reading: 40% of the whole primary structure's floor area, the ADU included
      - id: rest_of_structure
        reading: 40% of the floor area of the rest of the primary structure, the ADU left out
      report: docs/research/2026-10-29_accessory_dwelling_units.md §5
    notes: >-
      The floor areas are stated by the architect (adu_floor_area; primary_floor_area, the whole primary structure
      the ADU is in, the ADU included): Chapter 325 doesn't define floor area, and the model's solids don't show
      floors. An attached ADU's setbacks are the primary structure's (§325-28C(8)(a)): the house's own yard rules
      measure it as part of the house. Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft

