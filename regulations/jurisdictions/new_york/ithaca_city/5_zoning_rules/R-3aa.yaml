  - id: R-3aa.yard_projections
    kind: rule
    topic: dimensions
    title: "Eaves into required yards, at most 2 ft (§325-18B)"
    check: >-
      front_yard_eaves >= 10 + max(building_height - 35, 0) - 2
      and side_yard_smaller_eaves >= 5 + max(building_height - 35, 0) - 2
      and side_yard_larger_eaves >= 10 + max(building_height - 35, 0) - 2
      and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0) - 2
    review_when:
      - when: >-
          (side_yard_smaller >= 10 + max(building_height - 35, 0) or side_yard_larger < 10 + max(building_height - 35, 0))
          and side_yard_smaller_eaves >= 10 + max(building_height - 35, 0) - 2
          and side_yard_larger_eaves >= 5 + max(building_height - 35, 0) - 2 and side_yard_larger_eaves < 10 + max(building_height - 35, 0) - 2
          and front_yard_eaves >= 10 + max(building_height - 35, 0) - 2 and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0) - 2
        reason: >-
          Which side yard is the 10 ft one (both minimums more on a building over 35 ft tall) is open: the walls are at
          least that far from both side lot lines, or from neither, so either side may be. The eaves fit only if the
          side whose walls are farther from its line is the 5 ft one. Say which side is meant to be the 10 ft
          one.
      - when: >-
          (side_yard_smaller >= 10 + max(building_height - 35, 0) or side_yard_larger < 10 + max(building_height - 35, 0))
          and side_yard_larger_eaves >= 10 + max(building_height - 35, 0) - 2
          and side_yard_smaller_eaves >= 5 + max(building_height - 35, 0) - 2 and side_yard_smaller_eaves < 10 + max(building_height - 35, 0) - 2
          and front_yard_eaves >= 10 + max(building_height - 35, 0) - 2 and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0) - 2
        reason: >-
          Which side yard is the 10 ft one (both minimums more on a building over 35 ft tall) is open: the walls are at
          least that far from both side lot lines, or from neither, so either side may be. The eaves fit only if the
          side whose walls are nearer to its line is the 5 ft one. Say which side is meant to be the 10 ft
          one.
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 49
        lines: [13, 16]
        quote: "B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that such features shall not project more than two feet into any required yard."
      - file: zoning_charts_2026-04.pdf
