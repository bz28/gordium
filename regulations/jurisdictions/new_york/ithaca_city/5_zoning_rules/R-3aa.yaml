# R-3aa (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# the same way R-1b.yaml, R-1a.yaml, R-2a.yaml to R-2c.yaml and R-3a.yaml were. An ANSWER KEY for grading the
# drafting script: written without looking at anything the script drafted or recorded, from the City's documents
# only (2_extracted_text/, the chart read cell by cell, the section labels, the definitions), with R-3a.yaml as the
# model of the format.
#
# Why R-3aa: the multi-family district that looks like R-3a and isn't. Its lot sizes are R-3a's, but every lot width
# is 50 ft, dormitories are not allowed, the height is R-1's (35 ft) with a MINIMUM as well as a maximum number of
# stories ("3/2", note 11: at most 3, at least 2), the rear yard is 25% of the lot depth, a new building's footprint
# is capped by its neighbours' (note 2), and §325-19E names R-3a and R-3b but not R-3aa. A drafter that copies the
# R-3A column, or reads "3/2" as one number, fails here.
#
# Every chart number was read two ways and agrees: the chart's text line (quoted), and the chart reader's R-3AA cell
# (cited); R-3AA is the seventh value in each row (the second of the four in the fraternity rows).
# test_r1b_matches_chart.py checks the rules against the R-3AA cells, both numbers of "3/2" included.
#
# Where R-3aa differs from R-3a (chart p.2, p.3, column R-3AA): dormitories "-" (not permitted); lot width 50 ft for
# every use (R-3a: 40 ft for detached, semi-detached and two-family houses, 100 ft for a fraternity house); 3
# stories at most and 2 at least (§325-8A(15)'s 500 sf footprint exemption is an open question), 35 ft (bonus to
# 38.5 ft); rear yard 25% of the lot depth (50 ft cap, 20 ft floor); note 2's footprint cap. The same as R-3a: lot
# sizes (5,000 sf; note 7 for attached and multiple dwellings; 25,000 sf fraternity; 6,000 sf other), coverage 35%,
# front 10 ft, sides 10 ft and 5 ft, accessory buildings 3 ft from side and rear lot lines, parking and loading.
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-3a (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2), accessory dwelling
# units (§325-28), occupancy limits (p.2 note 4, §325-3B DWELLING, ONE-FAMILY), height exceptions for chimneys and
# similar (§325-16A, applied when measuring height), more than one main building on a lot (§325-8B(1)), the loading
# rule for nonresidential uses ("Allowed by variance", p.14). R-3aa is
# not one of the districts §325-11B(1) allows cluster subdivisions in. Parking is written as in R-3a and stays "not
# checked yet: interior". Parts of R-3aa were rezoned to the Southside form districts by Ord. No. 2025-12
# (sources.yaml); a lot's district is looked up, not assumed.
#
# Not checked yet, each a flag that always needs review, with the section to check by hand: note 2's footprint cap
# (R-3aa.footprint_block_front: Gordium doesn't measure the neighbouring buildings' footprints), §325-19E where the
# lot may abut R-1 land (R-3aa.abutting_r1), parking for several units, dormitories and other uses, loading.
#
# Known gap (as in R-3a, not fixable in this file): on a corner lot one side yard is left, and the City checks it
# against Column 13 (5 ft in R-3aa; the corner_lot_side_yard_column_13 finding). The measurements give that one yard
# as both side measures, and the rule language has no corner-lot measure, so R-3aa.side_yards asks 10 ft of it: a
# stricter answer than the City's practice (a false fail, never a false pass) until a corner_lot measure exists.

district: R-3aa
rules:

  - id: R-3aa.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: >-
      use in ["one_family_detached", "one_family_semi_detached", "one_family_attached", "two_family",
      "multiple_family", "fraternity_sorority_group_house", "church", "public_park_or_playground",
      "library_or_fire_station", "nursery_school_or_child_day_care", "adult_day_care_home", "nursing_home"]
    review_when:
      - when: >-
          use in ["one_family_detached_zero_lot_line", "cemetery", "public_utility_structure", "school",
          "neighborhood_commercial_facility", "hospital_or_sanitarium", "bed_and_breakfast_inn"]
        reason: >-
          Marked SP for R-3AA on the zoning chart (p.2). §325-9B(1) lists cemeteries and public utility facilities in
          all districts, schools in all residential districts, neighborhood commercial facilities and hospitals in R-3,
          and bed-and-breakfast inns in all districts as requiring a special permit from the Planning and Development
          Board (the zero-lot-line house: the chart's SP, see the finding).
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked • for R-3AA
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Multiple family dwelling [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Fraternity, sorority, or group house", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursing, convalescent or rest home", column: R-3AA}
      # marked SP for R-3AA
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Hospital or sanitarium", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Bed-and-breakfast inn", column: R-3AA}
      # marked - for R-3AA (not permitted): the one use R-3A and R-3B allow and R-3AA doesn't
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Dormitory", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [16, 16]
        quote: "Dormitory - - - - - • - • •[fn5]"
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [29, 30]
        quote: "(f) Neighborhood retail or service commercial facilities in R-2, R-3, CR-2, CR-3, and CR-4 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers", 3: "district names (R-3, CR-3), not numbers", 4: "a district name (CR-4), not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [31, 31]
        quote: "(g) Hospitals or sanatoriums in R-3, CR-3, and CR-4 Districts."
        not_limits: {3: "district names (R-3, CR-3), not numbers", 4: "a district name (CR-4), not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [36, 36]
        quote: "(p) Bed-and-breakfast inns in all districts."
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: multiple_family}
        expect: pass
      - given: {use: fraternity_sorority_group_house}
        expect: pass
      - given: {use: nursing_home}
        expect: pass
        note: marked • for R-3AA (- in R-1, R-2 and RU)
      - given: {use: dormitory}
        expect: fail
        note: marked - for R-3AA (• in R-3A, R-3B and RU)
      - given: {use: school}
        expect: needs_review
      - given: {use: hospital_or_sanitarium}
        expect: needs_review
      - given: {use: neighborhood_commercial_facility}
        expect: needs_review
      - given: {use: one_family_detached_zero_lot_line}
        expect: needs_review
      - given: {use: bed_and_breakfast_inn}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: zero_lot_line_sp_not_in_325_9
      question: The chart marks a one-family detached zero-lot-line dwelling SP in R-3AA, but §325-9B(1)'s list of
        special-permit uses has no zero-lot-line item. Does it need a special permit?
      kind: reading
      answer: 'Treated as needing one: the chart is part of the law (§325-8A: "made a part of this chapter") and its
        SP mark is the more specific statement. Either way Gordium can''t pass it, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [12, 12]
        quote: The District Regulations Chart is hereby made a part of this chapter
      strength: strong
      confirm_with: the City zoning office
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      R-3AA is the seventh mark in each row of page 2 (R-1A, R-1B, R-2A, R-2B, R-2C, R-3A, R-3AA, R-3B, RU). Its marks,
      row by row against the chart reader's R-3AA cells: • one-family detached, semi-detached and attached dwellings,
      two-family and multiple dwellings, fraternity houses, church, park, library or fire station, nursery school,
      adult day care home, nursing home; SP the zero-lot-line house, cemetery, public utility, school, neighborhood
      commercial facility, hospital, bed-and-breakfast inn; - dormitory, the only use R-3AA marks "-" (the row reads
      "- - - - - • - • •[fn5]": R-3A •, R-3AA -, R-3B •, RU •). What the marks mean is Gordium's reading (the
      chart_marks finding).
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 6600}
        expect: pass
      - given: {use: one_family_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_detached, lot_area: 4999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 3000}
        expect: fail
        note: R-3B's 3,000 sf is not enough in R-3aa
      - given: {use: two_family, lot_area: 4000}
        expect: not_applicable
    notes: >-
      The seventh value of the row is R-3AA's (the second 5,000 sf, after R-3A's; R-3B's 3,000 sf follows). Chart note
      3 points to §325-8B(1): the minimum applies to each main building on the lot.
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: one_family_semi_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_semi_detached, lot_area: 4999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 4000}
        expect: not_applicable
    notes: >-
      A semi-detached dwelling is one building holding two one-family dwellings that share a party wall (§325-3B).
      The chart's figure is for the lot as cited; §325-8B(1) adds the figure again for each further main building on
      the lot. R-3aa's side yards (10 ft and 5 ft) leave no 0 ft side for a party wall on a lot line.
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Minimum lot size, two-family dwelling (chart p.3)"
