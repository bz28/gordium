        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 6600}
        expect: pass
      - given: {use: two_family, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 4999}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-3aa.lot_area_one_family_attached
    kind: rule
    topic: dimensions
    title: "Lot size by units and rooms let, one-family attached (chart p.3, note 7)"
    applies_when: use == "one_family_attached"
    check: lot_area >= (7000 if conversion else 6000) + 750 * max(dwelling_units - 3, 0) + 500 * rooms_let_for_profit
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, by conversion", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [14, 14]
        quote: "One-family dwelling, attached, new construction - - - - 1,500 sf [fn6] 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [13, 13]
        quote: "One-family dwelling, attached, by conversion - - - - 1,500 sf [fn6] 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
        not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 750 sf only past 3"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      # worked by hand from note 7: base 6,000 sf new / 7,000 sf by conversion for the first 1-3 units,
      # + 750 sf for each unit past 3, + 500 sf per room let for profit; each step on both sides
      - given: {use: one_family_attached, lot_area: 6000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 3 units, no rooms let -> 6,000 sf; at the limit
      - given: {use: one_family_attached, lot_area: 5999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 8250, dwelling_units: 6, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 6 units (the most an attached building holds, §325-3B) -> 6,000 + 3 x 750 = 8,250 sf
      - given: {use: one_family_attached, lot_area: 8249, dwelling_units: 6, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 7000, dwelling_units: 3, rooms_let_for_profit: 2, conversion: false}
        expect: pass
        note: new, 3 units, 2 rooms let -> 6,000 + 2 x 500 = 7,000 sf
      - given: {use: one_family_attached, lot_area: 6999, dwelling_units: 3, rooms_let_for_profit: 2, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 7000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: pass
        note: by conversion, 3 units -> 7,000 sf
      - given: {use: one_family_attached, lot_area: 6999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: fail
        note: enough for new construction (6,000 sf), not by conversion
      - given: {use: one_family_attached, lot_area: 8250, dwelling_units: 4, rooms_let_for_profit: 1, conversion: true}
        expect: pass
        note: by conversion, 4 units, 1 room let -> 7,000 + 750 + 500 = 8,250 sf
      - given: {use: one_family_attached, lot_area: 8249, dwelling_units: 4, rooms_let_for_profit: 1, conversion: true}
        expect: fail
      - given: {use: one_family_attached, lot_area: 4000, dwelling_units: 4, rooms_let_for_profit: 0, conversion: false}
        expect: fail
        note: R-3b's note 8 (3,500 + 500 = 4,000 sf) is not enough in R-3aa (6,750 sf)
      - given: {use: one_family_attached, lot_area: 20000, rooms_let_for_profit: 0, conversion: false}
        expect: needs_review
        note: the units not given -> never a pass, however large the lot
      - given: {use: one_family_attached, lot_area: 20000, dwelling_units: 3, conversion: false}
        expect: needs_review
        note: the rooms let not given
      - given: {use: one_family_attached, lot_area: 20000, dwelling_units: 3, rooms_let_for_profit: 0}
        expect: needs_review
        note: new construction or conversion not given
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      R-3AA's cells are R-3A's ("6,000 sf [fn7]" new, "7,000 sf [fn7]" by conversion: the seventh values). Note 7 in
      full, encoded as R-3a does: the chart's base for the first 1-3 units, + 750 sf for each unit past 3, + 500 sf
      per room let for profit. The units, the rooms let and whether it is a conversion are stated by the architect
      (dwelling_units, rooms_let_for_profit, conversion); any of them not given and the rule needs review, never a
      pass.
    drafted_by: claude
    status: draft

