  - id: R-3aa.yard_projections
    kind: rule
    topic: dimensions
    title: "Eaves into required yards, at most 2 ft (§325-18B)"
    check: >-
      front_yard_eaves >= 10 + max(building_height - 35, 0) - 2
      and side_yard_smaller_eaves >= 5 + max(building_height - 35, 0) - 2
      and side_yard_larger_eaves >= 10 + max(building_height - 35, 0) - 2
      and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0) - 2
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 49
        lines: [13, 16]
        quote: "B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that such features shall not project more than two feet into any required yard."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3AA}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-3AA}
    examples:
      - given: {front_yard_eaves: 12, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 48, lot_depth: 120, building_height: 30}
        expect: pass
        note: eaves clear of every required yard
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: pass
        note: eaves exactly 2 ft into the front (10 − 2), narrower side (5 − 2), wider side (10 − 2) and rear (25% of 120 = 30, − 2) yards
      - given: {front_yard_eaves: 7.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 8, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
        note: an eave just over 2 ft into the 5 ft side yard
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99, rear_yard_eaves: 28, lot_depth: 120, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 27.99, lot_depth: 120, building_height: 30}
        expect: fail
        note: R-3A's 20% rear yard (24 − 2 = 22) would pass this; R-3aa's 25% asks 28
      - given: {front_yard_eaves: 11, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 31, lot_depth: 120, building_height: 38}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {front_yard_eaves: 10.99, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 31, lot_depth: 120, building_height: 38}
        expect: fail
        note: the 13 ft front yard the bonus requires, less 2 ft, is 11
    notes: >-
      The yards themselves (R-3aa.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out; this rule measures the same yards to the outermost part, eaves included, and lets that be up
      to 2 ft less. A massing model shows eaves, not windowsills, belt courses or cornices: those are for the architect
      to check. On a corner lot every yard facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: R-3aa.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 10
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 6: "six feet applies in R-1 districts only; in R-3aa it is three feet (accessory_side_yard >= 3)"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3AA}
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines (6 ft would be needed in R-1)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 9.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 10, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (10 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-3aa is not an R-1 District, so §325-25C's first sentence applies: frame accessory buildings 3 ft from any side
      or rear lot line (the "six feet" is R-1's only). Whether the distances apply to an accessory building that isn't
      frame is §325-25C's open question (325-25C#1): accessory_distances_apply is measured under every reading, and
      outside R-1 its readings differ for a building not stated as frame, so that gives NEEDS REVIEW until the
      architect says the building is frame (accessory_frame). An accessory building is not a primary structure, so
      note 2's footprint cap is about the main building; whether the 2-story minimum reaches accessory buildings is
      R-3aa.stories' open question (it sends a lot with accessory buildings to review).
    drafted_by: claude
    status: draft

  - id: R-3aa.abutting_r1
    kind: flag
    topic: dimensions
    title: "Lots abutting R-1a or R-1b land: does §325-19E reach R-3aa?"
    applies_when: >-
      use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
      "two_family"] and abuts_r1_district
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [12, 15]
        quote: "E. Development in R-3 Districts which abut R-1 Districts. The development of any permitted use in the R-3a or R-3b Zoning District, except a one-family or two-family dwelling, shall be subject to the following special conditions if the land on which the development occurs directly abuts land in either the R-1a or R-1b Zoning District:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [16, 18]
