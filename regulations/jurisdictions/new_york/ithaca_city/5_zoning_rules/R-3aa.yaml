      - given: {use: multiple_family, abuts_r1_district: false}
        expect: not_applicable
        note: no R-1 land near the lot, so §325-19E can't apply under any reading
      - given: {use: multiple_family}
        expect: needs_review
        note: whether the lot abuts R-1 land is not stated yet
      - given: {use: fraternity_sorority_group_house, abuts_r1_district: true}
        expect: needs_review
      - given: {use: two_family, abuts_r1_district: true}
