# R-1b (City of Ithaca): rules drafted by Claude by reading the zoning charts (April 2026) and Chapter 325.
# NOT yet an answer key: it would become one when the architects approve each rule (status: approved);
# architect approval is deferred for now (decided 2026-10-19).
# Until then it is a second, independent reading: the chart reader's R-1B cells must give the same chart
# values (test_r1b_matches_chart.py), and test_answer_keys.py compares these rules with the architects' own spreadsheet check
# (test_data/answer_keys/, their hand check of 106 Ithaca Rd).
# Every quote is verified against the PDF text by `python -m rule_format`. Written under
# regulations/document_extraction_guide/drafting_rules.md: a short title, no retelling (the quotes are the words);
# interpretations are open questions for the architects. Draft (approval deferred).
#
# Not covered yet (later rules or flags): ornamental parapets and cornices above the height limit
# (§325-16B), accessory uses and structures (p.2), occupancy limits
# (p.2 notes 1, 4), South Hill Overlay (p.2 note 2), height exceptions for chimneys and similar
# (§325-16A, applied when measuring height), more than one main building on a lot (§325-8B(1)).

district: R-1b
rules:

  - id: R-1b.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: use in ["one_family_detached", "church", "public_park_or_playground", "library_or_fire_station"]
    review_when:
      - when: use in ["cemetery", "public_utility_structure", "school"]
        reason: Marked SP for R-1B on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities and schools as requiring a special permit from the Planning and Development Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [9, 9]
        quote: "One-family dwelling, detached [fn4] • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [13, 13]
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [17, 17]
        quote: "Church or related building • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [18, 18]
        quote: "Public park or playground • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [19, 19]
        quote: "Library or fire station • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [20, 20]
        quote: "Cemetery or related building SP SP SP SP SP SP SP SP SP"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [21, 21]
        quote: "Public utility structure except office SP SP SP SP SP SP SP SP SP"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [22, 22]
        quote: "School and related buildings SP SP SP SP SP SP SP SP SP"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: two_family}
        expect: fail
      - given: {use: school}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines:
        - 15
        - 15
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines:
        - 20
        - 20
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines:
        - 22
        - 23
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: public_utility_same_use
      question: The chart says "Public utility structure except office"; §325-9B(1)(c) says "Public utility facilities".
        Are these the same use?
      kind: reading
      answer: 'The same use: the chart''s special-permit rows run in the same order as §325-9B(1) ((b) cemeteries, (c)
        public utility facilities). Either way it needs a special permit, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines:
        - 26
        - 26
        quote: Public utility facilities
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.2
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines:
        - 16
        - 16
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: The check passes uses marked • for R-1B, sends uses marked SP to review, and fails the rest (marked -). What
      the marks mean is Gordium's reading (the chart_marks finding, to confirm with the architects). The chart's columns
      are R-1A, R-1B, … so R-1b is the second mark in each row.
    drafted_by: claude
    status: draft

  - id: R-1b.lot_area_one_family_detached
