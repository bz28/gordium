# R-1b (City of Ithaca): rules drafted by Claude by reading the zoning charts (April 2026) and Chapter 325.
# NOT yet an answer key: it would become one when the architects approve each rule (status: approved);
# architect approval is deferred for now (decided 2026-10-19).
# Until then it is a second, independent reading: the chart reader's R-1B cells must give the same chart
# values (test_r1b_matches_chart.py), and test_answer_keys.py compares these rules with the architects' own spreadsheet check
# (test_data/answer_keys/, their hand check of 106 Ithaca Rd).
# Every quote is verified against the PDF text by `python -m rule_format`. Written under
# regulations/document_extraction_guide/drafting_rules.md: a short title, no retelling (the quotes are the words);
# interpretations are open questions for the architects. Draft (approval deferred).
#
# Not covered yet (later rules or flags): ornamental parapets and cornices above the height limit
# (§325-16B), accessory uses and structures (p.2), occupancy limits
# (p.2 notes 1, 4), South Hill Overlay (p.2 note 2), height exceptions for chimneys and similar
# (§325-16A, applied when measuring height), more than one main building on a lot (§325-8B(1)).

district: R-1b
rules:

  - id: R-1b.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: use in ["one_family_detached", "church", "public_park_or_playground", "library_or_fire_station"]
    review_when:
      - when: use in ["cemetery", "public_utility_structure", "school"]
        reason: Marked SP for R-1B on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities and schools as requiring a special permit from the Planning and Development Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [9, 9]
        quote: "One-family dwelling, detached [fn4] • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [13, 13]
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [17, 17]
        quote: "Church or related building • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [18, 18]
        quote: "Public park or playground • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [19, 19]
        quote: "Library or fire station • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [20, 20]
        quote: "Cemetery or related building SP SP SP SP SP SP SP SP SP"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [21, 21]
        quote: "Public utility structure except office SP SP SP SP SP SP SP SP SP"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [22, 22]
        quote: "School and related buildings SP SP SP SP SP SP SP SP SP"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: two_family}
        expect: fail
      - given: {use: school}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines:
        - 15
        - 15
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines:
        - 20
        - 20
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines:
        - 22
        - 23
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: public_utility_same_use
      question: The chart says "Public utility structure except office"; §325-9B(1)(c) says "Public utility facilities".
        Are these the same use?
      kind: reading
      answer: 'The same use: the chart''s special-permit rows run in the same order as §325-9B(1) ((b) cemeteries, (c)
        public utility facilities). Either way it needs a special permit, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines:
        - 26
        - 26
        quote: Public utility facilities
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.2
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines:
        - 16
        - 16
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: The check passes uses marked • for R-1B, sends uses marked SP to review, and fails the rest (marked -). What
      the marks mean is Gordium's reading (the chart_marks finding, to confirm with the architects). The chart's columns
      are R-1A, R-1B, … so R-1b is the second mark in each row.
    drafted_by: claude
    status: draft

  - id: R-1b.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 6000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [8, 8]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA [fn2] R-3B"
    examples:
      - given: {use: one_family_detached, lot_area: 6674}
        expect: pass
      - given: {use: one_family_detached, lot_area: 5999}
        expect: fail
      - given: {use: church, lot_area: 5000}
        expect: not_applicable
    notes: "Chart note 3 points to §325-8B(1): the minimum applies to each main building on the lot."
    drafted_by: claude
    status: draft

  - id: R-1b.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: use != "one_family_detached"
    check: lot_area >= 7500
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf"
    examples:
      - given: {use: church, lot_area: 8000}
        expect: pass
      - given: {use: church, lot_area: 7000}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-1b.lot_width_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot width, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_width >= 50
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [21, 21]
        quote: "One-family dwelling, detached 75 ft 50 ft 45 ft 35 ft"
    examples:
      - given: {use: one_family_detached, lot_width: 73}
        expect: pass
      - given: {use: one_family_detached, lot_width: 45}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-1b.lot_width_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot width, other use (chart p.3)"
    applies_when: use != "one_family_detached"
    check: lot_width >= 60
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [28, 28]
        quote: "Other use 75 ft 60 ft 50 ft 40 ft"
    examples:
      - given: {use: church, lot_width: 60}
        expect: pass
      - given: {use: church, lot_width: 59}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-1b.stories
    kind: rule
    topic: dimensions
    title: "Maximum number of stories (chart p.3)"
    check: stories <= 3
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [30, 30]
        quote: "Number of stories 3 3 3 3 3 4"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: "(2) In all districts, the number of stories permitted may not be exceeded."
    examples:
      - given: {stories: 3}
        expect: pass
      - given: {stories: 4}
        expect: fail
    notes: >-
      The 3-story limit has no bonus: it still applies when the height bonus (R-1b.height) is used.
    drafted_by: claude
    status: draft

  - id: R-1b.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 35 or building_height <= 35 + 0.1 * 35
      and front_yard >= 25 + (building_height - 35)
      and side_yard_smaller >= 10 + (building_height - 35)
      and side_yard_larger >= 10 + (building_height - 35)
      and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft 35 ft 35 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [29, 29]
        quote: "Maximum Building Height [fn10]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-1B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-1B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-1B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-1B}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 7]
        quote: "In any district, any main building may be erected to a height in excess of that specified for the district, provided that:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: "(3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that district."
    examples:
      - given: {building_height: 35, front_yard: 25, side_yard_smaller: 10, side_yard_larger: 10, rear_yard: 24, lot_depth: 94.8}
        expect: pass
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 26, lot_depth: 94.8, stories: 3}
        expect: pass
      - given: {building_height: 37, front_yard: 25, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 26, lot_depth: 94.8, stories: 3}
        expect: fail
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 10, side_yard_larger: 12, rear_yard: 26, lot_depth: 94.8, stories: 3}
        expect: fail
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 24, lot_depth: 94.8, stories: 3}
        expect: fail
      - given: {building_height: 39, front_yard: 40, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 40, lot_depth: 94.8, stories: 3}
        expect: fail
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 22, lot_depth: 60}
        expect: pass                                 # a 60 ft lot: the 20 ft floor, plus 2 ft for 2 ft of extra height
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 21.99, lot_depth: 60}
        expect: fail
    open_questions:
    - '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height, or allowed
      on top of the bonus height too?'
    research:
    - question: '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height,
        or allowed on top of the bonus height too?'
      searched:
      - 325-16
      - 325-16A
      - 325-16B
      - 325-16C
      - 325-3B:height_of_building
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines:
        - 4
        - 4
        quote: cornice for ornament
      why_open: §325-16B allows an ornamental parapet or cornice up to 5 ft above the height limit, but doesn't say
        whether that is the chart's limit or the bonus height §325-16C allows, or whether a parapet that guards a roof
        deck (not "for ornament") qualifies. No City record found.
      readings:
      - id: from_chart_limit
        reading: the 5 ft is measured from the chart's height limit (the stricter reading)
      - id: from_bonus_height
        reading: the 5 ft is measured from the bonus height §325-16C allows
      report: docs/research/2026-10-20_architect_questions.md §4.6
    findings:
    - id: height_bonus_every_yard
      question: '§325-16C(1): we read "each required ... yard is increased one foot ... for each one foot of such additional
        height" as: each yard must be at least its normal requirement plus the extra height (both side yards included).
        Confirm.'
      kind: law
      answer: 'Confirmed: every required front, side and rear yard grows one foot for each foot of extra height.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines:
        - 8
        - 8
        quote: Each required front, side and rear yard is increased one foot on the ground for each one foot
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    - id: height_bonus_main_building_only
      question: Does the bonus apply to accessory buildings too, or only the main building ("any main building")?
      kind: law
      answer: Only the main building ("any main building"). The number of stories still can't be exceeded, and the extra
        feet are at most 10% of the maximum building height.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines:
        - 6
        - 6
        quote: any main building may be erected to a height in excess of that
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines:
        - 10
        - 10
        quote: the number of stories permitted may not be exceeded
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines:
        - 11
        - 12
        quote: may not exceed 10% of the maximum building height
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    notes: >-
      Arithmetic for the bonus: 10% of the 35 ft maximum = 3.5 ft, so at most 38.5 ft, with every required yard 1 ft larger per extra foot.
      All yard measurements are needed to check the height rule, even for buildings at or under 35 ft
      (the checker evaluates every part, so a missing measurement can't hide). What counts toward
      height (and what doesn't: chimneys, mechanical equipment…) is in the height definition and §325-16A.
      §325-16B lets an ornamental parapet wall or cornice extend 5 ft or less above the height limit; it
      will be a rule of its own.
    drafted_by: claude
    status: draft

  - id: R-1b.lot_coverage
    kind: rule
    topic: dimensions
    title: "Maximum lot coverage by buildings (chart p.3, §325-8A(10))"
    check: building_area <= 0.25 * lot_area
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [34, 34]
        quote: "Percent of lot area 20% 25% 30%"
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [5, 7]
        quote: "On a lot hereafter used, no greater percentage of total lot area may be covered by principal and accessory buildings above ground."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [7, 9]
        quote: "For this purpose, the area covered by principal and accessory buildings shall include all porches, attached or freestanding decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings."
        not_limits: {2: "what building_area counts (balconies projecting more than two feet): a measuring rule, not this formula's limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [9, 10]
        quote: "This sum, divided by the total lot area, shall not exceed the maximum allowed percentage of lot coverage specified in this column."
    open_questions:
    - 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey (lot), and
      whether roof eaves count (building_area). Garages count: see building_area''s findings.'
    research:
    - question: 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey
        (lot), and whether roof eaves count (building_area). Garages count: see building_area''s findings.'
      searched:
      - 325-8A
      - 325-3B:building_area
      - 325-3B:lot
      sources: []
      why_open: It depends on the lot and building_area questions, which are still open; see their research.
      report: docs/research/2026-10-20_architect_questions.md §3.2
    findings:
    - id: below_ground_not_counted
      question: '"Above ground": are parts of a building below grade (e.g. a buried garage under a deck) left out of
        building_area?'
      kind: reading
      answer: Parts wholly below ground don't count (Column 10 counts what is covered "above ground"; §325-25B lets
        wholly below-grade accessory structures go anywhere). A deck on top of a buried garage does count.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines:
        - 6
        - 7
        quote: covered by principal and accessory buildings above ground
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines:
        - 4
        - 4
        quote: entirely below the finished grade
      still_open: []
      strength: strong
      confirm_with: the City zoning office
      report: docs/research/2026-10-20_architect_questions.md §3.2
    examples:
      - given: {building_area: 1500, lot_area: 6674}
        expect: pass
      - given: {building_area: 1855, lot_area: 6674}
        expect: fail
    notes: "The failing example is the architects' 106 Ithaca Rd house (53 × 35 ft on their 6,674 sf lot = 27.8%)."
    drafted_by: claude
    status: draft

  - id: R-1b.front_yard
    kind: rule
    topic: dimensions
    title: "Front yard minimum (chart p.3)"
    check: front_yard >= 25
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [37, 37]
        quote: "Front (minimum) 25 ft 25 ft 25 ft 10 ft"
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [7, 9]
        quote: "C. Corner lot transition. On corner lots in residential districts; buildings must be erected so that yards facing public streets shall conform to the minimum front yard requirements of said residential district. Such lots shall be deemed to have two adjoining front yards."
        not_limits: {2: "two adjoining front yards: which yards are front yards on a corner lot (measured to every street line), not a limit"}
    examples:
      - given: {front_yard: 30}
        expect: pass
      - given: {front_yard: 24}
        expect: fail
    notes: >-
      On a corner lot every yard facing a street is a front yard (§325-19C; the corner_lot_two_front_yards finding):
      front_yard is the least distance from any street lot line, so each street-facing yard must be 25 ft.
    drafted_by: claude
    status: draft

  - id: R-1b.side_yards
    kind: rule
    topic: dimensions
    title: "Side yards minimum, one side and other side (chart p.3)"
    check: side_yard_smaller >= 10 and side_yard_larger >= 10
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [38, 38]
        quote: "Side (one side minimum) 10 ft 10 ft 10 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [40, 40]
        quote: "Side (other side minimum) 10 ft 10 ft 10 ft"
    examples:
      - given: {side_yard_smaller: 10, side_yard_larger: 10}
        expect: pass
      - given: {side_yard_smaller: 9.5, side_yard_larger: 12}
        expect: fail
    notes: >-
      On a corner lot one side yard is left; the City checks it against Column 13 and uses Column 12 for the second
      front yard (the corner_lot_side_yard_column_13 finding, Gordium's reading): both side measures are then that
      one yard. In R-1b both columns are 10 ft, so the check is the same either way.
    drafted_by: claude
    status: draft

  - id: R-1b.rear_yard
    kind: rule
    topic: dimensions
    title: "Rear yard minimum (chart p.3, note 16; lot depth §325-8A(14))"
    check: rear_yard >= max(min(0.25 * lot_depth, 50), 20)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
        not_limits: {2: "the two side lot lines: how lot depth is measured (measures.yaml lot_depth), not a limit"}
    examples:
      - given: {rear_yard: 25, lot_depth: 94.8}
        expect: pass
      - given: {rear_yard: 20, lot_depth: 94.8}
        expect: fail
      - given: {rear_yard: 20, lot_depth: 60}
        expect: pass
      - given: {rear_yard: 19.99, lot_depth: 60}     # under 80 ft deep, 25% is under 20 ft: note 16's floor decides
        expect: fail
    notes: >-
      Lot depth is the average of the two side lot lines if they differ (§325-8A(14)(a)).
      106 Ithaca Rd: side lot lines 90.28 and 99.37 ft → lot depth 94.8 ft → 23.7 ft required; the
      architects' model uses 20 ft (second example fails).
    open_questions:
    - 'Which lines are the side lot lines on a lot with more than four sides (106 Ithaca Rd''s jog)? See lot_depth:
      Gordium uses the Zoning Administrator''s perpendicular method, and one detail of it is still open.'
    research:
    - question: 'Which lines are the side lot lines on a lot with more than four sides (106 Ithaca Rd''s jog)? See lot_depth:
        Gordium uses the Zoning Administrator''s perpendicular method, and one detail of it is still open.'
      searched:
      - 325-8A
      - 325-3B:yard
      - 325-3B:rear_yard
      sources:
      - rank: 2
        cite: 'Zoning Administrator''s affidavit (2019) and staff memo to the BZA, Appeal #3202, 815 S. Aurora St (a
          five-sided lot), 2019-2022'
        url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_02012022-2446
        quote: side lot lines should be drawn at a 90-degree angle perpendicular to the front lot line to determine
          the average lot depth
      why_open: It depends on the lot_depth question that is still open; see its research.
