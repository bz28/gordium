- id: B-1b.lot_area_one_family_detached
  kind: rule
  topic: dimensions
  title: Minimum lot size, one-family dwelling, detached (chart p.5)
  applies_when: use == "one_family_detached"
  check: lot_area >= 5000
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, detached', column: B-1B}
  - &id001
    file: chapter_325_zoning_2026-10.pdf
    page: 24
    lines: [27, 30]
    quote: >-
      (6) Column 6: Minimum Lot Size, Area in Square Feet. Lots hereafter used for a permitted use in each use district
      shall be of a size equal to or greater than the total square feet indicated in this column, subject to the further
      regulations of Column 7 of the District Regulations Chart and of Article V.
  examples:
  - given: {use: one_family_detached, lot_area: 5000}
    expect: pass
    note: exactly the minimum
  - given: {use: one_family_detached, lot_area: 4999.99}
    expect: fail
  - given: {use: church, lot_area: 1}
    expect: not_applicable
  drafted_by: claude
  status: draft
