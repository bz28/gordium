  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 49
    lines: [13, 16]
    quote: >-
      B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary
      projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that
      such features shall not project more than two feet into any required yard.
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Front (minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (one side minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (other side minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: B-1B}
  - *id009
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: *id010
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 50) to each yard, one to one'}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Height in feet, column: B-1B}
  examples:
  - given: {side_yard_smaller: 6, side_yard_larger: 9, front_yard_eaves: 3, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 3,
      rear_yard_eaves: 8.0, lot_depth: 100, building_height: 48}
    expect: pass
    note: 'eaves exactly 2 ft into each required yard (rear: 10 − 2)'
  - given: {side_yard_smaller: 6, side_yard_larger: 9, front_yard_eaves: 3, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 3,
      rear_yard_eaves: 8.0, lot_depth: 100, building_height: 48}
    expect: fail
    note: an eave just over 2 ft into the 5 ft side yard
  - given: {side_yard_smaller: 6, side_yard_larger: 9, front_yard_eaves: 3, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 3,
      rear_yard_eaves: 7.99, lot_depth: 100, building_height: 48}
    expect: fail
  - given: {side_yard_smaller: 6, side_yard_larger: 9, front_yard_eaves: 2.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 3,
      rear_yard_eaves: 8.0, lot_depth: 100, building_height: 48}
    expect: fail
