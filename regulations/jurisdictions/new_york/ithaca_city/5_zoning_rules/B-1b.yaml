- id: B-1b.lot_area_other_use
  kind: rule
  topic: dimensions
  title: Minimum lot size, other use (chart p.5)
  applies_when: >-
    use not in ["one_family_detached", "one_family_semi_detached", "one_family_attached", "two_family", "multiple_family"]
  check: lot_area >= 3000
  review_when:
  - when: use in ["dormitory", "nursing_home"] and lot_area >= 3000
    reason: >-
      A dormitory and a nursing home are multiple dwellings by §325-3B's definitions, so the multiple-family row and its
      note 2 (+750 sf per unit over 3, +500 sf per room let) may apply instead of the other-use row: which row governs is
      this rule's open question.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Other use, column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: Motel, column: B-1B}
  - *id001
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Primary Uses, row: Dormitory, column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Primary Uses, row: 'Nursing, convalescent or rest home', column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 4
    cell: {section: Primary Uses, row: 'Hotel, motel', column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines: *id004
    quote: Dormitory - - - - - • - • •[fn5]
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines: *id005
    quote: Nursing, convalescent or rest home
  examples:
  - given: {use: business_or_professional_office, lot_area: 3000}
    expect: pass
  - given: {use: business_or_professional_office, lot_area: 2999.99}
    expect: fail
  - given: {use: dormitory, lot_area: 3000}
    expect: needs_review
    note: a dormitory is a multiple dwelling by §325-3B's definitions
  - given: {use: dormitory, lot_area: 2999.99}
    expect: fail
  - given: {use: two_family, lot_area: 1}
    expect: not_applicable
  notes: >-
    B-1B's motel cell is "-" (a hotel or motel isn't permitted in B-1B, chart p.4), so a hotel is held here to the other-use
    figure; the use rule fails it anyway.
  open_questions:
  - >-
    Is a dormitory or a nursing home in B-1B held to the multiple-family lot size (with note 2), or to the other-use row?
  research:
  - question: >-
      Is a dormitory or a nursing home in B-1B held to the multiple-family lot size (with note 2), or to the other-use row?
    searched:
    - 325-8A
    - 325-3B:dwelling_multiple_or_multiple_residence
    - 325-3B:dormitory
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 7
      lines: [30, 31]
      quote: >-
        (4) A building used or occupied as a convalescent, old-age or nursing home, but not including private or public
        hospitals or public institutions.
    why_open: >-
      The chart lists dormitories and nursing homes as uses of their own, but gives them no lot-size row; §325-3B's definition
      of a multiple dwelling includes a nursing home. The law doesn't say which row applies (R-3a.lot_area_other_use asks
      the same).
  drafted_by: claude
  status: draft
- id: B-1b.lot_width
