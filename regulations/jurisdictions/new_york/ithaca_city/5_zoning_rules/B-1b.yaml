- id: B-1b.lot_area_one_family_attached
  kind: rule
  topic: dimensions
  title: Lot size by units and rooms let, one-family attached (chart p.5, note 2)
  applies_when: use == "one_family_attached"
  check: >-
    lot_area >= (7000 if conversion else 6000) + 750 * max(dwelling_units - 3, 0) + 500 * rooms_let_for_profit
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, attached, new construction', column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Minimum Lot Size, row: 'One-family dwelling, attached, by conversion', column: B-1B}
  - &id002
    file: zoning_charts_2026-04.pdf
    page: 5
    lines: [36, 36]
    quote: (2) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit.
    not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 750 sf only past\
        \ 3"}
  - &id003
    file: chapter_325_zoning_2026-10.pdf
    page: 6
    lines: [26, 27]
    quote: CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization.
  - *id001
  examples:
  - given: {use: one_family_attached, conversion: false, dwelling_units: 3, rooms_let_for_profit: 0, lot_area: 6000}
    expect: pass
    note: 'new construction, three units: 6,000 sf'
  - given: {use: one_family_attached, conversion: false, dwelling_units: 3, rooms_let_for_profit: 0, lot_area: 5999.99}
    expect: fail
  - given: {use: one_family_attached, conversion: true, dwelling_units: 3, rooms_let_for_profit: 0, lot_area: 7000}
    expect: pass
    note: 'by conversion: 7,000 sf'
  - given: {use: one_family_attached, conversion: true, dwelling_units: 3, rooms_let_for_profit: 0, lot_area: 6999.99}
    expect: fail
  - given: {use: one_family_attached, conversion: false, dwelling_units: 5, rooms_let_for_profit: 1, lot_area: 8000}
    expect: pass
    note: 'five units and one room let: 6,000 + 2 × 750 + 500 = 8,000 sf'
  - given: {use: one_family_attached, conversion: false, dwelling_units: 5, rooms_let_for_profit: 1, lot_area: 7999.99}
    expect: fail
  - given: {use: one_family_attached, conversion: false, dwelling_units: 4, rooms_let_for_profit: 0, lot_area: 6749}
    expect: fail
    note: the fourth unit adds 750 sf
  notes: >-
    Note 2 marks B-1B's attached and multiple-dwelling cells only; the semi-detached, detached and two-family rows have
    no note.
  drafted_by: claude
  status: draft
