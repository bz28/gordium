- id: B-1b.height
  kind: rule
  topic: dimensions
  title: Maximum building height, with the §325-16C bonus
  check: >-
    building_height <= 50 or building_height <= 50 + 0.1 * 50 and front_yard >= 5 + (building_height - 50) and side_yard_smaller
    >= 5 + (building_height - 50) and side_yard_larger >= 5 + (building_height - 50) and rear_yard >= max(min(0.1 * lot_depth,
    15), 10) + (building_height - 50)
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Maximum Building Height [fn3]', row: Height in feet, column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    lines: [37, 37]
    quote: (3) See §325-16.
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Front (minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (one side minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Side (other side minimum), column: B-1B}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: 'Rear (minimum, % of depth or feet, whichever is less)', column: B-1B}
  - &id009
    file: zoning_charts_2026-04.pdf
    page: 5
    lines: [45, 45]
    quote: (9) But not less than 10 ft.
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [6, 7]
    quote: >-
      In any district, any main building may be erected to a height in excess of that specified for the district, provided
      that:
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: &id010 [8, 9]
    quote: >-
      (1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional
      height.
    not_limits: {1: 'one foot per foot: the formula adds (building_height - 50) to each yard, one to one'}
  - file: chapter_325_zoning_2026-10.pdf
    page: 47
    lines: [11, 12]
    quote: >-
      (3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that
      district.
  examples:
  - given: {building_height: 50, front_yard: 5, side_yard_smaller: 5, side_yard_larger: 5, rear_yard: 10.0, lot_depth: 100}
    expect: pass
    note: 'exactly 50 ft with every yard at its minimum (rear: 10% of 100 ft, at least 10)'
  - given: {building_height: 50.01, front_yard: 5, side_yard_smaller: 5, side_yard_larger: 5, rear_yard: 10.0, lot_depth: 100}
    expect: fail
    note: over the limit, so every yard must grow by the extra height
  - given: {building_height: 55.0, front_yard: 10.0, side_yard_smaller: 10.0, side_yard_larger: 10.0, rear_yard: 15.0, lot_depth: 100}
    expect: pass
    note: the most the bonus allows (10% of 50 = 5 ft), each yard 5 ft larger
  - given: {building_height: 55.01, front_yard: 60, side_yard_smaller: 60, side_yard_larger: 60, rear_yard: 90, lot_depth: 100}
    expect: fail
    note: past the bonus, however large the yards
  - given: {building_height: 52, front_yard: 6.99, side_yard_smaller: 7, side_yard_larger: 7, rear_yard: 12.0, lot_depth: 100}
    expect: fail
    note: the front yard must be 5 + 2
  - given: {building_height: 52, front_yard: 7, side_yard_smaller: 6.99, side_yard_larger: 7, rear_yard: 12.0, lot_depth: 100}
    expect: fail
    note: the narrower side yard must be 5 + 2
  - given: {building_height: 52, front_yard: 7, side_yard_smaller: 7, side_yard_larger: 6.99, rear_yard: 12.0, lot_depth: 100}
    expect: fail
    note: the wider side yard must be 5 + 2
  - given: {building_height: 52, front_yard: 7, side_yard_smaller: 7, side_yard_larger: 7, rear_yard: 11.99, lot_depth: 100}
    expect: fail
    note: the rear yard must be 10 + 2
  notes: >-
    The bonus: 10% of 50 ft = 5 ft, so at most 55 ft, with every required yard 1 ft larger per extra foot (B-1B: front 5,
    sides 5 and 5, rear 10% of the lot depth, at most 15 ft, at least 10).
  drafted_by: claude
  status: draft
- id: B-1b.min_stories
  kind: rule
  topic: dimensions
  title: At least two stories (chart p.5, §325-16G)
  check: stories >= 2
  review_when:
  - when: stories < 2 and building_area <= 500
    reason: >-
      Chart note 6 lifts the minimum height for development whose footprint is 500 sf or less, but §325-16G requires two
      stories of every new primary use building in this district with no such exception. The two disagree on a building
      this small (an open question); check it with the City.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Minimum Building Height [fn3,6]', row: Number of stories, column: B-1B}
  - &id006
    file: chapter_325_zoning_2026-10.pdf
    page: 48
    lines: [13, 15]
    quote: >-
      G. Notwithstanding anything to the contrary contained herein, in the CBD-60, CBD-85, CBD-100, CBD-120, CBD-140, B-1a,
      B-1b, B-2c, and B-2d Zoning Districts, no primary use building shall be erected that is less than two stories in any
      of these zones.
    not_limits: {60: a district name (CBD-60), 85: a district name (CBD-85), 100: a district name (CBD-100), 120: a district
        name (CBD-120), 140: a district name (CBD-140), 1: 'district names (B-1a, B-1b)'}
  - &id008
    file: zoning_charts_2026-04.pdf
    page: 5
    lines: [41, 42]
    quote: >-
      (6) Minimum building height requirement shall not apply to development, including additions and/or expansions of existing
      development where the new development or addition or expansion of the existing development does not exceed a footprint
      of 500 square feet.
  examples:
  - given: {stories: 2, building_area: 1200}
    expect: pass
    note: two stories, at the minimum
  - given: {stories: 1, building_area: 1200}
    expect: fail
    note: a one-story primary building
  - given: {stories: 1, building_area: 500}
    expect: needs_review
    note: note 6's 500 sf footprint, which §325-16G doesn't have
  - given: {stories: 1, building_area: 500.01}
    expect: fail
  notes: >-
    §325-16G also holds an addition to an existing building to two stories where the additions pass 50% of the existing
    building area; Gordium checks the building as drawn, as new construction.
  open_questions:
  - >-
    Does chart note 6 (no minimum height for development of 500 sf of footprint or less) also lift §325-16G's two-story
    minimum, which states no such exception?
  research:
  - question: >-
      Does chart note 6 (no minimum height for development of 500 sf of footprint or less) also lift §325-16G's two-story
      minimum, which states no such exception?
    searched:
    - 325-16G
    - 325-8A
    - 325-8B
    sources:
    - &id007
      file: chapter_325_zoning_2026-10.pdf
      page: 26
      lines: [4, 8]
      quote: >-
        (15) Column 16: Minimum Height of Building, Height in Feet. Buildings hereafter erected shall have a minimum height
        as specified herein; provided, however, that the requirements of this column shall not apply to development, including
        additions and/or expansions of existing development where the new development or addition or expansion of the existing
        development does not exceed a footprint of 500 square feet.
    - *id006
    why_open: >-
      §325-8A(15)'s 500 sf exception is written for Column 16 (minimum height in feet); the chart puts note 6 on the heading
      over both the stories and the feet rows; §325-16G's stories minimum, "notwithstanding anything to the contrary", has
      none. No City decision found.
  drafted_by: claude
  status: draft
- id: B-1b.min_height
  kind: rule
  topic: dimensions
  title: Minimum building height, 25 ft (chart p.5, §325-8A(15))
  check: building_height >= 25 or building_area <= 500
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: 'Minimum Building Height [fn3,6]', row: Height in feet, column: B-1B}
  - *id007
  - *id008
  examples:
  - given: {building_height: 25, building_area: 1200}
    expect: pass
    note: exactly the minimum
  - given: {building_height: 24.99, building_area: 1200}
    expect: fail
  - given: {building_height: 12, building_area: 500}
    expect: pass
    note: a footprint of 500 sf or less is exempt
  - given: {building_height: 12, building_area: 500.01}
    expect: fail
  notes: >-
    building_area (every building on the lot, porches and decks included) is at least the new building's footprint, so a
    lot whose buildings cover 500 sf or less is exempt. An addition of 500 sf or less to a larger building is exempt too,
    but Gordium checks the building as drawn and can't tell an addition: it may say does not comply where the exception
    applies (never the other way).
  drafted_by: claude
  status: draft
