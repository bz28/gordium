  status: draft
- id: B-1b.yard_projections
  kind: rule
  topic: dimensions
  title: Eaves into required yards, at most 2 ft (§325-18B)
  check: >-
    front_yard_eaves >= 5 + max(building_height - 50, 0) - 2 and side_yard_smaller_eaves >= 5 + max(building_height - 50,
    0) - 2 and side_yard_larger_eaves >= 5 + max(building_height - 50, 0) - 2 and rear_yard_eaves >= max(min(0.1 * lot_depth,
