  status: draft
- id: B-1b.accessory_buildings
  kind: rule
  topic: dimensions
  title: 'Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)'
  applies_when: accessory_buildings > 0
  check: >-
    accessory_front_yard >= 5 and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >=
    3)
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [34, 36]
    quote: >-
      Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures,
      shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall
      be governed by the requirements below:
  - file: chapter_325_zoning_2026-10.pdf
    page: 66
    lines: [37, 40]
    quote: >-
      A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above
      finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under
      the further provisions of this section. Corner lots shall be considered to have two front yards.
    not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured\
        \ to every street line), not a limit"}
  - file: chapter_325_zoning_2026-10.pdf
    page: 67
    lines: [6, 9]
    quote: >-
      C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line
      or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than
      six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of
      this section.
    not_limits: {1: 'the district name R-1, not a number of feet', 6: six feet applies in R-1 districts only; in a B district
        it is three feet (accessory_side_yard >= 3)}
  - file: zoning_charts_2026-04.pdf
    page: 5
    cell: {section: Yard Dimensions, row: Front (minimum), column: B-1B}
  examples:
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3,
      accessory_rear_yard: 3}
    expect: pass
    note: exactly 3 ft from the side and rear lot lines
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99,
      accessory_rear_yard: 3}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3,
      accessory_rear_yard: 2.99}
    expect: fail
  - given: {accessory_buildings: 1, accessory_front_yard: 4.99, accessory_distances_apply: true, accessory_side_yard: 3,
      accessory_rear_yard: 3}
    expect: fail
    note: in the required front yard
  - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1,
      accessory_rear_yard: 1}
    expect: pass
    note: not frame, under the readings that give it no distance
  - given: {accessory_buildings: 0}
    expect: not_applicable
  notes: B-1B is not an R-1 District, so §325-25C's 3 ft applies.
  drafted_by: claude
  status: draft
- id: B-1b.transition_yards
  kind: flag
  topic: dimensions
  title: 'Next to a residential lot: that district''s yards (§325-19A, B)'
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 49
    lines: [23, 25]
    quote: >-
      A. [fn12]Side yard and rear yard transition. Where a lot in a business or industrial district abuts a lot in a residential
      district, there shall be provided along such abutting lines a yard equal in width or depth to that required in the
      residential district. (See illustration below.)
  - file: chapter_325_zoning_2026-10.pdf
    page: 50
    lines: [3, 6]
    quote: >-
      B. Front yard transition. Where frontage is partly in a residential and partly in a business or industrial district,
      the front yard depth in the business or industrial district shall be equal to 1/2 the required front yard depth of
      the residential district for a distance of at least 50 feet into the business or industrial district. (See illustration
      below.)
  notes: >-
    Gordium doesn't know yet whether a lot next to this one is in a residential district, so every B-1B lot gets this flag:
    where it abuts a residential lot, the yard along that line must be the residential district's; where the street frontage
    is partly residential, the front yard is half the residential one for at least 50 ft. Check by hand (the City's zoning
    map shows the neighbours).
  drafted_by: claude
  status: draft
- id: B-1b.stream_setback
  kind: rule
  topic: dimensions
  title: New structures at least 20 ft from an inlet wall or stream bank (§325-26)
  check: not stream_near_lot or stream_distance >= 20
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 67
    lines: [15, 19]
    quote: >-
      No new structure shall be located nearer than 20 feet to an inlet wall or to the bank of an inlet channel or stream,
      measured at an average water level, except for those structures directly connected with marine or public or commercial
      recreation activities. (See illustration below.) Properties located within the Cherry Street District, the Market
      District, the Newman District, and the West End/Waterfront District are exempt from this requirement.
  - file: chapter_325_zoning_2026-10.pdf
    page: 19
    lines: [19, 20]
    quote: >-
      STRUCTURE — Anything constructed or erected on the ground or which is attached to another structure or building. Structures
      shall not include patios or terraces.
  examples:
  - given: {stream_near_lot: false}
    expect: pass
  - given: {stream_near_lot: true, stream_distance: 20}
    expect: pass
  - given: {stream_near_lot: true, stream_distance: 19.99}
    expect: fail
  notes: >-
    B-1B is none of the four districts §325-26 exempts. Structures for marine or public or commercial recreation are excepted;
    Gordium doesn't ask, so such a structure nearer than 20 ft says does not comply and needs a person's look.
  drafted_by: claude
  status: draft
