- id: B-1b.occupancy_one_family
  kind: rule
  topic: density_and_occupancy
  title: 'One-family occupancy (§325-3B: family + 1 unrelated)'
  applies_when: use in ["one_family_detached", "one_family_semi_detached", "one_family_attached"]
  check: unrelated_persons_with_children <= 1
  review_when:
  - when: unrelated_persons_with_children > 1 and functional_family_unit
    reason: >-
      A functional family unit may occupy a one-family dwelling whatever its size (§325-3B DWELLING, ONE-FAMILY); whether
      this household is one is the City's finding.
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 7
    lines: [36, 37]
    quote: >-
      DWELLING, ONE-FAMILY — A dwelling unit occupied exclusively for residential purposes by an individual or family and
      not more than one unrelated individual or a functional family unit.
  - file: chapter_325_zoning_2026-10.pdf
    page: 7
    lines: [37, 40]
    quote: >-
      In the R-1 Zones, occupancy by an individual or a family and not more than two unrelated individuals is permitted
      if the dwelling is owner-occupied. In the R-2 and R-3 Zones, occupancy by an individual or a family and not more than
      two unrelated individuals is permitted.
    not_limits: {1: 'the district name R-1, not a number', 2: 'the district name R-2; and the R-1, R-2 and R-3 allowance
        of two, which isn''t this district''s', 3: 'the district name R-3, not a number'}
  - &id011
    file: chapter_325_zoning_2026-10.pdf
    page: 9
    lines: [27, 28]
    quote: >-
      FAMILY — One or more persons occupying a dwelling unit, all of whom are related by blood, marriage or adoption.
  - file: chapter_325_zoning_2026-10.pdf
    page: 10
    lines: [11, 13]
    quote: >-
      FUNCTIONAL FAMILY UNIT — A group of individuals living together in a single dwelling unit and functioning as a family
      with respect to those characteristics that are consistent with the purposes of zoning restrictions in residential
      neighborhoods.
  - file: chapter_325_zoning_2026-10.pdf
    page: 26
    lines: [28, 28]
    quote: >-
      (6) [fn3]In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be
    not_limits: {1: 'the district name R-1, not a number', 2: 'the district name R-2, not a number'}
  examples:
  - given: {use: one_family_detached, unrelated_persons_with_children: 1}
    expect: pass
  - given: {use: one_family_detached, unrelated_persons_with_children: 2, functional_family_unit: false}
    expect: fail
    note: 'two unrelated: allowed in R-2 and R-3, not here'
  - given: {use: one_family_detached, unrelated_persons_with_children: 2, functional_family_unit: true}
    expect: needs_review
  - given: {use: two_family, unrelated_persons_with_children: 5}
    expect: not_applicable
  notes: >-
    B-1B is none of the R-1, R-2 and R-3 Zones whose sentences raise the limit, so the definition's first sentence holds:
    an individual or a family and not more than one unrelated individual. Minor dependent children are left out only in
    R-1 and R-2 Districts (§325-8B(6)), so here they count.
  drafted_by: claude
  status: draft
