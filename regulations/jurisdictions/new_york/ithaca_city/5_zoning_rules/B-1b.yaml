    lines: [22, 26]
    quote: >-
      (a) Subject to the provisions of the following Subsection A(14)(b), buildings hereafter erected in each district must
      have a rear yard of at least the depth which is the percentage figure listed in this column. Such percentage shall
      be taken of the lot depth. If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken
