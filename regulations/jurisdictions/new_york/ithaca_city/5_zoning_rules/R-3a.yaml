        expect: pass
        note: eaves clear of every required yard
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: pass
        note: eaves exactly 2 ft into the front (10 − 2), narrower side (5 − 2), wider side (10 − 2) and rear (20% of 125 = 25, − 2) yards
      - given: {front_yard_eaves: 7.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
        note: an eave just over 2 ft into the 5 ft side yard
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 22.99, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {front_yard_eaves: 11, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 125, building_height: 43}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {front_yard_eaves: 10.99, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 125, building_height: 43}
        expect: fail
        note: the 13 ft front yard the bonus requires, less 2 ft, is 11
