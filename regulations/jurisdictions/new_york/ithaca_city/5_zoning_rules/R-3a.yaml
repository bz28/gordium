        expect: pass
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 14999}
        expect: fail
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: false, lot_area: 500000}
        expect: needs_review
        note: "another building holds another use: its own figure, added by hand"
      - given: {use: one_family_detached, primary_buildings: 2, lot_area: 500000}
        expect: needs_review
        note: "whether every building holds this use not said"
      - given: {use: one_family_detached, lot_area: 500000}
        expect: needs_review
        note: "the primary buildings not counted"
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 10000}
        expect: pass
      - given: {use: one_family_semi_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 9999}
        expect: fail
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 10000}
        expect: pass
      - given: {use: two_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 9999}
        expect: fail
      - given: {use: fraternity_sorority_group_house, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 50000}
        expect: pass
      - given: {use: fraternity_sorority_group_house, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 49999}
        expect: fail
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 12000}
        expect: pass
        note: "Other use"
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 11999}
        expect: fail
      - given: {use: one_family_attached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: multiple_family, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: dormitory, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: nursing_home, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
      - given: {use: one_family_detached_zero_lot_line, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 1000000}
        expect: needs_review
    notes: >-
      §325-8B(1): every residential district's lot-size figure applies again to each further primary use in a separate
      building on the lot (the code's own example: in R-2b, 3,000 sf for a house and 3,000 sf more for each further
      house). With one primary building this rule doesn't apply: the use's own lot-area rule (R-3a.lot_area_*) checks
      it. With two or more, the lot needs the figure once per building, when every building holds the lot's use
      (primary_buildings_same_use); otherwise each building's own figure, added by hand. Gordium counts the primary
      buildings from the drawing where it can (one building, or none standing apart that could hold a home); a
      building standing apart that could (a large garage, a second house) is read both ways until the architect states
      the count. An accessory building (a garage, a shed, an accessory dwelling unit, §325-3B) isn't a primary
      building.
    drafted_by: claude
    status: draft

  - id: R-3a.yards_not_shared
    kind: flag
    topic: dimensions
    title: "A yard required for one building can't count for another (§325-7B)"
    applies_when: primary_buildings > 1
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [8, 10]
        quote: "B. Use of yard for another building. No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building."
      - file: chapter_325_zoning_2026-10.pdf
        page: 14
        lines: [37, 39]
        quote: "LOT, BUILDING — A parcel of land occupied or to be occupied by one or more buildings and any accessory buildings, together with such open spaces as are required under the provisions of this chapter,"
    examples:
      - given: {primary_buildings: 1}
        expect: not_applicable
        note: one primary building on the lot; nothing on it to share a yard with
      - given: {primary_buildings: 2}
        expect: needs_review
        note: two primary buildings; how their yards are divided is the open question
      - given: {}
        expect: needs_review
        note: the primary buildings not counted
    open_questions:
    - '§325-7B: "No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building." With two or more primary buildings on one lot, how are their yards kept apart: is each building''s yard measured from it to the lot lines, with no building standing in another''s required yard; or must the space between two buildings also be at least the yards each needs on the sides facing each other, added together?'
    research:
    - question: '§325-7B: "No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building." With two or more primary buildings on one lot, how are their yards kept apart: is each building''s yard measured from it to the lot lines, with no building standing in another''s required yard; or must the space between two buildings also be at least the yards each needs on the sides facing each other, added together?'
      searched:
      - 325-7B
      - 325-3B:yard
      - 325-3B:front_yard
      - 325-3B:side_yard
      - 325-3B:rear_yard
      - 325-3B:lot_building
      - 325-3B:primary_structure
      - 325-8B
      - 325-25A
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [35, 36]
        quote: An open space extending from the front yard to the rear yard between any building and the side lot line
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [31, 31]
        quote: An open space extending the full width of the lot between a main building
      why_open: >-
        The code defines every yard between a building and a lot line (§325-3B YARD (1) to (3)), never between two
        buildings on one lot, and §325-7B says only that one building's required yard can't be another's, not where
        one ends and the next begins. No City interpretation or Board of Zoning Appeals decision was found
        (searched 2026-10-27); other New York codes with the same clause (Yonkers, East Rockaway) don't spell it out
        either. Gordium measures the yards from the main building only, so with two or more primary buildings this
        needs review either way.
      readings:
      - id: to_lot_lines
        reading: each primary building's yards measured from it to the lot lines, and no building inside another's required yard
      - id: sum_between
        reading: also, the space between two primary buildings at least the yards each needs on the facing sides, added together
      report: docs/research/2026-10-27_audit_gaps.md §5
    findings:
    - id: accessory_buildings_may_stand_in_yards
      question: Does §325-7B stop an accessory building (a garage, a shed) standing in the main building's side or rear yard?
      kind: law
      answer: 'No: accessory structures "shall be exempt from side yard requirements" and "are permitted in any side or rear yard but not in a required front yard" (§325-25, §325-25A); their own distances are checked by the accessory-building rule.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [35, 35]
        quote: shall be exempt from side yard requirements contained in the District Regulations Chart
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 38]
        quote: Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard
      still_open: []
      report: docs/research/2026-10-27_audit_gaps.md §5
    - id: yards_on_this_lot
      question: Does §325-7B reach a building on a neighbouring lot (a lot split off from one whose building needed the land as its yard)?
      kind: reading
      answer: 'Gordium reads it within one lot: a yard is "That part of a lot" (§325-3B YARD), so this lot''s yards serve the buildings on it, and a neighbouring building''s required yards lie on its own lot, where its own rules check them.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [28, 28]
        quote: YARD — That part of a lot not occupied by the principal building or structure
      strength: strong
      confirm_with: the architects
      still_open: []
      report: docs/research/2026-10-27_audit_gaps.md §5
    notes: >-
      With one primary building on the lot (garages, sheds and an accessory dwelling unit are accessory buildings,
      not primary ones) nothing on the lot can share its yards: not applicable. With two or more, this needs review
      until the open question is answered: check by hand that no building stands in another's required yard, and
      how the space between them is divided. The primary buildings are counted as for §325-8B(1)
      (primary_buildings).
    drafted_by: claude
    status: draft

  - id: R-3a.stream_setback
    kind: rule
    topic: dimensions
    title: "New structures at least 20 ft from an inlet wall or stream bank (§325-26)"
    check: not stream_near_lot or stream_distance >= 20
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [15, 19]
        quote: "No new structure shall be located nearer than 20 feet to an inlet wall or to the bank of an inlet channel or stream, measured at an average water level, except for those structures directly connected with marine or public or commercial recreation activities. (See illustration below.) Properties located within the Cherry Street District, the Market District, the Newman District, and the West End/Waterfront District are exempt from this requirement."
      - file: chapter_325_zoning_2026-10.pdf
        page: 19
        lines: [19, 20]
        quote: "STRUCTURE — Anything constructed or erected on the ground or which is attached to another structure or building. Structures shall not include patios or terraces."
    examples:
      - given: {stream_near_lot: false}
        expect: pass
        note: nothing within 20 ft of the lot, so no structure on it can be nearer
      - given: {stream_near_lot: true, stream_distance: 20}
        expect: pass
        note: at the limit ("nearer than 20 feet" is what's barred)
      - given: {stream_near_lot: true, stream_distance: 19.9}
        expect: fail
      - given: {stream_near_lot: true}
        expect: needs_review
        note: a stream or inlet near the lot, the distance not given
      - given: {stream_distance: 35}
        expect: pass
        note: the nearest new structure is 35 ft from it, whatever else is said
      - given: {stream_distance: 12}
        expect: needs_review
        note: whether a stream or inlet is near the lot not said
      - given: {}
        expect: needs_review
        note: nothing said about streams, never a pass
    findings:
    - id: stream_setback_measured_level
      question: How is §325-26's 20 ft measured?
      kind: law
      answer: 'Across, level, from the new structure to the point where the average water level meets the bank (or the inlet wall): the section''s own illustration (p.67 of the PDF, below the text; read from the page, research §7) draws "20'' MIN" as a horizontal dimension from the structure''s face to the bank at "AVERAGE LEVEL", between the high-water and low-water lines; the text says the distance is "measured at an average water level".'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [15, 16]
        quote: No new structure shall be located nearer than 20 feet to an inlet wall or to the bank of an inlet channel or stream, measured at an average water level
      report: docs/research/2026-10-27_audit_gaps.md §7
    - id: stream_setback_every_structure
      question: Which structures does §325-26 reach?
      kind: law
      answer: 'Every new structure: "Anything constructed or erected on the ground or which is attached to another structure or building", so a garage, a deck, a shed or a fence as well as the house; patios and terraces are not structures. Its exception is for structures "directly connected with marine or public or commercial recreation activities".'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 19
        lines: [19, 20]
        quote: STRUCTURE — Anything constructed or erected on the ground or which is attached to another structure or building. Structures shall not include patios or terraces.
      report: docs/research/2026-10-27_audit_gaps.md §7
    notes: >-
      Gordium's model doesn't show the water, so the architect states whether any inlet wall or stream bank (at average
      water level) is within 20 ft of the lot (stream_near_lot) and, if so, the least distance from any new structure
      to it (stream_distance, measured across, level, as the section's illustration shows). Both blank by default: a
      blank needs review, never a pass. An addition counts as new construction (Gordium asks the cautious way). Not
      applied: the exception for structures "directly connected with marine or public or commercial recreation
      activities" (a dock or boathouse): Gordium shows such a structure nearer than 20 ft as not complying; ask the
      zoning office. The districts exempted by name (Cherry Street, Market, Newman, West End/Waterfront) aren't
      residential districts.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_size_zero_lot_line
    kind: flag
    topic: dimensions
    title: "Lot size and width, zero-lot-line house: chart shows \"-\" (chart p.3)"
    applies_when: use == "one_family_detached_zero_lot_line"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached, zero lot line", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
