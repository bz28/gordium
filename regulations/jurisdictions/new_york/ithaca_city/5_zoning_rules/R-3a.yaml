    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 6600}
        expect: pass
      - given: {use: two_family, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 4999}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_one_family_attached
    kind: rule
    topic: dimensions
    title: "Lot size by units and rooms let, one-family attached (chart p.3, note 7)"
    applies_when: use == "one_family_attached"
    check: lot_area >= (7000 if conversion else 6000) + 750 * max(dwelling_units - 3, 0) + 500 * rooms_let_for_profit
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, by conversion", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [14, 14]
        quote: "One-family dwelling, attached, new construction - - - - 1,500 sf [fn6] 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [13, 13]
        quote: "One-family dwelling, attached, by conversion - - - - 1,500 sf [fn6] 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
        not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 750 sf only past 3"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      # worked by hand from note 7: base 6,000 sf new / 7,000 sf by conversion for the first 1-3 units,
      # + 750 sf for each unit past 3, + 500 sf per room let for profit; each step on both sides
      - given: {use: one_family_attached, lot_area: 6000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 3 units, no rooms let -> 6,000 sf; at the limit
      - given: {use: one_family_attached, lot_area: 5999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 6750, dwelling_units: 4, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 4 units -> 6,000 + 750 = 6,750 sf
      - given: {use: one_family_attached, lot_area: 6749, dwelling_units: 4, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 9750, dwelling_units: 8, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 8 units -> 6,000 + 5 x 750 = 9,750 sf
      - given: {use: one_family_attached, lot_area: 9749, dwelling_units: 8, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 6500, dwelling_units: 3, rooms_let_for_profit: 1, conversion: false}
        expect: pass
        note: new, 3 units, 1 room let -> 6,000 + 500 = 6,500 sf
      - given: {use: one_family_attached, lot_area: 6499, dwelling_units: 3, rooms_let_for_profit: 1, conversion: false}
        expect: fail
      - given: {use: one_family_attached, lot_area: 7000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: pass
        note: by conversion, 3 units -> 7,000 sf
      - given: {use: one_family_attached, lot_area: 6999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: fail
        note: enough for new construction (6,000 sf), not by conversion
      - given: {use: one_family_attached, lot_area: 8750, dwelling_units: 4, rooms_let_for_profit: 2, conversion: true}
        expect: pass
        note: by conversion, 4 units, 2 rooms let -> 7,000 + 750 + 2 x 500 = 8,750 sf
      - given: {use: one_family_attached, lot_area: 8749, dwelling_units: 4, rooms_let_for_profit: 2, conversion: true}
        expect: fail
      - given: {use: one_family_attached, lot_area: 20000, rooms_let_for_profit: 0, conversion: false}
        expect: needs_review
        note: the units not given -> never a pass, however large the lot
      - given: {use: one_family_attached, lot_area: 20000, dwelling_units: 3, conversion: false}
        expect: needs_review
        note: the rooms let not given
      - given: {use: one_family_attached, lot_area: 20000, dwelling_units: 3, rooms_let_for_profit: 0}
        expect: needs_review
        note: new construction or conversion not given
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Note 7 in full, encoded (decided 2026-10-21: a row may not say complies while note 7's additions are left
      out): the chart's base for the first 1-3 units (6,000 sf new construction, 7,000 sf by conversion, §325-3B
      CONVERSION), + 750 sf for each unit past 3, + 500 sf per room let for profit. The units, the rooms let and
      whether it is a conversion are stated by the architect (dwelling_units, rooms_let_for_profit, conversion);
      any of them not given and the rule needs review, never a pass. An attached building has 3 to 6 dwellings (§325-3B): a new row of 5 needs 6,000 + 2 x 750 = 7,500 sf.
    drafted_by: claude
    status: draft

  - id: R-3a.attached_units_per_building
    kind: rule
    topic: dimensions
    title: "Attached building: three to six dwelling units (§325-3B)"
    applies_when: use == "one_family_attached"
    check: attached_units_in_building >= 3 and attached_units_in_building <= 6
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 14]
        quote: "(4) ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings, each of which shares one or more party walls or structural elements with the other one-family dwellings in the building and which has direct exterior access from the ground floor. A maximum of six one-family dwelling units may be attached to form a single building."
        not_limits: {1: "\"one or more party walls\": how the units are joined, not a count of units"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [32, 33]
        quote: "(5) Rooming house; boarding house; cooperative household; fraternity, sorority, or group house; row house, townhouse, or garden apartment housing as defined in this section."
    examples:
      - given: {use: one_family_attached, attached_units_in_building: 3}
        expect: pass
        note: the fewest
      - given: {use: one_family_attached, attached_units_in_building: 6}
        expect: pass
        note: the most
      - given: {use: one_family_attached, attached_units_in_building: 2}
        expect: fail
        note: two units joined are a semi-detached building, not an attached one
      - given: {use: one_family_attached, attached_units_in_building: 7}
        expect: fail
        note: past the definition's six
      - given: {use: one_family_attached, attached_units_in_building: 8, dwelling_units: 2}
        expect: fail
        note: two units on this lot of a row of eight; the cap is on the whole building, every lot it stands on
      - given: {use: one_family_attached}
        expect: needs_review
        note: the building's units not given
      - given: {use: two_family, attached_units_in_building: 2}
        expect: not_applicable
    notes: >-
      Counted over the whole building, every lot it stands on together (attached_units_in_building), not the units on
      this lot (dwelling_units): a row house on its own lot is one unit of a building of three to six. Gordium's
      massing model shows the building on this lot only, so the architect states the count. A building of seven or
      more joined one-family dwelling units is past the definition's maximum ("A maximum of six"), so it does not
      comply as this use. Whether such a row may instead be built as a multiple dwelling (§325-3B MULTIPLE DWELLING
      (5): row house, townhouse) is not settled by the code: the definitions point both ways, as in the architects'
      question §5.6; Gordium doesn't decide it, and doesn't check a row house's own limits (§325-3B ROW HOUSE) yet.
      Two joined units are a one-family semi-detached dwelling (§325-3B (3)).
    drafted_by: claude
    status: draft

