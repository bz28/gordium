    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, new construction", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, by conversion", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [17, 17]
        quote: "Multiple family dwelling, new construction - - - - - 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [16, 16]
        quote: "Multiple family dwelling, by conversion - - - - - 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
        not_limits: {1: "the first 1-3 units: the base lot area covers units one to three; the formula adds 750 sf only past 3"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 6
        lines: [26, 27]
        quote: "CONVERSION — The changing of use or occupancy by alteration, addition or by other reorganization."
    examples:
      # worked by hand from note 7: base 6,000 sf new / 7,000 sf by conversion for the first 1-3 units,
      # + 750 sf for each unit past 3, + 500 sf per room let for profit; each step on both sides
      - given: {use: multiple_family, lot_area: 6000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 3 units, no rooms let -> 6,000 sf; at the limit
      - given: {use: multiple_family, lot_area: 5999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 6750, dwelling_units: 4, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 4 units -> 6,000 + 750 = 6,750 sf
      - given: {use: multiple_family, lot_area: 6749, dwelling_units: 4, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 9750, dwelling_units: 8, rooms_let_for_profit: 0, conversion: false}
        expect: pass
        note: new, 8 units -> 6,000 + 5 x 750 = 9,750 sf
      - given: {use: multiple_family, lot_area: 9749, dwelling_units: 8, rooms_let_for_profit: 0, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 6500, dwelling_units: 3, rooms_let_for_profit: 1, conversion: false}
        expect: pass
        note: new, 3 units, 1 room let -> 6,000 + 500 = 6,500 sf
      - given: {use: multiple_family, lot_area: 6499, dwelling_units: 3, rooms_let_for_profit: 1, conversion: false}
        expect: fail
      - given: {use: multiple_family, lot_area: 7000, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: pass
        note: by conversion, 3 units -> 7,000 sf
      - given: {use: multiple_family, lot_area: 6999, dwelling_units: 3, rooms_let_for_profit: 0, conversion: true}
        expect: fail
        note: enough for new construction (6,000 sf), not by conversion
      - given: {use: multiple_family, lot_area: 8750, dwelling_units: 4, rooms_let_for_profit: 2, conversion: true}
        expect: pass
        note: by conversion, 4 units, 2 rooms let -> 7,000 + 750 + 2 x 500 = 8,750 sf
      - given: {use: multiple_family, lot_area: 8749, dwelling_units: 4, rooms_let_for_profit: 2, conversion: true}
        expect: fail
      - given: {use: multiple_family, lot_area: 20000, rooms_let_for_profit: 0, conversion: false}
        expect: needs_review
        note: the units not given -> never a pass, however large the lot
      - given: {use: multiple_family, lot_area: 20000, dwelling_units: 3, conversion: false}
        expect: needs_review
        note: the rooms let not given
      - given: {use: multiple_family, lot_area: 20000, dwelling_units: 3, rooms_let_for_profit: 0}
        expect: needs_review
        note: new construction or conversion not given
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      Note 7 in full, encoded (decided 2026-10-21: a row may not say complies while note 7's additions are left
      out): the chart's base for the first 1-3 units (6,000 sf new construction, 7,000 sf by conversion, §325-3B
      CONVERSION), + 750 sf for each unit past 3, + 500 sf per room let for profit. The units, the rooms let and
      whether it is a conversion are stated by the architect (dwelling_units, rooms_let_for_profit, conversion);
      any of them not given and the rule needs review, never a pass. Replaces the flag R-3a.lot_area_note_7: nothing of note 7 is left unencoded.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_fraternity
