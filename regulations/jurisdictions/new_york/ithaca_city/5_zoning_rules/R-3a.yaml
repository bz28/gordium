      Column 12 (one side at least 10 ft) and Column 13 (the other at least 5 ft) together mean: the wider side yard at
      least 10 ft and the narrower at least 5 ft. The other-side row prints "5 ft 5 ft 5 ft" for R-3A, R-3AA, R-3B
      after R-2B's 5 ft, with R-2C's "0 ft /5 ft / 10 ft [fn15]" on the lines above and below; the word positions put
      the second 5 ft under R-3A. Notes 14 and 15 belong to R-2C. Corner lots: see the known gap in this file's header.
    drafted_by: claude
    status: draft

  - id: R-3a.rear_yard
    kind: rule
    topic: dimensions
    title: "Rear yard minimum (chart p.3, note 16; lot depth §325-8A(14))"
    check: rear_yard >= max(min(0.2 * lot_depth, 50), 20)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
    examples:
      - given: {rear_yard: 25, lot_depth: 125}
        expect: pass
        note: exactly 20% of 125 (R-1's 25% would ask 31.25)
      - given: {rear_yard: 24.99, lot_depth: 125}
        expect: fail
      - given: {rear_yard: 50, lot_depth: 300}
        expect: pass
        note: 20% would be 60 ft; the chart caps it at 50 ft
      - given: {rear_yard: 49.99, lot_depth: 300}
        expect: fail
      - given: {rear_yard: 20, lot_depth: 90}
        expect: pass
        note: 20% would be 18 ft; note 16 sets the floor at 20 ft
      - given: {rear_yard: 19.99, lot_depth: 90}
        expect: fail
    notes: >-
      R-3A's cell is "20%/ 50 ft [fn16]", the sixth value. The percentage governs for lot depths from 100 ft (20% =
      20 ft) to 250 ft (20% = 50 ft). Lot depth is the average of the two side lot lines if they differ (§325-8A(14)(a)).
    open_questions:
    - 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the Zoning
      Administrator''s perpendicular method, and one detail of it is still open.'
    research:
    - question: 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the
        Zoning Administrator''s perpendicular method, and one detail of it is still open.'
      searched:
