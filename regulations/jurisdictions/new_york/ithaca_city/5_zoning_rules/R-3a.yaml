  - id: R-3a.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 40 or building_height <= 40 + 0.1 * 40
      and front_yard >= 10 + (building_height - 40)
      and side_yard_smaller >= 5 + (building_height - 40)
      and side_yard_larger >= 10 + (building_height - 40)
      and rear_yard >= max(min(0.2 * lot_depth, 50), 20) + (building_height - 40)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft 35 ft 35 ft 35 ft 35 ft 40 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 7]
        quote: "In any district, any main building may be erected to a height in excess of that specified for the district, provided that:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: "(3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that district."
    examples:
      - given: {building_height: 40, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 25, lot_depth: 125}
        expect: pass
        note: exactly at 40 ft with every yard at its minimum (rear 20% of 125 = 25)
      - given: {building_height: 40.01, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 25, lot_depth: 125}
        expect: fail
        note: over 40 ft, so every yard must grow by the extra height
      - given: {building_height: 44, front_yard: 14, side_yard_smaller: 9, side_yard_larger: 14, rear_yard: 29, lot_depth: 125}
        expect: pass
        note: the most the bonus allows (10% of 40 = 4 ft), each yard 4 ft larger
      - given: {building_height: 44.01, front_yard: 30, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 50, lot_depth: 125}
        expect: fail
        note: past 44 ft, however large the yards
      - given: {building_height: 38, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 25, lot_depth: 125}
        expect: pass
        note: 38 ft is over R-1's 35 ft but under R-3a's 40 ft, with no larger yards needed
      - given: {building_height: 42, front_yard: 11.99, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 27, lot_depth: 125}
        expect: fail
        note: the front yard must be 10 + 2 = 12
      - given: {building_height: 42, front_yard: 12, side_yard_smaller: 6.99, side_yard_larger: 12, rear_yard: 27, lot_depth: 125}
        expect: fail
        note: the narrower side yard must be 5 + 2 = 7
      - given: {building_height: 42, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 11.99, rear_yard: 27, lot_depth: 125}
        expect: fail
        note: the wider side yard must be 10 + 2 = 12
      - given: {building_height: 42, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 26.99, lot_depth: 125}
        expect: fail
        note: the rear yard must be 25 + 2 = 27
    open_questions:
    - '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height, or allowed
      on top of the bonus height too?'
    research:
    - question: '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height,
        or allowed on top of the bonus height too?'
      searched:
      - 325-16
      - 325-16A
      - 325-16B
      - 325-16C
      - 325-3B:height_of_building
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [4, 4]
        quote: cornice for ornament
      why_open: §325-16B allows an ornamental parapet or cornice up to 5 ft above the height limit, but doesn't say
        whether that is the chart's limit or the bonus height §325-16C allows, or whether a parapet that guards a roof
        deck (not "for ornament") qualifies. No City record found. (The same question as R-1b.height's, since the words
        are the same in every district.)
      readings:
      - id: from_chart_limit
        reading: the 5 ft is measured from the chart's height limit (the stricter reading)
      - id: from_bonus_height
        reading: the 5 ft is measured from the bonus height §325-16C allows
      report: docs/research/2026-10-20_architect_questions.md §4.6
    findings:
    - id: height_bonus_every_yard
      question: '§325-16C(1): we read "each required ... yard is increased one foot ... for each one foot of such additional
        height" as: each yard must be at least its normal requirement plus the extra height (both side yards included).
        Confirm.'
      kind: law
      answer: 'Confirmed: every required front, side and rear yard grows one foot for each foot of extra height.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 8]
        quote: Each required front, side and rear yard is increased one foot on the ground for each one foot
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    - id: height_bonus_main_building_only
      question: Does the bonus apply to accessory buildings too, or only the main building ("any main building")?
      kind: law
      answer: Only the main building ("any main building"). The number of stories still can't be exceeded, and the extra
        feet are at most 10% of the maximum building height.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 6]
        quote: any main building may be erected to a height in excess of that
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: the number of stories permitted may not be exceeded
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: may not exceed 10% of the maximum building height
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    notes: >-
      Arithmetic for the bonus: 10% of the 40 ft maximum = 4 ft, so at most 44 ft, with every required yard 1 ft
      larger per extra foot (R-3A's yards: front 10, sides 10 and 5, so the wider side yard grows from 10 and the
      narrower from 5; rear 20% of the lot depth, at most 50 ft, at least 20 ft). Where the lot abuts R-1 land,
      §325-19E lowers the height to R-1's 35 ft for most uses (R-3a.abutting_r1).
    drafted_by: claude
    status: draft

  - id: R-3a.lot_coverage
    kind: rule
    topic: dimensions
    title: "Maximum lot coverage by buildings (chart p.3, §325-8A(10))"
    check: building_area <= 0.35 * lot_area
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Maximum lot coverage by buildings, row: Percent of lot area, column: R-3A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [5, 7]
        quote: "On a lot hereafter used, no greater percentage of total lot area may be covered by principal and accessory buildings above ground."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [7, 9]
        quote: "For this purpose, the area covered by principal and accessory buildings shall include all porches, attached or freestanding decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [9, 10]
        quote: "This sum, divided by the total lot area, shall not exceed the maximum allowed percentage of lot coverage specified in this column."
    open_questions:
    - 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey (lot), and
      whether roof eaves count (building_area). Garages count: see building_area''s findings.'
    research:
    - question: 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey
        (lot), and whether roof eaves count (building_area). Garages count: see building_area''s findings.'
      searched:
      - 325-8A
      - 325-3B:building_area
      - 325-3B:lot
      sources: []
      why_open: It depends on the lot and building_area questions, which are still open; see their research.
      report: docs/research/2026-10-20_architect_questions.md §3.2
    findings:
    - id: below_ground_not_counted
      question: '"Above ground": are parts of a building below grade (e.g. a buried garage under a deck) left out of
        building_area?'
      kind: reading
      answer: Parts wholly below ground don't count (Column 10 counts what is covered "above ground"; §325-25B lets
        wholly below-grade accessory structures go anywhere). A deck on top of a buried garage does count.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [6, 7]
        quote: covered by principal and accessory buildings above ground
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [4, 4]
        quote: entirely below the finished grade
      still_open: []
      strength: strong
      confirm_with: the City zoning office
      report: docs/research/2026-10-20_architect_questions.md §3.2
    examples:
      - given: {building_area: 2310, lot_area: 6600}
        expect: pass
        note: exactly 35% of 6,600 sf
      - given: {building_area: 2311, lot_area: 6600}
        expect: fail
      - given: {building_area: 2000, lot_area: 6600}
        expect: pass
        note: 30.3%, over R-1b's 25% but under R-3a's 35%
    notes: >-
      The chart line reads "20% 25% 30% 35% 35% 35% 40% 25% [fn13]": eight values, because R-2C's cell ("35%/40%
      /50% [fn12]") is printed on the lines above and below. So the values are R-1A 20, R-1B 25, R-2A 30, R-2B 35,
      R-3A 35, R-3AA 35, R-3B 40, RU 25; the word positions put the fifth 35% under R-3A, and the chart reader agrees.
      Notes 12 and 13 belong to R-2C and RU, not R-3A. Where the lot abuts R-1 land, §325-19E lowers coverage to 75%
      of 35% for most uses (R-3a.abutting_r1).
    drafted_by: claude
    status: draft

  - id: R-3a.front_yard
