      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-3A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [22, 25]
        quote: "(4) Where a variance or special permit is required or where special conditions apply to allow in one district a use which is permitted by right in another district, the regulations applying to such use shall be those of whichever district has the stricter regulations, unless otherwise determined by the Board of Zoning Appeals."
        not_limits: {1: "\"in one district\": not a number"}
    examples:
      - given: {use: one_family_detached_zero_lot_line}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: not_applicable
    open_questions:
    - 'R-3A allows a zero-lot-line house by special permit (chart p.2), but its lot-size and lot-width cells are "-"
      (chart p.3). What minimum lot size and width apply: none, the "Other use" rows (6,000 sf, 50 ft), or whatever the
      Planning and Development Board sets with the special permit?'
    research:
    - question: 'R-3A allows a zero-lot-line house by special permit (chart p.2), but its lot-size and lot-width cells
        are "-" (chart p.3). What minimum lot size and width apply: none, the "Other use" rows (6,000 sf, 50 ft), or
        whatever the Planning and Development Board sets with the special permit?'
      searched:
      - 325-8A
      - 325-8B
      - 325-9B
      - 325-3B:one_family_detached_dwelling_zero_lot_line
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [23, 23]
        quote: which is permitted by right in another district
      why_open: Elsewhere on the chart "-" means "not allowed", which can't be meant here, since p.2 allows the use by
        special permit. §325-8B(4) would borrow the stricter regulations of a district where the use is permitted by
        right, but no residential district permits it by right (R-2C, R-3A, R-3AA and R-3B mark it SP; R-1, R-2A,
        R-2B and RU mark it -). §325-9B(1) doesn't list it either. No City record found.
      readings:
      - id: no_minimum
        reading: no minimum lot size or width
      - id: other_use_rows
        reading: the "Other use" rows apply (6,000 sf, 50 ft)
      - id: set_by_special_permit
        reading: the Planning and Development Board sets them with the special permit
    notes: The use needs a special permit anyway (R-3a.use), so the result is NEEDS REVIEW whatever the answer.
    drafted_by: claude
    status: draft

