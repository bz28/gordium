# R-3a (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# the same way R-1b.yaml was. An ANSWER KEY for grading the drafting script: written without looking at anything the
# script drafted or recorded, from the City's documents only (2_extracted_text/, the chart read cell by cell, the
# definitions), with R-1b.yaml as the model of the format.
#
# Why R-3a: it is a multi-family district. Nearly every residential use is allowed (two-family, row houses,
# apartments, dormitories), the lot size grows with the number of units (chart p.3 note 7), the two side yards
# differ (10 ft and 5 ft), and §325-19E adds stricter limits where an R-3a lot abuts R-1 land. A drafter that
# assumes one house per lot, equal side yards, or R-1's numbers fails here.
#
# Every chart number was read three ways and agrees: the chart's text line (quoted), the chart reader's R-3A cell
# (cited), and each word's position on the page under the R-3A heading (checked by hand with pdfplumber's word
# positions, 2026-10-20). R-3A is the sixth column; test_r1b_matches_chart.py checks the rules against its cells.
#
# Where R-3a differs from R-1b: see the PR description's table. In short: every use on chart p.2 is • or SP (none is
# "-"); lot sizes by use (5,000 sf one-family detached, semi-detached and two-family; 6,000 sf + note 7 for attached
# and multiple dwellings; 25,000 sf fraternity; 6,000 sf other); lot widths 40 / 50 / 100 ft by use; 4 stories,
# 40 ft (bonus to 44 ft); coverage 35%; front 10 ft; sides 10 ft and 5 ft; rear 20% of the lot depth (50 ft cap,
# 20 ft floor); accessory buildings 3 ft from side and rear lot lines (not R-1's 6 ft); §325-19E; loading (p.14).
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2), accessory dwelling
# units (§325-28), occupancy limits (p.2 note 4, §325-3), height exceptions for chimneys and similar (§325-16A,
# applied when measuring height), more than one main building on a lot (§325-8B(1)), cluster subdivisions (§325-11),
# the loading rule for nonresidential uses ("Allowed by variance", p.14).
#
# Known gap (reported, not fixable in this file): on a corner lot one side yard is left, and the City checks it
# against Column 13 (5 ft in R-3a; the corner_lot_side_yard_column_13 finding). The measurements give that one yard
# as both side measures, and the rule language has no corner-lot measure, so R-3a.side_yards asks 10 ft of it: a
# stricter answer than the City's practice (a false fail, never a false pass) until a corner_lot measure exists.

district: R-3a
rules:

  - id: R-3a.use
    kind: flag
    topic: uses
    title: "Uses by special permit (chart p.2); every other listed use is permitted"
    applies_when: >-
      use in ["one_family_detached_zero_lot_line", "cemetery", "public_utility_structure", "school",
      "neighborhood_commercial_facility", "hospital_or_sanitarium", "bed_and_breakfast_inn"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked SP for R-3A
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Hospital or sanitarium", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Bed-and-breakfast inn", column: R-3A}
      # marked • for R-3A (permitted: nothing to check)
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Multiple family dwelling [fn4]", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Fraternity, sorority, or group house", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Dormitory", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursing, convalescent or rest home", column: R-3A}
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [29, 30]
        quote: "(f) Neighborhood retail or service commercial facilities in R-2, R-3, CR-2, CR-3, and CR-4 Districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [31, 31]
        quote: "(g) Hospitals or sanatoriums in R-3, CR-3, and CR-4 Districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [36, 36]
        quote: "(p) Bed-and-breakfast inns in all districts."
    examples:
      - given: {use: school}
        expect: needs_review
      - given: {use: hospital_or_sanitarium}
        expect: needs_review
      - given: {use: one_family_detached_zero_lot_line}
        expect: needs_review
      - given: {use: multiple_family}
        expect: not_applicable
        note: marked • (permitted)
      - given: {use: dormitory}
        expect: not_applicable
        note: marked • for R-3A (R-3AA, the next column, is -)
      - given: {use: nursery_school_or_child_day_care}
        expect: not_applicable
        note: marked • (a special permit only in R-2, CR-2 and R-U, §325-9B(1)(e))
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: zero_lot_line_sp_not_in_325_9
      question: The chart marks a one-family detached zero-lot-line dwelling SP in R-3A, but §325-9B(1)'s list of
        special-permit uses has no zero-lot-line item. Does it need a special permit?
      kind: reading
      answer: 'Treated as needing one: the chart is part of the law (§325-8A: "made a part of this chapter") and its
        SP mark is the more specific statement. Either way Gordium can''t pass it, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [12, 12]
        quote: The District Regulations Chart is hereby made a part of this chapter
      strength: strong
      confirm_with: the City zoning office
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations (in R-3a, notably §325-19E). Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      R-3A is the sixth mark in each row of page 2 (R-1A, R-1B, R-2A, R-2B, R-2C, R-3A, R-3AA, R-3B, RU). Every one
      of the 20 primary uses is • or SP for R-3A; none is "-". So there is nothing to fail: this is a flag that sends
      the 7 SP uses to review, and the 13 • uses are permitted (not applicable here; their own dimension rules
      follow). The format's "rule" needs a failing example, which no use can give in R-3a. The drafting script meets
      the same fact (uses.py: "every use is permitted or SP"). An SP use that is permitted by right in another
      district takes the stricter district's regulations unless the BZA decides otherwise (§325-8B(4)).
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 6600}
        expect: pass
      - given: {use: one_family_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_detached, lot_area: 4999}
        expect: fail
      - given: {use: two_family, lot_area: 4000}
        expect: not_applicable
    notes: >-
      The sixth value of the row is R-3A's (the 5,000 sf after R-2C's "2,500 sf [fn4]"). Chart note 3 points to
      §325-8B(1): the minimum applies to each main building on the lot.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, semi-detached (chart p.3)"
    applies_when: use == "one_family_semi_detached"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: one_family_semi_detached, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_semi_detached, lot_area: 4999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 4000}
        expect: not_applicable
    notes: >-
      A semi-detached dwelling is one building holding two one-family dwellings that share a party wall
      (§325-3B). The chart's figure is for the lot as cited; §325-8B(1) adds the figure again for each further main
      building on the lot.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Minimum lot size, two-family dwelling (chart p.3)"
    applies_when: use == "two_family"
    check: lot_area >= 5000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
    examples:
      - given: {use: two_family, lot_area: 6600}
        expect: pass
      - given: {use: two_family, lot_area: 5000}
        expect: pass
        note: exactly at the minimum
      - given: {use: two_family, lot_area: 4999}
        expect: fail
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_one_family_attached
    kind: rule
    topic: dimensions
    title: "Lot size at least 6,000 sf, one-family attached (chart p.3; note 7 below)"
    applies_when: use == "one_family_attached"
    check: lot_area >= 6000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [14, 14]
        quote: "One-family dwelling, attached, new construction - - - - 1,500 sf [fn6] 6,000 sf [fn7]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
    examples:
      - given: {use: one_family_attached, lot_area: 6000}
        expect: pass
        note: at the floor; R-3a.lot_area_note_7 still sends it to review (units, conversion)
      - given: {use: one_family_attached, lot_area: 5999}
        expect: fail
        note: below the least any attached building needs (new construction, 1-3 units)
      - given: {use: multiple_family, lot_area: 1000}
        expect: not_applicable
    notes: >-
      This rule is the floor only: the least lot any one-family attached building needs (6,000 sf, new construction,
      for the first 1-3 units). The rest of note 7 (by conversion 7,000 sf; +750 sf per further unit; +500 sf per room
      let for profit) is R-3a.lot_area_note_7, a flag, because Gordium doesn't count units or rooms yet. So a lot under
      6,000 sf fails here, and no lot passes both.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_multiple_family
    kind: rule
    topic: dimensions
    title: "Lot size at least 6,000 sf, multiple dwelling (chart p.3; note 7 below)"
    applies_when: use == "multiple_family"
    check: lot_area >= 6000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, new construction", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [17, 17]
        quote: "Multiple family dwelling, new construction - - - - - 6,000 sf [fn7]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
    examples:
      - given: {use: multiple_family, lot_area: 6600}
        expect: pass
        note: over the floor; R-3a.lot_area_note_7 still sends it to review (6,600 sf is enough for 3 new units, not 4)
      - given: {use: multiple_family, lot_area: 6000}
        expect: pass
      - given: {use: multiple_family, lot_area: 5999}
        expect: fail
    notes: >-
      The floor only: a multiple dwelling has three or more units (§325-3B), so 6,000 sf (new construction, the first
      1-3 units) is the least any of them needs. The rest of note 7 is R-3a.lot_area_note_7.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_note_7
    kind: flag
    topic: dimensions
    title: "Lot size by number of units and rooms let, attached and multiple (note 7)"
    applies_when: use in ["one_family_attached", "multiple_family"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [53, 53]
        quote: "(7) For the first 1-3 units; +750 sf for each additional unit; +500 sf per room let for profit."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, by conversion", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, by conversion", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Multiple family dwelling, new construction", column: R-3A}
    examples:
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: one_family_attached}
        expect: needs_review
      - given: {use: two_family}
        expect: not_applicable
    notes: >-
      Required lot = 6,000 sf (new construction) or 7,000 sf (by conversion, §325-3B CONVERSION) for the first 1-3
      units, + 750 sf for each unit over 3, + 500 sf per room let for profit. Worked by hand: 8 new apartments, no
      rooms let: 6,000 + 5 × 750 = 9,750 sf. A 4-unit conversion with 2 rooms let: 7,000 + 750 + 2 × 500 = 8,750 sf.
      A new row of 5 attached houses: 6,000 + 2 × 750 = 7,500 sf (an attached building has 3 to 6 dwellings,
      §325-3B). Gordium doesn't count units, rooms let or conversions yet (measures an engineer would add: dwelling
      units, rooms let for profit, conversion yes/no), so this is a flag; with them it becomes a rule.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_fraternity
    kind: rule
    topic: dimensions
    title: "Minimum lot size, fraternity, sorority, or group house (chart p.3)"
    applies_when: use == "fraternity_sorority_group_house"
    check: lot_area >= 25000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Fraternity, sorority, or group house", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [18, 18]
        quote: "Fraternity, sorority, or group house 25,000 sf"
    examples:
      - given: {use: fraternity_sorority_group_house, lot_area: 25000}
        expect: pass
        note: exactly at the minimum
      - given: {use: fraternity_sorority_group_house, lot_area: 24999}
        expect: fail
      - given: {use: fraternity_sorority_group_house, lot_area: 6600}
        expect: fail
    notes: >-
      The row has only four values, under R-3A, R-3AA, R-3B and RU (the use is "-" in R-1 and R-2 on p.2); the first,
      25,000 sf, sits under the R-3A heading.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: >-
      use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
      "one_family_attached", "two_family", "multiple_family", "fraternity_sorority_group_house"]
    check: lot_area >= 6000
    review_when:
      - when: use in ["dormitory", "nursing_home"] and lot_area >= 6000
        reason: >-
          A dormitory and a nursing home are multiple dwellings by §325-3's definitions, so the multiple-family row and
          its note 7 (+750 sf per unit over 3, +500 sf per room let for profit) may apply instead of "Other use": the
          open question on this rule.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf 7,500 sf 6,000 sf 4,000 sf 4,000 sf 6,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: Dormitory, column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursing, convalescent or rest home", column: R-3A}
    examples:
      - given: {use: church, lot_area: 6000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 5999}
        expect: fail
      - given: {use: dormitory, lot_area: 5999}
        expect: fail
        note: under 6,000 sf under either reading
      - given: {use: dormitory, lot_area: 6000}
        expect: needs_review
      - given: {use: dormitory, lot_area: 20000}
        expect: needs_review
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    open_questions:
    - 'A dormitory and a nursing home have their own rows on chart p.2 but none on p.3, and §325-3 defines both as
      multiple dwellings. Is their minimum lot size the "Multiple family dwelling" row (6,000 sf plus note 7''s per-unit
      additions) or "Other use" (6,000 sf)?'
    research:
    - question: 'A dormitory and a nursing home have their own rows on chart p.2 but none on p.3, and §325-3 defines
        both as multiple dwellings. Is their minimum lot size the "Multiple family dwelling" row (6,000 sf plus note 7''s
        per-unit additions) or "Other use" (6,000 sf)?'
      searched:
      - 325-3B:dormitory
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-8A
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [16, 16]
        quote: DORMITORY — A multiple dwelling
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [30, 30]
        quote: (4) A building used or occupied as a convalescent, old-age or nursing home
      why_open: The definitions make both multiple dwellings, but the chart lists them as uses of their own and gives
        the fraternity house (also a multiple dwelling, §325-3B (5)) its own lot-size row, which suggests a use with no
        row of its own is an "Other use". Neither the code nor a City record (none found) says which. Both readings
        need 6,000 sf; they differ only in note 7's additions, so the rule fails a smaller lot and sends a larger one
        to review.
      readings:
      - id: multiple_family_row
        reading: the multiple-family row applies (6,000 sf for 1-3 units, +750 sf each further unit, +500 sf per room let)
      - id: other_use_row
        reading: '"Other use" applies (6,000 sf)'
    notes: >-
      Other uses in R-3a: church, park, library or fire station, cemetery, public utility, school, nursery school,
      adult day care home, neighborhood commercial facility, nursing home, hospital, bed-and-breakfast inn, dormitory.
      The zero-lot-line house has its own row ("-" in R-3A): see R-3a.lot_size_zero_lot_line.
    drafted_by: claude
    status: draft

  - id: R-3a.lot_size_zero_lot_line
    kind: flag
    topic: dimensions
    title: "Lot size and width, zero-lot-line house: chart shows \"-\" (chart p.3)"
    applies_when: use == "one_family_detached_zero_lot_line"
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached, zero lot line", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
