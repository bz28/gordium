        cite: 'Zoning Administrator''s affidavit (2019) and staff memo to the BZA, Appeal #3202, 815 S. Aurora St (a
          five-sided lot), 2019-2022'
        url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_02012022-2446
        quote: side lot lines should be drawn at a 90-degree angle perpendicular to the front lot line to determine
          the average lot depth
      why_open: It depends on the lot_depth question that is still open; see its research.
