    examples:
      - given: {use: multiple_family, abuts_r1_district: true}
        expect: needs_review
        note: R-1 land across a creek, an alley or a railroad, or touching only at a corner, is a yes (the cautious reading of open question 1)
      - given: {use: multiple_family, abuts_r1_district: false}
        expect: not_applicable
        note: 'the conditions apply only "if the land ... directly abuts land in either the R-1a or R-1b" district'
      - given: {use: multiple_family}
        expect: needs_review
        note: whether the lot abuts R-1 land is not stated yet, so the conditions may apply
      - given: {use: church, abuts_r1_district: true}
        expect: needs_review
      - given: {use: church, abuts_r1_district: false}
        expect: not_applicable
      - given: {use: two_family, abuts_r1_district: true}
        expect: not_applicable
        note: '"except a one-family or two-family dwelling": exempt even on a lot abutting R-1 land'
      - given: {use: two_family}
        expect: not_applicable
        note: exempt whether or not the lot abuts R-1 land, so nothing to ask
      - given: {use: one_family_attached, abuts_r1_district: true}
        expect: needs_review
        note: whether an attached building of 3-6 houses is exempt is the second open question, so it is not exempted
      - given: {use: one_family_semi_detached, abuts_r1_district: true}
        expect: not_applicable
    findings:
    - id: one_family_configurations_exempt
      question: '§325-19E exempts "a one-family or two-family dwelling". Does that include the semi-detached and
        zero-lot-line configurations, which the chart lists as uses of their own?'
      kind: reading
      answer: 'Yes: §325-3B defines a one-family dwelling and lists detached, zero lot line and semidetached (a building
        of at most two one-family dwellings) among its configurations, so they are exempt with the two-family dwelling.
        The attached configuration (3 to 6 dwellings) is the second open question, still open.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [7, 7]
        quote: ONE-FAMILY SEMIDETACHED DWELLING — A building containing not more than two
      still_open:
      - R-3a.abutting_r1#2
      - R-3aa.abutting_r1#3
      - R-3b.abutting_r1#2
      strength: strong
      confirm_with: the City zoning office
    - id: cross_reference_points_elsewhere
      question: Chart note 1 says "see §325-9" and §325-8B(9) says "§ 325-9B(1)" for the R-3 / R-1 special conditions,
        but §325-9B(1) is the list of special-permit uses. Where are the conditions?
      kind: law
      answer: In §325-19E ("Development in R-3 Districts which abut R-1 Districts", added 7-3-2019 by Ord. No.
        2019-12). The two cross-references predate it (§325-8B(9) was added in 2012); §325-9B(1) holds no such conditions.
        Whether §325-19E also reaches R-3aa, which it doesn't name, is still open (R-3aa.abutting_r1#1).
      still_open:
      - R-3aa.abutting_r1#1
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [12, 12]
        quote: Development in R-3 Districts which abut R-1 Districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [9, 10]
        quote: that directly abuts R-1, § 325-9B(1). [Added 6-6-2012 by Ord. No. 2012-03]
      strength: strong
    open_questions:
    - '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does only land
      sharing a lot line with the R-3a lot count, or also land across a street, an alley, a creek or other waterway, a
      railroad or other right-of-way; and does land touching the lot only at a corner count?'
    - 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
    research:
    - question: '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does
        only land sharing a lot line with the R-3a lot count, or also land across a street, an alley, a creek or other
        waterway, a railroad or other right-of-way; and does land touching the lot only at a corner count?'
      searched:
      - 325-19
      - 325-19A
      - 325-19E
      - 325-6
      - 325-6A
      - 325-6D
      - 325-6E
      - 325-9B
      - 325-11B
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [26, 26]
        quote: on a lot abutting or across a street or waterway from
      - file: chapter_325_zoning_2026-10.pdf
        page: 39
        lines: [17, 17]
        quote: where it abuts land, other than a public right-of-way
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [26, 27]
        quote: Where district boundaries are indicated as approximately following the center lines of streets or highways,
          street lines or right-of-way lines, such lines shall be construed to be such boundaries
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [33, 34]
        quote: D. Where the boundary of a district follows a railroad line, such boundary shall be deemed to be located
          in the middle of the main tracts of said railroad.
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [35, 37]
        quote: E. Where the boundary of a district follows a stream, lake or other body of water under public
          jurisdiction, said boundary line shall be deemed to be at the limit of the jurisdiction, unless otherwise
          indicated.
      why_open: The code points both ways. §325-9B(1)(j) says "abutting or across a street", which treats the two as
        different (so "abuts" alone would not reach across a street); but §325-11B says "abuts land, other than a public
        right-of-way", which implies land in a street can be abutting land. Whether R-1 land begins at the street's
        center line or at its far edge depends on the zoning map (§325-6A allows either), and "directly" is not
        defined. No City record found (searched the City's agenda center and the web, 2026-10-20). Until it is
        answered, the stated fact abuts_r1_district asks it the cautious way (Gordium's reading, to confirm), yes
        when any R-1a or R-1b land is touching the lot (even at a corner), or across a street, alley, creek or other
        waterway, railroad or other right-of-way from it (§325-9B(1)(j) names "a street or waterway"; §325-6 treats
        rail and water boundaries as it does streets), so "no" is right under every reading and the conditions are
        never left out on a narrower one.
      readings:
      - id: shares_a_lot_line
        reading: only R-1a or R-1b land sharing a lot line with the lot counts
      - id: across_a_street_counts
        reading: R-1a or R-1b land across a street counts too
      - id: across_any_right_of_way_counts
        reading: R-1a or R-1b land across an alley, a creek or other waterway, a railroad or other right-of-way counts
          too
      - id: touching_at_a_corner_counts
        reading: R-1a or R-1b land touching the lot only at a corner (a single point) counts
    - question: 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
      searched:
      - 325-19E
      - 325-3B:dwelling_one_family
      - 325-3B:one_family_attached_dwelling
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:row_house
      - 325-3B:townhouse
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 12]
        quote: ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [24, 24]
        quote: (1) A building containing three or more dwelling units.
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [33, 33]
        quote: row house, townhouse, or garden apartment housing as defined in this section
      why_open: The one-family definition lists "attached" as one of its configurations, which points to exempt; but
        the same building of 3 to 6 dwellings is a multiple dwelling under definitions (1) and (5), and §325-19E's
        exemption names a "dwelling", which for one family is "a dwelling unit". The code reads both ways and no City
        record was found, so Gordium doesn't exempt it (never a false pass).
      readings:
      - id: attached_is_exempt
        reading: an attached building of one-family dwellings is exempt, as a one-family configuration
      - id: attached_is_covered
        reading: it is a multiple dwelling, so §325-19E applies
    notes: >-
      A flag: whether the lot abuts R-1a or R-1b land is stated by the architect (abuts_r1_district, asked the cautious
      way: any R-1a or R-1b land touching the lot, even at a corner, or across a street, alley, creek or other
      waterway, railroad or other right-of-way from it). Unknown or yes sends the lot to review for every use
      §325-19E covers; no means §325-19E does not apply. Worked by hand for R-3a, if the lot abuts R-1 land: lot size 150% of the chart's (multiple dwelling,
      new construction, 1-3 units: 1.5 × 6,000 = 9,000 sf; other use 9,000 sf; fraternity 37,500 sf); height R-1a's or
      R-1b's 35 ft instead of 40 ft (both R-1 columns say 35 ft, so the bonus would be 3.5 ft, not 4), and, since the
      chart's "Maximum Building Height" covers both its rows, likely R-1's 3 stories instead of 4; coverage 75% ×
      35% = 26.25%; a side or rear yard that abuts R-1 land 150% of the chart's: side 15 ft and 7.5 ft, rear 150% of 20%
      of the lot depth (at most 50, at least 20 ft) — 39.6 ft on a 132 ft deep lot. The front yard is unchanged.
    drafted_by: claude
    status: draft

  - id: R-3a.parking_one_family
    kind: rule
    topic: parking_and_loading
    title: "Minimum off-street parking, one-family detached (chart p.14)"
    applies_when: use == "one_family_detached"
    check: parking_spaces >= (1 if sleeping_rooms <= 3 else 2 + 1 * max(sleeping_rooms - 5, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-3A}
    examples:
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 1}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 0}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 2}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 1}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 7, parking_spaces: 4}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 7, parking_spaces: 3}
        expect: fail
      - given: {use: two_family, sleeping_rooms: 3, parking_spaces: 0}
        expect: not_applicable
        note: two dwelling units, see R-3a.parking_dwelling_units
    findings:
    - id: adu_needs_no_parking
      question: 'The requirement is per dwelling unit. R-3a allows an accessory dwelling unit (chart p.2): does a house
        with an ADU need parking for both units?'
      kind: law
      answer: 'No: an ADU needs no off-street parking (§325-28C(2)). The house''s own parking is unchanged.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [9, 9]
        quote: There shall be no off-street parking requirement for an ADU
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.4
    notes: The residential parking rows span every residential district's column, so the numbers are R-1b's. The
      sleeping_rooms measure counts one dwelling unit's rooms, so this rule is for the one use with exactly one
      dwelling unit and no other units on the lot.
    drafted_by: claude
    status: draft

  - id: R-3a.parking_dwelling_units
    kind: flag
    topic: parking_and_loading
    title: "Parking per dwelling unit for buildings of several units (chart p.14)"
    applies_when: >-
      use in ["one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached", "two_family",
      "multiple_family"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-3A}
    examples:
      - given: {use: two_family}
        expect: needs_review
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: one_family_detached}
        expect: not_applicable
    notes: >-
      The requirement is worked out for each dwelling unit and added up: worked by hand, a two-family house with a
      3-bedroom and a 5-bedroom unit needs 1 + 2 = 3 spaces; six 2-bedroom apartments need 6. Gordium measures the
      sleeping rooms of one dwelling unit only (sleeping_rooms), so it can't add them up yet: NEEDS REVIEW, added up by hand.
      (The zero-lot-line house is one unit, but its use needs a special permit in R-3a anyway.)
    drafted_by: claude
    status: draft

  - id: R-3a.parking_dormitory
    kind: flag
