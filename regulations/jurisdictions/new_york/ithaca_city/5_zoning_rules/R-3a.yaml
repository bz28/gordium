  - id: R-3a.yard_projections
    kind: rule
    topic: dimensions
    title: "Eaves into required yards, at most 2 ft (§325-18B)"
    check: >-
      front_yard_eaves >= 10 + max(building_height - 40, 0) - 2
      and side_yard_smaller_eaves >= 5 + max(building_height - 40, 0) - 2
      and side_yard_larger_eaves >= 10 + max(building_height - 40, 0) - 2
      and rear_yard_eaves >= max(min(0.2 * lot_depth, 50), 20) + max(building_height - 40, 0) - 2
    review_when:
      - when: >-
          (side_yard_smaller >= 10 + max(building_height - 40, 0) or side_yard_larger < 10 + max(building_height - 40, 0))
          and side_yard_smaller_eaves >= 10 + max(building_height - 40, 0) - 2
          and side_yard_larger_eaves >= 5 + max(building_height - 40, 0) - 2 and side_yard_larger_eaves < 10 + max(building_height - 40, 0) - 2
          and front_yard_eaves >= 10 + max(building_height - 40, 0) - 2 and rear_yard_eaves >= max(min(0.2 * lot_depth, 50), 20) + max(building_height - 40, 0) - 2
        reason: >-
          Which side yard is the 10 ft one (both minimums more on a building over 40 ft tall) is open: the walls are at
          least that far from both side lot lines, or from neither, so either side may be. The eaves fit only if the
          side whose walls are farther from its line is the 5 ft one. Say which side is meant to be the 10 ft
          one.
      - when: >-
          (side_yard_smaller >= 10 + max(building_height - 40, 0) or side_yard_larger < 10 + max(building_height - 40, 0))
          and side_yard_larger_eaves >= 10 + max(building_height - 40, 0) - 2
          and side_yard_smaller_eaves >= 5 + max(building_height - 40, 0) - 2 and side_yard_smaller_eaves < 10 + max(building_height - 40, 0) - 2
          and front_yard_eaves >= 10 + max(building_height - 40, 0) - 2 and rear_yard_eaves >= max(min(0.2 * lot_depth, 50), 20) + max(building_height - 40, 0) - 2
        reason: >-
          Which side yard is the 10 ft one (both minimums more on a building over 40 ft tall) is open: the walls are at
          least that far from both side lot lines, or from neither, so either side may be. The eaves fit only if the
          side whose walls are nearer to its line is the 5 ft one. Say which side is meant to be the 10 ft
          one.
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 49
        lines: [13, 16]
        quote: "B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that such features shall not project more than two feet into any required yard."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 40) to each yard, one to one"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-3A}
    examples:
      - given: {side_yard_smaller: 9, side_yard_larger: 14, front_yard_eaves: 12, side_yard_smaller_eaves: 8.5, side_yard_larger_eaves: 11, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: pass
        note: eaves clear of every required yard, whichever side is the 10 ft one
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: pass
        note: eaves exactly 2 ft into the front (10 − 2), narrower side (5 − 2), wider side (10 − 2) and rear (20% of 125 = 25, − 2) yards
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 7.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 8, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
        note: an eave just over 2 ft into the 5 ft side yard
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99, rear_yard_eaves: 23, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 22.99, lot_depth: 125, building_height: 38}
        expect: fail
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 11, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 125, building_height: 43}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {side_yard_smaller: 6, side_yard_larger: 14, front_yard_eaves: 10.99, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 125, building_height: 43}
        expect: fail
        note: the 13 ft front yard the bonus requires, less 2 ft, is 11
      # which side carries the 10 ft minimum follows the walls (each side's eaves to its own lot line, #18's P0 fix)
      - given: {side_yard_smaller: 9.5, side_yard_larger: 10, front_yard_eaves: 12, side_yard_smaller_eaves: 9, side_yard_larger_eaves: 6.5, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: fail
        note: >-
          walls 9'-6" and 10'-0": only the wider side can be the 10 ft one, and its eave, 6'-6" from the line, is 3'-6"
          into it (#21 review round 22's false pass)
      - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 12, side_yard_smaller_eaves: 7, side_yard_larger_eaves: 15, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: needs_review
        note: >-
          walls 12 and 15 ft: either side may be the 10 ft one; the narrower side's eave (7 ft from its line) fits only
          if that side is the 5 ft one
      - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 12, side_yard_smaller_eaves: 9, side_yard_larger_eaves: 7, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: needs_review
        note: walls 12 and 15 ft; the wider side's eave (7 ft) fits only if that side is the 5 ft one
      - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 12, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: pass
        note: both eaves 8 ft from their lines fit whichever side is the 10 ft one
      - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 7.99, side_yard_smaller_eaves: 7, side_yard_larger_eaves: 15, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: fail
        note: the front eave fails whichever side is the 10 ft one
      - given: {side_yard_smaller: 12, side_yard_larger: 15, front_yard_eaves: 12, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 15, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: fail
        note: the narrower side's eave is over 2 ft into even a 5 ft yard
      - given: {side_yard_smaller: 7, side_yard_larger: 9, front_yard_eaves: 12, side_yard_smaller_eaves: 7, side_yard_larger_eaves: 9, rear_yard_eaves: 48, lot_depth: 125, building_height: 38}
        expect: needs_review
        note: neither side's walls are 10 ft from its line (R-3a.side_yards fails); which side's eave the 10 ft limit is for is open
      # the height bonus moves which side can carry the 10 ft minimum (45 ft tall: 5 ft more, 15 and 10)
      - given: {side_yard_smaller: 9, side_yard_larger: 12, front_yard_eaves: 20, side_yard_smaller_eaves: 9, side_yard_larger_eaves: 13, rear_yard_eaves: 48, lot_depth: 125, building_height: 45}
        expect: needs_review
        note: at 45 ft neither side's walls are 15 ft from the line, so either side may be the larger one; the eaves fit one way only
      - given: {side_yard_smaller: 12, side_yard_larger: 16, front_yard_eaves: 20, side_yard_smaller_eaves: 13, side_yard_larger_eaves: 9, rear_yard_eaves: 48, lot_depth: 125, building_height: 45}
        expect: fail
        note: at 45 ft only the 16 ft side can be the 15 ft one, and its eave (9 ft) is over 2 ft into it
      # each figure in the which-side review decides an answer (the rear yard's 20%, its 50 ft cap; the bonus)
      - given: {side_yard_smaller: 9, side_yard_larger: 9, front_yard_eaves: 8, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 3, rear_yard_eaves: 18, lot_depth: 90, building_height: 30}
        expect: needs_review
        note: neither side's walls 10 ft from the line; the rear eave exactly 2 ft into the 20 ft rear yard (20% of 90 is 18, raised to 20)
      - given: {side_yard_smaller: 4.5, side_yard_larger: 9, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 18, lot_depth: 90, building_height: 30}
        expect: needs_review
        note: neither side 10 ft; the wider side's eave fits 10 ft, the narrower's only 5 ft
      - given: {side_yard_smaller: 9, side_yard_larger: 9, front_yard_eaves: 8, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 3, rear_yard_eaves: 48, lot_depth: 300, building_height: 30}
        expect: needs_review
        note: the rear eave exactly 2 ft into the 50 ft rear yard (20% of 300 is 60, capped at 50)
      - given: {side_yard_smaller: 4.5, side_yard_larger: 9, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 48, lot_depth: 300, building_height: 30}
        expect: needs_review
      - given: {side_yard_smaller: 14, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 13, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: needs_review
        note: 45 ft tall (every yard 5 ft more), neither side's walls 15 ft from the line; the eaves fit one way only
      - given: {side_yard_smaller: 14, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 13, side_yard_larger_eaves: 7.5, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: fail
        note: the eave on one side is over 2 ft into even its 10 ft yard
      - given: {side_yard_smaller: 14, side_yard_larger: 14, front_yard_eaves: 12.5, side_yard_smaller_eaves: 13, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: fail
        note: the front eave fails (13 ft at 45 ft tall), whichever side is the 15 ft one
      - given: {side_yard_smaller: 14, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 13, side_yard_larger_eaves: 8, rear_yard_eaves: 22.5, lot_depth: 90, building_height: 45}
        expect: fail
        note: the rear eave fails (23 ft at 45 ft tall), whichever side is the 15 ft one
      - given: {side_yard_smaller: 9.5, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 13, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: needs_review
      - given: {side_yard_smaller: 9.5, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 7.5, side_yard_larger_eaves: 13, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: fail
      - given: {side_yard_smaller: 9.5, side_yard_larger: 14, front_yard_eaves: 12.5, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 13, rear_yard_eaves: 23, lot_depth: 90, building_height: 45}
        expect: fail
      - given: {side_yard_smaller: 9.5, side_yard_larger: 14, front_yard_eaves: 13, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 13, rear_yard_eaves: 22.5, lot_depth: 90, building_height: 45}
        expect: fail
    notes: >-
      The yards themselves (R-3a.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out; this rule measures the same yards to the outermost part, eaves included, and lets that be up
      to 2 ft less. Each side's eaves are measured to that side's own lot line: side_yard_smaller_eaves to the line of
      the narrower side yard to the walls, side_yard_larger_eaves to the other's, so each eave is held to the minimum its
      side carries. Which side carries the 10 ft minimum is the walls' to say: only the side whose walls are at least
      10 ft from its line can. Where both can, or neither, either side may be, and the eaves must fit both ways,
      else needs review (review_when: Gordium's cautious reading, to confirm with the architects; the
      chart says only that one side yard is at least 10 ft and the other at least 5 ft). On a corner lot every yard facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: R-3a.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 10
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 6: "six feet applies in R-1 districts only; in R-3a it is three feet (accessory_side_yard >= 3)"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3A}
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines (6 ft would be needed in R-1)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 9.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 10, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (10 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-3a is not an R-1 District, so §325-25C's first sentence applies: frame accessory buildings 3 ft from any side
      or rear lot line (the "six feet" is R-1's only). Whether the distances apply to an accessory building that isn't
      frame is §325-25C's open question (325-25C#1): accessory_distances_apply is measured under every reading, and
      outside R-1 its readings differ for a building not stated as frame, so that gives NEEDS REVIEW until the
      architect says the building is frame (accessory_frame).
    drafted_by: claude
    status: draft

  - id: R-3a.abutting_r1
