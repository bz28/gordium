  - id: R-3a.loading
    kind: flag
    topic: parking_and_loading
    title: "Off-street loading (chart p.14, §325-21)"
    applies_when: >-
      use in ["multiple_family", "dormitory", "fraternity_sorority_group_house", "nursing_home",
      "hospital_or_sanitarium", "neighborhood_commercial_facility"]
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: "Multiple dweling with 25 + units", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [26, 26]
        quote: "(3) Plus 1 space for each additional 15,000 sf of floor space or major fraction thereof."
        not_limits: {1: "a limit this flag asks the reviewer to apply by hand: no formula checks it, so the flag always needs review (never a pass)", 15000: "a limit this flag asks the reviewer to apply by hand: no formula checks it, so the flag always needs review (never a pass)"}
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: "Nursing home, hospital, or sanitarium", column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Minimum Loading Requirement, row: Neighborhood commercial facility, column: R-3A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 63
        lines: [41, 42]
        quote: "A. Size requirements. An off-street loading space shall have a minimum of 450 square feet plus necessary additional space for entrance, exit and aisle space."
        not_limits: {450: "a limit this flag asks the reviewer to apply by hand: no formula checks it, so the flag always needs review (never a pass)"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 64
        lines: [3, 4]
        quote: "and industrial land uses and multiple dwelling structures having more than 25 units, except for properties located in any CBD district:"
        not_limits: {25: "a limit this flag asks the reviewer to apply by hand: no formula checks it, so the flag always needs review (never a pass)"}
    examples:
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: hospital_or_sanitarium}
        expect: needs_review
      - given: {use: dormitory}
        expect: needs_review
        note: a multiple dwelling by definition; a large one may have more than 25 units
      - given: {use: two_family}
        expect: not_applicable
    notes: >-
      The R-3A, R-3AA and R-3B columns share one cell per row. Multiple dwelling with 25+ units: 1 space per 10,000 sf
      of floor space, plus 1 for each additional 15,000 sf or major fraction (note 3); nursing home, hospital or
      sanitarium: 1 space; neighborhood commercial facility: see §325-21. Each space at least 450 sf (§325-21A).
      A dormitory and a fraternity house are multiple dwellings by §325-3B, so they are included. Gordium counts
      neither units nor floor space, so these are NEEDS REVIEW, worked out by hand. The chart says "25 +" units;
      §325-21B says "more than 25 units" (a 25-unit building is covered by the chart's words, not the code's). Worked
      by hand: a 30-unit building of 22,000 sf needs 1 + 1 (12,000 sf over 10,000 is a major fraction of 15,000) = 2.
    drafted_by: claude
    status: draft

  - id: R-3a.occupancy_one_family
    kind: rule
    topic: density_and_occupancy
    title: "One-family occupancy (§325-3B: family + 2 unrelated)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
    check: unrelated_persons_with_children <= 2
    review_when:
      - when: unrelated_persons_with_children > 2 and functional_family_unit
        reason: "A functional family unit may occupy a one-family dwelling whatever its size (§325-3B DWELLING, ONE-FAMILY); whether this household is one is the City's finding, on the criteria §325-3B FUNCTIONAL FAMILY UNIT lists, so a person checks it."
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [36, 37]
        quote: "DWELLING, ONE-FAMILY — A dwelling unit occupied exclusively for residential purposes by an individual or family and not more than one unrelated individual or a functional family unit."
        not_limits: {1: "the first sentence's limit, which this district raises (its own sentence below)"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [39, 40]
        quote: "In the R-2 and R-3 Zones, occupancy by an individual or a family and not more than two unrelated individuals is permitted."
        not_limits: {3: "the district name R-3, not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "FAMILY — One or more persons occupying a dwelling unit, all of whom are related by blood, marriage or adoption."
        not_limits: {1: "one or more persons make a family: who counts, not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [11, 13]
        quote: "FUNCTIONAL FAMILY UNIT — A group of individuals living together in a single dwelling unit and functioning as a family with respect to those characteristics that are consistent with the purposes of zoning restrictions in residential neighborhoods."
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "(6) [fn3]In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be"
        not_limits: {1: "the district name R-1, not a number", 2: "the district name R-2, not a number"}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [45, 45]
        quote: "(4) See §325-3 for occupancy restrictions."
    examples:
      - given: {use: one_family_detached, unrelated_persons_with_children: 2}
        expect: pass
      - given: {use: one_family_detached, unrelated_persons_with_children: 3, functional_family_unit: false}
        expect: fail
      - given: {use: one_family_detached, unrelated_persons_with_children: 3, functional_family_unit: true}
        expect: needs_review
        note: "a functional family unit: the City's finding"
      - given: {use: one_family_detached, unrelated_persons_with_children: 3}
        expect: needs_review
        note: "whether it is a functional family unit isn't said"
      - given: {use: one_family_detached}
        expect: needs_review
        note: "who lives there isn't said"
      - given: {use: church}
        expect: not_applicable
    findings:
    - id: who_is_unrelated
      question: "Who is an \"unrelated individual\" in a one-family or two-family dwelling?"
      kind: law
      answer: "Anyone in the dwelling unit not related by blood, marriage or adoption to the household's family (§325-3B FAMILY); in a household with no family, everyone but the individual the definition starts from (\"an individual or family and not more than ... unrelated\"). Gordium asks the most such people in any dwelling unit."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "all of whom are related by blood, marriage or adoption"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §1
    - id: children_counted_outside_r1_r2
      question: "Outside R-1 and R-2, are minor dependent children counted among the unrelated people of a one-family dwelling?"
      kind: reading
      answer: "Gordium counts them: §325-8B(6) and chart note 1 leave them out \"In R-1 and R-2 Districts\" only, and the one-family definition has no such exception (the multiple-dwelling and cooperative-household definitions write theirs out). Counting them can only make a dwelling need review or not comply, never pass wrongly."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "In R-1 and R-2 Districts, minor dependent children"
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §2.2
    - id: functional_family_unit_is_the_citys_finding
      question: "Can Gordium decide whether a household is a functional family unit?"
      kind: law
      answer: "No: §325-3B lists criteria that must be present (sharing the whole unit, stability shown by children, shared expenses, the same address for voting and taxes...) and presumptions against, weighed case by case. Over the limit with a household said to be such a unit, the rule needs review; said not to be, it does not comply."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [15, 15]
        quote: "the following criteria must be present"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §5
    notes: "Counts unrelated_persons_with_children: the most such people in any one dwelling unit (each semi-detached or attached dwelling is a one-family dwelling of its own). The limits are the definition's own (§325-3B); a person's say that the household is a functional family unit sends it to review. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

  - id: R-3a.occupancy_two_family
    kind: flag
    topic: density_and_occupancy
    title: "Two-family occupancy (§325-3B: unrelated people may make a multiple dwelling)"
    applies_when: >-
      use == "two_family" and unrelated_persons > 1
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [3, 4]
        quote: "DWELLING, TWO-FAMILY — A building containing two dwelling units occupied exclusively for residential purposes."
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [25, 26]
        quote: "(2) A dwelling unit, occupied by a group of four or more unrelated persons, exclusive of minor dependent children in the care of a parent or relative."
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [27, 29]
        quote: "(3) A building containing living, sanitary and sleeping facilities occupied by one or two families and more than two roomers or boarders, exclusive of minor dependent children in the care of a parent or relative, residing with either one of such families."
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "FAMILY — One or more persons occupying a dwelling unit, all of whom are related by blood, marriage or adoption."
        not_limits: {1: "one or more persons make a family: who counts, not a limit"}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [45, 45]
        quote: "(4) See §325-3 for occupancy restrictions."
    examples:
      - given: {use: two_family, unrelated_persons: 1}
        expect: not_applicable
        note: "at most two unrelated people in the building, and no group of four"
      - given: {use: two_family, unrelated_persons: 2}
        expect: needs_review
        note: "possibly more than two roomers in the building: the open question"
      - given: {use: two_family, unrelated_persons: 3}
        expect: needs_review
        note: "may be a multiple dwelling"
      - given: {use: two_family}
        expect: needs_review
        note: "who lives there isn't said"
      - given: {use: one_family_detached}
        expect: not_applicable
    findings:
    - id: who_is_unrelated
      question: "Who is an \"unrelated individual\" in a one-family or two-family dwelling?"
      kind: law
      answer: "Anyone in the dwelling unit not related by blood, marriage or adoption to the household's family (§325-3B FAMILY); in a household with no family, everyone but the individual the definition starts from (\"an individual or family and not more than ... unrelated\"). Gordium asks the most such people in any dwelling unit."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "all of whom are related by blood, marriage or adoption"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §1
    - id: two_family_outside_r1_r2
      question: "What limits who lives in each unit of a two-family dwelling outside R-1 and R-2?"
      kind: reading
      answer: "The two-family definition sets per-unit limits only \"In R-1 and CR-1 Zones\" and \"In R-2 and CR-2 Zones\". Elsewhere the limit is where it stops being a two-family dwelling: a unit \"occupied by a group of four or more unrelated persons\" ((2)), or a building of one or two families \"and more than two roomers or boarders\" ((3)), is a multiple dwelling. Gordium reads a group of four unrelated persons as four people none related to another, so a household's family member and three people unrelated to it can make one. Whether unrelated housemates are roomers is still open (§6.4), so until it is answered more than one unrelated person in a unit needs review."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [4, 4]
        quote: "In R-1 and CR-1 Zones"
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [8, 8]
        quote: "In R-2 and CR-2 Zones"
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [25, 25]
        quote: "occupied by a group of four or more unrelated persons"
      still_open: [R-2a.occupancy_two_family#1, R-2b.occupancy_two_family#1, R-2c.occupancy_two_family#1, R-3a.occupancy_two_family#1, R-3aa.occupancy_two_family#1, R-3b.occupancy_two_family#1, RU.occupancy_two_family#1]
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §6.2
    open_questions:
    - "§325-3B DWELLING, MULTIPLE (3) makes a building \"occupied by one or two families and more than two roomers or boarders\" a multiple dwelling. Are the unrelated individuals the two-family definition counts in each unit \"roomers or boarders\" for this count, across the whole building?"
    research:
    - question: "§325-3B DWELLING, MULTIPLE (3) makes a building \"occupied by one or two families and more than two roomers or boarders\" a multiple dwelling. Are the unrelated individuals the two-family definition counts in each unit \"roomers or boarders\" for this count, across the whole building?"
      searched:
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:dwelling_two_family
      - 325-3B:boardinghouse
      - 325-3B:rooming_house
      - 325-3B:functional_family_unit
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [28, 28]
        quote: "and more than two roomers or boarders"
      - file: chapter_325_zoning_2026-10.pdf
        page: 5
        lines: [17, 17]
        quote: "BOARDINGHOUSE — A multiple dwelling where sleeping facilities and meals are provided"
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [17, 17]
        quote: "act as separate roomers"
      why_open: "\"Roomer\" and \"boarder\" aren't defined. BOARDINGHOUSE speaks of meals for paying guests, and FUNCTIONAL FAMILY UNIT sets \"separate roomers\" against a household sharing the whole unit, which points to lodgers who pay; but nothing says an unrelated housemate isn't one. The two-family definition lets an R-2 unit hold two unrelated individuals, four in the building, which (3) would make a multiple dwelling if they count. No City record found (web search 2026-10-27). Until answered, a unit with more than one unrelated person (so possibly more than two in the building) needs review: never a pass on the narrower reading."
      readings:
      - id: unrelated_are_roomers
        reading: every unrelated person counts as a roomer or boarder, across the whole building
      - id: roomers_are_paying_lodgers
        reading: only people renting a room (with or without meals) count; unrelated housemates sharing the unit don't
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §6.4
    notes: "More than one unrelated person in a unit: possibly more than two roomers or boarders in the building (§325-3B DWELLING, MULTIPLE (3), the open question), and from three a group of four or more unrelated persons in the unit ((2)): either makes it a multiple dwelling, with its own lot size and rules, so a person checks it as one. Never a fail: a multiple dwelling is permitted here under its own rules. Minor dependent children are left out of these counts by the definitions themselves. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

