  - id: R-3a.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 10
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3A}
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines (6 ft would be needed in R-1)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 9.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 10, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (10 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-3a is not an R-1 District, so §325-25C's first sentence applies: frame accessory buildings 3 ft from any side
      or rear lot line (the "six feet" is R-1's only). Whether the distances apply to an accessory building that isn't
      frame is §325-25C's open question (325-25C#1): accessory_distances_apply is measured under every reading, and
      outside R-1 its readings differ for a building not stated as frame, so that gives NEEDS REVIEW until the
      architect says the building is frame (accessory_frame).
    drafted_by: claude
    status: draft

  - id: R-3a.abutting_r1
    kind: flag
    topic: dimensions
    title: "Lots abutting R-1a or R-1b land: stricter limits (§325-19E)"
    applies_when: >-
      use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
      "two_family"]
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [12, 15]
        quote: "E. Development in R-3 Districts which abut R-1 Districts. The development of any permitted use in the R-3a or R-3b Zoning District, except a one-family or two-family dwelling, shall be subject to the following special conditions if the land on which the development occurs directly abuts land in either the R-1a or R-1b Zoning District:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [16, 18]
        quote: "(1) Minimum lot size (area in square feet): The required area in square feet needed to satisfy the minimum lot size requirement shall be 150% of the requirement shown on the District Regulations Chart for the R-3a or R-3b District."
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [19, 20]
        quote: "(2) Maximum building height: The maximum building height requirement shall be the same as the requirement for the abutting R-1a or R-1b District."
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [21, 21]
        quote: "(3) Maximum percent of lot coverage by buildings: The maximum percent of lot coverage by"
      - file: chapter_325_zoning_2026-10.pdf
        page: 51
        lines: [3, 4]
        quote: "buildings shall be 75% of the requirement shown on the District Regulations Chart for the R-3a or R-3b District."
      - file: chapter_325_zoning_2026-10.pdf
        page: 51
        lines: [5, 7]
        quote: "(4) Yard dimensions, side or rear yards: The minimum required side or rear yard requirement shall be 150% of the requirement shown on the District Regulations Chart for the R-3a or R-3b District if the side or rear yard abuts land in the R-1a or R-1b District."
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [44, 44]
        quote: "NOTES: (1) For special conditions on development of property in R-3 that directly abuts R-1, see §325-9."
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [9, 9]
        quote: "(9) For special conditions on development of property in R-3 that directly abuts R-1, § 325-9B(1)."
    examples:
      - given: {use: multiple_family}
        expect: needs_review
      - given: {use: church}
        expect: needs_review
      - given: {use: two_family}
        expect: not_applicable
      - given: {use: one_family_attached}
        expect: needs_review
        note: whether an attached building of 3-6 houses is exempt is the second open question, so it is not exempted
      - given: {use: one_family_semi_detached}
        expect: not_applicable
    findings:
    - id: one_family_configurations_exempt
      question: '§325-19E exempts "a one-family or two-family dwelling". Does that include the semi-detached and
        zero-lot-line configurations, which the chart lists as uses of their own?'
      kind: reading
      answer: 'Yes: §325-3B defines a one-family dwelling and lists detached, zero lot line and semidetached (a building
        of at most two one-family dwellings) among its configurations, so they are exempt with the two-family dwelling.
        The attached configuration (3 to 6 dwellings) is the second open question, still open.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [7, 7]
        quote: ONE-FAMILY SEMIDETACHED DWELLING — A building containing not more than two
      still_open:
      - R-3a.abutting_r1#2
      strength: strong
      confirm_with: the City zoning office
    - id: cross_reference_points_elsewhere
      question: Chart note 1 says "see §325-9" and §325-8B(9) says "§ 325-9B(1)" for the R-3 / R-1 special conditions,
        but §325-9B(1) is the list of special-permit uses. Where are the conditions?
      kind: law
      answer: In §325-19E ("Development in R-3 Districts which abut R-1 Districts", added 7-3-2019 by Ord. No.
        2019-12). The two cross-references predate it (§325-8B(9) was added in 2012); §325-9B(1) holds no such conditions.
      still_open: []
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [12, 12]
        quote: Development in R-3 Districts which abut R-1 Districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [9, 10]
        quote: that directly abuts R-1, § 325-9B(1). [Added 6-6-2012 by Ord. No. 2012-03]
      strength: strong
    open_questions:
    - '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does land across
      a street count, or only land sharing a lot line with the R-3a lot?'
    - 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
    research:
    - question: '§325-19E applies where the lot "directly abuts land in either the R-1a or R-1b Zoning District". Does
        land across a street count, or only land sharing a lot line with the R-3a lot?'
      searched:
      - 325-19
      - 325-19A
      - 325-19E
      - 325-6
      - 325-6A
      - 325-9B
      - 325-11B
      - 325-8B
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [26, 26]
        quote: on a lot abutting or across a street or waterway from
      - file: chapter_325_zoning_2026-10.pdf
        page: 39
        lines: [17, 17]
        quote: where it abuts land, other than a public right-of-way
      - file: chapter_325_zoning_2026-10.pdf
        page: 23
        lines: [26, 27]
        quote: Where district boundaries are indicated as approximately following the center lines of streets or highways,
          street lines or right-of-way lines, such lines shall be construed to be such boundaries
      why_open: The code points both ways. §325-9B(1)(j) says "abutting or across a street", which treats the two as
        different (so "abuts" alone would not reach across a street); but §325-11B says "abuts land, other than a public
        right-of-way", which implies land in a street can be abutting land. Whether R-1 land begins at the street's
        center line or at its far edge depends on the zoning map (§325-6A allows either), and "directly" is not
        defined. No City record found (searched the City's agenda center and the web, 2026-10-20).
      readings:
      - id: shares_a_lot_line
        reading: only R-1a or R-1b land sharing a lot line with the lot counts
      - id: across_a_street_counts
        reading: R-1a or R-1b land across a street counts too
    - question: 'A one-family attached dwelling is "a building containing three or more one-family dwellings" (§325-3B), and
      §325-3B also calls a building of three or more dwelling units, a row house or a townhouse a multiple dwelling.
      Is it the "one-family ... dwelling" §325-19E exempts, or a multiple dwelling §325-19E covers?'
      searched:
      - 325-19E
      - 325-3B:dwelling_one_family
      - 325-3B:one_family_attached_dwelling
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:row_house
      - 325-3B:townhouse
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [40, 41]
        quote: A one-family dwelling may be constructed in any of the following configurations, as permitted in specific
          zoning districts
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 12]
        quote: ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [24, 24]
        quote: (1) A building containing three or more dwelling units.
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [33, 33]
        quote: row house, townhouse, or garden apartment housing as defined in this section
      why_open: The one-family definition lists "attached" as one of its configurations, which points to exempt; but
        the same building of 3 to 6 dwellings is a multiple dwelling under definitions (1) and (5), and §325-19E's
        exemption names a "dwelling", which for one family is "a dwelling unit". The code reads both ways and no City
        record was found, so Gordium doesn't exempt it (never a false pass).
      readings:
      - id: attached_is_exempt
        reading: an attached building of one-family dwellings is exempt, as a one-family configuration
      - id: attached_is_covered
        reading: it is a multiple dwelling, so §325-19E applies
    notes: >-
      A flag: Gordium doesn't know the zoning of the land next to the lot, so for every use §325-19E covers it sends the
      lot to review. Worked by hand for R-3a, if the lot abuts R-1 land: lot size 150% of the chart's (multiple dwelling,
      new construction, 1-3 units: 1.5 × 6,000 = 9,000 sf; other use 9,000 sf; fraternity 37,500 sf); height R-1a's or
      R-1b's 35 ft instead of 40 ft (both R-1 columns say 35 ft, so the bonus would be 3.5 ft, not 4), and, since the
      chart's "Maximum Building Height" covers both its rows, likely R-1's 3 stories instead of 4; coverage 75% ×
      35% = 26.25%; a side or rear yard that abuts R-1 land 150% of the chart's: side 15 ft and 7.5 ft, rear 150% of 20%
      of the lot depth (at most 50, at least 20 ft) — 39.6 ft on a 132 ft deep lot. The front yard is unchanged.
    drafted_by: claude
    status: draft

