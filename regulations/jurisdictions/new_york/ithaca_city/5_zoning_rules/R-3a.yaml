    topic: dimensions
    title: "Front yard minimum (chart p.3)"
    check: front_yard >= 10
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-3A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [37, 37]
        quote: "Front (minimum) 25 ft 25 ft 25 ft 10 ft 10 ft 10 ft 10 ft 10 ft 25 ft"
      - file: chapter_325_zoning_2026-10.pdf
        page: 50
        lines: [7, 9]
        quote: "C. Corner lot transition. On corner lots in residential districts; buildings must be erected so that yards facing public streets shall conform to the minimum front yard requirements of said residential district. Such lots shall be deemed to have two adjoining front yards."
        not_limits: {2: "two adjoining front yards: which yards are front yards on a corner lot (measured to every street line), not a limit"}
    examples:
      - given: {front_yard: 15}
        expect: pass
      - given: {front_yard: 10}
        expect: pass
