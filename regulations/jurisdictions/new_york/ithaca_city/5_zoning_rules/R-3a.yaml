        not_limits: {1: "district names (R-1a, R-1b), not numbers", 1.5: "a limit this flag asks the reviewer to apply by hand: no formula checks it, so the flag always needs review (never a pass)", 3: "district names (R-3a, R-3b), not numbers"}
      - file: zoning_charts_2026-04.pdf
