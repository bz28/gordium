  - id: R-1a.occupancy_one_family
    kind: rule
    topic: density_and_occupancy
    title: "One-family occupancy (§325-3B: family + 1 unrelated; 2 if owner-occupied)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
    check: unrelated_persons <= 1 or unrelated_persons <= 2 and owner_occupied and not accessory_dwelling_unit
    review_when:
      - when: (unrelated_persons > 2 or unrelated_persons > 1 and not owner_occupied) and functional_family_unit
        reason: "A functional family unit may occupy a one-family dwelling whatever its size (§325-3B DWELLING, ONE-FAMILY); whether this household is one is the City's finding, on the criteria §325-3B FUNCTIONAL FAMILY UNIT lists, so a person checks it."
      - when: unrelated_persons == 2 and owner_occupied and accessory_dwelling_unit
        reason: "An accessory dwelling unit is on the lot: whether the owner's home makes this dwelling owner-occupied, and whether the limits reach the ADU's own occupants, is the open question, so a person checks the two-unrelated allowance."
