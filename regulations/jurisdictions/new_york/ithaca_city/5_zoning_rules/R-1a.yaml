        quote: "no more than 25% of the dwelling unit"
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §8
    notes: "Over either limit it is no home occupation at all (§325-3B). Its special permit is R-1a.home_occupation. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
