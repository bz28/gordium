        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-1A}
    examples:
      - given: {front_yard_eaves: 30, side_yard_smaller_eaves: 10, side_yard_larger_eaves: 12, rear_yard_eaves: 48, lot_depth: 130, building_height: 30}
        expect: pass
        note: eaves clear of every required yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 30.5, lot_depth: 130, building_height: 30}
        expect: pass
        note: eaves exactly 2 ft into the front (25 − 2), both sides (10 − 2) and the rear (25% of 130 = 32.5, − 2) yards
      - given: {front_yard_eaves: 22.99, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 30.5, lot_depth: 130, building_height: 30}
        expect: fail
        note: an eave just over 2 ft into the 25 ft front yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 7.5, side_yard_larger_eaves: 12, rear_yard_eaves: 31, lot_depth: 130, building_height: 30}
        expect: fail
        note: an eave 2.5 ft into the 10 ft side yard
      - given: {front_yard_eaves: 23, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 30.49, lot_depth: 130, building_height: 30}
        expect: fail
      - given: {front_yard_eaves: 26, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 33.5, lot_depth: 130, building_height: 38}
        expect: pass
        note: with the height bonus every required yard grows 3 ft (§325-16C), and an eave may reach 2 ft into each
      - given: {front_yard_eaves: 25.99, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 33.5, lot_depth: 130, building_height: 38}
        expect: fail
        note: the 28 ft front yard the bonus requires, less 2 ft, is 26
    notes: >-
      The yards themselves (R-1a.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out (the yards_to_nearest_part finding, §325-3 YARD, §325-18A); this rule measures the same
      yards to the outermost part, eaves included, and lets that be up to 2 ft less. A massing model shows eaves,
      not windowsills, belt courses or cornices: those are for the architect to check. On a corner lot every yard
      facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: R-1a.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 6 ft side, 3 ft rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 25
      and (not accessory_distances_apply or accessory_side_yard >= 6 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [6, 6]
        quote: "R-1 R-2 R-3 [fn1]"
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 6, accessory_rear_yard: 3}
        expect: pass
        note: exactly 6 ft from the side lot line and 3 ft from the rear lot line
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 5.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: 3 ft is enough outside R-1, not in R-1a
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 6, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 24.99, accessory_distances_apply: true, accessory_side_yard: 6, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 25, accessory_distances_apply: true, accessory_side_yard: 6, accessory_rear_yard: 3}
        expect: pass
        note: at the edge of the required front yard (25 ft)
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: under the reading that only "not in a required front yard" applies to a building that isn't frame
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-1a is an R-1 District: the chart groups R-1A and R-1B under "R-1" (p.2, p.3, p.14), and §325-4 lists R-1a
      as a residential district. So §325-25C's R-1 distances (6 ft side, 3 ft rear) apply, as in R-1b. Whether they
      apply to an accessory building that isn't frame isn't settled (325-25C#1, in the section labels):
      accessory_distances_apply is measured under every reading it lists, and the rule complies only if it passes
      under all of them. Below-grade accessory structures (§325-25B) and garages on a common lot line by agreement
      (§325-25D) aren't checked; §325-25 sets no height limit.
    drafted_by: claude
    status: draft

