      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 801, adu_height: 18, adu_stories: 2}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 600, adu_height: 20.5, adu_stories: 2}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_footprint: 600, adu_height: 19, adu_stories: 3}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_footprint: 900, adu_height: 18, adu_stories: 1}
        expect: needs_review
        note: an existing carriage house over 800 sf may stay as it is, but not be enlarged
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_footprint: 900, adu_height: 18, adu_stories: 1}
        expect: needs_review
        note: over 800 sf, and whether the building already exists isn't said
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_footprint: 500, adu_stories: 1}
        expect: needs_review
        note: height not measured
      - given: {accessory_dwelling_unit: true, adu_detached: false}
        expect: not_applicable
    notes: >-
      Measured from the detached ADU's building, the solid the architect picks (adu_building), on its own: its
      footprint seen from above (eaves read both ways: "footprint" isn't defined), its height as building height is
      measured, from the grade plane at its own walls, and its stories (a plain solid under 21 ft tall, 7 ft a story, holds at
      most two, read as two; a taller one needs its floors drawn). The height bonus of §325-16C is for the main
      building, not for this. Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft

  - id: R-1a.adu_detached_setbacks
    kind: rule
    topic: dimensions
    title: "Detached ADU: 5 ft from the side and rear lot lines (§325-28C(8))"
    applies_when: accessory_dwelling_unit and adu_detached
    check: adu_side_yard >= 5 and adu_rear_yard >= 5
    review_when:
      - when: adu_existing_building and not (adu_side_yard >= 5 and adu_rear_yard >= 5)
        reason: >-
          An existing accessory building nearer a lot line than new construction may be: §325-28C(8)(b) sets no
          setback for it, but it may be altered or expanded only if it doesn't further encroach upon a setback for
          new construction. Check by hand that it isn't being enlarged toward the lot line.
      - when: adu_side_yard >= 5 and adu_side_yard < 6 and adu_rear_yard >= 5
        reason: >-
          5 ft or more but under 6 ft from a side lot line: §325-28 allows 5 ft, but §325-25C keeps accessory
          buildings in R-1 six feet from a side lot line. Which governs is this rule's open question.
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [28, 30]
        quote: "[2] Detached ADU, new construction: [a] Side and rear setback: 5' or setback required for primary structure, whichever is less."
        not_limits: {2: "[2], a list marker"}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Accessory Dwelling Unit", column: R-1A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [26, 27]
        quote: "[1] An existing accessory building may be altered or expanded, provided that it does not further encroach upon any setback requirement for new construction."
        not_limits: {1: "[1], a list marker"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
        not_limits: {20: "the primary structure's rear yard floor: more than 5 ft, so 5 ft is the lesser"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 3: "the 3 ft frame-building distances: less than the ADU's 5 ft, never the deciding figure"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [15, 17]
        quote: "ACCESSORY DWELLING UNIT, DETACHED — An accessory dwelling unit (ADU) located within an existing or newly constructed accessory structure such as a detached garage, carriage house, or other freestanding building."
    examples:
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 6, adu_rear_yard: 5}
        expect: pass
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 4.9, adu_rear_yard: 10}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 8, adu_rear_yard: 4}
        expect: fail
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: true, adu_side_yard: 2, adu_rear_yard: 10}
        expect: needs_review
        note: "an existing garage 2 ft from the side line may stay, but not be enlarged toward it"
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_side_yard: 2, adu_rear_yard: 10}
        expect: needs_review
        note: "under 5 ft, and whether the building already exists isn't said"
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_rear_yard: 10}
        expect: needs_review
        note: "side not measured"
      - given: {accessory_dwelling_unit: true, adu_detached: true, adu_existing_building: false, adu_side_yard: 5, adu_rear_yard: 5}
        expect: needs_review
        note: "5 ft complies with §325-28, not with §325-25C's 6 ft"
      - given: {accessory_dwelling_unit: true, adu_detached: false}
        expect: not_applicable
    open_questions:
    - 'In R-1, §325-25C keeps accessory buildings at least six feet from a side lot line; §325-28C(8) gives a new detached ADU 5 ft from the side and rear lot lines, or the primary structure''s required setback if that is less. Does a detached ADU''s building need 6 ft from a side lot line in R-1, or 5 ft?'
    research:
    - question: 'In R-1, §325-25C keeps accessory buildings at least six feet from a side lot line; §325-28C(8) gives a new detached ADU 5 ft from the side and rear lot lines, or the primary structure''s required setback if that is less. Does a detached ADU''s building need 6 ft from a side lot line in R-1, or 5 ft?'
      searched:
      - 325-28
      - 325-28C
      - 325-3B:accessory_dwelling_unit_detached
      - 325-3B:accessory_building_or_structure
      - 325-3B:yard
      - 325-25
      - 325-25A
      - 325-25C
      - 325-8A
      - 325-25D
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [23, 23]
        quote: (8) All ADUs shall meet the following setback requirements
      - rank: 2
        cite: 'Ithaca Times, "Ithaca Common Council advances accessory dwelling unit policy" (2025-03-07): the ADU side
          setback was raised from 4 ft to 5 ft to align with the state fire code'
        url: https://www.ithaca.com/news/ithaca/ithaca-common-council-advances-accessory-dwelling-unit-policy-debates-key-provisions/article_57d66044-facd-11ef-a5a6-93d46f9f9efa.html
      why_open: >-
        §325-28 (2025) is the later, more specific section and says "All ADUs shall meet the following setback
        requirements"; §325-25C (older) keeps accessory buildings in R-1 six feet from a side lot line, and a
        detached ADU's building is an accessory structure (§325-3B). Both can be met at 6 ft, and neither section
        says it overrides the other. The Council's 2025 debate (as reported) set 5 ft for fire-code reasons without
        mentioning §325-25C. Whether §325-25C's R-1 clause reaches buildings that aren't frame is open too
        (325-25C#1). No City interpretation or Board of Zoning Appeals decision on ADUs was found (web search,
        2026-10-29). Gordium passes 6 ft or more, fails under 5 ft, and asks between.
      readings:
      - id: adu_section_governs
        reading: 5 ft (§325-28, the later and more specific section)
      - id: both_apply
        reading: 6 ft (§325-25C also applies; meeting both means 6 ft)
      report: docs/research/2026-10-29_accessory_dwelling_units.md §6
    notes: >-
      "5' or setback required for primary structure, whichever is less": the house's required yards (chart
      p.3, Yard Dimensions, R-1A: side, one side 10 ft, other side 10 ft; rear 25%/50 ft, not less than 20 ft
      (note 16)) are all 5 ft or more, so the lesser is 5 ft. The chart's cells are named here, not cited as the
      formula's inputs: in R-1a they never change the 5 ft. Measured
      from the detached ADU's building, the solid the architect picks (adu_building): its least distance, seen from
      above, to a side lot line and to the rear lot line, every reading of which lines are side and rear. The
      ADU's building is measured here, not as an ordinary accessory building (§325-25C's 3 ft are less than 5
      ft). In R-1, §325-25C's 6 ft from a side lot line for accessory buildings may also apply (this rule's open question): 5 ft to under 6 ft needs review. Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft
