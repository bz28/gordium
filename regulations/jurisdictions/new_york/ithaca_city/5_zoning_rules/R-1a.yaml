# R-1a (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# Occupancy (§325-3B one-family and two-family dwellings) and home occupations: the rules at the end (2026-10-27).
# the same way R-1b.yaml was. An ANSWER KEY for grading the drafting script: written without looking at anything the
# script drafted or recorded, from the City's documents only (2_extracted_text/, the chart read cell by cell, the
# definitions), with R-1b.yaml as the model of the format.
#
# Why R-1a: it is R-1b's closest sibling (the chart's first column, right next to R-1B). Most rules have the same
# shape and some the same numbers, so a drafter that reads the wrong column (R-1B's 6,000 sf, 50 ft, 25% for R-1A's
# 10,000 sf, 75 ft, 20%) fails here.
#
# Every chart number was read three ways and agrees: the chart's text line (quoted), the chart reader's R-1A cell
# (cited), and each word's position on the page under the R-1A heading (checked by hand with pdfplumber's word
# positions, 2026-10-20). test_r1b_matches_chart.py checks the rules against the R-1A cells.
#
# Where R-1a differs from R-1b (chart p.3, column R-1A): lot size 10,000 sf for a one-family detached house and for
# other uses (R-1b: 6,000 / 7,500); lot width 75 ft for both (R-1b: 50 / 60); lot coverage 20% (R-1b: 25%).
# The same as R-1b: uses (p.2), 3 stories, 35 ft, the yards (25 ft front, 10 ft + 10 ft sides, rear 25% of the
# lot depth up to 50 ft but not less than 20 ft), parking (p.14), and the R-1 accessory distances (§325-25C).
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2: the private garage
# "for not more than three cars", note 6), accessory dwelling units (§325-28),
# height exceptions for chimneys and similar (§325-16A, applied when
# measuring height), cluster subdivisions (§325-11), loading
# for nonresidential uses ("Allowed by variance", p.14).

district: R-1a
rules:

  - id: R-1a.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: use in ["one_family_detached", "church", "public_park_or_playground", "library_or_fire_station"]
    review_when:
      - when: use in ["cemetery", "public_utility_structure", "school"]
        reason: Marked SP for R-1A on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities and schools as requiring a special permit from the Planning and Development Board.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [13, 13]
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [14, 14]
        quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: library_or_fire_station}
        expect: pass
      - given: {use: two_family}
        expect: fail
        note: marked - for R-1A (the first mark in the row)
      - given: {use: one_family_semi_detached}
        expect: fail
      - given: {use: multiple_family}
        expect: fail
      - given: {use: nursery_school_or_child_day_care}
        expect: fail
        note: SP in R-2, • in R-3, but - in R-1A
      - given: {use: school}
        expect: needs_review
      - given: {use: cemetery}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: public_utility_same_use
      question: The chart says "Public utility structure except office"; §325-9B(1)(c) says "Public utility facilities".
        Are these the same use?
      kind: reading
      answer: 'The same use: the chart''s special-permit rows run in the same order as §325-9B(1) ((b) cemeteries, (c)
        public utility facilities). Either way it needs a special permit, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: Public utility facilities
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.2
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: The R-1A column is the first mark in each row of page 2. Its marks are the same as R-1B's in every primary-use
      row (checked row by row against the chart reader's R-1A cells and the marks' positions on the page), so the
      permitted list is R-1b's. What the marks mean is Gordium's reading (the chart_marks finding).
    drafted_by: claude
    status: draft

  - id: R-1a.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Minimum lot size, one-family dwelling, detached (chart p.3)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 10000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
    examples:
      - given: {use: one_family_detached, lot_area: 10400}
        expect: pass
      - given: {use: one_family_detached, lot_area: 10000}
        expect: pass
        note: exactly at the minimum
      - given: {use: one_family_detached, lot_area: 9999}
        expect: fail
      - given: {use: one_family_detached, lot_area: 6674}
        expect: fail
        note: 106 Ithaca Rd's lot is large enough in R-1b (6,000 sf) but not in R-1a
      - given: {use: church, lot_area: 5000}
        expect: not_applicable
    notes: "Chart note 3 points to §325-8B(1): the minimum applies to each main building on the lot."
    drafted_by: claude
    status: draft

  - id: R-1a.lot_area_other_use
    kind: rule
    topic: dimensions
    title: "Minimum lot size, other use (chart p.3)"
    applies_when: use != "one_family_detached"
    check: lot_area >= 10000
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-1A}
    examples:
      - given: {use: church, lot_area: 12000}
        expect: pass
      - given: {use: church, lot_area: 10000}
        expect: pass
        note: exactly at the minimum
      - given: {use: church, lot_area: 9999}
        expect: fail
      - given: {use: church, lot_area: 7500}
        expect: fail
        note: R-1b's other-use minimum is not enough in R-1a
      - given: {use: one_family_detached, lot_area: 5000}
        expect: not_applicable
    drafted_by: claude
    status: draft

  - id: R-1a.lot_area_each_primary_building
    kind: rule
    topic: dimensions
    title: "Each further primary building needs its own lot area (§325-8B(1))"
    applies_when: primary_buildings >= 2
    check: lot_area >= primary_buildings * (10000 if use == "one_family_detached" else 10000)
    review_when:
      - when: primary_buildings >= 2 and not primary_buildings_same_use
        reason: >-
          Not every primary building on the lot is stated to hold the lot's use: each building needs its own
          use's lot area, added together (§325-8B(1)); check by hand.
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [11, 16]
        quote: "(1) For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts, each square-footage requirement applies separately to the initial permitted primary use and to each additional permitted primary use located in a separate building on the property in question (e.g., in R-2b Districts, an area of 3,000 square feet is required for a one family house or a two-family house, and an additional area of 3,000 square feet is required for each additional one-family house or two-family house on the property)."
        not_limits: {1: "(1): the paragraph's number", 3000: "R-2b's figure, the code's own example"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [9, 9]
        quote: "One-family dwelling, detached [fn4] • • • • • • • • •"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [19, 19]
        quote: "Other use 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Other use", column: R-1A}
    examples:
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 20000}
        expect: pass
        note: "two primary buildings need 2 x 10,000 sf"
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 19999}
        expect: fail
        note: "enough for one building, not two"
      - given: {use: one_family_detached, primary_buildings: 1, lot_area: 10000}
        expect: not_applicable
        note: "one primary building: the use's own lot-area rule decides"
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 30000}
        expect: pass
      - given: {use: one_family_detached, primary_buildings: 3, primary_buildings_same_use: true, lot_area: 29999}
        expect: fail
      - given: {use: one_family_detached, primary_buildings: 2, primary_buildings_same_use: false, lot_area: 1000000}
        expect: needs_review
        note: "another building holds another use: its own figure, added by hand"
      - given: {use: one_family_detached, primary_buildings: 2, lot_area: 1000000}
        expect: needs_review
        note: "whether every building holds this use not said"
      - given: {use: one_family_detached, lot_area: 1000000}
        expect: needs_review
        note: "the primary buildings not counted"
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 20000}
        expect: pass
        note: "Other use"
      - given: {use: church, primary_buildings: 2, primary_buildings_same_use: true, lot_area: 19999}
        expect: fail
    notes: >-
      §325-8B(1): every residential district's lot-size figure applies again to each further primary use in a separate
      building on the lot (the code's own example: in R-2b, 3,000 sf for a house and 3,000 sf more for each further
      house). With one primary building this rule doesn't apply: the use's own lot-area rule (R-1a.lot_area_*) checks
      it. With two or more, the lot needs the figure once per building, when every building holds the lot's use
      (primary_buildings_same_use); otherwise each building's own figure, added by hand. Gordium counts the primary
      buildings from the drawing where it can (one building, or none standing apart that could hold a home); a
      building standing apart that could (a large garage, a second house) is read both ways until the architect states
      the count. An accessory building (a garage, a shed, an accessory dwelling unit, §325-3B) isn't a primary
      building.
    drafted_by: claude
    status: draft

  - id: R-1a.yards_not_shared
    kind: flag
    topic: dimensions
    title: "A yard required for one building can't count for another (§325-7B)"
    applies_when: primary_buildings > 1
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [8, 10]
        quote: "B. Use of yard for another building. No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building."
      - file: chapter_325_zoning_2026-10.pdf
        page: 14
        lines: [37, 39]
        quote: "LOT, BUILDING — A parcel of land occupied or to be occupied by one or more buildings and any accessory buildings, together with such open spaces as are required under the provisions of this chapter,"
    examples:
      - given: {primary_buildings: 1}
        expect: not_applicable
        note: one primary building on the lot; nothing on it to share a yard with
      - given: {primary_buildings: 2}
        expect: needs_review
        note: two primary buildings; how their yards are divided is the open question
      - given: {}
        expect: needs_review
        note: the primary buildings not counted
    open_questions:
    - '§325-7B: "No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building." With two or more primary buildings on one lot, how are their yards kept apart: is each building''s yard measured from it to the lot lines, with no building standing in another''s required yard; or must the space between two buildings also be at least the yards each needs on the sides facing each other, added together?'
    research:
    - question: '§325-7B: "No part of a yard or other open space about any building required for the purposes of complying with the provisions of this chapter shall be included as a part of a yard or other open space similarly required for another building." With two or more primary buildings on one lot, how are their yards kept apart: is each building''s yard measured from it to the lot lines, with no building standing in another''s required yard; or must the space between two buildings also be at least the yards each needs on the sides facing each other, added together?'
      searched:
      - 325-7B
      - 325-3B:yard
      - 325-3B:front_yard
      - 325-3B:side_yard
      - 325-3B:rear_yard
      - 325-3B:lot_building
      - 325-3B:primary_structure
      - 325-8B
      - 325-25A
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [35, 36]
        quote: An open space extending from the front yard to the rear yard between any building and the side lot line
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [31, 31]
        quote: An open space extending the full width of the lot between a main building
      why_open: >-
        The code defines every yard between a building and a lot line (§325-3B YARD (1) to (3)), never between two
        buildings on one lot, and §325-7B says only that one building's required yard can't be another's, not where
        one ends and the next begins. No City interpretation or Board of Zoning Appeals decision was found
        (searched 2026-10-27); other New York codes with the same clause (Yonkers, East Rockaway) don't spell it out
        either. Gordium measures the yards from the main building only, so with two or more primary buildings this
        needs review either way.
      readings:
      - id: to_lot_lines
        reading: each primary building's yards measured from it to the lot lines, and no building inside another's required yard
      - id: sum_between
        reading: also, the space between two primary buildings at least the yards each needs on the facing sides, added together
      report: docs/research/2026-10-27_audit_gaps.md §5
    findings:
    - id: accessory_buildings_may_stand_in_yards
      question: Does §325-7B stop an accessory building (a garage, a shed) standing in the main building's side or rear yard?
      kind: law
      answer: 'No: accessory structures "shall be exempt from side yard requirements" and "are permitted in any side or rear yard but not in a required front yard" (§325-25, §325-25A); their own distances are checked by the accessory-building rule.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [35, 35]
        quote: shall be exempt from side yard requirements contained in the District Regulations Chart
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 38]
        quote: Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard
      still_open: []
      report: docs/research/2026-10-27_audit_gaps.md §5
    - id: yards_on_this_lot
      question: Does §325-7B reach a building on a neighbouring lot (a lot split off from one whose building needed the land as its yard)?
      kind: reading
      answer: 'Gordium reads it within one lot: a yard is "That part of a lot" (§325-3B YARD), so this lot''s yards serve the buildings on it, and a neighbouring building''s required yards lie on its own lot, where its own rules check them.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 20
        lines: [28, 28]
        quote: YARD — That part of a lot not occupied by the principal building or structure
      strength: strong
      confirm_with: the architects
      still_open: []
      report: docs/research/2026-10-27_audit_gaps.md §5
    notes: >-
      With one primary building on the lot (garages, sheds and an accessory dwelling unit are accessory buildings,
      not primary ones) nothing on the lot can share its yards: not applicable. With two or more, this needs review
      until the open question is answered: check by hand that no building stands in another's required yard, and
      how the space between them is divided. The primary buildings are counted as for §325-8B(1)
      (primary_buildings).
    drafted_by: claude
    status: draft

  - id: R-1a.stream_setback
    kind: rule
    topic: dimensions
    title: "New structures at least 20 ft from an inlet wall or stream bank (§325-26)"
    check: not stream_near_lot or stream_distance >= 20
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [15, 19]
        quote: "No new structure shall be located nearer than 20 feet to an inlet wall or to the bank of an inlet channel or stream, measured at an average water level, except for those structures directly connected with marine or public or commercial recreation activities. (See illustration below.) Properties located within the Cherry Street District, the Market District, the Newman District, and the West End/Waterfront District are exempt from this requirement."
      - file: chapter_325_zoning_2026-10.pdf
        page: 19
        lines: [19, 20]
        quote: "STRUCTURE — Anything constructed or erected on the ground or which is attached to another structure or building. Structures shall not include patios or terraces."
    examples:
      - given: {stream_near_lot: false}
        expect: pass
        note: nothing within 20 ft of the lot, so no structure on it can be nearer
      - given: {stream_near_lot: true, stream_distance: 20}
        expect: pass
        note: at the limit ("nearer than 20 feet" is what's barred)
      - given: {stream_near_lot: true, stream_distance: 19.9}
        expect: fail
      - given: {stream_near_lot: true}
        expect: needs_review
        note: a stream or inlet near the lot, the distance not given
      - given: {stream_distance: 35}
        expect: pass
        note: the nearest new structure is 35 ft from it, whatever else is said
      - given: {stream_distance: 12}
        expect: needs_review
        note: whether a stream or inlet is near the lot not said
      - given: {}
        expect: needs_review
        note: nothing said about streams, never a pass
    findings:
    - id: stream_setback_measured_level
      question: How is §325-26's 20 ft measured?
      kind: law
      answer: 'Across, level, from the new structure to the point where the average water level meets the bank (or the inlet wall): the section''s own illustration (p.67 of the PDF, below the text; read from the page, research §7) draws "20'' MIN" as a horizontal dimension from the structure''s face to the bank at "AVERAGE LEVEL", between the high-water and low-water lines; the text says the distance is "measured at an average water level".'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [15, 16]
        quote: No new structure shall be located nearer than 20 feet to an inlet wall or to the bank of an inlet channel or stream, measured at an average water level
      report: docs/research/2026-10-27_audit_gaps.md §7
    - id: stream_setback_every_structure
      question: Which structures does §325-26 reach?
      kind: law
      answer: 'Every new structure: "Anything constructed or erected on the ground or which is attached to another structure or building", so a garage, a deck, a shed or a fence as well as the house; patios and terraces are not structures. Its exception is for structures "directly connected with marine or public or commercial recreation activities".'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 19
        lines: [19, 20]
        quote: STRUCTURE — Anything constructed or erected on the ground or which is attached to another structure or building. Structures shall not include patios or terraces.
      report: docs/research/2026-10-27_audit_gaps.md §7
    notes: >-
      Gordium's model doesn't show the water, so the architect states whether any inlet wall or stream bank (at average
      water level) is within 20 ft of the lot (stream_near_lot) and, if so, the least distance from any new structure
      to it (stream_distance, measured across, level, as the section's illustration shows). Both blank by default: a
      blank needs review, never a pass. An addition counts as new construction (Gordium asks the cautious way). Not
      applied: the exception for structures "directly connected with marine or public or commercial recreation
      activities" (a dock or boathouse): Gordium shows such a structure nearer than 20 ft as not complying; ask the
      zoning office. The districts exempted by name (Cherry Street, Market, Newman, West End/Waterfront) aren't
      residential districts.
    drafted_by: claude
    status: draft

  - id: R-1a.south_hill_overlay
    kind: rule
    topic: dimensions
    title: "South Hill Overlay: no new primary structure past one per parcel (§325-8E)"
    check: not south_hill_overlay or primary_buildings <= 1
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 29
        lines: [30, 36]
        quote: "(1) South Hill Overlay District restrictions. (a) After the date of this amendment, any property located within the South Hill Overlay District with a zoning designation of R-1 or R-2 is prohibited from constructing a primary structure on any parcel already containing one or more primary structures, and is prohibited from constructing more than one primary structure on a parcel containing no primary structures. The preceding sentence shall not impact future changes to primary structures existing prior to the effective date of this subsection."
        not_limits: {2: "R-2: the district's name, not a count"}
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [42, 42]
        quote: "(2) Properties in the South Hill Overlay District with a zoning designation of R-1 or R-2, see §325-8(E)."
        not_limits: {2: "the note's number, and R-2: the district's name"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [39, 40]
        quote: "PRIMARY STRUCTURE — A single structure (located on a parcel) containing a use permitted in the zoning district in which it is located."
    examples:
      - given: {south_hill_overlay: true, primary_buildings: 1}
        expect: pass
      - given: {south_hill_overlay: true, primary_buildings: 2}
        expect: fail
        note: a second primary structure on a parcel in the overlay
      - given: {south_hill_overlay: false, primary_buildings: 2}
        expect: pass
        note: outside the overlay this rule doesn't limit them (§325-8B(1) still asks each its own lot area)
      - given: {primary_buildings: 1}
        expect: pass
        note: one primary structure complies in the overlay or out, so whether the lot is in it needn't be asked
      - given: {primary_buildings: 2}
        expect: needs_review
        note: whether the lot is in the overlay not said
      - given: {south_hill_overlay: true}
        expect: needs_review
        note: the primary buildings not counted
    notes: >-
      §325-8E(1)(a) (added 2017-11-01, Ord. No. 2017-14): in the South Hill Overlay District, on R-1 or R-2 land, no
      primary structure may be built on a parcel that already has one, and no more than one on an empty parcel; so
      the parcel holds one primary structure after the work. Whether the lot is in the overlay is stated by the
      architect (south_hill_overlay, blank by default: Gordium doesn't look up the overlay map yet); with one
      primary building it complies either way, so it is asked only where it matters. Gordium checks the design as
      new construction: a parcel that already held two or more primary structures before the amendment may keep
      and change them (the subsection's last sentence), which this rule doesn't see; tell the zoning office if so.
      Garages, sheds and an accessory dwelling unit aren't primary structures (§325-3B). The primary buildings are
      counted as for §325-8B(1) (primary_buildings).
    drafted_by: claude
    status: draft

