  - id: R-1a.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 35 or building_height <= 35 + 0.1 * 35
      and front_yard >= 25 + (building_height - 35)
      and side_yard_smaller >= 10 + (building_height - 35)
      and side_yard_larger >= 10 + (building_height - 35)
      and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [29, 29]
        quote: "Maximum Building Height [fn10]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-1A}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 7]
        quote: "In any district, any main building may be erected to a height in excess of that specified for the district, provided that:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: "(3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that district."
    examples:
      - given: {building_height: 35, front_yard: 25, side_yard_smaller: 10, side_yard_larger: 10, rear_yard: 32.5, lot_depth: 130}
        expect: pass
        note: exactly at 35 ft with every yard at its minimum (rear 25% of 130 = 32.5)
      - given: {building_height: 35.01, front_yard: 25, side_yard_smaller: 10, side_yard_larger: 10, rear_yard: 32.5, lot_depth: 130}
        expect: fail
        note: over 35 ft, so every yard must grow by the extra height
      - given: {building_height: 38.5, front_yard: 28.5, side_yard_smaller: 13.5, side_yard_larger: 13.5, rear_yard: 36, lot_depth: 130}
        expect: pass
        note: the most the bonus allows (10% of 35 = 3.5 ft), each yard 3.5 ft larger
      - given: {building_height: 38.51, front_yard: 40, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 50, lot_depth: 130}
        expect: fail
        note: past 38.5 ft, however large the yards
      - given: {building_height: 37, front_yard: 26.99, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 34.5, lot_depth: 130}
        expect: fail
        note: the front yard must be 25 + 2 = 27
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 11.99, side_yard_larger: 12, rear_yard: 34.5, lot_depth: 130}
        expect: fail
        note: the narrower side yard must be 10 + 2 = 12
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 34.49, lot_depth: 130}
        expect: fail
        note: the rear yard must be 32.5 + 2 = 34.5
      - given: {building_height: 37, front_yard: 27, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 52, lot_depth: 240}
        expect: pass
        note: on a deep lot the rear yard is capped at 50 ft (25% of 240 = 60), then + 2
    open_questions:
    - '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height, or allowed
      on top of the bonus height too?'
    research:
    - question: '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height,
        or allowed on top of the bonus height too?'
      searched:
      - 325-16
      - 325-16A
      - 325-16B
      - 325-16C
      - 325-3B:height_of_building
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [4, 4]
        quote: cornice for ornament
      why_open: §325-16B allows an ornamental parapet or cornice up to 5 ft above the height limit, but doesn't say
        whether that is the chart's limit or the bonus height §325-16C allows, or whether a parapet that guards a roof
        deck (not "for ornament") qualifies. No City record found. (The same question as R-1b.height's, since the words are
        the same in every district.)
      readings:
      - id: from_chart_limit
        reading: the 5 ft is measured from the chart's height limit (the stricter reading)
      - id: from_bonus_height
        reading: the 5 ft is measured from the bonus height §325-16C allows
      report: docs/research/2026-10-20_architect_questions.md §4.6
    findings:
    - id: height_bonus_every_yard
      question: '§325-16C(1): we read "each required ... yard is increased one foot ... for each one foot of such additional
        height" as: each yard must be at least its normal requirement plus the extra height (both side yards included).
        Confirm.'
      kind: law
      answer: 'Confirmed: every required front, side and rear yard grows one foot for each foot of extra height.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 8]
        quote: Each required front, side and rear yard is increased one foot on the ground for each one foot
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    - id: height_bonus_main_building_only
      question: Does the bonus apply to accessory buildings too, or only the main building ("any main building")?
      kind: law
      answer: Only the main building ("any main building"). The number of stories still can't be exceeded, and the extra
        feet are at most 10% of the maximum building height.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 6]
        quote: any main building may be erected to a height in excess of that
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: the number of stories permitted may not be exceeded
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: may not exceed 10% of the maximum building height
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    notes: >-
      Arithmetic for the bonus: 10% of the 35 ft maximum = 3.5 ft, so at most 38.5 ft, with every required yard 1 ft
      larger per extra foot (R-1A's yards: front 25, sides 10 and 10, rear 25% of the lot depth, at most 50 ft, at
      least 20 ft). All yard measurements are needed to check the height rule, even for buildings at or under 35 ft
      (the checker evaluates every part, so a missing measurement can't hide).
    drafted_by: claude
    status: draft

