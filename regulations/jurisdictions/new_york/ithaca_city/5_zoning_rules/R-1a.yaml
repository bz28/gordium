        quote: "(i) Home occupations in all residential districts, unless the home occupation meets all of the following criteria:"
    examples:
      - given: {use: one_family_detached, home_occupation: true}
        expect: needs_review
      - given: {use: one_family_detached, home_occupation: false}
        expect: not_applicable
      - given: {use: one_family_detached}
        expect: needs_review
        note: "whether one is planned isn't said"
      - given: {use: church, home_occupation: true}
        expect: not_applicable
    findings:
    - id: home_occupation_needs_a_person
      question: "Can a home occupation ever simply comply?"
      kind: law
      answer: "Not on what Gordium knows: the chart marks it SP in every residential district, and §325-9B(1)(i) lifts that only if it meets all of its criteria (no stock, no traffic or parking beyond the residential use, no exterior alterations or display, no noise or other effects); §325-3B's other conditions are about how it runs too. So once a home occupation is planned it needs review; its size is checked on its own (home_occupation_size)."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [37, 37]
        quote: "(i) Home occupations in all residential districts"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §7
    notes: "Always needs review once one is planned: whether it needs the special permit (§325-9B(1)(i)) and §325-3B's conditions on how it runs are a person's to check. Its size is R-1a.home_occupation_size. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

  - id: R-1a.private_garage
    kind: rule
    topic: uses
    title: "Private garage: not more than three cars (chart p.2 note 6)"
    check: garage_cars <= 3
    review_when:
      - when: "garage_cars > 3 and garage_cars <= 3 * private_garages"
        reason: >-
          More than three cars in all, but spread over private garages that could each hold three or fewer: whether
          note 6 limits each garage or all the lot's garages together is an open question; check by hand or ask the
          zoning office.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [47, 47]
        quote: "(6) For not more than three cars."
      # the district's own cell on line 32, marked with that note: the chart reader's cell, so the column is checked
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Private garage", column: R-1A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 11
        lines: [16, 17]
        quote: "GARAGE, PRIVATE — An enclosed space for the storage of one or more motor vehicles, provided that no business, occupation or service is conducted for profit therein."
        not_limits: {1: "one or more: what a garage holds, not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [17, 18]
        quote: "(3) Column 3: Permitted Accessory Uses. Uses permitted to be accessory to the main use of the premises are listed, subject to the further regulations of Article V."
    examples:
      - given: {garage_cars: 0}
        expect: pass
        note: no private garage
      - given: {garage_cars: 3}
        expect: pass
        note: three cars in all passes under both readings
      - given: {garage_cars: 2}
        expect: pass
        note: the garage count isn't needed at three or fewer
      - given: {garage_cars: 4, private_garages: 1}
        expect: fail
        note: one garage of four cars
      - given: {garage_cars: 7, private_garages: 2}
        expect: fail
        note: two garages can't hold seven cars with three or fewer in each, so too many under both readings
      - given: {garage_cars: 4, private_garages: 2}
        expect: needs_review
        note: two garages that could each hold three or fewer; four in all is too many only per lot
      - given: {}
        expect: needs_review
        note: the cars in the garages not said
      - given: {garage_cars: 5}
        expect: needs_review
        note: over three in all, the garages not counted
    open_questions:
    - 'Chart p.2 note 6, "For not more than three cars", on the private garage: is it a limit on each private garage, or on all the private garages on the lot together?'
    research:
    - question: 'Chart p.2 note 6, "For not more than three cars", on the private garage: is it a limit on each private garage, or on all the private garages on the lot together?'
      searched:
      - 325-8A
      - 325-3B:garage_private
      - 325-3B:accessory_use
      - 325-3B:accessory_building_or_structure
      - 325-3B:accessory_dwelling_unit_attached
      - 325-3B:accessory_dwelling_unit_detached
      - 325-3B:building
      - 325-3B:structure
      - 325-3B:primary_structure
      - 325-3B:lot_building
      - 325-3B:parking_area
      - 325-3B:parking_garage
      - 325-3B:parking_space
      - 325-20
      - 325-20D
      - 325-20E
      - 325-20F
      - 325-25
      - 325-25A
      - 325-25C
      - 325-25D
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 11
        lines: [16, 16]
        quote: "GARAGE, PRIVATE — An enclosed space for the storage of one or more motor vehicles"
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [28, 28]
        quote: "(7) Garages within a residential building or on the premises thereof used primarily for the storage"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 34]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or"
      why_open: >-
        The chart (p.2 line 32 and note 6) gives the limit on the private garage as an accessory use, and §325-3B
        defines a private garage as "an enclosed space", so the words fit a limit on each garage; but nothing in
        Chapter 325 says whether a lot may have two garages of three cars each (six in all), and no other section
        (§325-20's parking rules, §325-25's accessory structures, the ACCESSORY USE definition's garages "within a
        residential building or on the premises thereof") counts cars in garages. No City interpretation or Board of
        Zoning Appeals decision on the limit was found (web search, 2026-10-29); the City's 2010 chart (posted by the
        Fall Creek neighborhood association, fhia.org) has the same words, "Private garage for not more than 3 cars",
        and doesn't settle it either. Gordium passes three cars or fewer in all (both readings), fails more than three
        times the garages (some garage holds more than three: both readings), and asks between.
      readings:
      - id: each_garage
        reading: three cars at most in each private garage
      - id: whole_lot
        reading: three cars at most in all the private garages on the lot together
      report: docs/research/2026-10-29_private_garage.md §3
    notes: >-
      Chart p.2: a private garage is a permitted accessory use in R-1a "for not more than three cars" (note 6);
      §325-3B defines it as an enclosed space for storing motor vehicles, with no business in it. The architect states
      the cars the lot's private garages hold, all together (garage_cars: every enclosed garage, attached or detached;
      0 for none; a carport isn't enclosed), and, only when that is over three, how many private garages there are
      (private_garages). Blank needs review, never a pass. Gordium passes three or fewer in all, fails more than three
      times the garages (some garage holds more than three: too many under both readings), and asks between. Not
      checked here: the definition's "no business ... for profit" (a home occupation in a garage is checked by the
      home-occupation rules) and where the garage stands (accessory_buildings, §325-25). Research:
      docs/research/2026-10-29_private_garage.md.
    drafted_by: claude
    status: draft

  - id: R-1a.adu_one_per_parcel
    kind: rule
    topic: density_and_occupancy
    title: "Accessory dwelling unit: at most one per parcel (§325-28C(1))"
    applies_when: accessory_dwelling_unit
    check: adus_on_parcel <= 1
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [8, 8]
        quote: "(1) A maximum of one ADU is allowed per parcel."
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: "Accessory Dwelling Unit", column: R-1A}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [7, 11]
        quote: "ACCESSORY DWELLING UNIT (ADU) — A smaller, secondary dwelling unit located on the same lot as a primary residential, commercial, or mixed-use structure. An ADU must have a separate entrance from the outside of the building or through a common hall and must provide living, cooking, sanitary, and sleeping facilities. All ADUs must adhere to building code regulations for residential use."
    examples:
      - given: {accessory_dwelling_unit: true, adus_on_parcel: 1}
        expect: pass
      - given: {accessory_dwelling_unit: true, adus_on_parcel: 2}
        expect: fail
      - given: {accessory_dwelling_unit: true}
        expect: needs_review
        note: how many ADUs the parcel will have, not said
      - given: {accessory_dwelling_unit: false}
        expect: not_applicable
      - given: {}
        expect: needs_review
        note: whether an ADU is planned, not said
    notes: >-
      Chart p.2 permits an accessory dwelling unit in R-1a; §325-28C sets its requirements. The architect states
      whether an ADU is planned (accessory_dwelling_unit) and how many the parcel will have, any already there
      included (adus_on_parcel). A blank needs review, never a pass. No off-street parking is required for an ADU
      (§325-28C(2), the parking rule's finding adu_needs_no_parking). Not checked: that it may be leased but not
      sold separately, and that the parcel may not be subdivided to separate it (§325-28C(5), (6)): ownership, not
      design. Research: docs/research/2026-10-29_accessory_dwelling_units.md.
    drafted_by: claude
    status: draft

  - id: R-1a.adu_bedrooms
