  - id: R-1a.occupancy_one_family
    kind: rule
    topic: density_and_occupancy
    title: "One-family occupancy (§325-3B: family + 1 unrelated; 2 if owner-occupied)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
    check: unrelated_persons <= 1 or unrelated_persons <= 2 and owner_occupied and not accessory_dwelling_unit
    review_when:
      - when: (unrelated_persons > 2 or unrelated_persons > 1 and not owner_occupied) and functional_family_unit
        reason: "A functional family unit may occupy a one-family dwelling whatever its size (§325-3B DWELLING, ONE-FAMILY); whether this household is one is the City's finding, on the criteria §325-3B FUNCTIONAL FAMILY UNIT lists, so a person checks it."
      - when: unrelated_persons == 2 and owner_occupied and accessory_dwelling_unit
        reason: "An accessory dwelling unit is on the lot: whether the owner's home makes this dwelling owner-occupied, and whether the limits reach the ADU's own occupants, is the open question, so a person checks the two-unrelated allowance."
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [36, 37]
        quote: "DWELLING, ONE-FAMILY — A dwelling unit occupied exclusively for residential purposes by an individual or family and not more than one unrelated individual or a functional family unit."
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [37, 39]
        quote: "In the R-1 Zones, occupancy by an individual or a family and not more than two unrelated individuals is permitted if the dwelling is owner-occupied."
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "FAMILY — One or more persons occupying a dwelling unit, all of whom are related by blood, marriage or adoption."
        not_limits: {1: "one or more persons make a family: who counts, not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [11, 13]
        quote: "FUNCTIONAL FAMILY UNIT — A group of individuals living together in a single dwelling unit and functioning as a family with respect to those characteristics that are consistent with the purposes of zoning restrictions in residential neighborhoods."
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "(6) [fn3]In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be"
        not_limits: {1: "the district name R-1, not a number", 2: "the district name R-2, not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [3, 3]
        quote: "excluded in determining the number of unrelated occupants in a dwelling unit."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [41, 41]
        quote: "NOTES: (1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall be excluded in determining the number of unrelated occupants."
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [45, 45]
        quote: "(4) See §325-3 for occupancy restrictions."
      - file: chapter_325_zoning_2026-10.pdf
        page: 16
        lines: [37, 39]
        quote: "OWNER — In instances where owner-occupancy is required, \"owner\" shall be defined as follows: A person who maintains his/her principal residence in property for more than six months of each calendar year and who is:"
        not_limits: {6: "six months a year: part of who the owner is, which the architect states"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [7, 8]
        quote: "ACCESSORY DWELLING UNIT (ADU) — A smaller, secondary dwelling unit located on the same lot as a primary residential, commercial, or mixed-use structure."
    examples:
      - given: {use: one_family_detached, unrelated_persons: 1}
        expect: pass
      - given: {use: one_family_detached, unrelated_persons: 2, owner_occupied: true, accessory_dwelling_unit: false}
        expect: pass
      - given: {use: one_family_detached, unrelated_persons: 2, owner_occupied: true, accessory_dwelling_unit: true}
        expect: needs_review
        note: "an ADU on the lot: the open question"
      - given: {use: one_family_detached, unrelated_persons: 2, owner_occupied: true}
        expect: needs_review
        note: "whether an ADU is on the lot isn't said"
      - given: {use: one_family_detached, unrelated_persons: 2, owner_occupied: false, functional_family_unit: false}
        expect: fail
      - given: {use: one_family_detached, unrelated_persons: 2, owner_occupied: false, functional_family_unit: true}
        expect: needs_review
        note: "a functional family unit: the City's finding"
      - given: {use: one_family_detached, unrelated_persons: 2}
        expect: needs_review
        note: "whether the owner lives there decides it, and it isn't said"
      - given: {use: one_family_detached}
        expect: needs_review
        note: "who lives there isn't said"
      - given: {use: church}
        expect: not_applicable
    findings:
    - id: who_is_unrelated
      question: "Who is an \"unrelated individual\" in a one-family or two-family dwelling?"
      kind: law
      answer: "Anyone in the dwelling unit not related by blood, marriage or adoption to the household's family (§325-3B FAMILY); in a household with no family, everyone but the individual the definition starts from (\"an individual or family and not more than ... unrelated\"). Gordium asks the most such people in any dwelling unit."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "all of whom are related by blood, marriage or adoption"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §1
    - id: children_left_out_in_r1_r2
      question: "Are minor dependent children counted among the unrelated people?"
      kind: law
      answer: "Not in R-1 and R-2: §325-8B(6) and the chart's own note (p.2) leave out minor dependent children in the care of a parent or relative when counting unrelated occupants."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "In R-1 and R-2 Districts, minor dependent children"
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [3, 3]
        quote: "excluded in determining the number of unrelated occupants in a dwelling unit"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §2.1
    - id: owner_lives_in_this_unit
      question: "Is the one-family dwelling \"owner-occupied\" when the owner lives only in an accessory dwelling unit on the lot?"
      kind: reading
      answer: "No, in Gordium's reading, a moderate one: a one-family dwelling is \"A dwelling unit\" (§325-3B) and an ADU is a \"secondary dwelling unit\" of its own, and the code calls the owner's home \"A dwelling unit where the owner ... resides\" (PRIMARY RESIDENCE); but DWELLING itself is \"Any building or structure or part thereof used and occupied for human habitation\", which reaches a whole building with an attached ADU, and OWNER says only \"principal residence in property\". So Gordium asks whether the owner lives in the one-family dwelling itself, and with an ADU on the lot the two-unrelated allowance needs review (what is still open: which unit the owner must occupy, and whether the limits reach the ADU's own occupants)."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [39, 39]
        quote: "permitted if the dwelling is owner-occupied"
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [36, 36]
        quote: "A dwelling unit occupied exclusively"
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [7, 7]
        quote: "ACCESSORY DWELLING UNIT (ADU) — A smaller, secondary dwelling unit located on the"
      - file: chapter_325_zoning_2026-10.pdf
        page: 17
        lines: [37, 37]
        quote: "PRIMARY RESIDENCE — A dwelling unit where the owner or long-term leaseholder resides for a"
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [21, 21]
        quote: "DWELLING — Any building or structure or part thereof used and occupied for human habitation or"
      still_open: [R-1a.occupancy_one_family#1, R-1b.occupancy_one_family#1]
      strength: moderate
      confirm_with: the architects
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §3
    - id: functional_family_unit_is_the_citys_finding
      question: "Can Gordium decide whether a household is a functional family unit?"
      kind: law
      answer: "No: §325-3B lists criteria that must be present (sharing the whole unit, stability shown by children, shared expenses, the same address for voting and taxes...) and presumptions against, weighed case by case. Over the limit with a household said to be such a unit, the rule needs review; said not to be, it does not comply."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [15, 15]
        quote: "the following criteria must be present"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §5
    open_questions:
    - "With an accessory dwelling unit on an R-1 lot, which unit must the owner live in for a one-family dwelling to be \"owner-occupied\" (and so hold two unrelated individuals), and do the one-family limits also reach the ADU's own occupants?"
    research:
    - question: "With an accessory dwelling unit on an R-1 lot, which unit must the owner live in for a one-family dwelling to be \"owner-occupied\" (and so hold two unrelated individuals), and do the one-family limits also reach the ADU's own occupants?"
      searched:
      - 325-3B:dwelling_one_family
      - 325-3B:accessory_dwelling_unit
      - 325-3B:owner
      - 325-3B:primary_residence
      - 325-3B:dwelling
      - 325-28
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [39, 39]
        quote: "permitted if the dwelling is owner-occupied"
      - file: chapter_325_zoning_2026-10.pdf
        page: 4
        lines: [7, 7]
        quote: "A smaller, secondary dwelling unit located on the"
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [12, 12]
        quote: "(5) An ADU may be leased separately but may not be sold separately from the primary structure."
      why_open: "\"The dwelling\" is a one-family dwelling, \"A dwelling unit\", which points to the house itself; DWELLING (\"Any building ... or part thereof\") and OWNER (\"principal residence in property\") point to the property. §325-28 (ADUs, 2025) sets no owner-occupancy or occupancy rule, and the one-family limits were written before ADUs were allowed. No City record found (web search 2026-10-27). Until answered, two unrelated individuals in an owner-occupied house with an ADU on the lot need review."
      readings:
      - id: owner_in_the_house
        reading: the owner must live in the one-family dwelling itself; an owner only in the ADU doesn't count
      - id: owner_anywhere_on_the_property
        reading: an owner living in either unit makes the property owner-occupied
      - id: limits_reach_the_adu
        reading: the ADU's own occupants are held to the one-family limits too
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §3
    notes: "Counts unrelated_persons: the most such people in any one dwelling unit (each semi-detached or attached dwelling is a one-family dwelling of its own). The limits are the definition's own (§325-3B); a person's say that the household is a functional family unit sends it to review. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

