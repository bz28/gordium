      question: "Who is an \"unrelated individual\" in a one-family or two-family dwelling?"
      kind: law
      answer: "Anyone in the dwelling unit not related by blood, marriage or adoption to the household's family (§325-3B FAMILY); in a household with no family, everyone but the individual the definition starts from (\"an individual or family and not more than ... unrelated\"). Gordium asks the most such people in any dwelling unit."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [27, 28]
        quote: "all of whom are related by blood, marriage or adoption"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §1
    - id: children_left_out_in_r1_r2
      question: "Are minor dependent children counted among the unrelated people?"
      kind: law
      answer: "Not in R-1 and R-2: §325-8B(6) and the chart's own note (p.2) leave out minor dependent children in the care of a parent or relative when counting unrelated occupants."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [28, 28]
        quote: "In R-1 and R-2 Districts, minor dependent children"
      - file: chapter_325_zoning_2026-10.pdf
        page: 27
        lines: [3, 3]
        quote: "excluded in determining the number of unrelated occupants in a dwelling unit"
      still_open: []
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §2.1
    open_questions:
    - "§325-3B DWELLING, MULTIPLE (3) makes a building \"occupied by one or two families and more than two roomers or boarders\" a multiple dwelling. Are the unrelated individuals the two-family definition counts in each unit \"roomers or boarders\" for this count, across the whole building?"
    research:
    - question: "§325-3B DWELLING, MULTIPLE (3) makes a building \"occupied by one or two families and more than two roomers or boarders\" a multiple dwelling. Are the unrelated individuals the two-family definition counts in each unit \"roomers or boarders\" for this count, across the whole building?"
      searched:
      - 325-3B:dwelling_multiple_or_multiple_residence
      - 325-3B:dwelling_two_family
      - 325-3B:boardinghouse
      - 325-3B:rooming_house
      - 325-3B:functional_family_unit
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 7
        lines: [28, 28]
        quote: "and more than two roomers or boarders"
      - file: chapter_325_zoning_2026-10.pdf
        page: 5
        lines: [17, 17]
        quote: "BOARDINGHOUSE — A multiple dwelling where sleeping facilities and meals are provided"
      - file: chapter_325_zoning_2026-10.pdf
        page: 10
        lines: [17, 17]
        quote: "act as separate roomers"
      why_open: "\"Roomer\" and \"boarder\" aren't defined. BOARDINGHOUSE speaks of meals for paying guests, and FUNCTIONAL FAMILY UNIT sets \"separate roomers\" against a household sharing the whole unit, which points to lodgers who pay; but nothing says an unrelated housemate isn't one. The two-family definition lets an R-2 unit hold two unrelated individuals, four in the building, which (3) would make a multiple dwelling if they count. No City record found (web search 2026-10-27). Until answered, a unit with more than one unrelated person (so possibly more than two in the building) needs review: never a pass on the narrower reading."
      readings:
      - id: unrelated_are_roomers
        reading: every unrelated person counts as a roomer or boarder, across the whole building
      - id: roomers_are_paying_lodgers
        reading: only people renting a room (with or without meals) count; unrelated housemates sharing the unit don't
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §6.4
    notes: "Each unit's own count: unrelated_persons is the most in any one unit. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

  - id: R-2c.home_occupation_size
    kind: rule
    topic: uses
    title: "Home occupation size (§325-3B: at most 25% of its unit and 500 sq ft)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached", "two_family", "multiple_family"] and home_occupation
    check: home_occupation_area <= 500 and home_occupation_area <= 0.25 * home_occupation_unit_area
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 12
        lines: [26, 28]
        quote: "HOME OCCUPATION — (1) A subordinate use of a nonresidential nature which is conducted within a dwelling unit or a building accessory thereto by a resident of the dwelling unit,"
        not_limits: {1: "the paragraph's number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 13
        lines: [18, 19]
        quote: "(f) The occupation occupies no more than 25% of the dwelling unit and no more than a total of 500 indoor square feet, including accessory structures."
    examples:
      - given: {use: one_family_detached, home_occupation: false}
        expect: not_applicable
      - given: {use: one_family_detached, home_occupation: true, home_occupation_area: 300, home_occupation_unit_area: 1600}
        expect: pass
      - given: {use: one_family_detached, home_occupation: true, home_occupation_area: 500, home_occupation_unit_area: 2000}
        expect: pass
        note: "at both limits"
      - given: {use: one_family_detached, home_occupation: true, home_occupation_area: 400, home_occupation_unit_area: 1200}
        expect: fail
        note: "over 25% of its dwelling unit"
      - given: {use: one_family_detached, home_occupation: true, home_occupation_area: 501, home_occupation_unit_area: 4000}
        expect: fail
        note: "over 500 sq ft"
      - given: {use: one_family_detached, home_occupation: true}
        expect: needs_review
        note: "its size isn't said"
      - given: {use: one_family_detached}
        expect: needs_review
        note: "whether one is planned isn't said"
      - given: {use: church, home_occupation: true}
        expect: not_applicable
        note: "conducted within a dwelling unit: not for a church"
    findings:
    - id: quarter_by_floor_area
      question: "\"No more than 25% of the dwelling unit\": 25% of what?"
      kind: reading
      answer: "Of the dwelling unit's floor area, the measure (f) uses in the same sentence for its 500 indoor square feet."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 13
        lines: [18, 18]
        quote: "no more than 25% of the dwelling unit"
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §8
    notes: "Over either limit it is no home occupation at all (§325-3B). Its special permit is R-2c.home_occupation. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft

  - id: R-2c.home_occupation
    kind: flag
    topic: uses
    title: "Home occupation (chart p.2: special permit unless §325-9B(1)(i) is met)"
    applies_when: >-
      use in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached", "two_family", "multiple_family"] and home_occupation
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 12
        lines: [26, 28]
        quote: "HOME OCCUPATION — (1) A subordinate use of a nonresidential nature which is conducted within a dwelling unit or a building accessory thereto by a resident of the dwelling unit,"
        not_limits: {1: "the paragraph's number"}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Accessory Uses, row: Home occupation, column: R-2C}
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [37, 38]
        quote: "(i) Home occupations in all residential districts, unless the home occupation meets all of the following criteria:"
    examples:
      - given: {use: one_family_detached, home_occupation: true}
        expect: needs_review
      - given: {use: one_family_detached, home_occupation: false}
        expect: not_applicable
      - given: {use: one_family_detached}
        expect: needs_review
        note: "whether one is planned isn't said"
      - given: {use: church, home_occupation: true}
        expect: not_applicable
    findings:
    - id: home_occupation_needs_a_person
      question: "Can a home occupation ever simply comply?"
      kind: law
      answer: "Not on what Gordium knows: the chart marks it SP in every residential district, and §325-9B(1)(i) lifts that only if it meets all of its criteria (no stock, no traffic or parking beyond the residential use, no exterior alterations or display, no noise or other effects); §325-3B's other conditions are about how it runs too. So once a home occupation is planned it needs review; its size is checked on its own (home_occupation_size)."
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [37, 37]
        quote: "(i) Home occupations in all residential districts"
      strength: strong
      report: docs/research/2026-10-27_occupancy_and_home_occupation.md §7
    notes: "Always needs review once one is planned: whether it needs the special permit (§325-9B(1)(i)) and §325-3B's conditions on how it runs are a person's to check. Its size is R-2c.home_occupation_size. Research: docs/research/2026-10-27_occupancy_and_home_occupation.md"
    drafted_by: claude
    status: draft
