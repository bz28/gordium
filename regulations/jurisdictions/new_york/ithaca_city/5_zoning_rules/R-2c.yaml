# R-2c (City of Ithaca): rules drafted by Claude by hand, by reading the zoning charts (April 2026) and Chapter 325,
# Occupancy (§325-3B one-family and two-family dwellings) and home occupations: the rules at the end (2026-10-27).
# the same way R-1b.yaml, R-1a.yaml and R-3a.yaml were. An ANSWER KEY for grading the drafting script: written
# without looking at anything the script drafted or recorded, from the City's documents only (2_extracted_text/, the
# chart read cell by cell, the section labels, the definitions), with R-1a.yaml and R-3a.yaml as the model of the
# format.
#
# Why R-2c: the densest two-family district, and the one whose chart column is hardest to read. Its cells are
# stacked ("35%/40% /50%", "10 ft /15 ft", "0 ft /5 ft / 10 ft") with notes saying which number goes with which use
# (notes 12, 14, 15), and its lot sizes grow with the number of OCCUPANTS (notes 4, 5, 6), a word §325-3B defines for
# R-2c only. A drafter that reads one number per cell, or shifts the stacked values into R-2B or R-3A, fails here.
#
# Every chart number was read two ways and agrees: the chart's text line (quoted where it is one line), and the
# chart reader's R-2C cell (cited); R-2C is the fifth value in each row. The stacked cells were checked against the
# notes that explain them: three coverage figures (note 12), two one-side figures (note 14), three other-side
# figures (note 15). test_r1b_matches_chart.py checks the rules against the R-2C cells, each figure for its own use.
#
# Where R-2c differs from R-2b (chart p.2, p.3, column R-2C): zero-lot-line and attached one-family dwellings are
# allowed by special permit; lot size by occupants (detached and zero-lot-line 2,500 sf for the first occupant +
# 500 sf for each more; semi-detached and two-family 2,000 sf for the first occupant in each dwelling unit + 400 sf
# for each more in each unit; attached 1,500 sf per unit + 300 sf per further occupant, more past five in a unit);
# lot width 40 ft (detached, zero lot line, other uses) or 50 ft (semi-detached, attached, two-family); coverage 35%,
# 40% or 50% by use; side yards by use (10 ft one side and 5 ft the other for detached and two-family houses; 15 ft
# for the zero-lot-line house's wide side; 0 ft on a semi-detached house's attached side). The same as R-2b: 3
# stories, 35 ft (bonus to 38.5 ft), 10 ft front yard, rear 25% of the lot depth (50 ft cap, 20 ft floor), other
# uses 4,000 sf, accessory buildings 3 ft from side and rear lot lines, parking.
#
# Draft (approval deferred, decided 2026-10-19). Not covered yet, as in R-1b (later rules or flags): ornamental
# parapets and cornices above the height limit (§325-16B), accessory uses and structures (p.2: the private garage
# "for not more than six cars per building", note 7), accessory dwelling units (§325-28), §325-3B OCCUPANT (2)'s
# minimum habitable space per person (it needs room areas), the South Hill Overlay (p.2 note 2, §325-8E), height exceptions (§325-16A),
# more than one main building on a lot (§325-8B(1)), loading for nonresidential uses ("Allowed by variance", p.14).
# R-2c is not one of the districts §325-11B(1) allows cluster subdivisions in.
#
# Known gaps (reported, not fixable in this file): (1) on a corner lot, as in R-2b and R-3a, R-2c.side_yards asks 10
# ft of the one side yard left (the City: Column 13's 5 ft): a stricter answer, never a false pass. (2) Gordium can't
# tell which side of a semi-detached or attached building is its attached side, or whether a zero-lot-line house's
# narrow side abuts a non-zero-lot-line building or lot: those side yards go to review under 10 ft (never a pass).
# (3) The occupants are stated for all the units on the lot together, not unit by unit: a lot size that depends on
# the split complies only if it is enough with every occupant in one unit, and needs review between the splits,
# unless the architect also states the most occupants in any one unit (exact for two units).

district: R-2c
rules:

  - id: R-2c.use
    kind: rule
    topic: uses
    title: "Permitted primary uses (chart p.2)"
    check: >-
      use in ["one_family_detached", "one_family_semi_detached", "two_family", "church", "public_park_or_playground",
      "library_or_fire_station"]
    review_when:
      - when: >-
          use in ["one_family_detached_zero_lot_line", "one_family_attached", "cemetery", "public_utility_structure",
          "school", "nursery_school_or_child_day_care", "adult_day_care_home", "neighborhood_commercial_facility"]
        reason: >-
          Marked SP for R-2C on the zoning chart (p.2). §325-9B(1) lists cemeteries, public utility facilities,
          schools, nursery schools and child day-care centers in R-2, neighborhood commercial facilities in R-2, and
          group or adult day-care facilities in R-2 as requiring a special permit from the Planning and Development
          Board; the zero-lot-line and attached one-family dwellings are marked SP on the chart only.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [7, 7]
        quote: "R-1A R-1B R-2A R-2B R-2C R-3A R-3AA R-3B"
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 16]
        quote: "(2) Column 2: Permitted Primary Uses. Uses which are permitted in each use district are listed, subject to the further regulations in this section and of Article V."
      # marked • for R-2C
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Church or related building", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public park or playground", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Library or fire station", column: R-2C}
      # marked SP for R-2C
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Cemetery or related building", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Public utility structure except office", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "School and related buildings", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Nursery school, child day care center", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Adult day care home", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 2
        cell: {section: Primary Uses, row: "Neighborhood commercial facility", column: R-2C}
      # marked - for R-2C (not permitted)
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [14, 14]
        quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
      - file: zoning_charts_2026-04.pdf
        page: 2
        lines: [16, 16]
        quote: "Dormitory - - - - - • - • •[fn5]"
      # the special permits
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: "(1) The uses listed under the district regulations in § 325-8, District regulations, which require a special permit from the Planning and Development Board, are as follows:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [25, 25]
        quote: "(b) Cemeteries in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [26, 26]
        quote: "(c) Public utility facilities in all districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [27, 27]
        quote: "(d) Schools and related uses in all residential districts."
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [28, 28]
        quote: "(e) Nursery schools or child day-care centers in R-2, CR-2 and R-U Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [29, 30]
        quote: "(f) Neighborhood retail or service commercial facilities in R-2, R-3, CR-2, CR-3, and CR-4 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers", 3: "district names (R-3, CR-3), not numbers", 4: "a district name (CR-4), not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: "(n) Group or adult day-care facilities in R-2 and CR-2 Districts."
        not_limits: {2: "district names (R-2, CR-2), not numbers"}
    examples:
      - given: {use: one_family_detached}
        expect: pass
      - given: {use: one_family_semi_detached}
        expect: pass
      - given: {use: two_family}
        expect: pass
      - given: {use: one_family_detached_zero_lot_line}
        expect: needs_review
        note: SP in R-2C (- in R-2A and R-2B)
      - given: {use: one_family_attached}
        expect: needs_review
        note: SP in R-2C (- in R-2A and R-2B, • in R-3A)
      - given: {use: multiple_family}
        expect: fail
        note: still - in R-2C (• from R-3A on)
      - given: {use: dormitory}
        expect: fail
      - given: {use: bed_and_breakfast_inn}
        expect: fail
      - given: {use: nursery_school_or_child_day_care}
        expect: needs_review
      - given: {use: school}
        expect: needs_review
    findings:
    - id: chart_marks
      question: The chart has no legend for its marks. We read • as permitted and - as not permitted; SP matches §325-9B(1)'s
        list of uses needing a special permit from the Planning and Development Board. Confirm.
      kind: reading
      answer: • = permitted (the uses Column 2 lists, §325-8A(2)); - = not permitted (left out, §325-8B(3)); SP = needs
        a special permit (the uses §325-9B(1) lists). The chart has no legend; this reads the code's own text.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [15, 15]
        quote: Uses which are permitted in each use district are listed
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [20, 20]
        quote: except where otherwise indicated by specific prohibition or omission
      - file: chapter_325_zoning_2026-10.pdf
        page: 30
        lines: [22, 23]
        quote: which require a special permit from the Planning and Development Board, are as follows
      strength: strong
      confirm_with: the architects
      report: docs/research/2026-10-20_architect_questions.md §5.1
    - id: adult_day_care_same_use
      question: The chart's use is "Adult day care home"; §325-9B(1)(n) says "Group or adult day-care facilities in R-2".
        Are these the same use?
      kind: reading
      answer: 'The same use: §325-9B(1)(n) is the only special-permit item for adult day care, it names R-2, and the
        chart marks the use SP in exactly R-2A, R-2B and R-2C. Either way it needs a special permit, so the result is
        NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 31
        lines: [34, 34]
        quote: Group or adult day-care facilities in R-2 and CR-2 Districts
      strength: strong
      confirm_with: the architects
    - id: zero_lot_line_and_attached_sp_not_in_325_9
      question: The chart marks the zero-lot-line and the attached one-family dwellings SP in R-2C, but §325-9B(1)'s
        list of special-permit uses has neither. Do they need a special permit?
      kind: reading
      answer: 'Treated as needing one: the chart is part of the law (§325-8A: "made a part of this chapter") and its
        SP mark is the more specific statement. Either way Gordium can''t pass them, so the result is NEEDS REVIEW.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [12, 12]
        quote: The District Regulations Chart is hereby made a part of this chapter
      strength: strong
      confirm_with: the City zoning office
    - id: permitted_use_still_has_rules
      question: '"Subject to the further regulations in this section and of Article V": can a use marked • still need
        review because of those regulations (e.g. occupancy limits, chart p.2 notes)?'
      kind: law
      answer: Yes. Column 2's uses are subject to the rest of §325-8 and to Article V, and every column is subject to
        Article V's supplementary regulations. Those are rules of their own.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 24
        lines: [16, 16]
        quote: subject to the further regulations in this section and of Article V
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.3
    notes: >-
      R-2C is the fifth mark in each row of page 2. Its marks, row by row against the chart reader's R-2C cells: •
      detached, semi-detached and two-family dwellings, church, park, library or fire station; SP zero-lot-line and
      attached one-family dwellings, cemetery, public utility, school, nursery school, adult day care home,
      neighborhood commercial facility; - multiple dwellings, fraternity houses, dormitories, nursing homes,
      hospitals, bed-and-breakfast inns. R-2C differs from R-2A and R-2B only in its two SP one-family rows.
    drafted_by: claude
    status: draft

  - id: R-2c.lot_area_one_family_detached
    kind: rule
    topic: dimensions
    title: "Lot size by occupants, one-family detached (chart p.3, note 4)"
    applies_when: use == "one_family_detached"
    check: lot_area >= 2500 + 500 * max(occupants - 1, 0)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [10, 10]
        quote: "One-family dwelling, detached 10,000 sf 6,000 sf 5,000 sf 3,000 sf 2,500 sf [fn4] 5,000 sf 5,000 sf 3,000 sf 10,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [48, 48]
        quote: "(3) See §325-8(B)(1)."
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [49, 49]
        quote: "(4) For the first occupant; +500 sf for each additional occupant."
      - file: chapter_325_zoning_2026-10.pdf     # "the first occupant": a detached house is one dwelling unit
        page: 7
        lines: [42, 42]
        quote: "(1) ONE-FAMILY DETACHED DWELLING — A building containing not more than one"
      - file: chapter_325_zoning_2026-10.pdf
        page: 16
        lines: [5, 6]
        quote: "OCCUPANT — In R-2c Zones only, a person that is permitted to occupy a dwelling unit or building in an R-2c Zone."
        not_limits: {2: "the district name R-2c, not a number"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 16
        lines: [7, 9]
        quote: "(1) For the purposes of determining the number of occupants for all provisions of this chapter, an occupant is defined as person that has the right to occupy a dwelling unit or building notwithstanding actual occupation."
    examples:
      # worked by hand from note 4: 2,500 sf for the first occupant, + 500 sf for each more
      - given: {use: one_family_detached, lot_area: 2500, occupants: 1}
        expect: pass
        note: one occupant -> 2,500 sf; at the limit
      - given: {use: one_family_detached, lot_area: 2499, occupants: 1}
        expect: fail
      - given: {use: one_family_detached, lot_area: 4000, occupants: 4}
        expect: pass
        note: four occupants -> 2,500 + 3 x 500 = 4,000 sf
      - given: {use: one_family_detached, lot_area: 3999, occupants: 4}
        expect: fail
      - given: {use: one_family_detached, lot_area: 2500, occupants: 0}
        expect: pass
        note: the base covers the first occupant whether or not anyone is counted yet
      - given: {use: one_family_detached, lot_area: 3000, occupants: 3}
        expect: fail
        note: R-2b's 3,000 sf holds two occupants in R-2c, not three (3,500 sf)
      - given: {use: one_family_detached, lot_area: 20000}
        expect: needs_review
        note: the occupants not given -> never a pass, however large the lot
      - given: {use: two_family, lot_area: 1000}
        expect: not_applicable
    findings:
    - id: occupants_as_defined
      question: Notes 4, 5 and 6 count "occupants". Is that the people living there, or the §325-3B definition?
      kind: law
      answer: >-
        The §325-3B definition, which is written for R-2c only and "for the purposes of determining the number of
        occupants for all provisions of this chapter": every person with the right to occupy (paying rent, a lessee,
        the owner's permission, or other evidence), whether or not they live there now. §325-3B OCCUPANT (2) ties the
        number permitted to the lot size.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 16
        lines: [7, 7]
        quote: For the purposes of determining the number of occupants for all provisions of this chapter
      - file: chapter_325_zoning_2026-10.pdf
        page: 16
        lines: [16, 17]
        quote: is based on the amount of habitable space in the dwelling unit or building and on the basis of lot size
      still_open: []
      strength: strong
    - id: note_4_remark_is_not_law_change
      question: 'Note 4 ends "(Could remove notes 1 - 6, if a single standard is created for these uses.)". Does that
        remark suspend notes 4 to 6?'
      kind: reading
      answer: No. It is a drafting remark printed in the chart ("could", "if"), not an amendment; notes 4 to 6 are part
        of the chart as adopted and are applied as printed.
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [49, 49]
        quote: (Could remove notes 1 - 6, if a single standard is created for these uses.)
        not_limits: {1: "notes 1 - 6: the chart's own note numbers, not a limit", 6: "notes 1 - 6: the chart's own note numbers, not a limit"}
      strength: strong
      confirm_with: the City zoning office
    notes: >-
      Note 4 in full, encoded like R-3a's note 7 (a row may not say complies while a note's additions are left out):
      2,500 sf for the first occupant + 500 sf for each further occupant. The architect states the occupants
      (occupants: §325-3B OCCUPANT, every person with the right to occupy); not given, the row needs review, never a
      pass (and the checker says it does not comply when the lot is under 2,500 sf, whatever the occupants). The fifth
      value of the row is R-2C's ("2,500 sf [fn4]"). Chart note 3: the minimum applies to each main building.
    drafted_by: claude
    status: draft

  - id: R-2c.lot_area_zero_lot_line
    kind: rule
    topic: dimensions
    title: "Lot size by occupants, one-family detached zero lot line (chart p.3, note 4)"
    applies_when: use == "one_family_detached_zero_lot_line"
    check: lot_area >= 2500 + 500 * max(occupants - 1, 0)
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, detached, zero lot line", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [11, 11]
        quote: "One-family dwelling, detached, zero lot line - - - - 2,500 sf [fn4] - - - -"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [49, 49]
        quote: "(4) For the first occupant; +500 sf for each additional occupant."
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [4, 5]
        quote: "(2) ONE-FAMILY DETACHED DWELLING, ZERO LOT LINE — A building containing not more than one dwelling unit"
    examples:
      - given: {use: one_family_detached_zero_lot_line, lot_area: 2500, occupants: 1}
        expect: pass
      - given: {use: one_family_detached_zero_lot_line, lot_area: 2499, occupants: 1}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, lot_area: 3500, occupants: 3}
        expect: pass
        note: three occupants -> 2,500 + 2 x 500 = 3,500 sf
      - given: {use: one_family_detached_zero_lot_line, lot_area: 3499, occupants: 3}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, lot_area: 20000}
        expect: needs_review
      - given: {use: one_family_detached, lot_area: 1000, occupants: 1}
        expect: not_applicable
    notes: >-
      R-2C is the only column with a number in this row (every other district is "-"), so unlike R-3a there is no open
      question about the zero-lot-line lot size here. The use itself needs a special permit (R-2c.use).
    drafted_by: claude
    status: draft

  - id: R-2c.lot_area_one_family_semi_detached
    kind: rule
    topic: dimensions
    title: "Lot size by units and occupants, semi-detached (chart p.3, note 5)"
    applies_when: use == "one_family_semi_detached"
    check: >-
      lot_area >= 2000 * max(dwelling_units, 1) + 400 * max(occupants - 1, 0)
      or lot_area >= 2000 * max(dwelling_units, 1) + 400 * max(occupants - max(dwelling_units, 1), 0)
      and lot_area >= 2000 * max(dwelling_units, 1) + 400 * (max(occupants - 1, 0)
      if occupants_most_in_one_unit >= occupants else max(occupants - max(dwelling_units, 1), 0))
    review_when:
      - when: dwelling_units > 2 and lot_area >= 2000 + 400 * max(occupants - 1, 0)
        reason: >-
          A semi-detached building holds at most two dwelling units (§325-3B); the count stated is more. Check it;
          the lot is enough for one unit with these occupants, the least a semi-detached lot holds.
      - when: dwelling_units == 0 and lot_area >= 2000 + 400 * max(occupants - 1, 0)
        reason: >-
          No dwelling unit stated: a semi-detached lot holds at least one unit (its half of the building) and at most
          two (the whole building). Check the count; the lot is held to one unit's least until then.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, semi-detached", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [12, 12]
        quote: "One-family dwelling, semi-detached - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [50, 50]
        quote: "(5) For the first occupant in each dwelling unit; +400 sf for each additional occupant in each dwelling unit."
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [7, 8]
        quote: "(3) ONE-FAMILY SEMIDETACHED DWELLING — A building containing not more than two one-family dwellings, each of which shares a party wall or other common structural elements"
      - file: chapter_325_zoning_2026-10.pdf     # a dwelling unit is one household's quarters: its first occupant is one
        page: 9
        lines: [10, 10]
        quote: "DWELLING UNIT — One or more rooms designed or used for living quarters by one household"
    examples:
      # worked by hand from note 5 (2,000 sf for the first occupant of each dwelling unit, + 400 sf for each more in
      # that unit). Gordium isn't told the split: it passes only if the lot is enough with every occupant in one
      # unit (the fullest split), fails only if it is short even with them spread one to each unit first
      - given: {use: one_family_semi_detached, lot_area: 2000, dwelling_units: 1, occupants: 1}
        expect: pass
        note: one half of the building on its own lot (split along the party wall), one occupant -> 2,000 sf
      - given: {use: one_family_semi_detached, lot_area: 1999, dwelling_units: 1, occupants: 1}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 2800, dwelling_units: 1, occupants: 3}
        expect: pass
        note: one unit, three occupants -> 2,000 + 2 x 400 = 2,800 sf (one unit, so no split to choose)
      - given: {use: one_family_semi_detached, lot_area: 2799, dwelling_units: 1, occupants: 3}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 4400, dwelling_units: 2, occupants: 2}
        expect: pass
        note: the whole building on one lot, two occupants -> 4,000 sf one in each unit, 4,400 sf both in one; passes both
      - given: {use: one_family_semi_detached, lot_area: 4399, dwelling_units: 2, occupants: 2}
        expect: needs_review
        note: enough one to each unit, not both in one
      - given: {use: one_family_semi_detached, lot_area: 4000, dwelling_units: 2, occupants: 2}
        expect: needs_review
        note: exactly enough one to each unit (2 x 2,000)
      - given: {use: one_family_semi_detached, lot_area: 3999, dwelling_units: 2, occupants: 2}
        expect: fail
        note: under 4,000 sf however the two are split
      - given: {use: one_family_semi_detached, lot_area: 6000, dwelling_units: 2, occupants: 6}
        expect: pass
        note: six occupants -> 4,000 + 4 x 400 = 5,600 sf spread 3 and 3; 4,000 + 5 x 400 = 6,000 sf all in one
      - given: {use: one_family_semi_detached, lot_area: 5999, dwelling_units: 2, occupants: 6}
        expect: needs_review
      - given: {use: one_family_semi_detached, lot_area: 5600, dwelling_units: 2, occupants: 6}
        expect: needs_review
      - given: {use: one_family_semi_detached, lot_area: 5599, dwelling_units: 2, occupants: 6}
        expect: fail
      # with the most occupants in one unit stated, the split of two units is known: exact
      - given: {use: one_family_semi_detached, lot_area: 4000, dwelling_units: 2, occupants: 2, occupants_most_in_one_unit: 1}
        expect: pass
        note: one occupant in each unit -> 2 x 2,000 = 4,000 sf
      - given: {use: one_family_semi_detached, lot_area: 3999, dwelling_units: 2, occupants: 2, occupants_most_in_one_unit: 1}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 4400, dwelling_units: 2, occupants: 2, occupants_most_in_one_unit: 2}
        expect: pass
        note: both in one unit, the other empty -> 4,000 + 400 = 4,400 sf
      - given: {use: one_family_semi_detached, lot_area: 4399, dwelling_units: 2, occupants: 2, occupants_most_in_one_unit: 2}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 5600, dwelling_units: 2, occupants: 6, occupants_most_in_one_unit: 4}
        expect: pass
        note: 4 and 2 -> 4,000 + 3 x 400 + 1 x 400 = 5,600 sf (any split with both units lived in gives the same)
      - given: {use: one_family_semi_detached, lot_area: 5599, dwelling_units: 2, occupants: 6, occupants_most_in_one_unit: 4}
        expect: fail
      - given: {use: one_family_semi_detached, lot_area: 2800, dwelling_units: 1, occupants: 3, occupants_most_in_one_unit: 3}
        expect: pass
        note: one unit, so the same as without it
      - given: {use: one_family_semi_detached, lot_area: 20000, dwelling_units: 3, occupants: 3}
        expect: needs_review
        note: three units isn't a semi-detached building (two at most)
      - given: {use: one_family_semi_detached, lot_area: 2400, dwelling_units: 3, occupants: 2}
        expect: needs_review
        note: three units can't be; enough for one unit with two occupants (2,000 + 400)
      - given: {use: one_family_semi_detached, lot_area: 2399, dwelling_units: 3, occupants: 2}
        expect: fail
        note: short even for one unit with two occupants, so for any count
      - given: {use: one_family_semi_detached, lot_area: 1999, dwelling_units: 0, occupants: 0}
        expect: fail
        note: no units stated, but under one unit's 2,000 sf whatever the count
      - given: {use: one_family_semi_detached, lot_area: 2000, dwelling_units: 0, occupants: 0}
        expect: needs_review
        note: no units stated -> never a pass (a semi-detached lot holds one or two units)
      - given: {use: one_family_semi_detached, lot_area: 20000, dwelling_units: 2}
        expect: needs_review
        note: the occupants not given
      - given: {use: one_family_semi_detached, lot_area: 20000, occupants: 2}
        expect: needs_review
        note: the dwelling units on the lot not given
      - given: {use: two_family, lot_area: 1000, occupants: 2}
        expect: not_applicable
    findings:
    - id: per_dwelling_unit
      question: 'Notes 5 and 6 give the base figure "For the first occupant in each dwelling unit". Is the 2,000 sf
        (1,500 sf for attached) needed once per lot, or once for each dwelling unit?'
      kind: reading
      answer: Once for each dwelling unit, since the base is stated for the first occupant "in each dwelling unit" (note
        4, for one-unit houses, says only "the first occupant"). It also keeps the notes consistent with each other
        (a semi-detached building split along its party wall onto two lots, note 15's "attached sides", needs 2,000 sf
        on each lot, 4,000 sf in all, the same as the building whole on one lot) and with R-2c's other figures (a
        once-per-lot reading would let an attached building of six units stand on 1,500 sf). The other reading is
        less strict, so this one never passes a lot it would fail.
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [50, 50]
        quote: (5) For the first occupant in each dwelling unit
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [49, 49]
        quote: (4) For the first occupant;
      still_open: []
      strength: strong
      confirm_with: the City zoning office
    notes: >-
      Note 5 in full: 2,000 sf for each dwelling unit on the lot (its first occupant) + 400 sf for each further
      occupant in each unit. The architect states the dwelling units on this lot and the occupants of all of them
      together (dwelling_units, occupants). Without the split the rule takes both ends: it complies if the lot is
      enough with every occupant in one unit (2,000 x units + 400 x (occupants − 1)), does not comply if it is short
      with them spread one to each unit first (2,000 x units + 400 x (occupants − units)), and needs review between.
      The architect may also state the most occupants in any one unit (occupants_most_in_one_unit, asked only when
      it would change the row): with at most two units that settles it, since the requirement depends only on whether
      one unit holds everyone (an empty second unit) or both units are lived in. A semi-detached building split along its party wall (note 15's "attached sides") is checked lot by
      lot: its lot holds one unit. The per-unit base is Gordium's reading (per_dwelling_unit).
    drafted_by: claude
    status: draft

  - id: R-2c.lot_area_two_family
    kind: rule
    topic: dimensions
    title: "Lot size by occupants, two-family dwelling (chart p.3, note 5)"
    applies_when: use == "two_family"
    check: >-
      lot_area >= 2 * 2000 + 400 * max(occupants - 1, 0)
      or lot_area >= 2 * 2000 + 400 * max(occupants - 2, 0)
      and lot_area >= 2 * 2000 + 400 * (max(occupants - 1, 0) if occupants_most_in_one_unit >= occupants
      else max(occupants - 2, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "Two-family dwelling", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [15, 15]
        quote: "Two-family dwelling - - 5,000 sf 3,000 sf 2,000 sf [fn5] 5,000 sf 5,000 sf 3,000 sf 15,000 sf"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [50, 50]
        quote: "(5) For the first occupant in each dwelling unit; +400 sf for each additional occupant in each dwelling unit."
      - file: chapter_325_zoning_2026-10.pdf
        page: 9
        lines: [3, 3]
        quote: "DWELLING, TWO-FAMILY — A building containing two dwelling units occupied exclusively for"
      - file: chapter_325_zoning_2026-10.pdf     # a dwelling unit is one household's quarters: its first occupant is one
        page: 9
        lines: [10, 10]
        quote: "DWELLING UNIT — One or more rooms designed or used for living quarters by one household"
    examples:
      # worked by hand from note 5 and the per_dwelling_unit reading: 2 x 2,000 sf, + 400 sf for each occupant past
      # the first in each unit; passes only with every occupant in one unit, fails only if short spread one per unit
      - given: {use: two_family, lot_area: 4000, occupants: 1}
        expect: pass
        note: one occupant -> 2 x 2,000 = 4,000 sf however it is split; at the limit
      - given: {use: two_family, lot_area: 3999, occupants: 1}
        expect: fail
      - given: {use: two_family, lot_area: 4400, occupants: 2}
        expect: pass
        note: two occupants -> 4,000 sf one in each unit, 4,400 sf both in one
      - given: {use: two_family, lot_area: 4399, occupants: 2}
        expect: needs_review
      - given: {use: two_family, lot_area: 4000, occupants: 2}
        expect: needs_review
        note: exactly enough one to each unit
      - given: {use: two_family, lot_area: 3999, occupants: 2}
        expect: fail
      - given: {use: two_family, lot_area: 5600, occupants: 5}
        expect: pass
        note: five occupants -> 4,000 + 3 x 400 = 5,200 sf spread, 4,000 + 4 x 400 = 5,600 sf all in one
      - given: {use: two_family, lot_area: 5599, occupants: 5}
        expect: needs_review
      - given: {use: two_family, lot_area: 5200, occupants: 5}
        expect: needs_review
      - given: {use: two_family, lot_area: 5199, occupants: 5}
        expect: fail
      - given: {use: two_family, lot_area: 3000, occupants: 2}
        expect: fail
        note: R-2b's 3,000 sf is not enough; under the once-per-lot reading 2,000 sf would be (per_dwelling_unit)
      # with the most occupants in one unit stated: exact
      - given: {use: two_family, lot_area: 4000, occupants: 2, occupants_most_in_one_unit: 1}
        expect: pass
        note: the ordinary case, one occupant in each unit -> 4,000 sf
      - given: {use: two_family, lot_area: 3999, occupants: 2, occupants_most_in_one_unit: 1}
        expect: fail
      - given: {use: two_family, lot_area: 4400, occupants: 2, occupants_most_in_one_unit: 2}
        expect: pass
        note: both in one unit, the other empty -> 4,400 sf
      - given: {use: two_family, lot_area: 4399, occupants: 2, occupants_most_in_one_unit: 2}
        expect: fail
      - given: {use: two_family, lot_area: 5200, occupants: 5, occupants_most_in_one_unit: 3}
        expect: pass
        note: 3 and 2 -> 4,000 + 2 x 400 + 1 x 400 = 5,200 sf
      - given: {use: two_family, lot_area: 5199, occupants: 5, occupants_most_in_one_unit: 3}
        expect: fail
      - given: {use: two_family, lot_area: 5600, occupants: 5, occupants_most_in_one_unit: 5}
        expect: pass
        note: all five in one unit -> 4,000 + 4 x 400 = 5,600 sf
      - given: {use: two_family, lot_area: 5599, occupants: 5, occupants_most_in_one_unit: 5}
        expect: fail
      - given: {use: two_family, lot_area: 20000}
        expect: needs_review
        note: the occupants not given
      - given: {use: one_family_detached, lot_area: 1000, occupants: 1}
        expect: not_applicable
    notes: >-
      A two-family dwelling is two dwelling units (§325-3B), so the base is 2 x 2,000 sf (the per_dwelling_unit
      reading, R-2c.lot_area_one_family_semi_detached), + 400 sf for each occupant past each unit's first. The
      occupants are stated for both units together, so without the split the rule takes both ends, as the
      semi-detached rule does; with the most occupants in one unit stated it is exact (fewer than all of them: both
      units are lived in, 4,000 + 400 x (occupants − 2); all of them: one unit empty, 4,000 + 400 x (occupants − 1)).
    drafted_by: claude
    status: draft

  - id: R-2c.lot_area_one_family_attached
    kind: rule
    topic: dimensions
    title: "Lot size by units and occupants, one-family attached (chart p.3, note 6)"
    applies_when: use == "one_family_attached"
    # Each open reading, written alone (the generative test in test_r2c_lot_size_readings.py works every one out unit
    # by unit, and a hand table there checks both against the law's boundary cases; this row is their every-reading
    # combination):
    #   own lot, the least:      1500 * max(units here, 1) + 300 per occupant past one to each unit + 200 per
    #                            occupant past five a unit (note 6's 500 instead of the 300)
    #   building's lot, the most: 1500 * max(units here, units in the building, 3) + 300 per occupant past the first,
    #                            all in one unit, + 500 per occupant past five on top; only when this lot's units are
    #                            exactly the building's (fewer: the rest of the building and its occupants are on
    #                            other lots; more: part of another building may be here, or a count is off)
    # Complies only if the most passes (every reading passes); does not comply only if the least fails (every
    # reading fails); else NEEDS REVIEW.
    check: >-
      lot_area >= 1500 * max(dwelling_units, 1) + 300 * max(occupants - max(dwelling_units, 1), 0)
      + (500 - 300) * max(occupants - 5 * max(dwelling_units, 1), 0)
      and dwelling_units == attached_units_in_building
      and lot_area >= 1500 * max(dwelling_units, attached_units_in_building, 3) + 300 * max(occupants - 1, 0)
      + 500 * max(occupants - 5, 0)
    review_when:
      - when: >-
          dwelling_units > attached_units_in_building
          and lot_area >= 1500 * max(dwelling_units, 1) + 300 * max(occupants - max(dwelling_units, 1), 0)
          + (500 - 300) * max(occupants - 5 * max(dwelling_units, 1), 0)
        reason: >-
          More units on this lot than in the attached building stated: part of another building may be here, or a
          count is off. Check the units on this lot and in the building.
      - when: >-
          lot_area >= 1500 * max(dwelling_units, 1) + 300 * max(occupants - max(dwelling_units, 1), 0)
          + (500 - 300) * max(occupants - 5 * max(dwelling_units, 1), 0)
          and (dwelling_units < attached_units_in_building
          or lot_area < 1500 * max(dwelling_units, attached_units_in_building, 3) + 300 * max(occupants - 1, 0)
          + 500 * max(occupants - 5, 0))
        reason: >-
          Enough on some readings, not all: whether the lot must hold the whole attached building or only its own row
          house's units (and, if the building runs onto other lots, their occupants aren't stated), how the
          occupants are split (all in one unit is the most), and whether note 6's 500 sf past five occupants in a unit
          replaces the 300 sf or comes on top (this rule's open questions). Worked out by hand.
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, by conversion", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Minimum Lot Size [fn3]", row: "One-family dwelling, attached, new construction", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [13, 13]
        quote: "One-family dwelling, attached, by conversion - - - - 1,500 sf [fn6] 7,000 sf [fn7] 7,000 sf [fn7] 4,000 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [14, 14]
        quote: "One-family dwelling, attached, new construction - - - - 1,500 sf [fn6] 6,000 sf [fn7] 6,000 sf [fn7] 3,500 sf [fn8] 16,500 sf [fn9]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [51, 52]
        quote: "(6) For the first occupant in each dwelling unit; +300 sf for each additional occupant in each dwelling unit; +500 sf for each additional occupant in each dwelling unit in excess of five occupants."
      - file: chapter_325_zoning_2026-10.pdf     # a dwelling unit is one household's quarters: its first occupant is one
        page: 9
        lines: [10, 10]
        quote: "DWELLING UNIT — One or more rooms designed or used for living quarters by one household"
      - file: chapter_325_zoning_2026-10.pdf     # the building_lot reading: the whole building, at least three units
        page: 8
        lines: [11, 11]
        quote: "(4) ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family"
    examples:
      # worked by hand from note 6 (1,500 sf for each unit, its first occupant; + 300 sf for each further occupant in
      # a unit; + 500 sf for each occupant past five in a unit) under every open reading. Complies only if enough
      # on the building's lot (at least three units), every occupant in one unit, the 500 sf on top of the 300 sf;
      # does not comply only if short on the row house's own lot (its units, at least one), the occupants spread one
      # to each unit first, the 500 sf instead of the 300 sf; NEEDS REVIEW between
      - given: {use: one_family_attached, lot_area: 4500, dwelling_units: 1, occupants: 1, attached_units_in_building: 6}
        expect: needs_review
        note: round 4's case; one unit of a six-unit building -> its own lot 1,500 sf, the building's lot 9,000 sf
          plus the other five units' occupants, which aren't stated
      - given: {use: one_family_attached, lot_area: 6000, dwelling_units: 4, occupants: 1, attached_units_in_building: 3}
        expect: needs_review
        note: round 5's case; four units here, three in the building -> part of another building, or a count is off
      - given: {use: one_family_attached, lot_area: 5999, dwelling_units: 4, occupants: 1, attached_units_in_building: 3}
        expect: fail
        note: short even for its own four units (4 x 1,500 = 6,000 sf)
      - given: {use: one_family_attached, lot_area: 50000, dwelling_units: 1, occupants: 1, attached_units_in_building: 3}
        expect: needs_review
        note: one unit of three on this lot -> never a pass, however large, under the building's-lot reading
      - given: {use: one_family_attached, lot_area: 4499, dwelling_units: 1, occupants: 1}
        expect: needs_review
        note: enough for its own unit (1,500 sf); the building's units not given
      - given: {use: one_family_attached, lot_area: 2000, dwelling_units: 1, occupants: 1, attached_units_in_building: 3}
        expect: needs_review
        note: round 2's row house on its own 2,000 sf lot -> complies on its own lot, not as the building's lot
      - given: {use: one_family_attached, lot_area: 1500, dwelling_units: 1, occupants: 1}
        expect: needs_review
        note: exactly one unit's 1,500 sf
      - given: {use: one_family_attached, lot_area: 1499, dwelling_units: 1, occupants: 1}
        expect: fail
        note: short even for its own unit
      - given: {use: one_family_attached, lot_area: 2100, dwelling_units: 1, occupants: 3}
        expect: needs_review
        note: its own unit, three occupants -> 1,500 + 2 x 300 = 2,100 sf
      - given: {use: one_family_attached, lot_area: 2099, dwelling_units: 1, occupants: 3}
        expect: fail
      - given: {use: one_family_attached, lot_area: 3700, dwelling_units: 1, occupants: 7}
        expect: needs_review
        note: its own unit, the 500 sf instead of the 300 sf -> 1,500 + 4 x 300 + 2 x 500 = 3,700 sf
      - given: {use: one_family_attached, lot_area: 3699, dwelling_units: 1, occupants: 7}
        expect: fail
        note: short under every reading
      - given: {use: one_family_attached, lot_area: 4500, dwelling_units: 3, occupants: 1, attached_units_in_building: 3}
        expect: pass
        note: the whole building of three units on one lot, one occupant -> 4,500 sf (both lot readings agree)
      - given: {use: one_family_attached, lot_area: 4499, dwelling_units: 3, occupants: 1}
        expect: fail
      - given: {use: one_family_attached, lot_area: 5100, dwelling_units: 3, occupants: 3, attached_units_in_building: 3}
        expect: pass
        note: three occupants all in one unit -> 4,500 + 2 x 300 = 5,100 sf
      - given: {use: one_family_attached, lot_area: 5099, dwelling_units: 3, occupants: 3}
        expect: needs_review
      - given: {use: one_family_attached, lot_area: 4500, dwelling_units: 3, occupants: 3}
        expect: needs_review
        note: exactly enough one to each unit
      - given: {use: one_family_attached, lot_area: 7300, dwelling_units: 3, occupants: 7, attached_units_in_building: 3}
        expect: pass
      - given: {use: one_family_attached, lot_area: 5700, dwelling_units: 3, occupants: 7}
        expect: needs_review
        note: exactly enough spread one to each unit first (4,500 + 4 x 300); no unit past five
      - given: {use: one_family_attached, lot_area: 5699, dwelling_units: 3, occupants: 7}
        expect: fail
      - given: {use: one_family_attached, lot_area: 11000, dwelling_units: 6, occupants: 6, attached_units_in_building: 6}
        expect: pass
        note: the whole six-unit building on one lot; all six occupants in one unit -> 9,000 + 5 x 300 + 500 = 11,000 sf
      - given: {use: one_family_attached, lot_area: 10999, dwelling_units: 6, occupants: 6, attached_units_in_building: 6}
        expect: needs_review
      - given: {use: one_family_attached, lot_area: 9000, dwelling_units: 6, occupants: 6}
        expect: needs_review
        note: one to each of six units -> 9,000 sf; all six in one -> 9,000 + 5 x 300 + 500 = 11,000 sf
      - given: {use: one_family_attached, lot_area: 8999, dwelling_units: 6, occupants: 6}
        expect: fail
      - given: {use: one_family_attached, lot_area: 1499, dwelling_units: 0, occupants: 0}
        expect: fail
        note: no units stated, but under one unit's 1,500 sf whatever the count
      - given: {use: one_family_attached, lot_area: 4500, dwelling_units: 0, occupants: 0, attached_units_in_building: 3}
        expect: needs_review
        note: no units stated -> never a pass (a lot holding none of the building's units can't hold the whole building)
      - given: {use: one_family_attached, lot_area: 20000, occupants: 3}
        expect: needs_review
        note: the units on this lot not given
      - given: {use: two_family, lot_area: 1000, occupants: 2}
        expect: not_applicable
    open_questions:
    - 'R-2c''s attached rows (1,500 sf per unit, note 6; 50 ft wide) don''t say whose lot they are for. Is each row
      house held to its own units on its own lot, or must the lot hold the whole attached building (three to six
      units, §325-3B)?'
    - 'Note 6: "+300 sf for each additional occupant in each dwelling unit; +500 sf for each additional occupant in each
      dwelling unit in excess of five occupants". For a unit with more than five occupants, does each occupant past
      five add 500 sf instead of 300 sf, or 500 sf on top of the 300 sf?'
    research:
    - question: 'R-2c''s attached rows (1,500 sf per unit, note 6; 50 ft wide) don''t say whose lot they are for. Is each
        row house held to its own units on its own lot, or must the lot hold the whole attached building (three to six
        units, §325-3B)?'
      searched:
      - 325-3B:lot
      - 325-3B:lot_building
      - 325-3B:one_family_attached_dwelling
      - 325-3B:one_family_semidetached_dwelling
      - 325-3B:row_house
      - 325-3B:townhouse
      - 325-8A
      - 325-8B
      - 325-11B
      - 325-45.2F
      - 325-45.2G
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [24, 24]
        quote: One-family dwelling, attached - - - - 50 ft 50 ft 50 ft 40 ft 125 ft
      - file: chapter_325_zoning_2026-10.pdf
        page: 149
        lines: [21, 22]
        quote: Side setback, minimum 1. Row house 0 feet
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [61, 62]
        quote: one-family attached dwelling (unattached sides only)
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [63, 63]
        quote: one-family semi-detached dwellings with attached sides
      - file: chapter_325_zoning_2026-10.pdf
        page: 18
        lines: [15, 15]
        quote: the facade of each module measuring no more than 25 feet in length
      - file: chapter_325_zoning_2026-10.pdf
        page: 26
        lines: [12, 13]
        quote: each square-footage requirement applies separately to the initial permitted primary use and to each additional permitted primary use located in a separate building
      - file: chapter_325_zoning_2026-10.pdf
        page: 14
        lines: [34, 35]
        quote: occupied by a building or a group of buildings that are united by a common interest or use
      why_open: 'The code points both ways, more strongly to the building''s lot. For the building''s lot: R-2C''s
        attached lot width is 50 ft, which a single row-house lot can''t meet (a row-house module''s facade is at most 25
        ft, §325-3B ROW HOUSE); note 15 gives the semi-detached house 0 ft on its "attached sides" but gives the attached
        house no such figure, as if its units don''t sit on lot lines; §325-8B(1) applies a lot-size figure to each
        primary building on the property; and where the code means row houses to stand on lot lines it says so: the
        Collegetown form districts give "Row house 0 feet" side setback (§325-45.2, p.149), which R-2c''s chart doesn''t
        (that lets a row house stand on its side lot lines; it doesn''t by itself say each has its own lot). For each row house''s own lot: note 14 limits the attached house''s 10 ft
        side yard to its "unattached sides only", as if its other sides were lot lines. Chapter 290 (subdivision) isn''t
        among our documents, and no City record or zoning board decision was found (web search, 2026-10-21). So
        Gordium complies only if both readings pass, fails only if both fail, and needs review between.'
      readings:
      - id: per_row_house_lot
        reading: each lot is held to its own units, at least one (1,500 sf x max(this lot's units, 1) + the occupants)
      - id: building_lot
        reading: the lot holds the whole attached building (1,500 sf x the building's units, at least three, + all its
          occupants); it can pass only when this lot's units are exactly the building's (fewer, and the rest and their
          occupants are on other lots; more, and part of another building may be here)
    - question: 'Note 6: "+300 sf for each additional occupant in each dwelling unit; +500 sf for each additional occupant
        in each dwelling unit in excess of five occupants". For a unit with more than five occupants, does each
        occupant past five add 500 sf instead of 300 sf, or 500 sf on top of the 300 sf?'
      searched:
      - 325-3B:occupant
      - 325-3B:one_family_attached_dwelling
      - 325-8A
      - 325-8B
      sources:
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [51, 52]
        quote: +500 sf for each additional occupant in each dwelling unit in excess of five occupants
        not_limits: {500: "the figure the question is about"}
      why_open: The note lists both additions with "+" and no "instead"; every occupant past five is also "each
        additional occupant", so the 300 sf can be read to apply to them too. Neither §325-8 nor the OCCUPANT
        definition says which, and no City record was found (web search, 2026-10-21, found no City interpretation of
        R-2c's notes). Gordium passes only under the stricter reading (500 sf on top) and fails only under the
        lenient one (500 sf instead), so the answer can only settle some NEEDS REVIEW results.
      readings:
      - id: instead_of_300
        reading: each occupant past five in a unit adds 500 sf instead of 300 sf
      - id: on_top_of_300
        reading: each occupant past five in a unit adds 300 sf + 500 sf = 800 sf
    notes: >-
      Both attached rows (by conversion, new construction) are 1,500 sf for R-2C, so conversion doesn't matter here.
      Note 6 is per dwelling unit (the per_dwelling_unit reading, R-2c.lot_area_one_family_semi_detached). Three
      things aren't known and every one is taken both ways: whose lot the figure is for (this rule's first open
      question: the row house's own lot with its own units, or the building's lot with at least three), how the
      stated occupants are split between units, and how note 6's 500 sf adds (the second). The 3 to 6 units of an
      attached building count the whole building: R-2c.attached_units_per_building. The use needs a special permit
      (R-2c.use).
    drafted_by: claude
    status: draft

  - id: R-2c.attached_units_per_building
    kind: rule
    topic: dimensions
    title: "Attached building: three to six dwelling units (§325-3B)"
    applies_when: use == "one_family_attached"
    check: attached_units_in_building >= 3 and attached_units_in_building <= 6
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 8
        lines: [11, 14]
        quote: "(4) ONE-FAMILY ATTACHED DWELLING — A building containing three or more one-family dwellings, each of which shares one or more party walls or structural elements with the other one-family dwellings in the building and which has direct exterior access from the ground floor. A maximum of six one-family dwelling units may be attached to form a single building."
        not_limits: {1: "\"one or more party walls\": how the units are joined, not a count of units"}
    examples:
      - given: {use: one_family_attached, attached_units_in_building: 3}
        expect: pass
        note: the fewest
      - given: {use: one_family_attached, attached_units_in_building: 6}
        expect: pass
        note: the most
      - given: {use: one_family_attached, attached_units_in_building: 2}
        expect: fail
        note: two units joined are a semi-detached building, not an attached one
      - given: {use: one_family_attached, attached_units_in_building: 7}
        expect: fail
      - given: {use: one_family_attached}
        expect: needs_review
        note: the building's units not given
      - given: {use: two_family, attached_units_in_building: 2}
        expect: not_applicable
    notes: >-
      Counted over the whole building, every lot it stands on together (attached_units_in_building), not the units on
      this lot (dwelling_units): a row house on its own lot is one unit of a building of three to six. Gordium's
      massing model shows the building on this lot only, so the architect states the count.
    drafted_by: claude
    status: draft

