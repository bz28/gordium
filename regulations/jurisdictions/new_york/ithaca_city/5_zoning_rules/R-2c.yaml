      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [42, 43]
        quote: "Rear (minimum, % of depth or feet, 25%/ 25%/ 25%/ 25%/ 25%/ 20%/ 25%/ 20%/ 25% / whichever is less) 50 ft [fn16] 50 ft [fn16]"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [24, 26]
        quote: "If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
        not_limits: {2: "the two side lot lines: how lot depth is measured (measures.yaml lot_depth), not a limit"}
    examples:
      - given: {rear_yard: 25, lot_depth: 100}
        expect: pass
        note: exactly 25% of 100
      - given: {rear_yard: 24.99, lot_depth: 100}
        expect: fail
      - given: {rear_yard: 50, lot_depth: 240}
        expect: pass
        note: 25% would be 60 ft; the chart caps it at 50 ft
      - given: {rear_yard: 49.99, lot_depth: 240}
        expect: fail
      - given: {rear_yard: 20, lot_depth: 60}
        expect: pass
        note: 25% would be 15 ft; note 16 sets the floor at 20 ft
      - given: {rear_yard: 19.99, lot_depth: 60}
        expect: fail
    notes: >-
      R-2C's cell is "25%/ 50 ft [fn16]", the fifth value (R-3A's 20% is the sixth). Lot depth is the average of the
      two side lot lines if they differ (§325-8A(14)(a)).
    open_questions:
    - 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the Zoning
      Administrator''s perpendicular method, and one detail of it is still open.'
    research:
    - question: 'Which lines are the side lot lines on a lot with more than four sides? See lot_depth: Gordium uses the
        Zoning Administrator''s perpendicular method, and one detail of it is still open.'
      searched:
      - 325-8A
      - 325-3B:yard
      - 325-3B:rear_yard
      sources:
      - rank: 2
        cite: 'Zoning Administrator''s affidavit (2019) and staff memo to the BZA, Appeal #3202, 815 S. Aurora St (a
          five-sided lot), 2019-2022'
        url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_02012022-2446
        quote: side lot lines should be drawn at a 90-degree angle perpendicular to the front lot line to determine
          the average lot depth
      why_open: It depends on the lot_depth question that is still open; see its research.
      report: docs/research/2026-10-20_architect_questions.md §1.2
    drafted_by: claude
    status: draft

  - id: R-2c.yard_projections
    kind: rule
    topic: dimensions
    title: "Eaves into required yards, at most 2 ft (§325-18B)"
    check: >-
      front_yard_eaves >= 10 + max(building_height - 35, 0) - 2
      and side_yard_larger_eaves >= (15 if use == "one_family_detached_zero_lot_line" else 10)
      + max(building_height - 35, 0) - 2
      and side_yard_smaller_eaves >= (10 if use in ["one_family_detached_zero_lot_line", "one_family_semi_detached",
      "one_family_attached"] else 5) + max(building_height - 35, 0) - 2
      and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0) - 2
    review_when:
      - when: >-
          use in ["one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
          and front_yard_eaves >= 10 + max(building_height - 35, 0)-2
          and side_yard_larger_eaves >= (15 if use == "one_family_detached_zero_lot_line" else 10)
          + max(building_height - 35, 0)-2
          and side_yard_smaller_eaves >= max(building_height - 35 - 2, 0)
          and side_yard_smaller_eaves < 10 + max(building_height - 35, 0)-2
          and rear_yard_eaves >= max(min(0.25 * lot_depth, 50), 20) + max(building_height - 35, 0)-2
        reason: >-
          The narrower side of a zero-lot-line, semi-detached or attached building may be its 0 ft side (note 15),
          where an eave may reach the lot line but not cross it; or it may need 10 ft, less the 2 ft an eave may
          project (R-2c.side_yards). Gordium can't tell which side that is.
    sources:
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-2C}
      - file: chapter_325_zoning_2026-10.pdf
        page: 49
        lines: [13, 16]
        quote: "B. Projecting architectural features. The space in any required yard shall be open and unobstructed except for ordinary projections of windowsills, belt courses, cornices, eaves and other architectural features; provided, however, that such features shall not project more than two feet into any required yard."
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-2C}
    examples:
      # lot depth 100 ft -> rear yard 25 ft, its eaves 23 ft; building 30 ft tall unless said
      - given: {use: one_family_detached, front_yard_eaves: 12, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 48, lot_depth: 100, building_height: 30}
        expect: pass
        note: eaves clear of every required yard
      - given: {use: one_family_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: pass
        note: eaves exactly 2 ft into every required yard (10, 5, 10, 25 ft)
      - given: {use: one_family_detached, front_yard_eaves: 7.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 2.99, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 22.99, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: pass
        note: with the bonus every required yard grows 3 ft, and an eave may reach 2 ft into each
      - given: {use: one_family_detached, front_yard_eaves: 10.99, side_yard_smaller_eaves: 6, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: fail
      # zero lot line: wide side 15 - 2 = 13
      - given: {use: one_family_detached_zero_lot_line, front_yard_eaves: 8, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 13, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: pass
      - given: {use: one_family_detached_zero_lot_line, front_yard_eaves: 8, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 12.99, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, front_yard_eaves: 8, side_yard_smaller_eaves: 0, side_yard_larger_eaves: 13, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: needs_review
      # semi-detached: the narrow side between the lot line (0) and 10 - 2 = 8 goes to review
      - given: {use: one_family_semi_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 8, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: pass
      - given: {use: one_family_semi_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 0, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: needs_review
        note: an eave at the lot line on what may be the attached side
      - given: {use: one_family_semi_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 7.99, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: needs_review
      - given: {use: one_family_semi_detached, front_yard_eaves: 7.99, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
        note: the front eave fails under every reading
      - given: {use: one_family_semi_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 7.99, rear_yard_eaves: 23, lot_depth: 100, building_height: 30}
        expect: fail
      - given: {use: one_family_semi_detached, front_yard_eaves: 8, side_yard_smaller_eaves: 3, side_yard_larger_eaves: 8, rear_yard_eaves: 22.99, lot_depth: 100, building_height: 30}
        expect: fail
      # semi-detached at 38 ft: every yard 3 ft larger; the zero side becomes 3 ft, an eave may reach 1 ft from the line
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 11, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: pass
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 1, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: needs_review
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 0.99, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: fail
        note: under 0 + 3 - 2 = 1 ft on any reading
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 10.99, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: needs_review
      - given: {use: one_family_semi_detached, front_yard_eaves: 10.99, side_yard_smaller_eaves: 5, side_yard_larger_eaves: 11, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: fail
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 5, side_yard_larger_eaves: 10.99, rear_yard_eaves: 26, lot_depth: 100, building_height: 38}
        expect: fail
      - given: {use: one_family_semi_detached, front_yard_eaves: 11, side_yard_smaller_eaves: 5, side_yard_larger_eaves: 11, rear_yard_eaves: 25.99, lot_depth: 100, building_height: 38}
        expect: fail
    notes: >-
      The yards themselves (R-2c.front_yard, side_yards, rear_yard) are measured to the nearest part of the building,
      its eaves left out; this rule measures the same yards to the outermost part, eaves included, and lets that be up
      to 2 ft less. On a side whose required yard is 0 ft, an eave may reach the lot line, never cross it. On a
      corner lot every yard facing a street is a front yard (§325-19C).
    drafted_by: claude
    status: draft

  - id: R-2c.accessory_buildings
    kind: rule
    topic: dimensions
    title: "Accessory buildings: not in the front yard; 3 ft side and rear (§325-25)"
    applies_when: accessory_buildings > 0
    check: >-
      accessory_front_yard >= 10
      and (not accessory_distances_apply or accessory_side_yard >= 3 and accessory_rear_yard >= 3)
    sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [34, 36]
        quote: "Accessory structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures, shall be exempt from side yard requirements contained in the District Regulations Chart in § 325-8[fn22] and shall be governed by the requirements below:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 66
        lines: [37, 40]
        quote: "A. Accessory structures wholly or partially above grade. Accessory structures which are wholly or partially above finished grade are permitted in any side or rear yard but not in a required front yard, except as permitted under the further provisions of this section. Corner lots shall be considered to have two front yards."
        not_limits: {2: "two front yards on a corner lot: which yards are front yards (the accessory front yard is measured to every street line), not a limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [6, 9]
        quote: "C. Frame accessory buildings. Frame accessory buildings may not be placed less than three feet from any side lot line or rear lot line in all districts, except in R-1 Districts, where accessory buildings may not be placed less than six feet from any side lot line nor less than three feet from any rear lot line, subject to further provisions of this section."
        not_limits: {1: "the district name R-1, not a number of feet", 6: "six feet applies in R-1 districts only; in R-2c it is three feet (accessory_side_yard >= 3)"}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [6, 6]
        quote: "R-1 R-2 R-3 [fn1]"
    examples:
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
        note: exactly 3 ft from the side and rear lot lines
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 2.99, accessory_rear_yard: 3}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 2.99}
        expect: fail
      - given: {accessory_buildings: 1, accessory_front_yard: 9.99, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: fail
        note: in the required front yard
      - given: {accessory_buildings: 1, accessory_front_yard: 10, accessory_distances_apply: true, accessory_side_yard: 3, accessory_rear_yard: 3}
        expect: pass
      - given: {accessory_buildings: 1, accessory_front_yard: 100, accessory_distances_apply: false, accessory_side_yard: 1, accessory_rear_yard: 1}
        expect: pass
        note: an accessory building that isn't frame, under the readings that give it no side or rear distance
      - given: {accessory_buildings: 0}
        expect: not_applicable
    notes: >-
      R-2c is not an R-1 District (the chart groups R-2A, R-2B and R-2C under "R-2"), so §325-25C's first sentence
      applies: frame accessory buildings 3 ft from any side or rear lot line. Whether the distances apply to an
      accessory building that isn't frame is §325-25C's open question (325-25C#1): accessory_distances_apply is
      measured under every reading, which gives NEEDS REVIEW until the architect says the building is frame.
    drafted_by: claude
    status: draft

  - id: R-2c.parking_one_family
    kind: rule
    topic: parking_and_loading
    title: "Minimum off-street parking, one-family detached (chart p.14)"
    applies_when: use == "one_family_detached"
    check: parking_spaces >= (1 if sleeping_rooms <= 3 else 2 + 1 * max(sleeping_rooms - 5, 0))
    sources:
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [9, 10]
        quote: "First three bed or sleeping rooms per dwelling 1 space per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [12, 12]
        quote: "4-5 bed or sleeping rooms per dwelling unit 2 spaces per dwelling unit"
      - file: zoning_charts_2026-04.pdf
        page: 14
        lines: [13, 13]
        quote: "Each additional bed or sleeping room + 1 space per room"
      - file: zoning_charts_2026-04.pdf
        page: 14
        cell: {section: Residential, row: First three bed or sleeping rooms per dwelling unit, column: R-2C}
    findings:
    - id: adu_needs_no_parking
      question: 'The requirement is per dwelling unit. R-2c allows an accessory dwelling unit (chart p.2): does a house
        with an ADU need parking for both units? (Not checked yet; ADUs aren''t measured.)'
      kind: law
      answer: 'No: an ADU needs no off-street parking (§325-28C(2)). The house''s own parking is unchanged.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 72
        lines: [9, 9]
        quote: There shall be no off-street parking requirement for an ADU
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §5.4
    examples:
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 1}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 3, parking_spaces: 0}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 2}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 5, parking_spaces: 1}
        expect: fail
      - given: {use: one_family_detached, sleeping_rooms: 7, parking_spaces: 4}
        expect: pass
      - given: {use: one_family_detached, sleeping_rooms: 7, parking_spaces: 3}
        expect: fail
      - given: {use: two_family, sleeping_rooms: 3, parking_spaces: 0}
        expect: not_applicable
    notes: The residential parking rows span every residential district's column, so the numbers are R-1b's.
    drafted_by: claude
    status: draft

  - id: R-2c.parking_dwelling_units
