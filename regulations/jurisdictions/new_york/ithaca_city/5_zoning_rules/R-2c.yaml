  - id: R-2c.height
    kind: rule
    topic: dimensions
    title: "Maximum building height, with the §325-16C bonus"
    check: >-
      building_height <= 35 or building_height <= 35 + 0.1 * 35
      and front_yard >= 10 + (building_height - 35)
      and side_yard_larger >= (15 if use == "one_family_detached_zero_lot_line" else 10) + (building_height - 35)
      and side_yard_smaller >= (10 if use in ["one_family_detached_zero_lot_line", "one_family_semi_detached",
      "one_family_attached"] else 5) + (building_height - 35)
      and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
    review_when:
      - when: >-
          use in ["one_family_detached_zero_lot_line", "one_family_semi_detached", "one_family_attached"]
          and building_height > 35 and building_height <= 35 + 0.1 * 35
          and front_yard >= 10 + (building_height - 35)
          and side_yard_larger >= (15 if use == "one_family_detached_zero_lot_line" else 10) + (building_height - 35)
          and side_yard_smaller >= 0 + (building_height - 35)
          and side_yard_smaller < 10 + (building_height - 35)
          and rear_yard >= max(min(0.25 * lot_depth, 50), 20) + (building_height - 35)
        reason: >-
          The narrower side yard of a zero-lot-line, semi-detached or attached building may be its 0 ft side (note
          15), which the bonus raises by the extra height, or need 10 ft plus it (R-2c.side_yards); Gordium can't
          tell which side that is. Complies under the strictest reading only at 10 ft plus the extra height.
    sources:
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, detached, zero lot line [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: "Maximum Building Height [fn10]", row: Height in feet, column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [31, 31]
        quote: "Height in feet 35 ft 35 ft 35 ft 35 ft 35 ft"
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [56, 56]
        quote: "(10) See §325-16."
      - file: zoning_charts_2026-04.pdf             # the yard minimums the bonus increases
        page: 3
        cell: {section: Yard Dimensions, row: Front (minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (one side minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: Side (other side minimum), column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Yard Dimensions, row: "Rear (minimum, % of depth or feet, whichever is less)", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [66, 66]
        quote: "(16) But not less than 20 ft."
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 7]
        quote: "In any district, any main building may be erected to a height in excess of that specified for the district, provided that:"
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 9]
        quote: "(1) Each required front, side and rear yard is increased one foot on the ground for each one foot of such additional height."
        not_limits: {1: "one foot per foot: the formula adds (building_height - 35) to each yard, one to one"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: "(3) In each district, the number of additional feet may not exceed 10% of the maximum building height allowed in that district."
    examples:
      # a detached house (the side minimums 10 ft and 5 ft); lot depth 100 ft -> rear 25 ft
      - given: {use: one_family_detached, building_height: 35, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 25, lot_depth: 100}
        expect: pass
        note: exactly at 35 ft with every yard at its minimum
      - given: {use: one_family_detached, building_height: 35.01, front_yard: 10, side_yard_smaller: 5, side_yard_larger: 10, rear_yard: 25, lot_depth: 100}
        expect: fail
      - given: {use: one_family_detached, building_height: 38.5, front_yard: 13.5, side_yard_smaller: 8.5, side_yard_larger: 13.5, rear_yard: 28.5, lot_depth: 100}
        expect: pass
        note: the most the bonus allows (10% of 35 = 3.5 ft), each yard 3.5 ft larger
      - given: {use: one_family_detached, building_height: 38.51, front_yard: 40, side_yard_smaller: 20, side_yard_larger: 20, rear_yard: 50, lot_depth: 100}
        expect: fail
      - given: {use: one_family_detached, building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: pass
        note: every yard exactly 2 ft past its minimum
      - given: {use: one_family_detached, building_height: 37, front_yard: 11.99, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: fail
      - given: {use: one_family_detached, building_height: 37, front_yard: 12, side_yard_smaller: 6.99, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: fail
      - given: {use: one_family_detached, building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 11.99, rear_yard: 27, lot_depth: 100}
        expect: fail
      - given: {use: one_family_detached, building_height: 37, front_yard: 12, side_yard_smaller: 7, side_yard_larger: 12, rear_yard: 26.99, lot_depth: 100}
        expect: fail
      # a zero-lot-line house: the wide side 15 ft (note 14); the narrow side 0 ft or 10 ft (note 15)
      - given: {use: one_family_detached_zero_lot_line, building_height: 37, front_yard: 12, side_yard_smaller: 12, side_yard_larger: 17, rear_yard: 27, lot_depth: 100}
        expect: pass
      - given: {use: one_family_detached_zero_lot_line, building_height: 37, front_yard: 12, side_yard_smaller: 12, side_yard_larger: 16.99, rear_yard: 27, lot_depth: 100}
        expect: fail
        note: the wide side must be 15 + 2 = 17
      - given: {use: one_family_detached_zero_lot_line, building_height: 37, front_yard: 12, side_yard_smaller: 2, side_yard_larger: 17, rear_yard: 27, lot_depth: 100}
        expect: needs_review
        note: 0 + 2 on its zero side, but 10 + 2 if that side abuts a non-zero-lot-line building or lot
      - given: {use: one_family_detached_zero_lot_line, building_height: 37, front_yard: 12, side_yard_smaller: 1.99, side_yard_larger: 17, rear_yard: 27, lot_depth: 100}
        expect: fail
      # a semi-detached house: the narrow side may be its attached side
      - given: {use: one_family_semi_detached, building_height: 35, front_yard: 10, side_yard_smaller: 0, side_yard_larger: 10, rear_yard: 25, lot_depth: 100}
        expect: pass
        note: at or under 35 ft the height complies (its side yards are R-2c.side_yards')
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 12, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: pass
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 2, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: needs_review
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 11.99, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: needs_review
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 1.99, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: fail
        note: under 0 + 2 on any reading
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 11.99, side_yard_smaller: 5, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: fail
        note: the front yard fails under every reading
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 5, side_yard_larger: 11.99, rear_yard: 27, lot_depth: 100}
        expect: fail
      - given: {use: one_family_semi_detached, building_height: 37, front_yard: 12, side_yard_smaller: 5, side_yard_larger: 12, rear_yard: 26.99, lot_depth: 100}
        expect: fail
      - given: {use: one_family_semi_detached, building_height: 38.51, front_yard: 40, side_yard_smaller: 5, side_yard_larger: 40, rear_yard: 50, lot_depth: 100}
        expect: fail
        note: past 38.5 ft under every reading
      - given: {use: one_family_attached, building_height: 37, front_yard: 12, side_yard_smaller: 5, side_yard_larger: 12, rear_yard: 27, lot_depth: 100}
        expect: needs_review
    open_questions:
    - '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height, or allowed
      on top of the bonus height too?'
    research:
    - question: '§325-16B: is an ornamental parapet or cornice (up to 5 ft above the limit) left out of building height,
        or allowed on top of the bonus height too?'
      searched:
      - 325-16
      - 325-16A
      - 325-16B
      - 325-16C
      - 325-3B:height_of_building
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [4, 4]
        quote: cornice for ornament
      why_open: §325-16B allows an ornamental parapet or cornice up to 5 ft above the height limit, but doesn't say
        whether that is the chart's limit or the bonus height §325-16C allows, or whether a parapet that guards a roof
        deck (not "for ornament") qualifies. No City record found. (The same question as R-1b.height's, since the words
        are the same in every district.)
      readings:
      - id: from_chart_limit
        reading: the 5 ft is measured from the chart's height limit (the stricter reading)
      - id: from_bonus_height
        reading: the 5 ft is measured from the bonus height §325-16C allows
      report: docs/research/2026-10-20_architect_questions.md §4.6
    findings:
    - id: height_bonus_every_yard
      question: '§325-16C(1): we read "each required ... yard is increased one foot ... for each one foot of such additional
        height" as: each yard must be at least its normal requirement plus the extra height (both side yards included).
        Confirm.'
      kind: law
      answer: 'Confirmed: every required front, side and rear yard grows one foot for each foot of extra height.'
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [8, 8]
        quote: Each required front, side and rear yard is increased one foot on the ground for each one foot
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    - id: height_bonus_main_building_only
      question: Does the bonus apply to accessory buildings too, or only the main building ("any main building")?
      kind: law
      answer: Only the main building ("any main building"). The number of stories still can't be exceeded, and the extra
        feet are at most 10% of the maximum building height.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [6, 6]
        quote: any main building may be erected to a height in excess of that
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [10, 10]
        quote: the number of stories permitted may not be exceeded
      - file: chapter_325_zoning_2026-10.pdf
        page: 47
        lines: [11, 12]
        quote: may not exceed 10% of the maximum building height
      still_open: []
      strength: strong
      report: docs/research/2026-10-20_architect_questions.md §4.5
    notes: >-
      Arithmetic for the bonus: 10% of 35 ft = 3.5 ft, so at most 38.5 ft, with every required yard 1 ft larger per
      extra foot. R-2C's yards depend on the use (R-2c.side_yards): front 10, rear 25% of the lot depth (50 ft cap,
      20 ft floor); the wide side 10 ft (15 ft for a zero-lot-line house); the narrow side 5 ft for a detached or
      two-family house or other use, and for a zero-lot-line, semi-detached or attached building 0 ft to 10 ft
      depending on the side, so those get NEEDS REVIEW between 0 and 10 ft plus the extra height.
    drafted_by: claude
    status: draft

  - id: R-2c.lot_coverage
    kind: rule
    topic: dimensions
    title: "Maximum lot coverage by buildings, by use (chart p.3, note 12)"
    check: >-
      building_area <= (0.4 if use in ["one_family_semi_detached", "two_family"]
      else 0.5 if use == "one_family_attached" else 0.35) * lot_area
    sources:
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, semi-detached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf             # a use this rule's figures depend on
        page: 2
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]", column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        cell: {section: Maximum lot coverage by buildings, row: Percent of lot area, column: R-2C}
      - file: zoning_charts_2026-04.pdf
        page: 3
        lines: [58, 59]
        quote: "(12) The first number applies to one-family detached dwellings, one-family detached zero lot line dwellings, and other uses; the second number applies to one-family semi- detached dwelling and two-family dwellings; and the third number applies to one-family attached dwellings."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [5, 7]
        quote: "On a lot hereafter used, no greater percentage of total lot area may be covered by principal and accessory buildings above ground."
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [7, 9]
        quote: "For this purpose, the area covered by principal and accessory buildings shall include all porches, attached or freestanding decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings."
        not_limits: {2: "what building_area counts (balconies projecting more than two feet): a measuring rule, not this formula's limit"}
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [9, 10]
        quote: "This sum, divided by the total lot area, shall not exceed the maximum allowed percentage of lot coverage specified in this column."
    open_questions:
    - 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey (lot), and
      whether roof eaves count (building_area). Garages count: see building_area''s findings.'
    research:
    - question: 'Coverage waits on two questions recorded with the definitions: what lot area to use without a survey
        (lot), and whether roof eaves count (building_area). Garages count: see building_area''s findings.'
      searched:
      - 325-8A
      - 325-3B:building_area
      - 325-3B:lot
      sources: []
      why_open: It depends on the lot and building_area questions, which are still open; see their research.
      report: docs/research/2026-10-20_architect_questions.md §3.2
    findings:
    - id: below_ground_not_counted
      question: '"Above ground": are parts of a building below grade (e.g. a buried garage under a deck) left out of
        building_area?'
      kind: reading
      answer: Parts wholly below ground don't count (Column 10 counts what is covered "above ground"; §325-25B lets
        wholly below-grade accessory structures go anywhere). A deck on top of a buried garage does count.
      sources:
      - file: chapter_325_zoning_2026-10.pdf
        page: 25
        lines: [6, 7]
        quote: covered by principal and accessory buildings above ground
      - file: chapter_325_zoning_2026-10.pdf
        page: 67
        lines: [4, 4]
        quote: entirely below the finished grade
      still_open: []
      strength: strong
      confirm_with: the City zoning office
      report: docs/research/2026-10-20_architect_questions.md §3.2
    examples:
      # lot of 4,000 sf: 35% = 1,400 sf, 40% = 1,600 sf, 50% = 2,000 sf
      - given: {use: one_family_detached, building_area: 1400, lot_area: 4000}
        expect: pass
        note: exactly 35%
      - given: {use: one_family_detached, building_area: 1401, lot_area: 4000}
        expect: fail
      - given: {use: one_family_detached_zero_lot_line, building_area: 1401, lot_area: 4000}
        expect: fail
        note: the first number (35%) applies to zero-lot-line houses too
      - given: {use: church, building_area: 1401, lot_area: 4000}
        expect: fail
      - given: {use: two_family, building_area: 1600, lot_area: 4000}
        expect: pass
        note: exactly 40%
      - given: {use: two_family, building_area: 1601, lot_area: 4000}
        expect: fail
      - given: {use: one_family_semi_detached, building_area: 1600, lot_area: 4000}
        expect: pass
      - given: {use: one_family_semi_detached, building_area: 1601, lot_area: 4000}
        expect: fail
      - given: {use: one_family_attached, building_area: 2000, lot_area: 4000}
        expect: pass
        note: exactly 50%
      - given: {use: one_family_attached, building_area: 2001, lot_area: 4000}
        expect: fail
    notes: >-
      R-2C's cell is "35%/40% /50% [fn12]", printed on three lines (the 35%/40% on the line above the row, /50% on the
      line below), which is why the row's own line shows only eight values. Note 12 says which use each number is for.
    drafted_by: claude
    status: draft

