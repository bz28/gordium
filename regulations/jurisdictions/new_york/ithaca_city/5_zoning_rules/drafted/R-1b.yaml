- id: R-1b.parking_by_sleeping_rooms
  kind: rule
  topic: parking_and_loading
  title: Residential parking by bed or sleeping rooms (chart p.14)
  check: parking_spaces >= (1 if sleeping_rooms <= 3 else (2 if sleeping_rooms <= 5 else 2 + (sleeping_rooms - 5)
    * 1))
  review_when:
  - when: multiple_dwelling_units
    reason: The chart sets spaces per dwelling unit, but parking_spaces counts the spaces on the whole lot and sleeping_rooms
      counts one unit; a person must check each unit.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 14
    cell:
      section: Residential
      row: First three bed or sleeping rooms per dwelling unit
      column: R-1B
  - file: zoning_charts_2026-04.pdf
    page: 14
    cell:
      section: Residential
      row: 4-5 bed or sleeping rooms per dwelling unit
      column: R-1B
  - file: zoning_charts_2026-04.pdf
    page: 14
    cell:
      section: Residential
      row: Each additional bed or sleeping room
      column: R-1B
  examples:
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 3
      parking_spaces: 1
    expect: pass
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 3
      parking_spaces: 0
    expect: fail
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 4
      parking_spaces: 2
    expect: pass
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 5
      parking_spaces: 1
    expect: fail
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 6
      parking_spaces: 3
    expect: pass
  - given:
      multiple_dwelling_units: false
      sleeping_rooms: 6
      parking_spaces: 2
    expect: fail
  - given:
      multiple_dwelling_units: true
      sleeping_rooms: 3
      parking_spaces: 1
    expect: needs_review
  open_questions:
  - Does the 4-5 row's 2 spaces per dwelling unit replace the 1 space of the first row (a total of 2) or add to
    it? The formula treats it as the total.
  - Is the 'each additional' space added to the 2 spaces for each room beyond five? The formula treats it so.
  - Which uses count as a 'dwelling unit' for this section; do bed-and-breakfast inns, fraternity or group houses
    and nursing homes fall under it? The rule is applied to every lot in the district.
