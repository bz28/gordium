    - 18
    quote: '(e) Front, side and rear yard dimensions, provided that all buildings in a cluster subdivision shall
      have a front yard of at least 25 feet in the R-1a, R-1b, and R-2a Zones and 10 feet in the R-2b, R-3a and
      R-3b Zones, and further provided that all buildings in a cluster subdivision shall be at least the following
      number of feet from the boundary of a cluster subdivision where it abuts land, other than a public right-of-way,
      that is not part of the cluster subdivision:'
