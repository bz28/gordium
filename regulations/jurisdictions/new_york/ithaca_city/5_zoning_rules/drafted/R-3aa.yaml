- id: R-3aa.min_lot_size_detached
  kind: rule
  topic: dimensions
  title: Minimum lot size, one-family detached (chart p.3)
  applies_when: use == "one_family_detached"
  check: lot_area >= 5000
  review_when:
  - when: additional_primary_buildings > 0
    reason: 'Chart note 3 (see §325-8(B)(1)): the area requirement applies separately to each additional primary
      use in a separate building.'
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 3
    cell:
      section: Minimum Lot Size [fn3]
      row: One-family dwelling, detached
      column: R-3AA
  - file: zoning_charts_2026-04.pdf
    page: 3
    lines:
    - 48
    - 48
    quote: See §325-8(B)(1).
  examples:
  - given:
      use: one_family_detached
      lot_area: 5000
      additional_primary_buildings: 0
    expect: pass
  - given:
      use: one_family_detached
      lot_area: 4999
      additional_primary_buildings: 0
    expect: fail
  - given:
      use: one_family_detached
      lot_area: 5000
      additional_primary_buildings: 1
    expect: needs_review
  - given:
      use: two_family
      lot_area: 1
      additional_primary_buildings: 0
    expect: not_applicable
  open_questions:
  - 'Chart note 3 points to §325-8(B)(1): how is the area for several primary buildings on one lot to be totaled
    and measured?'
  research:
  - question: 'Chart note 3 points to §325-8(B)(1): how is the area for several primary buildings on one lot to
      be totaled and measured?'
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script; numbers filled by code from the R-3aa cells.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
