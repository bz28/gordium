- id: R-3aa.min_lot_size_detached
  kind: rule
  topic: dimensions
  title: Minimum lot size, one-family detached (chart p.3)
  applies_when: use == "one_family_detached"
  check: lot_area >= 5000
  review_when:
  - when: multiple_primary_buildings
    reason: Each square-footage requirement applies separately to the initial primary use and to each additional
      primary use in a separate building (chart note 3, §325-8B(1)); the lot area needed for several primary buildings
      is not decided here.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 3
    cell:
      section: Minimum Lot Size [fn3]
      row: One-family dwelling, detached
      column: R-3AA
  - file: zoning_charts_2026-04.pdf
    page: 3
    lines:
    - 48
    - 48
    quote: See §325-8(B)(1).
  - file: chapter_325_zoning_2026-10.pdf
    page: 26
    lines:
    - 11
    - 16
    quote: (1) For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use
      districts, each square-footage requirement applies separately to the initial permitted primary use and to
      each additional permitted primary use located in a separate building on the property in question (e.g., in
      R-2b Districts, an area of 3,000 square feet is required for a one family house or a two-family house, and
      an additional area of 3,000 square feet is required for each additional one-family house or two-family house
      on the property).
  examples:
  - given:
      use: one_family_detached
      lot_area: 5000
      multiple_primary_buildings: false
    expect: pass
  - given:
      use: one_family_detached
      lot_area: 4999
      multiple_primary_buildings: false
    expect: fail
  - given:
      use: one_family_detached
      lot_area: 5000
      multiple_primary_buildings: true
    expect: needs_review
  - given:
      use: two_family
      lot_area: 1
      multiple_primary_buildings: false
    expect: not_applicable
  open_questions:
  - 'Chart note 3 sends multiple primary buildings to §325-8B(1): how much lot area is required in total when a
    lot holds several primary buildings of different uses?'
  research:
  - question: 'Chart note 3 sends multiple primary buildings to §325-8B(1): how much lot area is required in total
      when a lot holds several primary buildings of different uses?'
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script; numbers filled by code from the R-3aa cells.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
