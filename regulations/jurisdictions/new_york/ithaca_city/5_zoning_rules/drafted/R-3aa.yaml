- id: R-3aa.min_lot_size_other_use
  kind: rule
  topic: dimensions
  title: Minimum lot size, other use (chart p.3)
  applies_when: use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
    "one_family_attached", "two_family", "multiple_family", "fraternity_sorority_group_house"]
  check: lot_area >= 6000
  review_when:
  - when: additional_primary_buildings > 0
    reason: 'Chart note 3 (see §325-8(B)(1)): the area requirement applies separately to each additional primary
      use in a separate building.'
  - when: use == "adult_day_care_home"
    reason: '§325-3 defines this use as ''A dwelling unit in which adult day care is provided to not more than six
      adults at one tim'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or
      a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "bed_and_breakfast_inn"
    reason: '§325-3 defines this use as ''An owner-managed, single dwelling unit that provides five to 10 guest
      rooms, limited to tw'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row
      or a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "dormitory"
    reason: '§325-3 defines this use as ''A multiple dwelling which provides sleeping accommodations and domestic
      facilities and ser'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or
      a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "nursing_home"
    reason: '§325-3 defines this use as ''a multiple dwelling: A building used or occupied as a convalescent, old-age
      or nursing hom'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or a dwelling
      row, with its notes) is unclear: a person decides.'
