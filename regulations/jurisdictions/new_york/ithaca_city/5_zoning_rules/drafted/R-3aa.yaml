  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 28
    - 28
    quote: Bed-and-breakfast inn - - - - -
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 16
    - 16
    quote: Dormitory - - - - - • - • •[fn5]
