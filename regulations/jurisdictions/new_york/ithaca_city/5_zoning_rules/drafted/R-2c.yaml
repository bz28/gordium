- id: R-2c.min_lot_area_other_use
  kind: rule
  topic: dimensions
  title: Minimum lot size, other use (chart p.3)
  applies_when: use not in ["one_family_detached", "one_family_detached_zero_lot_line", "one_family_semi_detached",
    "one_family_attached", "two_family", "multiple_family", "fraternity_sorority_group_house"]
  check: lot_area >= 4000
  review_when:
  - when: additional_primary_building
    reason: Under §325-8B(1) the area requirement applies separately to each additional primary use in a separate
      building, so the lot area needed for more than one primary building is not settled by this check.
  - when: use == "adult_day_care_home"
    reason: '§325-3 defines this use as ''A dwelling unit in which adult day care is provided to not more than six
      adults at one tim'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or
      a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "bed_and_breakfast_inn"
    reason: '§325-3 defines this use as ''An owner-managed, single dwelling unit that provides five to 10 guest
      rooms, limited to tw'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row
      or a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "dormitory"
    reason: '§325-3 defines this use as ''A multiple dwelling which provides sleeping accommodations and domestic
      facilities and ser'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or
      a dwelling row, with its notes) is unclear: a person decides.'
  - when: use == "nursing_home"
    reason: '§325-3 defines this use as ''a multiple dwelling: A building used or occupied as a convalescent, old-age
      or nursing hom'', a kind of dwelling, so which row of the chart applies to it (this "Other use" row or a dwelling
      row, with its notes) is unclear: a person decides.'
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 3
    cell:
      section: Minimum Lot Size [fn3]
      row: Other use
      column: R-2C
  - file: zoning_charts_2026-04.pdf
    page: 3
    lines:
    - 48
    - 48
    quote: See §325-8(B)(1).
  - file: chapter_325_zoning_2026-10.pdf
    page: 26
    lines:
    - 11
    - 16
    quote: For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts,
      each square-footage requirement applies separately to the initial permitted primary use and to each additional
      permitted primary use located in a separate building on the property in question (e.g., in R-2b Districts,
      an area of 3,000 square feet is required for a one family house or a two-family house, and an additional area
      of 3,000 square feet is required for each additional one-family house or two-family house on the property).
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 24
    - 24
    quote: Adult day care home - - SP SP SP
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 28
    - 28
    quote: Bed-and-breakfast inn - - - - -
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 16
    - 16
    quote: Dormitory - - - - - • - • •[fn5]
  - file: zoning_charts_2026-04.pdf
    page: 2
    lines:
    - 26
    - 26
    quote: Nursing, convalescent or rest home
  examples:
  - given:
      use: church
      lot_area: 4000
      additional_primary_building: false
    expect: pass
  - given:
      use: church
      lot_area: 3999
      additional_primary_building: false
    expect: fail
  - given:
      use: church
      lot_area: 4000
      additional_primary_building: true
    expect: needs_review
  - given:
      use: one_family_detached
      lot_area: 1
      additional_primary_building: false
    expect: not_applicable
