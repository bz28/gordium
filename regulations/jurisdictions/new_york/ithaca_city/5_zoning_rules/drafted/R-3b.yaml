- id: R-3b.min_lot_area_one_family_detached
  kind: rule
  topic: dimensions
  title: Minimum lot size, one-family dwelling, detached (chart p.3)
  applies_when: use == "one_family_detached"
  check: lot_area >= 3000
  review_when:
  - when: additional_primary_building
    reason: Under §325-8B(1) the area requirement applies separately to each additional primary use in a separate
      building, so the lot area needed for more than one primary building is not settled by this check.
  sources:
  - file: zoning_charts_2026-04.pdf
    page: 3
    cell:
      section: Minimum Lot Size [fn3]
      row: One-family dwelling, detached
      column: R-3B
  - file: zoning_charts_2026-04.pdf
    page: 3
    lines:
    - 48
    - 48
    quote: See §325-8(B)(1).
  - file: chapter_325_zoning_2026-10.pdf
    page: 26
    lines:
    - 11
    - 16
    quote: For minimum lot size requirements stated in Column 6, Area in Square Feet, for all residential use districts,
      each square-footage requirement applies separately to the initial permitted primary use and to each additional
      permitted primary use located in a separate building on the property in question (e.g., in R-2b Districts,
      an area of 3,000 square feet is required for a one family house or a two-family house, and an additional area
      of 3,000 square feet is required for each additional one-family house or two-family house on the property).
  examples:
  - given:
      use: one_family_detached
      lot_area: 3000
      additional_primary_building: false
    expect: pass
  - given:
      use: one_family_detached
      lot_area: 2999
      additional_primary_building: false
    expect: fail
  - given:
      use: one_family_detached
      lot_area: 3000
      additional_primary_building: true
    expect: needs_review
  - given:
      use: church
      lot_area: 1
      additional_primary_building: false
    expect: not_applicable
  open_questions:
  - Chart cells with footnotes 4 to 9 add area per occupant, unit or room let. Those cells are not drafted here
    and go to a person.
  - Does the section 325-8B(1) rule for additional primary buildings need its own template?
  research:
  - question: Chart cells with footnotes 4 to 9 add area per occupant, unit or room let. Those cells are not drafted
      here and go to a person.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  - question: Does the section 325-8B(1) rule for additional primary buildings need its own template?
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script; numbers filled by code from the R-3b cells.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
