- id: general.325_16a_rooftop_feature_area_limit
  kind: rule
  topic: dimensions
  title: Rooftop feature area limit (325-16A(2))
  applies_when: has_exempt_height_feature
  check: rooftop_feature_area <= min(0.2 * building_ground_floor_area, 0.3 * roof_plane_area)
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 46
    lines:
    - 33
    - 35
    quote: In no case shall the horizontal surface area covered or occupied by such feature exceed 20% of the total
      ground floor area of the building or 30% of the area of the roof plane on which it is located, whichever is
      less.
  - file: chapter_325_zoning_2026-10.pdf
    page: 46
    lines:
    - 39
    - 41
    quote: In all cases, the surface area occupied by such feature shall be computed as the total area encompassed
      by a line enclosing the feature and any structural or supporting members on a horizontal plane at the point
      of attachment to the main building or to the ground.
  examples:
  - given:
      has_exempt_height_feature: true
      rooftop_feature_area: 150
      building_ground_floor_area: 1000
      roof_plane_area: 500
    expect: pass
  - given:
      has_exempt_height_feature: true
      rooftop_feature_area: 160
      building_ground_floor_area: 1000
      roof_plane_area: 500
    expect: fail
  - given:
      has_exempt_height_feature: true
      rooftop_feature_area: 200
      building_ground_floor_area: 1000
      roof_plane_area: 2000
    expect: pass
  - given:
      has_exempt_height_feature: true
      rooftop_feature_area: 201
      building_ground_floor_area: 1000
      roof_plane_area: 2000
    expect: fail
  - given:
      has_exempt_height_feature: false
      rooftop_feature_area: 0
      building_ground_floor_area: 1000
      roof_plane_area: 500
    expect: not_applicable
  open_questions:
  - 'Which features does the limit cover: only the features listed in 325-16A(1)(a)-(e) that are exempt from the
    height limits, or any rooftop feature? The text says ''such feature''.'
  - Is the roof plane a single plane of a pitched roof or the whole roof, and how is its area measured when a feature
    sits on a roof with several planes?
  - Does 'total ground floor area of the building' mean the main building only, or does it include accessory buildings?
  - The feature area is computed on a horizontal plane at the point of attachment, as the area enclosed by a line
    around the feature and its supporting members; the measure rooftop_feature_area is assumed to follow that method.
