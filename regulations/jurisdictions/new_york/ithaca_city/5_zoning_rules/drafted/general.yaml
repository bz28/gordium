- id: general.325_3b_building_area_pergola_terrace_patio_not_in_required_yard
  kind: rule
  topic: site_features
  title: Pergolas, terraces and patios above grade not in a required yard (325-3B)
  check: not pergola_in_required_yard and not terrace_or_patio_above_grade_in_required_yard
  sources:
  - file: chapter_325_zoning_2026-10.pdf
    page: 5
    lines:
    - 28
    - 29
    quote: However, neither pergolas or terraces and patios above grade shall be located in a required yard.
  examples:
  - given:
      pergola_in_required_yard: false
      terrace_or_patio_above_grade_in_required_yard: false
    expect: pass
  - given:
      pergola_in_required_yard: true
      terrace_or_patio_above_grade_in_required_yard: false
    expect: fail
  - given:
      pergola_in_required_yard: false
      terrace_or_patio_above_grade_in_required_yard: true
    expect: fail
  open_questions:
  - Does "above grade" modify only "terraces and patios" or also "pergolas"? The formula treats any pergola in a
    required yard as a failure; please confirm whether a pergola at or below grade is allowed in a required yard.
