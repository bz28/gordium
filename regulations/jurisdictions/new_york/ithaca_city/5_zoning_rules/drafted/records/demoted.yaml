general.325_3b_home_occupation_home_occupation_marked_vehicles: >-
  §325-3B(g) "no more than two such vehicles in R-2 Zones and in R-3 and in all other zones no more than three"
  reads two ways: R-3 with R-2 (2 vehicles) or with all other zones (3); the draft took 3 without saying so. A
  person checks the marked vehicles until the architects answer which (review round 22, 2026-10-25).
