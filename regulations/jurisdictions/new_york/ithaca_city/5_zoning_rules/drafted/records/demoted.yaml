R-2c.parking_per_dwelling_unit: >-
  The bedroom rule checks a one-family detached zero-lot-line house, a use that needs a special permit here; the R-2c
  answer key sends its parking to review (the house is one unit, but its use needs a special permit in R-2c anyway): a
  person checks the parking (gap re-draft, 2026-10-21).
