R-2b.325_18b_projection_side_yard_smaller:
  scope: district     # this district's two side minimums differ (10 ft and 5 ft)
  cause: >-
    The eave yards are measured narrower-first on their own, apart from the wall yards, so an eave
    3.5 ft into the required 10 ft side yard is read against the 5 ft side and passes (review round 22,
    2026-10-25). A person checks the side eaves until each eave side is measured to its wall's lot line.
