R-3a.loading_multiple_dwelling_25_units:
  cause: >-
    The chart's row is "Multiple dwelling with 25 + units"; the draft turned the rate (1 space / 10,000 sf) into a
    floor-space threshold, so a 30-unit building under 10,000 sf had no loading check (2026-10-25): a person
    checks the loading of every multiple dwelling.
  applies_when: use == "multiple_family"
