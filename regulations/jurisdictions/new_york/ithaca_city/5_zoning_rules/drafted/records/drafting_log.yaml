  325-29.8A:
    rules: []
    unresolved:
    - rule: 325-29.8A.requirement_p90_l7
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''A PWSF shall
        be located at one of the following opportunity sites:'''
    problems: []
    reason: 325-29.8A sets siting requirements for personal wireless service facilities (opportunity sites, order
      of location preference, avoidance areas, special interest area guidelines). None of them can be decided from
      the available building measures (lot, yard, height, use, parking). A PWSF is not among the listed use ids.
      Whether a site is an opportunity site or avoidance area depends on city maps, aerial photographs and officials'
      determinations (L64-L66), and the Landmarks Commission must approve any PWSF in an avoidance area under A(3)(b)
      (L70-L72). The 15 ft equipment height and 20 ft alley setback apply only in special interest areas, which
      have no measure here. A rule would need new measures and a facility type that the engineers have not defined,
      so no template is drafted.
  325-29.12B:
    rules: []
    unresolved:
    - rule: 325-29.12B.requirement_p103_l10
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''(b) Whether
        or not the proposed installation will, or will not, inflict a significant adverse aesthetic impact upon
        adjacent or nearby properties or surrounding neighborhood or community, specifically:'''
    problems: []
    reason: '325-29.12B tells the Board of Zoning Appeals what its written decisions on wireless facility (PWSF)
      applications must specify: whether there is a significant coverage gap, whether the installation is the least
      intrusive means, aesthetic impact, fall zone, alternatives, and consistency with legislative intent. These
      are findings the Board makes on evidence, and they are decision procedure, not dimensional requirements on
      a building design. None of the available measures (lot area, yards, height, use ids, parking and the like)
      covers a wireless facility, and no use id covers wireless facilities. The measurable elements named in the
      text (drive test data, minimum necessary height, fall zone) set no number and need judgment about evidence,
      so code can''t decide them. Any flag would have no check and would apply to no residential-district design
      measure. The text sets no requirement that code can check for the residential districts listed, so I return
      no templates.'
  325-32A:
    rules: []
    unresolved:
    - rule: 325-32A.requirement_p112_l11
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''may continue
        so long as the nonconformity remains otherwise lawful and complies with this section'''
    problems: []
    reason: 'Piece 325-32A sets no limit that code can check against the measurements we have. It lets a lawfully
      established nonconforming use, building or lot continue "so long as the nonconformity remains otherwise lawful
      and complies with this section". Whether a nonconformity is "otherwise lawful" is a legal judgment with no
      listed measure. "This section" refers to the rest of §325-32 and to related sections (325-35A permits, 325-20C
      parking, 325-32C), which are drafted from their own text. Folding them in here would settle in a formula what
      belongs to those sections. A rule with check "" would be a flag, but a flag with no check adds nothing the
      other sections'' rules don''t already give. The second sentence, that rights run with the property and are
      not affected by changes in tenancy or ownership, is a statement of legal effect. It sets no requirement on
      a building design. Open questions for the architects: what "otherwise lawful" covers, and which later provisions
      of §325-32 "complies with this section" brings in.'
