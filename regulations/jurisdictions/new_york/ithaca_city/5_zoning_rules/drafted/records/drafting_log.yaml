    problems: []
    reason: This piece is a definition. Its sentence 'Any dwelling unit occupied by a cooperative household shall
      be considered a multiple dwelling' classifies the use. It sets no limit, minimum, prohibition or condition
      on a design that code can check with the listed measures. We have no measure for whether a household is a
      cooperative household, and the classification feeds into the use-type rules (multiple_family chart rows) rather
      than being a requirement itself. The last sentence, which excludes supervised residential care facilities
      such as halfway houses, hostels or group homes, limits the definition's scope. It is not a design requirement,
      and it would need an architect's judgment about the use. The occupancy rules (four or more unrelated persons)
      are drafted from the occupancy sections of the law, not from here.
