    - rule: 325-28B.requirement_p72_l5
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''Area requirements
        for new construction shall apply to any ADU that is permitted on or after the effective date of this section.'''
    problems: []
    reason: 'Piece 325-28B only states the scope of section 325-28: it applies to all ADUs in the City of Ithaca,
      and the ''area requirements for new construction'' apply to any ADU permitted on or after the section''s effective
      date. It sets no limit, minimum, prohibition or condition of its own that can be checked against a design.
      The area requirements themselves (footprint, height, setbacks) are in 325-28C and are drafted from that piece.
      The effective date and permit date are not measures available here, and the residential-district measures
      do not cover ADUs. Drafting a rule from this applicability statement would require inventing a permit-date
      measure and settling an interpretation of the law, so no template is produced.'
