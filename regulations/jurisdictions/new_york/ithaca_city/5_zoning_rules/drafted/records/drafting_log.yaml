    problems: []
    reason: 'Every requirement in 325-27D depends on facts that are not among the available measures: whether the
      use is a short-term rental, whether the host''s primary residence is on the property, whether the unit is
      owner-occupied, the dwelling or building type, whether the host is a natural person, whether a permit is held,
