      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''the front
        yard depth in the business or industrial district shall be equal to 1/2 the required front yard depth of
        the residential district for a distance of at least 50 feet into the business or industrial district'''
    problems: []
    reason: '325-19B sets a front yard depth only for the part of a frontage that lies in a business or industrial
      district: 1/2 the residential district''s required front yard, for at least 50 feet into that district. It
      sets nothing for a lot in a residential district. The available measures describe one lot in one district.
      They cannot express frontage split between districts, the distance measured into the business or industrial
      part, or the front yard depth in that part. A per-district rule filled from the residential chart would wrongly
      apply to residential lots. Drafting it would need new measures and a rule for business and industrial districts,
      so it is not drafted for the residential districts listed.'
