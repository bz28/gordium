      the residential uses or measures available. Its two requirements cannot be decided from the listed measures.
      First, security barriers must be reviewed by the Planning and Development Board and found acceptable for the
      controlled and general populations. That is a discretionary board judgment and a procedure, not a measurement
      on a building design. Second, the general population should not be allowed within 10 meters of any antenna.
      That is a separation to an antenna, and no listed measure (such as distance to an antenna or the presence
      of a PWSF) captures it. The wording is also 'should', not a mandatory 'shall'. The listed use ids include
      no PWSF use, so a rule here could not be tied to a use. Any rule would require inventing measures and settling
      open interpretations, so no template is drafted.
