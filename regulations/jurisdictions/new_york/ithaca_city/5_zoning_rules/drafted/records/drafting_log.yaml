      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, semi-detached'',
        ''Two-family dwelling'', may limit these uses and no rule checks it (a person does): ''(4) See §325-3 for
        occupancy restrictions.'''
    - rule: R-2b.use
      why: 'chart p.2 footnote 1, on the R-2B column heading, may limit these uses and no rule checks it (a person
        does): ''(1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall
        be excluded in determining the number of unrelated occupants.'''
    - rule: R-2b.use
      why: 'chart p.2 footnote 2, on the R-2B column heading, may limit these uses and no rule checks it (a person
        does): ''(2) Properties in the South Hill Overlay District with a zoning designation of R-1 or R-2, see
        §325-8(E).'''
    - rule: R-2b.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, semi-detached'',
        ''Two-family dwelling'', may limit these uses and no rule checks it (a person does): ''(4) See §325-3 for
        occupancy restrictions.'''
    - rule: R-2c.use
      why: 'chart p.2 footnote 1, on the R-2C column heading, may limit these uses and no rule checks it (a person
        does): ''(1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall
        be excluded in determining the number of unrelated occupants.'''
    - rule: R-2c.use
      why: 'chart p.2 footnote 2, on the R-2C column heading, may limit these uses and no rule checks it (a person
        does): ''(2) Properties in the South Hill Overlay District with a zoning designation of R-1 or R-2, see
        §325-8(E).'''
    - rule: R-2c.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, detached,
        zero lot line'', ''One-family dwelling, semi-detached'', ''One-family dwelling, attached'', ''Two-family
        dwelling'', may limit these uses and no rule checks it (a person does): ''(4) See §325-3 for occupancy restrictions.'''
    - rule: R-3a.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, detached,
        zero lot line'', ''One-family dwelling, semi-detached'', ''One-family dwelling, attached'', ''Two-family
        dwelling'', ''Multiple family dwelling'', may limit these uses and no rule checks it (a person does): ''(4)
        See §325-3 for occupancy restrictions.'''
    - rule: R-3aa.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, detached,
        zero lot line'', ''One-family dwelling, semi-detached'', ''One-family dwelling, attached'', ''Two-family
        dwelling'', ''Multiple family dwelling'', may limit these uses and no rule checks it (a person does): ''(4)
        See §325-3 for occupancy restrictions.'''
    - rule: R-3b.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, detached,
        zero lot line'', ''One-family dwelling, semi-detached'', ''One-family dwelling, attached'', ''Two-family
        dwelling'', ''Multiple family dwelling'', may limit these uses and no rule checks it (a person does): ''(4)
        See §325-3 for occupancy restrictions.'''
    - rule: RU.use
      why: 'chart p.2 footnote 3, on the RU column heading, may limit these uses and no rule checks it (a person
        does): ''(3) Properties less than 60,000 SF may only have one primary structure. Properties greater than
        60,000 SF may have two primary uses, if approved by ILPC and Planning Board. Properties with at least 90,000
        SF can have as many as three primary uses if approved by ILPC and Planning Board.'''
    - rule: RU.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', ''One-family dwelling, semi-detached'',
        ''One-family dwelling, attached'', ''Two-family dwelling'', ''Multiple family dwelling'', may limit these
        uses and no rule checks it (a person does): ''(4) See §325-3 for occupancy restrictions.'''
