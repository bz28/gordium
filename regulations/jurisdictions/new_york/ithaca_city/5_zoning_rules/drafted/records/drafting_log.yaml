      of them. The text sets no chart numbers, and the only measures that come close are dwelling_units and the
      use ids. The use measure has no short-term rental value and cannot tell a single-family unit from a unit inside
      a multiple dwelling or mixed-use building. Drafting a rule on those measures would settle the unclear points
      in the formula, which risks a false pass. The text also sets no dimensional limit on a design. Subsection
      (1), permission only in zones where residential uses are allowed, depends on the use tables of other sections.
      The permit (4), natural-person (5) and authorization (2)(b) requirements are procedures and applicant eligibility,
      not requirements on a building design. Subsection (6), no limit on rental days, is a permission and sets no
      requirement. Subsection (3) restricts the dwelling types in which short-term rentals are allowed, and would
      need new measures for short-term rental use, owner-occupancy and the building type. It also depends on §325-28
      and the ADU definition for what counts as an ADU.'
