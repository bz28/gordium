  325-25:
    rules: []
    unresolved:
    - rule: 325-25.requirement_p66_l34
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''Accessory
        structures, including private garages, storage sheds, toolhouses, garden houses, playhouses or similar structures,
        shall be exempt from side yard requirements contained in the District Regulations Chart'''
    problems: []
    reason: Piece 325-25 is only a heading and lead-in. It exempts accessory structures from the chart's side yard
      requirements and says they are governed by the requirements below. The exemption sets no limit a design must
      meet. It only removes the chart's side yard rule from accessory structures, and that is handled when the chart's
      side yard rows are drafted. The actual location requirements are in 325-25A (no accessory structures in a
      required front yard), 325-25B (below-grade structures), 325-25C (3 ft and 6 ft setbacks for frame accessory
      buildings) and 325-25D (garages across a common lot line). Those pieces are drafted on their own and not folded
      into this one.
