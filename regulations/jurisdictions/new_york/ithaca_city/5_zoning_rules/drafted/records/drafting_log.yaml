      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''Where a building
        contains sections of a roof of varying heights, the height of that building shall be measured using that
        section of the roof that has the highest elevation from grade plane.'''
    problems: []
    reason: 'This piece defines how building height is measured; it sets no limit of its own. Its ''shall'' sentence
      (with varying roof sections, measure using the section with the highest elevation from grade plane) is a measuring
      instruction, not a pass/fail test. The existing measure building_height already means ''height of the building,
      measured as the city defines it'', so the highest-section rule is part of how that measure is taken. The limit
      itself (chart page 3, Maximum Building Height row) is drafted from the chart. Open points for architects,
      with no rule to attach them to: the definition does not say what ''average height'' of a pitched, gabled,
      hip or gambrel roof means, nor how a building mixing flat and pitched sections is measured; it depends on
      the GRADE PLANE definition.'
