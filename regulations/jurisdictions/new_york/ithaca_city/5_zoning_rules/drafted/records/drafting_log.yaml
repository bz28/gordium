    - rule: 325-29.21B.requirement_p109_l24
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''The security
        barrier shall be maintained by the operator of the PWSF or mount for the life of the installation.'''
    problems: []
    reason: '325-29.21B sets nothing that code can decide with the listed measures, and it names no residential
      district. Each sentence fails for a specific reason. (1) ''A security barrier ... may be required around the
      perimeter of mount(s) or equipment structure, and any anchor points'' is permissive (may be required), so
      it sets no fixed requirement. It also refers to the ''City of Ithaca Zoning Ordinance'' for the barrier standard,
      and that standard is not in the text given. (2) ''In the case of a roof-mounted PWSF, the security barrier
      may need only be around the antenna'' is a permitted reduction, not a measurable limit. (3) ''The security
      barrier shall be maintained by the operator of the PWSF or mount for the life of the installation'' is an
      ongoing maintenance duty owed by the operator. It cannot be tested against a building design''s measurements.
      (4) ''No security barrier is needed around side-mounted PWSF''s'' is an exemption. It would only relax a barrier
      rule, and there is no barrier requirement here to relax. Its tie to ''distances from windows and balconies
      should conform to Subsection C(2)'' is advisory (''should'') and depends on another subsection, which is not
      given. There are also no listed measures for PWSFs, mounts, barriers, windows or balconies. The layout facts
      the label mentions are not measurable with the given measures. Gordium has no measures for these facts, and
      drafting from them would force an interpretation in the formula. Open questions for the architects: what barrier
      standard does the Zoning Ordinance set, and is the maintenance duty to be tracked as a flag?'
  325-29.21C:
