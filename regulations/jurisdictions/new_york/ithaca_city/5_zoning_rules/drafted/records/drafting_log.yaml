    unresolved:
    - rule: 325-25D.requirement_p67_l10
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''Erection of
        a detached garage or carport for the accommodation of private passenger vehicles across a common lot line
        by mutual agreement between adjoining property owners shall be permitted.'''
    problems: []
    reason: '325-25D is a permissive sentence: a detached garage or carport for private passenger vehicles across
      a common lot line by mutual agreement between adjoining property owners ''shall be permitted''. It sets no
      limit, minimum or prohibition on a design. Whether the owners have a mutual agreement is a legal fact, not
      a listed measure, and a rule on it would say nothing that code could fail. It is an exception to the accessory-structure
      placement and yard rules in 325-25 and 325-25C, which are drafted from those sections. The related sections
      325-25 and 325-25C cover the placement limits this permission relaxes, and that interaction is left to them.'
