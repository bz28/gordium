      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''there shall
        be provided along such abutting lines a yard equal in width or depth to that required in the residential
        district.'''
    problems: []
    reason: '325-19A sets its requirement for a lot in a business or industrial district that abuts a residential
      district. The yard it requires on that lot is the same width or depth as the abutting residential district''s
      chart yard. The residential districts listed (R-1a through RU) are not the lots it binds, so it sets nothing
      for a lot in those districts. A rule for it would need measures this system does not have: the lot''s business
      or industrial district, the abutting residential district, and the yard measured along the abutting line.
      Gordium cannot check those from the measures listed. No template is drafted, so no residential lot gets a
      false pass or fail from it.'
