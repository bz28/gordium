    - RU.use
    unresolved:
    - rule: R-1a.use
      why: 'chart p.2 footnote 1, on the R-1A column heading, may limit these uses and no rule checks it (a person
        does): ''(1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall
        be excluded in determining the number of unrelated occupants.'''
    - rule: R-1a.use
      why: 'chart p.2 footnote 2, on the R-1A column heading, may limit these uses and no rule checks it (a person
        does): ''(2) Properties in the South Hill Overlay District with a zoning designation of R-1 or R-2, see
        §325-8(E).'''
    - rule: R-1a.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', may limit these uses and no rule
        checks it (a person does): ''(4) See §325-3 for occupancy restrictions.'''
    - rule: R-1b.use
      why: 'chart p.2 footnote 1, on the R-1B column heading, may limit these uses and no rule checks it (a person
        does): ''(1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall
        be excluded in determining the number of unrelated occupants.'''
    - rule: R-1b.use
      why: 'chart p.2 footnote 2, on the R-1B column heading, may limit these uses and no rule checks it (a person
        does): ''(2) Properties in the South Hill Overlay District with a zoning designation of R-1 or R-2, see
        §325-8(E).'''
    - rule: R-1b.use
      why: 'chart p.2 footnote 4, on the rows ''One-family dwelling, detached'', may limit these uses and no rule
        checks it (a person does): ''(4) See §325-3 for occupancy restrictions.'''
    - rule: R-2a.use
      why: 'chart p.2 footnote 1, on the R-2A column heading, may limit these uses and no rule checks it (a person
        does): ''(1) In R-1 and R-2 Districts, minor dependent children in the care of a parent or relative shall
        be excluded in determining the number of unrelated occupants.'''
