    - rule: 325-3B:dwelling_two_family.requirement_p9_l8
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''In R-2 and
        CR-2 Zones, each unit of a two-family dwelling may be occupied by an individual or family and not more than
        two unrelated individuals.'''
    problems: []
    reason: The occupancy limits here (unrelated individuals per unit, the 50% floor-area cap for a unit, and the
      R-2 limit) cannot be checked with the available measures. None of them covers the number of unrelated occupants,
      whether a unit is owner-occupied, or unit floor areas. The limits are also stated as what a unit "may be occupied
      by", and the text does not say whether they are caps, so any formula would settle a question the law leaves
      open. Writing a rule would also require new measures, and I cannot attach a quote and number trail that I
      can verify for them. A flag would only restate the definition, so I return no templates. An architect should
      handle these occupancy limits separately.
  325-3B:dwelling_unit:
    rules: []
    unresolved:
    - rule: 325-3B:dwelling_unit.requirement_p9_l10
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''DWELLING UNIT
        — One or more rooms designed or used for living quarters by one household, including provisions for living,
        cooking, sanitary and sleeping facilities, and having a separate entrance from the outside of the building
        or through a common hall.'''
    problems: []
    reason: 325-3B:dwelling_unit is a definition. It sets no limit, minimum, prohibition or condition on a design
      for the residential districts. It also says nothing numeric. Whether a space qualifies as a dwelling unit
      (living, cooking, sanitary and sleeping facilities; a separate entrance from outside or through a common hall)
      is a question of category. Other rules use that category, such as the use rows and the parking rows per dwelling
      unit. Drafting it as a pass/fail rule would need an unlisted measure and an interpretation the law leaves
      open, for example whether a shared entrance or a common hall qualifies. That is for the architects to decide,
      and it belongs with the definition.
