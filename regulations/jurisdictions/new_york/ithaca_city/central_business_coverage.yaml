      why: 'No rule names a cooperative household. The occupancy rules (occupancy_one_family: at most one unrelated person;
        occupancy_two_family: a flag over one) keep it from passing as a one- or two-family dwelling, but nothing tells the
        architect that such a household makes the unit a multiple dwelling.'
