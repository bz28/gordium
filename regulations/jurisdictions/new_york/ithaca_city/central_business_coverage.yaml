# Central business coverage decisions: what a person decided about each piece of Chapter 325 labeled `rule` or
# `flag`, for each CBD district with a rulebook. The table built from it is 6_coverage_report/central_business_districts.md
# (`python -m section_labeling audit`; never hand-edit the table). The format and the checks are the residential file's
# (residential_coverage.yaml, its header; packages/section_labeling/section_labeling/district_audit.py).
# Drafted by Claude (2026-11-23) from the CBD rulebooks and the law's text: every part a CBD rule cites is decided by
# those rules; the rest started from the B districts' decisions (commercial_coverage.yaml) and each was then read again
# for the CBD column (chart p.4 and p.5: a "-" decision names the CBD column's own cell), §325-8D, §325-16G (not CBD-50),
# and §325-21C (no loading in any CBD district). A second reading, not an architect's.

districts:
- CBD-50
- CBD-60
- CBD-85
- CBD-100
- CBD-120
- CBD-140
parked:
  corner_lot_front:
    name: 'Corner lots: which side is the front'
    decided: Ben's later list, 2026-10-25
  historic_flood:
    name: Historic district and flood zone lookups
    decided: Ben's later list, 2026-10-25
  slope:
    name: Real ground slope (lots are treated as flat; on a sloping lot height and stories need review)
    decided: Ben's later list, 2026-10-25
  survey_import:
    name: Survey import (CAD/PDF)
    decided: Ben's later list, 2026-10-25
  chimney_fence:
    name: Chimneys, fences and other objects (how objects are identified in the model needs Ben's OK)
    decided: Ben's later list, 2026-10-25
  parking:
    name: 'Parking (typed count and read from the drawing): on hold'
    decided: Ben's later list, 2026-10-25
