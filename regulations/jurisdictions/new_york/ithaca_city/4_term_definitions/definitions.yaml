# How the City of Ithaca defines the words its residential rules depend on.
# Quotes are the city's exact words (verified against 2_extracted_text by `python -m rule_format`).
# `measures` links each definition to the measurement names rules use (packages/rule_format/.../measures.yaml).
# A definition is the city's own whole sentences, with no paraphrase (drafting_rules.md). Read the quotes.
# `open_questions` are gaps or interpretations for the architects; never resolved by guessing.
# A definition with open questions can't be approved. Draft: architect confirmation is deferred for now.

grade_plane:
  term: GRADE PLANE
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [32, 33]
      quote: "GRADE PLANE — A reference plane representing the average of finished ground level on each side of the building at exterior walls."
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [33, 34]
      quote: "On the sides of the building where grade is level, the measurement will be taken at a point adjoining the building."
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [34, 37]
      quote: "Where the finished ground level slopes away from the exterior walls, the measurement shall be taken at the lowest point within the area between the building and the lot line or, where the lot line is more than six feet from the building, between the building and a point six feet from the building."
  open_questions:
  - '"Average of finished ground level on each side": one value per side, simply averaged, or weighted by the length
    of each wall?'
  - What counts as a "side" for an L-shaped or irregular footprint?
  research:
  - question: '"Average of finished ground level on each side": one value per side, simply averaged, or weighted by
      the length of each wall?'
    searched:
    - 325-3B:grade_plane
    - 325-3B:height_of_building
    - 325-3B:story
    - 325-45.2B
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines:
      - 32
      - 33
      quote: A reference plane representing the average of finished ground level on each side of the building
    - rank: 3
      cite: ICC, 2012 IBC Handbook, on the grade plane (IBC §202, the wording Ithaca's follows)
      url: https://media.iccsafe.org/news/eNews/2014v11n20/2012_ibc_handbook_p32-34.pdf
      quote: The method for calculating grade plane can vary based on the site conditions.
    - rank: 4
      cite: 'Montgomery County MD: a wall-length-weighted average'
      url: https://montgomerycountymd.gov/DPS/Process/zspe/building-height.html
    - rank: 4
      cite: 'Kirkland WA: average building elevation handout (wall-length-weighted)'
      url: https://kirklandwa.gov/files/sharedassets/public/v/3/planning-amp-building/planning-applications-and-forms/average-building-elevation-handout.pdf
    why_open: The code fixes where the ground is measured (at the walls; where it slopes away, the lowest point within
      6 ft or the lot line), but not how the values are averaged. The model code's own handbook says the method varies,
      and no City record states one.
    readings:
    - id: simple_average_per_side
      reading: one value per side, simply averaged
    - id: wall_length_weighted
      reading: weighted by the length of each wall, around the whole building
    report: docs/research/2026-10-20_architect_questions.md §4.2
  - question: What counts as a "side" for an L-shaped or irregular footprint?
    searched:
    - 325-3B:grade_plane
    - 325-45.2B
    sources: []
    why_open: Nothing in the code or the City's records says what a "side" is on an L-shaped footprint.
    readings:
    - id: each_wall_segment
      reading: each wall segment is a side
    - id: bounding_rectangle_side
      reading: each side of the rectangle around the footprint is a side
    report: docs/research/2026-10-20_architect_questions.md §4.2
  drafted_by: claude
  status: draft

height_of_building:
  term: HEIGHT OF BUILDING
  measures: [building_height]
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines: [19, 22]
      quote: "HEIGHT OF BUILDING — he vertical distance measured from grade plane to the highest level of a flat or mansard roof or to the average height of a pitched, gabled, hip or gambrel roof, excluding bulkheads, housing for mechanical equipment, towers and similar constructions not intended for human occupancy or necessary equipment carried above roof level."
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines: [22, 24]
      quote: "Where a building contains sections of a roof of varying heights, the height of that building shall be measured using that section of the roof that has the highest elevation from grade plane."
  open_questions:
  - 'For the pitched-roof midpoint, which eave: the lowest eave of that roof section, the top of the wall plate, or
    the roof edge (drip line)? And with eaves at different heights on the same section, which one?'
  research:
  - question: 'For the pitched-roof midpoint, which eave: the lowest eave of that roof section, the top of the wall
      plate, or the roof edge (drip line)? And with eaves at different heights on the same section, which one?'
    searched:
    - 325-3B:height_of_building
    - 325-16
    - 325-45.2B
    sources:
    - rank: 3
      cite: 'IRC / Residential Code of NYS, MEAN ROOF HEIGHT (a wind-design term): the average of the roof eave height
        and the highest point'
      quote: The average of the roof eave height and the height to the highest point on the roof surface
    - rank: 4
      cite: 'Village of Scarsdale NY: halfway between the top of the plate and the ridge'
      url: https://www.zoneomics.com/code/scarsdale-NY/chapter_1
    why_open: The code says only "average height"; the building codes and other New York places disagree on where
      the eave is taken (1-2 ft apart on a steep roof), and no City record was found.
    readings:
    - id: lowest_eave
      reading: the lowest eave of the highest roof section
    - id: wall_plate
      reading: the top of the wall plate
    - id: drip_edge
      reading: the roof edge (drip line)
    report: docs/research/2026-10-20_architect_questions.md §4.1
  findings:
  - id: pitched_roof_midpoint
    question: '"Average height" of a pitched, gabled, hip or gambrel roof: midway between eave and ridge? Which eave,
      if the eaves are at different heights? How for gambrel and hip roofs?'
    kind: reading
    answer: Midway between eave and ridge, on the roof section with the highest elevation. A mansard is measured to
      its top; gambrel and hip roofs are averaged like a gable. Which eave is still open (the open question above).
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines:
      - 23
      - 24
      quote: using that section of the roof that has the highest elevation from grade plane
    - rank: 3
      cite: IRC / Residential Code of NYS, MEAN ROOF HEIGHT
      quote: The average of the roof eave height and the height to the highest point on the roof surface
    - rank: 4
      cite: 'Village of South Blooming Grove NY: the mean height between eaves and ridge'
      url: https://www.villageofsouthbloominggrove.com/wp-content/uploads/Local-Law-REV-7-28-21.pdf
    - rank: 4
      cite: City of Depew NY
      url: https://www.zoneomics.com/code/depew-NY/chapter_16
    still_open:
    - height_of_building#1
    strength: moderate
    confirm_with: the City zoning office
    report: docs/research/2026-10-20_architect_questions.md §4.1
  - id: typo_he_means_the
    question: The city's text reads "he vertical distance" (a typo for "The" in the official code). No effect on meaning.
    kind: law
    answer: Read "he" as "The"; it doesn't change the meaning.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines:
      - 19
      - 19
      quote: he vertical distance
    still_open: []
    strength: strong
    report: docs/research/2026-10-20_architect_questions.md §4.7
  - id: roof_features_dont_change_height
    question: §325-16A (p.46) separately exempts features like chimneys, spires and skylights from height limits.
      Those will be rules of their own; confirm they don't change how height itself is measured.
    kind: law
    answer: 'Confirmed: §325-16A''s exempt features (spires, chimneys, skylights, mechanical penthouses...) change
      what may stand above the limit, not how height is measured. Each may cover at most 20% of the ground floor area
      or 30% of its roof plane, whichever is less.'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 46
      lines:
      - 33
      - 33
      quote: In no case shall the horizontal surface area covered or occupied by such feature exceed 20%
    - file: chapter_325_zoning_2026-10.pdf
      page: 46
      lines:
      - 34
      - 35
      quote: or 30% of the area of the roof plane on which it is located, whichever is less
    still_open: []
    strength: strong
    report: docs/research/2026-10-20_architect_questions.md §4.6
  drafted_by: claude
  status: draft

story:
  term: STORY
  measures: [stories]
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [13, 14]
      quote: "STORY — The portion of a building which is between one floor level and the next higher floor level or the roof."
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [14, 17]
      quote: "A mezzanine, as defined in the New York State Uniform Fire Prevention and Building Code, is not a story. A basement shall be deemed to be a story when the finished surface of the floor next above is 1) more than six feet above grade plane or 2) more than 12 feet above the finished ground level at any point. A cellar shall not be deemed a story."
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [17, 18]
      quote: "An attic shall not be deemed to be a story if unfinished and without human occupancy."
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines: [35, 36]
      quote: "Buildings hereafter erected shall be limited to the number of stories herein specified, computed at the main entrance side."
  open_questions:
  - Which entrance is the "main entrance" when a house has more than one?
  - The basement test says "12 feet above the finished ground level at any point", while stories are "computed at
    the main entrance side". Does the 12 ft test look at every side, or only the main entrance side?
  research:
  - question: Which entrance is the "main entrance" when a house has more than one?
    searched:
    - 325-8A
    - 325-3B:story
    - 325-3B:basement
    - 325-45.2B
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines:
      - 36
      - 36
      quote: computed at the main entrance side
    why_open: '"Main entrance" is never defined (it appears once, §325-8A(8)); the form districts'' "functioning entry"
      doesn''t apply in residential districts; no City record was found.'
    readings:
    - id: address_street_entrance
      reading: the entrance facing the street the address is on
    - id: designer_named_entrance
      reading: the entrance the designer names
    report: docs/research/2026-10-20_architect_questions.md §4.3
  - question: The basement test says "12 feet above the finished ground level at any point", while stories are "computed
      at the main entrance side". Does the 12 ft test look at every side, or only the main entrance side?
    searched:
    - 325-3B:story
    - 325-8A
    - 325-3B:basement
    - 325-3B:grade_plane
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines:
      - 16
      - 17
      quote: more than 12 feet above the finished ground level at any point
    - rank: 3
      cite: 'NYS Department of State, Uniform Code rule text: STORY ABOVE GRADE PLANE (the same 6 ft / 12 ft test)'
      url: https://dos.ny.gov/2024-12-2-rule-text-uniform-code
    why_open: '"At any point" and the building code''s same test point to every side, but stories are "computed at
      the main entrance side" (§325-8A(8)), which may limit the count to that side; nothing says which governs, and
      no City record was found.'
    readings:
    - id: any_side
      reading: the 12 ft test applies at any point on any side
    - id: main_entrance_side_only
      reading: only on the main entrance side, where stories are computed
    report: docs/research/2026-10-20_architect_questions.md §4.3
  drafted_by: claude
  status: draft

basement:
  term: BASEMENT
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [10, 11]
      quote: "BASEMENT — That space of a building that is partly below grade which has more than half of its height, measured from floor to ceiling, above the finished ground level at any point."
  open_questions:
  - '"Above the finished ground level at any point": at one point is enough (e.g. a walk-out side), or at every point
    around the building?'
  - On a sloped lot, a space can meet both this definition (more than half above ground at some point) and the cellar
    definition (more than half below the average curb level or adjoining ground). Is it then a basement (can count
    as a story) or a cellar (never a story)?
  research:
  - question: '"Above the finished ground level at any point": at one point is enough (e.g. a walk-out side), or at
      every point around the building?'
    searched:
    - 325-3B:basement
    - 325-3B:story
    - 325-3B:cellar
    sources: []
    why_open: The words most simply mean that one point is enough, but the research didn't settle this definition,
      and whether the story count looks past the main entrance side is open too (story's questions); the walk-out
      case is the next question.
    readings:
    - id: one_point
      reading: more than half above ground at any one point is enough
    - id: every_point
      reading: more than half above ground at every point around the building
    report: docs/research/2026-10-20_architect_questions.md §4.4
  - question: On a sloped lot, a space can meet both this definition (more than half above ground at some point) and
      the cellar definition (more than half below the average curb level or adjoining ground). Is it then a basement
      (can count as a story) or a cellar (never a story)?
    searched:
    - 325-3B:basement
    - 325-3B:cellar
    - 325-3B:story
    sources:
    - rank: 3
      cite: 'IBC / Building Code of NYS: "story above grade plane" has no cellar exemption'
    why_open: Both definitions can fit a walk-out level and nothing says which wins. The cellar exemption is Ithaca's
      own, so the building codes can't settle it; no City record was found. Until answered, Gordium counts the level
      as a story if the floor above meets the 6 ft or 12 ft test.
    readings:
    - id: basement
      reading: 'a basement: a story if the floor above meets the 6 ft or 12 ft test'
    - id: cellar
      reading: 'a cellar: never a story'
    report: docs/research/2026-10-20_architect_questions.md §4.4
  drafted_by: claude
  status: draft

