  findings:
  - id: yards_to_nearest_part
    question: Is a yard's depth measured to the wall (ignoring sills, cornices and eaves that project up to 2 ft),
      or to the outermost eave? If an eave projects more than 2 ft, is the yard measured to the eave?
    kind: law
    answer: Each yard is measured to the nearest part of the building (walls, cantilevered upper floors, porches,
      decks, balconies over 2 ft, ramps, landings). Sills, belt courses, cornices and eaves may project up to 2 ft
      into a required yard; more than 2 ft is a violation of that yard, not a new measuring point. Whether a bay window
      is such a feature, and whether eaves count toward lot coverage, is still open.
