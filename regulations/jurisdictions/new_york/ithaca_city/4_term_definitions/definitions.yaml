# How the City of Ithaca defines the words its residential rules depend on.
# Quotes are the city's exact words (verified against 2_extracted_text by `python -m rule_format`).
# `measures` links each definition to the measurement names rules use (packages/rule_format/.../measures.yaml).
# `says` restates only what the quotes say (regulations/document_extraction_guide/drafting_rules.md).
# `open_questions` are gaps or interpretations for the architects; never resolved by guessing.
# A definition with open questions can't be approved. Draft: architects confirm.

grade_plane:
  term: GRADE PLANE
  says: >
    The reference level that building height is measured from: the average of the finished ground level
    on each side of the building at its exterior walls. Where the ground is level, the measurement is
    taken next to the building. Where the ground slopes away from a wall, it's taken at the lowest point
    between the building and the lot line, or between the building and a point 6 ft out if the lot line
    is more than 6 ft away.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [32, 33]
      quote: "GRADE PLANE — A reference plane representing the average of finished ground level on each side of the building at exterior walls."
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [33, 34]
      quote: "On the sides of the building where grade is level, the measurement will be taken at a point adjoining the building."
    - file: chapter_325_zoning_2026-10.pdf
      page: 11
      lines: [34, 37]
      quote: "Where the finished ground level slopes away from the exterior walls, the measurement shall be taken at the lowest point within the area between the building and the lot line or, where the lot line is more than six feet from the building, between the building and a point six feet from the building."
  open_questions:
    - "\"Average of finished ground level on each side\": one value per side, simply averaged, or weighted by the length of each wall?"
    - "What counts as a \"side\" for an L-shaped or irregular footprint?"
  drafted_by: claude
  status: draft

height_of_building:
  term: HEIGHT OF BUILDING
  measures: [building_height]
  says: >
    Measured from the grade plane up to the highest level of a flat or mansard roof, or to the average
    height of a pitched, gabled, hip or gambrel roof. Bulkheads, housing for mechanical equipment, towers
    and similar constructions not meant for people, and necessary equipment above the roof, are left out.
    If parts of the roof are at different heights, use the part that is highest above the grade plane.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines: [19, 20]
      quote: "HEIGHT OF BUILDING — he vertical distance measured from grade plane to the highest level of a flat or mansard roof or to the average height of a pitched, gabled, hip or gambrel roof"
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines: [20, 22]
      quote: "excluding bulkheads, housing for mechanical equipment, towers and similar constructions not intended for human occupancy or necessary equipment carried above roof level."
    - file: chapter_325_zoning_2026-10.pdf
      page: 12
      lines: [22, 24]
      quote: "Where a building contains sections of a roof of varying heights, the height of that building shall be measured using that section of the roof that has the highest elevation from grade plane."
  open_questions:
    - "\"Average height\" of a pitched, gabled, hip or gambrel roof: midway between eave and ridge? Which eave, if the eaves are at different heights? How for gambrel and hip roofs?"
    - "The city's text reads \"he vertical distance\" (a typo for \"The\" in the official code). No effect on meaning."
    - "§325-16A (p.46) separately exempts features like chimneys, spires and skylights from height limits. Those will be rules of their own; confirm they don't change how height itself is measured."
  drafted_by: claude
  status: draft

story:
  term: STORY
  measures: [stories]
  says: >
    A level between one floor and the next (or the roof). A mezzanine is not a story. A basement counts
    as a story if the floor above it is more than 6 ft above the grade plane, or more than 12 ft above
    the finished ground at any point. A cellar is not a story; an unfinished attic without human
    occupancy is not a story. The stories limit is computed at the main entrance side.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [13, 14]
      quote: "STORY — The portion of a building which is between one floor level and the next higher floor level or the roof."
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [14, 17]
      quote: "A mezzanine, as defined in the New York State Uniform Fire Prevention and Building Code, is not a story. A basement shall be deemed to be a story when the finished surface of the floor next above is 1) more than six feet above grade plane or 2) more than 12 feet above the finished ground level at any point. A cellar shall not be deemed a story."
    - file: chapter_325_zoning_2026-10.pdf
      page: 19
      lines: [17, 18]
      quote: "An attic shall not be deemed to be a story if unfinished and without human occupancy."
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines: [35, 36]
      quote: "Buildings hereafter erected shall be limited to the number of stories herein specified, computed at the main entrance side."
  open_questions:
    - "Which entrance is the \"main entrance\" when a house has more than one?"
    - "The basement test says \"12 feet above the finished ground level at any point\", while stories are \"computed at the main entrance side\". Does the 12 ft test look at every side, or only the main entrance side?"
  drafted_by: claude
  status: draft

basement:
  term: BASEMENT
  says: Partly below ground, with more than half its floor-to-ceiling height above the finished ground at some point.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [10, 11]
      quote: "BASEMENT — That space of a building that is partly below grade which has more than half of its height, measured from floor to ceiling, above the finished ground level at any point."
  drafted_by: claude
  status: draft

cellar:
  term: CELLAR
  says: Partly or entirely below ground, with more than half its floor-to-ceiling height below the curb level or the ground next to the building.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 6
      lines: [6, 8]
      quote: "CELLAR — That space of a building that is partly or entirely below grade which has more than half of its height, measured from floor to ceiling, below the average established curb level or finished grade of the ground adjoining the building."
  drafted_by: claude
  status: draft

building_area:
  term: BUILDING AREA (lot coverage)
  measures: [building_area]
  says: >
    The total area, on a horizontal plane at the main grade level, of the main building and all accessory
    buildings, including porches, decks (attached or free-standing), balconies projecting more than 2 ft,
    ramps and landings. It doesn't include parking areas and parking spaces; pergolas, terraces and
    patios are exempt from lot coverage. Lot coverage = this total divided by the total lot area.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [23, 25]
      quote: "BUILDING AREA — The total area (taken on a horizontal plane at the main grade level) of the principal building and all accessory buildings, including porches, attached or free standing decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings."
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [27, 28]
      quote: "but shall not include parking areas and parking spaces. Pergolas and terraces and patios shall be exempt from total lot coverage requirements."
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines: [9, 10]
      quote: "This sum, divided by the total lot area, shall not exceed the maximum allowed percentage of lot coverage specified in this column."
  open_questions:
    - "Does the floor area of a garage (attached or detached) count as building area, or is it excluded as a \"parking space\"?"
    - "\"Taken on a horizontal plane at the main grade level\": is coverage the footprint at grade, or the outline of everything above ground (upper floors that overhang, roof eaves)?"
  drafted_by: claude
  status: draft

lot:
  term: LOT
  measures: [lot_area]
  says: A portion or parcel of land, considered as a unit, devoted to a use or occupied by a building or group of buildings. (Lot area itself isn't defined; see the open question.)
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 14
      lines: [34, 35]
      quote: "LOT — A portion or parcel of land, considered as a unit, devoted to a certain use or occupied by a building or a group of buildings"
  open_questions:
    - "\"Lot area\" itself isn't defined. We take it as the area inside the lot lines from a survey. Confirm, and say what to use when there's no survey (the tax parcel map can differ: 106 Ithaca Rd is ~7,034 sf on the tax map vs 6,674.7 sf in the architects' model)."
  drafted_by: claude
  status: draft

lot_width:
  term: LOT WIDTH (minimum lot size, width in feet at street line)
  measures: [lot_width]
  says: The lot's frontage measured along the street (public right-of-way).
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines: [31, 31]
      quote: "Column 7: Minimum Lot Size, Width in Feet at Street Line. Lots hereafter used for a permitted"
    - file: chapter_325_zoning_2026-10.pdf
      page: 24
      lines: [32, 33]
      quote: "shall have frontage measured on a public right-of-way equal to or greater than the width specified in this column"
  open_questions:
    - "For a curved street line (like 106 Ithaca Rd), is frontage measured along the curve or as a straight line between the side lot corners?"
  drafted_by: claude
  status: draft

lot_depth:
  term: LOT DEPTH (for the rear yard percentage)
  measures: [lot_depth]
  says: >
    The rear yard percentage is taken of the lot depth. If the two side lot lines are of unequal lengths,
    it's taken of the average of the two lengths.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines: [24, 26]
      quote: "Such percentage shall be taken of the lot depth. If the two side lot lines are of unequal lengths, the rear yard percentage shall be taken of the average of the two lengths."
  open_questions:
    - "A lot with more than two side lot lines (106 Ithaca Rd has a 10.47 ft jog): which lines count as \"the two side lot lines\"?"
    - "When the two side lot lines are equal, is the lot depth simply their length? (Implied, but not stated.)"
  drafted_by: claude
  status: draft

yard:
  term: YARD
  says: The part of the lot not occupied by the main building, which must stay open from the ground up unless the code allows otherwise.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [28, 29]
      quote: "YARD — That part of a lot not occupied by the principal building or structure and which shall not be occupied by any other building or structure from the ground upward"
  drafted_by: claude
  status: draft

front_yard:
  term: FRONT YARD
  measures: [front_yard]
  says: The open space across the full width of the lot between the main building and the front lot line. Its depth is the shortest distance from the front lot line to the front of the building.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [31, 32]
      quote: "FRONT YARD — An open space extending the full width of the lot between a main building and the front lot line"
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [33, 34]
      quote: "the depth of which shall be the least distance between the front lot line and the front of such main building."
  drafted_by: claude
  status: draft

side_yard:
  term: SIDE YARD
  measures: [side_yard_smaller, side_yard_larger]
  says: >
    The open space between the building and each side lot line, measured from the nearest point of the
    lot line to the nearest part of any building. Every building needs two side yards: one at least the
    "one side" figure, the other at least the "other side" figure.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [37, 38]
      quote: "The required width of side yards shall be measured horizontally from the nearest point of the side lot line to the nearest part of any building."
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines: [19, 20]
      quote: "district must have two side yards as specified in this column and Column 12. One side yard shall be at least as wide as specified in this column"
  drafted_by: claude
  status: draft

rear_yard:
  term: REAR YARD
  measures: [rear_yard]
  says: >
    The open space across the full width of the lot between the rearmost main building and the rear lot
    line. Its depth is the shortest distance from the rear lot line to the back of the building. On a
    corner lot or through-block lot, the rear yard is the yard on the side of the lot opposite the
    street whose address the lot bears.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [39, 40]
      quote: "REAR YARD — An open space extending the full width of a lot between the rearmost main building and the rear lot line"
    - file: chapter_325_zoning_2026-10.pdf
      page: 20
      lines: [41, 42]
      quote: "the depth of which shall be the least distance between the rear lot line and the rear of such main building."
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines: [34, 34]
      quote: "(d) On a corner lot or through-block lot, the yard on the opposite side of the lot from the street"
    - file: chapter_325_zoning_2026-10.pdf
      page: 26
      lines: [3, 3]
      quote: "whose address the lot bears shall be designated as the rear yard."
  drafted_by: claude
  status: draft

yard_projections:
  term: PORCHES AND PROJECTIONS IN YARDS
  measures: [front_yard, side_yard_smaller, side_yard_larger, rear_yard]
  says: >
    Porches, decks, balconies sticking out more than 2 ft, ramps and landings count as part of the building
    for yards and lot coverage. Window sills, cornices, eaves and similar features may stick into a
    required yard by up to 2 ft.
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines: [9, 11]
      quote: "All porches, attached or freestanding decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings shall be considered a part of the building in both the determination of required yards and lot coverage."
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines: [15, 16]
      quote: "provided, however, that such features shall not project more than two feet into any required yard."
  open_questions:
    - "Is a yard's depth measured to the wall (ignoring sills, cornices and eaves that project up to 2 ft), or to the outermost eave? If an eave projects more than 2 ft, is the yard measured to the eave?"
  drafted_by: claude
  status: draft
