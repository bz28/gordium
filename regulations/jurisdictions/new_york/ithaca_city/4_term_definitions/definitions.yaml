building_area:
  term: BUILDING AREA (lot coverage)
  measures: [building_area]
  sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [23, 25]
      quote: "BUILDING AREA — The total area (taken on a horizontal plane at the main grade level) of the principal building and all accessory buildings, including porches, attached or free standing decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings."
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines: [25, 29]
      quote: "The total building area shall be used for determining required yards and maximum percentage of allowed lot coverage but shall not include parking areas and parking spaces. Pergolas and terraces and patios shall be exempt from total lot coverage requirements. However, neither pergolas or terraces and patios above grade shall be located in a required yard."
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines: [5, 10]
      quote: "Column 10: Maximum Percentage of Lot Coverage by Buildings. On a lot hereafter used, no greater percentage of total lot area may be covered by principal and accessory buildings above ground. For this purpose, the area covered by principal and accessory buildings shall include all porches, attached or freestanding decks, balconies projecting more than two feet from a building or structure, ramps, and/or landings. This sum, divided by the total lot area, shall not exceed the maximum allowed percentage of lot coverage specified in this column."
  open_questions:
  - Do roof eaves count toward Column 10 coverage, and if so beyond what depth?
  research:
  - question: Do roof eaves count toward Column 10 coverage, and if so beyond what depth?
    searched:
    - 325-8A
    - 325-3B:building_area
    - 325-18A
    - 325-18B
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines:
      - 15
      - 16
      quote: such features shall not project more than two feet into any required yard
    why_open: Nothing says whether eaves count. Leaving out eaves up to 2 ft follows §325-18B and the 2 ft balcony
      threshold only by analogy (weak), and no City record was found.
    readings:
    - id: eaves_not_counted
      reading: eaves don't count
    - id: eaves_over_2ft_counted
      reading: the part of an eave beyond 2 ft counts
    - id: eaves_counted
      reading: eaves count in full
    report: docs/research/2026-10-20_architect_questions.md §3.2
  findings:
  - id: garages_count
    question: Does the floor area of a garage (attached or detached) count as building area, or is it excluded as
      a "parking space"?
    kind: reading
    answer: Garages count, attached or detached, and so do carports; "parking areas and parking spaces" means open,
      uncovered parking.
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 5
      lines:
      - 27
      - 27
      quote: shall not include parking areas and parking spaces
    - rank: 2
      cite: 'BZA Appeal #3093, 412 E. Yates St (2018): the new garage counted in lot coverage; corner-lot columns'
      url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_04032018-1576
      quote: The new garage will increase the lot coverage from 48% to 52%
    - rank: 2
      cite: 'BZA Appeal #3254, 409 Willow Ave (2023): the applicant counted the detached garage (practitioner evidence)'
      url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_07112023-2702
    still_open: []
    strength: city_practice
    confirm_with: the City zoning office
    report: docs/research/2026-10-20_architect_questions.md §3.1
  - id: coverage_seen_from_above
    question: '"Taken on a horizontal plane at the main grade level" (§325-3) vs "covered by principal and accessory
      buildings above ground" (Column 10): is coverage the footprint at grade, or the outline of everything above
      ground (upper floors that overhang, roof eaves)?'
    kind: reading
    answer: 'Coverage is the outline, seen from above, of everything above ground: walls, cantilevered upper floors,
      roofed porches, decks, balconies projecting more than 2 ft, ramps and landings. Parts wholly below ground don''t
      count. Roof eaves are still open (the open question above).'
    sources:
    - file: chapter_325_zoning_2026-10.pdf
      page: 25
      lines:
      - 6
      - 7
      quote: covered by principal and accessory buildings above ground
    - file: chapter_325_zoning_2026-10.pdf
      page: 49
      lines:
      - 10
      - 11
      quote: shall be considered a part of the building in both the determination of required yards and lot coverage
    - rank: 2
      cite: 'BZA, ZONE-25-12, 132 Cherry St (3 Mar 2026): the front yard is measured to the overhanging upper floors'
      url: https://www.cityofithacany.gov/AgendaCenter/ViewFile/Agenda/_03032026-3164
      quote: would provide a front yard of 3.5'
    still_open:
    - building_area#1
    strength: strong
    confirm_with: the City zoning office
    report: docs/research/2026-10-20_architect_questions.md §3.2
  drafted_by: claude
  status: draft

