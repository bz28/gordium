# Primary uses in the City of Ithaca's residential (chart p.2) and commercial (chart p.4) districts, as the zoning
# charts name them. These ids are the only values the `use` measurement may take in any rule.
# Each quote is the city's exact row label (verified by `python -m rule_format`).
# Accessory uses (garages, ADUs, home occupations...): later. The commercial districts' uses (chart p.4) follow the
# residential ones; a name the two charts both use ("Church or related building") is one use.

