# Primary uses in the City of Ithaca's residential districts, as named in the zoning charts (page 2).
# These ids are the only values the `use` measurement may take in residential rules.
# Each quote is the city's exact row label (verified by `python -m rule_format`).
# Accessory uses (garages, ADUs, home occupations...) and non-residential districts' uses: later.

