  325-7B:
    - what: A yard required for one building can't also count for another building
      all:
        status: flag
        rules: [yards_not_shared]
        why: Gordium measures yards from the main building only. With two or more primary buildings on the lot,
          yards_not_shared always needs review (one primary building, nothing on the lot can share its yards); how
          the yards between two buildings divide is an open question (docs/research/2026-10-27_audit_gaps.md §5).
