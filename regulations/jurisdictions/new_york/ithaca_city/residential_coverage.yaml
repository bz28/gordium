  325-7A:
    - what: Every building and use conforms to its district's regulations
      all:
        status: not_applicable
        why: No requirement of its own beyond the district's regulations, each of which is its own row here (the
          checker applies the lot's zone's whole rulebook, rulebook.rulebook_for).
