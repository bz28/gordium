  325-3B:home_occupation:
    - lines: [[12, 26, 30], [13, 3, 17], [13, 20, 34]]
      what: What a home occupation is and how it must run (in the dwelling or an accessory building, by a resident;
        no more than two outside employees; no exterior display, storage or nuisance; traffic and parking; no retail)
      all:
        status: flag
        rules: [home_occupation]
        also: [home_occupation_size]
        why: How a home occupation runs isn't drawn; once the architect says one is planned, home_occupation always
          needs review, for these conditions and the special permit (§325-9B(1)(i)).
        quote: which meets the following additional conditions
    - lines: [[13, 18, 19]]
      what: "(f) At most 25% of the dwelling unit and 500 indoor square feet, accessory structures included"
      all:
        status: rulebook
        rules: [home_occupation_size]
        note: From the architect's stated floor areas (the occupation's, accessory structures included, and its
          dwelling unit's); 25% read as of the unit's floor area (the rule's finding quarter_by_floor_area, a reading
          to confirm with the architects).

