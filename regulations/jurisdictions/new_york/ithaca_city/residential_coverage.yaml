# Residential coverage decisions: what a person decided about each piece of Chapter 325 labeled `rule` or `flag`,
# for each residential district. The table built from it is 6_coverage_report/residential_districts.md
# (`python -m section_labeling audit`; never hand-edit the table). Code checks every decision against the files
# (packages/section_labeling/section_labeling/district_audit.py): a rule named here must exist and cite the piece
# (or say why in `mapped`); every rule that cites a piece must be named; a not_applicable, parked or flag decision
# quotes the law, and the quote must occur exactly once, word for word, where it says (code can't check that the
# words support the decision: the table lists each such reading for a person to check); a parked item must be on the
# list below.
#
# Each piece is a list of parts. A part has `what` (in plain words) and a decision for `all` districts and/or for
# named districts ("R-1a, R-1b": overrides `all`). A decision:
#   status: rulebook | flag | parked | open_question | not_applicable | missing
#   rules: [rule ids without the district, e.g. lot_coverage; lot_area_* for every lot-area rule]
#   mapped: why the rules named cover it although they don't cite the piece (shown as Gordium's mapping)
#   also: [rules that cite the piece but cover none of this part]
#   why: the reason, in plain words
#   quote: the law's own words (not_applicable, parked, flag; a part's `quote` serves its decisions that give none),
#     found once on `page` (of `file`: Chapter 325 by default, or the zoning chart), or else inside `piece` (default:
#     this piece); a chart quote names its `cell` ({section, row}), whose line it must be, and the district's own cell
#     there must be "-"
#   item: the parked item (parked);  link: path#heading (open_question)
#   priority: high | medium | low | operational | other_project (missing);  note: anything else
# Drafted by Claude (Lane D, queue item 10, 2026-10-27) from the law's text; a second reading, not an architect's.
# The decisions for the rules added by #38 (occupancy, home occupation), #41 (attached buildings of three to six),
# #42 (primary buildings, §325-8B(1)), #43 (§325-7B shared yards, the South Hill Overlay) and #44 (§325-26 streams)
# added by Claude (coverage lane, 2026-10-28) from those rules and the law's text; the accessory dwelling unit
# decisions (§325-3B, §325-8A, §325-8B, §325-25, §325-28) by Claude (ADU lane, 2026-10-29) from the adu_* rules.

districts: [R-1a, R-1b, R-2a, R-2b, R-2c, R-3a, R-3aa, R-3b, RU]

# Ben's later list (2026-10-25: finish the queue first, then pick from these). Accessory dwelling units, parked by
# the queue item 10 brief (2026-10-27), are now checked (the adu_* rules, 2026-10-29).
parked:
  corner_lot_front: {name: "Corner lots: which side is the front", decided: "Ben's later list, 2026-10-25"}
  historic_flood: {name: "Historic district and flood zone lookups", decided: "Ben's later list, 2026-10-25"}
  slope: {name: "Real ground slope (lots are treated as flat; on a sloping lot height and stories need review)", decided: "Ben's later list, 2026-10-25"}
  survey_import: {name: "Survey import (CAD/PDF)", decided: "Ben's later list, 2026-10-25"}
  non_residential: {name: "Non-residential districts", decided: "Ben's later list, 2026-10-25"}
  chimney_fence: {name: "Chimneys, fences and other objects (how objects are identified in the model needs Ben's OK)",
                  decided: "Ben's later list, 2026-10-25"}
  parking: {name: "Parking (typed count and read from the drawing): on hold", decided: "Ben's later list, 2026-10-25"}

# Reused decisions.
_unlisted_why: &unlisted_why "Not a use the residential chart (p.2) lists for any residential district, so it isn't
  permitted there (§325-8A(2) says the permitted uses are listed). Gordium accepts only the chart's uses
  (4_term_definitions/uses.yaml)."
_operational: &operational
  status: missing
  priority: operational
  why: Governs how the property is used or run (or a permit for it), not what is drawn; no rule or flag.
_nonconforming: &nonconforming
  status: missing
  priority: low
  why: Gordium checks a design as new construction; existing nonconforming uses, buildings and lots (Article VI)
    are never asked about.
_wireless: &wireless
  status: missing
  priority: other_project
  why: Personal wireless service facilities (Article V-A) are a different kind of project from a building on a
    residential lot; nothing covers them.
_multiple_not_permitted: &multiple_not_permitted
  status: not_applicable
  why: A multiple dwelling isn't permitted in this district (chart p.2, "-").
  file: zoning_charts_2026-04.pdf
  page: 2
  quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
  cell: {section: Primary Uses, row: "Multiple family dwelling [fn4]"}
_unit_facilities: &unit_facilities
  status: missing
  priority: low
  why: Nothing checks that each unit has what the definition requires (its own entrance; the kitchen, sanitary and
    sleeping facilities); a massing model shows no rooms. Research §6 (docs/research/2026-10-20_architect_questions.md)
    reads it as a category the stated house type carries, so a design is only as right as that statement.
_accessory_sp: &accessory_sp
  status: missing
  priority: medium
  why: No rule or flag asks about the accessory uses that need a special permit other than a home occupation
    (R-x.home_occupation flags one, §325-9B(1)(i)), namely an antenna or dish over 6 ft, in the front yard or over 10 ft
    tall; telecommunications facilities; a tower for electricity; a neighborhood garden; neighborhood
    parking.
_no_yard_object: &no_yard_object
  status: missing
  priority: low
  why: No rule names pergolas or raised terraces and patios; one is checked only if drawn as a solid on the
    Building layer touching the house (then it is measured as part of the building).

pieces:
  325-3B:accessory_dwelling_unit:
    - quote: "A smaller, secondary dwelling unit located on the same lot"
      lines: [[4, 7, 8]]
      what: What an accessory dwelling unit is (a second dwelling unit on the lot of a primary structure)
      all: {status: rulebook, rules: [adu_one_per_parcel]}
      # R-1's occupancy rule cites the definition only to send an owner-occupied house with an ADU on the lot to
      # review (the owner-and-ADU open question); it checks nothing the definition requires of the ADU.
      R-1a, R-1b: {status: rulebook, rules: [adu_one_per_parcel], also: [occupancy_one_family]}
      RU: {status: rulebook, rules: [adu_not_permitted]}
    - quote: "An ADU must have a separate entrance from the outside of the building or through a common hall"
      lines: [[4, 8, 11]]
      what: What an ADU must have (a separate entrance; living, cooking, sanitary and sleeping facilities; the
        building code for residential use)
      all:
        status: missing
        priority: low
        why: &adu_inside_all The inside of the unit (its entrance, kitchen, bathroom and bedrooms) and the building
          code are the plans' review, not what a massing model shows; no rule or flag.
        also: [adu_one_per_parcel]
      R-1a, R-1b:
        status: missing
        priority: low
        why: *adu_inside_all
        also: [adu_one_per_parcel, occupancy_one_family]
      RU: {status: missing, priority: low, why: *adu_inside_all, also: [adu_not_permitted]}

  325-3B:building_area:
    - lines: [[5, 23, 28]]
      what: What counts toward lot coverage (principal and accessory buildings, porches, decks, balconies over 2 ft,
        ramps, landings)
      all: {status: rulebook, rules: [lot_coverage]}
      R-3aa: {status: rulebook, rules: [lot_coverage], also: [stories]}
    - lines: [[5, 27, 29]]
      what: Pergolas, and terraces and patios above grade, kept out of required yards
      all: &yard_object_here
        status: missing
        priority: low
        why: No rule names pergolas or raised terraces and patios; one is checked only if drawn as a solid on the
          Building layer touching the house (then it is measured as part of the building).
        also: [lot_coverage]
      R-3aa:
        status: missing
        priority: low
        why: No rule names pergolas or raised terraces and patios; one is checked only if drawn as a solid on the
          Building layer touching the house (then it is measured as part of the building).
        also: [lot_coverage, stories]

  325-3B:cooperative_household:
    - what: Four or more unrelated persons in one unit make it a multiple dwelling
      all:
        status: missing
        priority: low
        why: No rule names a cooperative household. The occupancy rules (occupancy_one_family, occupancy_two_family)
          keep four or more unrelated people in one unit from passing as a one- or two-family dwelling (at most two
          unrelated per unit; one in RU; a two-family unit with more than one goes to review in R-3 and RU), but
          nothing tells the architect that such a household makes the unit a multiple dwelling.

  325-3B:dwelling_one_family:
    - what: Who may occupy a one-family dwelling (one unrelated person, or two in R-1 when owner-occupied and in
        R-2/R-3)
      all:
        status: rulebook
        rules: [occupancy_one_family]
        note: From the architect's stated count of unrelated people in the most crowded unit (R-1 and R-2 leave minor
          dependent children out, §325-8B(6); R-3 and RU count them). R-1's two unrelated people need the owner living
          in the house; RU keeps the definition's base limit of one. A household stated to be a functional family unit
          over the limit goes to review.
      R-3a, R-3aa, R-3b:
        status: rulebook
        rules: [occupancy_one_family]
        also: [abutting_r1]
        note: From the architect's stated count of unrelated people in the most crowded unit, minor dependent children
          counted (§325-8B(6) leaves them out in R-1 and R-2 only). A household stated to be a functional family unit
          over the limit goes to review.

  325-3B:one_family_attached_dwelling:
    - lines: [[8, 11, 14]]
      what: An attached building holds three to six one-family dwellings
      all: &attached_not_permitted
        status: not_applicable
        why: A one-family attached dwelling isn't permitted in this district (chart p.2, "-").
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "One-family dwelling, attached [fn4] - - - - SP • • • •"
        cell: {section: Primary Uses, row: "One-family dwelling, attached [fn4]"}
      R-2c: {status: rulebook, rules: [attached_units_per_building], also: [lot_area_one_family_attached]}
      R-3a, R-3aa, R-3b, RU:
        status: rulebook
        rules: [attached_units_per_building]
        note: From the architect's stated count of dwelling units in the whole attached building, every lot it
          stands on (attached_units_in_building); the massing model shows only this lot's part of it.
    - lines: [[8, 11, 14]]
      what: Each dwelling shares a party wall or structure and has direct exterior access from the ground floor
      all: *attached_not_permitted
      R-2c:
        status: missing
        priority: low
        why: Nothing checks party walls or each unit's own ground-floor door; a massing model shows neither.
        also: [attached_units_per_building, lot_area_one_family_attached]
      R-3a, R-3aa, R-3b, RU:
        status: missing
        priority: low
        why: Nothing checks party walls or each unit's own ground-floor door; a massing model shows neither.
        also: [attached_units_per_building]

  325-3B:dwelling_two_family:
    - lines: [[9, 3, 4]]
      what: What a two-family dwelling is (a building containing two dwelling units)
      all:
        status: rulebook
        rules: [lot_area_two_family, lot_width_two_family]
        mapped: The two-family lot size and width apply to the house type this sentence defines, which the architect
          states as the use.
        also: [occupancy_two_family]
      R-1a, R-1b: &two_family_not_permitted
        status: not_applicable
        why: A two-family dwelling isn't permitted in this district (chart p.2, "-").
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]"}
      R-2c: {status: rulebook, rules: [lot_area_two_family], also: [occupancy_two_family]}
    - lines: [[9, 4, 9]]
      what: Who may occupy each unit of a two-family dwelling
      all:
        status: not_applicable
        why: Its occupancy limits name only R-1/CR-1 and R-2/CR-2 zones. (occupancy_two_family flags a unit with more
          than one unrelated person here, under the multiple-dwelling definitions instead.)
        quote: In R-2 and CR-2 Zones, each unit of a two-family dwelling may be occupied
        also: [occupancy_two_family]
      R-1a, R-1b:
        status: not_applicable
        why: A two-family dwelling isn't permitted in this district (chart p.2, "-"), whatever this definition's
          R-1 sentence says.
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
        cell: {section: Primary Uses, row: "Two-family dwelling [fn4]"}
      R-2a, R-2b, R-2c:
        status: rulebook
        rules: [occupancy_two_family]
        note: At most two unrelated people in each unit, from the architect's stated count for the most crowded unit
          (minor dependent children left out, §325-8B(6)). Two in a unit goes to review, the open question whether
          they are "roomers or boarders" that would make the building a multiple dwelling (§325-3B DWELLING,
          MULTIPLE (3)).

  325-3B:dwelling_unit:
    - quote: "One or more rooms designed or used for living quarters by one household"
      lines: [[9, 10, 12]]
      what: What a dwelling unit is, as the rules count units and house types
      all:
        status: rulebook
        rules: [use]
        mapped: Each house type the architect states (one-family, two-family, ...) is defined by its dwelling units.
          Research §6 (docs/research/2026-10-20_architect_questions.md) reads the definition as a category, not a
          limit.
      R-3a, R-3b:
        status: flag
        rules: [use]
        mapped: Each house type the architect states is defined by its dwelling units (research §6, a category);
          R-3a's and R-3b's use entry is a flag for the special-permit uses.
      R-3aa, RU:
        status: rulebook
        rules: [lot_area_one_family_attached, lot_area_multiple_family]
        mapped: These lot sizes grow with the dwelling units the architect states (research §6, a category).
      R-2c:
        status: rulebook
        rules: [lot_area_one_family_attached, lot_area_one_family_semi_detached, lot_area_two_family]
    - lines: [[9, 10, 12]]
      what: Each unit has its own entrance and living, cooking, sanitary and sleeping facilities
      all: *unit_facilities
      R-2c:
        status: missing
        priority: low
        why: Nothing checks that each unit has what the definition requires (its own entrance; the kitchen, sanitary
          and sleeping facilities); a massing model shows no rooms.
        also: [lot_area_one_family_attached, lot_area_one_family_semi_detached, lot_area_two_family]

  325-3B:functional_family_unit:
    - what: When unrelated people count as a functional family unit
      all:
        status: flag
        rules: [occupancy_one_family]
        why: Whether a household is a functional family unit is the City's finding on the criteria listed, weighed
          case by case; the one-family occupancy rule sends a household stated to be one, over the unrelated-person
          limit, to review (stated not to be one, the limit decides).
        quote: the following criteria must be present

  325-3B:green_space:
