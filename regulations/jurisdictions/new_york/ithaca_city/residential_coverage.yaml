      what: A rooming unit (counted in the multiple-dwelling lot size)
      all:
        status: missing
        priority: low
        why: The law names a rooming house as a multiple dwelling (§325-3B DWELLING, MULTIPLE (5)), not a rooming unit,
          and R-2c's occupant definition speaks of "other lodging units permitted in R-2c Zones" (p.16). Whether a
          rooming unit can exist here, and what limits it, is not settled; nothing checks it.
      R-3a, R-3aa, R-3b, RU:
        status: rulebook
        rules: [lot_area_multiple_family]
        mapped: Rooming units are in rooming houses, which are multiple dwellings (§325-3B); in R-3a, R-3aa and R-3b
          each room let for profit adds lot area (chart p.3 notes 7 and 8).
    - lines: [[18, 12, 13]]
