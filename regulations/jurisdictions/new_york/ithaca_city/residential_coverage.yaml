# Residential coverage decisions: what a person decided about each piece of Chapter 325 labeled `rule` or `flag`,
# for each residential district. The table built from it is 6_coverage_report/residential_districts.md
# (`python -m section_labeling audit`; never hand-edit the table). Code checks every decision against the files
# (packages/section_labeling/section_labeling/district_audit.py): a rule named here must exist and cite the piece
# (or say why in `mapped`); every rule that cites a piece must be named; the law's words for "not applicable" must
# be on the page; a parked item must be on the later list below.
#
# Each piece is a list of parts. A part has `what` (in plain words) and a decision for `all` districts and/or for
# named districts ("R-1a, R-1b": overrides `all`). A decision:
#   status: rulebook | flag | parked | open_question | not_applicable | missing
#   rules: [rule ids without the district, e.g. lot_coverage; lot_area_* for every lot-area rule]
#   mapped: why the rules named cover it although they don't cite the piece (shown as Gordium's mapping)
#   also: [rules that cite the piece but cover none of this part]
#   why: the reason, in plain words;  quote (+ page, file): the law's own words (not_applicable)
#   item: the later-list item (parked);  link: path#heading (open_question)
#   priority: high | medium | low | operational | other_project (missing);  note: anything else
# Drafted by Claude (Lane D, queue item 10, 2026-10-27) from the law's text; a second reading, not an architect's.

districts: [R-1a, R-1b, R-2a, R-2b, R-2c, R-3a, R-3aa, R-3b, RU]

# Ben's later list (2026-10-25: finish the queue first, then pick from these), plus accessory dwelling units
# (the queue item 10 brief, 2026-10-27; also listed on every result, not_checked_yet.yaml).
parked:
  corner_lot_front: {name: "Corner lots: which side is the front", decided: "Ben's later list, 2026-10-25"}
  historic_flood: {name: "Historic district and flood zone lookups", decided: "Ben's later list, 2026-10-25"}
  slope: {name: "Real ground slope (lots are treated as flat)", decided: "Ben's later list, 2026-10-25"}
  survey_import: {name: "Survey import (CAD/PDF)", decided: "Ben's later list, 2026-10-25"}
  non_residential: {name: "Non-residential districts", decided: "Ben's later list, 2026-10-25"}
  chimney_fence: {name: "Chimneys, fences and other objects (how objects are identified in the model needs Ben's OK)",
                  decided: "Ben's later list, 2026-10-25"}
  parking: {name: "Parking (typed count and read from the drawing): on hold", decided: "Ben's later list, 2026-10-25"}
  adus: {name: "Accessory dwelling units", decided: "queue item 10 brief, 2026-10-27"}

# Reused decisions.
_use_not_listed: &use_not_listed
  status: not_applicable
  why: Not a use the residential chart (p.2) lists for any residential district, so it isn't permitted there
    (permitted uses are listed; what is left out is not, §325-8B(3)). Gordium accepts only the chart's uses
    (4_term_definitions/uses.yaml).
  quote: except where otherwise indicated by specific prohibition or omission
  page: 26
_occupancy: &occupancy
  status: missing
  priority: medium
  why: No rule counts unrelated occupants or checks who may live in a dwelling unit; the model can't show it and
    the architect isn't asked.
  note: Lane B is drafting occupancy rules on a branch stacked on r3-hand (not in this rulebook yet).
_operational: &operational
  status: missing
  priority: operational
  why: Governs how the property is used or run (or a permit for it), not what is drawn; no rule or flag.
_nonconforming: &nonconforming
  status: missing
  priority: low
  why: Gordium checks a design as new construction; existing nonconforming uses, buildings and lots (Article VI)
    are never asked about.
_wireless: &wireless
  status: missing
  priority: other_project
  why: Personal wireless service facilities (Article V-A) are a different kind of project from a building on a
    residential lot; nothing covers them.
_multiple_not_permitted: &multiple_not_permitted
  status: not_applicable
  why: A multiple dwelling isn't permitted in this district (chart p.2, "-").
  file: zoning_charts_2026-04.pdf
  page: 2
  quote: "Multiple family dwelling [fn4] - - - - - • • • •[fn5]"
_unit_facilities: &unit_facilities
  status: missing
  priority: low
  why: Nothing checks that each unit has what the definition requires (its own entrance; the kitchen, sanitary and
    sleeping facilities); a massing model shows no rooms. Research §6 (docs/research/2026-10-20_architect_questions.md)
    reads it as a category the stated house type carries, so a design is only as right as that statement.
_accessory_sp: &accessory_sp
  status: missing
  priority: medium
  why: No rule or flag asks about the accessory uses that need a special permit (a home occupation unless it meets
    four conditions; an antenna or dish over 6 ft, in the front yard or over 10 ft tall; a tower for electricity;
    a neighborhood garden; neighborhood parking).
  note: Home occupations are being drafted on Lane B's branch.
_no_yard_object: &no_yard_object
  status: missing
  priority: low
  why: No rule names pergolas or raised terraces and patios; one is checked only if drawn as a solid on the
    Building layer touching the house (then it is measured as part of the building).

pieces:
  325-3B:accessory_dwelling_unit:
    - what: What an accessory dwelling unit is and must have
      all: {status: parked, item: adus}

  325-3B:building_area:
    - what: What counts toward lot coverage (principal and accessory buildings, porches, decks, balconies over 2 ft,
        ramps, landings)
      all: {status: rulebook, rules: [lot_coverage]}
      R-3aa: {status: rulebook, rules: [lot_coverage], also: [stories]}
    - what: Pergolas, and terraces and patios above grade, kept out of required yards
      all: *no_yard_object

  325-3B:cooperative_household:
    - what: Four or more unrelated persons in one unit make it a multiple dwelling
      all: *occupancy

  325-3B:dwelling_one_family:
    - what: Who may occupy a one-family dwelling (one unrelated person, or two in R-1 when owner-occupied and in
        R-2/R-3)
      all: *occupancy
      R-3a, R-3aa, R-3b:
        status: missing
        priority: medium
        why: No rule counts unrelated occupants or checks who may live in a dwelling unit; the model can't show it and
          the architect isn't asked.
        note: Lane B is drafting occupancy rules on a branch stacked on r3-hand (not in this rulebook yet).
        also: [abutting_r1]

  325-3B:one_family_attached_dwelling:
    - what: An attached building holds three to six one-family dwellings, each with its own ground-floor door
      all:
        status: not_applicable
        why: A one-family attached dwelling isn't permitted in this district (chart p.2, "-").
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "One-family dwelling, attached [fn4] - - - - SP • • • •"
      R-2c: {status: rulebook, rules: [attached_units_per_building], also: [lot_area_one_family_attached]}
      R-3a, R-3aa, R-3b, RU:
        status: missing
        priority: medium
        why: No rule holds an attached building to three to six dwelling units here (R-2c.attached_units_per_building
          does it from the stated attached_units_in_building), so a row of eight units can pass.

  325-3B:dwelling_two_family:
    - what: Who may occupy each unit of a two-family dwelling
      all:
        status: not_applicable
        why: Its occupancy limits name only R-1/CR-1 and R-2/CR-2 zones.
        quote: In R-2 and CR-2 Zones, each unit of a two-family dwelling may be occupied
      R-1a, R-1b:
        status: not_applicable
        why: A two-family dwelling isn't permitted in this district (chart p.2, "-"), whatever this definition's
          R-1 sentence says.
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "Two-family dwelling [fn4] - - • • • • • • •"
      R-2a, R-2b: *occupancy
      R-2c:
        status: missing
        priority: medium
        why: No rule counts unrelated occupants or checks who may live in a dwelling unit; the model can't show it
          and the architect isn't asked.
        note: Lane B is drafting occupancy rules on a branch stacked on r3-hand (not in this rulebook yet).
        also: [lot_area_two_family]

  325-3B:dwelling_unit:
    - what: What a dwelling unit is, as the rules count units and house types
      all:
        status: rulebook
        rules: [use]
        mapped: Each house type the architect states (one-family, two-family, ...) is defined by its dwelling units.
          Research §6 (docs/research/2026-10-20_architect_questions.md) reads the definition as a category, not a
          limit.
      R-3a, R-3b:
        status: flag
        rules: [use]
        mapped: Each house type the architect states is defined by its dwelling units (research §6, a category);
          R-3a's and R-3b's use entry is a flag for the special-permit uses.
      R-3aa, RU:
        status: rulebook
        rules: [lot_area_one_family_attached, lot_area_multiple_family]
        mapped: These lot sizes grow with the dwelling units the architect states (research §6, a category).
      R-2c:
        status: rulebook
        rules: [lot_area_one_family_attached, lot_area_one_family_semi_detached, lot_area_two_family]
    - what: Each unit has its own entrance and living, cooking, sanitary and sleeping facilities
      all: *unit_facilities

  325-3B:functional_family_unit:
    - what: When unrelated people count as a functional family unit
      all: *occupancy

  325-3B:green_space:
    - what: Green space, at least 75% softscape, where a minimum applies
      all:
        status: not_applicable
        why: The residential chart sets a green-space minimum only for RU (chart p.3, note 13).
        quote: Where a minimum green space requirement applies
      RU: {status: flag, rules: [green_space]}

  325-3B:height_of_building:
    - what: How building height is measured
      all: {status: rulebook, rules: [height, yard_projections]}

  325-3B:home_occupation:
    - what: Home occupations (conditions; chart p.2 marks them SP in every residential district)
      all:
        status: missing
        priority: medium
        why: No rule or flag asks whether the dwelling holds a home occupation (§325-9B(1)(i) needs a special
          permit unless it meets four conditions).
        note: Lane B is drafting home-occupation rules on a branch stacked on r3-hand.

  325-3B:large_beverage_producer:
    - what: Large beverage producers (production cap, silo height)
      all: *use_not_listed

  325-3B:neighborhood_commercial_facility:
    - what: What a neighborhood commercial facility may sell
      all:
        status: flag
        rules: [use]
        mapped: A neighborhood commercial facility is a special-permit use here (chart p.2, SP), so the use entry
          says needs review.
      R-1a, R-1b, RU:
        status: not_applicable
        why: Not permitted in this district (chart p.2, "-").
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "Neighborhood commercial facility - - SP SP SP SP SP SP -"

  325-3B:occupant:
    - what: Who counts as an occupant (R-2c), for the lot sizes that grow with occupants
      all:
        status: not_applicable
        why: The definition is for R-2c only.
        quote: In R-2c Zones only
      R-2c: {status: rulebook, rules: [lot_area_one_family_detached]}
    - what: Least habitable space per occupant (sleeping rooms 80/120/180/240 sf..., unit 150/250/350/450 sf...)
      all:
        status: not_applicable
        why: The definition is for R-2c only.
        quote: In R-2c Zones only
      R-2c:
        status: missing
        priority: medium
        why: No rule checks the sleeping-room and unit floor areas each occupant needs; Gordium doesn't model rooms.
        note: Lane B is drafting occupancy rules on a branch stacked on r3-hand.

  325-3B:rooming_house:
    - what: A rooming house (a multiple dwelling, §325-3B DWELLING, MULTIPLE (5)) and what it must include
      all: *multiple_not_permitted
      R-3a, R-3aa, R-3b, RU:
        status: rulebook
        rules: [lot_area_multiple_family]
        mapped: A rooming house is a multiple dwelling (§325-3B DWELLING, MULTIPLE (5)), checked by the
          multiple-dwelling lot size.
    - what: It must include complete kitchen facilities or a separate entrance
      all: *multiple_not_permitted
      R-3a, R-3aa, R-3b, RU: *unit_facilities

  325-3B:rooming_unit:
    - what: A rooming unit and what it must include
      all: *multiple_not_permitted
      R-3a, R-3aa, R-3b, RU:
        status: rulebook
        rules: [lot_area_multiple_family]
        mapped: Rooming units are in rooming houses, which are multiple dwellings (§325-3B); in R-3a, R-3aa and R-3b
          each room let for profit adds lot area (chart p.3 notes 7 and 8).
    - what: It must include complete kitchen facilities or a separate entrance
      all: *multiple_not_permitted
      R-3a, R-3aa, R-3b, RU: *unit_facilities

  325-3B:row_house:
    - what: A row house's modules (facade at most 25 ft, one street-facing entry each)
      all: *multiple_not_permitted
      R-3a, R-3aa, R-3b, RU:
        status: missing
        priority: low
        why: A row house is a multiple dwelling (§325-3B DWELLING, MULTIPLE (5)); no rule checks its module widths or
          street-facing entries.

  325-3B:standard_canopy:
    - what: Fixed canopies (at most 4 ft out and 4 ft tall, 8 ft clear above a sidewalk)
      all:
        status: missing
        priority: low
        why: No rule checks canopies; a massing model doesn't draw them.

  325-3B:standard_awning:
    - what: Retractable awnings (at most 4 ft out and 4 ft tall, 7 ft clear above a sidewalk)
      all:
        status: missing
        priority: low
        why: No rule checks awnings; a massing model doesn't draw them.

  325-3B:story:
    - what: What a story is (basements over 6 ft above grade plane or 12 ft above ground count; cellars and
        unfinished attics don't)
      all: {status: rulebook, rules: [stories]}

  325-3B:terrace_or_patio:
    - what: Terraces and patios above grade kept out of required yards
      all: *no_yard_object

  325-3B:trailer_or_travel_trailer:
    - what: Travel trailers (a temporary dwelling at most 8 ft wide and 32 ft long)
      all: *use_not_listed

  325-3B:urban_beverage_producer:
    - what: Urban beverage producers (production cap, silo height)
      all: *use_not_listed

  325-7A:
    - what: Every building and use conforms to its district's regulations
      all:
        status: rulebook
        rules: ["*"]
        mapped: The checker applies the whole rulebook of the lot's zone (rulebook.rulebook_for); it covers what
          this table says it covers and no more.

  325-7B:
    - what: A yard required for one building can't also count for another building
      all:
        status: missing
        priority: medium
        why: Gordium measures yards from one main building; a lot with several main buildings isn't checked
          building by building (see §325-8B(1)).

  325-8A:
    - what: "Column 2: permitted primary uses"
      all: {status: rulebook, rules: [use]}
      R-3a, R-3b: {status: flag, rules: [use]}
    - what: "Column 3: permitted accessory uses (chart p.2: private garage, structure for construction purposes,
        adult day-care home, towers, home occupation, neighborhood parking area, gardens, ADU)"
      all:
        status: missing
        priority: medium
        why: No rule checks the accessory uses on chart p.2 (towers, home occupations and gardens need a special
          permit; a private garage holds at most three cars in R-1 and R-2a/R-2b, six per building in R-2c; a
          structure for construction purposes may stay two years). ADUs and parking are on the later list.
        note: Home occupations are being drafted on Lane B's branch.
    - what: "Column 4: off-street parking"
      all:
        status: parked
        item: parking
        why: The rulebook checks one-family detached houses (parking_one_family) and flags the other uses; the rest
          of §325-20 waits for the parking work.
    - what: "Column 5: off-street loading"
      all: {status: flag, rules: [loading], mapped: "Column 5 is the chart's loading rows (p.14), which R-x.loading flags."}
      R-1a, R-1b:
        status: missing
        priority: low
        why: Chart p.14's "Allowed by variance" row for nonresidential uses has no rule or flag in R-1 (R-1a's
          header says so).
      R-2a, R-2b, R-2c:
        status: missing
        priority: low
        why: R-2x.loading flags a neighborhood commercial facility; chart p.14's "Allowed by variance" row for other
          nonresidential uses has no rule or flag (R-2a.loading's notes say so).
    - what: "Columns 6 and 7: minimum lot area and width"
      all: {status: rulebook, rules: [lot_area_*, lot_width_*], mapped: "Columns 6 and 7 are the chart's lot-size rows (p.3), which these rules check."}
      R-3a, R-3aa, R-3b:
        status: flag
        rules: [lot_area_*, lot_width_*, lot_size_zero_lot_line]
        mapped: Columns 6 and 7 are the chart's lot-size rows (p.3); the zero-lot-line row ("-") is a flag.
    - what: "Columns 8 and 9: stories (counted at the main entrance side) and height"
      all: {status: rulebook, rules: [stories, height]}
    - what: "Column 10: lot coverage (principal and accessory buildings, porches, decks, balconies, ramps, landings)"
      all: {status: rulebook, rules: [lot_coverage]}
    - what: "Columns 11 to 15: front, side and rear yards (the rear yard opposite the address street on a corner or
        through lot)"
      all: {status: rulebook, rules: [front_yard, side_yards, rear_yard, yard_projections], mapped: "Columns 11 to 15 are the chart's yard rows (p.3), which these rules check."}
    - what: "Column 16: minimum height"
      all:
        status: not_applicable
        why: The residential chart (p.3) has no minimum-height row (R-3aa's two-story minimum is chart note 11,
          checked by R-3aa.stories).
        quote: Buildings hereafter erected shall have a minimum height as specified herein

  325-8B:
    - what: "(1) Each additional primary building on the lot needs its own minimum lot area"
      all:
        status: missing
        priority: high
        why: Gordium checks the lot area once, for one main building, and nothing asks how many primary buildings
          are on the lot. With two houses drawn it asks which is the main building; once one is picked, the other
          is read as an accessory building or a deck, so a second house on a lot sized for one can pass.
      RU: {status: flag, rules: [primary_structures]}
    - what: "(2) Landfilling and bulkheading plans need Board of Public Works approval"
      all: {status: missing, priority: low, why: "No flag; a massing model doesn't show fill or bulkheads."}
    - what: "(3) Permitted uses are listed; what is left out is not permitted"
      all: {status: rulebook, rules: [use]}
      R-3a, R-3aa, R-3b: {status: flag, rules: [use, lot_size_zero_lot_line]}
    - what: "(4) A use allowed by special permit or variance follows the stricter district's regulations"
      all:
        status: flag
        rules: [use]
        note: A special-permit use goes to needs review (the use entry), where the stricter regulations are worked out
          by hand.
    - what: "(5) Every use meets the general performance standards (§325-23)"
      all: *operational
    - what: "(6) Minor children aren't counted as unrelated occupants (R-1 and R-2)"
      all: *occupancy
      R-3a, R-3aa, R-3b, RU:
        status: not_applicable
        why: Applies in R-1 and R-2 districts only.
        quote: In R-1 and R-2 Districts, minor dependent children
    - what: "(7), (8), (10): pointers to the NYS Uniform Code, to Article V and to §325-8A(15)"
      all:
        status: not_applicable
        why: Pointers with no requirement of their own; each Article V section is its own row in this table, and the
          Uniform Code is outside Chapter 325.
        quote: All columns established by this section are subject to the supplementary regulations stated in Article V
      R-3aa:
        status: not_applicable
        why: Pointers with no requirement of their own; each Article V section is its own row in this table, and the
          Uniform Code is outside Chapter 325.
        quote: All columns established by this section are subject to the supplementary regulations stated in Article V
        also: [stories]
    - what: "(9) R-3 land that directly abuts R-1 (§325-19E)"
      all:
        status: not_applicable
        why: Applies only to R-3 property next to R-1.
        quote: For special conditions on development of property in R-3 that directly abuts R-1
      R-3a, R-3aa, R-3b: {status: flag, rules: [abutting_r1]}
    - what: "(11) Nonconforming uses and structures follow Article VI"
      all: *nonconforming

  325-8C:
    - what: West End/Waterfront, Cherry Street, Market and Newman districts
      all:
        status: not_applicable
        why: Applies only in those districts.
        quote: Additional restrictions in the West End/Waterfront, the Cherry Street District, the Market District,
          and the Newman Districts

  325-8D:
    - what: CBD districts
      all: {status: not_applicable, why: Applies only in the CBD districts., quote: Additional restrictions in the CBD districts}

  325-8E:
    - what: "South Hill Overlay: no second primary structure on a parcel (R-1 and R-2)"
      all:
        status: missing
        priority: medium
        why: Nothing looks up the South Hill Overlay or asks how many primary structures stand on the parcel.
      R-3a, R-3aa, R-3b, RU:
        status: not_applicable
        why: Applies to R-1 and R-2 property in the overlay only.
        quote: with a zoning designation of R-1 or R-2

  325-9B:
    - what: "Primary uses that need a special permit (cemeteries, utilities, schools, nursery schools, neighborhood
        commercial, hospitals, day care, bed-and-breakfasts)"
      all: {status: rulebook, rules: [use]}
      R-3a, R-3b: {status: flag, rules: [use]}
    - what: Accessory uses that need a special permit
      all: *accessory_sp

  325-9D:
    - what: Criteria the Board uses to grant a special permit, for a primary use
      all:
        status: flag
        rules: [use]
        mapped: A special-permit primary use goes to needs review (the use entry); the criteria are the Board's
          judgment.
    - what: Accessory uses that need a special permit
      all: *accessory_sp

  325-10C:
    - what: "Bed-and-breakfast inns (special-permit conditions)"
      all:
        status: not_applicable
        why: A bed-and-breakfast inn isn't permitted in this district (chart p.2, "-").
        file: zoning_charts_2026-04.pdf
        page: 2
        quote: "Bed-and-breakfast inn - - - - - SP SP SP SP"
      R-3a, R-3aa, R-3b, RU:
        status: flag
        rules: [use]
        mapped: A bed-and-breakfast inn is a special-permit use here (chart p.2), so the use entry says needs review.
    - what: "Neighborhood gardens (special-permit conditions)"
      all:
        status: missing
        priority: low
        why: A garden is an accessory use needing a special permit (chart p.2); nothing asks about one.
    - what: "Schools and related uses (special-permit conditions)"
      all:
        status: flag
        rules: [use]
        mapped: A school is a special-permit use in every residential district (chart p.2), so the use entry says needs
          review.

  325-11B:
    - what: Cluster subdivisions (deviations the Planning and Development Board may approve)
      all:
        status: missing
        priority: low
        why: A cluster subdivision's approved deviations aren't modelled; Gordium checks one lot under the district's
          own rules.
      R-2c, R-3aa, RU:
        status: not_applicable
        why: Cluster subdivisions aren't permitted in this district.
        quote: Cluster subdivisions may only be permitted in the R-1a, R-1b, R-2a, R-2b, R-3a and R-3b Zoning Districts

  325-11C:
    - what: What a cluster subdivision application must show
      all:
        status: missing
        priority: low
        why: An approval process for a subdivision; no flag.
      R-2c, R-3aa, RU:
        status: not_applicable
        why: Cluster subdivisions aren't permitted in this district (§325-11B(1)).
        page: 38
        quote: Cluster subdivisions may only be permitted in the R-1a, R-1b, R-2a, R-2b, R-3a and R-3b Zoning Districts

  325-12C:
    - what: Planned unit development (PUD) intent
      all: {status: not_applicable, why: "A PUD is its own district, made by rezoning.", quote: "In reaching its decision on whether to rezone to a PUD"}
  325-12D:
    - what: PUD uses and limits
      all: {status: not_applicable, why: "A PUD's limits are set by its own rezoning law.", quote: "shall be as set forth in the legislation rezoning the area to a PUD"}
  325-12E:
    - what: PUD site plan approval
      all: {status: not_applicable, why: "Applies within a PUD, its own district.", quote: "No structure shall be erected or placed within a PUD"}
  325-12F:
    - what: PUD criteria
      all: {status: not_applicable, why: "Applies to an application to rezone to a PUD.", quote: "The Common Council will consider an application for any PUD"}
  325-12H:
    - what: PUD conditions
      all: {status: not_applicable, why: "Applies to a rezoning to a PUD.", quote: "In any rezoning to a PUD"}

  325-15A:
    - what: Removing topsoil and grading
      all: *operational
  325-15B:
    - what: Mobile homes follow Chapter 210 (Housing Standards)
      all:
        status: not_applicable
        why: A pointer to Chapter 210, outside Chapter 325; no zoning requirement of its own.
        quote: Mobile homes and mobile home parks shall be in conformity with Article II of Chapter 210
  325-15C:
    - what: No unsanitary storage in the open
      all: *operational
  325-15D:
    - what: Garage sales (how long, how often)
      all: *operational
