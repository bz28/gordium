  R318.7.11.2:
    rules: []
    unresolved:
    - rule: R318.7.11.2.requirement_p101_l42
      why: 'the label cites this and no drafted rule does (a person checks whether it sets a rule): ''R318.7.11.2
        Bulkhead enclosure stairways. Stairways serving bulkhead enclosures, not part of the required building egress,
        providing access from the outside grade level to the basement shall be exempt'''
    problems: []
    reason: R318.7.11.2 sets no requirement on a design. It only exempts bulkhead enclosure stairways from R318.3
      and R318.7 when the stairway is not part of the required building egress, the basement-floor-to-grade height
      is not more than 8 feet, and the grade-level opening is covered by a bulkhead enclosure with hinged doors
      or other approved means. The exemption belongs in the rules drafted from R318.3 and R318.7, which can leave
      out or flag such stairways. Drafting it here would give a rule with nothing to check.
