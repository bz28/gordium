    - 24
    quote: If the handrail is not circular, it shall have a perimeter of not less than 4 inches (102 mm) and not
      greater than 6 1/4 inches (160 mm) and a cross section of not more than 2 1/4 inches (57 mm). Edges shall
      have a radius of not less than 0.01 inch (0.25 mm).
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
