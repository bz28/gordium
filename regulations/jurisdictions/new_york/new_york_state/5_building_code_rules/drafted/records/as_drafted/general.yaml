  topic: means_of_egress
  title: Non-circular handrail perimeter and cross section, Type I (R320.6)
  applies_when: not handrail_circular and handrail_perimeter <= 6.25
  check: handrail_perimeter >= 4 and handrail_perimeter <= 6.25 and handrail_cross_section <= 2.25
