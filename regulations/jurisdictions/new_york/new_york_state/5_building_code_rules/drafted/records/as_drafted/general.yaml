    lines:
    - 50
    - 50
    quote: 'Exception: The minimum net clear opening for grade-floor emergency escape and rescue openings shall
      be 5 square feet (0.465 m[fn2]).'
  examples:
  - given: {}
    parts:
      emergency_escape_opening:
      - id: w1
        name: Window above grade
