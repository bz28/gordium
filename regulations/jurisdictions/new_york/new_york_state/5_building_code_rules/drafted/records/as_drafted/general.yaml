- id: general.r318_7_8_stair_handrail_one_side
  kind: rule
  topic: means_of_egress
  title: Handrail on one side of flights with four or more risers (R318.7.8)
  applies_when: stair_riser_count >= 4
  check: stair_handrail_sides >= 1
  review_when:
  - when: stair_spiral
    reason: Spiral stairways are sent to R318.7.11.1, not drafted by this rule.
  - when: stair_serves_sleeping_loft
    reason: A sleeping loft's stair may follow other limits (R315.5), so this rule does not decide it.
  for_each: stair
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 101
    lines:
    - 32
    - 32
    quote: Handrails shall be provided on not less than one side of each flight of stairs with four or more risers.
  examples:
  - given: {}
    parts:
      stair:
      - id: s1
        name: Main stair
        measures:
          stair_riser_count: 14
          stair_spiral: false
          stair_serves_sleeping_loft: false
          stair_handrail_sides: 1
    rows:
    - part: s1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      stair:
      - id: s1
        name: Main stair
        measures:
          stair_riser_count: 4
          stair_spiral: false
          stair_serves_sleeping_loft: false
          stair_handrail_sides: 0
    rows:
    - part: s1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      stair:
      - id: s1
        name: Porch steps
        measures:
          stair_riser_count: 3
          stair_spiral: false
          stair_serves_sleeping_loft: false
          stair_handrail_sides: 0
    rows:
    - part: s1
      outcome: not_applicable
    expect: not_applicable
  - given: {}
    parts:
      stair:
      - id: s1
        name: Spiral stair
        measures:
          stair_riser_count: 12
          stair_spiral: true
          stair_serves_sleeping_loft: false
          stair_handrail_sides: 1
    rows:
    - part: s1
      outcome: needs_review
    expect: needs_review
  - given: {}
    parts:
      stair: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
  open_questions:
  - Spiral stairways go to R318.7.11.1 and sleeping loft stairs follow R315.5; the exact limits that apply to them
    are drafted from those sections.
  - R318.7.11.2 exempts some bulkhead enclosure stairways from R318.7; no measure says a stair is such a stairway,
    so the architect should say whether this rule applies to it.
  research:
  - question: Spiral stairways go to R318.7.11.1 and sleeping loft stairs follow R315.5; the exact limits that apply
      to them are drafted from those sections.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  - question: R318.7.11.2 exempts some bulkhead enclosure stairways from R318.7; no measure says a stair is such
