district: general
rules:
- id: general.r318_2_egress_door_per_dwelling_unit
  kind: rule
  topic: means_of_egress
  title: One egress door for each dwelling unit (R318.2)
  check: egress_doors >= dwelling_units
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 44
    - 44
    quote: Not less than one egress door shall be provided for each dwelling unit.
  examples:
  - given:
      dwelling_units: 1
      egress_doors: 1
    expect: pass
  - given:
      dwelling_units: 2
      egress_doors: 1
    expect: fail
  open_questions:
  - Egress doors are counted for the whole lot against the lot's dwelling units; for a townhouse split across lots,
    confirm that each unit's own door is counted.
  - R318.2 does not say how a door is marked as the egress door; Gordium relies on the architect's marking.
  research:
  - question: Egress doors are counted for the whole lot against the lot's dwelling units; for a townhouse split
      across lots, confirm that each unit's own door is counted.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  - question: R318.2 does not say how a door is marked as the egress door; Gordium relies on the architect's marking.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
- id: general.r318_2_egress_door_side_hinged
  kind: rule
  topic: means_of_egress
  title: Egress door shall be side-hinged (R318.2)
  check: door_side_hinged
  for_each: egress_door
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 44
    - 46
    quote: The egress door shall be side-hinged, and shall provide a clear width of not less than 32 inches (813
      mm) where measured between the face of the door and the stop, with the door open 90 degrees (1.57 rad).
  examples:
  - given: {}
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures:
          door_side_hinged: true
    rows:
    - part: d1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures:
          door_side_hinged: false
    rows:
    - part: d1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      egress_door: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
  open_questions:
  - Whether a building with no marked egress door fails is covered by the rule requiring one egress door per dwelling
    unit.
  research:
  - question: Whether a building with no marked egress door fails is covered by the rule requiring one egress door
      per dwelling unit.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
