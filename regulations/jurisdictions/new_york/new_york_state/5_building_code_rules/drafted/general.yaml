    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
  revised:
  - field: review_when
    by: Claude for Ben (house egress, remaining pieces, after the comparison)
    date: &id003 2026-11-14
    why: 'R318.7.11.1 is now drafted: a spiral stairway follows R318.7 except where R318.7.11.1 says otherwise (R318.7.11),
      and it says nothing of handrails or of a tread variation (its treads must be identical, which meets 3/8 in).
