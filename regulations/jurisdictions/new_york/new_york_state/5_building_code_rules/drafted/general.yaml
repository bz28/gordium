  findings:
  - id: ladder_encroaches_only_where_required
    question: Does the exception apply only where the ladder is required by R319.4.2 (depth greater than 44 inches)?
    kind: law
    answer: 'Yes. The exception is for "The ladder or steps required by Section R319.4.2", and R319.4.2 requires them only
      in an area well with a vertical depth greater than 44 inches; in a shallower well no ladder or steps are required, so
      none may encroach, and anything else in the required dimensions has no exception at all; still open: whether a ladder
      or steps the open window or door obstructs is the one required (each size rule''s open question on it).'
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 103
      lines:
      - 13
      - 13
      quote: 'Exception: The ladder or steps required by Section R319.4.2 shall be permitted to encroach not more than 6 inches
        (152 mm)'
    - file: gov.ny.residential.2025.pdf
      page: 103
      lines:
      - 15
      - 16
      quote: Area wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with an approved, permanently
        affixed ladder or steps.
    still_open:
    - general.r319_4_1_area_well_min_area#3
    - general.r319_4_1_area_well_min_projection#1
    - general.r319_4_1_area_well_min_width#1
  notes: Drafted by the rule-drafting script.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
  revised:
  - field: review_when
    by: Claude for Ben (house egress review, round 5)
    date: 2026-11-13
    why: 'R319.4.1 exception: the ladder or steps "shall be permitted to encroach not more than 6 inches (152 mm) into the
      required dimensions of the area well". area_well_projection and area_well_width are the well''s own size (parts.yaml),
      and how far a ladder reaches into the well isn''t measured. The AI needed review for a well under 36 in with a ladder,
      so it failed none under 30 in (the least the exception allows), and passed one of 36 in or more with a ladder that may
      reach more than 6 in into it (a false pass on missing data, shown once the full-opening flag became a rule). Now a well
      with a ladder fails under 30 in and needs review from 30 in up, as the answer key does. Cause r319_4_1_ladder_review_too_wide,
      resolutions.yaml.'
  - field: examples
    by: Claude for Ben (house egress review, round 5)
    date: 2026-11-13
    why: 'R319.4.1 exception: the ladder or steps "shall be permitted to encroach not more than 6 inches (152 mm) into the
      required dimensions of the area well". area_well_projection and area_well_width are the well''s own size (parts.yaml),
