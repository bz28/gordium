- id: general.r320_6_handrail_type_ii_recess
  kind: flag
  topic: means_of_egress
  title: 'Handrail with perimeter over 6 1/4 in: finger recess, Type II (R320.6)'
  applies_when: (not handrail_circular and handrail_perimeter > 6.25) and not (handrail_recess_both_sides and handrail_recess_start
    <= 0.75 and handrail_recess_depth >= 0.3125 and handrail_recess_run >= 0.375 and handrail_recess_bottom >= 1.75
    and handrail_width_above_recess >= 1.25 and handrail_width_above_recess <= 2.75)
  for_each: handrail
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 25
    - 26
    quote: Handrails with a perimeter greater than 6 1/4 inches (160 mm) shall have a graspable finger recess area
      on both sides of the profile.
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 26
    - 27
    quote: The finger recess shall begin within 3/4 inch (19 mm) measured vertically from the tallest portion of
      the profile and have a depth of not less than 5/16 inch (8 mm) within 7/8 inch (22 mm) below the widest portion
      of the profile.
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 27
    - 29
    quote: This required depth shall continue for not less than 3/8 inch (10 mm) to a level that is not less than
      1 3/4 inches (45 mm) below the tallest portion of the profile.
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 29
    - 30
    quote: The width of the handrail above the recess shall be not less than 1 1/4 inches (32 mm) and not more than
      2 3/4 inches (70 mm). Edges shall have a radius of not less than 0.01 inch (0.25 mm).
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 20
    - 20
    quote: Required handrails shall be of one of the following types or provide equivalent graspability.
