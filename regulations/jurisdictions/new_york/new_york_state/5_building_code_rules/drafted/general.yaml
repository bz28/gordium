  open_questions:
  - Is a ladder or steps the open window or door obstructs "The ladder or steps required by Section R319.4.2" whose reach
    into the well the exception allows?
  - Does R319.4.1's exception let the 6 in a required ladder or steps may take come off the well's own 36 in, so that a well
    30 to under 36 in with one complies?
  research:
  - question: Is a ladder or steps the open window or door obstructs "The ladder or steps required by Section R319.4.2" whose
      reach into the well the exception allows?
    searched:
    - R319.4.1
    - R319.4.2
    sources:
    - rank: 4
      cite: 'City of Boise, Planning and Development Services handout #438, Emergency escape and rescue openings (03/2022),
        quoting the IRC''s window well sections (R310.2.3)'
      url: https://www.cityofboise.org/media/14485/438_egress-windows-code-hand-out-2022_final.pdf
      quote: 'Exception: The ladder or steps required by Section R310.2.3.1 shall permitted to encroach not more than 6 inches
        (152 mm) into the required dimensions of the window well.'
    - rank: 4
      cite: the same handout, the IRC's ladder sentence of that edition
      url: https://www.cityofboise.org/media/14485/438_egress-windows-code-hand-out-2022_final.pdf
      quote: 'Ladder and steps: Window wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with
        a permanently affixed ladder or steps usable with the window in the fully open position.'
    why_open: 'R319.4.2 requires the ladder or steps of a well over 44 in deep and says they ''shall not be obstructed by
      the emergency escape and rescue opening where the window or door is in the open position'', so the plain reading is
      that an obstructed one isn''t the ladder the exception names and its reach has no exception (a fail); but the exception''s
      words name the ladder the section requires, not one that complies with it, so a reach of 6 in or less by an obstructed
      ladder needs review here, never a fail stricter than every reading. R319.4.2''s own rule fails the obstructed ladder
      either way. For the architects to confirm (BCNYS 1031.5.1, the same words, reads it the same way). Searched (2026-11-26):
      R319.4.1 and R319.4.2 whole, BCNYS 1031.5.1 and 1031.5.2 (the same words), a web search for New York State Department
      of State code interpretations (2026-11-26: none on an obstructed well ladder found; only New York City''s own Building
      Code, a separate code, came up), a web search for ICC commentary on the IRC''s same exception (none found), and building
      departments'' handouts on it: the City of Boise''s quotes the IRC''s earlier wording, where the required ladder or steps
      are those "usable with the window in the fully open position" (which leans toward the plain reading), but none says
      how an obstructed ladder''s reach, or the well''s own size beside a ladder, is read.'
  - question: Does R319.4.1's exception let the 6 in a required ladder or steps may take come off the well's own 36 in, so
      that a well 30 to under 36 in with one complies?
    searched:
    - R319.4.1
    - R319.4.2
    sources:
    - rank: 4
      cite: 'City of Boise, Planning and Development Services handout #438, Emergency escape and rescue openings (03/2022),
        quoting the IRC''s window well sections (R310.2.3)'
      url: https://www.cityofboise.org/media/14485/438_egress-windows-code-hand-out-2022_final.pdf
      quote: 'Exception: The ladder or steps required by Section R310.2.3.1 shall permitted to encroach not more than 6 inches
        (152 mm) into the required dimensions of the window well.'
    - rank: 4
      cite: the same handout, the IRC's ladder sentence of that edition
      url: https://www.cityofboise.org/media/14485/438_egress-windows-code-hand-out-2022_final.pdf
      quote: 'Ladder and steps: Window wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with
        a permanently affixed ladder or steps usable with the window in the fully open position.'
    why_open: 'Gordium''s reading is no: the exception lets the ladder or steps encroach into the required dimensions of the
      area well, so the well''s own projection and width are still 36 in (the BCNYS 1031.5.1 rule, the same words, fails such
      a well). But the architects'' answer key needs review for a well 30 to under 36 in with a ladder (test_data/answer_keys/new_york/new_york_state/general.yaml,
      general.r319_4_1_area_well_size), so the band stays a review, never a fail, until the architects answer (docs/discrepancies_with_architects.md).
      Only a well over 44 in deep has a required ladder, and only one that reaches in could take any of the 36 in: a shallower
      well, or one whose ladder reaches 0, short of 36 in fails. The band follows the key, whose review reads area_well_ladder
      (a ladder or steps not obstructed by the open window): a band well with an obstructed ladder fails, a deliberate choice
      that doesn''t settle this rule''s question on obstructed ladders (R319.4.2''s own rule fails the obstruction anyway).
      Searched (2026-11-26): R319.4.1 and R319.4.2 whole, BCNYS 1031.5.1 and 1031.5.2 (the same words), a web search for New
      York State Department of State code interpretations (2026-11-26: none on an obstructed well ladder found; only New York
      City''s own Building Code, a separate code, came up), a web search for ICC commentary on the IRC''s same exception (none
      found), and building departments'' handouts on it: the City of Boise''s quotes the IRC''s earlier wording, where the
      required ladder or steps are those "usable with the window in the fully open position" (which leans toward the plain
      reading), but none says how an obstructed ladder''s reach, or the well''s own size beside a ladder, is read.'
