- id: general.r319_4_1_area_well_min_area
  kind: rule
  topic: means_of_egress
  title: Area well horizontal area at least 9 sf (R319.4.1)
  applies_when: opening_below_grade
  check: area_well_area >= 9 and area_well_other_encroachment <= 0 and area_well_ladder_encroachment <= 6 and (area_well_ladder_encroachment
    <= 0 or (area_well_ladder and area_well_depth > 44))
  review_when:
  - when: area_well_area >= 9 and not area_well_ladder and area_well_other_encroachment <= 0 and area_well_ladder_encroachment
      > 0 and area_well_ladder_encroachment <= 6 and area_well_depth > 44
    reason: 'A ladder or steps the open window or door obstructs (or not stated clear of it) reaches 6 in or less into the
      well''s required dimensions, in a well over 44 in deep: whether it is ''the ladder or steps required by Section R319.4.2''
      whose reach the exception allows is an open question (R319.4.2''s own rule fails the obstruction). A person checks.'
  - when: area_well_ladder and area_well_depth > 44 and area_well_other_encroachment <= 0 and area_well_ladder_encroachment
      > 0 and area_well_ladder_encroachment <= 6 and not (area_well_area >= 9)
    reason: 'The well is under 9 sq ft, with the ladder or steps a well over 44 in deep requires and nothing else in it: the
      exception lets them encroach into the required dimensions, but the text does not say how that changes the required horizontal
      area, so a person checks it.'
  for_each: emergency_escape_opening
