- id: general.r319_2_1_escape_opening_min_net_clear_area
  kind: rule
  topic: means_of_egress
  title: Escape opening minimum net clear area (R319.2.1)
  check: opening_net_clear_area >= (5.0 if opening_at_grade else 5.7)
  for_each: emergency_escape_opening
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 102
    lines:
    - 48
    - 48
    quote: Emergency escape and rescue openings shall have a net clear opening of not less than 5.7 square feet
  - file: gov.ny.residential.2025.pdf
    page: 102
    lines:
    - 50
    - 50
    quote: 'Exception: The minimum net clear opening for grade-floor emergency escape and rescue openings shall
      be 5 square feet (0.465 m[fn2]).'
  examples:
  - given: {}
    parts:
      emergency_escape_opening:
      - id: w1
        name: Window above grade
        measures:
          opening_net_clear_area: 5.7
          opening_at_grade: false
    rows:
    - part: w1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      emergency_escape_opening:
      - id: w1
        name: Window above grade
        measures:
          opening_net_clear_area: 5.3
          opening_at_grade: false
    rows:
    - part: w1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      emergency_escape_opening:
      - id: w2
        name: Grade-floor window
        measures:
          opening_net_clear_area: 5
          opening_at_grade: true
    rows:
    - part: w2
      outcome: pass
    expect: pass
  - given: {}
    parts:
      emergency_escape_opening:
      - id: w2
        name: Grade-floor window
        measures:
          opening_net_clear_area: 4.9
          opening_at_grade: true
    rows:
    - part: w2
      outcome: fail
    expect: fail
  - given: {}
    parts:
      emergency_escape_opening: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
  open_questions:
  - R319.5 exempts certain replacement windows from R319.2; this rule does not model that exemption.
  - R319.4.4 and R321.2.2 relate to net clear opening size with devices fitted; not modelled here.
  - The grade-floor definition (bottom of clear opening not more than 44 inches above or below adjacent ground)
    is represented by the opening_at_grade measure; confirm that it matches.
  research:
