- id: general.r320_2_handrail_height_34_38
  kind: rule
  topic: means_of_egress
  title: Handrail height 34 to 38 in (R320.2)
  check: handrail_height >= 34 and handrail_height_max <= 38
  review_when:
  - when: handrail_height_max > 38 and handrail_height >= 34 and handrail_height <= 38
    reason: Exception 2 lets handrail fittings or bendings exceed 38 inches at transitions, winders, a handrail-to-guard
      transition or the start of a flight. The measure does not say where the greatest height occurs.
  for_each: handrail
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 103
    lines:
    - 54
    - 55
    quote: Handrail height, measured vertically from the sloped plane adjoining the tread nosing, or finish surface
      of ramp slope, shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm).
  - file: gov.ny.residential.2025.pdf
    page: 104
    lines:
    - 3
    - 5
    quote: Where handrail fittings or bendings are used to provide continuous transition between flights, transitions
      at winder treads, the transition from handrail to guard, or used at the start of a flight, the handrail height
      at the fittings or bendings shall be permitted to exceed 38 inches (965 mm).
  examples:
  - given: {}
    parts:
      handrail:
      - id: h1
        name: Stair handrail
        measures:
          handrail_height: 34
          handrail_height_max: 36
    rows:
    - part: h1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      handrail:
      - id: h1
        name: Stair handrail
        measures:
          handrail_height: 33
          handrail_height_max: 36
    rows:
    - part: h1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      handrail:
      - id: h1
        name: Stair handrail
        measures:
          handrail_height: 35
          handrail_height_max: 40
    rows:
    - part: h1
      outcome: needs_review
    expect: needs_review
  - given: {}
    parts:
      handrail:
      - id: h1
        name: Stair handrail
        measures:
          handrail_height: 40
          handrail_height_max: 41
    rows:
    - part: h1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      handrail: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
  open_questions:
  - The handrail part kind is a handrail along a flight of stairs. Does the 34 to 38 inch limit also apply to ramp
    handrails (R318.8.3 sends them to R320)? No ramp part is modelled, so ramp handrails are not checked here.
  - R320.2 sets handrail height on alternating tread devices and ship's ladders at 30 to 34 inches and uniform (R318.7.12.2
    and R318.7.13.2 send their handrails to R320). No part kind exists for those handrails, so that sentence is
    not drafted as a rule; an engineer needs to add a part kind or measure for it.
  - Exception 1 allows a volute, turnout or starting easing over the lowest tread. How does it change the height
    there? Can the measured least height fall below 34 inches at it?
  - 'Where does the greatest handrail height occur: at a fitting or bending that Exception 2 permits above 38 inches,
