      6 inches (152 mm) into the required dimensions of the area well." R319.4.2: "Area wells with a vertical depth greater
      than 44 inches (1118 mm) shall be equipped with an approved, permanently affixed ladder or steps." The two reaches are
      now facts of their own (area_well_ladder_encroachment, area_well_other_encroachment, parts.yaml; stated in Revit by
      the window''s Gordium: Well marks, PR #247), so the rule reads them as BCNYS 1031.5.1''s do (the same words): the well''s
