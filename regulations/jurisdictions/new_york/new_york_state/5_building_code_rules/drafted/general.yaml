- id: general.r318_7_12_atd_not_in_means_of_egress
  kind: rule
  topic: means_of_egress
  title: Alternating tread devices not an element of a means of egress (R318.7.12)
  check: not atd_means_of_egress
  review_when:
  - when: atd_means_of_egress and atd_area_is_loft_or_mezzanine and not atd_only_access_kitchen_or_bath
    reason: The exception allows the device as the means of egress of a loft, mezzanine or similar area of 200 gross
      square feet or less that it isn't the only way to a kitchen or bathroom; the area's 200 square feet can't
      be compared here. A person checks.
  for_each: alternating_tread_device
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 101
    lines:
    - 47
    - 47
    quote: Alternating tread devices shall not be used as an element of a means of egress.
  - file: gov.ny.residential.2025.pdf
    page: 101
    lines:
    - 47
    - 49
    quote: Alternating tread devices shall be permitted provided that a required means of egress stairway or ramp
      serves the same space at each adjoin-ing level or where a means of egress is not required.
  - file: gov.ny.residential.2025.pdf
    page: 101
    lines:
    - 51
    - 52
    quote: 'Exception: Alternating tread devices are allowed to be used as an element of a means of egress for lofts,
      mezzanines and simi-lar areas of 200 gross square feet (18.6 m[fn2]) or less where such devices do not provide
      exclusive access to a kitchen or bathroom.'
  examples:
  - given: {}
    parts:
      alternating_tread_device:
      - id: a1
        measures:
          atd_means_of_egress: false
    rows:
    - part: a1
      outcome: pass
    expect: pass
  - given: {}
    parts:
      alternating_tread_device:
      - id: a1
        measures:
          atd_means_of_egress: true
          atd_area_is_loft_or_mezzanine: false
    rows:
    - part: a1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      alternating_tread_device:
      - id: a1
        measures:
          atd_means_of_egress: true
          atd_area_is_loft_or_mezzanine: true
          atd_only_access_kitchen_or_bath: false
          atd_area_served: 150
    rows:
    - part: a1
      outcome: needs_review
    expect: needs_review
  - given: {}
    parts:
      alternating_tread_device:
      - id: a1
        measures:
          atd_means_of_egress: true
          atd_area_is_loft_or_mezzanine: true
          atd_only_access_kitchen_or_bath: true
    rows:
    - part: a1
      outcome: fail
    expect: fail
  - given: {}
    parts:
      alternating_tread_device: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
  notes: Added after the AI's draft (its own was refused by code); written from the law, the AI's attempt kept in
    the drafting records.
  drafted_by: claude_code/claude-opus-5-5 (for Ben, after the AI's draft)
  status: draft
  revised:
  - field: rule
    by: Claude for Ben (house egress, remaining pieces, after the comparison)
    date: *id003
    why: 'R318.7.12: "Alternating tread devices shall not be used as an element of a means of egress." The AI''s
      rule for this was refused by code (the 200 gross square feet of the exception isn''t read as square feet by
      the number check), so nothing checked it: a device that is a space''s only means of egress passed. Added whole:
      fails such a device, and needs review where the exception may apply (a loft, mezzanine or similar area, not
      the only way to a kitchen or bathroom: its 200 square feet a person checks). Cause atd_egress_use_unchecked,
      resolutions.yaml.'
