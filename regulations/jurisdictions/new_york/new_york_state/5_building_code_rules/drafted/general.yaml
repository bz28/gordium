district: general
rules:
- id: general.r318_2_egress_door_per_dwelling_unit
  kind: rule
  topic: means_of_egress
  title: One egress door for each dwelling unit (R318.2)
  check: door_side_hinged and door_clear_width >= 32 and door_clear_height >= 78
  review_when:
  - when: dwelling_units > 1
    reason: 'More than one dwelling unit: each needs its own egress door, and which unit a marked door serves isn''t
      in the model. A person checks.'
  for_each: egress_door
  when_none: fail
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 44
    - 44
    quote: Not less than one egress door shall be provided for each dwelling unit.
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 44
    - 46
    quote: The egress door shall be side-hinged, and shall provide a clear width of not less than 32 inches (813
      mm) where measured between the face of the door and the stop, with the door open 90 degrees (1.57 rad).
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 46
    - 47
    quote: The clear height of the door opening shall be not less than 78 inches (1981 mm) in height measured from
      the top of the threshold to the bottom of the stop.
  examples:
  - given:
      dwelling_units: 1
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures:
          door_side_hinged: true
          door_clear_width: 34
          door_clear_height: 80
    rows:
    - part: d1
      outcome: pass
    expect: pass
  - given:
      dwelling_units: 1
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures:
          door_side_hinged: true
          door_clear_width: 30
          door_clear_height: 80
    rows:
    - part: d1
      outcome: fail
    expect: fail
  - given:
      dwelling_units: 1
    parts:
      egress_door: []
    rows:
    - outcome: fail
    expect: fail
  - given:
      dwelling_units: 2
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures: &id001
          door_side_hinged: true
          door_clear_width: 34
          door_clear_height: 80
      - id: d2
        name: Back door
        measures: *id001
    rows:
    - part: d1
      outcome: needs_review
    - part: d2
      outcome: needs_review
    expect: needs_review
  open_questions:
  - R318.2 does not say how a door is marked as the egress door; Gordium relies on the architect's marking.
  research:
  - question: R318.2 does not say how a door is marked as the egress door; Gordium relies on the architect's marking.
    searched: []
    sources: []
    why_open: 'pending: raised by the drafting script (the AI''s draft); not searched yet'
  notes: Drafted by the rule-drafting script.
  drafted_by: rule_drafting/claude-sonnet-5-5
  status: draft
  revised:
  - field: check
    by: Claude for Ben (house egress review, round 5)
    date: &id002 2026-11-13
    why: 'R318.2: "Not less than one egress door shall be provided for each dwelling unit." The AI counted the lot''s
      egress doors against its dwelling units (egress_doors >= dwelling_units), so a two-family house whose two
      marked doors both serve one unit would pass. Now each marked egress door is checked as the egress door the
      law describes, a house with none marked fails, and a house with more than one dwelling unit needs review (which
      door serves which unit isn''t in the model). Cause r318_2_doors_counted, resolutions.yaml.'
  - field: review_when
