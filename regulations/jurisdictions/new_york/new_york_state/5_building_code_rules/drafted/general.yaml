  for_each: egress_door
  when_none: not_applicable
  sources:
  - file: gov.ny.residential.2025.pdf
    page: 99
    lines:
    - 44
    - 46
    quote: The egress door shall be side-hinged, and shall provide a clear width of not less than 32 inches (813
      mm) where measured between the face of the door and the stop, with the door open 90 degrees (1.57 rad).
  examples:
  - given: {}
    parts:
      egress_door:
      - id: d1
        name: Front door
        measures:
          door_side_hinged: true
    rows:
    - part: d1
      outcome: pass
    expect: pass
  - given: {}
