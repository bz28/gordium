# A second, independent reading of every number in the brought-in pieces of the 2025 Residential Code of New York State,
# from the page images (rule_format/state_law.py says what is checked). A misread number could pass a design that fails.
# numbers: as the extracted text has them; second_reading_numbers: as the second reading has them; second_reading:
# agrees or differs, which code re-checks by comparing the two lists (a piece that differs needs a flag).
# second_reading_comparisons: what the printed sentence says of each number (>=, <=, >, <, between, none), read by a
# person from the whole sentence without numbers.py; code checks it against the recorded words (a difference needs a
# flag quoting the number). Both number readings go through numbers.py, so they can never check what its words mean.
# Status of every piece: verified against the Public.Resource.Org copy only; check against an exact ICC copy.
document: gov.ny.residential.2025.pdf
copy_checked: 'The Public.Resource.Org copy on the Internet Archive (sha256 in sources.yaml): verified against this copy
  only; check against an exact copy bought from ICC.'
second_reading:
  by: claude_code/claude-opus-5-5 (two helper agents that never saw the extracted text)
  'on': 2026-11-12
  how: 'Each brought-in piece was rendered from the PDF as an image (pypdfium2, 216 dpi), cropped from its heading to the
    next piece''s; the helpers read every number off the images, with the words before and after it, and both readings went
    through document_extraction/numbers.py. 169 pieces, 357 numbers: all agree. No glyph was marked unclear. Step 1b
    (2026-11-12, the 102 pieces it brought in): the lines of the pieces were cropped from 216 dpi page images (one crop per run
    of lines on a page, 50 crops), and a helper that never saw the extracted text transcribed every line of them; the
    transcript went through numbers.py: 102 pieces, 135 numbers, all agree (134 after review round 2, when numbers.py learned to read "one and one third" as one number and to keep a "not", "no" or "nor" before a comparison; the seven pieces this changed were compared again from the same transcript and agree). The first crops cut the left edge of some
    lines; they were rendered again at the full page width and those lines read again (the "42 inches" of R314.5 among them).
    After review round 1, five more pieces (BO102.1, BO102.1.2, BO103:unsafe, BO104.1, BO104.1.1) were read the same way
    by the same helper (4 crops): 0 numbers in the text, 0 in the reading; they agree. The transcripts of step 1b are kept in the code cache (second_reading/, with their crops, the tools that compared them and their sha256), outside the repo since they hold the book''s words; a test (rule_format/tests/test_state_law.py) rebuilds second_reading_numbers from them. After review rounds 2 and 3, the pieces whose numbers numbers.py now reads differently (R315.5.3.1 and BO108.4: "pound" and "kg" became units) were compared again from the same transcripts and agree. Step 1c (2026-11-12, the 10 pieces it brought in: Appendix BF''s BF101 to BF103 and R202''s VENTILATION): the lines of the pieces were cropped from 216 dpi page images at the full page width (4 crops, pp.55 and 898), and a helper that never saw the extracted text transcribed every line of them, marking no glyph unclear; the transcript went through numbers.py: 10 pieces, 7 numbers (all in BF103.1), all agree. A second helper that saw only BF103.1''s printed text and its numbers'' values and units marked each number''s comparison from the whole sentence (65 percent at least, 0.125 inch at most, the rest none); all seven are what the recorded words say. The transcript, crops and tools are kept in the code cache (second_reading/step_1c_*).'
notes:
- 'Review round 8 of egress step 1 (2026-11-12): twice a dropped "not" left the law recorded backwards while both
  readings agreed, because both go through numbers.py: they check the digits, never what the words mean. So each
  number''s comparison was read again from the whole printed sentence by a helper that saw only each piece''s text
  and its numbers'' values and units, never numbers.py''s words (second_reading_comparisons), and code checks it
  against numbers.comparison of the recorded words. Step 1''s 90 pieces with numbers, 357 numbers: 23 differ; step
  1b''s 42 more, 134 numbers: 10 differ. Each has a flag saying which is right. One reverses a limit: R315.2 records
  "more than one-half" where the book says the ceiling shall not exceed 7 feet for more than one-half of the floor
  (at most one-half). Two read a lifted maximum ("shall be permitted to exceed 38 inches", R318.7.5.3 and R320.2)
  as more than, where the second reading (none) is right. One, R202:underlayment, puts the "or greater" of a 2 in
  12 slope on the 12 units horizontal, in a definition, which sets no limit. The rest are limits the recorded words
  miss ("a minimum load of 1,000 pounds", "70 to 80 degrees") or right words the reader marked otherwise (a
  conversion or a range in brackets).'
- 'Review round 7 of egress step 1 (2026-11-12): a "not" five to seven words before its comparison was still dropped
  ("shall not have a vertical rise greater than 12 feet 7 inches" was recorded "greater than 12 foot"). numbers.py now
  looks up to eight words back, stopping at a stop, a comma, a word that starts another clause or another number.
  R318.7.2, R318.7.3, R318.7.5.2.1 and R318.7.5.3 changed; they were read again from their page images (pp.100-101,
  216 dpi, 5 crops) by a helper that never saw the extracted text, and that transcript went through numbers.py: 4
  pieces, 30 numbers, all agree. The transcript is kept in the code cache (second_reading/step_1_round_7_*).'
- 'Review round 3 of egress step 1b (2026-11-12): numbers.py learned to keep a "not" printed up to four words before
  a comparison in the same clause ("shall not project more than 4 1/2 inches"). R318.7.5.1, R318.7.5.2, R320.3 and R320.5
  changed; their first transcripts were not kept, so they were read again from their page images (pp.100, 104, 216 dpi,
  3 crops) by a helper that never saw the extracted text, and the new transcript went through numbers.py: 4 pieces, 20
  numbers, all agree. That transcript is kept in the code cache (second_reading/, sha256 in its README).'
- R318.7.6 was read again from its image (2026-11-12) after numbers.py learned parts of a whole ('a quarter circle', 'one-half');
  the first readings had not listed 'a quarter'. The new reading agrees. R202:owner (no numbers) was brought in later the
  same day, when the roman-type match learned 'Owner-occupied', and read from its image then.
- "Review round 5 (2026-11-12): numbers.py learned to look past a conversion in brackets for the comparison word after a
  number ('200 gross square feet (18.6 m²) or less'). R318.7.12, R318.7.13 and R202:underlayment were read again from
  their images (pages 101, 102, 54): 'or less', 'or less' and '(17-percent slope) or greater' are printed so; both
  readings agree. R202:ready_access_to (used by ACCESS (TO); brought in the same round, when the chain of definitions
  learned to follow those brought in by the roman-type match) was read from its image (page 50): 'Chapter 24', as the text."
- 'Two counting conventions were aligned after the first comparison (neither changed a number): a table''s part in parentheses
  (''Table R401.4.1(2)'') is part of its name, and a number word joined by a hyphen counts (''one-family'', ''one- or two-family'').'
- A raised 2 after m or ft (m², ft²) is written [fn2] in the extracted text, as in Ithaca's; it is never read as the number
  2.
- 'The book itself gives the 1-in-12 ramp slope as ''8.3-percent'' in R318.8.1 and ''8.33-percent'' in R318.8.3: both readings
  agree it is printed so.'
- A bold lower-case entry under a definition ('Building permit' under PERMIT, 'Building, existing' under BUILDING) stays
  in that definition's piece (document_extraction/icc_sections.py).
