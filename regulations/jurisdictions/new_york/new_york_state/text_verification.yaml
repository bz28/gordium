# A second, independent reading of every number in the brought-in pieces of the 2025 Residential Code of New York State,
# from the page images (rule_format/state_law.py says what is checked). A misread number could pass a design that fails.
# numbers: as the extracted text has them; second_reading_numbers: as the second reading has them; second_reading:
# agrees or differs, which code re-checks by comparing the two lists (a piece that differs needs a flag).
# Status of every piece: verified against the Public.Resource.Org copy only; check against an exact ICC copy.
document: gov.ny.residential.2025.pdf
copy_checked: 'The Public.Resource.Org copy on the Internet Archive (sha256 in sources.yaml): verified against this copy
  only; check against an exact copy bought from ICC.'
second_reading:
  by: claude_code/claude-opus-5-5 (two helper agents that never saw the extracted text)
  'on': 2026-11-12
  how: 'Each brought-in piece was rendered from the PDF as an image (pypdfium2, 216 dpi), cropped from its heading to the
    next piece''s; the helpers read every number off the images, with the words before and after it, and both readings went
    through document_extraction/numbers.py. 167 pieces, 356 numbers: all agree. No glyph was marked unclear.'
notes:
- R318.7.6 was read again from its image (2026-11-12) after numbers.py learned parts of a whole ('a quarter circle', 'one-half');
  the first readings had not listed 'a quarter'. The new reading agrees.
- 'Two counting conventions were aligned after the first comparison (neither changed a number): a table''s part in parentheses
  (''Table R401.4.1(2)'') is part of its name, and a number word joined by a hyphen counts (''one-family'', ''one- or two-family'').'
- A raised 2 after m or ft (m², ft²) is written [fn2] in the extracted text, as in Ithaca's; it is never read as the number
  2.
- 'The book itself gives the 1-in-12 ramp slope as ''8.3-percent'' in R318.8.1 and ''8.33-percent'' in R318.8.3: both readings
  agree it is printed so.'
- A bold lower-case entry under a definition ('Building permit' under PERMIT, 'Building, existing' under BUILDING) stays
  in that definition's piece (document_extraction/icc_sections.py).
