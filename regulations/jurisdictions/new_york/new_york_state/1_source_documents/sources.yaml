# Source documents for New York State's own law (inherited by every New York place: its jurisdiction.yaml
# `inherits: [new_york/new_york_state]`).
# The code book is copyrighted (International Code Council), so it is NOT in this folder: kept_outside_repo: true
# means the book and its extracted text are in the code cache on the machines that have it,
# <cache>/<sha256>/<file> (rule_format/rulebook.py: code_cache; ~/Documents/gordium_archive/code_cache on Ben's Mac),
# with the text of every page (document_extraction/book_text.py), the same for every branch; brought_in.pages
# says which of its pages this branch reads.
# The repo keeps only short exact quotes, each with its section, page and a link (decided 2026-11-12:
# docs/decisions/2026-11-12_building_code_text.md).
# sha256 is the book's fingerprint: if a single byte changes, it changes. To check: shasum -a 256 <file>
# brought_in: the pages read and the sections cut into pieces (document_extraction/icc_sections.py); the definitions
# brought in are found by code (every Section R202 definition a brought-in section uses).

documents:

  - file: gov.ny.residential.2025.pdf
    title: 2025 Residential Code of New York State (RCNYS)
    publisher: International Code Council, for the New York State Department of State (publication date July 2025)
    edition: 2025   # ISBN 978-1-967590-81-0 (PDF download), as its page 3 prints
    url: https://archive.org/details/gov.ny.residential.2025
    downloaded_on: 2026-11-12   # https://archive.org/download/gov.ny.residential.2025/gov.ny.residential.2025.pdf
    sha256: 36490d8c8b11dd2b12c50bb11bd78c4aa228b38245d2fe99225cabe059398451
    pages: 1079
    kept_outside_repo: true
    copy: >
      Posted to the Internet Archive by Public.Resource.Org on 2026-02-02 (item gov.ny.residential.2025; the PDF is
      the item's original upload, sha1 88eb6d7f443cc250d1b7e244905397dd9935cf77, as archive.org lists it). It is not a
      scan: it is ICC's own digital PDF edition (ISBN 978-1-967590-81-0, "PDF download", as its page 3 prints), with
      real text in its fonts (no OCR). It carries a per-copy number, 102102166, stamped at the top of every page (all
      1,079), so it is one specific licensed copy, posted by Public.Resource.Org. The copyright approach is unchanged:
      short exact quotes only in the repo (terms, below). Gordium reads the PDF's own text; archive.org's OCR files of
      it are not used. A working copy: to be checked against a copy bought from ICC (ICC's digital codes site may not
      be read by any script or automated browser: its terms forbid automated extraction and commercial use).
    terms: >
      Copyright 2025 International Code Council. The code is law in New York (19 NYCRR Part 1220 incorporates it by
      reference). Gordium keeps only short exact quotes, with section, page and a link, in the repo; the book and its
      full text stay outside it.
    in_force: >
      In force since 2025-12-31 for one- and two-family dwellings and townhouses not more than three stories above
      grade plane (19 NYCRR §1220.2(a), the Uniform Code as amended, DOS rule text 2025-12-02:
      https://dos.ny.gov/system/files/documents/2025/12/rule-text_uniform-code_amended-notice-of-adoption_12-2-25_0.pdf;
      §1219.2(a)(8) names the publication). The 2020 code could be chosen instead only during the transition, which
      ended 2025-12-30 (DOS: https://dos.ny.gov/notice-adoption).
    layout: icc   # cut into pieces at the book's own headings (document_extraction/icc_sections.py)
    brought_in:
      # Chapter 1's adoption of the appendices and its pointer to Appendix BO (pp.24-26); Chapter 2 (R201, R202
      # definitions; p.57 is blank, p.58 starts Chapter 3); R314-R321 (mezzanines, sleeping lofts, habitable attics,
      # egress; p.97 starts with R312 and R313, not brought in); R325.6-R325.7; R507.10 deck guards (p.205 is blank,
      # p.206 starts Chapter 6); Appendix BO (pp.964-974). Each with the next part's heading, so each part's end is proven.
      pages: 24-26, 34-58, 97-105, 109-110, 204-206, 964-974
      sections: [R101.2.1, R102.6, R201, R314, R315, R316, R318, R319, R320, R321, R325.6, R325.7, R507.10,
                 BO101, BO102.1.2, BO102.6.3, BO104.1, BO105.1, BO105.2.2, BO105.2.3, BO105.3, BO105.8, BO105.10, BO105.11, BO105.13,
                 BO106.1, BO107.1, BO107.2.1, BO107.2.2, BO108, BO109.1, BO109.8.1, BO109.8.5, BO109.8.6]
      alone: [BO102.1, BO102.6, BO106.7, BO107.2, BO109.8]   # brought in without the parts under them (only some of those are egress)
      printed_out_of_order:   # where the book's own numbering is out of order: what it prints there, cut where printed,
                              # each with why (a line that prints anything else is a problem)
        p.973 line 54:
          printed: BO109.8
          why: Appendix BO's Section BO109 goes from BO109.4 to BO109.8; the book prints no BO109.5 to BO109.7.
        p.974 line 39:
          printed: BO112.12.1
          why: Printed between BO109.12 and BO109.12.1, inside Section BO109 (historic buildings); Section BO112 is
            "Reserved" (p.975). Cut where printed; not brought in. The parts after it go on from BO109.12.
      amended_by_law:         # where New York's rules amend the term the book prints (what it prints, and the law's term)
        p.966 line 38:
          printed: HOME OCCUPATION
          term: LOAD-BEARING ELEMENT
          why: The book prints a second "HOME OCCUPATION" here; 19 NYCRR §1220.2(e)(4) amends it to read "LOAD-BEARING
            ELEMENT" with the same words (DOS rule text 2025-12-02, p.9; README).
      italic_not_defined:    # by piece: italic words Section R202 doesn't define (any other, or a stale one, is a problem)
        R318.3:
          accessed: R202 defines ACCESS (TO), not "accessed", so R201.3 sends it to another New York code's
            definition, not brought in (README).
        R319.6:
          accessed: As in R318.3.
        R319.1:
          unit: The book prints "dwelling unit" with only "unit" in italics; the term is DWELLING UNIT, brought in by
            the roman-type match (README).
        R202:story_above_grade_plane:
          above: The book prints item 1 as "above grade plane" in italics (p.52, line 36), where the line above prints
            only "grade plane" in italics; the term is GRADE PLANE, brought in, and "above" keeps its ordinary meaning.
        BO101.1:
          change of use: R202 defines CHANGE OF OCCUPANCY, not "change of use", so R201.3 sends it to another New York
            code's definition, not brought in (README).
          replacement: Appendix BO defines REPLACEMENT, BUILDING ("The reconstruction of a building on an existing
            foundation", p.966); the word alone is not that term. Replacement buildings (BO111) are not brought in (README).
        BO103:reconfiguration_of_space:
          change in use: As "change of use" in BO101.1.
        BO106.1.1:
          xisting: The book prints "existing building" across two lines with the "e" of "exist-" in roman (p.971, line
            14, checked on the page image); the term is EXISTING BUILDING, brought in by the roman-type match.
        BO107.1:
          tories: The book prints "stories above grade plane" with the "s" in roman (p.972, line 31, checked on the page
            image); the term is STORY ABOVE GRADE PLANE, brought in.
          above: Part of "stories above grade plane", as "tories".
    contents: >
      The house code. Brought in so far. Egress step 1: R318 means of egress (doors, landings, stairways, ramps),
      R319 emergency escape and rescue openings, R320 handrails, R321 guards and window fall protection; R325.6 and
      R325.7 (stairway lighting, which R318.7.10 requires); R201 (how the definitions apply) and every R202
      definition those sections use. Not egress, so not brought in: R310 smoke alarms, R311 carbon monoxide alarms.
      Egress step 1b, the parts the egress text points to: R314 mezzanines, R315 sleeping lofts, R316 habitable attics,
      R507.10 deck guards; R101.2.1 (which appendices are adopted) and R102.6 (work on existing buildings goes to
      Appendix BO); and Appendix BO's parts on egress for work on existing one- and two-family houses (README). Appendix
      BB (tiny houses) is left for later.
    notes: >
      Its section numbers are not the model code's (the International Residential Code's): cite only this book's.
      A bracketed letter before a section names the party responsible for it (page 7); [NY] is the New York State
      Department of State, e.g. risers not more than 8 1/4 inches and treads not less than 9 inches
      ([NY] R318.7.5.1, [NY] R318.7.5.2). The code cache holds the whole book's text (every page,
      document_extraction/book_text.py); the pages outside brought_in are read only to find which other parts of
      the book point into the brought-in sections (document_extraction/icc_references.py).
      New York's own amendments: 19 NYCRR §1220.2(e) amends the book for New York: (1) the definition of PERMIT;
      (2) referenced standards (Chapter 44); (3) BA113.3; (4) in BO103.1, the second definition printed "HOME OCCUPATION" reads "LOAD-BEARING
      ELEMENT". DOS rule text of 2025-12-02, pp.6-9
      (https://dos.ny.gov/system/files/documents/2025/12/rule-text_uniform-code_amended-notice-of-adoption_12-2-25_0.pdf,
      read 2026-11-12, sha256 dcfd684456631233d983a21f8e42f6dd1a89bf6623aa7faa20b75f24b99bc9f0). Only (4) touches a
      brought-in part's cutting (brought_in.amended_by_law); (1) changes the words of PERMIT, a brought-in definition
      (README).
