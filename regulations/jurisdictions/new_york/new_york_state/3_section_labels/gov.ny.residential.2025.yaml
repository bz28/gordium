  BO103:dangerous:
    label: reference
    topic: definitions
    reason: Defines DANGEROUS, printed in italics in BO105.10.7, BO109.8.5; used in italics by the definition of UNSAFE. A
      definition sets no requirement itself.
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 966
      lines:
      - 19
      - 35
      quote: '[NY] DANGEROUS. Any building, structure or portion thereof that meets any of the conditions described below
        shall be deemed dangerous: 1. The building or structure has collapsed, has partially collapsed, has moved off its
        foundation or lacks the necessary support of the ground. 2. There exists a significant risk of collapse, detachment
        or dislodgement of any portion, member, appurtenance or ornamen- tation of the building or structure under permanent,
        routine or frequent loads; under actual loads already in effect; or under snow, wind, rain, flood, earthquake aftershock
        or other environmental loads when such loads are imminent. 3. The stress in a member or portion thereof due to all
        factored dead and live loads is more than one and one third the nominal strength allowed in this code for new buildings
        of similar structure, purpose or location. 4. Any portion of a building, or any member, appurtenance or ornamentation
        on the exterior thereof is not of sufficient strength or stability, or is not anchored, attached or fastened in place
        so as to be capable of resisting a wind pressure of two thirds of that specified in this code for new buildings of
        similar structure, purpose or location without exceeding the nomi- nal strength permitted in this code for such buildings.
        5. The exterior walls or other vertical structural members list, lean or buckle to such an extent that a plumb line
        passing through the center of gravity does not fall inside the middle one third of the base. 6. Any portion, member
