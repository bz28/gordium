# What kind of text each brought-in piece of the 2025 Residential Code of New York State is (3_section_labels/README.md).
# Drafted by hand in a Claude Code session (claude-opus-5-5, 2026-11-12), checked by code (python -m rule_format):
# each quote is the book's exact words where it says, where the code cache exists (the book is kept outside the repo).
# Drafts: approval is deferred (2026-10-19).
document: gov.ny.residential.2025.pdf
labels:
  R101.2.1:
    label: reference
    topic: administration
    reason: 'Says which appendices New York adopts as part of the code (BA, BB, BF and BO) and which are included for information
      only: why Appendix BO''s egress parts are law.'
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 24
      lines:
      - 38
      - 42
      quote: '[NY] R101.2.1 Appendices. Provisions in the following appendices have been adopted and are made part of this
        code: Appendix BA Manufactured Housing Used as Dwellings Appendix BB Tiny Houses Appendix BF Patio Covers Appendix
        BO Existing Buildings and Structures'
    piece_sha256: 4da460ccc289638f7f37d57aa2a6f383aca7daf74c24df2e4ce54f1a60fd28bc
    notes: Drafted by hand in a Claude Code session (2026-11-12); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  R102.6:
    label: flag
    topic: existing_buildings
    reason: Lets the lawful occupancy of a building existing on 2025-12-31 continue, an allowance for an existing condition
      (whether a building existed then, lawfully, isn't in the model); its numbered parts send work on existing buildings to
      Appendix BO. Shown as needing review where a design is work on an existing building.
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 26
      lines:
      - 18
      - 19
      quote: '[NY] R102.6 Existing structures. The legal occupancy of any structure existing on the effective date of this
        code shall be permitted to continue without change, except as required by any provision of this code or by any other
        provision of the Uniform Code. For the'
    piece_sha256: 511f4100082bf56dada6c7a959c4bf3f897b8bd3a4379cb17ea44d55bb2b34cf
    notes: Drafted by hand in a Claude Code session (2026-11-12); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  R102.6.1:
    label: flag
    topic: existing_buildings
    reason: 'Sends additions, alterations and repairs to Appendix BO (brought in only for egress) and new work to the rules
      for new construction; work that takes the house outside this code''s scope (use, height or means of egress) goes to
      the Existing Building Code of New York State, not brought in: which code governs is an architect''s judgment.'
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 26
      lines:
      - 21
      - 22
      quote: '[NY] R102.6.1 Additions, alterations, change of use or repairs. Additions, alterations or repairs to any structure
        shall comply with the requirements of Appendix BO. All new work shall conform to the requirements for a new structure
        without requiring the'
    piece_sha256: 20ee5dd0a882856b7fabf2f2d78d121ca12d7e54fedd1cd829b94894e3d228cd
    notes: Drafted by hand in a Claude Code session (2026-11-12); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  R102.6.2:
    label: flag
    topic: existing_buildings
    reason: 'A change of use or occupancy must make the building comply with Appendix BO, brought in only for egress: the
      change of use is the architect''s input, and the rest of the appendix is not checked.'
    sources:
    - file: gov.ny.residential.2025.pdf
      page: 26
      lines:
      - 27
      - 28
      quote: '[NY] R102.6.2 Change in use or occupancy. No change shall be made in the use or occupancy of any building or
        structure unless such building or structure is made to comply with the requirements of Appendix BO of this code.'
