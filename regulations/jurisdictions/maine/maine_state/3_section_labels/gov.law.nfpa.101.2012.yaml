    label: rule
    topic: means_of_egress
    reason: 'Every interior corridor of an existing day-care occupancy has walls of at least a 1/2-hour rating, unless every
      student space opens directly outside (1), or the building is sprinklered throughout with valve supervision (Section
      9.7) and the walls form smoke partitions (2): measurable from the stated assemblies.'
