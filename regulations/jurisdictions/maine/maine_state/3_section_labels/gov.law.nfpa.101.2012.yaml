# What kind of text each brought-in piece of NFPA 101, Life Safety Code, 2012 edition is (3_section_labels/README.md).
# Drafted by hand in a Claude Code session (claude-opus-5-5, 2026-11-20), checked by code (python -m rule_format): each quote is
# the extracted text's exact words where the code cache has the book (it is kept outside the repo). Drafts: approval is deferred.
document: gov.law.nfpa.101.2012.pdf
labels:
  '3.1':
    label: reference
    topic: definitions
    reason: 'Says Chapter 3''s definitions apply to the terms used in the Code, and a term it doesn''t define has its ordinary
      meaning (Merriam-Webster''s Collegiate Dictionary): the book marks no defined word, so every Chapter 3 term applies
      wherever it is printed.'
    sources:
    - file: gov.law.nfpa.101.2012.pdf
      page: 28
      lines:
      - 94
      - 95
      quote: The definitions contained in this chapter shall apply to the terms used in this Code.
    piece_sha256: ffe0460bf051c181f451f7a38021a95d9a051adb85656f833651c14cdd41ffce
