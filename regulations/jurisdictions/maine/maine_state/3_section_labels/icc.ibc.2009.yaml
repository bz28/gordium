# What kind of text each brought-in piece of the 2009 International Building Code is (3_section_labels/README.md).
# Drafted by hand in a Claude Code session (claude-opus-5-5, 2026-11-20), checked by code (python -m rule_format): each quote is
# the extracted text's exact words where the code cache has the book (it is kept outside the repo). Drafts: approval is deferred.
document: icc.ibc.2009.pdf
labels:
  '201':
    label: not_for_checking
    topic: definitions
    reason: 'A heading only: its title, with no requirement of its own (the parts under it are labeled one by one).'
    sources:
    - file: icc.ibc.2009.pdf
      page: 38
      lines:
      - 2
      - 3
      quote: SECTION 201 GENERAL
    piece_sha256: c2c3777450c046eb355eb71f32e4e7bcfb19db6036fe186aad9d95d8c8c6992a
    notes: Drafted by hand in a Claude Code session (2026-11-20); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '201.1':
    label: reference
    topic: definitions
    reason: 'Says the words of Chapter 2 have the meanings it gives, for the whole code: how every brought-in definition applies.'
    sources:
    - file: icc.ibc.2009.pdf
      page: 38
      lines:
      - 4
      - 6
      quote: Unless otherwise expressly stated, the following words and terms shall, for the purposes of this code, have the
        meanings shown in this chapter.
    piece_sha256: 9cb64178b9c2da891c8e1db9374567bf18e54a9081f7bd2121bd95bc17a03a97
    notes: Drafted by hand in a Claude Code session (2026-11-20); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '201.2':
    label: reference
    topic: definitions
    reason: 'How words are read (tense, gender, number): a rule of reading, no requirement.'
    sources:
    - file: icc.ibc.2009.pdf
      page: 38
      lines:
      - 7
      - 8
      quote: Words used in the present tense include the future;
    piece_sha256: 547a1f3a4b1cbbdbac6f07dceab6a90139f0d441f197596a3d79277893b46927
    notes: Drafted by hand in a Claude Code session (2026-11-20); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '201.3':
    label: reference
    topic: definitions
    reason: Sends a word this code doesn't define to the meaning the International Fuel Gas, Fire, Mechanical or Plumbing
      Code gives it (not brought in).
    sources:
    - file: icc.ibc.2009.pdf
      page: 38
      lines:
      - 11
      - 15
      quote: Where terms are not defined in this code and are defined in the International Fuel Gas Code, International Fire
        Code, International Mechanical Code or International Plumbing Code, such terms shall have the meanings ascribed to
        them as in those codes.
    piece_sha256: dbf90b58c9a3cc81e7dca81813c5c3a94fdb61b59695589e6056585ef5af9756
    notes: Drafted by hand in a Claude Code session (2026-11-20); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
  '201.4':
    label: reference
    topic: definitions
    reason: 'Gives a word with no definition its ordinary meaning in context: a rule of reading, no requirement.'
    sources:
    - file: icc.ibc.2009.pdf
      page: 38
      lines:
      - 16
      - 19
      quote: Where terms are not defined through the methods authorized by this section, such terms shall have ordinarily
        accepted meanings such as the context implies.
    piece_sha256: 4eb20748c33956fcb245d134616d3997b389efc30110b1c26471e22990981f2e
    notes: Drafted by hand in a Claude Code session (2026-11-20); no recorded labeling run.
    drafted_by: claude_code/claude-opus-5-5
    status: draft
