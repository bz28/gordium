- id: general.nfpa_17_2_5_2_dead_end
  kind: rule
  topic: means_of_egress
  title: Dead-end corridor 20 ft, 50 ft sprinklered (NFPA 17.2.5.2)
  applies_when: nfpa_day_care_occupancy and day_care_existing
  check: corridor_dead_end_length <= (50 if sprinklered_9_7 and sprinkler_supervised_9_7 else 20)
  review_when:
  - when: corridor_dead_end_length > 20 and corridor_dead_end_length <= 50 and sprinklered_9_7 and sprinkler_supervised_9_7
    reason: 'Over 20 ft, within this book''s 50 ft (sprinklered, supervised): Maine''s own Life Safety rule (16-219 CMR ch.
      20) may cap a dead end at a flat 20 ft (today''s rule does; whether that flat 20 ft governs is open question 2 of regulations/jurisdictions/maine/maine_state/README.md).
      Only 20 ft is certain under every reading, so a longer dead end needs review until the State Fire Marshal or the City
      answers.'
  for_each: corridor
  when_none: not_applicable
  sources:
  - file: gov.law.nfpa.101.2012.pdf
    page: 181
    lines:
    - 84
    - 88
    quote: 17.2.5.2 No dead-end corridor shall exceed 20 ft (6100 mm), other than in buildings protected throughout by an
      approved, supervised automatic sprinkler system in accordance with Sec- tion 9.7, in which case dead-end corridors shall
      not exceed 50 ft (15 m).
  examples:
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
      sprinklered_9_7: true
      sprinkler_supervised_9_7: true
    parts:
      corridor:
      - id: p1
        name: Corridor (the sheet)
        measures:
          corridor_dead_end_length: 21.5
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    note: 'The answer key (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 21''-6" is within this book''s
      50 ft (sprinklered, supervised), but over the flat 20 ft Maine''s 16-219 CMR ch. 20 may set (the open question): needs
      review, never pass, until it is answered.'
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
      sprinklered_9_7: true
      sprinkler_supervised_9_7: true
    parts:
      corridor:
      - id: p2
        name: Short dead end
        measures:
          corridor_dead_end_length: 15
    rows:
    - part: p2
      outcome: pass
    expect: pass
    note: Within 20 ft under every reading.
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
      sprinklered_9_7: true
      sprinkler_supervised_9_7: true
    parts:
      corridor:
      - id: p3
        name: Very long dead end
        measures:
          corridor_dead_end_length: 55
    rows:
    - part: p3
      outcome: fail
    expect: fail
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
      sprinklered_9_7: true
      sprinkler_supervised_9_7: true
    parts:
      corridor: []
    rows:
    - outcome: not_applicable
    expect: not_applicable
    note: 'No corridor: the rule''s when_none (not_applicable).'
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
      sprinklered_9_7: false
      sprinkler_supervised_9_7: false
    parts:
      corridor:
      - id: p1
        name: Unsprinklered
        measures:
          corridor_dead_end_length: 21.5
    rows:
    - part: p1
      outcome: fail
    expect: fail
    note: 'Not sprinklered: 20 ft, and 21''-6" is over.'
  open_questions:
  - Whether Maine's 16-219 CMR ch. 20, as in force in October 2016, modified this dead-end limit (today's rule sets a flat
    20 ft).
  research:
  - question: Whether Maine's 16-219 CMR ch. 20, as in force in October 2016, modified this dead-end limit (today's rule sets
      a flat 20 ft).
    searched:
    - 17.2.5.2
    - '1018.4'
    sources:
    - rank: 2
      cite: '16-219 CMR ch. 20 (Maine State Fire Marshal), as published today (amended 2021-01-25): the 2018 NFPA 101 with
        Maine''s modifications, one a 20-ft dead-end limit; read 2026-11-20'
    why_open: The rule text in force in 2016 was not found online; a question for the State Fire Marshal's office or the City
      of Portland.
  notes: 'Hand-drafted in a Claude Code session (2026-11-20). Most restrictive: IBC 1018.4 allows 20 ft, or any length under
    2.5 times the least width (exception 3), and not 50 ft for I-4 (a flag: OCR copy); both apply, the stricter governs (the
    sheet: 25 ft by the IBC). Maine''s 16-219 CMR ch. 20 today sets a flat 20 ft: open (general.ibc_1018_4_dead_end, README).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
