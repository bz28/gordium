  - field: check
    by: Claude for Ben (the not-occupied mark, route note decision 1b)
    date: 2026-11-22
    why: 'NFPA 101 2012 7.6.1(1) measures travel distance "starting from the most remote point subject to occupancy" (16.2.6.1 and 17.2.6.1: "in accordance with Section 7.6"), and A.3.3.47 measures the common path "in the same manner as travel distance"; the 2009 IBC measures from "the most remote point within a story" (1016.1). The drafted rule read the measure both books shared, so a room the architect marks not occupied (an abandoned space) held this rule at needs review although NFPA''s words leave it out. It now reads NFPA''s own measure (common_path_of_travel_occupied, parts.yaml): the same figure where no room is marked; the IBC rules keep the shared one. Route note decision 1b (docs/decisions/2026-11-20_route_measurement.md).'
  - field: examples
