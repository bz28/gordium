    ''1-4'' is the OCR''s reading of I-4 (the book''s ICC print reads I-4). The answer key''s sheet says I-4. Hand-drafted
    in a Claude Code session (2026-11-20).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
- id: general.ibc_508_2_1_accessory_area
  kind: flag
  topic: dimensions
  title: Accessory occupancies at most 10% of the story (IBC 508.2.1)
  check: story_accessory_area <= 0.10 * story_building_area
  for_each: story
  when_none: needs_review
  sources:
  - file: icc.ibc.2009.pdf
    page: 111
    lines:
    - 95
    - 98
    quote: Aggregate accessory occupan cies shall not occupy more than 10 percent of the building area of the story in which
      they are located and shall not exceed the tabular values in Table 503,
  examples:
  - given: {}
    parts:
      story:
      - id: p1
        name: First floor (the sheet)
        measures:
          story_accessory_area: 1428
          story_building_area: 16509
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    drafted_check: pass
    note: 'The answer key (test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml): 1,428 sf of storage against 10%
      of 16,509 sf = 1,650.9 sf: passes (the story is 16,539 sf as Ben reports it, 1,653.9 sf: passes either way).'
  - given: {}
    parts:
      story:
      - id: p2
        name: Storage over 10%
        measures:
          story_accessory_area: 1700
          story_building_area: 16509
    rows:
    - part: p2
      outcome: needs_review
    expect: needs_review
    drafted_check: fail
    note: 1,700 sf is more than 1,650.9 sf.
  - given: {}
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: the rule''s when_none (needs_review).'
  notes: 'Read from an OCR copy only: not verified; needs review until checked against a purchased ICC copy. So this is a
    flag (always needs review); its check is the drafted test, never run for a result, and each example''s drafted_check is
    what that test gives (text_verification.icc.ibc.2009.yaml not_verified; docs/decisions/2026-11-20_commercial_egress_maine.md).
    Its second test, Table 503''s tabular values (and Section 506''s increases), is not brought in: that part needs a person
    whatever this test gives. The sheet cites only Table 503 and names no section for the 10 percent (hand_check.yaml sheet_errors).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
