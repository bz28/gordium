  sources:
  - file: icc.ibc.2009.pdf
    page: 61
    lines:
    - 78
    - 81
    quote: A facility that provides supervi sion and personal care on less than a 24-hour basis for more than five children
      2 1/2 years of age or less shall be classified as Group 1-4.
  - file: icc.ibc.2009.pdf
    page: 61
    lines:
    - 82
    - 88
    quote: 'Exception: A child day care facility that provides care for more than five but no more than 100 children 2 1/2
      years or less of age, where the rooms in which the chil dren are cared for are located on a level ofexit discharge serving
      such rooms and each of these child care rooms has an exitdoor directly to the exterior, shall be classified as Group
      E.'
