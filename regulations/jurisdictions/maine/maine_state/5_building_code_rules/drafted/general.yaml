# Commercial egress rules for a day-care centre under Maine's codes, as the architect's sheet reads them: the
# 2009 IBC and NFPA 101 (2012) (README.md). Hand-drafted in a Claude Code session (claude-opus-5-5, 2026-11-20),
# checked by code (python -m rule_format). Every IBC requirement is a flag: the IBC copy is read from OCR only,
# not verified, so its check is the drafted test (drafted_check in each example) and it always needs review.
# NFPA rules use the second reading's numbers only (text_verification.gov.law.nfpa.101.2012.yaml). Where both
# books set a limit, both apply and the stricter governs (each pair's notes). Graded against
# test_data/answer_keys/portland_me_19_libby_st/hand_check.yaml. Drafts: approval is deferred.
district: general
rules:
- id: general.ibc_308_5_classification
  kind: flag
  topic: uses
  title: Group I-4, day care facilities (IBC 308.5)
  sources:
  - file: icc.ibc.2009.pdf
    page: 61
    lines:
    - 62
    - 67
    quote: This group shall include buildings and structures occupied by persons of any age who receive custodial care for
      less than 24 hours by individuals other than parents or guardians, relatives by blood, marriage or adoption, and in
      a place other than the home of the person cared for.
  - file: icc.ibc.2009.pdf
    page: 61
    lines:
    - 67
    - 69
    quote: A facility such as the above with five or fewer persons shall be classified as a Group R-3 or shall comply with
      the Interna tional Residential Code in accordance with Section 101.2.
  examples:
  - given: {}
    expect: needs_review
    note: Which group the building is in decides every limit below; the architect states it (occupancy_group_i4), a person
      confirms.
  notes: 'Read from an OCR copy only: not verified; needs review until checked against a purchased ICC copy. So this is a
    flag (always needs review); its check is the drafted test, never run for a result, and each example''s drafted_check is
    what that test gives (text_verification.icc.ibc.2009.yaml not_verified; docs/decisions/2026-11-20_commercial_egress_maine.md).
    The rules of this rulebook are drafted for Group I-4 only (their applies_when); a building in another group needs its
    own rules, so this flag always shows. Hand-drafted in a Claude Code session (2026-11-20).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
