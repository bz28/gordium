- id: general.ibc_1004_1_1_occupant_load
  kind: flag
  topic: density_and_occupancy
  title: Occupant load at least net area / 35 (IBC 1004.1.1)
  applies_when: occupancy_group_i4
  check: story_occupant_load >= story_day_care_net_area / 35
  review_when:
  - when: story_other_use_area > 0
    reason: 'Part of the story is in a use other than day care: Table 1004.1.1 gives each function of space its own factor,
      which this test doesn''t add; a person adds them.'
  for_each: story
  when_none: needs_review
  sources:
  - file: icc.ibc.2009.pdf
    page: 246
    lines:
    - 105
    - 107
    quote: For areas with out fixed seating, the occupant load shall not be less than that number determined by dividing the
      floor area under
  - file: icc.ibc.2009.pdf
    page: 247
    lines:
    - 86
    - 86
    quote: Day care 35 net
  examples:
  - given:
      occupancy_group_i4: true
    parts:
      story:
      - id: p1
        name: Day care, 3,500 sf net
        measures:
          story_occupant_load: 120
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    drafted_check: pass
    note: 3,500 / 35 = 100 occupants at least; 120 stated.
  - given:
      occupancy_group_i4: true
    parts:
      story:
      - id: p2
        name: Too few occupants
        measures:
          story_occupant_load: 90
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p2
      outcome: needs_review
    expect: needs_review
    drafted_check: fail
    note: 90 is fewer than 100.
  - given:
      occupancy_group_i4: true
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: the rule''s when_none (needs_review).'
  - given:
      occupancy_group_i4: true
    parts:
      story:
      - id: p1
        name: Day care with offices
        measures:
          story_occupant_load: 105
          story_day_care_net_area: 3500
          story_other_use_area: 1500
    rows:
    - part: p1
      outcome: needs_review
    expect: needs_review
    drafted_check: needs_review
    note: 'Other uses on the story (Table 1004.1.1 gives each its own factor): the drafted test sends them to a person too.'
  - given:
      occupancy_group_i4: false
    parts:
      story:
      - id: p1
        name: Office
        measures:
          story_occupant_load: 1
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    drafted_check: not_applicable
    note: 'Not Group I-4: the day-care factor is not this building''s.'
  notes: 'Read from an OCR copy only: not verified; needs review until checked against a purchased ICC copy. So this is a
    flag (always needs review); its check is the drafted test, never run for a result, and each example''s drafted_check is
    what that test gives (text_verification.icc.ibc.2009.yaml not_verified; docs/decisions/2026-11-20_commercial_egress_maine.md).
    The sheet gives no occupant load. Most restrictive: NFPA 101 16.1.7.1 uses the same 35 net (Table 7.3.1.2), and the greater
    of that and the maximum probable population; both apply, the stricter governs (general.nfpa_16_1_7_1_occupant_load).'
  drafted_by: claude_code/claude-opus-5-5
  status: draft
