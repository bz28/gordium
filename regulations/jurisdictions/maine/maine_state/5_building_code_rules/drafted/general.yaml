- id: general.nfpa_16_1_7_1_occupant_load
  kind: rule
  topic: density_and_occupancy
  title: Occupant load at least net area / 35 (NFPA 16.1.7.1)
  applies_when: nfpa_day_care_occupancy and (not day_care_existing or existing_change_of_use)
  check: story_occupant_load >= story_day_care_net_area / 35
  review_when:
  - when: story_other_use_area > 0
    reason: 'Part of the story is in a use other than day care (offices, a kitchen, storage...): Table 7.3.1.2 gives each
      use its own factor, which this rule doesn''t add to the day-care load; a person adds them.'
  for_each: story
  when_none: needs_review
  sources:
  - file: gov.law.nfpa.101.2012.pdf
    page: 173
    lines:
    - 29
    - 34
    quote: 16.1.7.1 The occupant load, in number of persons for whom means of egress and other provisions are required, either
      shall be determined on the basis of the occupant load factors of Table 7.3.1.2 that are characteristic of the use of
      the space or shall be determined as the maximum probable population of the space under consideration, whichever is greater.
  - file: gov.law.nfpa.101.2012.pdf
    page: 77
    lines:
    - 41
    - 41
    quote: Day-Care Use 35 net 3.3 net
  examples:
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: false
    parts:
      story:
      - id: p1
        name: Day care, 3,500 sf net
        measures:
          story_occupant_load: 120
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p1
      outcome: pass
    expect: pass
    note: 3,500 / 35 = 100 at least; 120 stated.
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: false
    parts:
      story:
      - id: p2
        name: Too few occupants
        measures:
          story_occupant_load: 90
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p2
      outcome: fail
    expect: fail
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: false
    parts:
      story:
      - id: p3
        name: Day care with offices and a kitchen
        measures:
          story_occupant_load: 105
          story_day_care_net_area: 3500
          story_other_use_area: 1500
    rows:
    - part: p3
      outcome: needs_review
    expect: needs_review
    note: '1,500 sf in other uses (offices, a kitchen: Table 7.3.1.2''s own factors, 100 each): their occupants aren''t counted
      by this rule, so it needs review, never pass.'
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: false
    parts:
      story: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No story: the rule''s when_none (needs_review).'
  - given:
      nfpa_day_care_occupancy: true
      day_care_existing: true
      existing_change_of_use: false
    parts:
      story:
      - id: p1
        name: Other chapter
        measures:
          story_occupant_load: 1
          story_day_care_net_area: 3500
          story_other_use_area: 0
    rows:
    - part: p1
      outcome: not_applicable
    expect: not_applicable
    note: 'Not a new day-care occupancy: the other chapter''s rule applies.'
  notes: 'Hand-drafted in a Claude Code session (2026-11-20). The stated occupant load is the design number; the maximum probable
    population, where greater, is the architect''s statement. Most restrictive: IBC 1004.1.1 uses the same 35 net (a flag:
    OCR copy); both apply, the stricter governs.'
