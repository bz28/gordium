      outcome: needs_review
    expect: needs_review
    drafted_check: pass
  - given: {}
    parts:
      means_of_egress_door:
      - id: p2
        name: Exit door, 120 occupants, swings in
        measures:
          moe_door_swinging: true
          moe_door_occupant_load: 120
          moe_door_swings_with_egress: false
    rows:
    - part: p2
      outcome: needs_review
    expect: needs_review
    drafted_check: fail
    note: Serves 50 or more and swings against egress.
  - given: {}
    parts:
      means_of_egress_door: []
    rows:
    - outcome: needs_review
    expect: needs_review
    note: 'No means of egress door: the rule''s when_none (needs_review).'
  notes: 'Read from an OCR copy only: not verified; needs review until checked against a purchased ICC copy. So this is a
    flag (always needs review); its check is the drafted test, never run for a result, and each example''s drafted_check is
    what that test gives (text_verification.icc.ibc.2009.yaml not_verified; docs/decisions/2026-11-20_commercial_egress_maine.md).
    Its exceptions (revolving, horizontal sliding and power-operated doors complying with 1008.1.4, not brought in; private
    garages, offices, factory and storage areas of 10 or fewer) are a person''s check: a door that is not swinging fails this
    drafted test, never passes it.'
  drafted_by: claude_code/claude-opus-5-5
