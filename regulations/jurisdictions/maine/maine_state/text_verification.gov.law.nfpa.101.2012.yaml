    labeled by its id (22 pages, 147 boxes); a helper that never saw the extracted text transcribed every line of
    every box (tables row by row); the transcript went through document_extraction/numbers.py: 143 pieces, 493 numbers;
    141 pieces agree. The two that differ are tables (Table 6.1.14.4.1(b), Table 7.3.1.2), whose cells the extraction
    reads in column bands and the helper row by row: see their flags. A second helper that saw only each piece''s
    transcribed text and its numbers'' values marked each number''s comparison from the whole sentence (second_reading_comparisons).
    The transcript, the page images and the comparison file are kept in the code cache (second_reading/step_1_*),
    outside the repo, since they hold the book''s words.'
