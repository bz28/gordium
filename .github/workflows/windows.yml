name: Windows

# The Windows half of CI (Ben, 2026-11-26), split from ci.yml because GitHub runs about one CI run at a time and
# Windows is half of the jobs. A push to a PR runs only `windows (3.14)`, which fails saying Windows hasn't run.
# When the merge script (gordium_handoff_tools/merge_when_green.py) takes a PR, it labels it merge-ready: that runs
# every Windows job on the same commit, and every later push to the labelled PR runs them too. The merge script
# merges only when `windows (3.14)` and the Revit client on Windows passed on the head, and only a PR that holds
# main's head, so main after a merge is the very tree Windows just passed: a push to main runs no Windows (it held the
# one-at-a-time queue for 90 minutes per merge, 2026-11-26). Every night, and on demand, main runs it all, on both
# Pythons.
on:
  schedule:
    - cron: "0 7 * * *"     # 07:00 UTC: 02:00 in New York in winter, 03:00 in summer
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A newer push or the merge-ready label replaces the PR's older Windows run (the label's run replaces the push run
# that only said Windows hasn't run). Any other label gets a group of its own name, so it never cancels Windows.
# The nightly run on main is never cancelled.
concurrency:
  group: windows-${{ github.event.pull_request.number || github.sha }}${{ (github.event.action == 'labeled' && github.event.label.name != 'merge-ready') && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARDS: 4

jobs:
  # The same tests on Windows, where Python reads files as cp1252 unless told UTF-8. PYTHONUTF8 is deliberately
  # not set: the job proves the code names its encodings, as an architect's Windows PC runs it.
  windows_tests:
    name: windows tests (${{ matrix.python-version }}, part ${{ matrix.part }} of 4)
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready')) }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs: Windows on 3.14 only (Linux covers 3.12); main: both versions
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.12", "3.14"]') }}
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (this part, on every CPU)
        run: pytest -n auto --dist worksteal --shard ${{ matrix.part }}/${{ env.SHARDS }}

  windows_checks:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready')) }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.12", "3.14"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: The test parts add up to the whole suite (every test in exactly one part)
        run: python tests/check_shards.py ${{ env.SHARDS }}
      - name: Extracted text matches a fresh extraction (reproducible)
        run: python -m document_extraction --check
      - name: Rule files are valid (sources, quotes, worked examples, section labels)
        run: python -m rule_format
      - name: Every line of the law is in exactly one piece; coverage report is current (no AI)
        run: python -m section_labeling coverage --check
      - name: The residential coverage audit (every rule and flag piece x district) matches a fresh build (no AI)
        run: python -m section_labeling audit --check
      - name: The rules workbook matches a fresh build (generated, never hand-edited)
        run: python -m rule_export --check
      - name: The measured example models match a fresh measurement (Rhino files measured by code, no AI)
        run: python -m model_measurement --check
      - name: The example project reports match a fresh build (results from the rule checker only)
        run: python -m project_report --check
      - name: Every golden answer is the same (check and start on the test sites, scenarios and 200 stress designs)
        run: python -m design_checker.goldens --check

  # The old Windows job's names (`windows (3.14)`; on main also `windows (3.12)`): each passes only when every
  # Windows test part, the Windows checks and the Revit client on Windows passed. On a PR not yet labelled
  # merge-ready it FAILS, saying Windows hasn't run: a PR is never shown green without Windows (review round 1).
  # A label other than merge-ready runs nothing here.
  windows:
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready') }}
    needs: [windows_tests, windows_checks, revit_worker_client_windows]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.12", "3.14"]') }}
    steps:
      - name: Every Windows test part and check passed
        run: |
          echo "tests: ${{ needs.windows_tests.result }}, checks: ${{ needs.windows_checks.result }}, revit client: ${{ needs.revit_worker_client_windows.result }}"
          if [ "${{ needs.windows_tests.result }}" = skipped ]; then
            echo "Windows hasn't run on this commit: it runs once the PR is labelled merge-ready (the merge script does that)"
            exit 1
          fi
          test "${{ needs.windows_tests.result }}" = success && test "${{ needs.windows_checks.result }}" = success && test "${{ needs.revit_worker_client_windows.result }}" = success

  # The Revit add-in's worker client on Windows, where the add-in runs (the Ubuntu leg is in ci.yml)
  revit_worker_client_windows:
    name: revit_worker_client (windows-latest)
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # the pane's apartment answer, which the C# tests read, is the checker's answer of the day: made here, never
      # committed (a committed copy changed with almost every rule and made every waiting PR conflict)
      - name: Make the Revit pane's apartment answer (the checker's answer to its trial request; never committed)
        run: python apps/revit_addin/tools/evals/make_apartment_answer.py
      # the pinned SDK (global.json, which brings the .NET 10 runtime) and the .NET 8 runtime: the client is built
      # for both (Revit 2025-2026 load add-ins on .NET 8, Revit 2027 on .NET 10) and tested on each. The NuGet
      # packages are cached by the lock files' contents (restore still runs --locked-mode below)
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/revit_addin/global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: apps/revit_addin/**/packages.lock.json
      # run from apps/revit_addin: dotnet reads global.json (the pinned SDK) from the folder it runs in, upward
      - name: Restore the pinned test packages (fails if a version differs from the lock files)
        working-directory: apps/revit_addin
        run: dotnet restore --locked-mode
      - name: The worker client's and the Revit reader's tests on .NET 8 (every conformance scene, read from fake Revit records too; crashes, timeouts, bad answers)
        working-directory: apps/revit_addin
        run: dotnet test --no-restore --framework net8.0
        env:
          GORDIUM_PYTHON: python
      - name: The worker client's and the Revit reader's tests on .NET 10 (the same, plus our duplicate-key check against .NET 10's own)
        working-directory: apps/revit_addin
        run: dotnet test --no-restore --framework net10.0
        env:
          GORDIUM_PYTHON: python
