name: CI

on:
  push:
    branches: [main]
  pull_request:   # every PR, including PRs stacked on other PRs

# A newer push to the same PR replaces the older run, so the queue only holds
# each branch's latest commit. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Extracted text matches a fresh extraction (reproducible)
        run: python -m document_extraction --check
      - name: Rule files are valid (sources, quotes, worked examples, section labels)
        run: python -m rule_format
      - name: Every line of the law is in exactly one piece; coverage report and term index are current (no AI)
        run: python -m section_labeling coverage --check
      - name: The residential coverage audit (every rule and flag piece x district) matches a fresh build (no AI)
        run: python -m section_labeling audit --check
      - name: The rules workbook matches a fresh build (generated, never hand-edited)
        run: python -m rule_export --check
      - name: The measured example models match a fresh measurement (Rhino files measured by code, no AI)
        run: python -m model_measurement --check
      - name: The example project reports match a fresh build (results from the rule checker only)
        run: python -m project_report --check
      - name: Every golden answer is the same (check and start on the test sites, scenarios and 200 stress designs)
        run: python -m design_checker.goldens --check

  # The same tests on Windows, where Python reads files as cp1252 unless told UTF-8. PYTHONUTF8 is deliberately
  # not set: the job proves the code names its encodings, as an architect's Windows PC runs it.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs: Windows on 3.14 only (Linux `check` covers 3.12), halving the slowest runs; main: both versions
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.12", "3.14"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Extracted text matches a fresh extraction (reproducible)
        run: python -m document_extraction --check
      - name: Rule files are valid (sources, quotes, worked examples, section labels)
        run: python -m rule_format
      - name: Every line of the law is in exactly one piece; coverage report is current (no AI)
        run: python -m section_labeling coverage --check
      - name: The residential coverage audit (every rule and flag piece x district) matches a fresh build (no AI)
        run: python -m section_labeling audit --check
      - name: The rules workbook matches a fresh build (generated, never hand-edited)
        run: python -m rule_export --check
      - name: The measured example models match a fresh measurement (Rhino files measured by code, no AI)
        run: python -m model_measurement --check
      - name: The example project reports match a fresh build (results from the rule checker only)
        run: python -m project_report --check
      - name: Every golden answer is the same (check and start on the test sites, scenarios and 200 stress designs)
        run: python -m design_checker.goldens --check
