name: CI

on:
  push:
    branches: [main]
  pull_request:   # every PR, including PRs stacked on other PRs

# The Windows jobs are in windows.yml (Ben, 2026-11-26): GitHub runs about one CI run at a time and Windows is half
# of the jobs, so a push to a PR runs this file (Linux, and the Revit client on Ubuntu), and Windows runs once the
# merge script labels the PR merge-ready, and on every push to main. Two files, so the two never share a check name.

# A newer push to the same PR replaces the older run, so the queue only holds
# each branch's latest commit. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# How the tests are split, so they run side by side (they used to take an hour in one job):
# - each OS runs the whole suite as 4 parts in 4 jobs at once (`pytest --shard K/4`, conftest.py parts_of: the
#   slow tests in tests/test_durations.json go longest first to the part with the least time so far, every other
#   test likewise at 0.2 s; every test in exactly one part), and each job runs its part on every CPU of its machine (pytest-xdist, `-n auto`);
# - the generated-file checks run in their own job beside the tests, and first prove the 4 parts add up to the
#   whole suite with no test left out or run twice (tests/check_shards.py);
# - `check` and `windows (<python>)` keep their old names: each passes only if every part and the checks passed.
# Changing the number of parts: change `part` in the matrices and SHARDS in both ci.yml and windows.yml together.
env:
  SHARDS: 4

jobs:
  linux_tests:
    name: linux tests (part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (this part, on every CPU)
        run: pytest -n auto --dist worksteal --shard ${{ matrix.part }}/${{ env.SHARDS }}

  linux_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: The test parts add up to the whole suite (every test in exactly one part)
        run: python tests/check_shards.py ${{ env.SHARDS }}
      - name: The UI mockup never shows stale results as current (scenario checks in headless Chrome)
        run: python docs/revit/ui_mockup/checks/run_checks.py
      - name: Extracted text matches a fresh extraction (reproducible)
        run: python -m document_extraction --check
      - name: Rule files are valid (sources, quotes, worked examples, section labels)
        run: python -m rule_format
      - name: Every line of the law is in exactly one piece; coverage report and term index are current (no AI)
        run: python -m section_labeling coverage --check
      - name: The residential coverage audit (every rule and flag piece x district) matches a fresh build (no AI)
        run: python -m section_labeling audit --check
      - name: The rules workbook matches a fresh build (generated, never hand-edited)
        run: python -m rule_export --check
      - name: The measured example models match a fresh measurement (Rhino files measured by code, no AI)
        run: python -m model_measurement --check
      - name: The example project reports match a fresh build (results from the rule checker only)
        run: python -m project_report --check
      - name: Every golden answer is the same (check and start on the test sites, scenarios and 200 stress designs)
        run: python -m design_checker.goldens --check

  # The old single Linux job's name: passes only when every Linux test part and the Linux checks passed (a
  # skipped or cancelled part fails it too)
  check:
    if: always()
    needs: [linux_tests, linux_checks]
    runs-on: ubuntu-latest
    steps:
      - name: Every Linux test part and check passed
        run: |
          echo "tests: ${{ needs.linux_tests.result }}, checks: ${{ needs.linux_checks.result }}"
          test "${{ needs.linux_tests.result }}" = success && test "${{ needs.linux_checks.result }}" = success

  # The Revit add-in's worker client (apps/revit_addin: C#, no Revit needed) against the real Python worker,
  # installed the way the trial installs it (Python 3.12). Here on Ubuntu on every push; the Windows leg, where the add-in runs, is in windows.yml.
  revit_worker_client:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu here on every push; the Windows leg is in windows.yml, which runs where a merge is near
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # the pinned SDK (global.json, which brings the .NET 10 runtime) and the .NET 8 runtime: the client is built
      # for both (Revit 2025-2026 load add-ins on .NET 8, Revit 2027 on .NET 10) and tested on each. The NuGet
      # packages are cached by the lock files' contents (restore still runs --locked-mode below)
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/revit_addin/global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: apps/revit_addin/**/packages.lock.json
      # run from apps/revit_addin: dotnet reads global.json (the pinned SDK) from the folder it runs in, upward
      - name: Restore the pinned test packages (fails if a version differs from the lock files)
        working-directory: apps/revit_addin
        run: dotnet restore --locked-mode
      - name: The worker client's and the Revit reader's tests on .NET 8 (every conformance scene, read from fake Revit records too; crashes, timeouts, bad answers)
        working-directory: apps/revit_addin
        run: dotnet test --no-restore --framework net8.0
        env:
          GORDIUM_PYTHON: python
      - name: The worker client's and the Revit reader's tests on .NET 10 (the same, plus our duplicate-key check against .NET 10's own)
        working-directory: apps/revit_addin
        run: dotnet test --no-restore --framework net10.0
        env:
          GORDIUM_PYTHON: python
