name: CI

on:
  push:
    branches: [main]
  pull_request:   # every PR, including PRs stacked on other PRs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Extracted text matches a fresh extraction (reproducible)
        run: python -m document_extraction --check
      - name: Rule files are valid (sources, quotes, worked examples)
        run: python -m rule_format
