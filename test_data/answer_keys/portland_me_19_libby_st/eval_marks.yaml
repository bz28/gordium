# The route eval's marks for the Children's Odyssey model (19 Libby St, Portland ME; rebuilt from sheet LS1.0 by
# apps/revit_addin's ModelBuild, corrected: children_odyssey_corrected.rvt in the trial folder).
#
# EVERY MARK HERE IS AN EVAL ASSUMPTION: Gordium standing in for the architect, who has not marked this model. Each one
# says why it was chosen; where the sheet or the use list gives no clear answer the cautious way is taken (a room no
# route may cross, a door not an exit, a narrower clear width). The set-marks request writes them into a copy of the
# model, the clear-opening stamps signed "eval assumption (Gordium, not the architect)" (MarksRequest.cs; design note
# docs/revit/revit_interior_reading_design.md section 10). The sheet itself is Ben's and not in the repo (hand_check.yaml).
#
# Not a rulebook: no `rules:` key; it loads with the strict loader (rule_format/tests/test_kept.py).

model: children_odyssey_corrected.rvt
by: eval assumption (Gordium, not the architect)
date: "2026-11-21"
occupancy: Group I-4 day care (the sheet's travel-distance note, "I-4 not to exceed 200' sprinklered")

# Every room: its use (a word of Gordium's room-use list), and lockable / pass_through. The sheet draws the exit access
# along the corridor (its travel-distance and common-path lines run there), so the corridor is the only room a route
# may cross: every other room is marked pass_through false (end-only: a route may start in it, never cross it), the
# cautious reading even where classrooms open into each other (D25, D26, D49, D50). lockable is not on the sheet: true
# for storage, toilets, the kitchen and the electrical room (kept locked), false for the occupied rooms; with
# pass_through false either way the room is end-only. sleeping is false for every room: the sleeping-room flag is the
# dwelling code's (IRC R310 escape openings), and a day care has no dwelling sleeping rooms (children's naps don't make
# a classroom one).
room_defaults: {sleeping: false, pass_through: false}
rooms:
  - {number: "2", name: CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre (I-4)}
  - {number: "3", name: MOUNTAIN CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "4", name: OCEAN CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "5", name: INFANT/TODDLER CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "6", name: SAFARI CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "7", name: FOREST CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "8", name: CLASSROOM, use: Day care, lockable: false, why: a classroom of a day-care centre}
  - {number: "9", name: BOOK STORAGE/STAFF LOUNGE, use: Other, lockable: false,
     why: "a staff lounge with book storage: no word fits (accessory storage would call the lounge storage); Other, end-only"}
  - {number: "10", name: KITCHEN, use: Kitchen, lockable: true, why: its name}
  - {number: "11", name: STORAGE, use: Accessory storage, lockable: true, why: "storage of the centre (the sheet: aggregate storage 1,428 SF, under 10% of the story)"}
  - {number: "12", name: LIFE SPACE, use: Other, lockable: false, why: "not a use the list names (a children's activity space?); Other, end-only"}
  - {number: "13", name: STORAGE, use: Accessory storage, lockable: true, why: storage of the centre}
  - {number: "14", name: STORAGE, use: Accessory storage, lockable: true, why: storage of the centre}
  - {number: "15", name: FAMILY LOUNGE, use: Other, lockable: false, why: "a lounge: no word fits; Other, end-only"}
  - {number: "16", name: STAFF TOILET, use: Toilet, lockable: true, why: its name}
  - {number: "17", name: PLAYROOM, use: Day care, lockable: false, why: the children's playroom of a day-care centre}
  - {number: "18", name: ADMINISTRATION, use: Other, lockable: false, why: "offices: no word fits; Other, end-only"}
  - {number: "19", name: CONFERENCE, use: Other, lockable: false, why: "a meeting room: no word fits; Other, end-only"}
  - {number: "21", name: ELEC., use: Other, lockable: true,
     why: "an electrical room: no word fits (it is no closet or storage); Other, end-only and lockable"}
  - {number: "22", name: LIFE SPACE, use: Other, lockable: false, why: "not a use the list names; Other, end-only"}
  - {number: "24", name: TREATMENT, use: Other, lockable: false, why: "a treatment room: no word fits; Other, end-only"}
  - {number: "26", name: CORRIDOR, use: Corridor, lockable: false, pass_through: false,
     why: "the corridor the sheet's exit-access lines run along; a corridor is crossed as one (pass_through false is still given: the format needs it set)"}
  - {number: "28", name: STORAGE, use: Accessory storage, lockable: true, why: storage of the centre}
  - {number: "29", name: STORAGE, use: Accessory storage, lockable: true, why: storage of the centre}
  - {number: "30", name: STAFF TOILET, use: Toilet, lockable: true, why: its name}

# Each door type's clear opening, written on the type with its stamp (every door of the type shares it). No maker's
# figure exists for these doors (the model's families are Revit's stock and Gordium's own): a typical assumption, the
# leaf less about 2 in (its stop and the open leaf's thickness), and 80 in clear height (the code's least, IBC 1008.1.1),
# never more than the leaf.
door_types:
  - {leaf_in: 36, doors: [D01], clear_width_in: 34, clear_height_in: 80, operation: Side-hinged door,
     source: "eval assumption: a 36-in leaf at 34 in clear, 80 in high (typical; no maker's figure)"}
  - {leaf_in: 34, doors: [D05], clear_width_in: 32, clear_height_in: 80, operation: Side-hinged door,
     source: "eval assumption: a 34-in leaf at 32 in clear, 80 in high (typical; no maker's figure)"}
  - {leaf_in: 72, pair: true, doors: [D02], clear_width_in: 34, clear_height_in: 80, operation: Side-hinged door,
     source: "eval assumption: a pair of 36-in leaves, one leaf's 34 in clear (the other taken as latched: the cautious width)"}

# The exits, from LS1.0's legend: an exit is shown by its bold arrow (the legend's "EXIT ENTRANCE" arrow); the circled
# symbol beside many doors is the exit sign, shown at classroom doors back to the corridor too, so it alone doesn't make
# an exit. Matched to the model's doors (D01... in the traced data's order, children_odyssey.json) by position on the
# rendered sheet (1/8" = 1'-0", origin the building's south-west outside corner).
exits:
  - {door: D41, exit: Exterior door at discharge, at: [5.0, 85.0],
     why: "the playroom's north-west door: the sheet's bold up-arrow at it, the landing 'CUT AND GRIND SLAB TO PROVIDE LEVEL LANDING'"}
  - {door: D02, exit: Exterior door at discharge, at: [80.6, 80.0],
     why: "the double door north of the corridor to the loading dock: bold up-arrow ('EXISTING LOADING DOCK SLAB IS LEVEL WITH INTERIOR')"}
  - {door: D03, exit: Exterior door at discharge, at: [5.0, 42.8],
     why: "the corridor's west end, the outer pair of its vestibule: bold left-arrow. The vestibule (D34 to D03) has no Room in the model (an enclosed area with no Room), so this door isn't read until one is placed"}
  - {door: D12, exit: Exterior door at discharge, at: [189.5, 42.8],
     why: "the corridor's east end: bold right-arrow, the end of the sheet's 130'-8\" travel-distance line"}
not_exits:
  - {door: D33, at: [190.4, 0.7],
     why: "Mountain Classroom's south-east door: the sheet shows an exit sign at it but no exit arrow; left unmarked (the cautious way: fewer exits only lengthen routes)"}
  - {door: D34, at: [13.3, 42.8], why: the inner pair of the west vestibule (the exit is its outer pair, D03)}
