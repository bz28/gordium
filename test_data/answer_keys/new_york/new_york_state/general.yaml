  # --- Appendix BF: escape opening into a patio cover ------------------------------------------------------------

  - id: general.bf103_2_escape_opening_into_patio_cover
    kind: flag
    topic: means_of_egress
    title: "A sleeping room's escape opening into a patio cover: unenclosed? (BF103.2)"
    for_each: emergency_escape_opening
    within: sleeping_room
    when_none: not_applicable
    applies_when: opening_into_patio_cover and not patio_cover_openings_open
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 898
        lines: [26, 28]
        quote: "Exterior openings required for light and ventilation into a patio structure conforming to Section BF101 shall be unenclosed where such openings serve as emergency egress or rescue openings from sleeping rooms."
      - file: gov.ny.residential.2025.pdf
        page: 898
        lines: [21, 21]
        quote: "Openings shall be enclosed with any of the following:"
    examples:
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_into_patio_cover: true, patio_cover_openings_open: false}}]
        rows: [{part: w1, within: br1, outcome: needs_review}]
        expect: needs_review
        note: a bedroom window into a screened patio cover; unenclosed under one reading, not under another
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_into_patio_cover: true, patio_cover_openings_open: true}}]
        rows: [{part: w1, within: br1, outcome: not_applicable}]
        expect: not_applicable
        note: nothing fills the patio cover's openings, unenclosed under every reading
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_into_patio_cover: false}}]
        rows: [{part: w1, within: br1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: []
        rows: [{within: br1, outcome: not_applicable}]
        expect: not_applicable
        note: "when_none: a room with no escape opening has none into a patio cover (R319.1's rule fails it)"
    open_questions:
      - 'Does insect screening, plastic or glass in a patio cover''s wall openings (what BF103.1 says openings are "enclosed with") make the patio cover enclosed under BF103.2, so a sleeping room''s escape opening may not open into it?'
    research:
      - question: 'Does insect screening, plastic or glass in a patio cover''s wall openings (what BF103.1 says openings are "enclosed with") make the patio cover enclosed under BF103.2, so a sleeping room''s escape opening may not open into it?'
        searched: [BF101.1, "BF102:patio_cover", BF103.1, BF103.2, R319.1, "R202:emergency_escape_and_rescue_opening"]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 898
            lines: [21, 22]
            quote: "Openings shall be enclosed with any of the following: 1. Insect screening."
          - rank: 4
            cite: 'The model code''s same words, IRC 2021 Appendix AH103.1 and AH103.2 ("shall be unenclosed"), as the City of Houston adopts them; read 2026-11-12 on UpCodes (the label''s research): no commentary or interpretation of "unenclosed" shown'
            url: https://up.codes/viewer/houston/irc-2021/chapter/AH/patio-covers
        why_open: >-
          The label's research (3_section_labels, BF103.2): Appendix BF never defines "unenclosed"; BF103.1 calls
          screened, plastic and glass openings enclosed, which supports the stricter reading, but BF103.2 may mean only
          solid walls. No Ithaca or New York interpretation found; ICC commentary not read.
        readings:
          - id: nothing_in_the_openings
            reading: "unenclosed only if nothing (screening, plastic or glass) fills the patio cover's wall openings"
          - id: screening_leaves_it_open
            reading: insect screening leaves it unenclosed; plastic or glass encloses it
          - id: solid_walls_only
            reading: "only solid walls enclose it; any patio cover meeting BF103.1's 65 percent open or glazed area is unenclosed"
    notes: >-
      A flag, not a rule: of the three readings of "unenclosed" still in play (README, Appendix BF; the label's
      research: nothing in the openings; screening leaves it open; only solid walls enclose), an opening into a
      patio cover with nothing in its openings passes under all of them and one with screening, plastic or glass
      fails under at most some, never all, so no case fails under every reading. Gordium's reading (the label's
      notes, to confirm): "patio structure" is a patio cover (BF103.2 ties it to Section BF101). Only sleeping
      rooms' escape openings (the law's "from sleeping rooms"). Not covered: BF103.2's second sentence (an exit door
      into a patio cover that is not unenclosed needs exits per R318): the egress door has no patio-cover measure.
      No numbers.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R320 handrails --------------------------------------------------------------------------------------------

  - id: general.r320_2_handrail_height
    kind: rule
    topic: means_of_egress
    title: "Handrail height: 34 to 38 in above the nosings (R320.2)"
    for_each: handrail
    within: stair
    when_none: not_applicable
    check: handrail_height >= 34 and handrail_height_max <= 38
    review_when:
      - when: handrail_height >= 34 and handrail_height <= 38 and handrail_height_max > 38
        reason: >-
          Exception 2: at fittings or bendings (between flights, at winders, from handrail to guard, at the start of a
          flight) a handrail may exceed 38 in. Whether this one's highest point is at such a fitting isn't measured; a
          person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [54, 55]
        quote: "Handrail height, measured vertically from the sloped plane adjoining the tread nosing, or finish surface of ramp slope, shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [3, 5]
        quote: "2. Where handrail fittings or bendings are used to provide continuous transition between flights, transitions at winder treads, the transition from handrail to guard, or used at the start of a flight, the handrail height at the fittings or bendings shall be permitted to exceed 38 inches (965 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_height: 35, handrail_height_max: 36}}]
        rows: [{part: h1, within: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_height: 32, handrail_height_max: 34}}]
        rows: [{part: h1, within: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_height: 40, handrail_height_max: 42}}]
        rows: [{part: h1, within: s1, outcome: fail}]
        expect: fail
        note: the whole rail is above 38 in, more than a fitting
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_height: 35, handrail_height_max: 41}}]
        rows: [{part: h1, within: s1, outcome: needs_review}]
        expect: needs_review
        note: rises to 41 in, perhaps at the gooseneck where it meets the guard
      - given: {}
        parts:
          stair: [{id: s1}, {id: s2}]
          handrail: [{id: h1, within: s1, measures: {handrail_height: 36, handrail_height_max: 36}}]
        rows: [{part: h1, within: s1, outcome: pass}, {within: s2, outcome: not_applicable}]
        expect: pass
        note: "when_none: a stair with no handrail has none to measure (R318.7.8 says whether it needs one)"
    notes: >-
      Numbers (R320.2 second reading): 34 (not less than 34 inch, >=), 38 (not more than 38 inch, <=). The review_when
      uses the same 38 turned round (above it) to find rails that exceed it only where exception 2 may allow; the
      exception's own "exceed 38 inch" is none (its flag: a permission, no limit), never used as a limit. Not
      checked: alternating tread devices and ship's ladders (30 to 34 in; no part kind), and exception 1 (a volute,
      turnout or starting easing over the lowest tread), which handrail_height (the least) can't tell apart: such a
      rail can only fail wrongly.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

