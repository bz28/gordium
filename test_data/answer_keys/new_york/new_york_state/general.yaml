    check: guard_present
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [35, 37]
        quote: "Guards shall be provided for those portions of open-sided walking surfaces, including floors, stairs, ramps and landings that are located more than 30 inches (762 mm) measured vertically to the floor or grade below at any point within 36 inches (914 mm) horizontally to the edge of the open side."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [37, 37]
        quote: "Insect screening shall not be considered as a guard."
    examples:
      - given: {}
        parts:
          open_side: [{id: e1, name: Deck edge, measures: {open_side_drop: 48, guard_present: true}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 31, guard_present: false}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 30, guard_present: false}}]
        rows: [{part: e1, outcome: not_applicable}]
        expect: not_applicable
        note: exactly 30 in needs no guard ("more than 30 inches")
      - given: {}
        parts: {open_side: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R321.1.1 second reading): 30 (more than 30 inch, >). The 36 in ("within 36 inch", <=) is in
      open_side_drop's meaning (the greatest drop within 36 in of the edge), not in the formula. guard_present's
      meaning leaves insect screening out.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r321_1_2_guard_height
    kind: rule
    topic: means_of_egress
