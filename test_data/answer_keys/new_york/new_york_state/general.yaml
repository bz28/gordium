  - id: general.r318_7_6_landing_depth
    kind: rule
    topic: means_of_egress
    title: "Stair landing depth: 36 in on a straight run (R318.7.6)"
    for_each: stair
    when_none: not_applicable
    applies_when: >-
      (stair_straight_run or not stair_landings_rectangular) and not (stair_bulkhead and not stair_required_egress
      and stair_basement_to_grade <= 96 and stair_bulkhead_hinged_doors)
    check: stair_landing_depth >= 36
    review_when:
      - when: not stair_landings_rectangular
        reason: >-
          A landing that isn't square or rectangular needs a depth at the walkline and a total area of at least a
          quarter circle whose radius is the required landing width; the measuring code doesn't give the walkline
          depth or the area. A person checks.
      - when: stair_serves_sleeping_loft and stair_landing_depth >= 24 and stair_landing_depth < 36
        reason: >-
          A sleeping loft's stair may have landings 24 in deep (R315.5.2.3), which this key doesn't draft. A person
          checks.
      - when: stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and not stair_bulkhead_hinged_doors
        reason: >-
          A bulkhead stairway, not part of the required egress, with the basement floor 8 ft or less below grade: it is
          exempt from R318.7 if its grade-level opening is covered by "other approved means" than hinged doors, which
          is the code official's call. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [16, 17]
        quote: "Where the stairway has a straight run, the depth in the direction of travel shall be not less than 36 inches (914 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [14, 16]
        quote: "For landings of shapes other than square or rectangular, the depth at the walk line and the total area shall be not less than that of a quarter circle with a radius equal to the required landing width."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [35, 36]
        quote: "Landings at stairways providing egress from sleeping lofts shall comply with Section R318.7.6, except that the depth of landings in the direction of travel shall be not less than 24 inches (610 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [42, 46]
        quote: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_straight_run: true, stair_landings_rectangular: true, stair_landing_depth: 36, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_straight_run: true, stair_landings_rectangular: true, stair_landing_depth: 30, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: a 30 in mid-landing on a straight stair
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_straight_run: true, stair_landings_rectangular: true, stair_landing_depth: 30, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_straight_run: false, stair_landings_rectangular: true, stair_landing_depth: 30}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: an L-shaped stair's square corner landing; the law sets its width (general.r318_7_6_landing_width), no 36 in depth
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_straight_run: false, stair_landings_rectangular: false, stair_landing_depth: 40}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: a curved landing
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers: 36 (R318.7.6 second reading, not less than, >=); 24 (R315.5.2.3, not less than, >=) in a review_when
      only; 8 feet = 96 (R318.7.11.2, <=) in the bulkhead exemption. The quarter circle ("a quarter", none in the
      second reading) is not computed. A sleeping loft's stair: R315.5.2.3 keeps R318.7.6 but lets the depth be 24 in,
      so 24 to 36 in needs review (that section isn't drafted) and under 24 in fails either way. Whether a stair that
      turns with a rectangular landing has any depth limit is the law's silence: none applies here.
