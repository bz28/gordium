        page: 101
        lines: [19, 20]
        quote: "1. The top landing of an interior stairway, including those in an enclosed garage, shall be permitted to be on the other side of a door located at the top of the stairway, provided that the door does not swing over the stairs."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [23, 24]
        quote: "3. At exterior doors, a top landing is not required for an exterior stairway of not more than two risers, provided that the door does not swing over the stairway."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [42, 46]
        quote: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, name: Main stair, measures: {stair_bulkhead: false, stair_top_landing: true, stair_bottom_landing: true}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, name: Basement stair, measures: {stair_bulkhead: false, stair_top_landing: false, stair_bottom_landing: true, stair_exterior: false, stair_top_door: true, stair_top_door_swings_over: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: exception 1, the hall floor beyond a door that swings away from the stair
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_top_landing: false, stair_bottom_landing: true, stair_exterior: false, stair_top_door: true, stair_top_door_swings_over: true}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: the basement door swings out over the top step
      - given: {}
        parts:
          stair: [{id: s1, name: Back steps, measures: {stair_bulkhead: false, stair_top_landing: false, stair_bottom_landing: true, stair_exterior: true, stair_top_door: true, stair_top_door_exterior: true, stair_top_door_swings_over: false, stair_riser_count: 2}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: exception 3, two risers down from an inswinging back door
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_top_landing: false, stair_bottom_landing: true, stair_exterior: true, stair_top_door: true, stair_top_door_exterior: true, stair_top_door_swings_over: false, stair_riser_count: 3}}]
        rows: [{part: s1, outcome: fail}]
