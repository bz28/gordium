  - id: general.r318_7_13_ships_ladder_means_of_egress
    kind: rule
    topic: means_of_egress
    title: "Ship's ladder: not a means of egress, except a small loft (R318.7.13)"
    for_each: ships_ladder
    when_none: not_applicable
    check: not ladder_means_of_egress
    review_when:
      - when: ladder_means_of_egress and ladder_area_is_loft_or_mezzanine and not ladder_only_access_kitchen_or_bath
        reason: >-
          The exception allows the ladder as the means of egress of a loft, mezzanine or similar area of 200 gross
          square feet or less that it isn't the only way to a kitchen or bathroom from. The 200 can't be checked yet
          (the number check doesn't read "200 gross square feet" as an area), so a person checks ladder_area_served is
          200 sq ft or less.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [5, 5]
        quote: "Ship’s ladders shall not be used as an element of a means of egress."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [5, 7]
        quote: "Ship’s ladders shall be permitted provided that a required means of egress stairway or ramp serves the same space at each adjoining level or where a means of egress is not required."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [8, 9]
        quote: "Exception: Ship’s ladders are allowed to be used as an element of a means of egress for lofts, mezzanines and similar areas of 200 gross square feet (18.6 m[fn2]) or less that do not provide exclusive access to a kitchen or bathroom."
    examples:
      - given: {}
        parts:
          ships_ladder: [{id: l1, name: Attic ladder, measures: {ladder_means_of_egress: false}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          ships_ladder: [{id: l1, measures: {ladder_means_of_egress: true, ladder_area_is_loft_or_mezzanine: true, ladder_area_served: 120, ladder_only_access_kitchen_or_bath: false}}]
        rows: [{part: l1, outcome: needs_review}]
        expect: needs_review
        note: the exception, a 120 sq ft loft (a pass once the 200 sq ft can be checked)
      - given: {}
        parts:
          ships_ladder: [{id: l1, measures: {ladder_means_of_egress: true, ladder_area_is_loft_or_mezzanine: false, ladder_area_served: 120, ladder_only_access_kitchen_or_bath: false}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
        note: the only way to a second-story room
      - given: {}
        parts:
          ships_ladder: [{id: l1, measures: {ladder_means_of_egress: true, ladder_area_is_loft_or_mezzanine: true, ladder_area_served: 120, ladder_only_access_kitchen_or_bath: true}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {ships_ladder: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      As general.r318_7_12_atd_means_of_egress, for a ship's ladder: the permitted cases are in ladder_means_of_egress's
      meaning (false); "that do not provide exclusive access" is ladder_only_access_kitchen_or_bath. Number not usable:
      200 (R318.7.13 second reading, "200 gross square foot or less", <=) has the unit "gross square foot", which
      code_numbers doesn't take as square feet; with it read, the check is `not ladder_means_of_egress or
      (ladder_area_is_loft_or_mezzanine and ladder_area_served <= 200 and not ladder_only_access_kitchen_or_bath)` and
      the review_when goes.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

