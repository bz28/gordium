  - id: general.r321_1_3_guard_openings
    kind: flag
    topic: means_of_egress
    title: "Guard openings: 4 in sphere; 4 3/8 in on stairs; 6 in triangle (R321.1.3)"
    for_each: open_side
    when_none: not_applicable
    applies_when: open_side_drop > 30 and guard_present
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [46, 47]
        quote: "Required guards shall not have openings from the walking surface to the required guard height that allow passage of a sphere 4 inches (102 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [49, 50]
        quote: "1. The triangular openings at the open side of stair, formed by the riser, tread and bottom rail of a guard, shall not allow passage of a sphere 6 inches (153 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [51, 52]
        quote: "2. Guards on the open side of stairs shall not have openings that allow passage of a sphere 4 3/8 inches (111 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [35, 37]
        quote: "Guards shall be provided for those portions of open-sided walking surfaces, including floors, stairs, ramps and landings that are located more than 30 inches (762 mm) measured vertically to the floor or grade below at any point within 36 inches (914 mm) horizontally to the edge of the open side."
    examples:
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: false, guard_opening_sphere: 3.75}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: would pass the intended check below (3 3/4 in < 4 in)
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_opening_sphere: 4.5, guard_triangle_sphere: 5.5}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: would fail the intended check (4 1/2 in on a stair, 4 3/8 in allowed)
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 20, guard_present: true, open_side_on_stair: false, guard_opening_sphere: 8}}]
        rows: [{part: e1, outcome: not_applicable}]
        expect: not_applicable
        note: a guard not required (20 in drop)
      - given: {}
        parts: {open_side: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag only because of the number check: R321.1.3's 4, 6 and 4 3/8 are recorded none in text_verification
      (the limit is on the opening, not on the sphere), and a none number may not be compared with, so a person
      checks. The parts measure the opening by the sphere itself (guard_opening_sphere: the largest sphere that
      passes), so the rule this key would hold, once the verification records the opening's limit, is
        guard_opening_sphere < (4.375 if open_side_on_stair else 4)
        and (not open_side_on_stair or guard_triangle_sphere < 6)
      ("shall not allow passage of a sphere 4 inches in diameter": the largest that passes is less than 4 in, so one
      of exactly 4 in fails). Gordium's reading of exception 2: on a stair's open side 4 3/8 in replaces 4 in. The 30
      of "required" is R321.1.1's (more than 30 inch, >).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R315 sleeping lofts ---------------------------------------------------------------------------------------

  - id: general.r315_2_loft_limitations
    kind: rule
    topic: dimensions
    title: "Sleeping loft: under 70 sq ft; over 7 ft on at most half (R315.2)"
    for_each: sleeping_loft
    when_none: not_applicable
    check: loft_floor_area < 70 and loft_floor_area_over_7ft <= 0.5 * loft_floor_area
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [12, 12]
        quote: "1. The sleeping loft floor area shall be less than 70 square feet (6.5 m[fn2])."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [13, 13]
        quote: "2. The sleeping loft ceiling height shall not exceed 7 feet (2134 mm) for more than one-half of the sleeping loft floor area."
    examples:
      - given: {}
        parts:
          sleeping_loft: [{id: l1, name: Loft, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 20}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 70, loft_floor_area_over_7ft: 0}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
        note: 70 sq ft is not "less than 70"
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 30}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
        note: exactly half over 7 ft is allowed
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 40}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {sleeping_loft: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.2 second reading): 70 (less than 70 square foot, <), one-half = 0.5 (<=: its flag says the
      recorded words "more than one-half" are the law backwards; the ceiling may be over 7 ft on at most one-half).
      The 7 feet (not exceed 7 foot, <=) is in loft_floor_area_over_7ft's meaning (floor where the ceiling is
      higher than 7 ft), not in the formula. Spaces under 3 ft of ceiling don't count toward loft_floor_area
      (R315.3; parts.yaml). Lofts R315.1's exceptions free (under 3 ft deep, under 35 sq ft, no permanent means of
      egress) are not marked as sleeping lofts (parts.yaml).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_3_loft_heights
    kind: rule
    topic: dimensions
    title: "Sleeping loft: 7 ft clear below, 3 ft ceiling height above (R315.3)"
    for_each: sleeping_loft
    when_none: not_applicable
    check: loft_clear_height_below >= 84 and loft_ceiling_height >= 36
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [14, 15]
        quote: "The clear height below the sleeping loft floor construction shall not be less than 7 feet (2134 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [15, 15]
        quote: "The ceiling height above the finished floor of the sleeping loft shall not be less than 3 feet (914 mm)."
    examples:
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 86, loft_ceiling_height: 40}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 80, loft_ceiling_height: 40}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
        note: 6 ft 8 in under the loft
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 86, loft_ceiling_height: 34}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {sleeping_loft: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.3 second reading): 7 feet = 84 (not be less than 7 foot, >=), 3 feet = 36 (not be less than 3
      foot, >=). The third sentence's 3 feet (less than 3 foot, <) only says which floor counts (loft_floor_area's
      meaning). loft_ceiling_height is the least height over the loft's counted floor area.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_1_loft_stair_width
    kind: rule
    topic: means_of_egress
    title: "Sleeping loft stair width: 17 in; 20 in below the handrail (R315.5.2.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_serves_sleeping_loft
    check: stair_clear_width >= 17 and stair_clear_width_at_handrail >= 20
    review_when:
      - when: stair_clear_width >= 17 and stair_clear_width_at_handrail >= 17 and stair_clear_width_at_handrail < 20
        reason: >-
          R315.5.2.1 asks 17 in at the handrail and 20 in below it, but stair_clear_width_at_handrail takes "at" and
          "below" together (the least of them); between 17 and 20 in it can't tell which. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [28, 29]
        quote: "Stairways providing egress from a sleeping loft shall not be less than 17 inches (432 mm) in clear width at or above the handrail."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [29, 29]
        quote: "The width below the handrail shall be not less than 20 inches (610 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 22}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 16, stair_clear_width_at_handrail: 22}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 16}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 18}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false, stair_clear_width: 36, stair_clear_width_at_handrail: 32}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.5.2.1 second reading): 17 (not be less than 17 inch, >=), 20 (not less than 20 inch, >=). The
      book's "20 inches (610 mm)" is a misprinted conversion (610 mm is 24 in): the label's notes read 20 in as
      governing (Gordium's reading, to confirm). A loft stair meeting R318.7.1 instead (36 in; 31 1/2 or 27 in) meets
      these too, so this rule alone decides a loft stair's width. Spiral loft stairs too: R315.5.2 permits it for
      any stairway serving a loft.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_2_loft_stair_risers
    kind: rule
    topic: means_of_egress
    title: "Sleeping loft stair risers: 7 to 12 in (R315.5.2.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_serves_sleeping_loft
    check: stair_riser_height - stair_riser_variation >= 7 and stair_riser_height <= 12
    review_when:
      - when: >-
          not (stair_riser_height - stair_riser_variation >= 7 and stair_riser_height <= 12)
          and stair_riser_height <= 8.25 and stair_tread_depth >= 9
        reason: >-
          Outside R315.5.2.2's risers but within R318.7.5's (8 1/4 in, 9 in). R315.5.2 only permits a loft stair to
          follow R315.5.2.1 to R315.5.2.3; whether it may instead take R318.7's risers while taking another rule's
          width (mixing the two sets) is not settled by the law. A person checks the stair meets one set whole.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [30, 31]
        quote: "Risers for stairs providing egress from a sleeping loft shall be not less than 7 inches (178 mm) and not more than 12 inches (305 mm) in height."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [42, 42]
        quote: "The riser height shall be not more than 8 1/4 inches (209 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [50, 50]
        quote: "The tread depth shall be not less than 9 inches (229 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 10, stair_riser_variation: 0.25, stair_tread_depth: 6.75}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: a steep loft stair, 10 in risers (the tread formula is the next flag)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 13, stair_tread_depth: 4}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 6.5, stair_tread_depth: 10}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: under 7 in, but an ordinary R318.7.5 stair (riser 8 1/4 or less, tread 9 or more); whether it may mix the two sets is for a person
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 6.5, stair_riser_variation: 0, stair_tread_depth: 8}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: meets neither R315.5.2.2 (under 7 in) nor R318.7.5.2 (tread under 9 in)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 9, stair_riser_variation: 2.5, stair_tread_depth: 7}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: >-
          the tallest riser is 9 in but the shortest 6 1/2 in: "risers" (every one) must be 7 in at least, and
          stair_riser_height is the tallest (parts.yaml), so the shortest is the tallest minus the variation
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false, stair_riser_height: 10}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Every riser is 7 to 12 in: stair_riser_height is the tallest (parts.yaml), so the shortest is it minus
      stair_riser_variation (fixed after the comparison with the drafts, 2026-11-13: the key first tested the tallest
      riser against the 7 in minimum, which let a flight with one short riser pass).
      Numbers: 7 and 12 (R315.5.2.2 second reading, not less than 7 inch, >=; not more than 12 inch, <=); 8 1/4 =
      8.25 (R318.7.5.1, <=) and 9 (R318.7.5.2, >=). Gordium's reading: "shall be permitted to comply" (R315.5.2) is
      a choice, so a loft stair may meet R318.7's limits instead; but whether it may take some limits from each set
      (R315.5.2.1's 20 in width with R318.7.5's risers) the law doesn't say, so a stair outside R315.5.2.2's risers
      but within R318.7.5's needs review, never a pass (fixed after the comparison with the drafts, review round 3,
      2026-11-13: it passed, which let a 20 in wide stair with 6 1/2 in risers pass on a mix of the two). The
      variation limits are general.r318_7_5_1_riser_variation and general.r318_7_5_2_tread_variation (needs review
      for a loft stair over 3/8 in).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_2_loft_stair_formula
    kind: flag
    topic: means_of_egress
    title: "Sleeping loft stair: tread depth = 20 in minus 4/3 of the riser (R315.5.2.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_serves_sleeping_loft and not (stair_riser_height <= 8.25 and stair_tread_depth >= 9)
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [31, 34]
        quote: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [42, 42]
        quote: "The riser height shall be not more than 8 1/4 inches (209 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [50, 50]
        quote: "The tread depth shall be not less than 9 inches (229 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 10.5, stair_tread_depth: 6}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: 20 - 4/3 x 10.5 = 6 in, as drawn; still a person's check (see notes)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 7.5, stair_tread_depth: 10}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: an ordinary R318.7.5 riser and tread; the formula is not needed
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    open_questions:
      - 'R315.5.2.2: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth." Is the tread to equal 20 in minus 4/3 of the riser exactly (within what tolerance, since built stairs never match to the hundredth), or is it a least tread (at least 20 in minus 4/3 of the riser)?'
    research:
      - question: 'R315.5.2.2: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth." Is the tread to equal 20 in minus 4/3 of the riser exactly (within what tolerance, since built stairs never match to the hundredth), or is it a least tread (at least 20 in minus 4/3 of the riser)?'
        searched: [R315.5.2, R315.5.2.2, R318.7.5, R318.7.5.1, R318.7.5.2]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 98
            lines: [31, 34]
            quote: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth."
        why_open: >-
          "Shall be calculated in accordance with" a formula reads as an equality, but the law gives no tolerance, and
          the two formulas are the same line, so "one of" offers no real choice; R318.7.5's own limits are minimums
          and maximums with a 3/8 in tolerance between treads. No New York interpretation found; ICC commentary not
          read.
    notes: >-
      A flag, not a rule: the two formulas are one line (tread = 20 - 4/3 riser is riser = 15 - 3/4 tread), so "one
      of" adds no choice, but "shall be" sets an exact equality with no tolerance, and text_verification records 20,
      15, four-thirds and three-fourths as none (not limits), so no formula may use them as one. A loft stair that
      takes the R318.7.5 path instead (riser 8 1/4 or less, R318.7.5.1, <=; tread 9 or more, R318.7.5.2, >=) needs no
      formula: not applicable.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft
