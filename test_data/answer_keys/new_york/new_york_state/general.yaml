      not (stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and stair_bulkhead_hinged_doors)
    check: >-
      stair_bottom_landing and (stair_top_landing
      or (not stair_exterior and stair_top_door and not stair_top_door_swings_over)
      or (stair_exterior and stair_top_door and stair_top_door_exterior and not stair_top_door_swings_over and stair_riser_count <= 2))
    review_when:
      - when: stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and not stair_bulkhead_hinged_doors
        reason: >-
