          stair: [{id: s1}]
          handrail: []
        rows: [{within: s1, outcome: not_applicable}]
        expect: not_applicable
    notes: "Number (R320.4 second reading): 1 1/2 = 1.5 (not less than 1 1/2 inch, >=)."
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R321 guards -----------------------------------------------------------------------------------------------

  - id: general.r321_1_1_guard_required
    kind: rule
    topic: means_of_egress
    title: "Guard where the drop is more than 30 in (R321.1.1)"
    for_each: open_side
    when_none: not_applicable
    applies_when: open_side_drop > 30
    check: guard_present
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [35, 37]
        quote: "Guards shall be provided for those portions of open-sided walking surfaces, including floors, stairs, ramps and landings that are located more than 30 inches (762 mm) measured vertically to the floor or grade below at any point within 36 inches (914 mm) horizontally to the edge of the open side."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [37, 37]
        quote: "Insect screening shall not be considered as a guard."
    examples:
      - given: {}
        parts:
          open_side: [{id: e1, name: Deck edge, measures: {open_side_drop: 48, guard_present: true}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 31, guard_present: false}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 30, guard_present: false}}]
        rows: [{part: e1, outcome: not_applicable}]
        expect: not_applicable
        note: exactly 30 in needs no guard ("more than 30 inches")
      - given: {}
        parts: {open_side: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R321.1.1 second reading): 30 (more than 30 inch, >). The 36 in ("within 36 inch", <=) is in
      open_side_drop's meaning (the greatest drop within 36 in of the edge), not in the formula. guard_present's
      meaning leaves insect screening out.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r321_1_2_guard_height
    kind: rule
    topic: means_of_egress
    title: "Guard height: 36 in; 34 in on stairs; 34-38 in as handrail (R321.1.2)"
    for_each: open_side
    when_none: not_applicable
    applies_when: guard_present and (open_side_drop > 30 or (open_side_on_stair and guard_is_handrail))
    check: >-
      guard_height >= (34 if open_side_on_stair else 36)
      and (not (open_side_on_stair and guard_is_handrail) or guard_height_max <= 38)
    review_when:
      - when: open_side_on_stair and guard_is_handrail and guard_height >= 34 and guard_height <= 38 and guard_height_max > 38
        reason: "Above 38 in only somewhere: R320.2 exception 2 lets a handrail exceed 38 in at fittings or bendings (the transition from handrail to guard among them), and whether that holds for a required guard's top under R321.1.2 exception 2 is open; where the greatest height is isn't measured. A person checks."
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [38, 40]
        quote: "Required guards at open-sided walking surfaces, including stairs, porches, balconies or landings, shall be not less than 36 inches (914 mm) in height as measured vertically above the adjacent walking surface or the line connecting the nosings."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [42, 43]
        quote: "1. Guards on the open sides of stairs shall have a height of not less than 34 inches (864 mm) measured vertically from a line connecting the nosings."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [44, 45]
        quote: "2. Where the top of the guard serves as a handrail on the open sides of stairs, the top of the guard shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm) as measured vertically from a line connecting the nosings."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [35, 37]
        quote: "Guards shall be provided for those portions of open-sided walking surfaces, including floors, stairs, ramps and landings that are located more than 30 inches (762 mm) measured vertically to the floor or grade below at any point within 36 inches (914 mm) horizontally to the edge of the open side."
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [54, 55]
        quote: "Handrail height, measured vertically from the sloped plane adjoining the tread nosing, or finish surface of ramp slope, shall be not less than 34 inches (864 mm) and not more than 38 inches (965 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [3, 5]
        quote: "Where handrail fittings or bendings are used to provide continuous transition between flights, transitions at winder treads, the transition from handrail to guard, or used at the start of a flight, the handrail height at the fittings or bendings shall be permitted to exceed 38 inches (965 mm)."
    examples:
      - given: {}
        parts:
          open_side: [{id: e1, name: Deck edge, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: false, guard_height: 36}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: false, guard_height: 34}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
        note: a 34 in guard is enough on a stair, not on a deck
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_is_handrail: false, guard_height: 34}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_is_handrail: false, guard_height: 33}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 36, guard_height_max: 37}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 39, guard_height_max: 40}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
        note: a stair guard whose top is the handrail can't be over 38 in
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 24, guard_present: true, open_side_on_stair: false, guard_height: 30}}]
        rows: [{part: e1, outcome: not_applicable}]
        expect: not_applicable
        note: a guard not required (24 in drop) is not a "required guard"
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 24, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 42, guard_height_max: 44}}]
        rows: [{part: e1, outcome: fail}]
        expect: fail
        note: a guard top that is the stair's handrail is held to R320.2's 34-38 in at any drop
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 24, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 35, guard_height_max: 40}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: above 38 in only somewhere, which R320.2 exception 2 allows at fittings or bendings
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 36, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 35, guard_height_max: 40}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: a required guard too; whether R321.1.2 exception 2's 38 in holds at a fitting is open (review round 8)
      - given: {}
        parts: {open_side: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R321.1.2 second reading): 36 (>=), 34 (exception 1, >=), 34 and 38 (exception 2, >= and <=); the 30 of
      "required" is R321.1.1's (more than 30 inch, >). A missing guard is general.r321_1_1_guard_required's fail.
      Fixed after the comparison (review round 6): a guard top that serves as the stair's handrail was checked only
      on a drop over 30 in, so a 42 in one on a 24 in drop passed; it is the stair's handrail, and R320.2's 34 to 38
      in holds for every handrail, so it is checked at any drop, with R320.2 exception 2's review where the greatest
      height is above 38 in (fittings or bendings; review round 7). Review round 8: that review holds for a required
      guard too. R320.2 exception 2 names "the transition from handrail to guard", R321.1.2 exception 2 caps the
      guard's top at 38 in, and neither refers to the other, so which governs at a fitting is open (recorded in the
      drafts' research on general.r321_1_2_guard_height_stair_guard_as_handrail), and an open reading needs review.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r321_1_3_guard_openings
    kind: flag
    topic: means_of_egress
    title: "Guard openings: 4 in sphere; 4 3/8 in on stairs; 6 in triangle (R321.1.3)"
    for_each: open_side
    when_none: not_applicable
    applies_when: open_side_drop > 30 and guard_present
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [46, 47]
        quote: "Required guards shall not have openings from the walking surface to the required guard height that allow passage of a sphere 4 inches (102 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [49, 50]
        quote: "1. The triangular openings at the open side of stair, formed by the riser, tread and bottom rail of a guard, shall not allow passage of a sphere 6 inches (153 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [51, 52]
        quote: "2. Guards on the open side of stairs shall not have openings that allow passage of a sphere 4 3/8 inches (111 mm) in diameter."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [35, 37]
        quote: "Guards shall be provided for those portions of open-sided walking surfaces, including floors, stairs, ramps and landings that are located more than 30 inches (762 mm) measured vertically to the floor or grade below at any point within 36 inches (914 mm) horizontally to the edge of the open side."
    examples:
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: false, guard_opening_sphere: 3.75}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: would pass the intended check below (3 3/4 in < 4 in)
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_opening_sphere: 4.5, guard_triangle_sphere: 5.5}}]
        rows: [{part: e1, outcome: needs_review}]
        expect: needs_review
        note: would fail the intended check (4 1/2 in on a stair, 4 3/8 in allowed)
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 20, guard_present: true, open_side_on_stair: false, guard_opening_sphere: 8}}]
        rows: [{part: e1, outcome: not_applicable}]
        expect: not_applicable
        note: a guard not required (20 in drop)
      - given: {}
        parts: {open_side: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag only because of the number check: R321.1.3's 4, 6 and 4 3/8 are recorded none in text_verification
      (the limit is on the opening, not on the sphere), and a none number may not be compared with, so a person
      checks. The parts measure the opening by the sphere itself (guard_opening_sphere: the largest sphere that
      passes), so the rule this key would hold, once the verification records the opening's limit, is
        guard_opening_sphere < (4.375 if open_side_on_stair else 4)
        and (not open_side_on_stair or guard_triangle_sphere < 6)
      ("shall not allow passage of a sphere 4 inches in diameter": the largest that passes is less than 4 in, so one
      of exactly 4 in fails). Gordium's reading of exception 2: on a stair's open side 4 3/8 in replaces 4 in. The 30
      of "required" is R321.1.1's (more than 30 inch, >).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R315 sleeping lofts ---------------------------------------------------------------------------------------

  - id: general.r315_2_loft_limitations
    kind: rule
    topic: dimensions
    title: "Sleeping loft: under 70 sq ft; over 7 ft on at most half (R315.2)"
    for_each: sleeping_loft
    when_none: not_applicable
    check: loft_floor_area < 70 and loft_floor_area_over_7ft <= 0.5 * loft_floor_area
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [12, 12]
        quote: "1. The sleeping loft floor area shall be less than 70 square feet (6.5 m[fn2])."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [13, 13]
        quote: "2. The sleeping loft ceiling height shall not exceed 7 feet (2134 mm) for more than one-half of the sleeping loft floor area."
    examples:
      - given: {}
        parts:
          sleeping_loft: [{id: l1, name: Loft, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 20}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 70, loft_floor_area_over_7ft: 0}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
        note: 70 sq ft is not "less than 70"
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 30}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
        note: exactly half over 7 ft is allowed
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_floor_area: 60, loft_floor_area_over_7ft: 40}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {sleeping_loft: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.2 second reading): 70 (less than 70 square foot, <), one-half = 0.5 (<=: its flag says the
      recorded words "more than one-half" are the law backwards; the ceiling may be over 7 ft on at most one-half).
      The 7 feet (not exceed 7 foot, <=) is in loft_floor_area_over_7ft's meaning (floor where the ceiling is
      higher than 7 ft), not in the formula. Spaces under 3 ft of ceiling don't count toward loft_floor_area
      (R315.3; parts.yaml). Lofts R315.1's exceptions free (under 3 ft deep, under 35 sq ft, no permanent means of
      egress) are not marked as sleeping lofts (parts.yaml).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_3_loft_heights
    kind: rule
    topic: dimensions
    title: "Sleeping loft: 7 ft clear below, 3 ft ceiling height above (R315.3)"
    for_each: sleeping_loft
    when_none: not_applicable
    check: loft_clear_height_below >= 84 and loft_ceiling_height >= 36
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [14, 15]
        quote: "The clear height below the sleeping loft floor construction shall not be less than 7 feet (2134 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [15, 15]
        quote: "The ceiling height above the finished floor of the sleeping loft shall not be less than 3 feet (914 mm)."
    examples:
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 86, loft_ceiling_height: 40}}]
        rows: [{part: l1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 80, loft_ceiling_height: 40}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
        note: 6 ft 8 in under the loft
      - given: {}
        parts:
          sleeping_loft: [{id: l1, measures: {loft_clear_height_below: 86, loft_ceiling_height: 34}}]
        rows: [{part: l1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {sleeping_loft: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.3 second reading): 7 feet = 84 (not be less than 7 foot, >=), 3 feet = 36 (not be less than 3
      foot, >=). The third sentence's 3 feet (less than 3 foot, <) only says which floor counts (loft_floor_area's
      meaning). loft_ceiling_height is the least height over the loft's counted floor area.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_1_loft_stair_width
    kind: rule
    topic: means_of_egress
    title: "Sleeping loft stair width: 17 in; 20 in below the handrail (R315.5.2.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_serves_sleeping_loft
    check: stair_clear_width >= 17 and stair_clear_width_at_handrail >= 20
    review_when:
      - when: stair_clear_width >= 17 and stair_clear_width_at_handrail >= 17 and stair_clear_width_at_handrail < 20
        reason: >-
          R315.5.2.1 asks 17 in at the handrail and 20 in below it, but stair_clear_width_at_handrail takes "at" and
          "below" together (the least of them); between 17 and 20 in it can't tell which. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [28, 29]
        quote: "Stairways providing egress from a sleeping loft shall not be less than 17 inches (432 mm) in clear width at or above the handrail."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [29, 29]
        quote: "The width below the handrail shall be not less than 20 inches (610 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 22}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 16, stair_clear_width_at_handrail: 22}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 16}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_clear_width: 22, stair_clear_width_at_handrail: 18}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false, stair_clear_width: 36, stair_clear_width_at_handrail: 32}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R315.5.2.1 second reading): 17 (not be less than 17 inch, >=), 20 (not less than 20 inch, >=). The
      book's "20 inches (610 mm)" is a misprinted conversion (610 mm is 24 in): the label's notes read 20 in as
      governing (Gordium's reading, to confirm). A loft stair meeting R318.7.1 instead (36 in; 31 1/2 or 27 in) meets
      these too, so this rule alone decides a loft stair's width. Spiral loft stairs too: R315.5.2 permits it for
      any stairway serving a loft.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_2_loft_stair_risers
    kind: rule
    topic: means_of_egress
    title: "Sleeping loft stair risers: 7 to 12 in (R315.5.2.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_serves_sleeping_loft
    check: stair_riser_height - stair_riser_variation >= 7 and stair_riser_height <= 12
    review_when:
      - when: >-
          not (stair_riser_height - stair_riser_variation >= 7 and stair_riser_height <= 12)
          and stair_riser_height <= 8.25 and stair_tread_depth >= 9
        reason: >-
          Outside R315.5.2.2's risers but within R318.7.5's (8 1/4 in, 9 in). R315.5.2 only permits a loft stair to
          follow R315.5.2.1 to R315.5.2.3; whether it may instead take R318.7's risers while taking another rule's
          width (mixing the two sets) is not settled by the law. A person checks the stair meets one set whole.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [30, 31]
        quote: "Risers for stairs providing egress from a sleeping loft shall be not less than 7 inches (178 mm) and not more than 12 inches (305 mm) in height."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [42, 42]
        quote: "The riser height shall be not more than 8 1/4 inches (209 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [50, 50]
        quote: "The tread depth shall be not less than 9 inches (229 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 10, stair_riser_variation: 0.25, stair_tread_depth: 6.75}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: a steep loft stair, 10 in risers (the tread formula is the next flag)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 13, stair_tread_depth: 4}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 6.5, stair_tread_depth: 10}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: under 7 in, but an ordinary R318.7.5 stair (riser 8 1/4 or less, tread 9 or more); whether it may mix the two sets is for a person
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 6.5, stair_riser_variation: 0, stair_tread_depth: 8}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: meets neither R315.5.2.2 (under 7 in) nor R318.7.5.2 (tread under 9 in)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 9, stair_riser_variation: 2.5, stair_tread_depth: 7}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: >-
          the tallest riser is 9 in but the shortest 6 1/2 in: "risers" (every one) must be 7 in at least, and
          stair_riser_height is the tallest (parts.yaml), so the shortest is the tallest minus the variation
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false, stair_riser_height: 10}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Every riser is 7 to 12 in: stair_riser_height is the tallest (parts.yaml), so the shortest is it minus
      stair_riser_variation (fixed after the comparison with the drafts, 2026-11-13: the key first tested the tallest
      riser against the 7 in minimum, which let a flight with one short riser pass).
      Numbers: 7 and 12 (R315.5.2.2 second reading, not less than 7 inch, >=; not more than 12 inch, <=); 8 1/4 =
      8.25 (R318.7.5.1, <=) and 9 (R318.7.5.2, >=). Gordium's reading: "shall be permitted to comply" (R315.5.2) is
      a choice, so a loft stair may meet R318.7's limits instead; but whether it may take some limits from each set
      (R315.5.2.1's 20 in width with R318.7.5's risers) the law doesn't say, so a stair outside R315.5.2.2's risers
      but within R318.7.5's needs review, never a pass (fixed after the comparison with the drafts, review round 3,
      2026-11-13: it passed, which let a 20 in wide stair with 6 1/2 in risers pass on a mix of the two). The
      variation limits are general.r318_7_5_1_riser_variation and general.r318_7_5_2_tread_variation (needs review
      for a loft stair over 3/8 in).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r315_5_2_2_loft_stair_formula
    kind: flag
    topic: means_of_egress
    title: "Sleeping loft stair: tread depth = 20 in minus 4/3 of the riser (R315.5.2.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: >-
      stair_serves_sleeping_loft and not (stair_riser_height <= 8.25 and stair_tread_depth >= 9
      and stair_clear_width >= 36 and stair_clear_width_at_handrail >= (31.5 if stair_handrail_sides <= 1 else 27))
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [31, 34]
        quote: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [42, 42]
        quote: "The riser height shall be not more than 8 1/4 inches (209 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [50, 50]
        quote: "The tread depth shall be not less than 9 inches (229 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [23, 24]
        quote: "Stairways shall be not less than 36 inches (914 mm) in clear width at all points above the permitted handrail height and below the required headroom height."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [24, 26]
        quote: "The clear width of stairways at and below the handrail height, including treads and landings, shall be not less than 31 1/2 inches (787 mm) where a handrail is installed on one side and 27 inches (698 mm) where handrails are installed on both sides."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 10.5, stair_tread_depth: 6}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: 20 - 4/3 x 10.5 = 6 in, as drawn; still a person's check (see notes)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 7.5, stair_tread_depth: 10,
                                      stair_clear_width: 36, stair_clear_width_at_handrail: 32, stair_handrail_sides: 1}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: an ordinary R318.7 stair, width, risers and treads; the formula is not needed
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: true, stair_riser_height: 8, stair_tread_depth: 12,
                                      stair_clear_width: 17, stair_clear_width_at_handrail: 20, stair_handrail_sides: 1}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: >-
          R315.5.2.1's width with R318.7.5's riser and tread, and neither formula (20 - 4/3 x 8 = 9.33, not 12): a mix
          of the two sets, for a person (fixed after the comparison, review round 4: it was not applicable)
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    open_questions:
      - 'R315.5.2.2: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth." Is the tread to equal 20 in minus 4/3 of the riser exactly (within what tolerance, since built stairs never match to the hundredth), or is it a least tread (at least 20 in minus 4/3 of the riser)?'
    research:
      - question: 'R315.5.2.2: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth." Is the tread to equal 20 in minus 4/3 of the riser exactly (within what tolerance, since built stairs never match to the hundredth), or is it a least tread (at least 20 in minus 4/3 of the riser)?'
        searched: [R315.5.2, R315.5.2.2, R318.7.5, R318.7.5.1, R318.7.5.2]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 98
            lines: [31, 34]
            quote: "Tread depth and riser height shall be calculated in accordance with one of the following formulas: 1. The tread depth shall be 20 inches (508 mm) minus four-thirds of the riser height. 2. The riser height shall be 15 inches (381 mm) minus three-fourths of the tread depth."
        why_open: >-
          "Shall be calculated in accordance with" a formula reads as an equality, but the law gives no tolerance, and
          the two formulas are the same line, so "one of" offers no real choice; R318.7.5's own limits are minimums
          and maximums with a 3/8 in tolerance between treads. No New York interpretation found; ICC commentary not
          read.
    notes: >-
      A flag, not a rule: the two formulas are one line (tread = 20 - 4/3 riser is riser = 15 - 3/4 tread), so "one
      of" adds no choice, but "shall be" sets an exact equality with no tolerance, and text_verification records 20,
      15, four-thirds and three-fourths as none (not limits), so no formula may use them as one. A loft stair that
      takes the R318.7.5 path instead (riser 8 1/4 or less, R318.7.5.1, <=; tread 9 or more, R318.7.5.2, >=) needs no
      formula: not applicable; only a stair that meets R318.7 whole (its width as well, R318.7.1) does, since whether a
      loft stair may mix the two sets is open (general.r315_5_2_2_loft_stair_risers). Fixed after the comparison with
      the drafts, review round 4, 2026-11-13: R318.7.1's width was not part of that test, so a stair with R315.5.2.1's
      width and R318.7.5's risers was not applicable.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R318.3 landings at exterior doors (added 2026-11-14) -------------------------------------------------------

  - id: general.r318_3_door_landings
    kind: rule
    topic: means_of_egress
    title: "Exterior door: a landing or floor on each side (R318.3)"
    for_each: exterior_door
    when_none: not_applicable
    check: >-
      exterior_door_inside_landing and (exterior_door_outside_landing or (not exterior_door_is_egress_door
      and exterior_door_outside_stair_risers <= 2 and not exterior_door_swings_outward))
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [50, 50]
        quote: "There shall be a landing or floor on each side of each exterior door."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [7, 8]
        quote: "Exterior doors other than the required egress door shall be provided with landings or floors not more than 8 1/4 inches (209 mm) below the top of the threshold."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [9, 10]
        quote: "Exception: An exterior landing or floor is not required at the exterior doorway where a stairway of not more than two risers is located on the exterior side of the door, provided that the door does not swing over the stairway."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, name: Front door, measures: {exterior_door_is_egress_door: true, exterior_door_inside_landing: true, exterior_door_outside_landing: true}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_inside_landing: true, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 2, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: the required egress door gets no relief; two steps straight down from the sill fail (R318.3.1 asks its landing too)
      - given: {}
        parts:
          exterior_door: [{id: d1, name: Side door, measures: {exterior_door_is_egress_door: false, exterior_door_inside_landing: true, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 2, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
        note: R318.3.2's exception, two risers and an inswinging door
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false, exterior_door_inside_landing: true, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 3, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false, exterior_door_inside_landing: true, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 1, exterior_door_swings_outward: true}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a storm-door-style outswing over the step loses the exception
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.3.2 second reading): two (not more than two riser, <=), inside an "or" (the exception). R318.3.2's
      exception ("An exterior landing or floor is not required") is read as relief from R318.3's outside landing too,
      for doors other than the required egress door only: it sits under "other exterior doors", and R318.3.1 keeps a
      landing at the egress door (its exception lowers it, never removes it). Gordium's reading. R318.7.6 exception 3
      (no top landing for an exterior stair of two risers or fewer at an exterior door) is the stair's side of the
      same case. Not read: R318.7.11.2's exemption of a bulkhead stairway from R318.3 (the exterior door part has no
      bulkhead measure: a basement door marked at the foot of such a stair can only fail wrongly).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_landing_width
    kind: rule
    topic: means_of_egress
    title: "Exterior door landing: at least as wide as the door (R318.3)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: exterior_door_inside_landing or exterior_door_outside_landing
    check: exterior_door_landing_width >= exterior_door_width
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [50, 51]
        quote: "The width of each landing shall be not less than the door served."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_width: 36, exterior_door_landing_width: 48}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_width: 36, exterior_door_landing_width: 32}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a 32 in stoop at a 36 in door
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: false, exterior_door_outside_landing: false}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
        note: no landing to measure (general.r318_3_door_landings fails it)
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      No numbers. "The door served" is read as the door's width (exterior_door_width: the leaf or leaves it serves).
      exterior_door_landing_width is the least of the two sides, so one narrow side fails the door. Where only one
      side has a landing (R318.3.2's exception) it is that side's.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_landing_depth
    kind: rule
    topic: means_of_egress
    title: "Exterior door landing: 36 in in the direction of travel (R318.3)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: exterior_door_inside_landing or exterior_door_outside_landing
    check: exterior_door_landing_depth >= 36
    review_when:
      - when: exterior_door_onto_balcony and exterior_door_balcony_area < 60 and exterior_door_landing_depth < 36
        reason: >-
          The exception lets a door onto an exterior balcony under 60 sq ft, reached only from a door, have a landing
          shallower than 36 in. exterior_door_landing_depth is the least of the two sides, so whether the shallow
          side is the balcony (allowed) or the inside floor (not) isn't told. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [51, 52]
        quote: "Landings shall have a dimension of not less than 36 inches (914 mm) measured in the direction of travel."
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [53, 54]
        quote: "Exception: Exterior balconies less than 60 square feet (5.6 m[fn2]) and only accessed from a door are permitted to have a landing that is less than 36 inches (914 mm) measured in the direction of travel."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_landing_depth: 36, exterior_door_onto_balcony: false}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_landing_depth: 30, exterior_door_onto_balcony: false}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a 30 in deep front stoop
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_landing_depth: 30, exterior_door_onto_balcony: true, exterior_door_balcony_area: 40}}]
        rows: [{part: d1, outcome: needs_review}]
        expect: needs_review
        note: a 40 sq ft Juliet-style balcony, 30 in deep
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_inside_landing: true, exterior_door_outside_landing: true, exterior_door_landing_depth: 30, exterior_door_onto_balcony: true, exterior_door_balcony_area: 60}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: exactly 60 sq ft is not "less than 60"
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.3 second reading): 36 (not less than 36 inch, >=); 60 (less than 60 square foot, <), used only in
      the review_when; the exception's "less than 36 inch" is a permission. "Only accessed from a door" is in
      exterior_door_onto_balcony's meaning.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_exterior_landing_slope
    kind: rule
    topic: means_of_egress
    title: "Exterior landing slope: not more than 1/4 in 12 (R318.3)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: exterior_door_outside_landing
    check: exterior_door_outside_slope * 12 <= 0.25
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [52, 52]
        quote: "The slope at exterior landings shall not exceed 1/4 unit vertical in 12 units horizontal (2 percent)."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_outside_landing: true, exterior_door_outside_slope: 0.0208}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
        note: 1/4 in per foot, at the limit (0.0208 x 12 = 0.2496)
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_outside_landing: true, exterior_door_outside_slope: 0.0417}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: 1/2 in per foot
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_outside_landing: false}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.3 second reading): 1/4 (not exceed 1/4 unit vertical, <=) over 12 (12 unit horizontal, none: a
      term of the slope), written slope x 12 <= 1/4; the 2 percent is a conversion. Only the exterior landing (the
      law's "exterior landings").
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_1_egress_door_landing_drop
    kind: rule
    topic: means_of_egress
    title: "Egress door landings: 1 1/2 in below the threshold; 8 1/4 in outside (R318.3.1)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: exterior_door_is_egress_door
    check: >-
      exterior_door_inside_drop <= 1.5 and (exterior_door_outside_drop <= 1.5 or (not exterior_door_swings_outward
      and exterior_door_outside_drop <= 8.25))
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [55, 56]
        quote: "Landings or finished floors at the required egress door shall be not more than 1 1/2 inches (38 mm) lower than the top of the threshold."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [3, 4]
        quote: "Exception: The landing or floor on the exterior side shall be not more than 8 1/4 inches (209 mm) below the top of the threshold provided that the door does not swing over the landing or floor."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, name: Front door, measures: {exterior_door_is_egress_door: true, exterior_door_inside_drop: 0.5, exterior_door_outside_drop: 1.5, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_inside_drop: 0.5, exterior_door_outside_drop: 7.5, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
        note: the exception, one step down to an inswinging door's stoop
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_inside_drop: 0.5, exterior_door_outside_drop: 7.5, exterior_door_swings_outward: true}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: an outswinging door over a stoop 7 1/2 in down
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_inside_drop: 0.5, exterior_door_outside_drop: 9, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_inside_drop: 2, exterior_door_outside_drop: 1, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a 2 in sill above the inside floor
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
        note: other exterior doors are R318.3.2's (general.r318_3_2_other_door_landing_drop)
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.3.1 second reading): 1 1/2 = 1.5 (not more than, <=), 8 1/4 = 8.25 (not more than, <=, inside the
      exception's "or"). The exception is the exterior side only. With no exterior landing the outside drop isn't
      given: needs review here, and general.r318_3_door_landings fails the door.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_1_egress_landing_access_to_grade
    kind: flag
    topic: means_of_egress
    title: "Egress door landing not at grade: a ramp or stairway to grade? (R318.3.1)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: exterior_door_is_egress_door and exterior_door_outside_landing and not exterior_door_outside_at_grade
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [5, 6]
        quote: "Where exterior landings or floors serving the required egress door are not at grade, they shall be provided with access to grade by means of a ramp in accordance with Section R318.8 or a stairway in accordance with Section R318.7."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_outside_landing: true, exterior_door_outside_at_grade: false, exterior_door_access_to_grade: none}}]
        rows: [{part: d1, outcome: needs_review}]
        expect: needs_review
        note: a raised deck at the egress door; a person checks it has a ramp or stairway down to grade
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true, exterior_door_outside_landing: true, exterior_door_outside_at_grade: true}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag, not a rule, only because the format can't read the measure that answers it: exterior_door_access_to_grade
      (text: ramp, stairway or none) is a text measure, and the formula check allows quoted text only beside district
      or use, so `exterior_door_access_to_grade in ["ramp", "stairway"]` is refused. Once text part measures can be
      compared, this is that rule (fails with "none"). No numbers. The ramp or stairway itself is checked by the ramp
      and stair rules (R318.8, R318.7); a stairway serving the egress door is marked stair_egress_door_access (R318.7.6
      exception 4 then doesn't apply to it).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_3_2_other_door_landing_drop
    kind: rule
    topic: means_of_egress
    title: "Other exterior doors: landings 8 1/4 in below the threshold at most (R318.3.2)"
    for_each: exterior_door
    when_none: not_applicable
    applies_when: not exterior_door_is_egress_door
    check: >-
      exterior_door_inside_drop <= 8.25 and ((exterior_door_outside_landing and exterior_door_outside_drop <= 8.25)
      or (not exterior_door_outside_landing and exterior_door_outside_stair_risers <= 2 and not exterior_door_swings_outward))
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [7, 8]
        quote: "Exterior doors other than the required egress door shall be provided with landings or floors not more than 8 1/4 inches (209 mm) below the top of the threshold."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [9, 10]
        quote: "Exception: An exterior landing or floor is not required at the exterior doorway where a stairway of not more than two risers is located on the exterior side of the door, provided that the door does not swing over the stairway."
    examples:
      - given: {}
        parts:
          exterior_door: [{id: d1, name: Back door, measures: {exterior_door_is_egress_door: false, exterior_door_inside_drop: 0.5, exterior_door_outside_landing: true, exterior_door_outside_drop: 7.75}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false, exterior_door_inside_drop: 0.5, exterior_door_outside_landing: true, exterior_door_outside_drop: 10}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false, exterior_door_inside_drop: 0.5, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 2, exterior_door_swings_outward: false}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
        note: the exception, two risers straight down from an inswinging door
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: false, exterior_door_inside_drop: 0.5, exterior_door_outside_landing: false, exterior_door_outside_stair_risers: 2, exterior_door_swings_outward: true}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          exterior_door: [{id: d1, measures: {exterior_door_is_egress_door: true}}]
        rows: [{part: d1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {exterior_door: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.3.2 second reading): 8 1/4 = 8.25 (not more than, <=), two (not more than two riser, <=, inside the
      exception's "or"). "Landings or floors" is read as both sides (the inside floor too), as R318.3.1 reads them
      for the egress door.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R318.7.3, R318.7.6, R318.7.11 stairs: rise, landings, spiral and bulkhead stairs (added 2026-11-14) -------

  - id: general.r318_7_3_stair_vertical_rise
    kind: rule
    topic: means_of_egress
    title: "Flight vertical rise: not more than 12 ft 7 in (R318.7.3)"
    for_each: stair
    when_none: not_applicable
    applies_when: >-
      not (stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and stair_bulkhead_hinged_doors)
    check: stair_vertical_rise <= 151
    review_when:
      - when: stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and not stair_bulkhead_hinged_doors
        reason: >-
          A bulkhead stairway, not part of the required egress, with the basement floor 8 ft or less below grade: it is
          exempt from R318.7 if its grade-level opening is covered by "other approved means" than hinged doors, which
          is the code official's call. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [34, 35]
        quote: "A flight of stairs shall not have a vertical rise greater than 12 feet 7 inches (3835 mm) between floor levels or landings."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [42, 46]
        quote: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."
    examples:
