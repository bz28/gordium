          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: false}}]
        rows: [{part: w1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {emergency_escape_opening: []}
        rows: [{outcome: not_applicable}]
