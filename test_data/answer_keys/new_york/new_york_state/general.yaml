        rows: [{part: e1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          open_side: [{id: e1, measures: {open_side_drop: 60, guard_present: true, open_side_on_stair: true, guard_is_handrail: true, guard_height: 36, guard_height_max: 37}}]
        rows: [{part: e1, outcome: pass}]
        expect: pass
      - given: {}
