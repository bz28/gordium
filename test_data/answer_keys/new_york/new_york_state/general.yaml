      A flag: a loft sits within nothing, so whether the room it is open to was labeled (loft_room, checked by
      general.r319_1_loft_room_escape_opening) can't be read from the loft. A person checks each loft's room is
      labeled; the escape opening itself is then checked by code.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R319.2 to R319.4 escape opening size, doors, area wells ---------------------------------------------------

  - id: general.r319_2_1_net_clear_area
    kind: rule
    topic: means_of_egress
    title: "Escape opening net clear area: 5.7 sq ft; 5 sq ft at grade floor (R319.2.1)"
    for_each: emergency_escape_opening
    when_none: not_applicable
    check: opening_net_clear_area >= (5 if opening_at_grade else 5.7)
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [48, 49]
        quote: "Emergency escape and rescue openings shall have a net clear opening of not less than 5.7 square feet (0.530 m[fn2])."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [50, 50]
        quote: "Exception: The minimum net clear opening for grade-floor emergency escape and rescue openings shall be 5 square feet (0.465 m[fn2])."
      - file: gov.ny.residential.2025.pdf
        page: 44
        lines: [3, 4]
        quote: "GRADE FLOOR EMERGENCY ESCAPE AND RESCUE OPENING. An emergency escape and rescue opening located such that the bottom of the clear opening is not more than 44 inches (1118 mm) above or below the finished ground level adjacent to the opening."
    examples:
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_net_clear_area: 5.9, opening_at_grade: false}}]
        rows: [{part: w1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_net_clear_area: 5.2, opening_at_grade: false}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: a second-floor casement with 5.2 sq ft clear
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_net_clear_area: 5.2, opening_at_grade: true}}]
        rows: [{part: w1, outcome: pass}]
        expect: pass
        note: the same window at a grade floor
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_net_clear_area: 4.8, opening_at_grade: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
      - given: {}
        parts: {emergency_escape_opening: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
        note: "when_none: no escape openings to size (R319.1's rules fail a room with none)"
    notes: >-
      Numbers (R319.2.1 second reading): 5.7 (not less than 5.7 square foot, >=) and 5 ('5 square foot', >=: its flag
      says "minimum" is printed before the subject). opening_at_grade means a grade floor opening as R202 defines it
      (bottom of the clear opening not more than 44 in above or below the finished ground next to it); the
      definition's 44 is not used in the formula, only to say what the measure means.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
