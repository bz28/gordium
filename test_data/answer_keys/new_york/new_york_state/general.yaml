        expect: fail
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_adjacent_to_wall: false}}]
        rows: [{part: h1, within: s1, outcome: not_applicable}]
        expect: not_applicable
        note: the top of the guard on an open side
      - given: {}
