        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: the casement sash hits the well wall before it is fully open
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_area: 12, area_well_projection: 36, area_well_width: 48, opening_fully_openable: true, area_well_ladder: true}}]
        rows: [{part: w1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_area: 6, area_well_projection: 24, area_well_width: 36, opening_fully_openable: true, area_well_ladder: true}}]
        rows: [{part: w1, outcome: fail}]
