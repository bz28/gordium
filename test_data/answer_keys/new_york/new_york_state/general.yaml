        page: 101
        lines: [38, 39]
        quote: "The clear width at and below the handrails at spiral stairways shall be not less than 26 inches (660 mm) and the walkline radius shall be not greater than 24 1/2 inches (622 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_walkline_radius: 20}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_walkline_radius: 26}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: a large spiral whose walkline sits farther out than 24 1/2 in
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.11.1 second reading): 24 1/2 = 24.5 (not greater than, <=). The walkline is R318.7.4's, 12 in from
      the inside of the turn (stair_walkline_radius's meaning). No loft review: R315.5.2 sets no walkline.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_11_1_spiral_treads
    kind: rule
    topic: means_of_egress
    title: "Spiral stair: identical treads, 6 3/4 in deep at the walkline (R318.7.11.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_spiral
    check: stair_walkline_tread_depth >= 6.75 and stair_treads_identical
    review_when:
      - when: stair_serves_sleeping_loft and stair_walkline_tread_depth < 6.75
        reason: >-
          A spiral stair serving a sleeping loft may follow R315.5.2.2's treads and risers instead (R315.5.2), and
          whether a loft stair may mix those limits with R318.7's is open. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [39, 40]
        quote: "Each tread shall have a depth of not less than 6 3/4 inches (171 mm) at the walkline."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [40, 40]
        quote: "Treads shall be identical, and the rise shall be not more than 9 1/2 inches (241 mm)."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_walkline_tread_depth: 7.5, stair_treads_identical: true, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_walkline_tread_depth: 6.5, stair_treads_identical: true, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_walkline_tread_depth: 7.5, stair_treads_identical: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: a wider top tread cut to meet the floor opening
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.11.1 second reading): 6 3/4 = 6.75 (not less than, >=). "Treads shall be identical" is
      stair_treads_identical. R318.7.5.2's 9 in tread is replaced for a spiral stair by this rule: R318.7.11 says spiral
      stairways comply with R318.7 "except as specified in" R318.7.11.1 (Gordium's reading; R318.7.5.2 has no spiral
      exception of its own, but a spiral tread is measured at the walkline here, which R318.7.5.2 doesn't do).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_11_1_spiral_riser_height
    kind: rule
