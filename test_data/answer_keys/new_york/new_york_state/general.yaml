    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [40, 40]
        quote: "Treads shall be identical, and the rise shall be not more than 9 1/2 inches (241 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [49, 49]
        quote: "2. The riser height of spiral stairways shall be in accordance with Section R318.7.11.1."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_riser_height: 9.5, stair_serves_sleeping_loft: false}}]
