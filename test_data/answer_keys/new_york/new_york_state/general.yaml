  - id: general.r318_7_6_garage_top_landing
    kind: rule
    topic: means_of_egress
    title: "Garage stair: top landing 8 1/4 in below the threshold at most (R318.7.6)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_at_enclosed_garage and stair_top_door
    check: stair_top_landing_drop <= 8.25
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [21, 22]
        quote: "2. At an enclosed garage, the top landing at the stair shall be permitted to be not more than 8 1/4 inches (209 mm) below the top of the threshold."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, name: Garage steps, measures: {stair_at_enclosed_garage: true, stair_top_door: true, stair_top_landing_drop: 7.5}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_at_enclosed_garage: true, stair_top_door: true, stair_top_landing_drop: 10}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_at_enclosed_garage: false, stair_top_door: true}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.6 second reading): 8 1/4 = 8.25 (not more than, <=). Read as a limit: the exception permits the
      garage stair's top landing to sit up to 8 1/4 in below the threshold of the door into the house, and no lower.
      Elsewhere R318.7.6 sets no number for a top landing below a door's threshold (exterior doors: R318.3.1 and
      R318.3.2), so other stairs are not applicable here (open question).
    open_questions:
      - 'R318.7.6 exception 2: "At an enclosed garage, the top landing at the stair shall be permitted to be not more than 8 1/4 inches (209 mm) below the top of the threshold." For an interior stair that is not at a garage, with a door at its top (exception 1), how far below the door''s threshold may the top landing be: level with it, or some threshold height?'
    research:
      - question: 'R318.7.6 exception 2: "At an enclosed garage, the top landing at the stair shall be permitted to be not more than 8 1/4 inches (209 mm) below the top of the threshold." For an interior stair that is not at a garage, with a door at its top (exception 1), how far below the door''s threshold may the top landing be: level with it, or some threshold height?'
        searched: [R318.7.6, R318.3, R318.3.1, R318.3.2, R318.7.5.1, "R202:stairway", "R202:flight"]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 101
            lines: [19, 20]
            quote: "1. The top landing of an interior stairway, including those in an enclosed garage, shall be permitted to be on the other side of a door located at the top of the stairway, provided that the door does not swing over the stairs."
        why_open: >-
          The exception implies the general rule keeps the top landing level with the threshold, but R318.7.6 states no
          tolerance for an interior door's threshold (R318.3.1's 1 1/2 in is for the egress door, R318.3.2's 8 1/4 in for
          other exterior doors). No New York interpretation found; ICC commentary not read (the model IRC's R311.7.6
          differs: it drops the top landing at an interior door that doesn't swing over the stairs).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

