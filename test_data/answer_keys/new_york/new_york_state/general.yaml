        lines: [26, 27]
        quote: "The finger recess shall begin within 3/4 inch (19 mm) measured vertically from the tallest portion of the profile and have a depth of not less than 5/16 inch (8 mm) within 7/8 inch (22 mm) below the widest portion of the profile."
      - file: gov.ny.residential.2025.pdf
