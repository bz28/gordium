    check: >-
      (not stair_top_landing or stair_top_landing_width >= stair_width) and stair_bottom_landing_width >=
      (36 if stair_exterior and stair_to_grade_serving_deck and stair_riser_count <= 3 and not stair_egress_door_access else stair_width)
    review_when:
      - when: stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and not stair_bulkhead_hinged_doors
        reason: >-
          A bulkhead stairway, not part of the required egress, with the basement floor 8 ft or less below grade: it is
          exempt from R318.7 if its grade-level opening is covered by "other approved means" than hinged doors, which
          is the code official's call. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [13, 14]
        quote: "The width perpendicular to the direction of travel shall be not less than the width of the flight served."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [25, 27]
        quote: "4. Exterior stairways to grade with three or fewer risers serving a deck, porch or patio shall have a bottom landing width of not less than 36 inches (914 mm), provided that the stairway is not the required access to grade serving the required egress door."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [42, 46]
        quote: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_top_landing: true, stair_width: 36, stair_top_landing_width: 36, stair_bottom_landing_width: 40, stair_exterior: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_top_landing: true, stair_width: 42, stair_top_landing_width: 36, stair_bottom_landing_width: 42, stair_exterior: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: a 42 in flight onto a 36 in landing
      - given: {}
        parts:
          stair: [{id: s1, name: Deck steps, measures: {stair_bulkhead: false, stair_top_landing: true, stair_width: 72, stair_top_landing_width: 120, stair_bottom_landing_width: 36, stair_exterior: true, stair_to_grade_serving_deck: true, stair_riser_count: 3, stair_egress_door_access: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: exception 4, 6 ft wide deck steps of three risers onto a 36 in pad
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false, stair_top_landing: true, stair_width: 72, stair_top_landing_width: 120, stair_bottom_landing_width: 36, stair_exterior: true, stair_to_grade_serving_deck: true, stair_riser_count: 3, stair_egress_door_access: true}}]
