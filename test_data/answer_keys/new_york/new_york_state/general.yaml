        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_riser_height: 10, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: false, stair_riser_height: 10}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.11.1 second reading): 9 1/2 = 9.5 (not more than, <=). "The rise" is read as the riser height (one
      step's), as R318.7.5.1 exception 2 sends a spiral stair's riser height here; stair_riser_height is the tallest.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_11_1_spiral_headroom
    kind: rule
    topic: means_of_egress
    title: "Spiral stair headroom: 6 ft 6 in (R318.7.11.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_spiral
    check: stair_headroom >= 78
    review_when:
      - when: stair_serves_sleeping_loft and stair_headroom < 78
        reason: >-
          A sleeping loft's means of egress follows R318 "as modified by" R315.5.1 (a 3 ft ceiling height); whether that
          relaxes a stair's headroom is open (general.r318_7_2_stair_headroom). A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [40, 41]
        quote: "Head-room shall be not less than 6 feet 6 inches (1982 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [33, 33]
        quote: "2. The headroom for spiral stairways shall be in accordance with Section R318.7.11.1."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_headroom: 78, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_headroom: 74, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: true, stair_headroom: 74, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_spiral: false, stair_headroom: 78}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: an ordinary flight's headroom is R318.7.2's 6 ft 8 in (general.r318_7_2_stair_headroom)
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.11.1 second reading): 6 feet 6 inches = 78 (not less than, >=; its flag: one length).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_11_2_bulkhead_other_approved_means
    kind: flag
    topic: means_of_egress
    title: "Bulkhead stair covered by other than hinged doors: approved means? (R318.7.11.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_bulkhead and not stair_required_egress and stair_basement_to_grade <= 96 and not stair_bulkhead_hinged_doors
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [42, 46]
        quote: "Stairways serving bulkhead enclosures, not part of the required building egress, providing access from the outside grade level to the basement shall be exempt from the requirements of Sections R318.3 and R318.7 where the height from the basement finished floor level to grade adjacent to the stairway is not more than 8 feet (2438 mm) and the grade level opening to the stairway is covered by a bulkhead enclosure with hinged doors or other approved means."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, name: Bulkhead stair, measures: {stair_bulkhead: true, stair_required_egress: false, stair_basement_to_grade: 90, stair_bulkhead_hinged_doors: false}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: a bulkhead with a sliding cover
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: true, stair_required_egress: false, stair_basement_to_grade: 90, stair_bulkhead_hinged_doors: true}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: hinged doors, exempt; the stair rules leave it out
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: true, stair_required_egress: false, stair_basement_to_grade: 100, stair_bulkhead_hinged_doors: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: basement floor more than 8 ft below grade, never exempt; the stair rules check it
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_bulkhead: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag, not a rule: R318.7.11.2 sets no requirement, it exempts a bulkhead stairway from R318.3 and R318.7. Where
      its measurable conditions hold (not part of the required egress; basement floor 8 feet = 96 in or less below the
      grade beside it, R318.7.11.2 second reading, not more than, <=; hinged doors) the stair rules this key adds
      (R318.7.3, R318.7.6) leave the stair out; covered by "other approved means" is the code official's call, so
      those rules need review and this flag says why. The stair rules written before (R318.7.1, R318.7.2, R318.7.5.1,
      R318.7.5.2, R318.7.8) don't read the exemption yet: an exempt bulkhead stair marked there can only fail wrongly.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R318.7.12 alternating tread devices, R318.7.13 ship's ladders (added 2026-11-14) ---------------------------

  - id: general.r318_7_12_atd_means_of_egress
    kind: rule
    topic: means_of_egress
    title: "Alternating tread device: not a means of egress, except a small loft (R318.7.12)"
    for_each: alternating_tread_device
    when_none: not_applicable
    check: not atd_means_of_egress
    review_when:
      - when: atd_means_of_egress and atd_area_is_loft_or_mezzanine and not atd_only_access_kitchen_or_bath
        reason: >-
          The exception allows the device as the means of egress of a loft, mezzanine or similar area of 200 gross
          square feet or less that it isn't the only way to a kitchen or bathroom from. The 200 can't be checked yet
          (the number check doesn't read "200 gross square feet" as an area), so a person checks atd_area_served is 200
          sq ft or less.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [47, 47]
        quote: "Alternating tread devices shall not be used as an element of a means of egress."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [47, 49]
        quote: "Alternating tread devices shall be permitted provided that a required means of egress stairway or ramp serves the same space at each adjoin-ing level or where a means of egress is not required."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [51, 52]
        quote: "Exception: Alternating tread devices are allowed to be used as an element of a means of egress for lofts, mezzanines and simi-lar areas of 200 gross square feet (18.6 m[fn2]) or less where such devices do not provide exclusive access to a kitchen or bathroom."
    examples:
      - given: {}
        parts:
          alternating_tread_device: [{id: a1, name: Attic storage access, measures: {atd_means_of_egress: false}}]
        rows: [{part: a1, outcome: pass}]
        expect: pass
        note: a stair also serves the space, or it needs no means of egress
      - given: {}
        parts:
          alternating_tread_device: [{id: a1, name: Loft device, measures: {atd_means_of_egress: true, atd_area_is_loft_or_mezzanine: true, atd_area_served: 150, atd_only_access_kitchen_or_bath: false}}]
        rows: [{part: a1, outcome: needs_review}]
        expect: needs_review
        note: the exception, a 150 sq ft loft (a pass once the 200 sq ft can be checked)
      - given: {}
        parts:
          alternating_tread_device: [{id: a1, measures: {atd_means_of_egress: true, atd_area_is_loft_or_mezzanine: true, atd_area_served: 150, atd_only_access_kitchen_or_bath: true}}]
        rows: [{part: a1, outcome: fail}]
        expect: fail
        note: the loft holds the only bathroom it reaches
      - given: {}
        parts:
          alternating_tread_device: [{id: a1, measures: {atd_means_of_egress: true, atd_area_is_loft_or_mezzanine: false, atd_area_served: 150, atd_only_access_kitchen_or_bath: false}}]
        rows: [{part: a1, outcome: fail}]
        expect: fail
        note: the only way up to a second-floor bedroom
      - given: {}
        parts: {alternating_tread_device: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      The permitted cases (a required stairway or ramp serves the same space at each level, or no means of egress is
      required) are in atd_means_of_egress's meaning (false). "Similar areas" is in atd_area_is_loft_or_mezzanine's
      meaning; "exclusive access" is atd_only_access_kitchen_or_bath. Number not usable: 200 (R318.7.12 second
      reading, "200 gross square foot or less", <=; the m2's flag: the "or less" is the 200's) is read with the unit
      "gross square foot", which code_numbers doesn't take as square feet, so no formula may compare atd_area_served
      with it; the exception's loft therefore needs review instead of passing, whatever its area (with code_numbers
      reading it, the check is `not atd_means_of_egress or (atd_area_is_loft_or_mezzanine and atd_area_served <= 200
      and not atd_only_access_kitchen_or_bath)` and the review_when goes). A sleeping loft's ladder is R315.5.3's, not
      this (a device marked as one is still checked here).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

