# New York State, 2025 Residential Code (RCNYS): house egress rules, an ANSWER KEY made by hand.
# Written 2026-11-13 by a Claude Code helper (claude-opus-5-5) that never saw any AI-drafted egress rule, drafting
# log or drafting run: it read only the law (the book's extracted text, its labels, definitions and
# text_verification.yaml) and the rule format. AI-drafted rules are graded against it, rule by rule.
# Every number is one of its piece's second_reading_numbers, used with the comparison second_reading_comparisons
# gives (each rule's notes say which piece and flag). Lengths in inches, areas in square feet.
# Interpretations are open questions or notes with the reading; where the law or the model can't decide, a
# review_when (or a flag) makes the result needs review, never a pass. Draft (approval deferred, 2026-10-19).
#
# Extended 2026-11-14 by the same kind of helper, again from the law only (no AI draft, drafting log or comparison
# seen): R318.3 to R318.3.2 (exterior door landings), R318.7.3, R318.7.6, R318.7.11.1 (spiral stairs),
# R318.7.11.2 (bulkhead stairs), R318.7.12 to R318.7.13.2 (alternating tread devices, ship's ladders), R318.8.1 to
# R318.8.3 (ramps), R319.4.2.1, R319.4.2.2, R319.6, R320.3, R320.5 and R320.6.
#
# Not covered (out of scope for this key): Appendix BO (existing buildings: flags in the labels), R318.7.4 (walkline:
# a definition of where to measure), the other stair sections after R318.7.5.2 (R318.7.5.3 onward, R318.7.7, R318.7.9,
# R318.7.10), R319.1.1, R319.4.3 to R319.5, R319.7, R321.1.4 onward, R315.4, R315.5.1, R315.5.2.3. The stair rules
# written on 2026-11-13 don't read R318.7.11.2's bulkhead exemption (the 2026-11-14 ones do).

district: general
rules:

  # --- R318.2 egress door ---------------------------------------------------------------------------------------

  - id: general.r318_2_egress_door
    kind: rule
    topic: means_of_egress
    title: "Egress door: side-hinged, 32 in clear width, 78 in clear height (R318.2)"
    for_each: egress_door
    when_none: fail
    check: door_side_hinged and door_clear_width >= 32 and door_clear_height >= 78
    review_when:
      - when: dwelling_units > 1
        reason: >-
          Two dwelling units: each needs its own egress door, and which unit a door serves isn't in the model. A
          person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [44, 44]
        quote: "Not less than one egress door shall be provided for each dwelling unit."
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [44, 46]
        quote: "The egress door shall be side-hinged, and shall provide a clear width of not less than 32 inches (813 mm) where measured between the face of the door and the stop, with the door open 90 degrees (1.57 rad)."
      - file: gov.ny.residential.2025.pdf
        page: 99
        lines: [46, 47]
        quote: "The clear height of the door opening shall be not less than 78 inches (1981 mm) in height measured from the top of the threshold to the bottom of the stop."
    examples:
      - given: {dwelling_units: 1}
        parts:
          egress_door: [{id: d1, name: Front door, measures: {door_side_hinged: true, door_clear_width: 34, door_clear_height: 80}}]
        rows: [{part: d1, outcome: pass}]
        expect: pass
      - given: {dwelling_units: 1}
        parts:
          egress_door: [{id: d1, measures: {door_side_hinged: true, door_clear_width: 30, door_clear_height: 80}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a 2 ft 8 in door leaf gives about 30 in clear between the stop and the door face
      - given: {dwelling_units: 1}
        parts:
          egress_door: [{id: d1, measures: {door_side_hinged: true, door_clear_width: 34, door_clear_height: 76}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
      - given: {dwelling_units: 1}
        parts:
          egress_door: [{id: d1, measures: {door_side_hinged: false, door_clear_width: 70, door_clear_height: 80}}]
        rows: [{part: d1, outcome: fail}]
        expect: fail
        note: a sliding patio door marked as the egress door is not side-hinged
      - given: {dwelling_units: 1}
        parts: {egress_door: []}
        rows: [{outcome: fail}]
        expect: fail
        note: "when_none: a dwelling unit with no egress door fails (\"Not less than one egress door shall be provided\")"
      - given: {dwelling_units: 2}
        parts:
          egress_door: [{id: d1, measures: {door_side_hinged: true, door_clear_width: 34, door_clear_height: 80}}]
        rows: [{part: d1, outcome: needs_review}]
        expect: needs_review
        note: two dwelling units, one door marked; which unit each door serves isn't in the model
    notes: >-
      Numbers (R318.2 second reading): 32 (not less than 32 inch, >=), 78 (not less than 78 inch, >=); "one" (>=) is
      the per-unit count: in a one-family house the when_none (no door: fail) is the whole requirement; with two
      units a person checks each has its own (review_when, value only: "one" is the doors' count, not the units').
      Fixed after the comparison with the drafts, 2026-11-13: this was a flag with applies_when "dwelling_units - 1 > 0",
      which code_numbers now reads as a limit on units the law never sets. The 90 degrees and the mm are none (a measuring condition and conversions). Only
      the door the architect marks as the required egress door is checked ("Other doors shall not be required to
      comply with these minimum dimensions"). Not checked here: "readily openable from inside ... without the use
      of a key" (no measure), and R318.1's path to the door and where it opens (not in scope).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_1_stair_width
    kind: rule
    topic: means_of_egress
    title: "Stair clear width: 36 in; 31 1/2 or 27 in at the handrail (R318.7.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: not stair_serves_sleeping_loft and not stair_spiral
    check: stair_clear_width >= 36 and stair_clear_width_at_handrail >= (31.5 if stair_handrail_sides <= 1 else 27)
    review_when:
      - when: stair_handrail_sides == 0 and stair_clear_width_at_handrail < 36
        reason: >-
          R318.7.1 gives the clear width at and below the handrail height only where a handrail is installed on one
          side (31 1/2 in) or on both (27 in); for a flight with no handrail it says nothing, and the 36 in above the
          handrail height may be meant to hold all the way down. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [23, 24]
        quote: "Stairways shall be not less than 36 inches (914 mm) in clear width at all points above the permitted handrail height and below the required headroom height."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [24, 26]
        quote: "The clear width of stairways at and below the handrail height, including treads and landings, shall be not less than 31 1/2 inches (787 mm) where a handrail is installed on one side and 27 inches (698 mm) where handrails are installed on both sides."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [27, 27]
        quote: "Exception: The width of spiral stairways shall be in accordance with Section R318.7.11.1."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, name: Main stair, measures: {stair_clear_width: 38, stair_clear_width_at_handrail: 34, stair_handrail_sides: 1, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 34, stair_clear_width_at_handrail: 34, stair_handrail_sides: 1, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: 34 in above the handrail, under 36
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 36, stair_clear_width_at_handrail: 30, stair_handrail_sides: 1, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: one handrail, 30 in at the handrail, under 31 1/2
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 36, stair_clear_width_at_handrail: 28, stair_handrail_sides: 2, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: two handrails, 28 in between them, at least 27
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 36, stair_clear_width_at_handrail: 26, stair_handrail_sides: 2, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 36, stair_clear_width_at_handrail: 32, stair_handrail_sides: 0, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
        note: no handrail, 32 in at the lower level; the law gives no width for that case
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 26, stair_clear_width_at_handrail: 26, stair_handrail_sides: 1, stair_spiral: true, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: a spiral stairway is R318.7.11.1's (general.r318_7_11_1_*), not this rule's
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_clear_width: 20, stair_clear_width_at_handrail: 22, stair_handrail_sides: 1, stair_spiral: false, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: a sleeping loft's stair may follow R315.5.2.1 instead (general.r315_5_2_1_loft_stair_width)
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
        note: "when_none: no stairs, nothing to check"
    notes: >-
      Spiral stairways need review here until R318.7.11.1 is drafted (fixed after the comparison with the drafts,
      2026-11-13: they were not applicable, which left a spiral stair's rise, width and headroom unchecked).
      Numbers (R318.7.1 second reading): 36 (not less than 36 inch, >=), 31 1/2 = 31.5 (not less than, >=), 27 ("and
      27 inch", >=: its flag says the "not less than" governs the 27 too); "one" (none) is the one side, written
      stair_handrail_sides - 1 > 0 for "both sides" (the count in arithmetic: the validator refuses a "none"
      number in a comparison, and this one is a count of sides, not a limit). The mm are conversions (787 and 698 mm are misprints, the label's
      notes: the inches govern, Gordium's reading). A loft's stair is left to R315.5.2.1: R315.5.2 lets it follow
      those sections instead, and they are the looser ones (17 and 20 in), so a loft stair meeting R318.7.1 meets
      them too. R318.7's exceptions (a stair not within or serving a building, porch or deck; one leading to a
      nonhabitable attic or a crawl space) and R318.7.11.2's bulkhead stairs: such stairs should not be marked; the
      parts have no measure saying so (a stair marked anyway can only fail wrongly, never pass wrongly). Fixed after the comparison with the drafts, 2026-11-14: R318.7.11.1 is now drafted (general.r318_7_11_1_*), so a spiral stairway is left out of this rule (not applicable) instead of needing review: R318.7.11.1's rules check it.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_2_stair_headroom
    kind: rule
    topic: means_of_egress
    title: "Stair headroom: 6 ft 8 in (R318.7.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: not stair_spiral
    check: stair_headroom >= 80
    review_when:
      - when: stair_serves_sleeping_loft and stair_headroom < 80
        reason: >-
          A sleeping loft's means of egress follows R318 "as modified by" R315.5.1 to R315.5.3 (R315.5), and R315.5.1
          asks only a 3 ft ceiling height over the width of the loft's means of egress. Whether that relaxes R318.7.2's
          headroom on the loft's stair is not settled (open question); a person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [28, 29]
        quote: "The headroom in stairways shall be not less than 6 feet 8 inches (2032 mm) measured vertically from the sloped line adjoining the tread nosing or from the floor surface of the landing or platform on that portion of the stairway."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [33, 33]
        quote: "2. The headroom for spiral stairways shall be in accordance with Section R318.7.11.1."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [22, 23]
        quote: "The means of egress shall comply with Section R318 as modified by Sections R315.5.1 through R315.5.3."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [24, 25]
        quote: "A ceiling height of not less than 3 feet (914 mm) shall be provided for the entire width of the means of egress from the sleeping loft."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_headroom: 84, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_headroom: 78, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: 6 ft 6 in under a floor beam, short of 6 ft 8 in
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_headroom: 60, stair_spiral: false, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_headroom: 80, stair_spiral: false, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_headroom: 78, stair_spiral: true}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: a spiral stairway is R318.7.11.1's (general.r318_7_11_1_*), not this rule's
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    open_questions:
      - 'R315.5: a sleeping loft''s means of egress "shall comply with Section R318 as modified by Sections R315.5.1 through R315.5.3", and R315.5.1 requires "A ceiling height of not less than 3 feet (914 mm) ... for the entire width of the means of egress from the sleeping loft." Does R315.5.1 replace R318.7.2''s 6 ft 8 in headroom on the stair serving the loft (so a lower headroom near the loft is lawful), or does the stair keep R318.7.2''s headroom and R315.5.1 govern only the loft''s own floor?'
    research:
      - question: 'R315.5: a sleeping loft''s means of egress "shall comply with Section R318 as modified by Sections R315.5.1 through R315.5.3", and R315.5.1 requires "A ceiling height of not less than 3 feet (914 mm) ... for the entire width of the means of egress from the sleeping loft." Does R315.5.1 replace R318.7.2''s 6 ft 8 in headroom on the stair serving the loft (so a lower headroom near the loft is lawful), or does the stair keep R318.7.2''s headroom and R315.5.1 govern only the loft''s own floor?'
        searched: [R315.5, R315.5.1, R315.5.2, R315.3, R318.7.2, "R202:ceiling_height", "R202:sleeping_loft"]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 98
            lines: [24, 25]
            quote: "A ceiling height of not less than 3 feet (914 mm) shall be provided for the entire width of the means of egress from the sleeping loft."
        why_open: >-
          R315.5 applies R318 "as modified by" R315.5.1 to R315.5.3, and R315.5.1 sets a ceiling height (R202: the clear
          height from the finished floor to the finished ceiling) for the loft's means of egress without saying whether
          it stands in for R318.7.2's stair headroom; R315.5.2 lists the loft stair's own width, risers and landings
          but not headroom. No New York interpretation found; ICC commentary not read. Until answered, a loft stair
          under 6 ft 8 in needs review.
    notes: >-
      Spiral stairways need review here until R318.7.11.1 is drafted (fixed after the comparison with the drafts,
      2026-11-13: they were not applicable, which left a spiral stair's rise, width and headroom unchecked).
      Number (R318.7.2 second reading): 6 feet 8 inches = 80 (not less than, >=; its flag: one length, recorded as
      '6 foot' and '8 inch'). 4 3/4 in (exception 1, <=) is not used: the floor opening may project into the
      headroom up to 4 3/4 in where the nosings run under its edge, which stair_headroom (the least clear height)
      can't tell apart, so such a stair can only fail wrongly (measure lacking: the floor-opening projection). Fixed after the comparison with the drafts, 2026-11-14: R318.7.11.1 is now drafted (general.r318_7_11_1_*), so a spiral stairway is left out of this rule (not applicable) instead of needing review: R318.7.11.1's rules check it.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_5_1_riser_height
    kind: rule
    topic: means_of_egress
    title: "Riser height: not more than 8 1/4 in (R318.7.5.1)"
    for_each: stair
    when_none: not_applicable
    applies_when: not stair_serves_sleeping_loft and not stair_spiral
    check: stair_riser_height <= 8.25
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [42, 42]
        quote: "The riser height shall be not more than 8 1/4 inches (209 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [49, 49]
        quote: "2. The riser height of spiral stairways shall be in accordance with Section R318.7.11.1."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_height: 7.75, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_height: 8.25, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: exactly 8 1/4 in is allowed ("not more than")
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_height: 8.5, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_height: 9, stair_spiral: false, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: a loft stair's risers are general.r315_5_2_2_loft_stair_risers
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Spiral stairways need review here until R318.7.11.1 is drafted (fixed after the comparison with the drafts,
      2026-11-13: they were not applicable, which left a spiral stair's rise, width and headroom unchecked).
      Number (R318.7.5.1 second reading): 8 1/4 = 8.25 (not more than, <=). New York's own riser (the [NY] mark).
      Measured between leading edges of adjacent treads, exclusive of carpets, rugs or runners (R318.7.5). Fixed after the comparison with the drafts, 2026-11-14: R318.7.11.1 is now drafted (general.r318_7_11_1_*), so a spiral stairway is left out of this rule (not applicable) instead of needing review: R318.7.11.1's rules check it.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_5_1_riser_variation
    kind: rule
    topic: means_of_egress
    title: "Riser variation within a flight: not more than 3/8 in (R318.7.5.1)"
    for_each: stair
    when_none: not_applicable
    check: stair_riser_variation <= 0.375
    review_when:
      - when: (stair_spiral or stair_serves_sleeping_loft) and stair_riser_variation > 0.375
        reason: >-
          Exception 2 sends a spiral stairway's "riser height" to R318.7.11.1, and a sleeping loft's stair may follow
          R315.5.2.2's risers instead; whether the 3/8 in variation is part of what they replace is not settled. A
          person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [43, 44]
        quote: "The greatest riser height within any flight of stairs shall not exceed the smallest by more than 3/8 inch (9.5 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [49, 49]
        quote: "2. The riser height of spiral stairways shall be in accordance with Section R318.7.11.1."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_variation: 0.25, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_variation: 0.5, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
        note: a 7 1/2 in riser and an 8 in riser in one flight
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_variation: 0.5, stair_spiral: false, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.5.1 second reading): 3/8 = 0.375 ("not exceed the smallest by more than 3/8 inch", <=). A
      flight with winders: R318.7.5.2.1 sets winders' own depths; risers still vary 3/8 in at most.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_5_2_tread_depth
    kind: rule
    topic: means_of_egress
    title: "Tread depth: not less than 9 in (R318.7.5.2)"
    for_each: stair
    when_none: not_applicable
    applies_when: not stair_serves_sleeping_loft and not stair_spiral
    check: stair_tread_depth >= 9
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [50, 50]
        quote: "The tread depth shall be not less than 9 inches (229 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [36, 37]
        quote: "Spiral stairways and bulkhead enclosure stairways shall comply with the requirements of Section R318.7 except as specified in Sections R318.7.11.1 and R318.7.11.2."
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [39, 40]
        quote: "Each tread shall have a depth of not less than 6 3/4 inches (171 mm) at the walkline."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_depth: 10, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_depth: 8.5, stair_spiral: false, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_depth: 7, stair_spiral: true, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: a spiral stairway is R318.7.11.1's (general.r318_7_11_1_*), not this rule's
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Spiral stairways need review here until R318.7.11.1 is drafted (fixed after the comparison with the drafts,
      2026-11-13: they were not applicable, which left a spiral stair's rise, width and headroom unchecked).
      Number (R318.7.5.2 second reading): 9 (not less than 9 inch, >=). New York's own tread (the [NY] mark).
      R318.7.5.2 prints no spiral exception of its own; R318.7.11 sends a spiral stair's tread to R318.7.11.1.
      Winder treads (R318.7.5.2.1: 10 in at the walkline, 6 in at any point) are not this rule's: stair_tread_depth
      is the shallowest tread, so a flight with winders can only fail wrongly here, never pass wrongly (measure
      lacking: whether the flight has winders, and their depths at the walkline). Fixed after the comparison with the drafts, 2026-11-14: R318.7.11.1 is now drafted (general.r318_7_11_1_*), so a spiral stairway is left out of this rule (not applicable) instead of needing review: R318.7.11.1's rules check it.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_5_2_tread_variation
    kind: rule
    topic: means_of_egress
    title: "Tread variation within a flight: not more than 3/8 in (R318.7.5.2)"
    for_each: stair
    when_none: not_applicable
    check: stair_tread_variation <= 0.375
    review_when:
      - when: stair_serves_sleeping_loft and stair_tread_variation > 0.375
        reason: >-
          A sleeping loft's stair may follow R315.5.2.2's treads and risers instead of R318.7.5; whether the 3/8 in
          variation still holds for it is not settled. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 100
        lines: [52, 52]
        quote: "The greatest tread depth within any flight of stairs shall not exceed the smallest by more than 3/8 inch (9.5 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 98
        lines: [26, 27]
        quote: "Stairways providing egress from sleeping lofts shall be permitted to comply with Sections R315.5.2.1 through R315.5.2.3."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_variation: 0.125, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_variation: 0.75, stair_serves_sleeping_loft: false}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_tread_variation: 0.75, stair_serves_sleeping_loft: true}}]
        rows: [{part: s1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.7.5.2 second reading): 3/8 = 0.375 ("not exceed the smallest by more than 3/8 inch", <=). Spiral
      stairs are checked too ("Treads shall be identical", R318.7.11.1, is stricter). A flight mixing rectangular
      treads and consistently shaped winders need not keep the winders within 3/8 in of the rectangular depth
      (R318.7.5.2.1): with no measure saying a flight has winders, such a flight can only fail wrongly here.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_7_8_handrail_required
    kind: rule
    topic: means_of_egress
    title: "Handrail on at least one side of a flight with four or more risers (R318.7.8)"
    for_each: stair
    when_none: not_applicable
    applies_when: stair_riser_count >= 4
    check: stair_handrail_sides >= 1
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 101
        lines: [32, 32]
        quote: "Handrails shall be provided on not less than one side of each flight of stairs with four or more risers."
    examples:
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_count: 14, stair_handrail_sides: 1}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_count: 4, stair_handrail_sides: 0}}]
        rows: [{part: s1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_riser_count: 3, stair_handrail_sides: 0}}]
        rows: [{part: s1, outcome: not_applicable}]
        expect: not_applicable
        note: three risers to a sunken living room need no handrail
      - given: {}
        parts: {stair: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.7.8 second reading): "not less than one" (>=) and "four or more" (>=). Applies to every flight,
      spiral and sleeping-loft stairs included (neither R318.7.11.1 nor R315.5.2 modifies it).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R319.1 escape opening required ----------------------------------------------------------------------------

  - id: general.r319_1_sleeping_room_escape_opening
    kind: rule
    topic: means_of_egress
    title: "Each sleeping room: an operable escape opening to a yard (R319.1)"
    for_each: emergency_escape_opening
    within: sleeping_room
    when_none: fail
    check: opening_operable and opening_opens_to_yard
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [28, 29]
        quote: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have not less than one operable emergency escape and rescue opening."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [29, 30]
        quote: "Where basements contain one or more sleeping rooms, an emergency escape and rescue opening shall be required in each sleeping room."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [30, 31]
        quote: "Emergency escape and rescue openings shall open directly into a public way, or to a yard or court that opens to a public way."
    examples:
      - given: {}
        parts:
          sleeping_room: [{id: br1, name: Bedroom 1}]
          emergency_escape_opening: [{id: w1, within: br1, name: Window 1, measures: {opening_operable: true, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: br1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_operable: false, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: br1, outcome: fail}]
        expect: fail
        note: fixed glass marked as the escape opening
      - given: {}
        parts:
          sleeping_room: [{id: br1}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_operable: true, opening_opens_to_yard: false}}]
        rows: [{part: w1, within: br1, outcome: fail}]
        expect: fail
        note: opens onto an enclosed porch, not a yard, court or public way
      - given: {}
        parts:
          sleeping_room: [{id: br1}, {id: br2, name: Bedroom 2}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_operable: true, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: br1, outcome: pass}, {within: br2, outcome: fail}]
        expect: fail
        note: "when_none: Bedroom 2 has no escape opening marked, so it fails (\"every sleeping room shall have\"; Ben's decision: only marked openings count)"
    notes: >-
      Number: "not less than one" (R319.1 second reading, >=) is the opening each room needs: a room with none is
      when_none (fail). Only openings the architect marks as the room's escape opening are checked (Ben's decision,
      egress design doc). Its size is R319.2's rules. Exception 3 (a sprinklered unit's basement sleeping rooms
      need none where the basement has one means of egress and one escape opening, or two means of egress) is not
      read: the parts say neither that the unit is sprinklered nor that a room is in a basement, so such a room
      with no opening fails here; that is the wrong answer for it (never a wrong pass), for the architect to note.
      Exception 4 (a yard reaching the public way by a path at least 36 in wide) is in opening_opens_to_yard's
      meaning only if the architect reads it so: a "no" there can only fail wrongly.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r319_1_basement_escape_opening
    kind: rule
    topic: means_of_egress
    title: "Basement: an operable escape opening to a yard or public way (R319.1)"
    for_each: emergency_escape_opening
    within: basement
    when_none: needs_review
    check: opening_operable and opening_opens_to_yard
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [28, 29]
        quote: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have not less than one operable emergency escape and rescue opening."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [30, 31]
        quote: "Emergency escape and rescue openings shall open directly into a public way, or to a yard or court that opens to a public way."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [33, 33]
        quote: "1. Basements used only to house mechanical equipment not exceeding a total floor area of 200 square feet (18.58 m[fn2])."
    examples:
      - given: {}
        parts:
          basement: [{id: b1, name: Basement}]
          emergency_escape_opening: [{id: w1, within: b1, measures: {opening_operable: true, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: b1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          basement: [{id: b1}]
          emergency_escape_opening: [{id: w1, within: b1, measures: {opening_operable: false, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: b1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          basement: [{id: b1, measures: {basement_floor_area: 900, basement_mechanical_only: false}}]
          emergency_escape_opening: []
        rows: [{within: b1, outcome: needs_review}]
        expect: needs_review
        note: "when_none: a basement with no escape opening marked within it needs review (see notes)"
    notes: >-
      when_none is needs review, not fail, though the law requires one: a rule for each escape opening can't read the
      basement's own measures, so it can't apply exception 1 (a basement used only for mechanical equipment, 200
      sq ft or less: R319.1 second reading, '200 square foot', its flag: at most, <=), nor see that the basement's
      opening is the one marked within a sleeping room in it (an opening sits within one part only). Gordium's
      reading: an opening in a basement sleeping room also serves the basement. Measure lacking: which basement a
      sleeping room is in. The mechanical-only basement and storm shelters (exception 2) are thus never passed
      unread either.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

