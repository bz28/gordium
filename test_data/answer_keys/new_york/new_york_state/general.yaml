        rows: [{part: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1, measures: {stair_vertical_rise: 151, stair_bulkhead: false}}]
        rows: [{part: s1, outcome: pass}]
        expect: pass
        note: exactly 12 ft 7 in is not "greater than"
      - given: {}
        parts:
