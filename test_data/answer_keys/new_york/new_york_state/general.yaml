    notes: >-
      A flag, not a rule, as general.r320_6_round_handrail_grip: neither type may still give "equivalent
      graspability". Numbers (R320.6 second reading): Type I 4 (>=) and 6 1/4 = 6.25 (<=) for the perimeter, 2 1/4 =
      2.25 (<=) the cross section; Type II 6 1/4 = 6.25 (greater than, >), 3/4 = 0.75 ("within", <=) where the recess
      begins, 5/16 = 0.3125 (>=) its depth (the "within 7/8 inch" is in handrail_recess_depth's meaning), 3/8 = 0.375
      (>=) how far it runs, 1 3/4 = 1.75 (>=) how low, 1 1/4 = 1.25 (>=) and 2 3/4 = 2.75 (<=) the width above it; 0.01
      (>=) the edge radius, both types alike. "Required handrails": every handrail is read, as for round rails.
