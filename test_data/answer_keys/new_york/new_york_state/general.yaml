  # --- R318.8 ramps (added 2026-11-14) ----------------------------------------------------------------------------

  - id: general.r318_8_1_ramp_slope
    kind: rule
    topic: means_of_egress
    title: "Ramp slope: 1 in 12 at the egress door, 1 in 8 elsewhere (R318.8.1)"
    for_each: ramp
    when_none: not_applicable
    check: ramp_slope * 8 <= 1 and (not ramp_serves_egress_door or ramp_slope * 12 <= 1)
    review_when:
      - when: ramp_serves_egress_door and ramp_site_constrained and ramp_slope * 12 > 1 and ramp_slope * 8 <= 1
        reason: >-
          The exception allows 1 in 8 at the egress door where 1 in 12 is technically infeasible because of site
          constraints. The architect says it is; whether it is technically infeasible is the code official's call. A
          person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [17, 18]
        quote: "Ramps serving the egress door required by Section R318.2 shall have a slope of not more than 1 unit vertical in 12 units horizontal (8.3-percent slope)."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [19, 19]
        quote: "Other ramps shall have a slope of not more than 1 unit vertical in 8 units horizontal (12.5 percent)."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [20, 21]
        quote: "Exception: Where it is technically infeasible to comply because of site constraints, ramps shall have a slope of not more than 1 unit vertical in 8 units horizontal (12.5 percent)."
    examples:
      - given: {}
        parts:
          ramp: [{id: r1, name: Entry ramp, measures: {ramp_slope: 0.0833, ramp_serves_egress_door: true, ramp_site_constrained: false}}]
        rows: [{part: r1, outcome: pass}]
        expect: pass
        note: 1 in 12
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.1, ramp_serves_egress_door: true, ramp_site_constrained: false}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
        note: 1 in 10 at the egress door
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.1, ramp_serves_egress_door: true, ramp_site_constrained: true}}]
        rows: [{part: r1, outcome: needs_review}]
        expect: needs_review
        note: 1 in 10 on a steep lot, the architect says 1 in 12 can't fit
      - given: {}
        parts:
          ramp: [{id: r1, name: Garden ramp, measures: {ramp_slope: 0.1, ramp_serves_egress_door: false}}]
        rows: [{part: r1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.15, ramp_serves_egress_door: false}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
        note: steeper than 1 in 8 fails, site or not
      - given: {}
        parts: {ramp: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.8.1 second reading): 1 (not more than 1 unit vertical, <=) over 12 and over 8 (unit horizontal,
      none: terms of the slope), written slope x 12 <= 1 and slope x 8 <= 1; the percents are conversions. The
      exception never goes past 1 in 8, so a ramp steeper than that fails. "Technically infeasible" needs a person:
      ramp_site_constrained is only the architect's statement. R318.8's exception (a ramp not within or serving a
      building, porch or deck) is in the part's meaning (such a ramp isn't marked).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_8_2_ramp_landings_required
    kind: rule
    topic: means_of_egress
    title: "Ramp landings: top, bottom, at doors and at turns (R318.8.2)"
    for_each: ramp
    when_none: not_applicable
    check: ramp_landings_present
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [22, 23]
        quote: "There shall be a floor or landing at the top and bottom of each ramp, where doors open onto ramps, and where ramps change directions."
    examples:
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: true}}]
        rows: [{part: r1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: false}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
        note: a ramp that doglegs with no level turn
      - given: {}
        parts: {ramp: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: No numbers. All four places are in ramp_landings_present's meaning.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_8_2_ramp_landing_size
    kind: rule
    topic: means_of_egress
    title: "Ramp landings: as wide as the ramp, 36 in deep (R318.8.2)"
    for_each: ramp
    when_none: not_applicable
    applies_when: ramp_landings_present
    check: ramp_landing_width >= ramp_width and ramp_landing_depth >= 36
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [23, 24]
        quote: "The width of the landing perpendicular to the ramp slope shall be not less than the width of the ramp."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [24, 24]
        quote: "The depth of the landing in the direction of the ramp slope shall be not less than 36 inches (914 mm)."
    examples:
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: true, ramp_width: 42, ramp_landing_width: 48, ramp_landing_depth: 60}}]
        rows: [{part: r1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: true, ramp_width: 42, ramp_landing_width: 48, ramp_landing_depth: 32}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: true, ramp_width: 48, ramp_landing_width: 42, ramp_landing_depth: 60}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_landings_present: false}}]
        rows: [{part: r1, outcome: not_applicable}]
        expect: not_applicable
        note: no landing to measure (general.r318_8_2_ramp_landings_required fails it)
      - given: {}
        parts: {ramp: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R318.8.2 second reading): 36 (not less than 36 inch, >=). A ramp with some landings but not all of them
      (ramp_landings_present false) has its landings' size unchecked here; the landings rule fails it.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r318_8_3_ramp_handrail_required
    kind: rule
    topic: means_of_egress
    title: "Ramp steeper than 1 in 12: a handrail on one side at least (R318.8.3)"
    for_each: ramp
    when_none: not_applicable
    applies_when: ramp_slope * 12 > 1
    check: ramp_handrail_sides >= 1
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [25, 26]
        quote: "Handrails shall be provided on not less than one side of ramps exceeding a slope of 1 unit vertical in 12 units horizontal (8.33-percent slope) and shall comply with Section R320."
    examples:
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.1, ramp_handrail_sides: 1}}]
        rows: [{part: r1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.1, ramp_handrail_sides: 0}}]
        rows: [{part: r1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          ramp: [{id: r1, measures: {ramp_slope: 0.0833, ramp_handrail_sides: 0}}]
        rows: [{part: r1, outcome: not_applicable}]
        expect: not_applicable
        note: 1 in 12 (0.0833 x 12 = 0.9996) isn't "exceeding" it
      - given: {}
        parts: {ramp: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R318.8.3 second reading): one (not less than one, >=) side; 1 unit vertical (its flag: exceeding, >) over
      12 (none, a term of the slope), written slope x 12 > 1. The handrails' R320 compliance is the handrail rules'
      (handrail parts within a ramp).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R319.4.2.1, R319.4.2.2 area well ladders and steps; R319.6 additions (added 2026-11-14) -------------------

  - id: general.r319_4_2_1_area_well_ladder_size
    kind: rule
    topic: means_of_egress
    title: "Area well ladder: 12 in wide, 3 in off the wall, rungs 18 in apart (R319.4.2.1)"
    for_each: emergency_escape_opening
    when_none: not_applicable
    applies_when: opening_below_grade and area_well_depth > 44 and area_well_ladder and not area_well_steps
    check: >-
      area_well_ladder_width >= 12 and area_well_ladder_projection >= 3 and area_well_rung_spacing <= 18
      and area_well_ladder_full_height
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [19, 21]
        quote: "Ladders and rungs shall have an inside width of not less than 12 inches (305 mm), shall project not less than 3 inches (76 mm) from the wall and shall be spaced not more than 18 inches (457 mm) on center vertically for the full height of the area well."
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [15, 16]
        quote: "Area wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with an approved, permanently affixed ladder or steps."
    examples:
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, name: Basement window, measures: {opening_below_grade: true, area_well_depth: 60, area_well_ladder: true, area_well_steps: false, area_well_ladder_width: 14, area_well_ladder_projection: 3.5, area_well_rung_spacing: 12, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 60, area_well_ladder: true, area_well_steps: false, area_well_ladder_width: 10, area_well_ladder_projection: 3.5, area_well_rung_spacing: 12, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: a 10 in wide ladder
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 60, area_well_ladder: true, area_well_steps: false, area_well_ladder_width: 14, area_well_ladder_projection: 2, area_well_rung_spacing: 12, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: rungs only 2 in off the well wall leave no toe room
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 60, area_well_ladder: true, area_well_steps: false, area_well_ladder_width: 14, area_well_ladder_projection: 3.5, area_well_rung_spacing: 20, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 60, area_well_ladder: true, area_well_steps: false, area_well_ladder_width: 14, area_well_ladder_projection: 3.5, area_well_rung_spacing: 12, area_well_ladder_full_height: false}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: the lowest rung starts 30 in above the well floor
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 40, area_well_ladder: true, area_well_steps: false}}]
        rows: [{part: w1, outcome: not_applicable}]
        expect: not_applicable
        note: a 40 in well needs no ladder, so this one isn't R319.4.2's (see notes)
      - given: {}
        parts: {emergency_escape_opening: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers: 12 (not less than, >=), 3 (not less than, >=), 18 (not more than, <=), R319.4.2.1 second reading; 44
      (R319.4.2 second reading, greater than, >) in applies_when. Read as the ladder R319.4.2 requires (a well deeper
      than 44 in): R319.4.2.1 sits under R319.4.2 ("Ladders or steps required by this section"), so a ladder put in a
      shallower well by choice is not held to it (Gordium's reading; such a ladder is not applicable, never a pass).
      "Ladders and rungs shall have an inside width" is the ladder's width between its rails (area_well_ladder_width);
      "for the full height of the area well" is area_well_ladder_full_height. R319.4.2's "approved" is the code
      official's (not measured), and R318.7 doesn't apply to these ladders (R319.4.2).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r319_4_2_2_area_well_steps_size
    kind: rule
    topic: means_of_egress
    title: "Area well steps: 12 in wide, 5 in treads, 18 in risers at most (R319.4.2.2)"
    for_each: emergency_escape_opening
    when_none: not_applicable
    applies_when: opening_below_grade and area_well_depth > 44 and area_well_ladder and area_well_steps
    check: >-
      area_well_ladder_width >= 12 and area_well_step_tread >= 5 and area_well_step_riser <= 18
      and area_well_ladder_full_height
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [22, 23]
        quote: "Steps shall have an inside width of not less than 12 inches (305 mm), a minimum tread depth of 5 inches (127 mm) and a maximum riser height of 18 inches (457 mm) for the full height of the area well."
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [15, 16]
        quote: "Area wells with a vertical depth greater than 44 inches (1118 mm) shall be equipped with an approved, permanently affixed ladder or steps."
    examples:
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 54, area_well_ladder: true, area_well_steps: true, area_well_ladder_width: 36, area_well_step_tread: 10, area_well_step_riser: 18, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: pass}]
        expect: pass
        note: a tiered well, three 18 in steps
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 54, area_well_ladder: true, area_well_steps: true, area_well_ladder_width: 36, area_well_step_tread: 10, area_well_step_riser: 27, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
        note: two 27 in tiers
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 54, area_well_ladder: true, area_well_steps: true, area_well_ladder_width: 36, area_well_step_tread: 4, area_well_step_riser: 18, area_well_ladder_full_height: true}}]
        rows: [{part: w1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          emergency_escape_opening: [{id: w1, measures: {opening_below_grade: true, area_well_depth: 54, area_well_ladder: true, area_well_steps: false}}]
        rows: [{part: w1, outcome: not_applicable}]
        expect: not_applicable
        note: a ladder, general.r319_4_2_1_area_well_ladder_size
      - given: {}
        parts: {emergency_escape_opening: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R319.4.2.2 second reading): 12 (not less than, >=); 5 (its flag: "a minimum tread depth", >=); 18 (its
      flag: "a maximum riser height", <=); 44 (R319.4.2, greater than, >) in applies_when, as for ladders (steps
      required by R319.4.2). area_well_ladder_width is the steps' least inside width; area_well_step_riser includes the
      top and bottom steps (its meaning), and "for the full height" is area_well_ladder_full_height.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r319_6_new_sleeping_room_escape_opening
    kind: rule
    topic: means_of_egress
    title: "Addition: an escape opening in each new sleeping room (R319.6)"
    for_each: emergency_escape_opening
    within: sleeping_room
    when_none: fail
    check: opening_operable
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [42, 43]
        quote: "Where dwelling unit additions contain sleeping rooms, an emergency escape and rescue opening shall be provided in each new sleeping room."
      - file: gov.ny.residential.2025.pdf
        page: 40
        lines: [46, 47]
        quote: "EMERGENCY ESCAPE AND RESCUE OPENING. An operable exterior window, door or other similar device that provides for a means of escape and access for rescue in the event of an emergency."
    examples:
      - given: {}
        parts:
          sleeping_room: [{id: br1, name: New bedroom, measures: {sleeping_room_in_addition: true}}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_operable: true}}]
        rows: [{part: w1, within: br1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          sleeping_room: [{id: br1, measures: {sleeping_room_in_addition: true}}]
          emergency_escape_opening: [{id: w1, within: br1, measures: {opening_operable: false}}]
        rows: [{part: w1, within: br1, outcome: fail}]
        expect: fail
        note: a fixed picture window marked as the escape opening
      - given: {}
        parts:
          sleeping_room: [{id: br1, measures: {sleeping_room_in_addition: true}}]
          emergency_escape_opening: []
        rows: [{within: br1, outcome: fail}]
        expect: fail
        note: "when_none: the new bedroom has no escape opening marked"
    notes: >-
      No numbers. R319.6 asks this of each new sleeping room only, but a rule for each escape opening within a room
      can't read the room's own measures (sleeping_room_in_addition), so every sleeping room is checked: R319.1 asks
      the same of every sleeping room (general.r319_1_sleeping_room_escape_opening), so this never fails a room the law
      passes. "Emergency escape and rescue opening" is operable by its definition (R202); its size and where it opens
      are R319.1 and R319.2's rules.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r319_6_new_basement_escape_opening
    kind: flag
    topic: means_of_egress
    title: "Addition's new basement: its own escape opening? (R319.6)"
    for_each: basement
    when_none: not_applicable
    applies_when: basement_in_addition and not basement_has_sleeping_room_with_opening and not basement_reaches_existing_basement_opening
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [43, 44]
        quote: "Where dwelling unit additions have basements, an emergency escape and rescue opening shall be provided in the new basement."
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [46, 47]
        quote: "1. An emergency escape and rescue opening is not required in a new basement that contains a sleeping room with an emer-gency escape and rescue opening."
      - file: gov.ny.residential.2025.pdf
        page: 103
        lines: [48, 49]
        quote: "2. An emergency escape and rescue opening is not required in a new basement where there is an emergency escape and rescue opening in an existing basement that is accessed from the new basement."
    examples:
      - given: {}
        parts:
          basement: [{id: b1, name: New basement, measures: {basement_in_addition: true, basement_has_sleeping_room_with_opening: false, basement_reaches_existing_basement_opening: false}}]
        rows: [{part: b1, outcome: needs_review}]
        expect: needs_review
        note: a person checks an escape opening is marked within it (general.r319_1_basement_escape_opening checks the marked one)
      - given: {}
        parts:
          basement: [{id: b1, measures: {basement_in_addition: true, basement_has_sleeping_room_with_opening: false, basement_reaches_existing_basement_opening: true}}]
        rows: [{part: b1, outcome: not_applicable}]
        expect: not_applicable
        note: exception 2, it opens into the old basement, which has one
      - given: {}
        parts:
          basement: [{id: b1, measures: {basement_in_addition: true, basement_has_sleeping_room_with_opening: true}}]
        rows: [{part: b1, outcome: not_applicable}]
        expect: not_applicable
        note: exception 1
      - given: {}
        parts:
          basement: [{id: b1, measures: {basement_in_addition: false}}]
        rows: [{part: b1, outcome: not_applicable}]
        expect: not_applicable
        note: not an addition's basement (R319.1's rule)
      - given: {}
        parts: {basement: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag, not a rule: a rule for each basement can't see whether an escape opening is marked within it (the openings
      are another part kind), so a new basement that no exception excuses needs review, and a person checks it has its
      own escape opening (general.r319_1_basement_escape_opening checks a marked one, and gives needs review where none
      is). Where exception 1 or 2 holds, no opening of its own is required: not applicable here. No numbers.
      (R319.1's basement rule can't read these exceptions either: there a new basement excused by them with no
      opening marked needs review, never a fail.)
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  # --- R320.3, R320.5, R320.6 handrails: projection, continuity, grip (added 2026-11-14) ------------------------

  - id: general.r320_3_handrail_projection
    kind: rule
    topic: means_of_egress
    title: "Handrail projection: 4 1/2 in at most; 6 1/2 in at projecting nosings (R320.3)"
    for_each: handrail
    when_none: not_applicable
    check: handrail_projection <= 4.5 or (handrail_at_projecting_nosing and handrail_projection <= 6.5)
    review_when:
      - when: handrail_at_projecting_nosing and handrail_projection > 4.5 and handrail_projection <= 6.5
        reason: >-
          The exception allows up to 6 1/2 in where nosings project into the stairway, provided the stair width and
          handrail clearance stay at least what is required; those are the stair's and the wall's, not this handrail's
          measures. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [6, 6]
        quote: "Handrails shall not project more than 4 1/2 inches (114 mm) on either side of the stairway or ramp."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [7, 9]
        quote: "Exception: Where nosings of landings, floors or passing flights project into the stairway reducing the clearance at passing hand-rails, handrails shall project not more than 6 1/2 inches (165 mm) into the stairway, provided that the stair width and handrail clearance are not reduced to less than that required."
    examples:
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_projection: 3.5, handrail_at_projecting_nosing: false}}]
        rows: [{part: h1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_projection: 5, handrail_at_projecting_nosing: false}}]
        rows: [{part: h1, outcome: fail}]
        expect: fail
        note: a wide rail on deep brackets
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_projection: 6, handrail_at_projecting_nosing: true}}]
        rows: [{part: h1, outcome: needs_review}]
        expect: needs_review
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_projection: 7, handrail_at_projecting_nosing: true}}]
        rows: [{part: h1, outcome: fail}]
        expect: fail
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_projection: 4, handrail_at_projecting_nosing: false}}]
        rows: [{part: h1, outcome: pass}]
        expect: pass
        note: a ramp's handrail too ("the stairway or ramp")
      - given: {}
        parts: {handrail: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Numbers (R320.3 second reading): 4 1/2 = 4.5 and 6 1/2 = 6.5 (not more than, <=), each on one side of the "or".
      Every handrail, on a stair or a ramp (no `within`: the law says "the stairway or ramp"). The exception's
      proviso is the stair's (width) and the wall's (R320.4's clearance), so a rail using it needs review, never a
      pass.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r320_5_stair_handrail_continuity
    kind: rule
    topic: means_of_egress
    title: "Stair handrail: continuous the full flight, newels and volutes aside (R320.5)"
    for_each: handrail
    within: stair
    when_none: not_applicable
    check: handrail_continuous or handrail_breaks_newel_or_volute
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [12, 13]
        quote: "Handrails shall be continuous for the full length of the flight, from a point directly above the nosing of the landing at the top of the flight to a point directly above the lowest nosing of the flight."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [17, 18]
        quote: "1. Handrail continuity shall be permitted to be interrupted by a newel post at a turn in a flight with winders, at a landing, or over the lowest tread."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [19, 19]
        quote: "2. A volute, turnout or starting easing shall be allowed to terminate over the lowest tread."
    examples:
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_continuous: true}}]
        rows: [{part: h1, within: s1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_continuous: false, handrail_breaks_newel_or_volute: true}}]
        rows: [{part: h1, within: s1, outcome: pass}]
        expect: pass
        note: a newel at the winders' turn
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: [{id: h1, within: s1, measures: {handrail_continuous: false, handrail_breaks_newel_or_volute: false}}]
        rows: [{part: h1, within: s1, outcome: fail}]
        expect: fail
        note: the rail stops two treads short of the bottom nosing
      - given: {}
        parts:
          stair: [{id: s1}]
          handrail: []
        rows: [{within: s1, outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      No numbers. Every handrail of a flight, required or not (R320.1: "Handrails shall comply with Section R320").
      The exceptions are handrail_breaks_newel_or_volute's meaning. Ramps: general.r320_5_ramp_handrail_continuity.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r320_5_ramp_handrail_continuity
    kind: flag
    topic: means_of_egress
    title: "Ramp handrail not continuous: is it a required one? (R320.5)"
    for_each: handrail
    within: ramp
    when_none: not_applicable
    applies_when: not handrail_continuous
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [13, 14]
        quote: "Handrails where required for ramps shall be continuous for the full length of the ramp."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [25, 26]
        quote: "Handrails shall be provided on not less than one side of ramps exceeding a slope of 1 unit vertical in 12 units horizontal (8.33-percent slope) and shall comply with Section R320."
    examples:
      - given: {}
        parts:
          ramp: [{id: r1}]
          handrail: [{id: h1, within: r1, measures: {handrail_continuous: false}}]
        rows: [{part: h1, within: r1, outcome: needs_review}]
        expect: needs_review
        note: a broken rail on a ramp; if the ramp is steeper than 1 in 12 its rail is required and must be continuous
      - given: {}
        parts:
          ramp: [{id: r1}]
          handrail: [{id: h1, within: r1, measures: {handrail_continuous: true}}]
        rows: [{part: h1, within: r1, outcome: not_applicable}]
        expect: not_applicable
      - given: {}
        parts:
          ramp: [{id: r1}]
          handrail: []
        rows: [{within: r1, outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag, not a rule: the law asks continuity only of handrails "where required for ramps" (R318.8.3: a ramp
      steeper than 1 in 12), and a rule for each handrail can't read its ramp's slope, so a broken ramp rail needs
      review (a person checks the ramp's slope), never a fail or a pass. No numbers used (R318.8.3's are only cited
      for the person).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r320_5_handrail_returns
    kind: rule
    topic: means_of_egress
    title: "Handrail ends returned; returns 1/4 in from the wall at most (R320.5)"
    for_each: handrail
    when_none: not_applicable
    check: handrail_ends_returned and (not handrail_adjacent_to_wall or handrail_return_gap <= 0.25)
    review_when:
      - when: not handrail_ends_returned and handrail_breaks_newel_or_volute
        reason: >-
          An end that stops at a newel post or a volute, turnout or starting easing, which R320.5's exceptions allow
          to interrupt or end the rail: whether such an end must also be returned is open. A person checks.
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [14, 14]
        quote: "A handrail end shall be returned continuous to itself or toward a wall, guard or walking surface."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [14, 15]
        quote: "Hand-rail returns shall not form a gap more than 1/4 inch (6.4 mm) from the adjacent wall."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [17, 18]
        quote: "1. Handrail continuity shall be permitted to be interrupted by a newel post at a turn in a flight with winders, at a landing, or over the lowest tread."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [19, 19]
        quote: "2. A volute, turnout or starting easing shall be allowed to terminate over the lowest tread."
    examples:
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_ends_returned: true, handrail_adjacent_to_wall: true, handrail_return_gap: 0.125}}]
        rows: [{part: h1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_ends_returned: true, handrail_adjacent_to_wall: true, handrail_return_gap: 1}}]
        rows: [{part: h1, outcome: fail}]
        expect: fail
        note: a return that stops an inch off the wall, where a sleeve can catch
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_ends_returned: false, handrail_breaks_newel_or_volute: false}}]
        rows: [{part: h1, outcome: fail}]
        expect: fail
        note: a wall rail cut square at the bottom
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_ends_returned: false, handrail_breaks_newel_or_volute: true}}]
        rows: [{part: h1, outcome: needs_review}]
        expect: needs_review
        note: the open-side rail ends in a volute over the first tread
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_ends_returned: true, handrail_adjacent_to_wall: false}}]
        rows: [{part: h1, outcome: pass}]
        expect: pass
        note: a guard-side rail returned to the guard
      - given: {}
        parts: {handrail: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      Number (R320.5 second reading): 1/4 = 0.25 (not form a gap more than, <=). Every handrail, stair or ramp. The gap
      is read only for a rail beside a wall (handrail_adjacent_to_wall), the wall its return turns to; a free-standing
      rail returned toward some other wall isn't told apart (measure lacking: which way each return turns).
    open_questions:
      - 'R320.5: "A handrail end shall be returned continuous to itself or toward a wall, guard or walking surface." and exception 2: "A volute, turnout or starting easing shall be allowed to terminate over the lowest tread." Does a handrail end at a newel post (exception 1) or a volute, turnout or starting easing (exception 2) also have to be returned, or do those exceptions stand for the return?'
    research:
      - question: 'R320.5: "A handrail end shall be returned continuous to itself or toward a wall, guard or walking surface." and exception 2: "A volute, turnout or starting easing shall be allowed to terminate over the lowest tread." Does a handrail end at a newel post (exception 1) or a volute, turnout or starting easing (exception 2) also have to be returned, or do those exceptions stand for the return?'
        searched: [R320.1, R320.2, R320.5, R318.7.8, "R202:handrail"]
        sources:
          - file: gov.ny.residential.2025.pdf
            page: 104
            lines: [19, 19]
            quote: "2. A volute, turnout or starting easing shall be allowed to terminate over the lowest tread."
        why_open: >-
          The exceptions are written against continuity ("Handrail continuity shall be permitted to be interrupted",
          "allowed to terminate"), not against the return sentence; the model IRC (R311.7.8.4) instead lets handrail
          ends "terminate in newel posts or safety terminals", which New York's text leaves out. No New York
          interpretation found; ICC commentary not read.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r320_6_round_handrail_grip
    kind: flag
    topic: means_of_egress
    title: "Round handrail outside 1 1/4 to 2 in: equivalent graspability? (R320.6)"
    for_each: handrail
    when_none: not_applicable
    applies_when: handrail_circular and not (handrail_diameter >= 1.25 and handrail_diameter <= 2)
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [20, 20]
        quote: "Required handrails shall be of one of the following types or provide equivalent graspability."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [21, 22]
        quote: "1. Type I. Handrails with a circular cross section shall have an outside diameter of not less than 1 1/4 inches (32 mm) and not greater than 2 inches (51 mm)."
    examples:
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_circular: true, handrail_diameter: 2.5}}]
        rows: [{part: h1, outcome: needs_review}]
        expect: needs_review
        note: a 2 1/2 in round rail, too big for Type I
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_circular: true, handrail_diameter: 1}}]
        rows: [{part: h1, outcome: needs_review}]
        expect: needs_review
        note: a 1 in pipe rail
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_circular: true, handrail_diameter: 1.5}}]
        rows: [{part: h1, outcome: not_applicable}]
        expect: not_applicable
        note: a 1 1/2 in round rail is Type I
      - given: {}
        parts:
          handrail: [{id: h1, measures: {handrail_circular: false}}]
        rows: [{part: h1, outcome: not_applicable}]
        expect: not_applicable
        note: other profiles, general.r320_6_profile_handrail_grip
      - given: {}
        parts: {handrail: []}
        rows: [{outcome: not_applicable}]
        expect: not_applicable
    notes: >-
      A flag, not a rule: a profile that is neither Type I nor Type II may still "provide equivalent graspability",
      the code official's call, so no rail can fail on its dimensions alone, and one that meets a type has nothing to
      flag (not applicable). Numbers (R320.6 second reading): 1 1/4 = 1.25 (not less than, >=) and 2 (not greater
      than, <=). A circle has no edges (the 0.01 in radius is for other shapes). A round rail can't be Type II (no
      finger recess). "Required handrails": a handrail part doesn't say whether it is required, so every handrail is
      read (a flag on one that isn't required only asks a person to look).
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

  - id: general.r320_6_profile_handrail_grip
    kind: flag
    topic: means_of_egress
    title: "Shaped handrail neither Type I nor Type II: equivalent graspability? (R320.6)"
    for_each: handrail
    when_none: not_applicable
    applies_when: >-
      not handrail_circular and not (handrail_edge_radius >= 0.01 and ((handrail_perimeter >= 4 and
      handrail_perimeter <= 6.25 and handrail_cross_section <= 2.25) or (handrail_perimeter > 6.25 and
      handrail_recess_both_sides and handrail_recess_start <= 0.75 and handrail_recess_depth >= 0.3125 and
      handrail_recess_run >= 0.375 and handrail_recess_bottom >= 1.75 and handrail_width_above_recess >= 1.25 and
      handrail_width_above_recess <= 2.75)))
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [20, 20]
        quote: "Required handrails shall be of one of the following types or provide equivalent graspability."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [22, 24]
        quote: "If the handrail is not circular, it shall have a perimeter of not less than 4 inches (102 mm) and not greater than 6 1/4 inches (160 mm) and a cross section of not more than 2 1/4 inches (57 mm). Edges shall have a radius of not less than 0.01 inch (0.25 mm)."
      - file: gov.ny.residential.2025.pdf
        page: 104
        lines: [25, 26]
        quote: "2. Type II. Handrails with a perimeter greater than 6 1/4 inches (160 mm) shall have a graspable finger recess area on both sides of the profile."
      - file: gov.ny.residential.2025.pdf
