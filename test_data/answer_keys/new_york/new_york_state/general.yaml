      - file: gov.ny.residential.2025.pdf
        page: 51
        lines: [47, 48]
        quote: "SLEEPING LOFT. A space designated for sleeping on an intermediate level or levels between the floor and ceiling of a story, open on one or more sides to the room in which the space is located, and in accordance with Section R315."
    examples:
      - given: {}
        parts:
          sleeping_loft: [{id: l1, name: Loft, measures: {loft_floor_area: 60}}]
