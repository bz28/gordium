  - id: general.r319_1_loft_room_escape_opening
    kind: rule
    topic: means_of_egress
    title: "Room a sleeping loft is open to: an operable escape opening (R319.1)"
    for_each: emergency_escape_opening
    within: loft_room
    when_none: fail
    check: opening_operable and opening_opens_to_yard
    sources:
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [28, 29]
        quote: "Basements, habitable attics, the room to which a sleeping loft is open, and every sleeping room shall have not less than one operable emergency escape and rescue opening."
      - file: gov.ny.residential.2025.pdf
        page: 102
        lines: [30, 31]
        quote: "Emergency escape and rescue openings shall open directly into a public way, or to a yard or court that opens to a public way."
    examples:
      - given: {}
        parts:
          loft_room: [{id: a1, name: Living room under the loft}]
          emergency_escape_opening: [{id: w1, within: a1, measures: {opening_operable: true, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: a1, outcome: pass}]
        expect: pass
      - given: {}
        parts:
          loft_room: [{id: a1}]
          emergency_escape_opening: [{id: w1, within: a1, measures: {opening_operable: false, opening_opens_to_yard: true}}]
        rows: [{part: w1, within: a1, outcome: fail}]
        expect: fail
        note: a fixed window
      - given: {}
        parts:
          loft_room: [{id: a1}]
          emergency_escape_opening: []
        rows: [{within: a1, outcome: fail}]
        expect: fail
        note: "when_none: \"the room to which a sleeping loft is open ... shall have not less than one\""
    notes: >-
      Number: "not less than one" (R319.1 second reading, >=). A sleeping loft has no escape opening of its own: it
      is part of the story below (R315.1) and open to a room (R202 SLEEPING LOFT), and R319.1 puts the opening in
      that room (the architect labels it loft_room; a bedroom or basement it opens to is also checked as one). Added
      after the comparison with the drafts, 2026-11-13: the key had only a flag on each loft, because the parts had
      no such room.
    drafted_by: claude_code/claude-opus-5-5 (answer key helper)
    status: draft

