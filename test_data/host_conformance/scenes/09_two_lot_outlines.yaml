title: Two lot outlines
what: >-
  The box house, with two closed outlines on the Site layer (the lot and its neighbour to the east) and no lot
  picked. The host must not choose one: it sends no lot, and the problem saying why (several_lot_outlines). Every
  measure that needs the lot (its area and width, the yards, coverage, projections into yards) needs review; the
  house's height and stories don't need the lot and still comply.
lots:
  - [[0, 0], [60, 0], [60, 120], [0, 120]]
  - [[60, 0], [120, 0], [120, 120], [60, 120]]
buildings:
  - {id: house, outline: [[15, 30], [45, 30], [45, 80], [15, 80]], base: 0, floors: [10, 10]}
grade: {elevation: 0}
