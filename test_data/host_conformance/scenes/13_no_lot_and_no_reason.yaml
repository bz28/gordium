title: No lot, and no reason given
what: >-
  A description only (no drawing gives this in Rhino, whose reader always says why there is no lot): the box house
  with `lot: null` and no problem saying why. The site description allows it rather than refusing the whole check,
  so the checker must still never pass what needs the lot: lot area and width, the yards, coverage and projections
  need review ("no lot outline"); height and stories don't need the lot and comply.
