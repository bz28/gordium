title: A house built from parts
what: >-
  The box house's outline (30 × 50 ft, 30 ft back, 15 ft from each side), drawn the way a Revit model is: not as
  Gordium's floor blocks but as its parts, each its own solid on the Building layer with no floor mark. A 1 ft floor
  slab (z 0 to 1); four 0.5 ft walls 18 ft high (z 1 to 19), the south wall in pieces around a 4 × 4 ft window (a
  solid of its own filling the opening), the east wall broken by a curtain wall (two mullions and a glass panel at
  the wall's outer face); a built-in drawn as its own solid inside, against the west wall (an in-place family); and
  a 1 ft roof slab (z 19 to 20) drawn as a closed mesh of triangles (one element meshed). Every part touches another,
  so together they are one 20 ft building, and every measure complies as the box house's does. The measuring has
  only ever seen floor blocks: this is the first scene where a building is many solids, one of them a mesh.
guards: >-
  The Revit reading design note (docs/revit/revit_reading_design.md), new scene A without its loft: section 1,
  "Proposed building categories" (one building per element: walls, floors, roofs, windows; curtain wall panels and
  mullions as their own elements; an in-place family read by its category, here a building one); section 2, "A mesh
  in an element's geometry" (its triangles as faces; no open_mesh for a mesh known to be closed). In Rhino, the
  same reading is read_3dm.read_site's building loop (every solid and mesh on the Building layer one building).
