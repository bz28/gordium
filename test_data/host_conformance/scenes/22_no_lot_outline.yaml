title: No lot outline
what: >-
  The box house with nothing on the Site layer (the layer is there, empty), and no lot picked. The host must send no
  lot and say why (no_lot_outline), never make one up from the buildings or the street line. Every measure that
  needs the lot needs review; the house's height and stories don't need it and comply. Scene 13 is the same check
  given no reason; this is the reason a real host gives.
guards: >-
  The Revit reading design note, new scene G: section 4, "Nothing picked, none" (lot null, no_lot_outline). In
  Rhino: read_3dm.read_site, no closed curve on the Site layer.
lots: []
facts: {street_line: [[[0, 0], [60, 0]]]}
buildings:
  - {id: house, outline: [[15, 30], [45, 30], [45, 80], [15, 80]], base: 0, floors: [10, 10]}
grade: {elevation: 0}
expected:
  R-1b.lot_area_one_family_detached: needs_review
  R-1b.lot_width_one_family_detached: needs_review
  R-1b.front_yard: needs_review
  R-1b.side_yards#narrower: needs_review         # no lot: which side line is which isn't known
  R-1b.side_yards#wider: needs_review
  R-1b.rear_yard: needs_review
  R-1b.yard_projections: needs_review
  R-1b.height: complies                          # the house alone: 20 − 0 = 20 ≤ 35, no lot needed
  R-1b.stories: complies                         # 2 floor blocks ≤ 3
  R-1b.lot_coverage: needs_review                # coverage is a share of the lot's area
