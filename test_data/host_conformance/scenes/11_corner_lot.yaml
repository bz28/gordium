  R-1b.lot_width_one_family_detached: complies   # 60 ft on Seneca St, 120 ft on Cayuga St: either way
  R-1b.front_yard: complies                      # 30 from Cayuga St and 30 from Seneca St, each ≥ 25
  R-1b.side_yards#east: complies                 # 60 − 48 = 12 ≥ 10
