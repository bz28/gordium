title: An open property line
what: >-
  The lot's outline drawn open: its first three lines (south, east, north) but not the west one, so its ends, at
  (0, 0) and (0, 120), don't meet. Only a closed outline is ever a lot: the host must send no lot and say there is no
  lot outline (no_lot_outline), never close it with a west line nobody drew. (Sent as it is, the measuring would
  refuse it too, as "not one closed loop of lot lines": the lot's measures need review either way, but only the
  problem the host sends says why.) Height and stories comply.
guards: >-
  The Revit reading design note, new scene G: section 4, "Only a closed outline is ever a lot" (an open property
  line, not picked, counts as no lot outline). In Rhino: read_3dm.read_site keeps only closed curves on the Site
  layer.
lots:
  - [[0, 0], [60, 0], [60, 120], [0, 120]]
open_lots: [0]
buildings:
  - {id: house, outline: [[15, 30], [45, 30], [45, 80], [15, 80]], base: 0, floors: [10, 10]}
grade: {elevation: 0}
expected:
  R-1b.lot_area_one_family_detached: needs_review
  R-1b.lot_width_one_family_detached: needs_review
  R-1b.front_yard: needs_review
  R-1b.side_yards#narrower: needs_review         # no lot: which side line is which isn't known
  R-1b.side_yards#wider: needs_review
  R-1b.rear_yard: needs_review
  R-1b.yard_projections: needs_review
  R-1b.height: complies                          # the house alone: 20 − 0 = 20 ≤ 35, no lot needed
  R-1b.stories: complies                         # 2 floor blocks ≤ 3
  R-1b.lot_coverage: needs_review                # coverage is a share of the lot's area
