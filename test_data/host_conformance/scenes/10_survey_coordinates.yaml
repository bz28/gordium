title: Survey coordinates far from the origin
what: >-
  The box house drawn where a survey puts it: 875,000 ft east and 885,000 ft north of the origin (New York State
  Plane, roughly where Ithaca is), with the ground flat at 820 ft. Far from the origin, a host that rounds to single
  precision would move points by up to about 3/8 in (0.03 ft); the description must hold every point to a millionth of a foot,
  and the verdicts are the box house's.
model: {offset: [875000, 885000, 820]}
buildings:
  - {id: house, outline: [[15, 30], [45, 30], [45, 80], [15, 80]], base: 0, floors: [10, 10]}
grade: {elevation: 0}
