title: A model in millimetres
what: >-
  The box house drawn in a model whose units are millimetres (15 ft is 4,572 mm). The host converts to feet once,
  where it reads the model, and sends exactly the box house's description: every point within a millionth of a
  foot of it, the same verdicts.
model: {units: Millimeters}
