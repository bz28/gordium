  general.bc_1010_1_1_door_width: needs_review
  general.bc_1010_1_1_door_height: pass
  general.bc_1010_1_1_door_capacity: needs_review
  general.bc_1010_1_1_1_projections: needs_review
  general.bc_1010_1_doors_general: needs_review
