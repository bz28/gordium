# Hand-worked expected results for the four-unit eval building (apartment.yaml) under the 2025 Building Code of New
# York State (regulations/jurisdictions/new_york/new_york_state_building/5_building_code_rules/drafted/general.yaml),
# worked by hand from the plan before the check was run, 2026-11-22. Checked by
# packages/design_checker/tests/test_four_unit_apartment.py (the interior description the Revit reader gives) and by
# apps/revit_addin/tools/evals/compare_check_result.py's `which_code` and egress rows once built in Revit.
#
# The building as stated on Project Information: Group R-2 (BCNYS 310.3), no sprinkler system.

which_code:
  code: building_code
  title: 2025 Building Code of New York State
  # 310.3: "Residential Group R-2 occupancies containing sleeping units or more than two dwelling units where the
  # occupants are primarily permanent in nature, including: Apartment houses"; RCNYS R101.2 lists only one- and
  # two-family dwellings, townhouses and the like; BCNYS 101.2: "every building or structure"
  why: "a building of Group R-2, none of the dwellings R101.2 lists (101.2)"

# Each story (Level 1, Level 2), worked from the plan:
stories:
  story_exit_count: 2              # the two stair enclosures (each entered by one door on the story)
  # 1007.1.1: the two exits' doors measured in a straight line, nearest points of their clear openings: the west door
  # in the wall x 9 to 9.5, the east in x 50.5 to 51, so 50.5 - 9.5 = 41.0 ft; the story's diagonal over the outside
  # faces (x -0.5 to 60.5, y -0.5 to 30.5): sqrt(61^2 + 31^2) = sqrt(4682) = 68.4251 ft; 41.0 / 68.4251 = 0.5992
  exit_remoteness_ratio: 0.5992
  # 1007.1.1: "not less than one-half of the length of the maximum overall diagonal dimension"; one-third only with a
  # 903.3.1.1 or 903.3.1.2 system (none here): 0.5992 >= 0.5, complies on each story
  remoteness: pass

# Each apartment (and each stair enclosure, a room the routes count as a space): one exit access doorway
spaces:
  space_exit_count: 1
  # each stair enclosure is itself an exit: its door from the corridor is marked exit_enclosure with the enclosure's
  # room as its exit_id (apartment.yaml doors W and E); the apartments have no exit door of their own (2026-11-23)
  space_is_exit: {Stair West: true, Stair East: true, Apartment South: false, Apartment North: false}

# Each story's exit access travel distance (2026-11-23), worked from the plan: the farthest point is a corner of an
# apartment's far end (e.g. Apartment South's (0.5, 0.5) or (59.5, 0.5), the routes' 6-in clearance off the walls),
# through its door at (30, 11.75) and along the corridor to the nearer stair door (9.25 or 50.75, 15): about 54 ft
# (the routes measure 53.95 ft), far within Table 1017.2's 200 ft for Group R without a sprinkler system
egress_travel_distance_at_most: 60

# Every rule's one answer (the check's `results`), with why. Pass only where the measured figures settle it; a figure
# Gordium can't measure yet (occupant loads: no mark yet) needs review, saying so.
results:
  general.bc_1007_1_1_remoteness: pass                 # 0.5992 >= 1/2 on both stories (above)
  general.bc_1007_1_1_space_remoteness: pass           # "space_exit_count < 2 or ...": every space has one doorway
  general.bc_1007_1_2_space_three_or_more: pass        # "space_exit_count < 3 or ...": none has three
  # 1006.2.1.1 (section group 3, 2026-11-23: occupant loads from each room's function, apartment.yaml's
  # `function: residential`, Table 1004.5's 200 gross): each apartment 690 sq ft, 3.45 occupants from its own area,
  # up to 690 / 7 = 98.6 while 1004.5.1's increase isn't ruled out; both readings at most 500, so no third exit is
  # needed; the stair enclosures are exits, so it asks nothing of them
  general.bc_1006_2_1_1_three_or_more_exits: pass
  # a story's exits (section group 2, 2026-11-23): Group I-4's rule no longer applies (Group R-2 is one other
  # group); the R-2 rows need review: whether its R-2 is of dwelling units (Table 1006.3.4(1)) or sleeping units
  # (Table 1006.3.4(2)) isn't stated (r2_sleeping_units: no Revit mark yet), and the story's occupant load isn't
  # measured
  general.bc_1006_3_3_story_exits: not_applicable
  general.bc_table_1006_3_4_1__r2_dwelling_units: needs_review
  general.bc_table_1006_3_4_2__h_i_r: needs_review
  general.bc_table_1006_3_4_2__a_b_e_f_m_u: not_applicable
  general.bc_table_1006_3_4_2__s: not_applicable
  general.bc_508_2_3_accessory_area: needs_review      # no accessory rooms (0 sf both readings), but the story's net and gross floor areas aren't measured
  # Group I-4 rules: applies_when occupancy_group_i4, stated no (Group R-2)
  general.bc_1006_2_1_two_exits: not_applicable
  general.bc_1016_2_intervening_spaces: not_applicable
  general.bc_1017_2_travel_distance: not_applicable
  general.bc_1020_5_dead_end: not_applicable
  # Every group's table rows (2026-11-23: docs/decisions/2026-11-23_ny_building_egress_all_occupancies.md), read
  # by the building's one group, R-2:
  # Table 1017.2's A, E, F-1, M, R, S-1 row (p.341 line 28): 200 ft without a sprinkler system; about 54 ft (above),
  # within it, but the building block doesn't state whether the building holds a space note a or 1006.2.2 gives its
  # own distance (special_egress_spaces: no Revit mark yet), so needs review (review round 1, 2026-11-23)
  general.bc_table_1017_2_a_e_f1_m_r_s1: needs_review
  # Table 1006.2.1's R-2 row (p.315 line 29): 20 occupants and 125 ft with a sprinkler system, NP (Not Permitted)
  # without one; each apartment has one door and the building has no sprinkler system, so each fails whatever its
  # occupant load (903.2.8 also asks for a sprinkler system in every Group R fire area); the stair enclosures are
  # exits, not spaces 1006.2 counts, so they comply
  general.bc_table_1006_2_1_r2: fail
  # 1020.5 for every group but I-4: the corridor runs stair door to stair door, so it has no dead end (0 ft)
  general.bc_1020_5_dead_end_other_groups: pass
  # 1016.2 for every group but I-4: the rooms a path crosses aren't measured yet (space_egress_* not measured)
  general.bc_1016_2_intervening_spaces_other_groups: needs_review
  # the other rows: not this building's group
  general.bc_table_1017_2_i1: not_applicable
  general.bc_table_1017_2_b: not_applicable
  general.bc_table_1017_2_f2_s2_u: not_applicable
  general.bc_table_1017_2_h1: not_applicable
  general.bc_table_1017_2_h2: not_applicable
  general.bc_table_1017_2_h3: not_applicable
  general.bc_table_1017_2_h4: not_applicable
  general.bc_table_1017_2_h5: not_applicable
  general.bc_table_1017_2_i2_i3: not_applicable
  general.bc_table_1006_2_1_a_e_m: not_applicable
  general.bc_table_1006_2_1_b: not_applicable
  general.bc_table_1006_2_1_f: not_applicable
  general.bc_table_1006_2_1_h1_h2_h3: not_applicable
  general.bc_table_1006_2_1_h4_h5: not_applicable
  general.bc_table_1006_2_1_i1_i2: not_applicable
  general.bc_table_1006_2_1_i3: not_applicable
  general.bc_table_1006_2_1_r1: not_applicable
  general.bc_table_1006_2_1_r3_r4: not_applicable
  general.bc_table_1006_2_1_s: not_applicable
  general.bc_table_1006_2_1_u: not_applicable
  # the flags: a person's check, each its own line (other_occupancy_present is yes: Group R-2 is not I-4; the
  # balcony and atrium flags' facts aren't stated, so they show), but those narrowed 2026-11-23 to a building of two
  # or more groups or to another group (not applicable: R-2 is one group, its rows drafted); 23 show
  general.bc_308_5_classification: needs_review
  general.bc_308_5_1_group_e: needs_review
  general.bc_308_5_2_religious_worship: needs_review
  general.bc_308_5_3_five_or_fewer: needs_review
  general.bc_308_5_4_dwelling_unit: needs_review
  general.bc_508_2_1_classification: needs_review
  general.bc_508_2_2_height: needs_review
  general.bc_508_2_3_tabular_values: needs_review
  general.bc_508_2_4_separation: needs_review
  general.bc_table_1006_2_1_other_occupancies: not_applicable
  general.bc_1006_3_4_1_mixed_occupancies: not_applicable
  general.bc_table_1006_3_4_2__other_occupancies: not_applicable
  general.bc_1007_1_2_three_or_more_exits: needs_review
  general.bc_1007_1_3_exit_access_stairways: needs_review
  general.bc_1007_1_3_1_three_or_more_stairways: needs_review
  general.bc_1016_2_other_occupancies: not_applicable
  general.bc_1016_2_1_multiple_tenants: needs_review
  general.bc_table_1017_2_other_occupancies: not_applicable
  general.bc_table_1017_2_note_a: needs_review          # note a's other sections: special_egress_spaces not stated
  # 1006.2.2's rooms by use (review round 1): special_egress_spaces not stated, so each shows
  general.bc_1006_2_2_1_boiler_rooms: needs_review
  general.bc_1006_2_2_2_refrigeration_machinery_rooms: needs_review
  general.bc_1006_2_2_3_refrigerated_rooms: needs_review
  general.bc_1006_2_2_4_electrical_rooms: needs_review
  general.bc_1006_2_2_5_vehicular_ramps: needs_review
  general.bc_1006_2_2_6_r3_r4_nfpa_13d: not_applicable     # Group R-2, no NFPA 13D system
  general.bc_407_4_2_sleeping_room_travel: not_applicable  # not Group I-2
  general.bc_1018_4_merchandise_pads: not_applicable       # not Group M
  general.bc_1004_7_outdoor_areas: needs_review           # outdoor areas the occupants use: not stated
  general.bc_1004_9_posting: not_applicable                # not an assembly occupancy
  general.bc_1030_8_fixed_seating_common_path: needs_review     # fixed seating not stated (any group: round 2)
  general.bc_table_1017_2_note_d_group_h: not_applicable
  general.bc_1017_2_1_balcony_increase: needs_review
  general.bc_1017_2_2_f1_s1_increase: not_applicable
  general.bc_1017_2_3_h5_increase: not_applicable
  general.bc_1017_3_2_3_atrium: needs_review
  general.bc_1020_5_other_occupancies: not_applicable

# The section's state: does not comply (each apartment's one door, Table 1006.2.1's R-2 row, 2026-11-23); before,
# needs review (never complies while occupant loads aren't read and the flags stand)
state: does_not_comply
