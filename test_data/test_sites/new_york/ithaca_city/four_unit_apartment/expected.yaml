  general.bc_1005_4_continuity: needs_review
  general.bc_1005_5_distribution: needs_review
  general.bc_1005_6_convergence: needs_review
  # section group 5c: 1005.7's encroachments are flags (doors' swings and projections aren't drawn)
  general.bc_1005_7_1_door_encroachment: needs_review
  general.bc_1005_7_2_projections: needs_review
  general.bc_1005_7_3_protruding_objects: needs_review
  # section group 6a: 1010.1.1's door size for every door (ten: four a story, and the two stairs' outside doors on Level
