what: 'Queue item 12, light run: one real, ordinary City of Ithaca residential lot per district, each looked up
  through site_lookup on 2026-10-27 and worked by hand from the law (not from Gordium''s code). Lane C runs each
  in Rhino (apps/rhino_plugin/tests/light_run_in_rhino.py) and compares with these expected results.'
how_picked: 'City tax parcels (live) with PrimaryZone = the district, a one- or two-family residence, no historic
  flag, flood zone, overlay or second zone, lot 1.15–2.5× the district''s minimum, outside the Southside rezoning
  area; then site_lookup run on each: the first with four (or near four) corners and every fact ''suggested'' (none
  needs review). RU has no ordinary one-family lot outside a historic district: 614 University Ave (an apartment
  house, not historic) is the closest.'
independent: Areas, lengths and the yard envelope worked from the tax-map corners with the law's own numbers (point-to-line
  distances, shoelace areas); the 2 ft tax-map margin and the worst-case lot (every line 2 ft in) are Ben's tax-map
  rule (2026-10-21), applied the same way.
tax_map_rule: 'The lots are from the tax map (±2 ft per lot line). Gordium''s rule for that (Ben, 2026-10-21; spec
  C2): a measurement complies only if it does at the worst case (lot width 2 ft less; lot area with every line 2
  ft in), and the starting house keeps 2 ft back from every limit and under coverage at the worst-case area.'
