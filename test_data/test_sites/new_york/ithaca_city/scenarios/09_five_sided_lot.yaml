title: A lot with five sides
what: >-
  A surveyed lot whose back comes to a point: two straight side lines 110 ft long, then two short lines meeting
  15 ft further back. The code defines the rear yard to "the rear lot line" and takes the rear-yard percentage of
  "the average of the two side lot lines", but doesn't say which line is the rear lot line when the back is two
  lines. So the rear yard needs review. The side yards are 15 ft to the straight sides under any reading and
  comply.
lot: {points: [[0, 0], [60, 0], [60, 110], [30, 125], [0, 110]], surveyed: true}
buildings:
  - id: house
    outline: [[15, 30], [45, 30], [45, 80], [15, 80]]
    base: 0
    floors: [10, 10]
grade: {elevation: 0}
expected:
  R-1b.rear_yard:
    status: needs_review
    working: >-
      Reading 1 (both short lines are the rear lot line): depth = average of the side lines (110 + 110) / 2 = 110,
      required max(min(27.5, 50), 20) = 27.5 ft; least distance from the rear wall (y = 80) to the rear lines is to
      the corner (60, 110): √(15² + 30²) = 33.5 ft ✓. Other readings (one short line a side line) change both the
      depth and the distance. Which reading the code means isn't stated: an open question for the architects.
    cites: "§325-3 REAR YARD; §325-8A, p.25 (rear-yard % of the average of the two side lot lines); definitions.yaml lot_depth open question (more than two side lot lines)"
  R-1b.side_yards:
    status: complies
    working: "west 15 ft, east 60 − 45 = 15 ft to the straight side lines; the short back lines are ≥ 33 ft away, so ≥ 10 ft under every reading"
    cites: "§325-8 chart, R-1b, Side"
  R-1b.front_yard: {status: complies, working: "30 ≥ 25", cites: "§325-8 chart, R-1b, Front"}
  R-1b.lot_area_one_family_detached: {status: complies, working: "60 × 110 + ½ × 60 × 15 = 6,600 + 450 = 7,050 sf ≥ 6,000", cites: "§325-8 chart, R-1b, Lot area"}
  R-1b.lot_width_one_family_detached: {status: complies, working: "60 ft at the street ≥ 50", cites: "§325-8 chart, R-1b, Lot width"}
  R-1b.lot_coverage: {status: complies, working: "30 × 50 = 1,500 ≤ 25% × 7,050 = 1,762.5 sf", cites: "§325-8 chart, R-1b, Percent of lot area"}
  R-1b.height: {status: complies, working: "20 ≤ 35", cites: "§325-8 chart, R-1b, Height"}
  R-1b.stories: {status: complies, working: "2 ≤ 3", cites: "§325-8 chart, R-1b, Number of stories"}
# added after running Gordium (the expected results above are as written before it ran, commit 6d28ce0)
disagreements:
  R-1b.height:
    gordium: needs_review
    direction: gordium_more_cautious
    finding: >-
      2026-10-21. The height rule (R-1b.height) carries the §325-16C bonus, which names the rear yard and the lot
      depth; the checker reads every part of a rule, so the lot depth's readings (110 or 126.77 ft: which back line
      is a side lot line) carry over to it, although the house is 20 ft (≤ 35 ft under every reading). By design
      (the rule's notes); not a false pass.
    question_for_architects: "None beyond the rear lot line question: once that is settled, the height row follows it."
fixed:
  R-1b.rear_yard: >-
    Until 2026-10-21 Gordium read both short back lines only as the rear lot line (each runs 26.6° from the
    street, within the 30° it then read as "about parallel") and said complies: depth (110 + 110) / 2 = 110 ft,
    27'-6" required, the house 33'-6 3/8" away. The eval-integrity audit (P1-2) showed the reading the hand-worked result
    worried about, one short line as part of a side lot line, was never evaluated: with the house 4 ft further back
    it is a false pass (29'-11 1/2" against 31'-8 5/16" under that reading: depth (110 + 143.54) / 2 = 126.77 ft).
    Fixed in code (model_measurement Lot.readings, review rounds 7-8): every reading the lot's geometry allows is
    measured (from each end of the street the side line runs on for one or more lines, the rear is what is left; no
    angle prunes a reading). Gordium now says needs review here, as the hand-worked result does (complies under
    each, but the readings are the open question); the moved case is pinned in
    packages/design_checker/tests/test_moved_and_crossing.py.
