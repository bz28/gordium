  R-1b.stories: {status: complies, working: "2 floor blocks = 2 stories ≤ 3", cites: "§325-8 chart, R-1b, Number of stories"}
  R-1b.height: {status: complies, working: "0 to 20 ft = 20 ft ≤ 35 ft", cites: "§325-3 HEIGHT OF BUILDING; §325-8 chart, Height"}
