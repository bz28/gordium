title: Rear yard 6 in. short
what: >-
  A two-story house on a 60 × 120 surveyed lot whose rear wall is half a foot into the 30 ft rear yard. Every
  other limit is met with room to spare. The rear yard does not comply, short by 0'-6"; nothing is rounded toward
  compliance, and only the half-foot strip inside the yard is red.
