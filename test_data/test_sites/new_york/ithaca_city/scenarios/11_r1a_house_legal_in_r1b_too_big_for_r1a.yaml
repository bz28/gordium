title: "R-1a: a house legal in R-1b, but 22% coverage where R-1a allows 20%"
what: >-
  A surveyed 80 ft × 130 ft lot in R-1a (10,400 sf, the minimum is 10,000 sf; 80 ft wide, the minimum is 75 ft)
  with a two-story, 24 ft flat-roofed house 52 ft wide and 44 ft deep, set 25 ft back from the street and 14 ft
  from each side line. Every yard complies. Its footprint, 2,288 sf, is 22% of the lot: within R-1b's 25% but over
  R-1a's 20% (2,080 sf). A drafter that reads R-1B's column for R-1a passes it; it must not comply.
district: R-1a
use: one_family_detached
lot: {points: [[0, 0], [80, 0], [80, 130], [0, 130]], surveyed: true}
buildings:
  - id: house
    outline: [[14, 25], [66, 25], [66, 69], [14, 69]]
    base: 0
    floors: [12, 12]
grade: {elevation: 0}
expected:
  R-1a.lot_area_one_family_detached:
    status: complies
    working: "lot area = 80 × 130 = 10,400 sf; required ≥ 10,000 sf (R-1b would need only 6,000)"
    cites: "§325-8 chart p.3, R-1A, Minimum Lot Size, one-family dwelling, detached: 10,000 sf"
  R-1a.lot_width_one_family_detached:
    status: complies
    working: "lot width = frontage on the street = 80 ft; required ≥ 75 ft (§325-8A(7))"
    cites: "§325-8 chart p.3, R-1A, Minimum Lot Width, one-family dwelling, detached: 75 ft"
  R-1a.lot_coverage:
    status: does_not_comply
    working: "footprint = 52 × 44 = 2,288 sf; allowed 20% × 10,400 = 2,080 sf; over by 208 sf (22%)"
    cites: "§325-8 chart p.3, R-1A, Percent of lot area: 20%; §325-8A(10)"
    measured: {building_area: 2288.0}
  R-1a.front_yard:
    status: complies
    at_limit: true
    working: "street line y = 0 to the front wall at y = 25: 25 ft; required 25 ft"
    cites: "§325-8 chart p.3, R-1A, Front (minimum): 25 ft"
  R-1a.side_yards:
    status: complies
    working: "west 14 − 0 = 14 ft; east 80 − 66 = 14 ft; each required 10 ft"
    cites: "§325-8 chart p.3, R-1A, Side (one side / other side minimum): 10 ft, 10 ft"
  R-1a.rear_yard:
    status: complies
    working: "rear line y = 130 to the rear wall at y = 69: 61 ft; required max(min(25% × 130, 50), 20) = 32.5 ft"
    cites: "§325-8 chart p.3, R-1A, Rear 25%/50 ft, note 16 (not less than 20 ft); §325-8A(14)"
  R-1a.height:
    status: complies
    working: "flat roof at 12 + 12 = 24 ft above the flat grade; limit 35 ft (no bonus needed)"
    cites: "§325-3 HEIGHT OF BUILDING; §325-8 chart p.3, R-1A, Height in feet: 35 ft; §325-16C"
  R-1a.stories:
    status: complies
    working: "2 floor blocks, each one story = 2; limit 3"
    cites: "§325-8 chart p.3, R-1A, Number of stories: 3"
plan:
  encroach: 0
