title: "B-1b: a two-story office building one foot under B-1b's 25 ft minimum height"
what: >-
  A surveyed 50 ft × 100 ft lot in B-1b (Restricted Business; 5,000 sf) with a two-story professional office
  building 40 ft wide and 50 ft deep: two 12 ft stories to a 24 ft flat roof, 5 ft from the street, 5 ft from each
  side line, 45 ft from the rear. B-1b sets a minimum as well as a maximum height: at least 2 stories (chart p.5,
  §325-16G) and at least 25 ft (chart p.5, §325-8A(15)); the footprint, 2,000 sf, is over note 6's 500 sf, so the
  minimum applies. Two stories meet the story minimum; 24 ft is 1 ft short of 25 ft: does not comply. Everything
  else is inside B-1b's limits (5 ft front yard, 5 ft side yards, rear 10% of the depth but at least 10 ft, 90%
  coverage, 6 stories and 50 ft). An office isn't permitted in R-1b at all.
district: B-1b
use: business_or_professional_office
lot: {points: [[0, 0], [50, 0], [50, 100], [0, 100]], surveyed: true}
buildings:
  - id: office
    outline: [[5, 5], [45, 5], [45, 55], [5, 55]]
    base: 0
    floors: [12, 12]
grade: {elevation: 0}
