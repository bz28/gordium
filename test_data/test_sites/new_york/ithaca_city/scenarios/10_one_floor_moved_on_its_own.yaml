title: One floor moved on its own
what: >-
  A three-story house drawn as three floor blocks, and the second floor gets dragged 3 ft east by itself. It
  still stands outside the side yard (12 ft from the east line), but the floors no longer stack: Gordium can't be
  sure the blocks are still one story each, so Stories needs review with "Floors misaligned" (spec B4). By the code
  the yards are measured "from the ground upward" to the nearest part of the building, so the overhang counts:
  12 ft ≥ 10 ft still complies, and the 3 ft overhang adds to the lot coverage.
lot: {points: [[0, 0], [60, 0], [60, 120], [0, 120]], surveyed: true}
buildings:
  - id: house
    outline: [[15, 30], [45, 30], [45, 70], [15, 70]]
    base: 0
    floors: [10, 10, 10]
    move_floor: {floor: 2, by: [3, 0]}
grade: {elevation: 0}
expected:
  R-1b.stories:
    status: needs_review
    reason_has: "floors misaligned"
    working: "floor 2 sticks out 3 ft past floor 1: not a clean stack of floor blocks (spec B4)"
    cites: "§325-3 STORY; spec B4"
  R-1b.side_yards:
    status: complies
    working: >-
      REAR/SIDE YARD is open "from the ground upward": east yard to the overhang 60 − 48 = 12 ft ≥ 10; west 15 ft.
    cites: "§325-3 yard definitions (\"unoccupied and unobstructed ... from the ground upward\"); §325-8 chart, R-1b, Side"
  R-1b.lot_coverage:
    status: complies
    working: "footprint seen from above: 30 × 40 + 3 × 40 = 1,320 sf ≤ 1,800 sf (the overhang counts, §325-8A p.25)"
    cites: "§325-8A, p.25 (area covered by buildings above ground); §325-8 chart, R-1b, Percent of lot area"
  R-1b.height: {status: complies, working: "0 to 30 ft = 30 ≤ 35", cites: "§325-8 chart, R-1b, Height"}
  R-1b.front_yard: {status: complies, working: "30 ≥ 25", cites: "§325-8 chart, R-1b, Front"}
  R-1b.rear_yard: {status: complies, working: "50 ≥ 30", cites: "§325-8 chart, R-1b, Rear"}
