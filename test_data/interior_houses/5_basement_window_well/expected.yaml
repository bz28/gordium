# Hand-derived before the code ran on this house (inches; areas in sq ft).
parts:
  sleeping_room:
    bbed:
      measures:
        sleeping_room_floor_area: 110.0     # 132 x 120 / 144; ceiling 90 in
  emergency_escape_opening:
    we1:
      within: bbed
      measures:
        opening_net_clear_width: 28.5       # 30 - 1.5
        opening_net_clear_height: 36.0
        opening_net_clear_area: 7.125       # 28.5 x 36 = 1026 / 144
        opening_sill_height: 36.0           # -60 - (-96)
        opening_is_door: false   # its operation names a window
      not_measured: [opening_at_grade, opening_door_hinged_or_sliding]      # in an area well: 6 in above the well floor (yes) but 60 in below the ground (no)
      more:
        area_well_area: 10.0                # 40 x 36 = 1440 / 144
        area_well_width: 40.0
        area_well_projection: 36.0
        area_well_depth: 66.0               # ground 0 - well floor -66
    we2:
      within: bbed
      measures:
        opening_net_clear_width: 24.0
        opening_net_clear_height: 20.0
        opening_net_clear_area: 3.333333    # 24 x 20 = 480 / 144
        opening_sill_height: 46.0           # -50 - (-96)
        opening_at_grade: true              # |-50 - (-40)| = 10
        opening_is_door: false   # its operation names a window
      not_measured: [opening_door_hinged_or_sliding]   # a window: asked only of a door
  stair:
    bs:
      measures:
        stair_riser_height: 8.0
        stair_spiral: false                 # straight, rectangular treads: not R202's spiral
        stair_riser_variation: 0.0          # every riser the same
        stair_tread_depth: 10.0
        stair_headroom: 76.0                # main floor's edge at s = 2.5: -10 - (-88 + 0.8 x 2.5) = 76
        stair_clear_width: 36.0
        stair_clear_width_at_handrail: 36.0 # no handrails: wall to wall
        stair_handrail_sides: 0
      more:
        stair_tread_variation: 0.0
        stair_clear_width_at_handrail: 36.0 # no handrails: wall to wall
        stair_handrail_sides: 0
        stair_total_rise: 96.0
        stair_risers: 12
  egress_door:
    de:
      measures:
        door_clear_height: 80.0
        door_side_hinged: false   # operation: not side_hinged
      not_measured: [door_clear_width]      # R318.2 measures a side-hinged door open 90 degrees; this one slides
  guard: {}
