# A made-up walk-out basement (not a real house): a basement bedroom with an escape window in an area well, and a
# small awning window whose maker's clear opening is given; a basement stair whose headroom is cut by the floor
# above; a sliding patio door as the exit door.
format: gordium.interior/1
units: in
rooms:
  - id: bbed
    name: Basement bedroom
    sleeping: true
    floor: [[0, 0], [132, 0], [132, 120], [0, 120]]
    floor_elevation: -96
    ceiling_height: 90
openings:
  - id: we1
    name: Window 1
    room: bbed
    escape: true
    operation: casement
    frame: {left: 0, right: 30, bottom: -60, top: -24}
    hinged: {side: left, open_angle: 90, sash_width: 30, sash_thickness: 1.5}
    ground_outside: 0
    area_well: {floor_elevation: -66, width: 40, projection: 36}
  - id: we2
    name: Window 2
    room: bbed
    escape: true
    operation: awning
    stated_clear: {width: 24, height: 20, bottom: -50, source: "maker's data sheet (made up)"}
    ground_outside: -40
stairs:
  - id: bs
    name: Basement stair
    bottom_elevation: -96
    nosings:
      - [[0, 0, -88], [0, 36, -88]]
      - [[10, 0, -80], [10, 36, -80]]
      - [[20, 0, -72], [20, 36, -72]]
      - [[30, 0, -64], [30, 36, -64]]
      - [[40, 0, -56], [40, 36, -56]]
      - [[50, 0, -48], [50, 36, -48]]
      - [[60, 0, -40], [60, 36, -40]]
      - [[70, 0, -32], [70, 36, -32]]
      - [[80, 0, -24], [80, 36, -24]]
      - [[90, 0, -16], [90, 36, -16]]
      - [[100, 0, -8], [100, 36, -8]]
      - [[110, 0, 0], [110, 36, 0]]
    sides:
      left: [[-12, 36], [130, 36]]
      right: [[-12, 0], [130, 0]]
    handrails: []
    overhead:
      - [[-12, -4, -10], [2.5, -4, -10], [2.5, 40, -10], [-12, 40, -10]]   # the main floor's underside
      - [[2.5, -4, 86], [130, -4, 86], [130, 40, 86], [2.5, 40, 86]]       # the ceiling above the stair opening
doors:
  - id: de
    name: Patio door
    exit: true
    operation: sliding
    threshold_top: 0
    head_stop_bottom: 80
guards: []
