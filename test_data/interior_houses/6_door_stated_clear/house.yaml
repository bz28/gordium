# A made-up one-room cottage (not a real house): its side-hinged exit door is drawn AND carries the maker's
# stated clear opening, so the less favourable of the two counts for each measure (decision 2,
# docs/revit/revit_interior_reading_design.md section 8). The width: the maker's is the smaller (it wins). The
# height: the drawn one is the smaller (it wins). Inches.
format: gordium.interior/1
units: in
rooms:
  - id: liv
    name: Living room
    sleeping: false
    floor: [[0, 0], [180, 0], [180, 144], [0, 144]]
    floor_elevation: 0
    ceiling_height: 96
openings: []
stairs: []
doors:
  - id: d1
    name: Front door
    exit: true
    operation: side_hinged
    hinge_side: left
    stops: {hinge: 0, latch: 35.75}
    hinge_pin: [0, 1.75]                     # u along the wall, n toward the side it swings into
    leaf_closed: [[0, 0], [36.5, 1.75]]      # two opposite corners of the leaf, closed (1 3/4 in thick)
    threshold_top: 0.75
    head_stop_bottom: 80
    stated_clear:
      width: 33.5
      height: 79.5
      source: "maker's catalogue (made up): 3-0 x 6-8 prehung entry door, clear opening 33 1/2 x 79 1/2 in"
guards: []
