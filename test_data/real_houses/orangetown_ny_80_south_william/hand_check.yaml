# The full egress check on this house, worked by hand for EVERY rule in the New York State rulebook
# (regulations/jurisdictions/new_york/new_york_state/5_building_code_rules/drafted/general.yaml, 115 rules),
# BEFORE the checker was run on the house (this file is committed on its own, ahead of the checker's results).
#
# Two answers per rule, kept apart on purpose:
#   truth      what the 2025 Residential Code of New York State says about this house AS DRAWN, from the code text and
#              the drawings, whatever Gordium can read. One of: complies, does_not_comply, needs_review,
#              not_applicable. Most rest on answer_key.yaml (worked in PR #97, before any checker existed): `area`
#              names its entry. A rule about several parts (four bedrooms, every flight) takes the most cautious.
#   predicted  what the checker SHOULD say, given house.yaml as written (what the description can carry, what the
#              measuring code reads: docs/interior/interior_measurements.md and expected.yaml) and the rule's own
#              formulas. One of the checker's answers: pass, fail, needs_review, not_applicable.
# Where predicted and the checker's answer differ, the checker (or the prediction) is wrong. Where predicted and
# truth differ, the difference is what the description or the rulebook can't yet carry (evaluation.md says which).
# The one thing that must never happen: the checker says pass where truth isn't complies (a false pass).
#
# Building values given to the check: dwelling_units 1 (A-1 project data table, use "SINGLE-FAMILY DWELLING").
# Zoning: this lot is in the Town of Orangetown, not the City of Ithaca, so no zoning rulebook applies to it; only the
# state code (egress) is checked.
#
# Parts of the house the truth is worked over (sheets A-1 to A-5, see README.md):
#   bedrooms: master, bed2, bed3, bed4 (second floor); their 10 marked escape windows (m1-m4, b2a-b4b)
#   other marked escape windows: bonus room x1, x2; basement bsw1, bsw2 (CW14 in areaways)
#   flights: main stair, basement stair, the two one-riser steps onto the bridge, the step down at the mudroom door
#   onto the garage landing (A-2 'DN' at the door; its height isn't given), the garage steps, the porch steps, and
#   the steps down from each rear slider to the patio (A-2 'DN' at each '60611 SL DR'; A-2 basement plan 'CHEEK
#   WALLS FOR STEPS ABOVE'; A-4 'CONC. PAVER STONE STEPS'; no landing drawn at the door; main floor 240.4' (A-2)
#   over rear grade 238.2' (A-4) is 26.4 in, so at least four risers at 8 1/4 in)
#   exit door: the front door; other exterior doors: two rear sliders ('60611 SL DR', A-2) onto the PATIO, the
#   garage's side door ('2'-8"x6'-8"', A-2 east wall) and its overhead door (A-4); the mudroom door into the garage
#   is interior to the building
#   guards: the second-floor railings g_hall, g_bridge_n, g_bridge_s, g_east, the stair guard g_stair_w, and the
#   garage landing's railing ('RAILING AS PER RES. CODE', A-2, no height)
#   elevations disagree: A-2 spot elevations put the garage slab (237.8') 31.2 in below the main floor (240.4'); A-4
#   gives 'GAR SLAB' to 'CLG' 10'-3" against the main floor's 9'-0", about 15 in if the ceilings line up
#   none drawn: sleeping lofts, ramps, alternating tread devices, ship's ladders, spiral stairs, patio covers, an
#   addition (this is a new house). The attic is unfinished roof space over insulated ceiling joists (A-5 section,
#   'ATTIC'), reached by a pull-down attic stair (A-3 'ATTIC STAIR DETAILS'): not a habitable attic (R202: "A
#   finished or unfinished habitable space within an attic"; HABITABLE SPACE: "for living, sleeping, eating or
#   cooking", storage is not) and its folding ladder is attic access, not a stairway serving an occupied floor
#   (Gordium's reading, stated).
#
# Corrected after the run, by review round 1 (cold reviewer, two sceptics each; the first commit has the originals):
#   r319_4_1_area_well_min_projection     complies -> needs_review (the 36 in is to the well's outside, with the
#                                          ladder inside it; which window and well are built isn't settled)
#   r318_7_6_stair_top_landing            complies -> needs_review (the rear slider steps were missed: no landing
#                                          drawn at the door, and the floor's 26.4 in above grade needs at least 4 risers, more than the
#                                          two-riser exception allows)
#   r318_7_6_deck_stair_bottom_landing_width  not_applicable -> needs_review (the same rear steps serve the patio)
# and by review round 2:
#   r318_7_6_garage_top_landing_drop      not_applicable -> needs_review (a step down at the mudroom door onto the
#                                          garage landing, height not given: R318.7.6 Exception 2's 8 1/4 in)
#   r321_1_2_guard_height_open_side_not_stair  complies -> needs_review (the garage landing's railing has no height,
#                                          and its drop may be over 30 in)
#   r319_4_2_2_area_well_steps_requirements  not_applicable -> needs_review (rests on the A-5 well detail, which may
#                                          not be what is built at the CW14s)
# and by review round 4:
#   r318_7_6_stair_bottom_landing         complies -> needs_review (the porch steps end on bare grade)

