[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gordium"
version = "0.1.0"
requires-python = ">=3.12"
# pdfplumber and pdfminer.six are pinned exactly: a different version could extract text differently.
dependencies = ["pyyaml>=6", "pdfplumber==0.11.10", "pdfminer.six==20260107"]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl==3.1.5",   # openpyxl reads the architects' spreadsheets and writes the rules workbook
       "rhino3dm==8.35.0"]               # reads the architects' Rhino models in tests, without Rhino
# Only for writing the rules workbook outside the dev setup.
export = ["openpyxl==3.1.5"]
# Only for running the AI labeling script on your own machine (never in CI; tests use a fake client).
labeling = ["anthropic==1.15.0"]

[tool.setuptools.packages.find]
where = ["packages/rule_format", "packages/document_extraction", "packages/section_labeling", "packages/rule_export",
         "packages/project_report"]
include = ["rule_format*", "document_extraction*", "section_labeling*", "rule_export*", "project_report*"]

[tool.setuptools.package-data]
rule_format = ["*.yaml"]
section_labeling = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
